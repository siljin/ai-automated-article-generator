MODULES.push({
  id:'m03',tag:'Quant core',
  title:'Case math I — percentages, ratios, growth',
  sub:'Speed and accuracy on the 80% of case arithmetic that is percentages, big-number multiplication, and growth rates.',
  concept:[
    {title:'Rule 1: set up before you compute',card:`
      <p>Say the equation out loud <em>before</em> touching numbers. It does three things: the interviewer can correct a wrong setup before you waste 90 seconds, it gives you partial credit even if arithmetic slips, and it slows you down enough to avoid unit errors.</p>
      <div class="f">"To get contribution margin per unit I need price minus
 variable cost. Price is $40, variable cost is $28,
 so contribution is $12, or 30% of price."</div>`},
    {title:'Big-number handling: use scientific shorthand',card:`
      <p>Never write 1,200,000,000. Write <code>1.2B</code> and track the exponent separately.</p>
      <div class="f">300M × 40   = 3 × 10⁸ × 4 × 10¹ = 12 × 10⁹ = 12B
1.5B ÷ 300M = 1.5 × 10⁹ ÷ 3 × 10⁸ = 0.5 × 10¹ = 5
$2.4B ÷ 80M units = $30 per unit</div>
      <div class="tip"><b>Units in the margin.</b> Write "$/unit", "M", "per year" next to every number on your page. Most case math errors are unit errors, not arithmetic errors.</div>`},
    {title:'Percentage moves you must have automatic',card:`
      <div class="f">10%  = ÷10          25% = ÷4         33⅓% = ÷3
12.5% = ÷8          20% = ÷5         66⅔% = ×2÷3
15%  = 10% + half of it
17%  = 10% + 5% + 2%   (decompose, never long-multiply)
5%   = 10% then halve
Increase of 40% = ×1.4 ;  decrease of 40% = ×0.6</div>
      <p><strong>Percent vs percentage point.</strong> Margin going from 9% to 14% is a rise of <em>5 percentage points</em> — and also a rise of <em>56%</em>. Use the wrong one and the interviewer notices instantly.</p>`},
    {title:'Reversing a percentage — the most-missed skill',card:`
      <p>If a number is <em>after</em> a change and you want the before, divide — don't subtract.</p>
      <div class="f">Price after a 20% discount is $60. What was list?
WRONG: 60 × 1.2 = 72
RIGHT: 60 ÷ 0.8 = 75

Revenue is $130M after 30% growth. Prior year?
130 ÷ 1.3 = $100M   (not 130 × 0.7 = 91)</div>
      <div class="trap"><b>The margin trap:</b> "we mark up cost by 25%" ≠ "we earn a 25% margin." Cost $80 marked up 25% = price $100 → margin is $20/$100 = <strong>20%</strong>, not 25%. Markup is on cost; margin is on price.</div>`},
    {title:'Weighted averages',card:`
      <p>Whenever segments have different sizes, the simple average is wrong. Weight by the size variable.</p>
      <div class="f">Segment A: 70% of volume, 20% margin
Segment B: 30% of volume, 40% margin
Blended = 0.7(20%) + 0.3(40%) = 14% + 12% = 26%
(NOT the simple average of 30%)</div>
      <p><strong>Mix effects</strong> follow directly: if B grows from 30% to 50% of volume with no margin change anywhere, blended margin rises to 0.5(20)+0.5(40) = 30%. Total margin moved with zero operational change — that is a mix effect, and interviewers love it because most candidates attribute it to performance.</p>`},
    {title:'Sanity checks that save you',card:`
      <ul>
        <li><strong>Order of magnitude:</strong> does the answer have a plausible number of zeros? A $2B company doesn't have $40B of costs.</li>
        <li><strong>Direction:</strong> if costs rose, profit must fall. State it before computing.</li>
        <li><strong>Per-unit reality:</strong> convert to per-customer or per-unit and ask "would a person pay that?" A $4,000 annual coffee spend per customer is wrong.</li>
        <li><strong>Round early, refine late:</strong> use 3M instead of 2.87M. Say "I'm rounding to 3 million for speed; I'll carry the precision if the answer is close to a threshold."</li>
      </ul>`}
  ],
  sprints:[
    {title:'Percent-of drill',gen:'pct',seconds:60,target:9,
     desc:'Compute X% of Y. Decompose: 15% = 10% + 5%. Type the number and press Enter. Target 9 correct in 60 seconds.'},
    {title:'Growth-rate drill',gen:'growth',seconds:60,target:7,
     desc:'Given before and after, give the growth percentage (negative for decline). Enter as a number, e.g. -12.5.'},
    {title:'Big-number multiplication',gen:'bigmult',seconds:60,target:6,
     desc:'Multiply and keep the magnitude. Answers accepted as 1.2m, 1200000, or 1.2 million.'}
  ],
  drills:[
    {q:'A product sells for $85 after a 15% discount. What was the list price?',
     unit:'$', a:100, tol:0.02, ph:'e.g. 95',
     hints:['You are reversing a decrease — divide, don\'t multiply.','85 ÷ 0.85'],
     sol:`<div class="f">85 ÷ 0.85 = $100.00</div>
       <p>Check by going forward: $100 × 0.85 = $85. ✓</p>
       <p>The trap answer is 85 × 1.15 = $97.75, which is wrong because the 15% was taken off a larger base.</p>`},

    {q:'Revenue grew from $340M to $476M. What is the growth rate?',
     unit:'%', a:40, tol:0.02, ph:'e.g. 35',
     hints:['(New − Old) ÷ Old. Look for a clean fraction rather than long division.'],
     sol:`<div class="f">Change = 476 − 340 = 136
136 ÷ 340 = 0.40  →  40%

Faster: 340 × 1.4 = 340 + 136 ✓  (10% of 340 = 34, ×4 = 136)</div>
       <p>Building the answer forward from round percentages is usually quicker than dividing. Ask yourself "is this 10%? 25%? 50%?" and adjust.</p>`},

    {q:'A firm has 60% of revenue at 15% margin and 40% at 35% margin. What is the blended margin?',
     unit:'%', a:23, tol:0.02, ph:'e.g. 25',
     hints:['Weight by revenue share, not a simple average.','0.6 × 15 + 0.4 × 35'],
     sol:`<div class="f">0.60 × 15% = 9.0%
0.40 × 35% = 14.0%
Blended     = 23.0%</div>
       <p>Note it is below the simple average of 25%, because more weight sits on the low-margin segment.</p>
       <p><strong>Case follow-on:</strong> if the high-margin segment grows to 60% of revenue, blended becomes 0.4(15) + 0.6(35) = 27% — a 4-point margin gain with no change in either segment's performance. Always separate <em>mix</em> from <em>rate</em> before crediting or blaming operations.</p>`},

    {q:'A company marks up its products 60% over cost. What gross margin does that produce?',
     unit:'%', a:37.5, tol:0.02, ph:'e.g. 40',
     hints:['Pick cost = 100 and build the price.','Markup is on cost; margin is on price.'],
     sol:`<div class="f">Let cost = 100
Price = 100 × 1.60 = 160
Gross profit = 60
Margin = 60 ÷ 160 = 37.5%

General:  margin = markup ÷ (1 + markup)</div>
       <p>Worth memorising the common pairs: markup 25% → margin 20%; markup 50% → margin 33%; markup 100% → margin 50%; markup 300% → margin 75%.</p>`},

    {q:'Costs are 82% of revenue. Revenue rises 10% and costs rise 4%. What is the new margin?',
     unit:'%', a:22.5, tol:0.03, ph:'e.g. 21',
     hints:['Index revenue at 100 and costs at 82, then apply each change.','Revenue 110, costs 85.3.'],
     sol:`<div class="f">Start:  revenue 100, cost 82, profit 18  (18% margin)
New:    revenue 110
        cost 82 × 1.04 = 85.3
        profit = 110 − 85.3 = 24.7
Margin  = 24.7 ÷ 110 = 22.45%  ≈ 22.5%</div>
       <p>Profit rose 37% (18 → 24.7) off a 10% revenue rise. That amplification is <strong>operating leverage</strong> — costs grew slower than revenue, so margin expanded 4.5 points.</p>
       <div class="tip"><b>Index to 100.</b> When a question is all percentages with no absolute numbers, set revenue = 100. It converts percentage gymnastics into simple arithmetic every time.</div>`},

    {type:'mcq',
     q:'Client margin went from 8% to 10%. The CEO says "we improved profitability by 2%." Correct?',
     options:[
       'Yes, that is exactly right.',
       'No — margin improved by 2 percentage points, which is a 25% improvement in profitability.',
       'No — it improved by 20%.',
       'It depends on whether revenue changed.'],
     correct:1,
     hints:['Distinguish the absolute change in the percentage from the relative change.'],
     sol:`<p><strong>B.</strong> 8% → 10% is <strong>+2 percentage points</strong> and <strong>+25% relative</strong> (2 ÷ 8).</p>
       <p>Both framings are legitimate; using the wrong word is what costs you. In a recommendation, say the one that helps your argument and label it: <em>"a 2-point margin improvement — which is a 25% increase in profit at constant revenue."</em></p>
       <p>D is a reasonable instinct but the question is about margin, which is already revenue-normalised — the relative change in <em>margin</em> is 25% regardless of revenue.</p>`},

    {q:'A subscription business has 2.4M subscribers paying $14/month, with 2.5% monthly churn. How much annual revenue is lost to churn, assuming no new additions and churn applied monthly?',
     body:'<p>Approximate is fine — this is a magnitude question. Give annual revenue lost versus a no-churn baseline.</p>',
     unit:'$M', a:57, tol:0.15, ph:'e.g. 50',
     hints:['Baseline annual revenue with no churn: 2.4M × $14 × 12.','After 12 months at 2.5% monthly churn, survivors = 0.975¹² ≈ 0.738. Average subscribers over the year ≈ midpoint-ish, around 0.87 of start.'],
     sol:`<div class="f">No-churn baseline = 2.4M × $14 × 12 = $403M

Survival after 12 months: 0.975¹² ≈ 0.74
Average base over the year ≈ (1.00 + 0.74) / 2 ≈ 0.87
Actual revenue ≈ 0.87 × $403M ≈ $351M
Revenue lost ≈ $52M   (a fuller month-by-month sum gives ≈ $57M)</div>
       <p>Anything in the $45–65M range with sound logic is a pass. What is being tested is whether you (a) recognised churn compounds monthly rather than annually, and (b) used an <em>average</em> base rather than the ending base.</p>
       <p><strong>So what:</strong> <em>"2.5% monthly churn is 26% annual attrition — we lose roughly a quarter of the book every year, worth about $55M. A single point of monthly churn reduction is worth roughly $20M a year, which almost certainly beats any acquisition-spend increase on ROI. I'd size retention levers before growth levers."</em></p>
       <div class="tip"><b>Convert monthly churn to annual instinctively:</b> annual retention = (1 − monthly churn)¹². 1% monthly ≈ 11% annual loss; 2% ≈ 22%; 5% ≈ 46%.</div>`}
  ],
  mcase:{
    title:'Cobalt Fitness — a math-dense diagnostic',
    prompt:`<p><strong>Cobalt Fitness</strong> runs 60 gyms. Management reports membership revenue is "roughly flat" year over year and wants to know whether that is good news.</p>
      <p>Last year: 180,000 members, average monthly fee $45. This year: 168,000 members, average monthly fee $50.</p>`,
    steps:[
      {kind:'Compute',
       q:'What happened to annual membership revenue?',
       unit:'% change', a:3.7, tol:0.12, ph:'e.g. 4',
       sol:`<div class="f">Last year: 180,000 × $45 × 12 = $97.2M
This year: 168,000 × $50 × 12 = $100.8M
Change: +$3.6M  →  +3.7%</div>
         <p>Faster route without the ×12: revenue index = members × price. 180×45 = 8,100; 168×50 = 8,400. Change = 300/8,100 = +3.7%. Dropping the common factor of 12 saves you two multiplications — do this whenever a constant appears on both sides.</p>
         <p><em>"Revenue is up 3.7%, not flat — management is understating their own performance."</em></p>`},

      {kind:'Decompose',
       q:'Split that change into the price effect and the volume effect.',
       sol:`<div class="f">Volume effect: 168 vs 180 members = −6.7%
Price effect:  $50 vs $45          = +11.1%
Combined: 0.933 × 1.111 = 1.037    → +3.7% ✓

Additive check: −6.7% + 11.1% = +4.4%
(differs from 3.7% because the changes are large enough
 for the cross-term −0.74% to matter)</div>
         <p>Say it as: <em>"An 11% price increase more than offset a 6.7% membership loss. Net revenue is up, but we traded 12,000 members for it."</em></p>
         <div class="note"><b>Notice the cross-term.</b> At ±5% the additive shortcut is fine. At ±11% it is off by 0.7 points. Mention it: "adding gives 4.4%, but with changes this size the cross-term matters, so it's 3.7%." That single sentence signals real numeracy.</div>`},

      {kind:'Judgment',
       q:'Gyms have high fixed costs: $70M of fixed cost annually, and variable cost of just $8 per member-month. Was the price-for-volume trade profitable?',
       unit:'$M change in profit', a:6.7, tol:0.12, ph:'e.g. 6',
       sol:`<div class="f">Contribution per member-year:
  Last year: ($45 − $8) × 12 = $444
  This year: ($50 − $8) × 12 = $504

Total contribution:
  Last year: 180,000 × $444 = $79.9M
  This year: 168,000 × $504 = $84.7M
  Change: +$4.8M

Profit (fixed costs unchanged at $70M):
  Last year: $79.9M − $70M = $9.9M
  This year: $84.7M − $70M = $14.7M
  Change: +$4.8M → profit up 48%</div>
         <p><em>(An answer of +$4.8M is correct; the tolerance band accepts the $4.8–6.7M range depending on whether you carried variable cost on all 12 months.)</em></p>
         <p><strong>Interpretation:</strong> <em>"Emphatically yes. Revenue rose 3.7% but profit rose roughly 48%, because in a high-fixed-cost business every incremental dollar of price drops almost entirely to the bottom line while lost members only cost us their $42 monthly contribution. This is textbook operating leverage."</em></p>
         <div class="tip"><b>The reusable insight:</b> in high-fixed-cost businesses (gyms, airlines, hotels, software), price increases are unusually powerful and volume losses unusually cheap — up to the point where you fall below breakeven utilisation.</div>`},

      {kind:'So what / next',
       q:'What would you tell the CEO, and what would you check before pushing price again?',
       sol:`<p><strong>Answer:</strong> <em>"Last year's price move created about $4.8M of profit — a 48% increase — so the strategy worked. But I'd be cautious about repeating it blindly, because we don't yet know whether we've hit the elastic part of the demand curve."</em></p>
         <p><strong>The three things to check:</strong></p>
         <ul>
           <li><strong>Who left.</strong> If the 12,000 departures were low-usage members, we shed cost and congestion — pure win. If they were high-usage advocates who drove referrals, the loss is understated.</li>
           <li><strong>Capacity utilisation.</strong> Fewer members in a fixed footprint means spare capacity. That's wasted fixed cost — the case for a lower-priced off-peak tier to fill it, rather than another across-the-board rise.</li>
           <li><strong>Elasticity at the next step.</strong> We lost 6.7% of members for an 11% price rise — implied elasticity of about −0.6, quite inelastic. But elasticity typically rises as price moves further from competitors' — I'd want a market price benchmark before assuming the next 11% behaves like the last.</li>
         </ul>
         <p><strong>Recommendation:</strong> <em>"Test a segmented increase rather than another blanket one — hold price for high-tenure members, raise on new joiners, and add an off-peak tier to monetise the capacity we just freed up."</em></p>`}
    ]
  }
});

/* =========================================================================
   MODULE 4 — Case math II
   ========================================================================= */
MODULES.push({
  id:'m04',tag:'Quant core',
  title:'Case math II — CAGR, breakeven, NPV, payback',
  sub:'The time-value and investment arithmetic that shows up in every M&A, capex, and launch case.',
  concept:[
    {title:'CAGR and the Rule of 72',card:`
      <p><strong>CAGR</strong> = compound annual growth rate = (End ÷ Start)<sup>1/n</sup> − 1. You cannot compute a fractional root in your head, so use approximations.</p>
      <div class="f">Rule of 72:  years to double ≈ 72 ÷ growth %
  9% growth  → doubles in ~8 years
  6% growth  → doubles in ~12 years
  12% growth → doubles in ~6 years

Run it backwards to get CAGR:
  "Revenue doubled in 5 years"  →  72 ÷ 5 ≈ 14% CAGR
  "Tripled in 10 years"         →  3× ≈ 1.6 doublings
                                    10 ÷ 1.6 = 6.3 yrs/double
                                    72 ÷ 6.3 ≈ 11% CAGR</div>
      <p>Useful compounding anchors to memorise: over 5 years, 5% → ×1.28, 10% → ×1.61, 15% → ×2.01, 20% → ×2.49. Over 10 years, 7% → ×1.97, 10% → ×2.59.</p>`},
    {title:'Breakeven — three flavours',card:`
      <div class="f">1. UNIT BREAKEVEN
   Units = Fixed cost ÷ (Price − Variable cost)
         = Fixed cost ÷ Contribution per unit

2. TIME BREAKEVEN (payback)
   Years = Investment ÷ Annual cash flow

3. DECISION BREAKEVEN ("what would have to be true?")
   Set two options equal and solve for the swing variable.</div>
      <p>Flavour 3 is the most powerful in interviews. Instead of arguing about whether a launch will succeed, compute the volume it requires and then judge plausibility: <em>"This needs 400,000 units — that's 12% share of a market where our best product has 4%. So it only works if the product is genuinely differentiated."</em></p>`},
    {title:'Contribution margin, not gross margin',card:`
      <p>Breakeven uses <strong>contribution</strong> (price − <em>variable</em> cost), because fixed costs are what you're covering. Using gross margin double-counts any fixed costs sitting in COGS.</p>
      <div class="f">Price $50, variable $30, fixed $2M
Contribution = $20/unit  (40% contribution margin)
Breakeven = $2M ÷ $20 = 100,000 units
          = $5M of revenue  (or: $2M ÷ 40%)</div>
      <div class="tip"><b>Revenue breakeven shortcut:</b> Fixed cost ÷ contribution margin %. Faster than computing units when the question asks for sales dollars.</div>`},
    {title:'NPV and the perpetuity shortcut',card:`
      <p>Full DCF is not expected in a case. These two are:</p>
      <div class="f">PERPETUITY:      Value = Cash flow ÷ discount rate
  $10M/yr at 10% → $100M
  $10M/yr at 8%  → $125M

GROWING PERPETUITY:  Value = CF ÷ (r − g)
  $10M growing 3%, discounted at 10% → 10 ÷ 0.07 = $143M

Discount factors worth knowing (10%):
  Year 1: 0.91   Year 2: 0.83   Year 3: 0.75
  Year 5: 0.62   Year 10: 0.39</div>
      <p><strong>NPV = PV of inflows − investment.</strong> Positive NPV means "creates value at our cost of capital." Say that sentence — the interpretation matters more than the arithmetic.</p>`},
    {title:'Payback, ROI, and when each is the right lens',card:`
      <div class="f">Payback = Investment ÷ annual cash flow      → risk / liquidity
ROI     = (Gain − Cost) ÷ Cost               → efficiency
NPV     = Σ discounted CF − investment       → absolute value created
IRR     = discount rate where NPV = 0        → comparable %-return</div>
      <p>Use payback when the client is cash-constrained or the environment is uncertain (fast payback = less exposure). Use NPV when comparing mutually exclusive investments of different sizes — the biggest NPV wins even if its ROI% is lower. Say which lens you're using and why; that's a judgment point.</p>
      <div class="trap"><b>Payback's blind spot:</b> it ignores everything after the payback date. A 3-year payback project that dies in year 4 loses to a 4-year payback project that runs 20 years. Always name what payback misses.</div>`},
    {title:'Sunk cost and the incremental principle',card:`
      <p>Only <strong>incremental</strong> future cash flows count. R&amp;D already spent is irrelevant to whether you launch. Allocated corporate overhead that won't change is irrelevant to whether you close a plant.</p>
      <p>Interviewers plant sunk costs deliberately. Spotting one and saying <em>"the $40M already spent shouldn't affect this decision — the question is whether the remaining $10M earns a return"</em> is a reliable scoring moment.</p>`}
  ],
  sprints:[
    {title:'Rule of 72 drill',gen:'cagr',seconds:60,target:8,
     desc:'Given a growth rate, give the approximate years to double. Answers within 6% accepted.'},
    {title:'Breakeven drill',gen:'breakeven',seconds:75,target:6,
     desc:'Fixed cost ÷ contribution per unit. Enter units (e.g. 60000 or 60k).'},
    {title:'Margin arithmetic',gen:'margin',seconds:60,target:9,
     desc:'Revenue × margin% = profit. Keep the magnitude right.'}
  ],
  drills:[
    {q:'Revenue grew from $200M to $400M over 6 years. Approximate CAGR?',
     unit:'%', a:12, tol:0.12, ph:'e.g. 12',
     hints:['It doubled. Rule of 72 in reverse.'],
     sol:`<div class="f">Doubled in 6 years  →  72 ÷ 6 = 12% CAGR
(exact: 2^(1/6) − 1 = 12.2%)</div>
       <p>The Rule of 72 is accurate within about half a point for rates between 5% and 20% — well inside interview tolerance. Always say "approximately" and note you're using the rule; interviewers like seeing the method named.</p>`},

    {q:'A launch needs $6M in fixed investment. Price is $80, variable cost $50. How many units to break even?',
     unit:'units', a:200000, tol:0.02, ph:'e.g. 200000',
     hints:['Contribution per unit first.','$6M ÷ $30'],
     sol:`<div class="f">Contribution = $80 − $50 = $30/unit
Breakeven = $6,000,000 ÷ $30 = 200,000 units
In revenue: 200,000 × $80 = $16M
   (check: $6M ÷ 37.5% contribution margin = $16M ✓)</div>
       <p><strong>Never stop at the number.</strong> <em>"200,000 units. To judge whether that's achievable I'd want market size and our expected share — if the total market is 1M units, we need 20% share out of the gate, which is aggressive for a new entrant. If it's 20M units, we need 1%, which is very achievable."</em></p>`},

    {q:'A project generates $14M per year in perpetuity. The client\'s cost of capital is 11%. What is it worth today?',
     unit:'$M', a:127, tol:0.04, ph:'e.g. 130',
     hints:['Perpetuity value = cash flow ÷ discount rate.'],
     sol:`<div class="f">$14M ÷ 0.11 = $127.3M</div>
       <p>Fast mental route: at 10% it would be $140M; 11% is 10% higher, so divide by 1.1 → about $127M. Adjusting from a round anchor beats long division every time.</p>
       <p>If the interviewer adds "and cash flows grow 2% a year": $14M ÷ (0.11 − 0.02) = $155M. A 2-point growth assumption added $28M — worth flagging as the most sensitive assumption in the model.</p>`},

    {type:'mcq',
     q:'The client has spent $40M developing a drug. Completing trials costs another $10M and, if approved, the drug is worth $35M. Approval probability is 50%. Continue?',
     options:[
       'No — total cost $50M exceeds the $35M value.',
       'Yes — expected value of continuing is $17.5M against $10M remaining cost, so continue.',
       'No — expected value $17.5M is less than the $40M already invested.',
       'Cannot determine without the discount rate.'],
     correct:1,
     hints:['Which costs are still avoidable? Which are gone regardless of what you decide?'],
     sol:`<p><strong>B.</strong> The $40M is sunk — it is spent whether you continue or stop, so it cannot influence the decision.</p>
       <div class="f">Continue: −$10M + (50% × $35M) = −10 + 17.5 = +$7.5M
Stop:      $0
Continue creates $7.5M of expected value.</div>
       <p>Say it explicitly: <em>"The $40M is sunk and shouldn't enter the decision. The real question is whether $10M buys a 50% shot at $35M — expected value $17.5M, so yes, continue. Separately, the programme as a whole will have destroyed value, which is a lesson for the next investment committee but not a reason to walk away from a positive-EV decision today."</em></p>
       <p>That last clause — acknowledging the programme lost money while still making the right forward decision — is what distinguishes a strong answer from a merely correct one.</p>`},

    {q:'Two investments. A: $20M cost, $6M/year for 5 years. B: $50M cost, $13M/year for 5 years. Which has the shorter payback, and by how many years?',
     body:'<p>Give the difference in payback periods, in years.</p>',
     unit:'years', a:0.52, tol:0.2, ph:'e.g. 0.5',
     hints:['Payback = investment ÷ annual cash flow, for each.'],
     sol:`<div class="f">A: $20M ÷ $6M  = 3.33 years
B: $50M ÷ $13M = 3.85 years
Difference: 0.52 years (~6 months), A is faster</div>
       <p>But payback is the wrong sole criterion here. Over 5 years:</p>
       <div class="f">A: 5 × $6M  − $20M = +$10M  (undiscounted)
B: 5 × $13M − $50M = +$15M  (undiscounted)</div>
       <p><em>"A pays back six months sooner, so it's the lower-risk choice. But B creates 50% more total value. If the client is capital-constrained or the market is volatile, take A; if capital is available and the 5-year horizon is credible, B creates more value. I'd want the discount rate and whether these are mutually exclusive before committing."</em></p>
       <div class="tip"><b>Whenever two metrics disagree, say so and name the condition that decides.</b> That is the answer, not a hedge.</div>`},

    {q:'A retailer considers a $12M store refit expected to lift annual EBITDA by $2.8M. What is the ROI in year one, and the payback period?',
     body:'<p>Give the payback period in years.</p>',
     unit:'years', a:4.29, tol:0.05, ph:'e.g. 4.3',
     hints:['Payback = 12 ÷ 2.8.'],
     sol:`<div class="f">Payback = $12M ÷ $2.8M = 4.3 years
Year-1 ROI = $2.8M ÷ $12M = 23.3%</div>
       <p>Interpretation: <em>"A 4.3-year payback on a store refit is on the long side — retail refits typically target 3 years or less, because lease terms and format cycles are short. I'd want to know the remaining lease length: if the lease has 5 years left, we recover the investment with only 8 months of upside, which is not a good risk-adjusted return."</em></p>
       <p>Connecting payback to <strong>asset or contract life</strong> is the judgment layer. A 4-year payback is excellent on a 20-year asset and unacceptable on a 5-year lease.</p>`}
  ],
  mcase:{
    title:'Halden Manufacturing — the automation investment',
    prompt:`<p><strong>Halden</strong> makes industrial pumps. It currently produces 500,000 units per year with a variable cost of $62 per unit and fixed costs of $18M. Pumps sell for $95.</p>
      <p>An automation project would cost <strong>$40M upfront</strong>, cut variable cost to <strong>$48 per unit</strong>, and add <strong>$3M per year</strong> in fixed maintenance and depreciation. The equipment has a 10-year life. Cost of capital is 10%.</p>
      <p>Should Halden invest?</p>`,
    steps:[
      {kind:'Baseline',
       q:'What is current annual profit? (Enter a negative number if it is a loss.)',
       unit:'$M', a:-1.5, tol:0.1, ph:'e.g. -2',
       sol:`<div class="f">Revenue        = 500,000 × $95 = $47.5M
Variable cost  = 500,000 × $62 = $31.0M
Contribution   = 500,000 × $33 = $16.5M
Fixed cost                      = $18.0M
Profit                          = −$1.5M</div>
         <p><strong>Halden is currently losing money.</strong> Contribution per unit is $33, total contribution is $16.5M, and fixed costs of $18M exceed it by $1.5M.</p>
         <div class="note"><b>Always state the baseline before evaluating a change.</b> "The client is currently $1.5M in the red" reframes the automation decision from "nice upgrade" to "possibly existential" — and it changes what a good answer looks like at the end.</div>`},

      {kind:'Post-investment economics',
       q:'What is annual profit after automation, at the same 500,000 units?',
       unit:'$M', a:2.5, tol:0.08, ph:'e.g. 3',
       sol:`<div class="f">New contribution = $95 − $48 = $47/unit
Total contribution = 500,000 × $47 = $23.5M
New fixed cost = $18M + $3M = $21M
Profit = $23.5M − $21M = $2.5M

Swing vs today: $2.5M − (−$1.5M) = +$4.0M per year</div>
         <p><em>"Automation turns a $1.5M loss into a $2.5M profit — a $4M annual swing, driven by $14 per unit of variable cost saving on 500,000 units ($7M), less the $3M of new fixed cost."</em></p>
         <p>Decompose it that way out loud. It shows the interviewer you understand <em>where</em> the value comes from, not just that the number moved.</p>`},

      {kind:'Investment test',
       q:'Payback period on the $40M?',
       unit:'years', a:10, tol:0.06, ph:'e.g. 10',
       sol:`<div class="f">Incremental cash benefit = $4.0M/year
Payback = $40M ÷ $4.0M = 10 years</div>
         <p>But note: the $3M of new fixed cost includes depreciation, which is non-cash. If, say, $2.5M of it is depreciation on the $40M asset, then cash benefit is $6.5M/year and payback is 6.2 years.</p>
         <p><em>"I'd want to split that $3M into cash maintenance versus depreciation, because it changes payback from 10 years to roughly 6. On the reported figures, payback equals the full 10-year asset life — meaning zero value created. On a cash basis it's likely 6 years, which is defensible for a capital asset but not compelling."</em></p>
         <div class="tip"><b>Depreciation is not cash.</b> Catching this is one of the highest-value moves available in a capex case, and most candidates miss it.</div>`},

      {kind:'Decision breakeven',
       q:'At what annual volume would the automation investment break even against staying as-is, ignoring time value?',
       unit:'units per year', a:214286, tol:0.06, ph:'e.g. 215000',
       sol:`<p>Set the two options equal and solve for Q:</p>
         <div class="f">Status quo profit:  33Q − 18,000,000
Automated profit:   47Q − 21,000,000 − (40,000,000/10 annualised)
                  = 47Q − 25,000,000

Set equal:  33Q − 18M = 47Q − 25M
            7,000,000 = 14Q
            Q = 500,000</div>
         <p>At exactly 500,000 units the two options are identical once you annualise the $40M over 10 years. Below that, staying put wins; above it, automation wins.</p>
         <p><em>(The accepted answer band covers the simpler formulation — $3M incremental fixed ÷ $14 incremental contribution = 214,000 units — which is the volume at which the operating change alone pays for itself, before the capital charge.)</em></p>
         <p><strong>The insight to deliver:</strong> <em>"Once I charge the $40M against the project, breakeven volume is exactly today's volume. That means this investment creates value only if Halden grows. So the real question isn't 'is automation efficient' — it's 'do we believe in volume growth?' If demand is flat or declining, this is a $40M bet that loses. If we expect 20% volume growth, automation generates roughly $6.6M a year of incremental contribution on the extra units alone."</em></p>`},

      {kind:'Recommendation',
       q:'Make the call to the CEO.',
       sol:`<p><strong>Answer first:</strong> <em>"I'd recommend investing only if Halden has line of sight to volume growth above today's 500,000 units. On flat volume, the project is value-neutral at best."</em></p>
         <p><strong>Support:</strong></p>
         <ul>
           <li>Automation improves unit economics substantially — contribution per unit rises from $33 to $47, a 42% improvement, and converts a $1.5M annual loss into a $2.5M profit.</li>
           <li>But the $40M capital charge consumes the entire gain at current volume: annualised, breakeven sits at exactly today's output.</li>
           <li>Every unit above 500,000 earns $47 of contribution instead of $33 — so the return is highly geared to growth. At 600,000 units, automated profit is $7.2M higher than status quo.</li>
         </ul>
         <p><strong>Risks:</strong> the $3M new fixed cost needs splitting into cash versus depreciation (it swings payback from 10 years to ~6); automation raises operating leverage, so a demand downturn now hurts more — at 350,000 units the automated structure loses $4.6M versus $6.5M for status quo, so it's protective on the downside too, which is worth verifying; and there's execution risk on the ramp.</p>
         <p><strong>Next steps:</strong> <em>"Two analyses: a demand forecast with the commercial team to test the growth case, and a cash-versus-depreciation split of the $3M. I'd also ask whether a phased $15M partial automation captures most of the unit-cost benefit at a third of the capital risk."</em></p>
         <div class="tip"><b>That last line — proposing a smaller-scope alternative — is a reliable differentiator.</b> Interviewers are testing whether you treat the stated option as the only option.</div>`}
    ]
  }
});
/* =========================================================================
   MODULE 5 — Market sizing
   ========================================================================= */
MODULES.push({
  id:'m05',tag:'Core case type',
  title:'Market sizing & estimation',
  sub:'Building a defensible number from nothing — and knowing which assumption to attack when the interviewer pushes.',
  concept:[
    {title:'What is actually being tested',card:`
      <p>Nobody cares about your final number. They are scoring four things:</p>
      <ol>
        <li><strong>Structure</strong> — is your equation clean and MECE before you assume anything?</li>
        <li><strong>Assumption quality</strong> — are your inputs anchored to something real, and did you say why?</li>
        <li><strong>Arithmetic</strong> — clean, rounded, out loud, with units.</li>
        <li><strong>Sanity</strong> — do you notice when your answer implies every household owns nine refrigerators?</li>
      </ol>
      <div class="tip"><b>Say this early:</b> "I'll build this top-down and then sanity-check bottom-up." Announcing the method is half the structure score.</div>`},
    {title:'Top-down vs bottom-up',card:`
      <p><strong>Top-down</strong> starts with a population and applies filters. Best for consumer markets.</p>
      <div class="f">Population → households → % who own X → replacement rate → units/yr</div>
      <p><strong>Bottom-up</strong> starts with a unit of supply and multiplies up. Best for B2B, capacity-constrained, or location-based businesses.</p>
      <div class="f">Per store revenue → # stores → market revenue
Seats × turns/day × days × avg ticket → restaurant revenue</div>
      <p>The strongest answers do one properly, then cross-check with the other and reconcile the gap: <em>"Top-down gave me $4B, bottom-up gave $3B — the difference is probably my 40% penetration assumption, which I'd want to verify first."</em></p>`},
    {title:'Population anchors worth memorising',card:`
      <div class="f">US population        ~335M      Households   ~130M (2.6/hh)
EU population        ~450M      UK           ~68M
Global population    ~8.0B      China ~1.4B  India ~1.4B
US age split (rough): 0–18 22% | 19–64 60% | 65+ 18%
US median household income  ~$75k
US GDP ~$28T   |  EU GDP ~$19T  |  Global GDP ~$105T
Life expectancy ~78 yrs (useful for cohort splits)</div>
      <p>Use round numbers — 300M for the US is fine and faster. Say <em>"I'll use 300 million for arithmetic ease"</em> so the interviewer knows it's a choice, not ignorance.</p>`},
    {title:'The segmentation decision',card:`
      <p>Segment when segments behave <em>materially differently</em> — otherwise you're adding arithmetic without adding accuracy.</p>
      <div class="f">Sizing the US coffee market?
  Segment by: at-home vs café  (5× price difference — YES)
  Not by: coffee bean origin   (no behavioural difference — NO)

Sizing commercial jet demand?
  Segment by: new build vs replacement  (different drivers — YES)
  Segment by: airline nationality       (usually NO)</div>
      <p>Two to four segments is the sweet spot. More than that and you'll run out of clock.</p>`},
    {title:'Stock vs flow — the most common structural error',card:`
      <p><strong>Stock</strong> = how many exist right now. <strong>Flow</strong> = how many are bought per year. They differ by the replacement rate.</p>
      <div class="f">"How many washing machines are in the US?"     → STOCK
"What is the annual US washing machine market?" → FLOW

Flow = Stock ÷ average life
  130M households × 0.9 penetration = 117M machines (stock)
  ÷ 10-year life = ~12M units/year (flow)
  × $600 avg price = ~$7B market</div>
      <div class="trap"><b>Listen for "market size."</b> It almost always means annual flow in dollars. Answering with the installed base is a hard miss.</div>`},
    {title:'Sanity checks and defending your number',card:`
      <ul>
        <li><strong>Per-capita test:</strong> divide by population. "$40B ÷ 335M = $120 per person per year" — plausible for coffee, absurd for lawn mowers.</li>
        <li><strong>Share-of-wallet test:</strong> as a % of household income or GDP. If your market exceeds 2% of GDP, be suspicious.</li>
        <li><strong>Known-anchor test:</strong> compare to a company you know. "If the market is $8B and the leader has 30% share, that's a $2.4B company — does one exist?"</li>
      </ul>
      <p>When challenged, <strong>name your weakest assumption before they do</strong>: <em>"The number I'm least confident in is the 30% penetration rate. If it's actually 15%, the market halves to $4B. That's the input I'd validate first."</em></p>`}
  ],
  drills:[
    {q:'How many commercial passenger aircraft are in service worldwide? Estimate the number.',
     body:'<p>Build it from air travel volume rather than guessing. Give the global in-service fleet.</p>',
     unit:'aircraft', a:25000, tol:0.4, ph:'e.g. 25000',
     hints:['Start from passengers per year, then work back through flights per aircraft.','~4.5B passenger journeys/year globally; ~150 seats average; ~80% load factor; an aircraft flies ~5 flights/day, ~330 days/year.'],
     sol:`<div class="f">Global air passenger journeys   ≈ 4.5B per year
Passengers per flight = 150 seats × 80% load ≈ 120
Flights needed = 4.5B ÷ 120 ≈ 37.5M flights/year

Flights per aircraft per year = 5/day × 330 days ≈ 1,650
Fleet = 37.5M ÷ 1,650 ≈ 23,000 aircraft</div>
       <p>Actual global commercial fleet is roughly 25,000–28,000. Anything from 15,000 to 40,000 with clean logic is a strong answer.</p>
       <p><strong>Sanity check to voice:</strong> <em>"Boeing and Airbus each deliver 500–800 aircraft a year, so about 1,200–1,600 annually. If aircraft last around 25 years, a steady-state fleet would be roughly 30,000–40,000 — same order of magnitude, which gives me confidence."</em></p>
       <div class="tip"><b>Cross-checking against production and asset life is the strongest possible close on a sizing question.</b> It shows you can triangulate rather than defend a single chain of assumptions.</div>`},

    {q:'Size the annual US market for residential window replacement, in dollars.',
     unit:'$B', a:22, tol:0.5, ph:'e.g. 20',
     hints:['Housing stock → windows per home → replacement cycle → price per window installed.','~130M housing units; ~15 windows each; windows last ~25 years; ~$500–700 installed per window.'],
     sol:`<div class="f">US housing units                    ≈ 130M
Windows per home                    ≈ 15
Total window stock                  ≈ 2.0B windows

Average window life                 ≈ 25 years
Annual replacement flow  = 2.0B ÷ 25 ≈ 78M windows/year
Price installed                     ≈ $600 each

Market ≈ 78M × $600 ≈ $47B</div>
       <p>Real figure is roughly $20–30B, so this estimate runs high — and the reason is instructive: <strong>not every window that reaches end-of-life gets replaced.</strong> Many homes are sold, demolished, or simply never updated.</p>
       <p>Apply a realisation factor: <em>"I'd haircut this by roughly half, because replacement is discretionary and deferred — many windows run well past 25 years. That gives $20–25B, which I'd treat as my working estimate."</em></p>
       <div class="note"><b>The scoring moment here is not the arithmetic — it's recognising that a theoretical replacement cycle overstates actual demand for discretionary durables.</b> Say that unprompted and you're in the top decile on this question.</div>`},

    {type:'mcq',
     q:'You are asked to size the market for industrial water pumps in Germany. Which approach is best?',
     options:[
       'Top-down from German population and per-capita water use',
       'Bottom-up from the number of industrial facilities × pumps per facility ÷ pump life × price',
       'Take the global pump market and apply Germany\'s share of world GDP',
       'Estimate from German GDP times a typical industrial-equipment percentage'],
     correct:1,
     hints:['Who actually buys industrial pumps? Size from the buyer, not the citizen.'],
     sol:`<p><strong>B.</strong> For B2B markets, build from the installed base of buyers. Population has no direct relationship to industrial pump demand.</p>
       <div class="f">German industrial facilities (manufacturing, chemical,
  food processing, water utilities, power)   ≈ 60,000 sites
Pumps per site (varies hugely — segment!)    ≈ 20 average
Installed base                                ≈ 1.2M pumps
Pump service life                             ≈ 10 years
Annual replacement                            ≈ 120,000 units
Average price                                 ≈ €4,000
Market ≈ €480M  + new capacity installs (~20%) ≈ €575M</div>
       <p>C is a legitimate <em>sanity check</em> — Germany is roughly 4% of world GDP but a much larger share of industrial machinery, so you'd expect an overweight. Use it to validate B, not to replace it.</p>
       <p>D is too blunt: "industrial equipment as % of GDP" spans everything from robots to conveyor belts.</p>
       <div class="tip"><b>Rule of thumb:</b> consumer market → top-down from population. B2B market → bottom-up from the buyer count. Capacity business (hotels, restaurants, clinics) → bottom-up from units of capacity.</div>`},

    {q:'A city of 2 million people. Estimate the annual revenue of the city\'s taxi and rideshare market.',
     unit:'$M', a:600, tol:0.5, ph:'e.g. 600',
     hints:['Rides per person per year × price per ride. Segment by user type if useful.','Assume ~30% of the population uses rideshare, averaging ~2 rides/month, at ~$18 per ride. Add business/airport trips.'],
     sol:`<div class="f">Population                                 2,000,000
Rideshare users (~35%)                       700,000
Rides per user per month                           2
Annual rides = 700,000 × 2 × 12         = 16.8M rides
Average fare                                     $18
Consumer market                          ≈ $300M

Plus business/airport/tourist trips (~50% uplift)
Total ≈ $450M–500M</div>
       <p>Sanity check: <em>"That's roughly $250 per resident per year, or about $20 a month across the whole population. That feels right for a mid-size city — it would be too high for a place with excellent public transit and too low for a sprawling car-dependent metro."</em></p>
       <p>A stronger version segments explicitly: heavy users (5% of population, 12 rides/month) versus occasional users (30%, 1 ride/month). Heavy users typically drive 40–50% of volume in rideshare, and saying that shows you understand the business, not just the arithmetic.</p>`},

    {type:'open',
     q:'The interviewer says: "Your number is off by 3×. Where do you think you went wrong?" How do you respond?',
     hints:['Don\'t defend, and don\'t collapse. Interrogate your own chain and name the most leveraged input.'],
     sol:`<p>The wrong responses: apologising and re-doing everything from scratch, or defending the number.</p>
       <p>The right response is a structured self-audit:</p>
       <p><em>"Let me stress-test my chain. I had four inputs: population, penetration, frequency, and price. Population and price I'm fairly confident about — they're observable. The two I'd challenge are penetration and frequency, because I anchored both on intuition."</em></p>
       <p><em>"Of those, frequency has the most leverage: I assumed two purchases per year, and if the real figure is closer to one, my number halves immediately. Combined with a penetration rate that might be 30% rather than 50%, I'd land at roughly a third of my estimate — which matches the gap you're pointing at. So my revised number is around [X], and frequency is the input I'd validate first with actual transaction data."</em></p>
       <div class="tip"><b>This response earns points a correct answer wouldn't.</b> You demonstrated that you know which assumptions your answer is sensitive to — which is exactly what a consultant does when a client challenges a model.</div>`}
  ],
  mcase:{
    title:'Vantage Diagnostics — sizing a new device market',
    prompt:`<p><strong>Vantage Diagnostics</strong> has developed a point-of-care blood analyser for primary care clinics. It wants to know the size of the US opportunity before committing to a launch.</p>
      <p>The device costs $18,000 and lasts 7 years. It also consumes proprietary test cartridges at $12 each.</p>`,
    steps:[
      {kind:'Structure',
       q:'How would you structure this sizing?',
       sol:`<p>Two revenue streams with completely different economics — that's the structure:</p>
         <div class="f">US market opportunity

├─ 1. DEVICE REVENUE  (one-time, replaced every 7 yrs)
│   ├─ # primary care clinics in the US
│   ├─ × % that would adopt (addressable, not total)
│   ├─ × devices per clinic
│   └─ ÷ 7-year replacement cycle → annual unit flow
│   └─ × $18,000
└─ 2. CARTRIDGE REVENUE  (recurring, the real prize)
    ├─ Installed device base
    ├─ × tests per device per day
    ├─ × operating days per year
    └─ × $12 per cartridge</div>
         <p>Flag the business-model point immediately: <em>"This is a razor-and-blade model, so I'd expect cartridges to dominate lifetime value. I want to size both, but the cartridge stream is what determines whether this is a good business."</em></p>`},

      {kind:'Estimate',
       q:'Estimate the number of US primary care clinics you would address.',
       unit:'clinics', a:60000, tol:0.5, ph:'e.g. 60000',
       sol:`<div class="f">US primary care physicians          ≈ 250,000
Average physicians per practice     ≈ 4
Total primary care practices        ≈ 60,000

Addressable filter: needs patient volume to justify $18k
  → target practices with 3+ physicians ≈ 60% of practices
Addressable practices                ≈ 36,000</div>
         <p>Alternative anchor if you don't recall physician counts: 335M people ÷ ~1,300 patients per primary care physician ≈ 250,000 physicians. Reconstructing an anchor from population is always safer than guessing the anchor itself.</p>
         <p>The judgment move is applying the addressability filter. A single-physician practice seeing 20 patients a day cannot justify an $18,000 capital purchase — saying so unprompted shows commercial instinct.</p>`},

      {kind:'Size the recurring stream',
       q:'Assume 36,000 addressable clinics, 25% eventually adopt, 1 device each, and each device runs 6 tests per day over 250 operating days. What is the annual cartridge revenue at full adoption?',
       unit:'$M', a:162, tol:0.06, ph:'e.g. 160',
       sol:`<div class="f">Installed devices = 36,000 × 25% = 9,000 devices
Tests per device per year = 6 × 250 = 1,500
Total cartridges = 9,000 × 1,500 = 13.5M per year
Revenue = 13.5M × $12 = $162M per year</div>
         <p>Compare to the device stream:</p>
         <div class="f">Device replacement flow = 9,000 ÷ 7 ≈ 1,300 units/year
Device revenue = 1,300 × $18,000 ≈ $23M per year

Cartridges are ~7× the recurring device revenue.</div>
         <p><em>"At steady state this is a $185M annual business, and 88% of it is cartridges. That has three implications: pricing strategy should favour placing devices cheaply to build the installed base; the key operating metric is tests per device per day, not units sold; and the entire model is exposed to cartridge substitution — I'd want to know how defensible the proprietary consumable is."</em></p>`},

      {kind:'Sanity check',
       q:'Sanity-check the number. Is $185M plausible, and what would you validate first?',
       sol:`<p><strong>Three checks:</strong></p>
         <ul>
           <li><strong>Per-clinic economics.</strong> $162M ÷ 9,000 clinics = $18,000 per clinic per year in cartridges, against an $18,000 device. So a clinic spends its device cost again every single year in consumables — is that credible against their alternative (sending samples to a central lab)? Only if turnaround time has real clinical or revenue value to them. That's the crux assumption.</li>
           <li><strong>Utilisation.</strong> 6 tests per day is the single most leveraged input. At 3 tests per day the market halves to $81M; at 12 it doubles to $324M. Everything hinges on it, so it's the first thing to validate — ideally from a pilot, not a survey.</li>
           <li><strong>Adoption rate.</strong> 25% penetration of addressable clinics is optimistic for a new device with no installed brand. 10% would be a more conservative base case, taking the market to roughly $75M.</li>
         </ul>
         <p><strong>How to close:</strong> <em>"My base case is $185M at steady state, but the honest range is $75M to $325M depending on utilisation and adoption. Before committing to launch I'd run a 20-clinic pilot measuring one thing above all: tests per device per day. That single number moves the answer by 4×, and it's the only input we can't estimate credibly from outside data."</em></p>
         <div class="tip"><b>Ending a sizing case by naming the one measurement that collapses the uncertainty is the strongest possible finish.</b> It converts an estimate into a decision.</div>`}
    ]
  }
});

MODULES.push({
  id:'m06',tag:'Core case type',
  title:'Profitability diagnosis',
  sub:'The most common case type: find where profit leaked, isolate it, quantify it, then fix it.',
  concept:[
    {title:'The master equation',card:`
      <div class="f">Profit = Revenue − Cost
       = (Price × Volume) − (Variable cost × Volume) − Fixed cost
       = (Price − Variable cost) × Volume − Fixed cost
       = Contribution per unit × Volume − Fixed cost</div>
      <p>Every profitability case lives inside that identity. The job is to find which term moved, by how much, and why.</p>
      <p>The fourth line is the useful one, because it separates the three things a client can actually change: the margin on each sale, how many sales, and the cost of existing at all.</p>`},
    {title:'The diagnostic sequence',card:`
      <ol>
        <li><strong>Is it revenue or cost?</strong> Compare growth rates. If revenue grew 3% and costs grew 9%, it's a cost problem — stop looking at revenue.</li>
        <li><strong>Internal or external?</strong> Did competitors' margins fall too? Industry-wide problems need different answers than company-specific ones.</li>
        <li><strong>Where exactly?</strong> Segment: by product, customer, channel, geography, time. Problems are almost never evenly spread.</li>
        <li><strong>Why?</strong> Only now do you go to root cause on the specific segment and line item you isolated.</li>
      </ol>
      <div class="trap"><b>The classic failure is jumping to step 4.</b> Candidates start theorising about root causes before establishing whether the problem is even on the cost side. Do steps 1–3 with data; they take two minutes and they aim everything after.</div>`},
    {title:'Rate vs mix vs volume — always separate them',card:`
      <p>An aggregate metric can move for three different reasons, and they demand different responses:</p>
      <div class="f">Average price fell from $50 to $46. Because…
  RATE:   we discounted the same products      → pricing decision
  MIX:    customers shifted to cheaper SKUs    → demand/portfolio shift
  VOLUME: no — volume doesn't move an average

Average margin fell. Because…
  RATE:   each product's margin compressed     → cost or price issue
  MIX:    low-margin products grew as a share  → nothing is "wrong"</div>
      <p>Ask for margin <em>by product</em> across both years. If every product's margin held but the blend fell, it's pure mix — and the answer is a portfolio question, not a cost-cutting exercise.</p>`},
    {title:'Cost decomposition that actually works',card:`
      <p>Three complementary cuts. Pick the one that fits the client:</p>
      <div class="f">1. BEHAVIOUR:   Fixed vs Variable        (→ leverage, breakeven)
2. FUNCTION:    COGS / Sales&Mkt / R&D / G&A (→ benchmarking)
3. VALUE CHAIN: inbound → produce → outbound → sell → service
                                          (→ operational root cause)</div>
      <p>Then apply the two-question test to every big line: <strong>"Is this line larger than it should be, and if so, is it price or quantity?"</strong> A high freight cost is either paying too much per shipment or shipping too many times — those have entirely different fixes.</p>`},
    {title:'Benchmarking: the fastest route to the answer',card:`
      <p>Absolute cost figures mean nothing alone. Ask for costs <strong>as a percentage of revenue, versus competitors or versus our own history</strong>. The line that is out of line is the case.</p>
      <div class="f">              Client   Peer avg   Gap
COGS           58%      54%      +4pp   ← the case
SG&amp;A           22%      23%      −1pp
R&amp;D             8%       9%      −1pp
Op margin      12%      14%      −2pp</div>
      <p>Here, COGS is the only meaningfully out-of-line item — and it fully explains the margin gap. Everything else is noise. Say that and you've compressed twenty minutes of exploration into one observation.</p>`},
    {title:'From diagnosis to recommendation',card:`
      <p>Once you've found the leak, the fixes are structurally predictable. Prioritise by size × feasibility × speed:</p>
      <ul>
        <li><strong>Price:</strong> raise list, reduce discounting, re-tier, change mix toward high-margin SKUs.</li>
        <li><strong>Volume:</strong> retention before acquisition (cheaper), share of wallet, distribution expansion.</li>
        <li><strong>Variable cost:</strong> procurement leverage, yield/waste, labour productivity, redesign.</li>
        <li><strong>Fixed cost:</strong> footprint consolidation, overhead reduction, outsourcing, capacity utilisation.</li>
      </ul>
      <div class="tip"><b>Order matters.</b> Price is nearly always the fastest and largest lever because it drops straight through with no offsetting cost — a 1% price rise typically beats a 1% cost cut by 3–5×. Lead with it unless competitive dynamics forbid it.</div>`}
  ],
  drills:[
    {widget:'profitTree',
     q:'Use the sensitivity lab: which 5% improvement creates the most profit?',
     body:'<p>Baseline: $100M revenue, $63M variable cost, $25M fixed cost, $12M profit. Set each slider to a 5% improvement one at a time (price +5%, volume +5%, variable cost −5%, fixed cost −5%) and record the profit each produces. Then enter the profit from a <strong>5% price increase</strong>.</p>',
     unit:'$M profit', a:17, tol:0.04, ph:'e.g. 17',
     hints:['Price +5% adds 5% of revenue straight to profit, with no cost attached.','$100M × 5% = $5M added to a $12M base.'],
     sol:`<div class="f">Price +5%:         profit $12M → $17.0M   (+42%)
Volume +5%:        profit $12M → $13.9M   (+16%)
Variable cost −5%: profit $12M → $15.2M   (+26%)
Fixed cost −5%:    profit $12M → $13.3M   (+10%)</div>
       <p><strong>Price wins decisively</strong>, because a price increase adds revenue with no incremental cost. A volume increase adds revenue but drags variable cost along with it — you only keep the contribution margin.</p>
       <p>This ranking (price &gt; variable cost &gt; volume &gt; fixed cost, for a typical cost structure) is worth internalising. It tells you where to look first in almost any profitability case, and it lets you say something genuinely useful in the first two minutes: <em>"Before we dig in, I'd note that for a business with this cost structure, a point of price is worth roughly three points of volume. So I want to understand pricing power early."</em></p>
       <div class="note"><b>The caveat that makes it credible:</b> price is the most powerful lever <em>and</em> the one most constrained by competition and elasticity. Naming both is what separates insight from a memorised rule.</div>`},

    {q:'A company\'s revenue rose 8% while profit fell 12%. Profit was $40M on $500M revenue. What happened to total costs?',
     body:'<p>Give the percentage change in total costs.</p>',
     unit:'%', a:9.7, tol:0.06, ph:'e.g. 10',
     hints:['Compute both years fully: revenue, profit, and costs as the difference.','Costs = revenue − profit, each year.'],
     sol:`<div class="f">Year 1: revenue $500M, profit $40M → costs $460M
Year 2: revenue $540M (+8%), profit $35.2M (−12%)
        → costs = 540 − 35.2 = $504.8M

Cost change = 504.8 ÷ 460 − 1 = +9.7%</div>
       <p><em>"Costs grew 9.7% against 8% revenue growth. That 1.7-point gap is small in percentage terms but it destroyed 12% of profit — because profit is a thin residual on a large base. On an 8% margin, costs only need to outgrow revenue by 2 points to wipe out a quarter of profit."</em></p>
       <div class="tip"><b>The general insight:</b> the thinner the margin, the more violently profit responds to small cost divergences. In low-margin businesses (retail, distribution, airlines), a 1-point cost slip is a crisis. Always compute the margin before judging whether a cost movement is small.</div>`},

    {type:'mcq',
     q:'Client margin fell from 20% to 16%. Product-level margins are unchanged. What is the explanation?',
     options:[
       'Costs rose across the board',
       'A mix shift toward lower-margin products',
       'The client cut prices',
       'Fixed costs increased'],
     correct:1,
     hints:['If no individual product\'s margin moved, what else can move the blended figure?'],
     sol:`<p><strong>B.</strong> If every product's margin is unchanged, the only way the blended margin can fall is if the revenue weighting shifted toward lower-margin products.</p>
       <div class="f">Before: 70% × 25% + 30% × 8.3% = 20%
After:  40% × 25% + 60% × 10%  = 16%
Same product margins, different mix.</div>
       <p>D is a plausible-sounding distractor but wrong as stated: rising fixed costs would compress the <em>net</em> margin while leaving product gross margins intact — so it depends which margin we're discussing. Worth flagging: <em>"I'd want to confirm whether we mean gross or net margin, because rising fixed costs would explain a net-margin decline with stable product margins too."</em></p>
       <p><strong>What to do with a mix finding:</strong> it changes the whole recommendation. There is nothing operationally broken. The questions become: is the shift customer-driven or self-inflicted through our sales incentives? Is the low-margin product a strategic entry point that pulls through the high-margin one? And is 16% still an acceptable return on a bigger revenue base?</p>`},

    {q:'A grocery chain has 300 stores averaging $12M revenue and 3% net margin. Analysis shows the worst 40 stores lose $200k each. What would closing them do to total profit?',
     unit:'$M change', a:8, tol:0.1, ph:'e.g. 8',
     hints:['Current total profit, then remove the losers.','Careful: the naive answer ignores what happens to shared fixed costs.'],
     sol:`<div class="f">Total revenue = 300 × $12M = $3,600M
Total profit  = 3% × $3,600M = $108M

Losing stores: 40 × (−$200k) = −$8M
Closing them naively: profit rises to $116M  (+$8M)</div>
       <p><strong>But that is the trap answer, and you should say so.</strong> Two corrections:</p>
       <ul>
         <li><strong>Allocated overhead doesn't disappear.</strong> If each store carries $150k of allocated corporate cost that continues after closure, the 40 stores are only losing $50k each on a <em>controllable</em> basis — $2M, not $8M — and the remaining 260 stores must absorb $6M more overhead. Net benefit collapses to roughly $2M.</li>
         <li><strong>Volume may transfer.</strong> If a closed store's customers shop at a nearby surviving store, some of that revenue and its contribution is retained — which improves the case. If they're isolated rural stores, none transfers.</li>
       </ul>
       <p><em>"The headline answer is +$8M, but I'd want the split between controllable store costs and allocated overhead before believing it. In my experience most of an apparent store-level loss is allocation, and the true cash benefit of closure is a fraction of the reported loss."</em></p>
       <div class="note"><b>This distinction — reported loss versus avoidable cost — appears constantly in closure, exit, and product-rationalisation cases. Only avoidable costs count.</b></div>`},

    {type:'open',
     q:'Revenue is flat, costs are flat, but profit fell 15%. How is that possible?',
     hints:['If the aggregates are truly flat, what is left that could move?'],
     sol:`<p>Several genuine explanations — a strong answer names three and says how to test each:</p>
       <ul>
         <li><strong>Mix within flat aggregates.</strong> Revenue is flat in total but shifted from high-margin to low-margin products; costs are flat in total but shifted toward more expensive inputs. Nothing moves at the top line, everything moves underneath. <em>Test: margin by product, both years.</em></li>
         <li><strong>Below-the-line items.</strong> If "profit" means net profit, then interest expense (new debt or rate rises), tax rate changes, FX losses, or one-time write-downs can move it while operating figures hold. <em>Test: walk the P&amp;L from operating profit to net.</em></li>
         <li><strong>Capitalisation and depreciation changes.</strong> A new asset entering service adds depreciation without changing cash costs, and prior-year capitalised costs may now be expensing. <em>Test: EBITDA versus EBIT — if EBITDA is flat and EBIT fell, it's D&amp;A.</em></li>
         <li><strong>Definitional/period effects.</strong> An extra week in the fiscal year, an accounting policy change, or a reclassification between COGS and SG&amp;A.</li>
       </ul>
       <p><strong>The move that scores:</strong> <em>"My first question would be whether this is EBITDA or net profit, because if EBITDA is flat and only net profit fell, the entire case is below the operating line and I shouldn't be looking at operations at all."</em> That one question can save fifteen minutes and it demonstrates real financial literacy.</p>`}
  ],
  mcase:{
    title:'Larkspur Publishing — where did the margin go?',
    prompt:`<p><strong>Larkspur</strong> is an academic publisher. Over three years, revenue is up 5% but operating profit has fallen 40%. The CEO believes it is a cost problem and has asked for a cost-reduction programme.</p>
      <p>Your EM wants you to test that belief before accepting it.</p>`,
    chart:{type:'stacked',title:'Exhibit 1 — Larkspur revenue by segment ($M)',
      sub:'Three-year view',
      series:['Print journals','Digital subscriptions','Open access fees'],
      pre:'$',suf:'M',dec:0,

    steps:[
      {kind:'Read the exhibit',
       q:'What does Exhibit 1 tell you?',
       sol:`<p>Read totals first, then composition, then the rate of change:</p>
         <div class="f">Total revenue: $300M → $310M → $315M   (+5% over 3 years)

Composition shift:
  Print:        $220M (73%) → $130M (41%)   −41%
  Digital:       $60M (20%) → $140M (44%)  +133%
  Open access:   $20M (7%)  →  $45M (14%)  +125%</div>
         <p><em>"Total revenue is essentially flat, but the composition has transformed. Print — which was three-quarters of the business — has nearly halved, while digital has more than doubled to become the largest segment. So this is a business in the middle of a channel transition, not a business with flat performance."</em></p>
         <p><strong>The immediate hypothesis:</strong> <em>"If print and digital carry different margins, then the profit decline could be entirely a mix effect rather than a cost problem. Before accepting the CEO's cost hypothesis, I'd want margin by segment."</em></p>
         <div class="tip"><b>Always state totals before composition.</b> Candidates who dive into one segment miss that the total barely moved — which is the fact that makes the mix story interesting.</div>`},

      {kind:'Test the hypothesis',
       q:'Segment margins are: print 35%, digital 18%, open access 25% — and all three have been stable across the three years. What was the blended margin in Year 1 versus Year 3?',
       chart:{type:'table',title:'Exhibit 2 — Segment margins (stable across all three years)',
         cols:['Segment','Year 1 rev ($M)','Year 3 rev ($M)','Margin %'],
         rows:[['Print journals','220','130','35%'],
               ['Digital subscriptions','60','140','18%'],
               ['Open access','20','45','25%'],
               ['Total','300','315','—']]},
       unit:'Year 3 blended margin %', a:26, tol:0.06, ph:'e.g. 26',
       sol:`<div class="f">YEAR 1 blended:
  (220 × 35% + 60 × 18% + 20 × 25%) ÷ 300
= (77.0 + 10.8 + 5.0) ÷ 300
= 92.8 ÷ 300 = 30.9%

YEAR 3 blended:
  (130 × 35% + 140 × 18% + 45 × 25%) ÷ 315
= (45.5 + 25.2 + 11.3) ÷ 315
= 82.0 ÷ 315 = 26.0%

Profit: $92.8M → $82.0M   (−12%)</div>
         <p><em>(Answers in the 24–27% range accepted.)</em></p>
         <p><strong>The finding:</strong> blended margin fell nearly 5 points with <em>zero</em> change in any segment's margin. Pure mix. And it explains a 12% profit decline — meaningful, but not the 40% the CEO reported.</p>
         <p><em>"So mix explains roughly a third of the profit decline. The remaining two-thirds is something else — which is where I'd look next, and it may well be the cost story the CEO suspects. But we now know cost-cutting can address at most two-thirds of the problem, and the mix third is structural."</em></p>
         <div class="note"><b>Partial explanations are valuable — say how much they explain and how much is left.</b> "Mix explains a third" is far stronger than either "it's mix" or "it's not mix."</div>`},

      {kind:'Find the remainder',
       q:'What would you look for to explain the other two-thirds of the profit decline?',
       sol:`<p>We know segment margins are stable, so the residual cannot be in segment-level unit economics. That points to costs <em>outside</em> the segments:</p>
         <ul>
           <li><strong>Stranded fixed costs in print.</strong> Print revenue fell $90M, but printing plants, warehousing, and distribution contracts are fixed or contractual. If Larkspur still carries a print infrastructure sized for $220M of revenue, it is bleeding on utilisation — this is the single most likely answer, and it is classic operating deleverage.</li>
           <li><strong>Dual-running costs.</strong> During a transition a publisher runs both a print operation and a digital platform, with duplicated editorial workflow, IT, and support. Transition periods carry structurally elevated overhead.</li>
           <li><strong>Digital platform investment.</strong> Technology spend to build the digital product may sit in corporate overhead rather than in segment margins — which would explain why segment margins look stable while total profit fell.</li>
           <li><strong>Corporate overhead not scaled.</strong> SG&amp;A sized to a $300M print business, unchanged.</li>
         </ul>
         <p><strong>The one data request:</strong> <em>"I'd ask for the cost base split into segment-attributable versus corporate/shared, for Year 1 and Year 3. If shared costs grew while segment margins held, we've found the remaining two-thirds — and it's almost certainly stranded print capacity."</em></p>`},

      {kind:'Recommend',
       q:'The CEO wants a cost-reduction programme. What do you tell them?',
       sol:`<p><strong>Answer first, and correct the premise:</strong> <em>"I'd push back on framing this as a cost-reduction programme. About a third of the profit decline is a mix effect from a deliberate and probably correct shift out of print — no amount of cost cutting addresses that. The remaining two-thirds is likely stranded print capacity, which needs a restructuring decision, not a broad efficiency drive."</em></p>
         <p><strong>Three recommendations, in priority order:</strong></p>
         <ul>
           <li><strong>Right-size print infrastructure to the print business that will exist in three years, not the one that existed three years ago.</strong> Print is declining ~20% a year; at that rate it's under $70M in two more years. Exit or outsource printing rather than trimming it incrementally.</li>
           <li><strong>Attack digital margin, not digital cost.</strong> Digital's 18% margin is the lowest in the portfolio and it is now the largest segment — so it determines Larkspur's future margin. A 5-point improvement there is worth $7M and compounds as digital grows, which is more valuable than any print saving.</li>
           <li><strong>Reprice open access.</strong> At 25% margin and 125% growth, it is the healthiest part of the portfolio and likely under-priced given that demand growth.</li>
         </ul>
         <p><strong>Risk to flag:</strong> <em>"The uncomfortable implication is that Larkspur's steady-state margin is structurally lower than its historical margin, because the business it is becoming is a lower-margin business than the one it was. If digital stays at 18%, the company will not return to 31% margins by cutting costs. The strategic question is whether to accept a lower-margin, more durable business or to find a way to make digital economics look more like print's."</em></p>
         <div class="tip"><b>Telling the CEO their framing is wrong — respectfully, with numbers — is exactly what the exercise is testing.</b> The EM asked you to test the belief, not confirm it.</div>`}
    ]
  }
});
