<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBB Case Prep — Interactive Refresher</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --card:#161f2b; --card2:#1c2735;
  --line:#25303f;
  --tx:#e6edf3; --tx2:#9fb0c3; --tx3:#6b7d92;
  --acc:#4f9cf9; --acc2:#7c5cff;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc)}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{
  width:280px;flex:0 0 280px;background:var(--bg2);border-right:1px solid var(--line);
  padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-size:16px;margin:0 0 4px;letter-spacing:.2px}
.brand p{margin:0;font-size:12px;color:var(--tx3)}
.prog{display:flex;align-items:center;gap:12px;padding:12px 20px;margin-bottom:8px}
.ring{width:54px;height:54px;flex:0 0 54px}
.prog .meta{font-size:12px;color:var(--tx2);line-height:1.4}
.prog .meta b{display:block;font-size:18px;color:var(--tx);font-weight:600}
.navlist{list-style:none;margin:0;padding:0 10px}
.navlist li{margin:1px 0}
.navlist button{
  width:100%;text-align:left;background:none;border:0;color:var(--tx2);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;
  display:flex;gap:9px;align-items:flex-start;line-height:1.35;font-family:inherit;
}
.navlist button:hover{background:var(--card);color:var(--tx)}
.navlist button.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
.navlist .num{font:600 11px/1.5 var(--mono);color:var(--tx3);min-width:18px;padding-top:1px}
.navlist button.on .num{color:var(--acc)}
.navlist .tick{margin-left:auto;color:var(--ok);font-size:12px}
.side .foot{padding:14px 20px 0;margin-top:14px;border-top:1px solid var(--line)}
.side .foot button{
  background:none;border:1px solid var(--line);color:var(--tx3);font-size:12px;
  padding:6px 10px;border-radius:7px;cursor:pointer;font-family:inherit;width:100%
}
.side .foot button:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:34px 40px 90px;max-width:980px}
.mhead{margin-bottom:26px}
.kicker{font:600 11px/1 var(--mono);letter-spacing:1.4px;color:var(--acc);text-transform:uppercase}
.mhead h2{font-size:27px;margin:10px 0 6px;letter-spacing:-.3px}
.mhead .sub{color:var(--tx2);font-size:15px;margin:0}

.phase{margin:34px 0 16px;display:flex;align-items:center;gap:10px}
.phase .pill{
  font:600 10.5px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;
  padding:5px 9px;border-radius:5px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)
}
.phase .rule{flex:1;height:1px;background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:14px 0}
.card h4{margin:0 0 10px;font-size:15.5px}
.card p{margin:0 0 11px}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:0 0 11px;padding-left:20px}
.card li{margin:4px 0}
.card li:last-child{margin-bottom:0}
strong{color:#fff;font-weight:600}
em{color:var(--tx2)}
code{font:13px var(--mono);background:#0b1017;border:1px solid var(--line);padding:1.5px 5px;border-radius:4px;color:#a5d6ff}
.f{font:13.5px/1.7 var(--mono);background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--acc);
   padding:11px 14px;border-radius:6px;margin:11px 0;color:#cfe6ff;overflow-x:auto;white-space:pre-wrap}
.note{border-left:3px solid var(--warn);background:#1f1a0d80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#e8d9a8}
.note b{color:var(--warn)}
.tip{border-left:3px solid #2dd4bf;background:#0d1f1e80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#b6ece6}
.tip b{color:#2dd4bf}
.trap{border-left:3px solid var(--bad);background:#1f0f0f80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#f5c2c0}
.trap b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

table.dt{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:7px 10px;text-align:right}
table.dt th{background:var(--card2);color:var(--tx2);font-weight:600;font-size:12.5px}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td.num{font-family:var(--mono)}
table.dt tr.tot td{background:#0b1017;font-weight:600;color:#fff}

/* ---------- exhibits ---------- */
.exhibit{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:14px 0}
.exhibit .xt{font:600 12px/1.3 var(--mono);letter-spacing:.6px;color:var(--tx2);text-transform:uppercase;margin-bottom:2px}
.exhibit .xs{font-size:13px;color:var(--tx3);margin-bottom:10px}
.exhibit .xn{font-size:12.5px;color:var(--tx3);margin-top:8px;font-style:italic}
.exhibit svg{display:block;width:100%;height:auto;overflow:visible}
.exhibit svg text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb0c3}
.exhibit svg text.lbl{font-size:11px;fill:#6b7d92}
.exhibit svg text.val{font:600 11px var(--mono);fill:#e6edf3}
.exhibit svg .gl{stroke:#25303f;stroke-width:1}
.exhibit svg .ax{stroke:#6b7d92;stroke-width:1}
.exhibit svg rect.b,.exhibit svg circle.pt{cursor:pointer;transition:opacity .12s}
.exhibit svg rect.b:hover,.exhibit svg circle.pt:hover{opacity:.72}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip-pop{
  position:fixed;z-index:99;background:#020508;border:1px solid var(--acc);border-radius:6px;
  padding:6px 10px;font:12px var(--mono);color:#fff;pointer-events:none;opacity:0;transition:opacity .1s;
  white-space:pre;box-shadow:0 6px 20px #000a
}
.ctrl{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:4px 0 12px;font-size:13px;color:var(--tx2)}
.ctrl label{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.ctrl .lr{display:flex;justify-content:space-between;font-size:12px}
.ctrl .lr b{font-family:var(--mono);color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.readout{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.readout div{font-size:12px;color:var(--tx3)}
.readout b{display:block;font:600 17px var(--mono);color:var(--tx);margin-top:2px}

/* ---------- drills ---------- */
.drill{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
.drill.correct{border-color:#3fb95055;background:#0f1b12}
.drill.wrong{border-color:#f8514955}
.dhead{display:flex;gap:10px;align-items:baseline;margin-bottom:9px}
.dhead .qn{font:600 11px var(--mono);color:var(--acc);letter-spacing:.8px;white-space:nowrap}
.dhead .qt{font-size:15px;font-weight:600;color:#fff}
.dbody{font-size:14.5px;color:var(--tx)}
.dbody p{margin:0 0 9px}
.dbody ul,.dbody ol{margin:0 0 9px;padding-left:20px}
.ansrow{display:flex;gap:9px;align-items:center;margin-top:13px;flex-wrap:wrap}
.ansrow input[type=text]{
  background:#0b1017;border:1px solid var(--line);border-radius:7px;color:var(--tx);
  padding:9px 12px;font:15px var(--mono);width:190px;outline:none
}
.ansrow input[type=text]:focus{border-color:var(--acc)}
.ansrow .unit{color:var(--tx3);font-size:13px}
.btn{
  background:var(--acc);color:#04121f;border:0;border-radius:7px;padding:9px 15px;
  font:600 13.5px inherit;cursor:pointer;font-family:inherit
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx2)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);filter:none}
.btn.sm{padding:6px 11px;font-size:12.5px}
.verdict{font-size:13.5px;font-weight:600;margin-left:2px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;background:#0b1017;border:1px solid var(--line);
  border-radius:8px;padding:10px 13px;cursor:pointer;font-size:14px;transition:border-color .12s
}
.opt:hover{border-color:var(--acc)}
.opt .k{font:600 12px var(--mono);color:var(--tx3);padding-top:1px}
.opt.ok{border-color:var(--ok);background:#0f1b12}
.opt.no{border-color:var(--bad);background:#1b0f0f}
.opt.dead{cursor:default}
.hints{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.hint{background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:10px 13px;font-size:13.5px;color:#e8d9a8}
.hint .hk{font:600 10.5px var(--mono);letter-spacing:1px;color:var(--warn);display:block;margin-bottom:3px}
.sol{margin-top:12px;background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:13px 15px;font-size:14px}
.sol .sk{font:600 10.5px var(--mono);letter-spacing:1px;color:var(--ok);display:block;margin-bottom:6px}
.sol p{margin:0 0 8px}.sol p:last-child{margin-bottom:0}
.sol ul,.sol ol{margin:0 0 8px;padding-left:19px}
.sol .f{margin:8px 0}

/* ---------- sprint ---------- */
.sprint{background:linear-gradient(180deg,#161f2b,#12212b);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0}
.sprint .sq{font:600 30px var(--mono);color:#fff;letter-spacing:1px;margin:14px 0}
.sprint .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.sprint .bar i{display:block;height:100%;background:var(--acc);transition:width .12s linear}
.sprint .stat{display:flex;gap:24px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.sprint .stat b{color:#fff;font-family:var(--mono)}

/* ---------- mini case ---------- */
.mcase{background:var(--card);border:1px solid #7c5cff55;border-radius:var(--radius);overflow:hidden;margin:16px 0}
.mcase .ch{background:#1a1630;border-bottom:1px solid var(--line);padding:16px 22px}
.mcase .ch .tag{font:600 10.5px var(--mono);letter-spacing:1.3px;color:var(--acc2);text-transform:uppercase}
.mcase .ch h4{margin:6px 0 0;font-size:17px;color:#fff}
.mcase .cb{padding:18px 22px}
.prompt{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;margin-bottom:14px}
.prompt .who{font:600 10.5px var(--mono);letter-spacing:1.2px;color:var(--acc2);display:block;margin-bottom:5px}
.prompt p{margin:0 0 9px}.prompt p:last-child{margin-bottom:0}
.prompt ul{margin:0 0 9px;padding-left:20px}
.step{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.step.locked{opacity:.3;pointer-events:none;filter:blur(1.4px)}
.step .sn{font:600 11px var(--mono);color:var(--acc2);letter-spacing:.8px}
.selfmark{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.done-badge{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:13px;font-weight:600}

.modnav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.hidden{display:none!important}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:24px 18px 70px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>MBB Case Prep</h1>
      <p>Interviewer-led · McKinsey-weighted refresher</p>
    </div>
    <div class="prog">
      <svg class="ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#25303f" stroke-width="3.4"/>
        <circle id="ringfg" cx="18" cy="18" r="15.5" fill="none" stroke="#4f9cf9" stroke-width="3.4"
                stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"
                transform="rotate(-90 18 18)"/>
      </svg>
      <div class="meta"><b id="progpct">0%</b><span id="progtxt">0 of 0 exercises</span></div>
    </div>
    <ul class="navlist" id="nav"></ul>
    <div class="foot"><button id="resetbtn">Reset all progress</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tip-pop" id="pop"></div>

<script>
/* =========================================================================
   STATE — persisted to localStorage
   ========================================================================= */
const KEY='mbb-prep-v1';
let ST=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function mark(id,val){if(ST[id]==='ok'&&val!=='ok')return;ST[id]=val;save();paintProgress();paintNav()}
function got(id){return ST[id]}

/* =========================================================================
   HELPERS
   ========================================================================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n,d){
  if(n==null||isNaN(n))return '—';
  d=(d==null)?(Math.abs(n)>=100?0:(Math.abs(n)>=10?1:2)):d;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
/* Parses 1,200 · $1.2m · 12% · 3.5bn · 1.2k */
function parseNum(s){
  if(s==null)return NaN;
  let t=String(s).trim().toLowerCase().replace(/[$,\s]/g,'').replace(/[€£]/g,'');
  if(t.endsWith('%'))t=t.slice(0,-1);
  let mult=1;
  const suf=[['trillion',1e12],['billion',1e9],['million',1e6],['thousand',1e3],
             ['tn',1e12],['bn',1e9],['mm',1e6],['mn',1e6],['k',1e3],['t',1e12],['b',1e9],['m',1e6]];
  for(const p of suf){if(t.endsWith(p[0])){mult=p[1];t=t.slice(0,-p[0].length);break}}
  const v=parseFloat(t);
  return isNaN(v)?NaN:v*mult;
}
function within(g,want,tol){
  if(isNaN(g))return false;
  tol=(tol==null)?0.03:tol;
  if(want===0)return Math.abs(g)<=(tol||0.01);
  return Math.abs(g-want)/Math.abs(want)<=tol;
}

/* =========================================================================
   TOOLTIP
   ========================================================================= */
const POP=$('#pop');
function popShow(e,txt){POP.textContent=txt;POP.style.opacity='1';popMove(e)}
function popMove(e){POP.style.left=(e.clientX+14)+'px';POP.style.top=(e.clientY-10)+'px'}
function popHide(){POP.style.opacity='0'}
function hoverable(node,txt){
  node.addEventListener('mouseenter',e=>popShow(e,txt));
  node.addEventListener('mousemove',popMove);
  node.addEventListener('mouseleave',popHide);
}

/* =========================================================================
   CHART LIBRARY — inline SVG, zero dependencies
   ========================================================================= */
const PAL=['#4f9cf9','#7c5cff','#3fb950','#d29922','#f85149','#2dd4bf','#f472b6'];
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(t,a){const e=document.createElementNS(SVGNS,t);for(const k in (a||{}))e.setAttribute(k,a[k]);return e}
function niceMax(v){
  if(v<=0)return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));const r=v/p;
  const s=r<=1?1:r<=1.2?1.2:r<=1.5?1.5:r<=2?2:r<=2.5?2.5:r<=3?3:r<=4?4:r<=5?5:r<=6?6:r<=8?8:10;
  return s*p;
}
function axisTicks(max,n){const out=[];for(let i=0;i<=n;i++)out.push(max*i/n);return out}
function vtxt(spec,v,d){
  const sign=v<0?'-':'';
  return sign+(spec.pre||'')+fmt(Math.abs(v),d==null?spec.dec:d)+(spec.suf||'');
}

function chart(spec){
  const box=el('div','exhibit');
  if(spec.title)box.appendChild(el('div','xt',spec.title));
  if(spec.sub)box.appendChild(el('div','xs',spec.sub));
  let body;
  switch(spec.type){
    case 'bar':      body=cBar(spec);break;
    case 'stacked':  body=cStacked(spec);break;
    case 'line':     body=cLine(spec);break;
    case 'scatter':  body=cScatter(spec);break;
    case 'waterfall':body=cWaterfall(spec);break;
    case 'table':    body=cTable(spec);break;
    default:         body=el('div','','unknown chart type');
  }
  box.appendChild(body);
  let leg=spec.legend;
  if(!leg&&spec.type==='stacked')leg=spec.series.map((s,i)=>({label:s,color:PAL[i%PAL.length]}));
  if(leg)box.appendChild(legendEl(leg));
  if(spec.note)box.appendChild(el('div','xn',spec.note));
  return box;
}
function legendEl(items){
  const l=el('div','legend');
  items.forEach((it,i)=>{
    const s=el('span');const ic=el('i');ic.style.background=it.color||PAL[i%PAL.length];
    s.appendChild(ic);s.appendChild(document.createTextNode(it.label));l.appendChild(s);
  });
  return l;
}

function cBar(s){
  const W=720,H=s.h||300,P={t:24,r:16,b:s.data.some(d=>d.sub)?64:52,l:66};
  const data=s.data,n=data.length;
  const max=s.max!=null?s.max:niceMax(Math.max(...data.map(d=>d.value)));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  axisTicks(max,s.ticks||4).forEach(t=>{
    const y=P.t+ih-(t/max)*ih;
    svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);
    svg.appendChild(tx);
  });
  const gap=iw/n,bw=gap*0.62;
  data.forEach((d,i)=>{
    const h=Math.max(1,(d.value/max)*ih),x=P.l+gap*i+(gap-bw)/2,y=P.t+ih-h;
    const r=svgEl('rect',{x:x,y:y,width:bw,height:h,rx:3,fill:d.color||s.color||PAL[0],class:'b'});
    hoverable(r,d.label+'\n'+vtxt(s,d.value));svg.appendChild(r);
    if(s.showVals!==false){
      const v=svgEl('text',{x:x+bw/2,y:y-6,'text-anchor':'middle',class:'val'});v.textContent=vtxt(s,d.value);svg.appendChild(v);
    }
    const lb=svgEl('text',{x:x+bw/2,y:P.t+ih+18,'text-anchor':'middle',class:'lbl'});lb.textContent=d.label;svg.appendChild(lb);
    if(d.sub){const s2=svgEl('text',{x:x+bw/2,y:P.t+ih+32,'text-anchor':'middle',class:'lbl'});s2.textContent=d.sub;svg.appendChild(s2)}
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

function cStacked(s){
  const W=720,H=s.h||330,P={t:24,r:16,b:52,l:68};
  const tot=s.data.map(d=>d.values.reduce((a,b)=>a+b,0));
  const max=s.max!=null?s.max:niceMax(Math.max(...tot));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  axisTicks(max,4).forEach(t=>{
    const y=P.t+ih-(t/max)*ih;
    svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);svg.appendChild(tx);
  });
  const gap=iw/s.data.length,bw=gap*0.6;
  s.data.forEach((d,i)=>{
    let acc=0;
    d.values.forEach((v,j)=>{
      const h=(v/max)*ih,x=P.l+gap*i+(gap-bw)/2,y=P.t+ih-(acc/max)*ih-h;
      const r=svgEl('rect',{x:x,y:y,width:bw,height:Math.max(0,h),fill:PAL[j%PAL.length],class:'b'});
      hoverable(r,d.label+' — '+s.series[j]+'\n'+vtxt(s,v)+'  ('+fmt(v/tot[i]*100,0)+'% of bar)');svg.appendChild(r);
      if(h>17){
        const t2=svgEl('text',{x:x+bw/2,y:y+h/2+4,'text-anchor':'middle',class:'val',fill:'#08111c'});
        t2.textContent=fmt(v,s.dec);svg.appendChild(t2);
      }
      acc+=v;
    });
    const tt=svgEl('text',{x:P.l+gap*i+gap/2,y:P.t+ih-(acc/max)*ih-7,'text-anchor':'middle',class:'val'});
    tt.textContent=vtxt(s,acc);svg.appendChild(tt);
    const lb=svgEl('text',{x:P.l+gap*i+gap/2,y:P.t+ih+18,'text-anchor':'middle',class:'lbl'});lb.textContent=d.label;svg.appendChild(lb);
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

function cLine(s){

function cWaterfall(s){
  const W=720,H=s.h||330,P={t:28,r:16,b:62,l:72};
  let run=0;const bars=[];
  s.data.forEach(d=>{
    if(d.type==='start'||d.type==='end'){bars.push(Object.assign({},d,{from:0,to:d.value}));run=d.value}
    else{bars.push(Object.assign({},d,{from:run,to:run+d.value}));run+=d.value}
  });
  const max=s.max!=null?s.max:niceMax(Math.max(...bars.map(b=>Math.max(b.from,b.to))));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const Y=v=>P.t+ih-(v/max)*ih;
  axisTicks(max,4).forEach(t=>{
    const y=Y(t);svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);svg.appendChild(tx);
  });
  const gap=iw/bars.length,bw=gap*0.58;
  bars.forEach((b,i)=>{
    const x=P.l+gap*i+(gap-bw)/2;
    const yTop=Y(Math.max(b.from,b.to)),h=Math.max(1.5,Math.abs(Y(b.from)-Y(b.to)));
    const anchor=(b.type==='start'||b.type==='end');
    const col=anchor?'#4f9cf9':(b.value>=0?'#3fb950':'#f85149');
    const r=svgEl('rect',{x:x,y:yTop,width:bw,height:h,rx:2,fill:col,class:'b'});
    hoverable(r,b.label+'\n'+(anchor?vtxt(s,b.value):(b.value>=0?'+':'')+vtxt(s,b.value)+'\nruns to '+vtxt(s,b.to)));
    svg.appendChild(r);
    const t=svgEl('text',{x:x+bw/2,y:yTop-6,'text-anchor':'middle',class:'val'});
    t.textContent=anchor?vtxt(s,b.value):((b.value>=0?'+':'')+vtxt(s,b.value));
    if(!anchor)t.setAttribute('fill',b.value>=0?'#3fb950':'#f85149');
    svg.appendChild(t);
    if(i<bars.length-1){
      const y2=Y(b.to);
      svg.appendChild(svgEl('line',{x1:x+bw,x2:P.l+gap*(i+1)+(gap-bw)/2,y1:y2,y2:y2,
        stroke:'#6b7d92','stroke-width':1,'stroke-dasharray':'3 3'}));
    }
    const words=String(b.label).split(' ');const lines=[];let cur='';
    words.forEach(w=>{if((cur+' '+w).trim().length>12){lines.push(cur.trim());cur=w}else cur+=' '+w});
    if(cur.trim())lines.push(cur.trim());
    lines.slice(0,3).forEach((ln,k)=>{
      const lt=svgEl('text',{x:x+bw/2,y:P.t+ih+17+k*12,'text-anchor':'middle',class:'lbl'});lt.textContent=ln;svg.appendChild(lt);
    });
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

/* =========================================================================
   SPRINT — timed mental math
   ========================================================================= */
const GENS={};
const RND=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PICK=a=>a[Math.floor(Math.random()*a.length)];

function renderSprint(cfg,mid,idx){
  const id=mid+'-s'+idx;
  const box=el('div','sprint');
  box.appendChild(el('div','dhead','<span class="qn">SPRINT</span><span class="qt">'+cfg.title+'</span>'));
  box.appendChild(el('div','','<div style="font-size:14px;color:#9fb0c3">'+cfg.desc+'</div>'));
  const qEl=el('div','sq','—');
  const bar=el('div','bar','<i style="width:100%"></i>');
  const stat=el('div','stat');
  const row=el('div','ansrow');
  const inp=el('input');inp.type='text';inp.placeholder='type + Enter';inp.disabled=true;
  const start=el('button','btn','Start '+(cfg.seconds||60)+'s drill');
  const vd=el('span','verdict');
  row.appendChild(inp);row.appendChild(start);row.appendChild(vd);
  box.appendChild(qEl);box.appendChild(bar);box.appendChild(stat);box.appendChild(row);

  let running=false,cur=null,right=0,wrong=0,t0=0,timer=null;
  const gen=GENS[cfg.gen];
  const target=cfg.target||8;
  const paint=()=>{stat.innerHTML='<span>Correct <b>'+right+'</b></span><span>Missed <b>'+wrong+
    '</b></span><span>Best <b>'+(ST[id+'-best']||0)+'</b></span><span>Target <b>'+target+'</b></span>'};
  const next=()=>{cur=gen();qEl.textContent=cur.q;inp.value='';inp.focus()};
  const stop=()=>{
    running=false;clearInterval(timer);inp.disabled=true;start.classList.remove('hidden');
    start.textContent='Run again';qEl.textContent='Time!';
    if(right>(ST[id+'-best']||0))ST[id+'-best']=right;
    if(right>=target)mark(id,'ok');else if(!ST[id])ST[id]='seen';
    save();paintProgress();paintNav();
    vd.className='verdict '+(right>=target?'ok':'no');
    vd.textContent=right>=target?('✓ '+right+' correct — target met'):(right+' correct — target is '+target);
    paint();
  };
  start.onclick=()=>{
    running=true;right=0;wrong=0;vd.textContent='';inp.disabled=false;start.classList.add('hidden');
    t0=Date.now();next();paint();
    timer=setInterval(()=>{
      const left=(cfg.seconds||60)*1000-(Date.now()-t0);
      $('i',bar).style.width=Math.max(0,left/((cfg.seconds||60)*10))+'%';
      if(left<=0)stop();
    },100);
  };
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||!running)return;
    const v=parseNum(inp.value);
    if(within(v,cur.a,cur.tol==null?0.02:cur.tol)){right++;vd.className='verdict ok';vd.textContent='✓'}
    else{wrong++;vd.className='verdict no';vd.textContent='✗ '+fmt(cur.a,cur.dec)}
    paint();next();
  });
  paint();
  return box;
}

function renderBlocks(blocks,host){
  (blocks||[]).forEach(b=>{
    if(typeof b==='string'){host.appendChild(el('div','card',b));return}
    if(b.chart){host.appendChild(chart(b.chart));return}

    if(b.raw){const d=el('div');d.innerHTML=b.raw;host.appendChild(d);return}
    if(b.card!=null){host.appendChild(el('div','card',(b.title?'<h4>'+b.title+'</h4>':'')+b.card));return}
  });

function renderDrill(d,idx,mid){
  const id=mid+'-d'+idx;
  const box=el('div','drill');
  if(got(id)==='ok')box.classList.add('correct');
  const head=el('div','dhead');
  head.appendChild(el('span','qn','Q'+(idx+1)));
  head.appendChild(el('span','qt',d.q));
  box.appendChild(head);
  if(d.body)box.appendChild(el('div','dbody',d.body));
  if(d.chart)box.appendChild(chart(d.chart));
  if(d.widget)box.appendChild(WIDGETS[d.widget](d.opts||{}));

  const ctrlHost=el('div');box.appendChild(ctrlHost);
  const hintWrap=el('div','hints');box.appendChild(hintWrap);
  const solWrap=el('div');box.appendChild(solWrap);
  let hintsShown=0;
  const showSol=()=>{
    if($('.sol',solWrap))return;
    solWrap.appendChild(el('div','sol','<span class="sk">Worked solution</span>'+d.sol));
  };
  const nextHint=()=>{
    const hs=d.hints||[];
    if(hintsShown>=hs.length){showSol();return}
    hintWrap.appendChild(el('div','hint','<span class="hk">Hint '+(hintsShown+1)+'</span>'+hs[hintsShown]));
    hintsShown++;
  };

  if(d.type==='mcq'){
    const opts=el('div','opts');
    d.options.forEach((o,i)=>{
      const oe=el('div','opt','<span class="k">'+'ABCDEFG'[i]+'</span><span>'+o+'</span>');
      oe.onclick=()=>{
        if(oe.classList.contains('dead'))return;
        $$('.opt',opts).forEach(x=>x.classList.add('dead'));
        if(i===d.correct){oe.classList.add('ok');box.classList.add('correct');mark(id,'ok')}
        else{oe.classList.add('no');box.classList.add('wrong');$$('.opt',opts)[d.correct].classList.add('ok');mark(id,'seen')}
        showSol();
      };
      opts.appendChild(oe);
    });
    ctrlHost.appendChild(opts);
    if((d.hints||[]).length){
      const row=el('div','ansrow');
      const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb);
      ctrlHost.appendChild(row);
    }
  }
  else if(d.type==='open'){
    const row=el('div','ansrow');
    const rb=el('button','btn','Show model answer');
    const mk=el('div','selfmark hidden');
    mk.innerHTML='<span style="font-size:13px;color:#9fb0c3">How did you do?</span>';
    const g=el('button','btn sm','I had this');
    const n=el('button','btn ghost sm','Needs work');
    g.onclick=()=>{mark(id,'ok');box.classList.add('correct');mk.innerHTML='<span class="done-badge">✓ Logged</span>'};
    n.onclick=()=>{mark(id,'seen');mk.innerHTML='<span style="font-size:13px;color:#d29922">Flagged — revisit</span>'};
    mk.appendChild(g);mk.appendChild(n);
    if((d.hints||[]).length){const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb)}
    rb.onclick=()=>{showSol();rb.classList.add('hidden');mk.classList.remove('hidden')};
    row.appendChild(rb);
    ctrlHost.appendChild(row);ctrlHost.appendChild(mk);
  }
  else {
    const row=el('div','ansrow');
    const inp=el('input');inp.type='text';inp.placeholder=d.ph||'your answer';
    const chk=el('button','btn','Check');
    const vd=el('span','verdict');
    const doCheck=()=>{
      const v=parseNum(inp.value);
      if(isNaN(v)){vd.className='verdict no';vd.textContent='enter a number';return}
      if(within(v,d.a,d.tol)){
        vd.className='verdict ok';vd.textContent='✓ Correct — '+(d.aTxt||fmt(d.a,d.dec));
        box.classList.remove('wrong');box.classList.add('correct');mark(id,'ok');showSol();
      }else{
        vd.className='verdict no';vd.textContent='✗ not yet';box.classList.add('wrong');
        nextHint();mark(id,'seen');
      }
    };
    chk.onclick=doCheck;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck()});
    row.appendChild(inp);
    if(d.unit)row.appendChild(el('span','unit',d.unit));
    row.appendChild(chk);
    if((d.hints||[]).length){const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb)}
    const sb=el('button','btn ghost sm','Solution');
    sb.onclick=()=>{showSol();if(got(id)!=='ok')mark(id,'seen')};
    row.appendChild(sb);row.appendChild(vd);
    ctrlHost.appendChild(row);
  }
  return box;
}

function renderCase(c,mid){

  const b=el('div','cb');

    const st=el('div','step');
    st.appendChild(el('div','sn','STEP '+(i+1)+(s.kind?' · '+s.kind:'')));
    st.appendChild(el('div','prompt','<span class="who">Interviewer</span>'+s.q));
    if(s.chart)st.appendChild(chart(s.chart));
    if(s.widget)st.appendChild(WIDGETS[s.widget](s.opts||{}));
    const id=mid+'-c'+i;
    const solWrap=el('div');
    const reveal=()=>{
      if($('.sol',solWrap))return;

      if(stepEls[i+1])stepEls[i+1].classList.remove('locked');
    };
    if(s.a!=null){
      const row=el('div','ansrow');

        const v=parseNum(inp.value);

        if(within(v,s.a,s.tol)){vd.className='verdict ok';vd.textContent='✓ '+(s.aTxt||fmt(s.a,s.dec));mark(id,'ok')}
        else{vd.className='verdict no';vd.textContent='✗ off — see answer';mark(id,'seen')}
        reveal();
      };
      chk.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
      sk.onclick=()=>{reveal();if(got(id)!=='ok')mark(id,'seen')};
      row.appendChild(inp);
      if(s.unit)row.appendChild(el('span','unit',s.unit));
      row.appendChild(chk);row.appendChild(sk);row.appendChild(vd);
      st.appendChild(row);
    }else{
      const row=el('div','ansrow');
      const rb=el('button','btn','Show strong answer');
      const mk=el('div','selfmark hidden');
      mk.innerHTML='<span style="font-size:13px;color:#9fb0c3">Did you cover it?</span>';
      const g=el('button','btn sm','Yes');const n=el('button','btn ghost sm','Partly');
      g.onclick=()=>{mark(id,'ok');mk.innerHTML='<span class="done-badge">✓ Logged</span>'};
      n.onclick=()=>{mark(id,'seen');mk.innerHTML='<span style="font-size:13px;color:#d29922">Flagged — revisit</span>'};
      mk.appendChild(g);mk.appendChild(n);
      rb.onclick=()=>{reveal();rb.classList.add('hidden');mk.classList.remove('hidden')};
      row.appendChild(rb);st.appendChild(row);st.appendChild(mk);
    }
    st.appendChild(solWrap);
    if(i>0)st.classList.add('locked');
    stepEls.push(st);
    b.appendChild(st);
  });
  box.appendChild(b);
  return box;
}

const MODULES=[];
function ids(m){
  const out=[];
  (m.sprints||[]).forEach((s,i)=>out.push(m.id+'-s'+i));
  (m.drills||[]).forEach((d,i)=>out.push(m.id+'-d'+i));
  if(m.mcase)m.mcase.steps.forEach((s,i)=>out.push(m.id+'-c'+i));
  return out;
}
function countable(m){return ids(m).length}
function doneCount(m){return ids(m).filter(i=>got(i)==='ok').length}

let CURRENT=0;
function phase(n,label){
  const p=el('div','phase');
  p.appendChild(el('span','pill',n+' · '+label));
  p.appendChild(el('div','rule'));
  return p;
}
function renderModule(i){
  CURRENT=i;
  const m=MODULES[i];
  const main=$('#main');main.innerHTML='';window.scrollTo(0,0);
  const h=el('div','mhead');
  h.appendChild(el('div','kicker','Module '+(i+1)+' of '+MODULES.length+' · '+m.tag));
  h.appendChild(el('h2','',m.title));
  h.appendChild(el('p','sub',m.sub));
  main.appendChild(h);

  main.appendChild(phase('01','Concept'));
  renderBlocks(m.concept,main);

  if((m.drills||[]).length||(m.sprints||[]).length){
    main.appendChild(phase('02','Practice'));
    (m.sprints||[]).forEach((s,k)=>main.appendChild(renderSprint(s,m.id,k)));
    (m.drills||[]).forEach((d,k)=>main.appendChild(renderDrill(d,k,m.id)));
  }
  if(m.mcase){
    main.appendChild(phase('03','Mini case'));
    main.appendChild(renderCase(m.mcase,m.id));
  }
  const nav=el('div','modnav');
  const prev=el('button','btn ghost','←  '+(i>0?MODULES[i-1].title:''));
  const next=el('button','btn',(i<MODULES.length-1?MODULES[i+1].title:'')+'  →');
  if(i===0)prev.style.visibility='hidden';
  if(i===MODULES.length-1)next.style.visibility='hidden';
  prev.onclick=()=>renderModule(i-1);
  next.onclick=()=>renderModule(i+1);
  nav.appendChild(prev);nav.appendChild(next);
  main.appendChild(nav);
  paintNav();
}
function paintNav(){
  const nav=$('#nav');nav.innerHTML='';
  MODULES.forEach((m,i)=>{
    const li=el('li');
    const b=el('button',i===CURRENT?'on':'');
    const d=doneCount(m),t=countable(m);
    b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+m.title+'</span>'+
      (t&&d>=t?'<span class="tick">✓</span>':
       (d?'<span class="tick" style="color:#6b7d92;font:600 10px var(--mono)">'+d+'/'+t+'</span>':''));
    b.onclick=()=>renderModule(i);
    li.appendChild(b);nav.appendChild(li);
  });
}
function paintProgress(){
  let done=0,tot=0;
  MODULES.forEach(m=>{done+=doneCount(m);tot+=countable(m)});
  const pct=tot?Math.round(done/tot*100):0;
  $('#progpct').textContent=pct+'%';
  $('#progtxt').textContent=done+' of '+tot+' exercises';
  const C=2*Math.PI*15.5;
  $('#ringfg').setAttribute('stroke-dasharray',C);
  $('#ringfg').setAttribute('stroke-dashoffset',C*(1-pct/100));
}
$('#resetbtn').onclick=()=>{
  if(!confirm('Erase all saved progress and scores?'))return;
  ST={};save();paintProgress();renderModule(CURRENT);
};
function boot(){paintNav();paintProgress();renderModule(0)}

GENS.pct=()=>{
  const p=PICK([5,10,12.5,15,20,25,30,33.3,40,60,75,80]);
  const b=PICK([40,60,80,120,150,240,320,450,600,800,1200,2400]);
  return {q:fmt(p,p%1?1:0)+'% of '+fmt(b,0),a:p/100*b,dec:1};
};
GENS.ratio=()=>{
  const n=RND(2,40)*PICK([1,10,100]);
  const d=RND(2,25)*PICK([1,10]);
  return {q:fmt(n,0)+' ÷ '+fmt(d,0)+'  (as a %)',a:n/d*100,dec:1,tol:0.02};
};
GENS.growth=()=>{
  const a=PICK([40,55,80,120,160,220,340,480,650,900]);
  const g=PICK([-25,-15,-8,5,12,18,25,35,50]);
  const b=Math.round(a*(1+g/100));
  return {q:'Grew '+fmt(a,0)+' → '+fmt(b,0)+'. Growth %?',a:(b-a)/a*100,dec:1,tol:0.03};
};
GENS.cagr=()=>{
  const g=PICK([2,3,4,5,6,7,8,9,10,12,15]);
  const y=PICK([3,4,5,6,7,8,9,10]);
  return {q:'Rule of 72: '+g+'% growth — years to double?',a:72/g,dec:1,tol:0.06,_y:y};
};
GENS.margin=()=>{
  const rev=PICK([200,400,500,750,1000,1600,2500]);
  const m=PICK([4,6,8,10,12,15,18,22,25,30]);
  return {q:'Revenue '+fmt(rev,0)+', margin '+m+'% → profit?',a:rev*m/100,dec:0};
};
GENS.breakeven=()=>{
  const fc=PICK([200,360,500,720,900,1200])*1000;
  const cm=PICK([4,5,6,8,9,10,12,15,20]);
  return {q:'Fixed cost $'+fmt(fc,0)+', contribution $'+cm+'/unit → breakeven units?',a:fc/cm,dec:0,tol:0.02};
};
GENS.bigmult=()=>{
  const a=PICK([12,15,18,24,25,32,35,40,45,60,75,80]);
  const b=PICK([12,20,24,25,30,40,50,60,80,120]);
  const s=PICK([1e3,1e6]);
  return {q:fmt(a,0)+' × '+fmt(b,0)+' '+(s===1e6?'million':'thousand'),a:a*b*s,dec:0};
};

WIDGETS.opLeverage=()=>sliderPanel({
  title:'Operating leverage lab',
  sub:'Same $10 price. Drag volume and see how a high-fixed-cost player swings vs a high-variable-cost player.',
  inputs:[
    {k:'vol',label:'Units sold (000s)',min:20,max:300,step:5,val:100,fmt:v=>fmt(v,0)+'k'},
    {k:'fcA',label:'Firm A fixed cost ($k)',min:100,max:900,step:25,val:600,fmt:v=>'$'+fmt(v,0)+'k'},
    {k:'vcA',label:'Firm A variable cost ($/unit)',min:1,max:9,step:.5,val:3,fmt:v=>'$'+fmt(v,1)}
  ],
  compute:v=>{
    const price=10, volUnits=v.vol*1000;
    const rev=price*volUnits;
    const profA=rev-v.vcA*volUnits-v.fcA*1000;
    const fcB=100000, vcB=8;
    const profB=rev-vcB*volUnits-fcB;
    const beA=(v.fcA*1000)/(price-v.vcA)/1000;
    return {
      chart:{type:'bar',pre:'$',dec:0,
        max:Math.max(500000,niceMax(Math.max(rev,Math.abs(profA),Math.abs(profB)))),
        data:[{label:'Revenue',value:rev,color:'#4f9cf9'},
              {label:'Firm A profit',sub:'high fixed',value:Math.max(0,profA),color:profA>=0?'#3fb950':'#f85149'},
              {label:'Firm B profit',sub:'high variable',value:Math.max(0,profB),color:profB>=0?'#3fb950':'#f85149'}],h:250},
      readouts:[
        {label:'Firm A profit',val:(profA<0?'-$':'$')+fmt(Math.abs(profA),0),color:profA>=0?'#3fb950':'#f85149'},
        {label:'Firm B profit',val:(profB<0?'-$':'$')+fmt(Math.abs(profB),0),color:profB>=0?'#3fb950':'#f85149'},
        {label:'Firm A breakeven volume',val:fmt(beA,0)+'k units'},
        {label:'Firm B breakeven volume',val:fmt(fcB/(price-vcB)/1000,0)+'k units'}
      ]
    };
  },
  note:'Firm B is fixed at $100k fixed / $8 variable. Notice: A loses more below breakeven and earns more above it — that is operating leverage, and it is why cost structure drives how you should answer "what happens if volume drops 20%?"'
});

WIDGETS.elasticity=()=>sliderPanel({
  title:'Price / elasticity lab',
  sub:'Baseline: 100k units at $20, variable cost $12, fixed cost $500k. Change price and see volume respond at the elasticity you set.',
  inputs:[
    {k:'dp',label:'Price change',min:-30,max:30,step:1,val:10,fmt:v=>(v>0?'+':'')+v+'%'},
    {k:'e',label:'Price elasticity of demand',min:0,max:3,step:.1,val:1.2,fmt:v=>'-'+fmt(v,1)},
    {k:'vc',label:'Variable cost / unit',min:4,max:18,step:.5,val:12,fmt:v=>'$'+fmt(v,1)}
  ],
  compute:v=>{
    const p0=20,q0=100000,fc=500000;
    const p1=p0*(1+v.dp/100);
    const q1=q0*(1+(-v.e)*(v.dp/100));
    const prof0=(p0-v.vc)*q0-fc, prof1=(p1-v.vc)*q1-fc;
    return {
      chart:{type:'bar',pre:'$',dec:0,h:250,
        data:[{label:'Revenue before',value:p0*q0,color:'#6b7d92'},
              {label:'Revenue after',value:Math.max(0,p1*q1),color:'#4f9cf9'},
              {label:'Profit before',value:Math.max(0,prof0),color:'#6b7d92'},
              {label:'Profit after',value:Math.max(0,prof1),color:prof1>=prof0?'#3fb950':'#f85149'}]},
      readouts:[
        {label:'New price',val:'$'+fmt(p1,2)},
        {label:'New volume',val:fmt(q1/1000,0)+'k units'},
        {label:'Profit change',val:(prof1-prof0>=0?'+$':'-$')+fmt(Math.abs(prof1-prof0),0),color:prof1>=prof0?'#3fb950':'#f85149'},
        {label:'Breakeven volume drop tolerable',val:fmt((1-(p0-v.vc)/(p1-v.vc))*100,1)+'%'}
      ]
    };
  },
  note:'Last readout is the key case number: after a price rise, how much volume you can lose before profit falls. Formula: 1 − (old contribution ÷ new contribution).'
});

WIDGETS.profitTree=()=>sliderPanel({
  title:'Profit driver sensitivity',
  sub:'Baseline profit = $12M on $100M revenue. Move one driver at a time and watch profit — this is how you prioritise where to dig.',

MODULES.push({
  id:'m01',tag:'Foundations',
  title:'Case anatomy & the interviewer-led format',
  sub:'What actually happens in the 30 minutes, what is being scored, and the four moves you repeat in every case.',
  concept:[
    {title:'The five beats of a case',card:`
      <p>Almost every MBB case runs the same arc. Know the arc and you never feel lost.</p>
      <ol>
        <li><strong>Prompt</strong> — interviewer reads the situation and the client's question. You take notes and <em>listen for the objective</em>.</li>
        <li><strong>Clarify + restate</strong> — 30–60 seconds. Play back the situation and the objective, ask 2–3 sharp questions.</li>
        <li><strong>Structure</strong> — you take 60–90 seconds of silence, then present a MECE framework tailored to <em>this</em> problem.</li>
        <li><strong>Analysis</strong> — a sequence of quant questions, exhibits, and brainstorms. This is 60–70% of the clock.</li>
        <li><strong>Synthesis</strong> — a 60–90 second answer-first recommendation with support, risks, and next steps.</li>
      </ol>`},
    {title:'Interviewer-led vs candidate-led — and why it matters here',card:`
      <p><strong>Interviewer-led (McKinsey-style)</strong>: the interviewer drives. You get discrete questions — "how would you structure this?", "what does Exhibit 2 tell you?", "what's the breakeven?" — and they steer you between them. You are <em>not</em> expected to say "next I'd like to look at costs." You are expected to answer <em>this</em> question completely and insightfully.</p>
      <p><strong>Candidate-led (BCG/Bain-style)</strong>: you drive. You pick which branch to go down, ask for the data you want, and manage the clock.</p>
      <p>This course is weighted interviewer-led, so the drills mirror that: sharply-bounded questions, heavy exhibit interpretation, and an explicit "so what / what next" on every answer.</p>
      <div class="tip"><b>Carry-over skill:</b> everything here works in a candidate-led case too. The only difference is who says "let's look at costs next."</div>`},
    {title:'What is actually being scored',card:`
      <ul>
        <li><strong>Structure</strong> — is your framework MECE, tailored, and prioritised? Do you say <em>why</em> each branch matters?</li>
        <li><strong>Quantitative</strong> — can you set up the math yourself, execute cleanly out loud, sanity-check, and interpret?</li>
        <li><strong>Judgment / business sense</strong> — do your hypotheses sound like they came from someone who has seen a P&amp;L?</li>
        <li><strong>Communication</strong> — top-down, signposted, concise. Answer first, then support.</li>
        <li><strong>Personal Experience Interview (PEI)</strong> — separate ~15-20 min at McKinsey on a real story (leadership, personal impact, inclusive leadership). Not covered by frameworks — prepare 3 deep stories with <em>your</em> actions and quantified outcomes.</li>
      </ul>
      <div class="trap"><b>The most common silent failure:</b> giving a correct number with no interpretation. Every number must end with a "so what." "Breakeven is 240k units — that's 2.4× current volume, so this launch only works if we can triple distribution."</div>`},
    {title:'The four moves you repeat all case long',card:`
      <div class="f">1. RESTATE  → confirm objective + success metric
2. STRUCTURE → break the problem into MECE drivers
3. QUANTIFY  → set up the equation before touching numbers
4. SO WHAT   → interpret, then say what you'd check next</div>
      <p>Every drill in this course is one of these four moves. If you feel lost mid-case, ask yourself which of the four you owe the interviewer right now.</p>`},
    {title:'Note-taking layout that survives contact',card:`
      <p>Use three pages, not one:</p>
      <ul>
        <li><strong>Page 1 — Prompt page.</strong> Client, situation, objective (circled, with the number and the deadline), constraints.</li>
        <li><strong>Page 2 — Structure page.</strong> Your tree. Leave whitespace to write data into the branches as you get it.</li>
        <li><strong>Page 3 — Math page.</strong> One calculation per block, labeled, units written every time.</li>
      </ul>
      <div class="note"><b>Why:</b> when synthesis comes, you read your structure page top-down and the recommendation writes itself. Candidates who use one messy page ramble at the end.</div>`}
  ],
  drills:[
    {type:'mcq',
     q:'The interviewer finishes the prompt. What is your first move?',
     body:'<p>"Our client is a $2B regional grocery chain. Profits have declined for three straight years. The CEO wants to know why and what to do about it."</p>',
     options:[
       'Immediately lay out a profitability framework — revenue minus costs, split each side.',
       'Restate the situation and objective, then ask 2–3 clarifying questions before structuring.',
       'Ask for the P&amp;L data so you can find the problem in the numbers.',
       'Ask for a minute to think, then present your structure.'],
     correct:1,
     hints:['Two things must happen before a framework: confirming you heard the objective, and learning enough to tailor the framework.'],
     sol:`<p><strong>B.</strong> Restating buys you credibility and catches misheard details cheaply. Then clarify — and clarify with purpose, not ritual.</p>
       <p>Good questions here: <em>Is the decline in absolute profit or margin? Is it revenue-driven, cost-driven, or both? Is this decline industry-wide or client-specific? What's the CEO's target — restore prior profit, or a specific number by a specific date?</em></p>
       <p>Bad questions: anything you could deduce yourself, or a laundry list of six questions that signals you're stalling.</p>
       <p>A is premature — an untailored framework is the #1 structure ding. C skips your own thinking. D is fine <em>after</em> B, not instead of it.</p>`},

    {type:'mcq',
     q:'Which clarifying question adds the most value on that grocery prompt?',
     options:[
       '"When you say profits, do you mean absolute profit or profit margin — and over what period?"',
       '"How many stores does the client operate?"',
       '"Is the client publicly traded?"',
       '"What is the client\'s current market share?"'],
     correct:0,
     hints:['Which answer would change the shape of your framework, not just add a fact?'],
     sol:`<p><strong>A.</strong> Absolute profit falling while margin holds means a volume/revenue story. Margin falling while revenue grows means a cost or mix story. That single answer redirects your entire tree — that's what makes it a high-value clarification.</p>
       <p>B, C, D are facts you'll get during analysis anyway. They don't change your structure, so they don't earn their 20 seconds at the top.</p>
       <div class="tip"><b>Test for a clarifying question:</b> "Would a different answer make me draw a different framework?" If no, save it.</div>`},

    {type:'open',
     q:'Restate this prompt in under 30 seconds, out loud.',
     body:`<p>"Our client is NorthPeak, a European ski resort operator with 12 resorts. Over the last five seasons EBITDA has fallen from €180M to €120M even though visitor numbers are flat. The CEO wants to be back at €180M within three years. How would you approach this?"</p>
       <p>Say it aloud, then reveal the model.</p>`,
     hints:['Structure a restatement as: client + situation + the quantified objective + the constraint or time frame + your one-line approach.'],
     sol:`<p><em>"So, our client NorthPeak operates 12 European ski resorts. EBITDA has fallen a third — from €180M to €120M over five seasons — while visitor volume has held flat, which tells me this is a per-visitor economics problem rather than a demand problem. The objective is to get back to €180M EBITDA within three years. Did I capture that correctly?"</em></p>
       <p>Then: <em>"Before I structure, two questions: is the €60M gap concentrated in specific resorts or spread evenly? And has the decline been in revenue per visitor, in cost per visitor, or both?"</em></p>
       <p>Notice three things: (1) you quantified the gap yourself — €60M, a third; (2) you drew a first inference from flat volume; (3) you asked permission to proceed. That is a strong 25 seconds.</p>`},

    {type:'mcq',
     q:'Mid-case, the interviewer says: "Interesting — but let\'s set that aside and look at the cost side." What does this mean?',
     options:[
       'Your analysis was wrong and you should apologise and reset.',
       'A redirect. Note where you were, drop it cleanly, and go where they point — with full energy.',
       'A test of conviction — push back and defend your branch.',
       'The case is running long and they are rescuing you.'],
     correct:1,
     hints:['In an interviewer-led case, who owns the agenda?'],
     sol:`<p><strong>B.</strong> In interviewer-led cases the interviewer owns the path. Redirects are routine — often because they know the interesting data lives elsewhere, or because the case has a fixed set of questions to get through.</p>
       <p>Say: <em>"Sure — I'll park the pricing thread and come back to it in my recommendation if it's still relevant. On costs, I'd split them into..."</em> That single sentence shows composure and keeps your thread alive for synthesis.</p>
       <div class="trap"><b>Don't</b> defend the branch. Conviction is scored on your <em>analysis</em>, not on refusing to move.</div>`},

    {type:'open',
     q:'What are your three go-to hypotheses for any "profits are falling" prompt, before you see a single number?',
     hints:['A hypothesis names a driver and a direction. "Costs went up" is not a hypothesis; "input costs rose faster than we passed through in price" is.'],
     sol:`<p>Strong opening hypotheses are specific and testable:</p>
       <ul>
         <li><strong>Price/mix erosion</strong> — realised price per unit has fallen (discounting, mix shift to cheaper SKUs, channel shift), while volume looks stable.</li>
         <li><strong>Cost inflation not passed through</strong> — a specific input (labour, energy, freight, COGS) rose faster than price, compressing contribution margin.</li>
         <li><strong>Operating deleverage</strong> — fixed cost base grew (new capacity, overhead, footprint) while volume did not, so fixed cost per unit rose.</li>
       </ul>
       <p>State them as: <em>"My leading hypothesis is margin compression from input costs we haven't passed through — I'd test that by comparing revenue per unit against COGS per unit over the same five years."</em> Naming the test is what separates a hypothesis from a guess.</p>`}
  ],
  mcase:{
    title:'NorthPeak Resorts — running the opening',
    prompt:`<p>You are with a McKinsey EM. The client is <strong>NorthPeak</strong>, operator of 12 European ski resorts.</p>
      <p>EBITDA has fallen from €180M to €120M over five seasons. Visitor numbers are flat at 6.0M per year. The CEO wants €180M EBITDA within three years and has asked us to diagnose the decline and identify the biggest recovery levers.</p>
      <p>We will run the first four minutes of this case.</p>`,
    steps:[
      {kind:'Restate & clarify',
       q:'Give me your restatement and your clarifying questions.',
       sol:`<p><em>"NorthPeak runs 12 European ski resorts. EBITDA is down €60M — a third — over five seasons, while visitors held flat at 6M, so the problem is in economics per visitor rather than demand. Target is €180M within three years. Two questions: first, is the decline concentrated in a few resorts or broad-based? Second, do we know whether revenue per visitor or cost per visitor moved more?"</em></p>
         <p><strong>Interviewer:</strong> "Decline is broad-based across all 12. Revenue per visitor is roughly flat in nominal terms; costs per visitor have risen."</p>
         <div class="tip"><b>Read the gift:</b> they just told you it's a cost story and that flat nominal revenue means <em>declining real</em> revenue. Your structure should now be cost-weighted, and you should flag the pricing-below-inflation point.</div>`},

      {kind:'Quantify the gap',
       q:'Given 6.0M visitors, EBITDA fell from €180M to €120M. What is the change in EBITDA per visitor?',
       unit:'€ per visitor', a:10, tol:0.02,
       ph:'e.g. 12',
       sol:`<div class="f">€180M ÷ 6.0M visitors = €30.00 per visitor
€120M ÷ 6.0M visitors = €20.00 per visitor
Change = €10.00 per visitor  (−33%)</div>
         <p>Say the "so what": <em>"We've lost €10 of EBITDA per visitor, a third of the total. Since revenue per visitor is flat nominally, essentially all €10 is cost per visitor. That tells me to size cost buckets per visitor before anything else."</em></p>
         <p>That framing — converting a headline number into a per-unit number — is the single highest-value habit in case math. It makes every later number comparable.</p>`},

      {kind:'Structure',
       q:'Now lay out your structure for finding the €60M.',
       sol:`<p>A tailored, cost-weighted tree — not a generic profitability framework:</p>
         <div class="f">EBITDA gap: €60M (€10 per visitor)
├─ 1. COST PER VISITOR  (primary — we know it moved)
│   ├─ Labour: lift ops, ski school, F&amp;B, patrol  → wage rate × hours per visitor
│   ├─ Energy: lifts + snowmaking                   → €/kWh × kWh per visitor
│   ├─ Maintenance &amp; capex depreciation            → asset base age, snowmaking build-out
│   └─ SG&amp;A / corporate overhead                    → fixed, so check operating deleverage
├─ 2. REVENUE PER VISITOR  (secondary — flat nominal = falling real)
│   ├─ Lift ticket yield: list price, discounting, season-pass mix
│   ├─ Ancillary: F&amp;B, rental, school, lodging attach rates
│   └─ Mix: day visitors vs multi-day, domestic vs international
└─ 3. EXTERNAL / STRUCTURAL
    ├─ Snow reliability &amp; season length (drives both cost and revenue)
    └─ Competitor pricing — are peers also flat, or did they raise?</div>
         <p>Then <strong>prioritise out loud</strong>: <em>"I'd start with branch 1 because we know costs moved, and within it I'd size labour and energy first — for a ski operator those are typically the two largest controllable buckets. But I'd want to spend real time on 2, because flat nominal pricing over five years of inflation is itself a €X problem, and it's usually the faster lever."</em></p>
         <div class="note"><b>What earns the structure score:</b> the tree is MECE, it's specific to ski resorts (snowmaking, lift ops, season-pass mix — not "marketing, operations, other"), and you told them where you'd go first <em>and why</em>.</div>`},

      {kind:'So what',
       q:'The interviewer says: "Suppose I told you competitors raised lift prices 4% a year while NorthPeak held flat. What does that mean?"',
       sol:`<p>Answer first, then size it, then say what you'd check:</p>
         <p><em>"That reframes this as a self-inflicted pricing problem, not just a cost problem. If we had matched 4% annual increases for five years, lift revenue per visitor would be roughly 22% higher — compounding 1.04 over five years is about 1.22."</em></p>
         <div class="f">Sanity size: if lift revenue is ~€50 per visitor,
22% × €50 = ~€11 per visitor × 6.0M visitors ≈ €66M
— on its own, larger than the entire €60M gap.</div>
         <p><em>"So pricing alone could close the gap, which makes it my leading recovery lever. But before recommending it I'd want to know why we held price: was it a deliberate volume-share strategy, a contractual constraint on season passes, or simply drift? And I'd want the demand elasticity — if we lose more than roughly [contribution-based threshold] of visitors, the increase destroys value."</em></p>
         <div class="tip"><b>Pattern to steal:</b> answer → rough size → the one question that could invalidate it. Three sentences, and you sound like a consultant instead of a student.</div>`}
    ]
  }
});

   ========================================================================= */
MODULES.push({
  id:'m02',tag:'Foundations',
  title:'Structuring & MECE issue trees',
  sub:'How to build a tree that is genuinely mutually exclusive, collectively exhaustive, and tailored — in 90 seconds.',
  concept:[
    {title:'MECE, precisely',card:`
      <p><strong>Mutually Exclusive</strong> — no item belongs in two buckets. <strong>Collectively Exhaustive</strong> — nothing relevant falls outside the buckets.</p>
      <p>The classic failure is a tree like "Revenue / Costs / Marketing / Competition." Marketing is a cost <em>and</em> a revenue driver (not exclusive), and competition sits outside the P&amp;L entirely (mixing levels). It reads like a list of words rather than a decomposition.</p>
      <div class="f">Not MECE:  Revenue | Costs | Marketing | Competition
MECE:      Profit = Revenue − Costs
             Revenue = Volume × Price
             Costs   = Fixed + Variable
           (Competition = a *cause* you test inside these branches)</div>`},
    {title:'The four reliable decomposition types',card:`
      <ol>
        <li><strong>Algebraic</strong> — the tree is an equation. <em>Profit = (P − VC) × Q − FC.</em> Always MECE by construction. Use whenever the objective is a number.</li>
        <li><strong>Process / value chain</strong> — sequential steps. <em>Raw material → manufacture → distribute → retail → after-sales.</em> Great for cost and operations cases.</li>
        <li><strong>Segment</strong> — cut the business by customer, product, geography, or channel. <em>Where</em> is the problem, before <em>why</em>.</li>
        <li><strong>Stakeholder / conceptual</strong> — customer, competitor, company, (and sometimes regulator). Use for qualitative questions like "should we enter?" — but always hang numbers off it.</li>
      </ol>
      <div class="tip"><b>Default:</b> if the objective has a number in it, lead with algebraic. It is the only type that can't be accused of missing a branch.</div>`},
    {title:'Tailoring — what turns a framework into a structure',card:`
      <p>Three moves take a generic tree to a tailored one:</p>
      <ul>
        <li><strong>Use the client's nouns.</strong> Not "variable costs" but "cost per flight hour: fuel, crew, landing fees, maintenance reserve."</li>
        <li><strong>Pre-load a hypothesis on each branch.</strong> "I'd expect fuel to be the swing factor given jet fuel moved 40%."</li>
        <li><strong>Prioritise explicitly.</strong> "I'd start here because it is both the largest bucket and the most controllable."</li>
      </ul>
      <div class="trap"><b>Ding:</b> presenting five equally-weighted branches with no view. Interviewers read that as "hasn't thought about the business."</div>`},
    {title:'Depth: go three levels, not two',card:`
      <div class="f">L1  Revenue
L2    Volume            L2  Price
L3      # customers       L3   list price
L3      purchases/cust    L3   discount %
L3      units/purchase    L3   mix</div>
      <p>Level 3 is where cases actually get solved — it's the level at which you can ask for data. A two-level tree forces the interviewer to do your thinking.</p>`},
    {title:'The 90-second delivery script',card:`
      <div class="f">"I'd like to take 60 seconds to structure."      ← ask
[silence, write the tree, number the branches]
"I'd break this into three areas.
 First, [branch] — because [why it matters here].
 Second, [branch] — where I'd look at [L3 items].
 Third, [branch] — the external check.
 I'd start with the first, because [size or controllability].
 Does that work as a starting point?"</div>
      <p>Signposting with "first / second / third" is not filler — it is how the interviewer follows you without a copy of your page.</p>`}
  ],
  drills:[
    {type:'mcq',
     q:'Which tree is MECE for "why has our airline\'s profit per flight fallen?"',
     options:[
       'Fuel costs / labour costs / customer satisfaction / competition from low-cost carriers',
       'Revenue per flight (load factor × seats × yield) vs cost per flight (fuel, crew, ownership, airport, maintenance)',
       'Pricing / operations / marketing / strategy',
       'Short-haul routes / long-haul routes / cargo / loyalty programme'],
     correct:1,
     hints:['Which option is an equation that must add up, rather than a list of topics?'],
     sol:`<p><strong>B.</strong> It is algebraic and complete: profit per flight = revenue per flight − cost per flight, and each side is decomposed into drivers you can request data for.</p>
       <p>A mixes cost items with a driver (satisfaction) and an external force (competition) — three different levels, not exclusive. C is four topic words, the most common weak structure. D is a segment cut — legitimate as a <em>second</em> cut ("where is the problem?"), but it doesn't explain <em>why</em> profit per flight fell, and cargo/loyalty aren't per-flight units, so it isn't even clean.</p>
       <div class="tip"><b>Good sequence:</b> algebraic tree first (why), segment cut second (where). D becomes excellent once B has told you it's a yield problem.</div>`},

    {type:'open',
     q:'Build a three-level tree for: "A hospital system wants to reduce average patient length of stay."',
     hints:['Length of stay is a process outcome. Which decomposition type fits a sequence of steps with handoffs?','Think about time as a sum of segments: admission → treatment → discharge, plus the delays between them.'],
     sol:`<p>Process decomposition, because length of stay is literally a sequence of elapsed times:</p>
       <div class="f">Average length of stay = Σ time in each phase

├─ 1. PRE-TREATMENT
│   ├─ ED boarding time (waiting for an inpatient bed)
│   ├─ Time to diagnostic (imaging/lab turnaround)
│   └─ Time to attending physician assignment
├─ 2. TREATMENT
│   ├─ Clinically necessary stay by case mix (DRG)
│   ├─ Delays for procedure/OR availability
│   └─ Complication / readmission-driven extension
├─ 3. DISCHARGE
│   ├─ Time from "medically ready" to discharge order written
│   ├─ Discharge paperwork &amp; pharmacy turnaround
│   └─ Placement delay (rehab bed, skilled nursing, home care)
└─ 4. CASE MIX (cross-cutting)
    └─ Is average LOS rising because stays got longer, or because
       we're treating sicker patients? — always separate mix from rate</div>
       <p>Two things make this strong: branch 3 (discharge friction is where most real LOS savings hide — the "medically ready but stuck" hours), and branch 4, which prevents the classic mix-vs-rate error.</p>
       <p>Prioritise out loud: <em>"I'd start with discharge, because it's typically the largest non-clinical component and doesn't require changing care protocols — so it's both the biggest and the most implementable."</em></p>`},

    {type:'mcq',
     q:'A retailer\'s same-store sales are down 8%. Which second-level cut is most useful first?',
     options:[
       'Split by cost bucket to find where money is leaking',
       'Split same-store sales into traffic × conversion × average basket',
       'Benchmark against three named competitors',
       'Segment by store manager tenure'],
     correct:1,
     hints:['Same-store sales is a revenue metric. What is the standard retail revenue identity?'],
     sol:`<p><strong>B.</strong> The retail revenue identity is <code>Sales = Traffic × Conversion × Average Transaction Value</code>, and ATV further splits into units per basket × price per unit. Each of the three is measured by every retailer, so it's an actionable ask.</p>
       <p>Crucially, each points to a different diagnosis: traffic down = demand/location/marketing; conversion down = assortment, stockouts, staffing; basket down = mix shift, promo depth, or trade-down.</p>
       <p>A is the wrong side of the P&amp;L for a sales question. C is a useful <em>context</em> check but not a decomposition. D is a hypothesis buried in a segment cut — far too narrow this early.</p>`},

    {type:'num',
     q:'Traffic is down 5%, conversion is up 2%, and average basket is down 5%. What is the change in same-store sales?',
     body:'<p>Multiplicative identity: Sales = Traffic × Conversion × Basket. Give the total change as a percentage (negative for a decline).</p>',
     unit:'%', a:-8.05, tol:0.06, ph:'e.g. -7.5',
     hints:['These multiply, they do not add — though adding gets you close enough for a case.','0.95 × 1.02 × 0.95'],
     sol:`<div class="f">0.95 × 1.02 × 0.95 = 0.9205  →  −7.95%  (≈ −8%)

Quick case shortcut: −5% + 2% − 5% = −8%
Adding is accurate to within ~0.1pp for small changes —
use it live, and say "roughly, ignoring cross-terms."</div>
       <p>Now the "so what": <em>"Traffic and basket are each contributing about half the decline, and conversion is actually improving — so the people who come in are buying more reliably, but fewer come and they spend less each. That points away from an in-store execution problem and toward demand and pricing/mix. I'd want basket split into units versus price per unit next."</em></p>
       <div class="tip"><b>Interview-safe rule:</b> for changes under ~10%, add the percentages. Above that, multiply — at +20% and +20% adding gives 40% but the truth is 44%.</div>`},

    {type:'open',
     q:'Structure this: "Should our regional bank shut down 30% of its branches?"',
     hints:['Decision questions want a decision tree, not a diagnosis tree. What must be true for the answer to be yes?','Include the thing candidates always forget: what happens to the customers and deposits attached to closed branches.'],
     sol:`<p>For a yes/no decision, structure around <em>criteria that would make it true</em>:</p>
       <div class="f">Should we close 30% of branches?

├─ 1. FINANCIAL CASE
│   ├─ Cost saved per branch: lease, staff, security, IT, D&amp;A
│   ├─ One-time cost: lease break, severance, asset write-down
│   └─ Revenue at risk: deposits &amp; loans that DON'T migrate
│       └─ key ratio: % of branch customers retained digitally/nearby
├─ 2. CUSTOMER &amp; DEMAND
│   ├─ Transaction mix: % teller vs digital, by segment
│   ├─ Segment sensitivity: elderly, small business, cash-heavy retail
│   └─ Overlap: branches within X km of another branch (safe closures)
├─ 3. COMPETITIVE &amp; STRATEGIC
│   ├─ Do competitors still have branches in those catchments?
│   └─ Brand/community effects, regulatory or CRA-type obligations
└─ 4. IMPLEMENTATION &amp; RISK
    ├─ Sequencing (pilot a wave first), staff redeployment
    └─ Downside case: what if deposit attrition is 2× our estimate?</div>
       <p>Then name the swing variable explicitly: <em>"This decision hinges almost entirely on deposit attrition. Cost savings are knowable and near-certain; the revenue loss is the uncertainty. So I'd want to start by finding a natural experiment — branches we've already closed — and measuring what share of balances we retained."</em></p>
       <div class="note"><b>Why this scores:</b> it converts a strategy question into one measurable number. Interviewers reward candidates who identify the crux rather than exploring all branches evenly.</div>`}
  ],
  mcase:{
    title:'Meridian Coffee — structuring a margin decline',
    prompt:`<p><strong>Meridian Coffee</strong> operates 400 company-owned coffee shops in one country. Over two years, revenue grew 6% but EBITDA margin fell from 14% to 9%. The CEO wants margin back to 14% without closing stores.</p>
      <p>Revenue last year was $520M.</p>`,
    steps:[
      {kind:'Size the prize',
       q:'How much EBITDA are we trying to recover, in dollars?',
       unit:'$M', a:26, tol:0.03, ph:'e.g. 25',
       sol:`<div class="f">Current EBITDA = 9% × $520M   = $46.8M
Target EBITDA  = 14% × $520M  = $72.8M
Gap                            = $26.0M   (5pp of revenue)</div>
         <p>Say it as: <em>"We need to find $26M, which is 5 points of margin — that's a big number, roughly 56% more EBITDA than today. That scale tells me trimming one cost line won't do it; I'll need either a pricing move or a structural cost change."</em></p>
         <p>Framing the gap as a <strong>percentage of current EBITDA</strong> (+56%), not just as dollars, is what tells you how aggressive the answer has to be.</p>`},

      {kind:'Structure',
       q:'Structure the margin decline. Remember: revenue grew, margin fell.',
       sol:`<p>The key insight to lead with: <em>revenue grew 6% while margin fell 5 points — so costs grew materially faster than revenue.</em> The structure should be built to find which costs.</p>
         <div class="f">Margin gap: 5pp / $26M

├─ 1. REVENUE PER STORE  (grew 6% total — but how?)
│   ├─ Price per ticket vs units per ticket vs transactions
│   ├─ Mix: beverage vs food; in-store vs to-go vs delivery
│   └─ Channel economics: delivery platforms take 15–30% commission
│       → revenue "grows" while contribution per order falls
├─ 2. COST OF GOODS  (variable, ~25–30% of revenue in coffee)
│   ├─ Green coffee &amp; dairy input prices
│   ├─ Waste / spoilage rate
│   └─ Mix shift toward lower-margin food items
├─ 3. STORE LABOUR  (variable-ish, ~30% of revenue — usually the swing)
│   ├─ Wage rate (minimum wage moves, competitive labour market)
│   ├─ Hours per store (staffing to peak vs demand curve)
│   └─ Turnover → training cost &amp; productivity drag
├─ 4. OCCUPANCY &amp; FIXED  (rent, utilities, D&amp;A)
│   └─ Rent escalators vs flat traffic = operating deleverage
└─ 5. CORPORATE OVERHEAD
    └─ Did SG&amp;A grow with the 6%, or faster?</div>
         <p>Prioritise: <em>"I'd start with labour and delivery-channel mix. Labour because it's the largest controllable line in food service and wage inflation has been the dominant sector story; delivery because it's the one growth channel that can raise revenue while lowering margin — which exactly matches the pattern we're seeing."</em></p>
         <div class="tip"><b>Notice the tailoring:</b> "delivery commission dilutes margin while inflating revenue" is a coffee-shop-specific hypothesis. That one line is worth more than a perfectly symmetrical but generic tree.</div>`},

      {kind:'Test the hypothesis',
       q:'Data: delivery grew from 0% to 18% of revenue over the two years. Delivery orders carry a 25% platform commission and otherwise identical unit economics. What margin impact does that alone explain?',
       unit:'percentage points', a:4.5, tol:0.05, ph:'e.g. 4',
       sol:`<div class="f">18% of revenue now flows through delivery
Each delivery dollar loses 25% to commission
Margin drag = 18% × 25% = 4.5 percentage points</div>
         <p>So delivery alone explains <strong>4.5 of the 5 points</strong> — nearly the entire decline. The remaining 0.5pp is everything else.</p>
         <p>Interpretation to say out loud: <em>"This reframes the case completely. Meridian doesn't have a cost-control problem — it has a channel-economics problem. Revenue grew 6% partly by buying growth through a channel that keeps a quarter of every dollar. Before recommending cost cuts anywhere, I'd want to know whether delivery orders are incremental or cannibalising in-store."</em></p>
         <div class="note"><b>That last question is the whole case.</b> If delivery is incremental volume, 75 cents on the dollar of contribution is still worth having and the fix is pricing/fees, not exit. If it cannibalises walk-ins, Meridian is paying 25% commission on customers it already had — and that is destroying value outright.</div>`},

      {kind:'Recommendation',
       q:'Give me your 60-second recommendation to the CEO.',
       sol:`<p><strong>Answer first:</strong> <em>"Meridian's margin decline is almost entirely a delivery channel-economics problem, not a cost-discipline problem. Delivery is now 18% of revenue at a 25% commission, which explains 4.5 of the 5 points lost. I'd recommend repricing the delivery channel rather than cutting store costs."</em></p>
         <p><strong>Support — three moves:</strong></p>
         <ul>
           <li><strong>Reprice delivery menu +15–20%.</strong> Standard practice, low customer friction — delivery customers are demonstrably convenience-driven and less price-sensitive. Recovers roughly 3 of the 4.5 points.</li>
           <li><strong>Renegotiate commission or shift to own-channel.</strong> At 18% of $520M — about $94M of GMV — Meridian has real leverage; and driving orders to its own app removes the commission entirely on the share that migrates.</li>
           <li><strong>Protect the in-store experience.</strong> If delivery is cannibalising, the highest-return move is making walk-in worth it (speed, loyalty pricing) rather than chasing delivery volume.</li>
         </ul>
         <p><strong>Risks:</strong> delivery volume may be genuinely incremental and elastic — a 20% price rise could shed enough orders to offset the gain; and platform relationships can retaliate on search placement.</p>
         <p><strong>Next steps:</strong> <em>"I'd want two weeks of data: an A/B delivery price test in two cities, and a cohort analysis on whether delivery customers reduced their in-store visits. Those two answers determine whether we reprice, renegotiate, or retreat from the channel."</em></p>
         <div class="tip"><b>Structure of a strong close:</b> answer → 3 supports with sizes → risks → the specific next analysis. Under 90 seconds, no new information introduced.</div>`}
    ]
  }
});
