MODULES.push({
  id:'m11',tag:'Core case type',
  title:'Growth strategy & new products',
  sub:'Where growth comes from, how to sequence it, and how to evaluate a launch.',
  concept:[
    {title:'The growth grid',card:`
      <p>Ansoff's matrix, used properly: growth comes from existing or new products, sold to existing or new customers. Risk rises as you move away from the origin.</p>
      <div class="f">                 EXISTING PRODUCT      NEW PRODUCT
EXISTING       Market penetration     Product development
CUSTOMERS      • more usage/frequency • adjacent products
               • share of wallet      • upsell/premium tiers
               • win from competitors • bundles
               (cheapest, do first)

NEW            Market development     Diversification
CUSTOMERS      • new geographies      • new business entirely
               • new segments         (highest risk,
               • new channels          usually via M&A)</div>
      <p>Sequence matters: penetration is cheapest because you already have the product and the relationship. Recommend it first unless something specific blocks it — then say what that thing is.</p>`},
    {title:'Organic growth levers, decomposed',card:`
      <div class="f">Revenue = Customers × Frequency × Basket size

CUSTOMERS       acquisition, retention (cheaper!), reactivation
FREQUENCY       usage occasions, subscription, habit design,
                reducing friction to repurchase
BASKET          attach rate, premium mix, bundling, price</div>
      <p><strong>Retention beats acquisition almost always.</strong> Acquiring a customer typically costs 5–7× retaining one, and existing customers convert at far higher rates. When a client asks about growth, check churn before checking marketing spend — a business leaking 20% annually is filling a bucket with a hole in it.</p>`},
    {title:'Evaluating a new product launch',card:`
      <ol>
        <li><strong>Demand:</strong> is there an unmet need, and how many people have it? (market sizing)</li>
        <li><strong>Economics:</strong> price, cost, contribution, breakeven volume, required share.</li>
        <li><strong>Cannibalisation:</strong> how much of the new product's volume comes from our own existing products?</li>
        <li><strong>Capability:</strong> can we make, distribute, and support it?</li>
        <li><strong>Competitive response:</strong> how fast can incumbents copy it?</li>
      </ol>
      <div class="f">TRUE incremental profit =
   New product contribution
 − (Cannibalised volume × old product contribution)
 − Incremental fixed costs</div>
      <div class="trap"><b>Cannibalisation is the most-missed element in launch cases.</b> A new $30 product that takes 40% of its volume from your existing $25 product is not adding 100% new revenue — and if the old product had a higher margin, the launch can reduce profit while increasing revenue.</div>`},
    {title:'When cannibalisation is fine',card:`
      <p>Three situations where cannibalising yourself is the correct move:</p>
      <ul>
        <li><strong>Defensive:</strong> if you don't launch it, a competitor will and takes the volume permanently. Better to cannibalise yourself than be cannibalised.</li>
        <li><strong>Trade-up:</strong> the new product has higher margin, so switching customers improves mix.</li>
        <li><strong>Market expansion:</strong> the new product reaches a segment that wasn't buying at all, and the cannibalised share is small relative to new demand.</li>
      </ul>
      <p>Say which applies: <em>"I'd expect 35% cannibalisation, but since the new product carries $4 more contribution per unit, cannibalised customers are actually more valuable after the switch. The launch is accretive even before counting new customers."</em></p>`},
    {title:'Prioritising growth initiatives',card:`
      <p>When a client has ten ideas, score them on three axes and be explicit about the weighting:</p>
      <div class="f">SIZE           how much revenue/profit at maturity?
FEASIBILITY    do we have the capability, capital, and right to win?
SPEED          months to first revenue; months to full run-rate

Recommend: 1 big structural bet + 2–3 quick wins.
The quick wins fund and de-risk the bet.</div>
      <p>That portfolio shape — one long-horizon move plus near-term proof points — is what executives actually approve, because it produces visible results while the big bet matures.</p>`}
  ],
  drills:[
    {q:'A company has 500,000 customers, 12% annual churn, and adds 80,000 new customers a year. What is net growth, and what would halving churn be worth?',
     body:'<p>Give the net customer growth this year under current churn.</p>',
     unit:'customers', a:20000, tol:0.05, ph:'e.g. 20000',
     hints:['Churned customers = 12% of 500,000.'],
     sol:`<div class="f">Churn loss = 500,000 × 12% = 60,000
Additions                = 80,000
Net growth               = 20,000  (+4%)

If churn halved to 6%:
  Loss = 30,000, net growth = 50,000 (+10%)
  Same marketing spend, 2.5× the growth.</div>
       <p><em>"Cutting churn from 12% to 6% would raise net growth from 4% to 10% with no additional acquisition spend. To achieve the same result through acquisition, the company would need to add 110,000 customers instead of 80,000 — a 38% increase in acquisition volume, which at typical CAC would cost far more than a retention programme."</em></p>
       <div class="tip"><b>Always express a retention improvement as its acquisition equivalent.</b> "Cutting churn by 6 points is worth 30,000 customers a year — the same as increasing marketing spend by 38%" is the sentence that gets the retention budget approved.</div>`},

    {q:'A snack company sells 10M units of Product A at $3 with $1.80 contribution. It launches Product B at $4 with $2.20 contribution, expecting 4M units, 40% of which cannibalise A. What is the incremental annual contribution?',
     unit:'$M', a:5.92, tol:0.05, ph:'e.g. 6',
     hints:['Total B contribution first, then subtract the contribution lost on cannibalised A units.','Cannibalised units = 4M × 40%.'],
     sol:`<div class="f">Product B contribution = 4.0M × $2.20 = $8.80M

Cannibalised A units = 4.0M × 40% = 1.6M
Contribution lost on A = 1.6M × $1.80 = $2.88M

Incremental contribution = $8.80M − $2.88M = $5.92M</div>
       <p>Note what cannibalisation actually costs here: on each switched unit, the company gains $2.20 instead of $1.80 — a net <strong>gain</strong> of $0.40. Cannibalisation is only damaging when the new product has lower contribution than the one it replaces.</p>
       <p><em>"Cannibalisation is often treated as automatically bad, but here it's mildly positive per unit because B carries $0.40 more contribution. The 2.4M genuinely incremental units are the main prize at $5.28M, and the 1.6M switchers add another $0.64M. I'd still want to check whether B requires incremental fixed costs — new production lines or a launch marketing budget — because $5.92M of contribution against a $10M launch spend is a very different conclusion."</em></p>`},

    {type:'mcq',
     q:'A retailer wants 20% revenue growth next year. Which lever should be evaluated first?',
     options:[
       'Opening 40 new stores',
       'Increasing same-store sales through range, pricing, and conversion',
       'Launching an e-commerce channel',
       'Acquiring a regional competitor'],
     correct:1,
     hints:['Which lever uses assets the client already owns?'],
     sol:`<p><strong>B.</strong> Same-store sales growth requires no new capital, has the shortest time to impact, and improves the returns on assets already owned. It should always be evaluated first — and if it can deliver meaningfully, it makes every other option better too, since new stores will then open into a stronger format.</p>
       <p>A adds capital, occupancy cost, and dilutes management attention; new stores also take 2–3 years to mature. C is likely necessary strategically but rarely delivers 20% in year one and often cannibalises stores. D is fastest to revenue but most expensive and riskiest.</p>
       <p><strong>The realistic answer to give:</strong> <em>"20% is a big number and unlikely to come from one lever. I'd expect something like 6–8 points from same-store improvements, 6–8 from new store openings already in the pipeline, and the balance from digital — then check whether the total is credible against the market's own growth rate. If the market is growing 3% and we're targeting 20%, we're planning to take share, and I'd want to know from whom and why they'd let us."</em></p>
       <div class="tip"><b>Sanity-check growth targets against market growth.</b> A target far above market growth is a share-gain plan in disguise and needs a competitive rationale.</div>`},

    {type:'open',
     q:'A mature consumer brand has flat revenue for three years. Generate a prioritised set of growth options.',
     hints:['Use the growth grid, and be specific to a consumer-brand context rather than generic.'],
     sol:`<p><strong>First, diagnose before prescribing:</strong> <em>"Flat revenue could be flat everything, or it could be a declining core offset by a growing new line — those need opposite responses. I'd want revenue split by product, channel, and customer cohort before choosing levers."</em></p>
       <p><strong>Then, prioritised by speed and capital:</strong></p>
       <ul>
         <li><strong>Penetration (0–12 months, low capital).</strong> Increase usage occasions among existing buyers — the classic move for mature brands, since the existing base is the cheapest demand. Improve distribution depth: are we in every store that should carry us, at the right shelf position and facings? Reduce out-of-stocks, which silently cost mature brands several points of sales.</li>
         <li><strong>Product development (12–24 months, medium capital).</strong> Premium tier to trade existing customers up, format extensions (single-serve, multipack, on-the-go) that open new occasions, and adjacent products the brand has permission to sell.</li>
         <li><strong>New channels (6–18 months).</strong> Direct-to-consumer for margin and data, or channels the brand has under-served — foodservice, e-commerce marketplaces, discounters.</li>
         <li><strong>New geographies (18+ months, high capital).</strong> Only if the brand travels and the category exists in the target market.</li>
       </ul>
       <p><strong>The recommendation shape:</strong> <em>"I'd lead with distribution depth and out-of-stock reduction as the immediate win — these are typically worth 2–4 points and require no new product. In parallel, develop one premium format extension as the structural growth bet. I'd defer geographic expansion; entering new markets while the home market is flat usually means exporting a problem."</em></p>
       <div class="note"><b>That last line is a genuine consulting principle:</b> fix the core before expanding. Expansion is often an expensive way to avoid confronting a declining core business.</div>`}
  ],
  mcase:{
    title:'Wildgrain Foods — the meal-kit decision',
    prompt:`<p><strong>Wildgrain Foods</strong> is a $600M packaged-foods company selling through grocery retail. Growth has slowed to 1% a year. The CEO wants to launch a <strong>direct-to-consumer meal-kit subscription</strong> and has asked whether it is the right growth bet.</p>
      <p>Current business: 35% gross margin, 8% EBITDA margin.</p>`,
    steps:[
      {kind:'Structure',
       q:'How would you evaluate whether this is the right growth move?',
       sol:`<p>Frame it as a comparison, not an evaluation in isolation — the CEO has proposed one option and your job is to test it against the alternatives:</p>
         <div class="f">Is DTC meal kits the best growth bet for Wildgrain?

├─ 1. WHY IS THE CORE FLAT?  (diagnose before prescribing)
│   ├─ Category decline vs share loss vs distribution loss
│   └─ If we're losing share, DTC doesn't fix that
├─ 2. IS THE MEAL-KIT OPPORTUNITY ATTRACTIVE?
│   ├─ Market size, growth, and — critically — profitability
│   ├─ Competitive structure: several well-funded players,
│   │   most historically unprofitable
│   └─ Unit economics: CAC, churn, contribution per order
├─ 3. CAN WILDGRAIN WIN?
│   ├─ Capability gap: DTC logistics, cold chain, digital
│   │   marketing, subscription management — all new
│   ├─ Genuine assets: food development, sourcing scale,
│   │   brand recognition
│   └─ Channel conflict: will grocery retailers retaliate?
└─ 4. WHAT ARE THE ALTERNATIVES?
    ├─ Core penetration: distribution depth, innovation
    ├─ Adjacent categories through existing retail channel
    └─ Acquisition of a growing brand</div>
         <p>Flag the concern early and specifically: <em>"My initial hypothesis is that this is a capability-mismatch bet. Wildgrain's advantages — sourcing scale, retail relationships, product development — transfer only partially to a subscription business whose critical competencies are performance marketing, cold-chain fulfilment, and churn management. I'd want to test that before anything else."</em></p>`},

      {kind:'Unit economics',
       q:'Meal-kit assumptions: $70 average order, 35% contribution margin, customers order 2.5 times per month, average customer lifetime 5 months, CAC $180. Is a customer profitable?',
       unit:'$ lifetime contribution', a:437.5, tol:0.06, ph:'e.g. 440',
       sol:`<div class="f">Contribution per order = $70 × 35% = $24.50
Orders per customer = 2.5/month × 5 months = 12.5 orders
Lifetime contribution = 12.5 × $24.50 = $306.25

Less CAC of $180 → net LTV = $126.25
LTV/CAC ratio = 306 ÷ 180 = 1.7×</div>
         <p><em>(Answers from $300–440 accepted depending on whether you netted CAC.)</em></p>
         <p><strong>The verdict:</strong> <em>"An LTV/CAC of 1.7× is well below the 3× benchmark that subscription businesses generally need to be viable, because that ratio has to cover fixed costs, technology, and overhead on top of the contribution. Payback on CAC takes about 7.3 orders — nearly three months — against an average lifetime of five months. That leaves a very thin window of profitability and no margin for CAC inflation."</em></p>
         <p><strong>The sensitivity to name:</strong> <em>"The binding variable is the 5-month lifetime. At 8 months, lifetime contribution rises to $490 and LTV/CAC reaches 2.7× — a viable business. At 3 months it's $184 and the business loses money on every customer. So the entire investment case rests on retention, which is precisely the competency Wildgrain doesn't have and which has bankrupted most of the sector."</em></p>`},

      {kind:'Compare alternatives',
       q:'What would the same investment deliver if deployed in the core business instead?',
       sol:`<p>Make the comparison concrete — that is what makes the recommendation land:</p>
         <div class="f">Suppose the meal-kit launch requires $50M over 3 years
(technology, fulfilment, marketing, working capital).

Same $50M in the core:
  A. Distribution depth + out-of-stock reduction
     Typical gain 2–3 points of revenue = $12–18M/yr
     at 35% gross margin = $4–6M gross profit,
     with minimal capital — mostly execution
  B. Product innovation in existing categories
     A successful new SKU line at $30M revenue,
     35% margin = $10.5M gross profit, using
     existing manufacturing and retail relationships
  C. Acquire a small growing brand
     $50M might buy a $40–60M revenue brand growing
     15%+, immediately accretive and channel-compatible</div>
         <p><em>"All three alternatives use capabilities Wildgrain already has and channels it already controls. The meal-kit option requires building three new competencies simultaneously while competing against players with a decade of head start and better unit economics."</em></p>
         <p><strong>The steel-manning move</strong> — argue the other side before dismissing it: <em>"The strongest case for DTC isn't the P&amp;L, it's the data and the direct customer relationship. Packaged-food companies are structurally blind to their end consumer, and that's a real strategic vulnerability. If the CEO's actual objective is consumer data and direct relationship rather than near-term profit, then a smaller, cheaper DTC experiment would serve that goal at a fraction of the risk."</em></p>`},

      {kind:'Recommend',
       q:'Give your recommendation.',
       sol:`<p><strong>Answer:</strong> <em>"I'd recommend against the full meal-kit launch as proposed, and instead pursue a two-part plan: fix and extend the core, and run a much smaller DTC experiment to capture the consumer-data benefit the CEO is really after."</em></p>
         <p><strong>Why not the meal kit:</strong></p>
         <ul>
           <li>Unit economics don't work at current assumptions — LTV/CAC of 1.7× against a 3× viability threshold, with CAC payback consuming most of the average customer lifetime.</li>
           <li>It requires building three new capabilities at once — performance marketing, cold-chain fulfilment, and subscription retention — none of which Wildgrain has, and the third of which is the one that determines success.</li>
           <li>Channel conflict is a real cost: grocery retailers account for 100% of current revenue and may respond to a competing direct channel with reduced shelf space.</li>
         </ul>
         <p><strong>What to do instead:</strong></p>
         <ul>
           <li><strong>Immediate (0–12 months):</strong> distribution depth and out-of-stock reduction. Low capital, uses existing relationships, typically 2–3 points of revenue. This is the first place to look when a retail business goes flat and it is frequently under-managed.</li>
           <li><strong>Structural (12–30 months):</strong> innovation into adjacent categories through the existing retail channel — where Wildgrain's product development and sourcing scale are genuine advantages.</li>
           <li><strong>Strategic option (parallel, small):</strong> a $5M DTC pilot on the existing product range, not meal kits. It builds direct consumer data and digital capability at a tenth of the cost, and if the economics prove out, the meal-kit question can be revisited from a position of capability rather than hope.</li>
         </ul>
         <p><strong>Risks in my own recommendation:</strong> <em>"The core-first approach may not deliver the growth rate the CEO wants — distribution and innovation might get Wildgrain from 1% to 4%, not to double digits. If the board's real requirement is transformational growth, then the honest answer is that it requires M&amp;A, not organic launch. I'd want to know which of those two problems we're solving."</em></p>
         <div class="tip"><b>Ending by naming the condition under which your own recommendation would be wrong is a mark of seniority, not weakness.</b> Interviewers explicitly look for it.</div>`}
    ]
  }
});

MODULES.push({
  id:'m12',tag:'Core case type',
  title:'Operations, capacity & bottlenecks',
  sub:'Throughput, utilisation, and the single rule that solves most operations cases.',
  concept:[
    {title:'The bottleneck rule',card:`
      <p><strong>A system\'s throughput equals the capacity of its slowest step.</strong> Everything else is subordinate. Improving a non-bottleneck step adds nothing except inventory.</p>
      <div class="f">Step        Capacity/hr    Utilisation at 80 units/hr
Cut            200            40%
Assemble       120            67%
Paint           80           100%  ← BOTTLENECK
Package        150            53%

System throughput = 80/hr. Doubling the cutting station
changes throughput by exactly zero.</div>
      <p>The follow-on that interviewers want: <em>"Once we relieve paint, the bottleneck moves to assembly at 120 — so the maximum benefit from any paint investment is capped at a 50% throughput gain, not an unlimited one."</em> Always name where the bottleneck moves next.</p>`},
    {title:'Little\'s Law and cycle time',card:`
      <div class="f">Inventory = Throughput × Flow time
  (or: WIP = Rate × Time)

A clinic with 15 patients in the building and a
throughput of 10 patients/hour has an average
flow time of 1.5 hours.

Rearranged: Flow time = WIP ÷ Throughput
→ Reducing waiting patients directly reduces wait time</div>
      <p>Useful in queueing, healthcare, logistics, and service cases. It lets you convert between the three things clients measure — how many are waiting, how fast we serve, and how long people wait — when you're only given two.</p>`},
    {title:'Utilisation, and why 100% is a mistake',card:`
      <p>Utilisation = actual output ÷ maximum capacity. Higher is better for cost, but wait times explode as utilisation approaches 100% under any variability.</p>
      <div class="f">Utilisation    Relative wait time (with variability)
   70%              1×
   85%              ~3×
   95%              ~10×
   99%              ~50×</div>
      <p>This is why hospitals target ~85% bed occupancy, not 100%, and why a fully-booked call centre has terrible service levels. If a client is running at 97% utilisation and complaining about delays, the delays <em>are</em> the utilisation.</p>
      <div class="tip"><b>Say it explicitly:</b> "There's a trade-off between utilisation and responsiveness. Running at 95% minimises unit cost but produces queues; the right target depends on how much customers value speed."</div>`},
    {title:'OEE — the three ways capacity is lost',card:`
      <div class="f">Overall Equipment Effectiveness =
   Availability × Performance × Quality

  Availability: uptime ÷ scheduled time (breakdowns, changeovers)
  Performance:  actual rate ÷ rated speed (minor stops, slow running)
  Quality:      good units ÷ total units  (scrap, rework)

Example: 90% × 85% × 96% = 73% OEE
→ 27% of paid capacity is being lost, and the split
  tells you exactly which problem to attack.</div>
      <p>When a client says "we need more capacity," check OEE first. Recovering 10 points of OEE is almost always cheaper than buying a new line.</p>`},
    {title:'Common operations levers',card:`
      <ul>
        <li><strong>Relieve the bottleneck:</strong> add capacity there, offload work to non-bottleneck steps, reduce changeovers, run it through breaks.</li>
        <li><strong>Reduce variability:</strong> level the schedule, standardise work, smooth demand with appointments or pricing.</li>
        <li><strong>Match capacity to demand:</strong> flexible staffing, part-time shifts, cross-training, outsourcing peaks.</li>
        <li><strong>Reduce complexity:</strong> fewer SKUs means fewer changeovers and less inventory — often the single biggest hidden capacity gain.</li>
        <li><strong>Shift demand:</strong> off-peak pricing, appointment systems, delivery windows.</li>
      </ul>`}
  ],
  drills:[
    {q:'A factory line has four stations with hourly capacities of 240, 180, 150 and 200 units. It runs 16 hours a day, 250 days a year. What is annual capacity?',
     unit:'units', a:600000, tol:0.03, ph:'e.g. 600000',
     hints:['Throughput is set by the slowest station.','150 × 16 × 250'],
     sol:`<div class="f">Bottleneck = station 3 at 150 units/hour
Annual capacity = 150 × 16 hours × 250 days
                = 600,000 units</div>
       <p>The other stations are idle a meaningful share of the time: station 1 runs at 63% utilisation, station 2 at 83%, station 4 at 75%.</p>
       <p><em>"If we can raise station 3 to 180 units/hour, throughput rises 20% to 720,000 — but then station 2 becomes the constraint at 180, and further investment in station 3 yields nothing. So I'd size any station-3 investment against a 20% ceiling, and consider whether a combined station 2 and 3 upgrade to 200 units/hour is better value, which would lift capacity 33% before station 4 binds."</em></p>
       <div class="tip"><b>Always compute where the bottleneck moves to.</b> It converts a capacity question into an investment-sizing answer, which is what the client actually needs.</div>`},

    {q:'A call centre handles 4,000 calls a day. Average handle time is 6 minutes, agents work 7.5 productive hours per shift. How many agents are needed?',
     unit:'agents', a:53, tol:0.06, ph:'e.g. 53',
     hints:['Total call minutes needed, then divide by productive minutes per agent.','4,000 × 6 = 24,000 minutes.'],
     sol:`<div class="f">Total handle time = 4,000 × 6 min = 24,000 minutes/day
Agent productive time = 7.5 × 60 = 450 minutes
Agents at 100% utilisation = 24,000 ÷ 450 = 53.3 agents</div>
       <p><strong>But 53 agents would produce terrible service.</strong> At 100% utilisation, callers queue whenever arrivals cluster — and call arrivals always cluster.</p>
       <div class="f">At 85% target utilisation: 53.3 ÷ 0.85 ≈ 63 agents
Plus shrinkage (breaks, training, absence ~30%):
  63 ÷ 0.70 ≈ 90 agents on the roster</div>
       <p><em>"The mathematically required number is 53, but the operationally correct answer is closer to 90 once you account for the utilisation-service trade-off and roster shrinkage. Clients who staff to the theoretical number are the ones with 20-minute hold times."</em></p>
       <div class="note"><b>Shrinkage and target utilisation are the two adjustments that separate a real staffing answer from a textbook one.</b> Name both.</div>`},

    {type:'mcq',
     q:'A hospital emergency department has long waits. Beds are 96% occupied. What is the most likely primary cause?',
     options:[
       'Not enough doctors in the ED',
       'Inpatient bed availability — ED patients cannot be admitted, so they occupy ED beds while waiting',
       'Patients arriving without appointments',
       'Insufficient diagnostic equipment'],
     correct:1,
     hints:['96% occupancy of what? Where does an ED patient go next, and what happens if that place is full?'],
     sol:`<p><strong>B.</strong> This is the classic ED bottleneck, and it sits downstream of the ED itself. When inpatient wards are full, admitted patients "board" in ED beds — sometimes for many hours — occupying the capacity that new arrivals need. The ED looks like the problem but is actually the victim.</p>
       <p>At 96% inpatient occupancy, wait times are in the exponential region of the utilisation curve. Even small variations in admissions or discharges produce large queues.</p>
       <p><strong>The fix follows the diagnosis:</strong> <em>"Adding ED doctors would speed up assessment but wouldn't create anywhere for patients to go — the constraint is downstream. The real levers are discharge process improvements: discharging earlier in the day rather than late afternoon, arranging post-acute placement in advance, and weekend discharge capability. Most hospitals discharge in a late-afternoon spike while admissions arrive all day, which guarantees a morning bottleneck."</em></p>
       <div class="tip"><b>General principle for operations cases:</b> when a step is congested, look downstream before adding capacity to the congested step itself. Congestion usually indicates a blockage ahead, not a shortage where you see the queue.</div>`},

    {q:'A machine runs 90% of scheduled hours, at 85% of rated speed, producing 4% defects. What is OEE, and how many effective hours does a 100-hour week deliver?',
     body:'<p>Give OEE as a percentage.</p>',
     unit:'%', a:73.4, tol:0.04, ph:'e.g. 73',
     hints:['Multiply the three factors. Quality = 1 − defect rate.'],
     sol:`<div class="f">OEE = Availability × Performance × Quality
    = 0.90 × 0.85 × 0.96
    = 0.7344 → 73.4%

Effective output from 100 scheduled hours = 73.4 hours
Lost: 10 hrs downtime, 13.5 hrs slow running, 3.1 hrs scrap</div>
       <p>World-class OEE is roughly 85%; 60–75% is typical for discrete manufacturing. At 73%, this machine is mid-pack with real headroom.</p>
       <p><em>"The interesting finding is that performance loss — running below rated speed — is the largest single component at 13.5 hours, larger than downtime. That usually points to minor stops, operator technique variance, or a rated speed that was never achievable with current tooling. Before buying a second machine at capital cost, I'd chase those 13.5 hours: getting OEE from 73% to 82% delivers 12% more output for a fraction of the cost of new capacity."</em></p>`},

    {type:'open',
     q:'A distribution centre ships 20,000 orders a day but customers complain about delays. Where would you look?',
     hints:['Walk the process end to end, and separate capacity problems from variability problems.'],
     sol:`<p><strong>Walk the flow and find the constraint:</strong></p>
       <div class="f">Order received → allocated → picked → packed
  → sorted → loaded → carrier collection → delivered</div>
       <p><strong>Then diagnose in four questions:</strong></p>
       <ul>
         <li><strong>Is it a capacity problem or a variability problem?</strong> If the DC comfortably handles 20,000 on an average day but fails on peak days, the issue is variability and the fix is flexible labour or demand smoothing — not more permanent capacity.</li>
         <li><strong>Where does the delay actually occur?</strong> Measure elapsed time by stage. Delays cluster: order-to-pick delays suggest allocation or inventory-accuracy problems; pick-to-pack suggests labour or layout; pack-to-dispatch suggests carrier cut-off times, which is a scheduling issue rather than an operational one.</li>
         <li><strong>Is inventory accuracy the hidden cause?</strong> If the system says an item is in location A and it isn't, the picker searches, the order goes to exception handling, and one bad record can delay an order by a full day. Accuracy problems masquerade as capacity problems.</li>
         <li><strong>Is order profile the cause?</strong> A shift toward multi-line orders, or toward slow-moving SKUs stored far from dispatch, increases pick time per order without any change in order volume. Same 20,000 orders, much more work.</li>
       </ul>
       <p><strong>The framing that scores:</strong> <em>"I'd start by separating 'we can't ship enough' from 'we ship enough but late.' They look identical to the customer and have completely different fixes. If the DC ships 20,000 every day but they leave after the carrier cut-off, no amount of extra picking capacity helps — the answer is an earlier internal deadline or a later carrier collection."</em></p>`}
  ],
  mcase:{
    title:'Beacon Logistics — the warehouse constraint',
    prompt:`<p><strong>Beacon Logistics</strong> operates a distribution centre serving online retailers. It currently processes <strong>18,000 orders per day</strong> but has signed contracts requiring <strong>26,000 per day</strong> within six months. Management wants to build a second facility at a cost of <strong>$45M</strong>.</p>
      <p>Your team has been asked to confirm the second facility is necessary.</p>`,
    chart:{type:'bar',title:'Exhibit 1 — Current DC stage capacity (orders/day)',
      sub:'Rated capacity of each processing stage',
      data:[{label:'Receiving',value:40000},
            {label:'Putaway',value:32000},
            {label:'Picking',value:19000},
            {label:'Packing',value:28000},
            {label:'Sortation',value:24000},
            {label:'Loading',value:35000}],
      note:'Current throughput is 18,000 orders/day. Hover for values.'},
    steps:[
      {kind:'Find the constraint',
       q:'What is the current bottleneck, and what is the maximum throughput without new investment?',
       unit:'orders/day', a:19000, tol:0.03, ph:'e.g. 19000',
       sol:`<div class="f">Stage capacities:
  Receiving  40,000
  Putaway    32,000
  PICKING    19,000  ← BOTTLENECK
  Packing    28,000
  Sortation  24,000
  Loading    35,000

Maximum throughput = 19,000 orders/day
Current output = 18,000 → picking runs at 95% utilisation</div>
         <p><em>"Picking is the constraint at 19,000, and it's already running at 95% utilisation — which explains any service problems Beacon is currently experiencing, because at 95% utilisation queues form on any variability."</em></p>
         <p><strong>The key observation to make immediately:</strong> <em>"The gap to 26,000 is 7,000 orders. But the second-largest constraint is sortation at 24,000, so even a perfect picking solution only gets us to 24,000 — still 2,000 short. Any plan needs to address both stages, and management's $45M facility proposal may be solving a problem that two targeted investments could solve for far less."</em></p>`},

      {kind:'Size the alternatives',
       q:'Picking capacity can be raised to 30,000/day by adding a second shift ($6M/year in labour) or to 34,000 by automating ($18M capex). Sortation can be upgraded to 34,000 for $9M. Which package would you recommend to reach 26,000?',
       sol:`<p><strong>Build the options and cost them over a comparable horizon:</strong></p>
         <div class="f">TARGET: 26,000 orders/day

OPTION A — Second facility (management's proposal)
  $45M capex + new fixed operating cost
  Capacity: effectively doubles → far beyond need
  Time: 12–18 months (misses the 6-month deadline)

OPTION B — Second picking shift + sortation upgrade
  $6M/yr labour + $9M capex
  New constraint: sortation at 34,000, packing at 28,000
  → capacity 28,000. Meets 26,000 ✓
  Time: 2–3 months ✓
  5-year cost: $9M + ($6M × 5) = $39M

OPTION C — Picking automation + sortation upgrade
  $18M + $9M = $27M capex, no incremental labour
  → capacity 28,000 (packing becomes the constraint)
  Time: 9–12 months ✗ (misses deadline)
  5-year cost: $27M + maintenance</div>
         <p><strong>Recommendation:</strong> <em>"Option B immediately, with Option C's automation evaluated as a follow-on. The second shift can be running in weeks and meets the six-month contractual deadline, which neither of the other options does. The sortation upgrade at $9M is required in every scenario, so it should proceed regardless."</em></p>
         <p><em>"Over five years, automation is cheaper than a permanent second shift — $27M versus $39M — so I'd sequence it: run the second shift now to meet the contracts, and install picking automation over the following year, at which point the shift can be reduced. That converts a capacity crisis into a planned modernisation."</em></p>
         <div class="tip"><b>Sequencing beats choosing.</b> When one option is fast and another is efficient, the answer is usually "the fast one now, the efficient one next" — provided you say how they hand off.</div>`},

      {kind:'Challenge the premise',
       q:'What would you check before accepting that 26,000 orders per day is really the requirement?',
       sol:`<p>Three challenges, each of which could change the investment entirely:</p>
         <ul>
           <li><strong>Is 26,000 the average or the peak?</strong> E-commerce volumes are extraordinarily peaked — a facility sized for a Black Friday peak sits idle for ten months. If 26,000 is a peak and the average is 20,000, the right answer is flexible capacity (temporary labour, overflow third-party logistics for peak weeks) rather than permanent capacity. This single question can save $45M.</li>
           <li><strong>What is the order profile?</strong> Capacity is measured in orders, but work is driven by lines and units picked. If the new contracts bring multi-line orders averaging 4 lines against the current 1.8, then 26,000 orders is more than double the current picking work, and every capacity number above is wrong. I'd insist on capacity expressed in lines per day.</li>
           <li><strong>Is there OEE headroom in picking?</strong> The 19,000 rating assumes current process. Slotting optimisation — moving fast-moving SKUs closer to dispatch — batch picking, and pick-path routing routinely deliver 15–25% throughput gains with no capital at all. That could take picking to 23,000 for the cost of a software configuration and a re-slotting exercise.</li>
         </ul>
         <p><em>"I'd want the answer to the order-profile question before signing off on anything, because it's the one that could invalidate the entire analysis. Everything we've computed assumes an order is a unit of work, and that assumption is frequently wrong when a facility takes on new clients."</em></p>`},

      {kind:'Recommend',
       q:'Present your recommendation to Beacon\'s management.',
       sol:`<p><strong>Answer first:</strong> <em>"The second facility isn't necessary, and it wouldn't be ready in time anyway. Beacon can reach 28,000 orders per day within three months for $9M of capex plus $6M a year of labour — roughly a fifth of the proposed capital — by relieving the picking and sortation constraints in the existing building."</em></p>
         <p><strong>Support:</strong></p>
         <ul>
           <li>Picking is the binding constraint at 19,000 orders per day, running at 95% utilisation. Sortation is the second constraint at 24,000. Fixing both takes the facility to 28,000 — comfortably above the 26,000 requirement, with packing as the next limit.</li>
           <li>A second shift on picking delivers capacity in weeks; the $45M facility takes 12–18 months and would miss the contractual deadline entirely — so it doesn't actually solve the stated problem.</li>
           <li>Before any of this, I'd run the no-capital levers: slotting optimisation and batch picking typically add 15–25% of picking throughput and would reduce the size of everything else required.</li>
         </ul>
         <p><strong>Sequenced plan:</strong> months 0–1, re-slotting and pick-path optimisation; months 1–3, second picking shift plus sortation upgrade order; months 3–6, sortation commissioning and volume ramp; months 6–18, evaluate picking automation to replace the second shift, which pays back against labour in roughly three years.</p>
         <p><strong>Risks and open questions:</strong> <em>"Two things could change this answer. First, whether 26,000 is peak or average — if it's average with a much higher peak, we need flexible peak capacity, likely third-party overflow, rather than permanent capacity. Second, the order profile of the new contracts: if they're multi-line orders, our capacity figures in orders are misleading and I'd need to redo this in picked lines. I'd want both answers within two weeks, and I'd hold the sortation purchase order until we have them."</em></p>
         <div class="tip"><b>Recommending against a $45M proposal requires giving management a credible, dated alternative — not just a critique.</b> The plan with months attached is what makes the recommendation actionable.</div>`}

  concept:[
    {title:'The five-step routine — use it every single time',card:`
      <ol>
        <li><strong>Read the title and axes out loud.</strong> Units, time period, currency, and — crucially — whether values are absolute or percentages, actuals or index.</li>
        <li><strong>State what the chart shows, plainly.</strong> One sentence, no interpretation yet. "This shows revenue by segment for three years."</li>
        <li><strong>Find the pattern.</strong> The largest, the smallest, the fastest-changing, the outlier, the crossover point.</li>
        <li><strong>Quantify it.</strong> Don't say "digital grew a lot." Say "digital grew 133%, from $60M to $140M, and overtook print in year three."</li>
        <li><strong>Say the "so what" and the next question.</strong> This is where the points are.</li>
      </ol>
      <div class="tip"><b>Take 20–30 seconds of silence first.</b> Say "let me take a moment with this." Candidates who start talking immediately miss the axis labels and pay for it two minutes later.</div>`},
    {title:'What each chart type is trying to tell you',card:`
      <div class="f">BAR (vertical)   comparison across categories at one time
                 → look for: rank order, outliers, the gap
BAR (stacked)    composition + total
                 → look for: mix shift over time; check whether
                   the TOTAL moved or only the composition
LINE             trend over time
                 → look for: inflection points, crossovers,
                   changes in slope (not just direction)
WATERFALL        bridge from one number to another
                 → look for: the largest single driver; whether
                   positives or negatives dominate
SCATTER          relationship between two variables
                 → look for: correlation, clusters, and above
                   all the OUTLIERS — they are usually the point
TABLE            precise values, multiple dimensions
                 → look for: the row or column that breaks the
                   pattern; compute a ratio the table doesn't show</div>`},
    {title:'Traps deliberately planted in case exhibits',card:`
      <ul>
        <li><strong>Truncated axis.</strong> A y-axis starting at 90 makes a 2% change look catastrophic. Check the origin.</li>
        <li><strong>Percentages hiding absolutes.</strong> "Segment C grew 200%" — from $1M to $3M, while segment A grew 5% from $500M to $525M. A added five times more dollars.</li>
        <li><strong>Absolutes hiding percentages.</strong> The reverse: the biggest absolute mover may be the slowest grower.</li>

        <li><strong>Changing denominators.</strong> Market share rising while revenue falls means the market shrank faster than you did.</li>

 quantified]. This suggests [implication for the client's
 question]. To confirm, I'd want [specific next data]."</div>

E-commerce:    120 → 200   +67%   (14% → 24%)
Off-price:      60 → 120  +100%   ( 7% → 14%)</div>
         <p><em>"Revenue is flat but the channel mix has transformed. Full-price channels — own stores and wholesale — are both down 21%, and the entire shortfall has been absorbed by e-commerce and, more worryingly, off-price. Off-price has doubled to 14% of revenue."</em></p>

  Stores      380 × 62% = 235.6
  Wholesale   290 × 44% = 127.6
  E-comm      120 × 58% =  69.6
  Off-price    60 × 22% =  13.2
  Total gross profit    = 446.0  ÷ 850 = 52.5%

FY24:
  Stores      300 × 62% = 186.0
  Wholesale   230 × 44% = 101.2
  E-comm      200 × 58% = 116.0
  Off-price   120 × 22% =  26.4
  Total gross profit    = 429.6  ÷ 850 = 50.5%

Blended margin fell 2.0 points; gross profit fell $16.4M.</div>
         <p><em>(49–53% accepted.)</em></p>
         <p><strong>The finding:</strong> <em>"Channel mix explains a 2-point gross margin decline, worth $16.4M — but EBITDA margin fell 5 points, roughly $42M. So mix explains about 40% of the problem. Importantly, no individual channel's margin changed at all, which means the CEO's discounting hypothesis is wrong: Solstice isn't discounting more within channels, it's selling more through inherently low-margin channels."</em></p>

      {kind:'Exhibit 3',
       q:'Confirm or reject that hypothesis.',
       chart:{type:'bar',title:'Exhibit 3 — Own-store estate and productivity',

       sol:`<div class="f">Store count:      210 → 205   (−2%)
Store revenue:   $380M → $300M  (−21%)
Sales per store: $1.81M → $1.46M (−19%)

Occupancy cost:   $74M → $79M   (+7%, rent escalators)
Occupancy as % of store revenue:
  FY22: 74 ÷ 380 = 19.5%
  FY24: 79 ÷ 300 = 26.3%   ← +6.8 points</div>
         <p><strong>Hypothesis confirmed, and quantified:</strong> <em>"Solstice kept essentially the same store estate while store revenue fell 21%. Occupancy cost actually rose 7% through rent escalators. As a share of store revenue, occupancy went from 19.5% to 26.3% — nearly 7 points of pure deleverage on the store channel. On $300M of store revenue that's roughly $20M of the missing $26M."</em></p>
         <p><em>"Combined with the mix effect, we've now explained the great majority of the 5-point EBITDA decline: about 2 points from channel mix and about 2.5 points from store fixed-cost deleverage. And critically, neither of those is a discounting problem."</em></p>
         <div class="note"><b>The full diagnosis in one line:</b> customers moved from stores to online and off-price; Solstice's store cost base didn't move with them. That is a footprint problem and an inventory problem — not a pricing problem.</div>`},

      {kind:'Synthesise',
       q:'Present your findings to the CEO, who still believes this is about discounting.',
       sol:`<p><strong>Answer first, and correct the premise directly but respectfully:</strong></p>
         <p><em>"The data doesn't support discounting as the cause. Gross margin within every single channel has been stable for three years — Solstice hasn't discounted more. What has changed is where revenue comes from and what it costs to serve it. Two effects explain roughly 90% of the 5-point EBITDA decline."</em></p>
         <p><strong>First — channel mix, about 2 points ($16M).</strong> Full-price channels are down 21% while off-price has doubled to 14% of revenue at a 22% margin. Solstice is moving the same volume of product through progressively worse channels, which almost certainly reflects excess inventory being liquidated rather than a commercial choice.</p>
         <p><strong>Second — store fixed-cost deleverage, about 2.5 points ($20M).</strong> Store revenue fell 21% while the estate shrank only 2% and occupancy cost rose 7%. Occupancy went from 19.5% to 26.3% of store revenue. Solstice is paying for a footprint sized to a demand pattern that no longer exists.</p>
         <p><strong>Three recommendations, in order:</strong></p>
         <ul>
           <li><strong>Right-size the estate to the new demand pattern.</strong> Close or renegotiate the weakest quartile of stores as leases expire. Given e-commerce is up 67%, some store demand has migrated rather than disappeared — so closures should be modelled net of the online sales they retain in the same catchment.</li>
           <li><strong>Fix the inventory problem upstream.</strong> Doubling off-price volume is a symptom: Solstice is buying more than it can sell at full price. Tighter buy quantities, in-season replenishment, and better demand forecasting attack the cause. Every dollar diverted from off-price back to full price is worth 40 points of margin.</li>
           <li><strong>Invest behind e-commerce.</strong> It's growing 67% at a 58% margin — the second-best margin in the portfolio and by far the best growth. It should be the destination for capital freed from the store estate.</li>
         </ul>
         <p><strong>Risks:</strong> store closures may lose more online demand than modelled, since physical presence drives local awareness; reducing off-price volume shrinks revenue in the short term before margins recover; and lease exits carry break costs.</p>
         <p><strong>Next step:</strong> <em>"The one analysis I'd run first is store-level P&amp;L cross-referenced with local e-commerce sales and lease expiry dates. That tells us which stores are genuinely uneconomic, which are supporting online demand in their catchment, and when we can act without penalty. That single view drives the whole footprint decision."</em></p>
         <div class="tip"><b>When the data contradicts the client's stated belief, lead with the evidence, not the contradiction.</b> "Gross margin within every channel has been stable" is a fact the CEO can accept; "you're wrong about discounting" is one they'll resist.</div>`}
    ]
  }

MODULES.push({
  id:'m14',tag:'Skill',
  title:'Synthesis & recommendation',
  sub:'The last 90 seconds, which disproportionately determine how the interview is remembered.',
  concept:[
    {title:'The structure — answer first, always',card:`
      <div class="f">1. RECOMMENDATION   "I recommend that [client] should [action]."
                    One sentence. No preamble. No suspense.
2. SUPPORT          "Three reasons: first… second… third…"
                    Each with a number attached.
3. RISKS            "The main risks are X and Y."
                    Name the mitigation for each.
4. NEXT STEPS       "I'd want to do [specific analysis] next."
                    Concrete, dated, and clearly the right next move.</div>
      <p>60–90 seconds total. No new analysis, no hedging, no "it depends." If it genuinely depends, say what it depends on and give your answer for the most likely case.</p>`},
    {title:'What makes a recommendation strong',card:`
      <ul>
        <li><strong>It is a decision, not a summary.</strong> "We looked at three areas" is not a recommendation. "Close 40 stores and reinvest in e-commerce" is.</li>
        <li><strong>Every claim carries a number.</strong> "Costs are high" → "occupancy is 26% of store revenue against a 19% benchmark, worth $20M."</li>
        <li><strong>Risks are named by you, not extracted by the interviewer.</strong> Naming your own weaknesses is a confidence signal.</li>
        <li><strong>It is addressed to the actual decision-maker</strong> — a CEO, not an analyst. No jargon, no methodology talk.</li>
        <li><strong>Next steps are specific.</strong> "More analysis" is worthless. "Store-level P&amp;L against lease expiry dates" is a plan.</li>
      </ul>
      <div class="trap"><b>Do not narrate your process.</b> "First we looked at revenue, then we looked at costs…" is the most common weak opening. The client doesn't care how you got there.</div>`},
    {title:'Handling incomplete analysis',card:`
      <p>You will often reach synthesis without having answered everything. Commit anyway, and be explicit about the basis:</p>
      <div class="f">"Based on what we've seen, I'd recommend [X].
 I'm confident about [the part you analysed] because [data].
 I'm less certain about [the gap], and if [specific finding]
 turned out differently, I'd change to [Y]."</div>
      <p>That is far stronger than refusing to commit. Consultants make recommendations under uncertainty constantly; showing you can do so — while being honest about the confidence level — is the point of the exercise.</p>`},
    {title:'The "so what" ladder',card:`
      <p>Push every finding up the ladder until it reaches a decision:</p>
      <div class="f">DATA        "Off-price is 14% of revenue, up from 7%."
        ↓
FINDING     "The mix shift costs 2 points of gross margin."
        ↓
IMPLICATION "Solstice is liquidating excess inventory —
             it's buying more than it can sell full-price."
        ↓
DECISION    "Cut buy quantities 15% and move to in-season
             replenishment; worth ~$16M of margin recovery."</div>
      <p>Most candidates stop at the finding. The interviewer is waiting for the decision.</p>`},
    {title:'Delivery mechanics',card:`
      <ul>
        <li><strong>Take 20 seconds to organise.</strong> "Let me take a moment to pull this together" is entirely acceptable and produces a far better answer.</li>
        <li><strong>Use your structure page.</strong> Read your tree top-down; the recommendation is usually already written on it.</li>
        <li><strong>Signpost.</strong> "Three reasons" then actually give three. Numbering is how the listener follows you.</li>
        <li><strong>Slow down and land the first sentence.</strong> The recommendation should be delivered deliberately, not rushed.</li>
        <li><strong>Stop when you're done.</strong> Trailing off into "…so, yeah, that's kind of what I'd do" undoes a strong answer.</li>
      </ul>`}
  ],
  drills:[
    {type:'mcq',
     q:'Which is the strongest opening line for a synthesis?',
     options:[
       '"So we looked at the revenue side and the cost side, and found some interesting things on both."',

     correct:1,
     hints:['Which one contains an actual decision, with a number and a reason?'],
     sol:`<p><strong>B.</strong> It contains the action, the price limit, and the primary rationale in a single sentence. The interviewer knows your answer within five seconds and can spend the rest of the time evaluating your reasoning.</p>
       <p>A narrates process. C hedges without saying what it depends on. D defers the decision entirely — sometimes candidates think this sounds rigorous, but in an interview it reads as an inability to commit.</p>
       <div class="tip"><b>If you genuinely can't commit</b>, the correct form is: "I'd recommend proceeding, conditional on one thing: if diligence shows customer concentration above 50%, I'd walk away." That is a decision with a stated condition — still an answer.</div>`},

    {type:'open',
     q:'Practise: deliver a 60-second synthesis for the Meridian Coffee case from Module 2 (delivery channel dilution).',
     hints:['Recommendation, three supports with numbers, risks, next steps. Say it out loud and time yourself.'],
     sol:`<p><em>"I recommend Meridian reprice its delivery channel rather than launch a store cost-reduction programme. The margin decline is a channel-economics problem, not a cost-discipline problem."</em></p>
       <p><em>"Three reasons. First, delivery grew from zero to 18% of revenue at a 25% platform commission — that alone accounts for 4.5 of the 5 points of margin lost, so cost cutting is aimed at the wrong 0.5 points. Second, delivery customers are convenience-driven and demonstrably less price-sensitive, so a 15–20% delivery menu premium is standard practice in the sector and would recover roughly 3 points. Third, at 18% of $520M — about $94M of gross merchandise value — Meridian has genuine negotiating leverage with the platforms, and every order shifted to its own app removes the commission entirely."</em></p>
       <p><em>"Two risks. Delivery demand may be more elastic than I'm assuming, so a 20% price rise could shed enough volume to offset the gain — I'd test in two cities before rolling out. And platforms can retaliate through search placement, so I'd sequence the pricing move before opening the commission renegotiation."</em></p>
       <p><em>"Next step: two weeks of work. An A/B delivery price test in two markets, and a cohort analysis on whether delivery customers reduced their in-store visits. If delivery is genuinely incremental, we reprice and keep the channel. If it's cannibalising walk-in customers, we're paying 25% commission on customers we already had, and the answer becomes making in-store worth choosing again."</em></p>
       <div class="note"><b>Time it.</b> That is roughly 55 seconds spoken at a measured pace. If you can't get through it in 90 seconds, you have too many supports — cut to three.</div>`},

    {type:'mcq',
     q:'The interviewer asks: "What would change your recommendation?" What is the best response?',
     options:[
       '"Nothing — I\'m confident in the analysis."',
       '"If delivery orders turn out to be cannibalising in-store visits rather than incremental, I\'d shift from repricing the channel to exiting it — the cohort analysis I mentioned would settle that within two weeks."',
       '"A lot of things could change it — there\'s still a lot we don\'t know."',
       '"I\'d need to see the full financial model before I could say."'],
     correct:1,
     hints:['They are testing whether you know which uncertainty actually matters.'],
     sol:`<p><strong>B.</strong> It names one specific finding, states exactly how the recommendation would change, and points to the analysis that resolves it. That demonstrates you understand which assumption your answer rests on.</p>
       <p>A is false confidence and closes down a conversation the interviewer opened deliberately. C is vague and suggests you haven't identified what matters. D defers to data you're unlikely to get and avoids the question.</p>
       <p><strong>The general form to memorise:</strong> <em>"If [specific finding], I'd change to [specific alternative], and [specific analysis] would tell us within [timeframe]."</em> It works for every case and it is one of the most reliable ways to end an interview well.</p>`},

    {type:'open',
     q:'The interviewer says: "Your recommendation will require 400 redundancies. How do you present that to the CEO?"',
     hints:['This tests judgment and maturity, not analysis. Don\'t soften the recommendation and don\'t be cavalier about it.'],
     sol:`<p>Neither retreat from the recommendation nor treat the human cost as a footnote:</p>
       <p><em>"I'd present it directly, because softening it would leave the CEO unprepared. The recommendation stands: the store estate is sized for a demand pattern that no longer exists, and delaying makes the eventual adjustment larger, not smaller."</em></p>
       <p><em>"But I'd bring three things alongside it. First, the alternative scenarios and what they cost — if we close 20 stores instead of 40, we retain 200 roles and forgo roughly half the $20M benefit; that's a legitimate choice for the board to make with full information, and it's their call, not mine. Second, a mitigation plan: sequencing closures to lease expiry spreads the impact over 24 months, redeployment into the growing e-commerce fulfilment operation absorbs a meaningful share of roles, and a proper support package matters both ethically and for the morale of the people who stay. Third, the consequence of inaction — at current trajectory the company reaches breakeven in three years, and a distressed restructuring then would cost far more jobs than a managed one now."</em></p>
       <p><em>"I'd be explicit that this is the board's decision and that reasonable people may weigh it differently. My job is to make sure they're choosing with full visibility of both the financial and the human consequences of every option, including doing nothing."</em></p>
       <div class="tip"><b>What is being assessed:</b> whether you can hold an analytically correct position while treating its human consequences seriously, and whether you understand that the consultant recommends while the client decides. Both halves are required.</div>`}
  ],
  mcase:{
    title:'Full-case rehearsal — Calder Rail',
    prompt:`<p>Final exercise. Work this end to end, then deliver a full synthesis.</p>
      <p><strong>Calder Rail</strong> operates regional passenger rail under a government concession. Passenger numbers have recovered to 92% of pre-pandemic levels, but operating profit is 40% below pre-pandemic. The concession is up for renewal in 18 months, and the government has signalled it will not increase subsidy.</p>
      <p>Key figures: 48 million annual journeys, average fare £9.20, government subsidy £180M/year, total operating cost £640M/year of which roughly 70% is fixed (rolling stock leases, track access, salaried staff, stations).</p>`,
    steps:[
      {kind:'Diagnose',
       q:'What is current operating profit, and what would it take to close the gap?',
       unit:'£M profit', a:-18, tol:0.3, ph:'e.g. -18',
       sol:`<div class="f">Fare revenue = 48M journeys × £9.20 = £441.6M
Subsidy                                = £180.0M
Total revenue                          = £621.6M
Operating cost                         = £640.0M
Operating profit                       = −£18.4M</div>
         <p>Calder is loss-making. To understand the gap, reconstruct the pre-pandemic position: at 100% of journeys (52.2M) with the same fare, revenue would be £480M, giving £660M total against costs that were presumably lower — the combination explains a 40% profit decline and today's loss.</p>
         <p><em>"The immediate problem is that 8% of journeys disappeared while 70% of the cost base is fixed. Losing 4.2M journeys removed roughly £39M of revenue and almost no cost — that single fact largely explains the loss."</em></p>
         <div class="tip"><b>In a high-fixed-cost business, always convert a volume shortfall directly into a profit shortfall.</b> It usually is the case.</div>`},

      {kind:'Quantify the levers',
       q:'Three options: (a) raise fares 6%, (b) cut 5% of services on the least-used routes saving £22M, (c) reduce fixed costs 4% through renegotiated rolling-stock leases. Which closes the £18M gap?',
       sol:`<div class="f">(a) FARE RISE 6%
    New fare £9.75, revenue +£26.5M before elasticity
    Rail demand elasticity ≈ −0.6 for regional commuting
    → journeys fall ~3.6% = 1.7M journeys = −£16.9M
    Net revenue gain ≈ +£9.6M
    Variable cost saved on lost journeys ≈ £5M
    → Net profit improvement ≈ +£15M

(b) SERVICE CUT ON WEAK ROUTES
    Saves £22M of cost
    But loses the fare revenue on those journeys:
    if the cut 5% of services carry 2% of journeys
    = 0.96M journeys × £9.20 = −£8.8M revenue
    → Net profit improvement ≈ +£13M
    Risk: concession obligations may forbid it

(c) LEASE RENEGOTIATION
    4% of £640M × 70% fixed = £17.9M saving
    No revenue impact
    → Net profit improvement ≈ +£18M
    But: requires counterparty agreement</div>
         <p><em>"Each option roughly closes the gap on its own, but they are not equivalent in risk or reversibility. Option (c) is the cleanest — pure cost, no customer impact — but it depends entirely on the lessors' willingness, and Calder's leverage is weak 18 months from a concession renewal. Option (a) is within Calder's control but may conflict with regulated fare caps and creates political exposure ahead of renewal. Option (b) is the most dangerous: cutting services on weak routes tends to be exactly what the concession is designed to prevent."</em></p>
         <p><em>"I'd want to know two things before choosing: whether fares are regulated, and what the concession's service-level obligations actually permit. Those constraints may eliminate two of the three options."</em></p>`},

      {kind:'Strategic frame',
       q:'The concession is up for renewal in 18 months with no subsidy increase. How does that change the analysis?',
       sol:`<p>It transforms the problem from an operating question into a bidding question:</p>
         <ul>
           <li><strong>The real deadline is the bid, not the fiscal year.</strong> Calder must demonstrate a credible cost position at renewal, because it will be bidding against operators who can promise the same service for less subsidy. Fixes that only work in the current concession are worth little.</li>
           <li><strong>Structural cost reduction now has strategic value beyond its cash value.</strong> A renegotiated lease or a genuinely lower staffing model reduces the subsidy Calder needs to bid, which improves its win probability. A fare rise does not, since fare policy is typically set by the authority, not the operator.</li>
           <li><strong>The 8% of journeys may never return.</strong> If the shortfall is structural — hybrid working permanently reducing commuting — then sizing the network for 92% is not a temporary measure but the new baseline. Continuing to run a 100% network for 92% demand is the core problem.</li>
           <li><strong>The alternative to winning is losing.</strong> Calder should also evaluate whether this concession is worth re-bidding at all if the economics only work with subsidy growth that isn't coming.</li>
         </ul>
         <p><em>"The framing I'd take to the board: we're not solving an £18M loss, we're building the cost base we need to win a concession under a permanently lower subsidy. Every action should be judged on whether it improves our bid, not just this year's P&amp;L."</em></p>
         <div class="note"><b>Reframing a financial problem in terms of the client's actual strategic deadline is the highest-value move available in a case like this.</b> It's also the one interviewers most often wait for and rarely get.</div>`},

      {kind:'Full synthesis',
       q:'Deliver your complete recommendation to the Calder Rail board. Take 20 seconds to organise, then go.',
       sol:`<p><strong>Recommendation:</strong> <em>"I recommend Calder restructure its cost base around 92% demand as the permanent baseline, targeting £40M of structural cost reduction before the concession bid in 18 months — rather than treating this year's £18M loss as a temporary gap to be bridged."</em></p>
         <p><strong>Three reasons.</strong></p>
         <p><em>"First, the loss is structural, not cyclical. Journeys are 8% below pre-pandemic and 70% of Calder's cost base is fixed, so that volume shortfall drops almost entirely to the bottom line — roughly £39M of lost revenue against almost no cost saving. If hybrid working has permanently reduced commuting, running a full network for 92% demand is a permanent loss, not a recovery story."</em></p>
         <p><em>"Second, the concession renewal is the real deadline. The government has signalled no subsidy increase, so Calder will bid against operators offering the same service for less. Only structural cost reduction improves that bid — a fare rise doesn't, because fare policy sits with the authority."</em></p>
         <p><em>"Third, the levers are available and roughly sized to the need. Rolling-stock lease renegotiation is worth about £18M with no customer impact; timetable optimisation to actual demand patterns rather than pre-pandemic ones is worth a similar order; and a fare adjustment within regulated caps could add £15M if permitted. Together these exceed the gap and build genuine bid competitiveness."</em></p>
         <p><strong>Risks.</strong> <em>"Two significant ones. Lease renegotiation depends on counterparty willingness, and our leverage is weak this close to renewal — so I'd open those conversations immediately, not in year two. And service reductions may breach concession obligations; before committing to any timetable change I'd want legal confirmation of what the current agreement permits and what the next one is likely to require."</em></p>
         <p><strong>Next steps.</strong> <em>"Three things in the next 60 days. One: a demand study to establish whether the 8% shortfall is permanent — that single answer determines whether we're restructuring or bridging. Two: open lease renegotiation now, while there's still time for it to influence the bid. Three: model the bid itself under a flat-subsidy scenario, so we know what cost base we need to win — and, candidly, so we know whether this concession is worth winning."</em></p>
         <div class="tip"><b>Note what the close does:</b> it takes a position, sizes it, names the deadline that actually matters, and ends with a question about whether the client should even want the thing they're fighting for. Raising that possibility — without being asked — is the kind of thinking that gets offers.</div>`}
    ]
  }
});
