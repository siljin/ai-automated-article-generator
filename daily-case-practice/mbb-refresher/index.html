   MODULE 7 — Cost structure & operating leverage
   ========================================================================= */
MODULES.push({
  id:'m07',tag:'Core case type',
  title:'Cost structure & operating leverage',
  sub:'Why two firms with identical revenue respond completely differently to a downturn — and how to use that in a case.',
  concept:[
    {title:'Fixed, variable, and the honest middle',card:`
      <p><strong>Variable</strong> costs scale with each unit produced: raw materials, packaging, shipping, payment processing, hourly production labour, sales commission.</p>
      <p><strong>Fixed</strong> costs don't move with volume within a relevant range: rent, salaried staff, insurance, depreciation, most IT and R&amp;D.</p>
      <p><strong>Step-fixed</strong> costs are the honest middle and where cases get interesting: they're flat until you hit a capacity threshold and then jump. A second factory shift, a new distribution centre, a new sales region manager.</p>
      <div class="f">Cost per unit as volume rises:
  Variable → flat per unit
  Fixed    → falls per unit (spreading)
  Step     → falls, then JUMPS at the threshold, then falls again</div>
      <div class="tip"><b>Say "within the relevant range."</b> Nothing is fixed forever — rent is fixed until you need a second warehouse. Naming the range shows you understand why the distinction is a modelling convenience, not a law.</div>`},
    {title:'Operating leverage, defined and used',card:`
      <p><strong>Operating leverage</strong> = the share of the cost base that is fixed. High fixed share means profit amplifies revenue changes in both directions.</p>
      <div class="f">Degree of operating leverage = Contribution ÷ Operating profit

Firm A: contribution $50M, profit $10M → DOL = 5.0
  → a 10% revenue rise produces a 50% profit rise
Firm B: contribution $15M, profit $10M → DOL = 1.5
  → a 10% revenue rise produces a 15% profit rise</div>
      <p>This single ratio predicts how the client behaves under every scenario question an interviewer can throw at you. Compute it early in any case involving a volume change.</p>`},
    {title:'Which businesses sit where',card:`
      <div class="f">HIGH FIXED / LOW VARIABLE      LOW FIXED / HIGH VARIABLE
  Software, pharma               Retail, distribution
  Airlines, hotels, cinemas      Consulting, staffing
  Telecom networks, utilities    Food service, agriculture
  Semiconductor fabs             Contract manufacturing

Implications:
  High fixed → volume/utilisation is everything; price cuts to
               fill capacity can be rational; downturns are brutal
  Low fixed  → margin per unit is everything; volume swings are
               survivable; scale advantages are weaker</div>
      <p>This mapping is worth carrying into any case. When an interviewer says "airline," you should already expect utilisation, load factor, and yield management to be the crux — not procurement.</p>`},
    {title:'Marginal cost pricing — when a "loss-making" sale is right',card:`
      <p>For a high-fixed-cost business with unsold capacity, any price above <strong>marginal cost</strong> adds profit, even if it's below fully-loaded average cost.</p>
      <div class="f">Airline seat: fully-loaded cost $180, marginal cost $25
  (fuel weight, meal, booking fee)
Empty seat earns $0.
Selling at $60 is "below cost" but adds $35 of contribution.</div>
      <p>This is why last-minute fares are cheap, why hotels discount at 6pm, and why cinemas do matinee pricing. The discipline that makes it work: <strong>fence the discount</strong> so it doesn't cannibalise full-price demand (advance-purchase rules, Saturday-night stays, non-refundability).</p>
      <div class="trap"><b>The trap answer:</b> "we shouldn't sell below cost." The correct answer names marginal cost, then immediately names the cannibalisation risk. Both halves are required.</div>`},
    {title:'Cost reduction: where the money actually is',card:`
      <p>Rank levers by <strong>size × feasibility × speed</strong>, and be specific about the mechanism:</p>
      <ul>
        <li><strong>Procurement</strong> — consolidate suppliers, competitive tender, spec reduction, payment terms. Usually the fastest 3–8% on addressable spend.</li>
        <li><strong>Labour productivity</strong> — scheduling to the demand curve, span of control, automation of repeated tasks. Slower, politically harder, but structural.</li>
        <li><strong>Yield &amp; waste</strong> — scrap rates, shrinkage, returns, rework. Often invisible until measured.</li>
        <li><strong>Footprint &amp; utilisation</strong> — consolidate sites, sublet, shift work between plants. Big and slow.</li>
        <li><strong>Complexity reduction</strong> — SKU rationalisation. The most underrated lever: complexity costs show up diffused across changeovers, inventory, forecasting error, and warehouse slots, so nobody owns them.</li>
      </ul>
      <div class="note"><b>Always ask "what does this cost buy us?"</b> before cutting. Cutting maintenance raises breakdowns; cutting sales headcount cuts revenue. A cost-cutting recommendation without a stated risk is an incomplete recommendation.</div>`}
  ],
  drills:[
    {widget:'opLeverage',
     q:'Use the operating leverage lab: at what volume does Firm A (high fixed) overtake Firm B (high variable)?',
     body:'<p>Firm A: $600k fixed, $3/unit variable. Firm B: $100k fixed, $8/unit variable. Both sell at $10. Drag the volume slider and find the crossover volume in units.</p>',
     unit:'units', a:100000, tol:0.06, ph:'e.g. 100000',
     hints:['Set the two profit equations equal and solve for volume.','(10−3)Q − 600,000 = (10−8)Q − 100,000'],
     sol:`<div class="f">Firm A profit: 7Q − 600,000
Firm B profit: 2Q − 100,000

Set equal:  7Q − 600,000 = 2Q − 100,000
            5Q = 500,000
            Q = 100,000 units</div>
       <p>Below 100,000 units Firm B is more profitable; above it, Firm A pulls away rapidly — at 200,000 units A earns $800k versus B's $300k.</p>
       <p><strong>The strategic read:</strong> <em>"Firm A's structure is a bet on volume. It should compete on scale and fight hard for utilisation, even at lower prices. Firm B's structure is defensive — it survives a downturn comfortably but can never win a volume war. If I were advising Firm B on whether to invest in automation, the whole question would be whether they can credibly get above 100,000 units."</em></p>
       <div class="tip"><b>Breakeven volumes to note:</b> Firm A needs 85,700 units just to break even; Firm B needs only 50,000. High operating leverage means a higher floor and a higher ceiling.</div>`},

    {q:'A hotel has 200 rooms, 65% occupancy, $180 average rate, $40 variable cost per occupied room, and $6M annual fixed costs. What is annual profit?',
     unit:'$M', a:0.64, tol:0.08, ph:'e.g. 0.6',
     hints:['Occupied room-nights per year, then contribution per room-night.','200 × 365 × 0.65 room-nights.'],
     sol:`<div class="f">Room-nights sold = 200 × 365 × 0.65 = 47,450
Contribution per room-night = $180 − $40 = $140
Total contribution = 47,450 × $140 = $6.64M
Less fixed costs                     −$6.00M
Profit                                $0.64M</div>
       <p>Breakeven occupancy: $6M ÷ $140 = 42,857 room-nights ÷ 73,000 available = <strong>58.7% occupancy</strong>.</p>
       <p><em>"The hotel operates just 6 points of occupancy above breakeven, which is a fragile position. A recession that takes occupancy from 65% to 55% swings the property from $0.6M profit to a $0.8M loss. That fragility is why hotels discount so aggressively to fill rooms — at $140 of contribution per room-night, filling an empty room at even half rate is enormously valuable."</em></p>`},

    {type:'mcq',
     q:'An airline can sell a last-minute seat for $70. Fully-loaded cost per seat is $210; incremental cost of carrying one more passenger is $30. Should they sell?',
     options:[
       'No — $70 is well below the $210 cost per seat',
       'Yes — it adds $40 of contribution to cover fixed costs already committed',
       'Only if load factor is below 50%',
       'Yes, but only if they can raise other fares to compensate'],
     correct:1,
     hints:['The plane is flying regardless. What changes if one more person boards?'],
     sol:`<p><strong>B.</strong> The flight's cost is committed the moment it's scheduled. The only relevant cost of one additional passenger is the incremental $30 — fuel for their weight, the meal, and the distribution fee.</p>
       <div class="f">Sell:      +$70 revenue − $30 incremental cost = +$40
Don't sell: $0
Selling is $40 better.</div>
       <p><strong>The essential second half of the answer:</strong> <em>"This only holds if the discount is properly fenced. If business travellers who would have paid $400 learn they can wait for a $70 fare, the airline destroys far more revenue than it gains. That's why last-minute deals come with restrictions — non-refundable, no seat selection, no loyalty accrual. The economics are about capacity; the design is about segmentation."</em></p>
       <p>C is not wrong so much as incomplete — the logic holds at any load factor below 100%. D inverts the causality.</p>`},

    {q:'A manufacturer has $40M of costs: 60% variable, 40% fixed. Revenue is $50M. If volume drops 20% with no price change, what is the new profit?',
     unit:'$M', a:5.2, tol:0.06, ph:'e.g. 5',
     hints:['Variable costs fall with volume; fixed costs do not.','New revenue $40M, new variable cost $19.2M, fixed unchanged at $16M.'],
     sol:`<div class="f">Baseline: revenue $50M, variable $24M, fixed $16M
          profit = $10M  (20% margin)

Volume −20%:
  Revenue      = $50M × 0.8 = $40.0M
  Variable     = $24M × 0.8 = $19.2M
  Fixed        = unchanged  = $16.0M
  Profit                    =  $4.8M   (12% margin)</div>
       <p><em>(Answers of $4.8M or $5.2M accepted depending on rounding of the cost split.)</em></p>
       <p><strong>The amplification:</strong> a 20% volume decline produced a 52% profit decline. Degree of operating leverage = contribution ÷ profit = $26M ÷ $10M = 2.6, and indeed 20% × 2.6 = 52%. ✓</p>
       <p>Use DOL as a shortcut in interviews: compute it once, then answer every "what if volume moves X%" question instantly by multiplying.</p>`},

    {type:'open',
     q:'A client wants to cut costs by 15%. Where would you look, and in what order?',
     hints:['Don\'t list cost categories — list a prioritisation logic, and attach the risk to each cut.'],
     sol:`<p>Structure the answer as a prioritisation, not a list:</p>
       <p><strong>First: establish the addressable base.</strong> <em>"15% of total cost is often unrealistic; 15% of addressable cost may not be. I'd strip out costs that are contractual, regulatory, or genuinely required to serve customers, and size what's actually in play."</em></p>
       <p><strong>Then sequence by speed and reversibility:</strong></p>
       <ul>
         <li><strong>Wave 1 — fast, low-regret (0–3 months).</strong> Procurement: retender the top 20 suppliers, consolidate spend, enforce spec compliance. Discretionary: travel, consultants, marketing experiments with unproven ROI. Typically 3–5% of total cost with minimal capability damage.</li>
         <li><strong>Wave 2 — operational (3–12 months).</strong> Labour scheduling to the demand curve, span-of-control normalisation, waste and yield programmes, SKU rationalisation. Typically another 4–7%, requires management attention but not structural change.</li>
         <li><strong>Wave 3 — structural (12+ months).</strong> Footprint consolidation, outsourcing, automation capex, portfolio exits. Large but slow and capital-intensive.</li>
       </ul>
       <p><strong>Always attach the counter-risk:</strong> <em>"For each lever I'd want to know what the cost was buying. Cutting maintenance raises unplanned downtime; cutting sales coverage reduces revenue; cutting R&amp;D mortgages the future. I'd protect anything that touches the customer experience or the revenue engine, and take the 15% disproportionately from overhead and procurement."</em></p>
       <div class="tip"><b>If the 15% can't be found without damaging the business, say so.</b> "Based on the addressable base, I think 9–11% is achievable without capability loss; going to 15% requires exiting a product line or a site — which is a strategy decision, not a cost decision." That is a consultant's answer.</div>`}
  ],
  mcase:{
    title:'Ardent Cinemas — surviving a demand shock',
    prompt:`<p><strong>Ardent Cinemas</strong> operates 80 multiplex cinemas. Attendance has fallen 22% over four years as streaming has grown. Revenue is down only 8% because ticket prices and concession spend rose.</p>
      <p>Per cinema per year: 350,000 admissions, $12.50 average ticket, $6.00 concession spend per admission. Variable cost is $1.80 per admission (concession COGS and card fees) plus a 50% film rental fee on ticket revenue. Fixed cost per cinema is $4.2M.</p>`,
    steps:[
      {kind:'Unit economics',
       q:'What is the contribution per admission?',
       unit:'$ per admission', a:10.45, tol:0.05, ph:'e.g. 10.50',
       sol:`<div class="f">Revenue per admission:
  Ticket        $12.50
  Concession     $6.00
  Total         $18.50

Variable cost per admission:
  Film rental (50% of $12.50)   $6.25
  Other variable                $1.80
  Total                         $8.05

Contribution per admission     $10.45</div>
         <p>Notice where the money is: the ticket generates $12.50 but keeps only $6.25 after the studio's cut, while concessions generate $6.00 and keep $4.20+ of it.</p>
         <p><em>"Concessions are roughly 40% of contribution on 32% of revenue. That's the crucial structural fact about cinema economics — the film is the traffic driver, but the popcorn is the business."</em></p>`},

      {kind:'Breakeven',
       q:'What is the breakeven attendance per cinema, and how much headroom does Ardent have?',
       unit:'admissions', a:401914, tol:0.05, ph:'e.g. 400000',
       sol:`<div class="f">Breakeven = $4,200,000 ÷ $10.45 = 401,900 admissions

Current attendance = 350,000
Ardent is 52,000 admissions BELOW breakeven.

Profit per cinema = 350,000 × $10.45 − $4.2M = −$542,500
Across 80 cinemas: −$43.4M</div>
         <p><strong>This is the moment the case turns.</strong> <em>"On these numbers the average cinema is losing about half a million dollars a year and the chain is roughly $43M in the red. Attendance would need to rise 15% just to reach breakeven — and the trend is running 22% in the other direction. This isn't a margin optimisation problem; it's a structural viability problem."</em></p>
         <div class="tip"><b>When you compute a breakeven above current volume in a declining market, say the implication out loud immediately.</b> The interviewer is waiting to see whether you'll keep politely optimising a business that doesn't work.</div>`},

      {kind:'Evaluate a lever',
       q:'Management proposes cutting ticket prices 20% to drive attendance. If attendance rose 25% as a result, what happens to profit per cinema?',
       unit:'$ profit per cinema', a:-500000, tol:0.25, ph:'e.g. -500000',
       sol:`<div class="f">New ticket price = $12.50 × 0.8 = $10.00
New revenue per admission = $10.00 + $6.00 = $16.00
New variable cost = film rental $5.00 + other $1.80 = $6.80
New contribution per admission = $9.20

New attendance = 350,000 × 1.25 = 437,500
Contribution = 437,500 × $9.20 = $4.025M
Less fixed                       −$4.20M
Profit per cinema              = −$175,000</div>
         <p><em>(Anything from −$400k to −$100k accepted; the point is the direction and rough magnitude.)</em></p>
         <p><strong>Verdict:</strong> the loss narrows from −$542k to −$175k per cinema — a $367k improvement, or roughly $29M across the chain. It helps materially but still doesn't reach profitability.</p>
         <p><em>"The price cut works better than it looks, for a reason worth naming: because the studio takes 50% of the ticket, Ardent only bears half the price cut, while concession revenue — the higher-contribution stream — rises with every extra body in the building. The elasticity required is high but not absurd. I'd want to test whether 25% is realistic; below about 18% attendance uplift the move destroys value."</em></p>
         <div class="note"><b>Revenue-share contracts change elasticity math.</b> When a partner takes a fixed percentage, price cuts are effectively subsidised by that partner. Spotting this is a genuine differentiator.</div>`},

      {kind:'Recommend',
       q:'What do you recommend to the Ardent board?',
       sol:`<p><strong>Answer first:</strong> <em>"Ardent cannot cut or price its way to profitability across all 80 sites. The chain is roughly $43M in the red with breakeven 15% above current attendance in a market declining 5–6% a year. My recommendation is a three-part plan: shrink the footprint, restructure the cost base, and shift the revenue mix away from film rental."</em></p>
         <p><strong>1. Rationalise the estate.</strong> The 350,000 average certainly conceals wide variance. Sites above ~420,000 admissions are profitable and should be invested in; sites well below should be closed or subleased as leases expire. <em>"I'd expect roughly a third of sites to be beyond saving — closing them removes the fixed-cost drag rather than spreading it."</em></p>
         <p><strong>2. Attack the fixed base at surviving sites.</strong> $4.2M per cinema is the binding constraint. Levers: renegotiate rents (cinema anchors have leverage with mall landlords facing vacancy), reduce staffed hours by concentrating showtimes into fewer, fuller screenings, and automate ticketing and concessions. Concentrating showings also raises per-screening occupancy, which improves the concession attach rate.</p>
         <p><strong>3. Change the revenue mix.</strong> Film rental takes 50% of ticket revenue, so ticket revenue is structurally low-margin. Growth should come from the streams Ardent keeps: premium formats and reclining seats (higher price, same film rental %, better experience versus home), expanded food and beverage including alcohol, subscription membership to smooth attendance and lock in habit, and alternative content — live sport, concerts, gaming events, private hire — which carries far better rental terms than studio films.</p>
         <p><strong>Risks:</strong> closures carry lease-break costs and may forfeit studio relationships that depend on national coverage; premium investment is capex into a structurally declining market; subscription can cannibalise full-price frequent attendees.</p>
         <p><strong>Next step:</strong> <em>"The first analysis I'd run is site-level P&amp;L against lease expiry dates. That single view tells us which cinemas to invest in, which to exit, and — critically — when we can exit them without penalty. That timing is what determines whether this restructuring is affordable."</em></p>`}
    ]
  }
});

   MODULE 8 — Pricing
   ========================================================================= */
MODULES.push({
  id:'m08',tag:'Core case type',
  title:'Pricing & elasticity',
  sub:'The three pricing approaches, the breakeven-volume test that decides every price change, and how to segment.',
  concept:[
    {title:'The three pricing approaches — always name all three',card:`
      <ol>
        <li><strong>Cost-plus.</strong> Cost + target markup. Sets the <em>floor</em>. Simple and defensible, but ignores what customers will pay and what competitors charge. Common in industrials and contracting.</li>
        <li><strong>Competitor-based.</strong> Anchored to market alternatives. Sets the <em>reference point</em>. Necessary in commoditised markets, but a race to the bottom if you have no differentiation.</li>
        <li><strong>Value-based.</strong> What the customer saves or earns by using it. Sets the <em>ceiling</em>. Highest-value approach and the one interviewers want to hear, especially for new or differentiated products.</li>
      </ol>
      <div class="f">Price floor    = variable cost
Price anchor  = competitor / next-best alternative
Price ceiling = value delivered to the customer
The negotiation happens between anchor and ceiling.</div>
      <div class="tip"><b>Structure any pricing question this way</b> — floor, anchor, ceiling — then say where in that band you'd price and why. It's MECE, it's fast, and it works for products, services, and B2B contracts alike.</div>`},
    {title:'Value-based pricing in practice',card:`
      <p>Quantify the customer's economics, then capture a share of the gain.</p>
      <div class="f">A machine that saves a factory $200k/year in labour
and lasts 5 years delivers $1M of value.
  Price at $400k → customer keeps 60% of the value,
  gets a 2-year payback, and says yes.
  Price at $900k → economically rational, commercially dead.</div>
      <p>The rule of thumb in B2B: leave the customer a payback period they can defend internally — typically 1–3 years. That constraint, not your cost, should set the price.</p>`},
    {title:'Elasticity and the only formula you need',card:`
      <div class="f">Elasticity = % change in quantity ÷ % change in price

|E| > 1  elastic   — price cuts raise revenue
|E| = 1  unit      — revenue unchanged
|E| < 1  inelastic — price rises raise revenue</div>
      <p>But revenue is the wrong target. <strong>Profit</strong> is what matters, and profit depends on contribution margin. The decisive question is always the same:</p>
      <div class="f">BREAKEVEN VOLUME CHANGE for a price increase:

  Max volume loss = ΔP ÷ (new contribution margin)

  Price +10%, contribution margin 40% → new CM 45.5%
  Tolerable volume loss = 10% ÷ 45.5% ≈ 22%

  For a price CUT, invert:
  Required volume gain = ΔP ÷ (new contribution margin)</div>
      <p>Memorise this: <strong>high-margin businesses can afford large volume losses when raising price; low-margin businesses cannot afford any.</strong> A 5% price cut in a 10% contribution-margin business requires a 100% volume increase to stay level.</p>`},
    {title:'Segmentation and fencing',card:`
      <p>One price for all customers leaves money on the table at both ends. Segment by willingness to pay, then build <strong>fences</strong> so customers can't self-select into the cheap option.</p>
      <div class="f">Fence type      Example
─────────────── ──────────────────────────────────────
Time            Peak/off-peak, early-bird, matinee
Volume          Bulk discounts, tiered SaaS seats
Version         Good / better / best; feature gating
Channel         Outlet stores, app-only pricing
Identity        Student, senior, corporate rate
Commitment      Annual vs monthly, non-refundable</div>
      <p><strong>Versioning insight:</strong> a deliberately limited "good" tier exists to make the "better" tier look reasonable, and a premium "best" tier exists mainly to anchor. Most revenue lands in the middle by design.</p>`},
    {title:'Price change checklist',card:`
      <p>Before recommending any price move, run these five:</p>
      <ol>
        <li><strong>Breakeven volume:</strong> what change in volume makes this neutral? Is that plausible?</li>
        <li><strong>Competitive response:</strong> will rivals follow a rise (good) or undercut a cut (disaster)? Price cuts in concentrated markets invite retaliation and destroy industry profit.</li>
        <li><strong>Customer perception:</strong> price signals quality. Cutting price on a premium brand can reduce demand.</li>
        <li><strong>Cannibalisation:</strong> will the new price pull customers down from a higher-priced product of ours?</li>
        <li><strong>Reversibility:</strong> price cuts are far harder to undo than price rises. Prefer targeted promotions to list-price cuts when testing.</li>
      </ol>`}
  ],
  drills:[
    {widget:'elasticity',
     q:'Use the pricing lab: with contribution margin at $8 on a $20 price, what volume loss can a 10% price increase tolerate?',
     body:'<p>Baseline: $20 price, $12 variable cost, 100k units. Set the price change to +10% and find the breakeven volume-loss readout. Enter it as a percentage.</p>',
     unit:'%', a:20, tol:0.06, ph:'e.g. 20',
     hints:['Old contribution $8. New price $22, so new contribution $10.','1 − (8 ÷ 10)'],
     sol:`<div class="f">Old contribution = $20 − $12 = $8/unit
New price = $22 → new contribution = $10/unit

Tolerable volume loss = 1 − (8 ÷ 10) = 20%

Check: 80,000 units × $10 = $800,000
       100,000 units × $8 = $800,000 ✓ identical</div>
       <p>So Ardent-style logic applies: a 10% price rise works unless it costs more than a fifth of volume — implied elasticity of 2.0. Most consumer products sit between 1.0 and 2.5, so this is a genuinely close call requiring a test.</p>
       <p><strong>Now change the variable cost slider to $16</strong> (a 20% contribution margin). The tolerable loss collapses to about 33%… but the <em>required</em> elasticity tolerance changes character entirely: with thin margins, the same 10% price rise adds much more proportionally, so low-margin businesses gain most from price increases and suffer most from cuts.</p>
       <div class="tip"><b>The asymmetry to remember:</b> low-margin businesses should almost never cut price (they need impossible volume gains) but benefit enormously from raising it. High-margin businesses can afford promotional pricing.</div>`},

    {q:'A software company charges $80/month with 90% contribution margin. It considers a 25% price cut. What volume increase is needed to keep contribution flat?',
     unit:'%', a:38.5, tol:0.06, ph:'e.g. 38',
     hints:['New price $60, contribution falls from $72 to $52 per unit.','Required gain = old contribution ÷ new contribution − 1.'],
     sol:`<div class="f">Old: price $80, variable $8, contribution $72
New: price $60, variable $8, contribution $52

Required volume multiple = 72 ÷ 52 = 1.385
Required volume increase = 38.5%</div>
       <p>Even with a 90% margin, a 25% price cut needs nearly 40% more customers. The reason people underestimate this: the price fell 25% but the <em>contribution</em> fell 28%, because the variable cost doesn't shrink with the price.</p>
       <p><em>"For a software business I'd be cautious about a list-price cut. The volume required is achievable only if we're currently priced well above the market or if we're targeting a genuinely new segment. If the goal is to reach price-sensitive customers, I'd recommend a fenced lower tier with reduced features rather than cutting the price of the existing product — that captures new demand without repricing every existing customer."</em></p>
       <div class="note"><b>Note the hidden cost of a list-price cut:</b> it applies to customers who were happily paying full price. In subscription businesses that's an immediate revenue hit on the entire installed base — which is why versioning almost always beats discounting.</div>`},

    {type:'mcq',
     q:'A B2B machine saves customers $150k per year and lasts 6 years. Manufacturing cost is $80k. Competitors sell comparable machines at $250k. Where should you price?',
     options:[
       'Around $120k — cost plus a healthy 50% markup',
       'Around $250k — match the competitive benchmark',
       'Around $350–450k — value-based, leaving the customer a 2.5–3 year payback',
       'Around $900k — capture the full $900k of value delivered'],
     correct:2,
     hints:['Compute the floor, the anchor, and the ceiling, then pick a point in the band that a customer would actually sign.'],
     sol:`<div class="f">Floor (cost)              $80k
Anchor (competitor)       $250k
Ceiling (value delivered) $150k × 6 = $900k

Price at $400k:
  Customer payback = $400k ÷ $150k = 2.7 years
  Customer keeps $500k of the $900k value (56%)
  Your margin = ($400k − $80k) ÷ $400k = 80%</div>
       <p><strong>C.</strong> Pricing above the competitive anchor requires you to prove the value gap, but that's exactly what value-based selling is for — and $400k against $250k is defensible if your machine genuinely delivers more savings than theirs.</p>
       <p>A leaves enormous money on the table — cost has no bearing on what this is worth. B ignores your differentiation entirely. D is technically the ceiling but leaves the customer zero surplus, so nobody signs; and a 6-year payback fails almost every corporate capex hurdle.</p>
       <p><strong>What to add:</strong> <em>"I'd also want to know what the competitor's machine saves. If theirs saves $140k and ours saves $150k, we can't justify a 60% premium and I'd price nearer $280k. Value-based pricing depends on the value gap versus the alternative, not the absolute value."</em></p>`},

    {q:'A retailer sells 40,000 units at $30 with a 45% contribution margin. It runs a 20% off promotion; volume rises 60%. Did the promotion make money?',
     body:'<p>Give the change in total contribution dollars.</p>',
     unit:'$ change', a:-12000, tol:0.25, ph:'e.g. -12000',
     hints:['Contribution per unit is $13.50 before. What is it after a $6 price cut?','New contribution $7.50 on 64,000 units.'],
     sol:`<div class="f">Before: 40,000 × ($30 × 45%) = 40,000 × $13.50 = $540,000

Promotion: price $24, variable cost unchanged at $16.50
  New contribution = $24 − $16.50 = $7.50
  New volume = 64,000
  New contribution total = 64,000 × $7.50 = $480,000

Change = −$60,000. The promotion LOST money.</div>
       <p><em>(Any clearly negative answer with correct logic passes.)</em></p>
       <p>Required volume increase to break even: $13.50 ÷ $7.50 = 1.8, i.e. <strong>+80%</strong>. The promotion delivered 60% — impressive-looking, and still value-destroying.</p>
       <p><em>"This is the most common promotional trap. Volume was up 60% and every operational dashboard looked green, but contribution fell $60,000 because a 20% discount consumed 44% of the contribution margin. Before running promotions I'd set the required-uplift threshold in advance — here, 80% — so the team knows what success actually means."</em></p>
       <div class="tip"><b>Add the second-order effects:</b> some of the 60% uplift is pull-forward from future full-price purchases, and some is existing customers who would have bought anyway. Both make the real result worse than −$60k.</div>`},

    {type:'open',
     q:'A luxury handbag maker is considering a 30% price cut to grow volume. Advise them.',
     hints:['What does price signal in this category? What happens to the existing customer base?'],
     sol:`<p><strong>Recommend against it, and be direct about why.</strong></p>
       <p><em>"In luxury, price is not just a claim on value — it is a component of the product. A 30% cut doesn't move the brand down the demand curve; it moves the demand curve itself. The willingness to pay of the existing customer base is partly derived from exclusivity, so cutting price can reduce demand rather than raise it — the classic Veblen dynamic."</em></p>
       <p><strong>The specific damages:</strong></p>
       <ul>
         <li><strong>Existing owners are devalued.</strong> Customers who paid full price last month feel cheated, and the secondary-market value of the brand's products falls — which matters enormously in luxury, where resale value underwrites purchase confidence.</li>
         <li><strong>It is nearly irreversible.</strong> Raising price back afterwards is far harder than never having cut. Luxury houses destroy unsold inventory rather than discount it, precisely for this reason.</li>
         <li><strong>The margin math is brutal anyway.</strong> If contribution margin is 70%, a 30% price cut drops it to 57% of the new price — requiring roughly a 75% volume increase to stay level. That volume can only come from a customer segment that dilutes the brand.</li>
       </ul>
       <p><strong>The better answer to their actual problem:</strong> <em>"If the underlying goal is volume growth, I'd reach new customers without repricing the core: a lower-priced entry category — small leather goods, accessories — that carries the brand at an accessible price point; geographic expansion into growing markets; or a diffusion line under a distinct sub-brand. All three grow volume while protecting the price integrity of the main line."</em></p>
       <div class="note"><b>The general principle worth stating:</b> when a client proposes a price change, ask what problem they're solving. Price is rarely the right instrument for a volume goal in a differentiated category — segmentation is.</div>`}
  ],
  mcase:{
    title:'Riverstone Software — repricing a SaaS platform',
    prompt:`<p><strong>Riverstone</strong> sells a project-management SaaS product at a flat <strong>$40 per user per month</strong>. It has 5,000 customer accounts averaging 25 users each, so 125,000 paid seats. Contribution margin is 85%. Annual churn is 18%.</p>
      <p>The CEO believes Riverstone is underpriced and wants to move to tiered pricing. She has asked whether to do it and how.</p>`,
    steps:[
      {kind:'Baseline',
       q:'What is Riverstone\'s current annual recurring revenue and annual contribution?',
       unit:'$M ARR', a:60, tol:0.03, ph:'e.g. 60',
       sol:`<div class="f">Seats = 5,000 accounts × 25 users = 125,000
ARR = 125,000 × $40 × 12 = $60.0M
Contribution = $60M × 85% = $51.0M</div>
         <p>Also worth computing immediately: revenue per account = $60M ÷ 5,000 = <strong>$12,000 per account per year</strong>, and churn is costing 18% × $60M = <strong>$10.8M of ARR per year</strong> that must be replaced before any growth happens.</p>
         <p><em>"Before we discuss price, I'd note that churn is destroying $10.8M of ARR annually. If a price increase raises churn even modestly, it can more than offset the gain — so I want to size both effects, not just the price effect."</em></p>`},

      {kind:'Breakeven test',
       q:'If Riverstone raises price 20%, how much of its seat base can it afford to lose before contribution falls?',
       unit:'%', a:16.7, tol:0.06, ph:'e.g. 17',
       sol:`<div class="f">Old contribution per seat = $40 × 85% = $34/month
New price = $48 → variable cost stays $6
New contribution = $48 − $6 = $42/month

Tolerable loss = 1 − (34 ÷ 42) = 19.0%</div>
         <p><em>(16–20% accepted.)</em></p>
         <p><em>"Riverstone can lose nearly a fifth of its seats and still be ahead. Against 18% baseline churn, that means the price increase works unless it roughly doubles churn — which is a high bar for a product with switching costs. In B2B SaaS, migration cost, training, and data lock-in typically make demand quite inelastic at moderate increases."</em></p>
         <div class="tip"><b>Always benchmark the tolerable loss against baseline churn.</b> "19% tolerable versus 18% baseline" is a much more useful sentence than "19% tolerable" alone — it tells the client how much incremental damage they can absorb.</div>`},

      {kind:'Design the tiers',
       q:'How would you structure tiered pricing, and what fences would you use?',
       chart:{type:'bar',title:'Exhibit — Riverstone accounts by seat count',
         sub:'5,000 accounts',
         pre:'',suf:'',dec:0,
         data:[{label:'1–9 seats',value:1900,sub:'38%'},
               {label:'10–49 seats',value:2200,sub:'44%'},
               {label:'50–199 seats',value:750,sub:'15%'},
               {label:'200+ seats',value:150,sub:'3%'}],
         note:'Flat $40/seat pricing means the 200+ segment pays the same rate as a 3-person team.'},
       sol:`<p>The exhibit reveals the core problem: <strong>a flat rate charges a 3-person startup and a 500-person enterprise identically</strong>, which under-monetises large accounts and over-prices small ones.</p>
         <p><strong>Proposed structure — three tiers, fenced by feature and commitment, not just seat count:</strong></p>
         <div class="f">STARTER   $25/seat/mo   core features, email support,
                        max 10 seats, monthly billing
                        → captures the 38% small-account tail
                          that likely churns on price today

PRO       $50/seat/mo   integrations, reporting, SSO,
                        priority support, annual commitment
                        → the default; where most revenue lands

ENTERPRISE  custom      admin controls, audit logs, SLA,
  (~$70+/seat)          dedicated CSM, security review,
                        procurement-friendly contracting
                        → the 3% of accounts with 200+ seats
                          currently paying startup rates</div>
         <p><strong>Why fence by feature rather than seat count alone:</strong> a seat-count fence invites gaming (large firms buying multiple small accounts). Feature fences — SSO, audit logging, SLA, admin controls — are things enterprises genuinely require and small teams genuinely don't want to pay for. They segment on willingness to pay while feeling fair to everyone.</p>
         <p><strong>Migration design matters as much as the tiers:</strong> <em>"I'd grandfather existing customers at their current rate for 12 months and move them to Pro at renewal. That converts a price increase — which triggers churn decisions — into a renewal conversation, which is far softer. The lost year of upside is worth the retention."</em></p>`},

      {kind:'Size and recommend',
       q:'Assume the new structure yields a blended $46 per seat with 3 percentage points of extra churn. Make your recommendation.',
       sol:`<p><strong>Size it first:</strong></p>
         <div class="f">Blended price: $40 → $46  (+15%)
Extra churn: 18% → 21%, so seats fall ~3%
  Seats: 125,000 → 121,250

New ARR = 121,250 × $46 × 12 = $66.9M   (vs $60.0M)
New contribution = $66.9M × 87.0% ≈ $58.2M  (vs $51.0M)

Contribution gain ≈ +$7.2M per year  (+14%)</div>
         <p><strong>Answer:</strong> <em>"Yes, move to tiered pricing. On these assumptions it adds roughly $7M of annual contribution — about 14% — and the breakeven analysis says the move stays positive unless incremental churn exceeds about 16 points, which is five times my base assumption. The downside is well protected."</em></p>
         <p><strong>Three supports:</strong></p>
         <ul>
           <li><strong>The 3% of accounts with 200+ seats are the biggest single opportunity.</strong> They currently pay startup rates for enterprise requirements, and they have the least price sensitivity and the highest switching costs. Enterprise tier alone likely delivers half the gain.</li>
           <li><strong>The Starter tier is defensive, not offensive.</strong> It reduces churn in the small-account tail — where price is the main objection — and creates a funnel into Pro as those accounts grow.</li>
           <li><strong>Tiering enables expansion revenue permanently</strong>, not just a one-time uplift. Accounts move up tiers as they grow, so net revenue retention improves structurally.</li>
         </ul>
         <p><strong>Risks:</strong> churn could exceed the 3-point assumption if competitors run acquisition campaigns against the increase; feature gating can frustrate existing customers who lose access to something they had; and enterprise custom pricing requires a sales capability Riverstone may not have.</p>
         <p><strong>Next steps:</strong> <em>"I'd pilot on new customers only for one quarter — that gives clean elasticity data with zero risk to the installed base. In parallel, run a win/loss analysis on the last 200 churned accounts to find whether price or product drove them out, because if it's product, repricing makes things worse."</em></p>
         <div class="tip"><b>Recommending a pilot on new customers before migrating the base is the standard, and correct, SaaS repricing playbook.</b> It converts an irreversible decision into a reversible experiment.</div>`}
    ]
  }
});

   MODULE 9 — Market entry
   ========================================================================= */
MODULES.push({
  id:'m09',tag:'Core case type',
  title:'Market entry',
  sub:'Is the market attractive, can we win in it, and is entering better than the alternatives?',
  concept:[
    {title:'The three questions that are the whole framework',card:`
      <ol>
        <li><strong>Is the market attractive?</strong> Size, growth, profitability, structure, barriers, regulation.</li>
        <li><strong>Can we win?</strong> Our capabilities vs incumbents' advantages, and what we'd bring that they don't have.</li>
        <li><strong>Is this the best use of our resources?</strong> Entry vs alternatives — the question candidates forget.</li>
      </ol>
      <div class="f">Attractive market + we can't win        = don't enter
Unattractive market + we can win       = don't enter
Attractive + we can win + better than
  our alternative uses of capital       = ENTER, via [mode]</div>
      <p>The third question is where strong candidates separate. A market can clear both of the first two tests and still be the wrong move if the same capital compounds faster in the core business.</p>`},
    {title:'Market attractiveness — what to actually ask for',card:`
      <ul>
        <li><strong>Size &amp; growth:</strong> current revenue, CAGR, and <em>why</em> it's growing — is the driver durable or a one-off?</li>
        <li><strong>Profitability:</strong> typical margins in the industry. A big market at 2% margins is a trap.</li>
        <li><strong>Structure:</strong> how concentrated? A fragmented market is easier to enter; a duopoly will respond.</li>
        <li><strong>Customer:</strong> who buys, what drives choice, how much switching cost exists.</li>
        <li><strong>Barriers:</strong> capital intensity, regulation, IP, distribution access, scale economics, brand.</li>
      </ul>
      <p>Porter's Five Forces is fine as a mental checklist — buyers, suppliers, entrants, substitutes, rivalry — but recite it as insight, not as a list. <em>"Supplier power is the concern here: three firms control the raw material and they've been vertically integrating."</em></p>`},
    {title:'Can we win? — the right-to-win test',card:`
      <p>Name a specific, transferable advantage. Vague claims about "strong brand" don't survive contact.</p>
      <div class="f">Credible rights to win:
  Existing customer relationships we can cross-sell into
  Distribution or manufacturing we can share (cost advantage)
  Technology/IP incumbents can't replicate
  A structurally lower cost position
  A genuinely underserved segment incumbents ignore

Not credible:
  "We're good operators"
  "The market is growing so there's room for everyone"</div>
      <div class="trap"><b>Ask what incumbents will do.</b> Entry analysis that assumes a static competitor is the most common analytical failure. A well-capitalised incumbent defending share will cut price, and your entry economics must survive that.</div>`},
    {title:'Entry mode — the second half of the recommendation',card:`
      <div class="f">MODE          SPEED   COST   CONTROL  RISK   USE WHEN
Organic build  slow    high   full     high   capability exists,
                                              time available
Acquisition    fast    high   full     med    need share/assets now,
                                              targets available
JV/partner     med     low    shared   low    local knowledge or
                                              regulation required
License/       fast    low    low      low    testing demand,
 franchise                                    capital-light</div>
      <p>A recommendation that says "enter" without naming a mode is incomplete. Tie the mode to the binding constraint: if the gap is capability, buy it; if the gap is regulatory or local knowledge, partner; if the gap is only time and you have the skills, build.</p>`},
    {title:'The financial test',card:`
      <div class="f">Year-3 revenue = market size × expected share
Contribution   = revenue × expected margin
Less entry investment (amortised or as NPV)
Compare to hurdle rate / alternative uses

Always compute: what share do we need to break even?
Then judge: is that share plausible given the structure?</div>
      <p>That last move — converting the decision into a required market share and then judging its plausibility — is the single most reliable way to make an entry recommendation feel grounded rather than hand-waved.</p>`}
  ],
  drills:[
    {type:'mcq',
     q:'A US pet-food maker is considering entering Brazil. Which is the strongest first question?',
     options:[
       'What is the size and growth of the Brazilian pet-food market?',
       'What is our objective — revenue growth, margin, diversification, or a strategic foothold?',
       'Who are the largest incumbents in Brazil?',
       'What would it cost to build a plant in Brazil?'],
     correct:1,
     hints:['What would change your entire evaluation depending on the answer?'],
     sol:`<p><strong>B.</strong> The objective determines what "success" means and therefore which analysis matters.</p>
       <p>If the objective is <em>near-term profit</em>, you need a market with reachable margins and low entry cost — and Brazil may fail. If it's <em>a long-term strategic foothold in Latin America</em>, you might accept years of losses and the right answer could be a small acquisition regardless of near-term returns. If it's <em>diversification of currency and demand risk</em>, market growth barely matters.</p>
       <p>A and C are the right questions <em>second</em> — you'll certainly ask them. D is a mode question that only arises after you've decided to enter.</p>
       <div class="tip"><b>Objective-first is a general habit.</b> In any decision case, one clarifying question about the objective reframes everything. It takes ten seconds and prevents twenty minutes of analysis pointed the wrong way.</div>`},

    {q:'A market is $2B growing 8% annually. A new entrant expects 6% share by year 3, at a 20% contribution margin. Entry costs $60M. What is the year-3 annual contribution, and how does it compare to the investment?',
     body:'<p>Give year-3 annual contribution in $M.</p>',
     unit:'$M', a:30.2, tol:0.08, ph:'e.g. 30',
     hints:['Grow the market three years first, then apply share and margin.','$2B × 1.08³ ≈ $2.52B.'],
     sol:`<div class="f">Market in year 3 = $2.0B × 1.08³ = $2.52B
Our revenue = 6% × $2.52B = $151M
Contribution = 20% × $151M = $30.2M

Simple payback on $60M = 60 ÷ 30.2 ≈ 2.0 years
(from year 3 onward; ignoring years 1–2 losses)</div>
       <p><em>"A two-year payback once we're at scale is attractive. But that understates the true investment, because years 1 and 2 will also be loss-making as we build share — I'd want the ramp. If we're at 2% share in year 1 and 4% in year 2, cumulative losses might add another $30–40M to the effective investment, pushing real payback to year 5 or 6."</em></p>
       <p>Then the key judgment: <em>"The whole answer hinges on whether 6% share by year 3 is credible. In a fragmented market with no dominant player, that's achievable. If three incumbents hold 80% and have distribution locked up, 6% in three years is a fantasy — and I'd want to know what our right to win actually is before believing that number."</em></p>`},

    {type:'mcq',
     q:'Which market structure is generally easiest for a new entrant to penetrate?',
     options:[
       'A duopoly where both players earn high margins',
       'A fragmented market with 40+ players, none above 8% share',
       'A market with one dominant player at 60% share',
       'A rapidly consolidating market with active M&amp;A'],
     correct:1,
     hints:['Where is competitive retaliation least likely and least coordinated?'],
     sol:`<p><strong>B.</strong> Fragmentation means no player has the scale, incentive, or coordination to mount a defence against you specifically. Taking 3% share barely registers to any individual competitor, whereas in a duopoly it is an existential provocation.</p>
       <p>A is deceptive: high margins look attractive but a duopoly's incumbents have both the resources and the strong incentive to defend, and they can absorb a price war you cannot. C means the dominant player likely controls distribution or has genuine cost advantages. D means consolidators are buying scale precisely to squeeze subscale players — you'd be entering as the smallest participant just as scale is becoming decisive.</p>
       <div class="note"><b>The nuance worth adding:</b> fragmented markets are easy to <em>enter</em> and hard to <em>win big in</em>, because fragmentation usually signals weak scale economics. Ask why it's fragmented — if the answer is "local service requirements" or "no scale advantage," then your entry succeeds but never becomes large.</div>`},

    {type:'open',
     q:'A European retailer wants to enter the US. What are the top three risks you would raise?',
     hints:['Think about what has actually killed European retailers in the US — it is a well-documented graveyard.'],
     sol:`<p>Three risks, each with the mechanism named:</p>
       <ul>
         <li><strong>Scale and density economics.</strong> US retail logistics reward regional density. Entering with scattered stores means paying full distribution cost against competitors amortising over hundreds of nearby locations. <em>Mitigation: enter one region densely rather than nationally thinly.</em></li>
         <li><strong>Format and assortment mismatch.</strong> US consumers shop differently — larger baskets, car-based trips, different price-pack architecture, vastly different store sizes. Formats that work in dense European cities frequently fail in suburban America. <em>Mitigation: adapt the format rather than exporting it; several high-profile failures came from exporting the home format unchanged.</em></li>
         <li><strong>Incumbent response and cost position.</strong> US grocery and general merchandise incumbents operate at scale with sophisticated private label and supplier terms a new entrant cannot match for years. Entering means competing on price from a structurally worse cost position. <em>Mitigation: enter on differentiation rather than price, or acquire an existing chain for immediate scale and supplier terms.</em></li>
       </ul>
       <p><strong>The framing that scores:</strong> <em>"The US market's size is exactly what makes it dangerous — it's large enough to justify huge investment and competitive enough that subscale entrants lose money for a decade. I'd want to see either a genuinely differentiated format or an acquisition that delivers density from day one. Organic national entry is the mode that has failed most consistently."</em></p>`}
  ],
  mcase:{
    title:'Aurora Bank — entering SME lending',
    prompt:`<p><strong>Aurora Bank</strong> is a mid-size retail bank with 2.4 million consumer customers. It has no meaningful business banking presence. The board is considering entering <strong>SME lending</strong> (loans to businesses with under 50 employees).</p>
      <p>The domestic SME lending market is <strong>$40B in outstanding loan balances</strong>, growing 5% a year. Net interest margin in the segment averages 4%. The top three banks hold 65% share.</p>`,
    steps:[
      {kind:'Structure',
       q:'How would you evaluate this decision?',
       sol:`<div class="f">Should Aurora enter SME lending?

├─ 1. IS THE MARKET ATTRACTIVE?
│   ├─ Size $40B balances × 4% NIM = $1.6B revenue pool
│   ├─ Growth 5%/yr — driven by what? (business formation,
│   │   credit availability, or just inflation?)
│   ├─ Structure: top 3 = 65% → concentrated, but 35% is
│   │   spread across a long tail we could take from
│   └─ Risk-adjusted economics: NIM is not profit — must
│       net out credit losses, opex, and capital charge
├─ 2. CAN AURORA WIN?
│   ├─ Right to win: 2.4M consumer customers — how many
│   │   are SME owners already banking with us personally?
│   ├─ Capability gaps: credit underwriting for business
│   │   risk, relationship managers, cash-management product
│   └─ Cost to serve vs incumbents' scale
└─ 3. IS IT THE BEST USE OF CAPITAL?
    ├─ Return vs deploying the same capital in the core
    │   consumer book or in mortgages
    ├─ Regulatory capital: SME lending carries higher
    │   risk weights than secured consumer lending
    └─ Alternatives: partner with a fintech, buy a
        specialist lender, or refer and take a fee</div>
         <p>Lead with the one that matters: <em>"I'd start with the right-to-win question, because the market attractiveness is fairly knowable from public data, whereas whether Aurora's consumer base contains a warm SME customer list is proprietary information that would fundamentally change the entry economics."</em></p>`},

      {kind:'Size the opportunity',
       q:'Aurora believes it can reach 4% market share within five years. What annual revenue would that represent in year 5?',
       unit:'$M', a:81, tol:0.08, ph:'e.g. 80',
       sol:`<div class="f">Market balances in year 5 = $40B × 1.05⁵ = $51.1B
Aurora share at 4%                     = $2.04B balances
Revenue at 4% NIM                      = $81.7M per year</div>
         <p>But NIM is not profit. Build to a contribution figure:</p>
         <div class="f">Revenue (NIM)                      $81.7M
Less credit losses (~1.2% of balances)  −$24.5M
Less operating cost (~1.0% of balances) −$20.4M
Pre-tax contribution                ≈  $36.8M
Return on $2.04B of balances        ≈  1.8%</div>
         <p><em>"Roughly $37M of pre-tax profit at scale. Whether that's good depends entirely on the capital required — SME loans typically carry 75–100% risk weights, so $2B of balances might absorb $150–200M of regulatory capital. That implies a return on capital around 18–24%, which would be attractive for a bank. That's the number I'd want to confirm."</em></p>
         <div class="tip"><b>In financial-services cases, always convert to return on capital.</b> Revenue and even profit are misleading when different products consume wildly different amounts of regulatory capital.</div>`},

      {kind:'Right to win',
       q:'Data: 180,000 of Aurora\'s consumer customers are registered business owners, and 22% of them already hold a business account elsewhere with a top-3 bank. What does this tell you?',
       sol:`<p><strong>This is the case.</strong> Aurora has a warm base of 180,000 SME owners who already trust it with their personal finances.</p>
         <div class="f">180,000 SME-owner customers
If Aurora converts 25% to a business relationship → 45,000
Average SME loan balance ~$45,000
→ $2.0B of balances — exactly the 4% share target,
  reachable entirely from the existing customer base.</div>
         <p><em>"This transforms the assessment. Aurora doesn't need to win customers from incumbents in open competition — it needs to cross-sell to people who are already its customers. Acquisition cost is a fraction of an incumbent's, and the credit risk is partly knowable from personal banking history, which is a genuine underwriting advantage a new entrant wouldn't have."</em></p>
         <p><strong>The counter to raise yourself:</strong> <em>"The 22% figure cuts both ways. It means most of these owners haven't chosen a business bank yet — good. But it also means some already have an incumbent relationship with switching costs attached: payroll, merchant services, existing facilities. I'd want to know what share of the 180,000 are pre-revenue or very early stage, because those are easy to win and slow to become profitable."</em></p>`},

      {kind:'Recommend',
       q:'What is your recommendation to the board, including entry mode?',
       sol:`<p><strong>Answer:</strong> <em>"Enter — but organically and narrowly, targeting Aurora's existing consumer customers who own businesses, rather than competing for the open market. Start with simple secured and part-guaranteed lending products before building a full commercial banking capability."</em></p>
         <p><strong>Support:</strong></p>
         <ul>
           <li><strong>The market clears the attractiveness bar:</strong> a $1.6B revenue pool growing 5%, and 35% of it sits outside the top three — the segment is contestable at the smaller end.</li>
           <li><strong>Aurora has a genuine, specific right to win:</strong> 180,000 existing SME-owner customers, with personal-banking data that gives an underwriting edge. Converting 25% delivers the entire 4% share target — roughly $37M of pre-tax profit at an estimated 18–24% return on capital.</li>
           <li><strong>Organic is the right mode</strong> because the binding constraint is product and underwriting capability, not customer access — and Aurora already has the customers. Acquisition would mean paying a premium for a customer base it partly already has.</li>
         </ul>
         <p><strong>Risks and how to manage them:</strong> credit underwriting for business risk is a genuinely different discipline from consumer — a bad first vintage could cost more than the segment earns in three years, so I'd hire experienced SME credit leadership before writing a dollar. Incumbents may defend by repricing, though they're less likely to fight hard for the smallest end of the market. And capital treatment must be confirmed with the regulator before committing.</p>
         <p><strong>Next steps:</strong> <em>"Three things in the next 90 days: analyse the 180,000-customer base by business size, sector, and tenure to size the genuinely addressable slice; pilot a simple product — an overdraft facility or a secured term loan under $100k — to 2,000 customers to get real conversion and loss data; and confirm the regulatory capital treatment. If pilot conversion beats 15% and losses come in under 1.5%, scale it. If not, the referral-partnership model becomes the better answer."</em></p>
         <div class="tip"><b>Note the structure of the close:</b> a recommendation, the specific evidence, the risks with mitigations, and a decision rule for the next stage — "if conversion beats 15%, scale; if not, partner." Giving the board a decision rule rather than just a plan is what senior clients actually want.</div>`}
    ]
  }
});

MODULES.push({
  id:'m10',tag:'Core case type',
  title:'M&A, due diligence & investment screens',
  sub:'Standalone value, synergies, price, and integration — plus the private-equity variant.',
  concept:[
    {title:'The four questions of any acquisition case',card:`
      <ol>
        <li><strong>Why are we buying?</strong> The strategic rationale — scale, capability, market access, consolidation, or diversification. If the rationale is vague, the deal usually is too.</li>
        <li><strong>What is the target worth standalone?</strong> Its own cash flows, growth, and risk.</li>
        <li><strong>What is it worth to us?</strong> Standalone value plus synergies we can actually realise.</li>
        <li><strong>What should we pay, and is there a better alternative?</strong> Build vs buy vs partner, and other targets.</li>
      </ol>
      <div class="f">Value created = (Standalone value + Synergies) − Price paid
                 − Integration cost − Risk

If the seller captures all the synergy in the price,
the buyer creates zero value even in a "successful" deal.</div>`},
    {title:'Synergies — cost ones are real, revenue ones usually are not',card:`
      <div class="f">COST SYNERGIES (credible, ~70-80% typically realised)
  Overlapping overhead: duplicate HQ, finance, HR, IT
  Procurement scale on combined volume
  Facility/network consolidation
  Manufacturing footprint rationalisation

REVENUE SYNERGIES (rarely realised, discount heavily)
  Cross-selling to each other's customers
  Bundling
  Pricing power from reduced competition (also: regulator)</div>
      <p>Always net out <strong>dis-synergies</strong>: customers who leave because they don't want a single supplier, staff attrition, and the distraction cost of integration. And always name the <strong>one-time cost to achieve</strong> — severance, systems migration, rebranding — which typically runs 1–2× the annual synergy figure.</p>
      <div class="trap"><b>The reliable scoring line:</b> "I'd discount revenue synergies heavily — industry evidence is that most acquisitions fail to deliver them — and build the case on cost synergies alone. If the deal only works with revenue synergies, it doesn't work."</div>`},
    {title:'Valuation in a case — three quick methods',card:`
      <div class="f">1. MULTIPLE:  Value = EBITDA × industry multiple
   Typical ranges: mature industrial 6–9×,
   consumer brands 10–14×, software 15–30×

2. PERPETUITY: Value = free cash flow ÷ (r − g)

3. COMPARABLE TRANSACTIONS: what similar deals paid,
   noting that control premiums run 20–40% over market</div>
      <p>Then the key test: <strong>at the offer price, what does the buyer need to believe?</strong> <em>"At 12× EBITDA they're paying $600M for $50M of EBITDA. With $15M of credible cost synergies the effective multiple falls to 9.2×, which is in line with the sector. So the deal is defensible only if those synergies are real."</em></p>`},
    {title:'Due diligence — what you actually check',card:`
      <ul>
        <li><strong>Commercial:</strong> is the market growing, is the target gaining or losing share, how sticky are its customers, what is the pricing trend?</li>
        <li><strong>Customer concentration:</strong> if the top three customers are 60% of revenue, the deal risk is entirely about contract renewal dates.</li>
        <li><strong>Financial quality:</strong> is EBITDA real? Check working capital trends, one-off adjustments ("add-backs"), capitalised costs, and whether growth was bought with discounting.</li>
        <li><strong>Operational:</strong> capacity, capex requirements deferred by the seller, systems condition.</li>
        <li><strong>People &amp; legal:</strong> key-person dependency, retention, litigation, regulatory approval risk.</li>
      </ul>`},
    {title:'The private equity variant',card:`
      <p>PE cases ask a different question: <em>can we buy this, improve it, and sell it in 5 years for a 2.5–3× return?</em></p>
      <div class="f">Returns come from three sources:
  1. EBITDA growth   (operational improvement, organic growth)
  2. Multiple expansion (buy at 8×, sell at 10×) — hope, not plan
  3. Debt paydown    (leverage amplifies equity returns)

Key questions: is there a clear value-creation plan?
Is there a credible exit — strategic buyer, IPO, secondary?
Does cash flow support the debt through a downturn?</div>`}
  ],
  drills:[
    {q:'A target has $45M EBITDA. The industry trades at 8× EBITDA. The buyer identifies $12M of annual cost synergies. What is the maximum the buyer could pay without destroying value?',
     unit:'$M', a:456, tol:0.05, ph:'e.g. 450',
     hints:['Value the combined earnings stream at the same multiple.','(45 + 12) × 8'],
     sol:`<div class="f">Standalone value  = $45M × 8 = $360M
With synergies    = ($45M + $12M) × 8 = $456M

Maximum price = $456M
Above that, the buyer pays more than the asset is worth
even with perfect synergy delivery.</div>
       <p><strong>The judgment layer:</strong> <em>"$456M is the theoretical ceiling, not the offer. Paying it hands 100% of the synergy value to the seller, so the buyer takes all the integration risk for zero return. I'd anchor an offer at $390–410M — that shares the synergy roughly 50/50 and leaves room for the one-time cost to achieve, which on $12M of annual synergies is probably $15–20M."</em></p>
       <p>Note also that synergies should arguably be valued at a <em>lower</em> multiple than base earnings, because they're less certain. Saying that is a strong touch.</p>`},

    {type:'mcq',
     q:'Which synergy claim would you scrutinise most heavily in diligence?',
     options:[
       'Eliminating the target\'s duplicate corporate headquarters, saving $8M/year',
       'Cross-selling our products to the target\'s 4,000 customers, adding $25M/year of revenue',
       'Consolidating two distribution centres into one, saving $5M/year',
       'Combining procurement volume to reduce input costs 3%'],
     correct:1,
     hints:['Which category of synergy has the worst track record of actually materialising?'],
     sol:`<p><strong>B.</strong> Revenue synergies from cross-selling are the least reliable category in M&amp;A. They require sales-force behaviour change, product-fit assumptions, and customer willingness to consolidate suppliers — none of which the acquirer controls.</p>
       <p>A, C, and D are cost synergies with identifiable line items, known headcount, and specific contracts. You can put a date and an owner on each. That doesn't make them free — they carry severance, lease-break, and execution cost — but they are verifiable in diligence.</p>
       <p><strong>How to scrutinise B properly:</strong> <em>"I'd want three things: what percentage of the target's 4,000 customers actually have a need for our product; whether any of them are already our customers, which would make the synergy double-counted; and evidence from a prior cross-sell attempt. Absent that, I'd model revenue synergies at 25% of management's estimate and check whether the deal still clears the hurdle. If it doesn't, we're paying for hope."</em></p>`},

    {q:'A PE firm buys a company for $400M using $250M of debt and $150M of equity. After five years it sells for $600M, having paid down $100M of debt from cash flow. What is the equity multiple?',
     unit:'× multiple', a:3, tol:0.05, ph:'e.g. 3',
     hints:['Equity at exit = sale price − remaining debt.','Debt at exit is $150M.'],
     sol:`<div class="f">Entry:  equity $150M, debt $250M, EV $400M
Exit:   EV $600M, debt now $150M (paid down $100M)
        equity value = $600M − $150M = $450M

Equity multiple = $450M ÷ $150M = 3.0×
IRR ≈ 3.0^(1/5) − 1 ≈ 24.6%</div>
       <p>Decompose the value creation — this is what PE interviewers want:</p>
       <div class="f">EV growth ($400M → $600M):  +$200M
Debt paydown:                +$100M
Total equity gain:           +$300M

So two-thirds came from enterprise value growth,
one-third from deleveraging.</div>
       <p><em>"A 3× equity multiple and ~25% IRR clears a typical PE hurdle. But I'd want to know whether the $200M of EV growth came from EBITDA improvement or from multiple expansion — because only the first is repeatable and within the sponsor's control. If the whole gain was buying at 8× and selling at 11×, that's market timing, not value creation."</em></p>`},

    {type:'open',
     q:'The target\'s top 3 customers are 55% of revenue. How does this change your view of the deal?',
     hints:['Think about what you\'d demand in the contract, not just how you\'d feel about the risk.'],
     sol:`<p>It changes the deal structure, not just the price.</p>
       <p><strong>The diligence priorities become:</strong></p>
       <ul>
         <li><strong>Contract terms and expiry dates.</strong> If the largest customer's contract expires four months after close, the acquirer is buying a renegotiation, not a revenue stream.</li>
         <li><strong>Change-of-control clauses.</strong> Many contracts allow termination or renegotiation on ownership change. This is the first document to read.</li>
         <li><strong>Relationship ownership.</strong> Is the relationship institutional or does it belong to a founder who is cashing out and leaving? If the latter, retention terms for that person are essential.</li>
         <li><strong>Customer overlap and conflict.</strong> If a top customer competes with the acquirer or with one of the acquirer's major clients, they may exit on principle.</li>
         <li><strong>Profitability of those accounts.</strong> Large customers often extract price. If the top three are 55% of revenue but 20% of profit, the concentration risk is lower than it looks and the growth story lies elsewhere.</li>
       </ul>
       <p><strong>How it changes the deal:</strong> <em>"I'd want protection rather than just a lower price. Specifically: an earn-out where a meaningful portion of consideration is contingent on those three customers still being in place at 18 months, plus direct customer reference calls during diligence — not just management's assurance. If the sellers refuse both, that tells me something they aren't saying."</em></p>
       <div class="tip"><b>Proposing deal-structure remedies — earn-outs, escrows, reps and warranties — rather than only flagging risk is what distinguishes a candidate who has thought about transactions from one who has read about them.</b></div>`}
  ],
  mcase:{
    title:'Kestrel Industrial — evaluating an acquisition',
    prompt:`<p><strong>Kestrel Industrial</strong> makes commercial HVAC systems: $800M revenue, $96M EBITDA. It is considering acquiring <strong>Thornfield Controls</strong>, a building-automation software and sensor company: $150M revenue, $30M EBITDA, growing 14% a year.</p>
      <p>Thornfield's owners are asking <strong>$450M</strong>. Industrial hardware trades at 8× EBITDA; building-automation software trades at 14× EBITDA.</p>`,
    steps:[
      {kind:'Valuation',
       q:'What multiple is Kestrel being asked to pay, and how does it compare to comparables?',
       unit:'× EBITDA', a:15, tol:0.04, ph:'e.g. 15',
       sol:`<div class="f">$450M ÷ $30M EBITDA = 15.0×

Comparables:
  Industrial hardware        8×   → would imply $240M
  Building automation SW    14×   → would imply $420M

Kestrel is being asked to pay a 7% premium to the
software comparable, and nearly 2× the hardware multiple.</div>
         <p><em>"15× is a full price — above the software comparable and roughly double what Kestrel's own business trades at. That premium demands justification, and it will come from one of two places: Thornfield's 14% growth rate, which is faster than typical for the sector, or synergies. I'd want to establish that the growth is durable before accepting the 14× baseline, let alone the premium above it."</em></p>
         <p><strong>The dilution question to raise:</strong> <em>"There's also a shareholder-value point. Kestrel trades at 8× and would be issuing value or debt to buy at 15×. Unless the combined entity re-rates upward, this is immediately dilutive on a multiple basis — which is fine strategically but needs to be said out loud to the board."</em></p>`},

      {kind:'Synergies',
       q:'Kestrel estimates $8M of annual cost synergies and $20M of revenue synergies from selling Thornfield controls into its HVAC installed base. How would you treat these?',
       sol:`<p><strong>Treat them very differently, and say why.</strong></p>
         <div class="f">COST SYNERGIES: $8M/year
  Likely: duplicate finance/HR/IT, combined procurement,
  shared facilities. Realistically 75% achievable → $6M
  One-time cost to achieve: ~$10–14M

REVENUE SYNERGIES: $20M of revenue (not profit!)
  At Thornfield's ~20% EBITDA margin → only $4M of EBITDA
  Apply a heavy discount for realisation risk (say 40%)
  → $1.6M of credible EBITDA

Credible total synergy EBITDA ≈ $7.6M/year</div>
         <p><strong>The critical error to avoid — and to point out:</strong> <em>"The $20M revenue synergy figure is not $20M of value. It converts to roughly $4M of EBITDA at Thornfield's margins, and cross-sell synergies of this type are typically realised at well under half of plan. Management is quoting a revenue number because it sounds larger. I'd model it as under $2M."</em></p>
         <p>With $7.6M of credible synergy: effective multiple = $450M ÷ ($30M + $7.6M) = <strong>12.0×</strong>. That is at least in the neighbourhood of the software comparable — so the deal becomes defensible, though not cheap.</p>
         <div class="tip"><b>Converting revenue synergies to EBITDA before valuing them catches out a large share of candidates.</b> It is the single most common quantitative trap in M&A cases.</div>`},

      {kind:'Strategic rationale',
       q:'Beyond the numbers, is there a strategic case for Kestrel to own Thornfield?',
       sol:`<p><strong>Yes, and it may matter more than the multiple.</strong> Three arguments:</p>
         <ul>
           <li><strong>Defending against commoditisation.</strong> HVAC hardware is a mature, cyclical, 8×-multiple business. Building intelligence — controls, sensors, analytics — is where the value is migrating. If Kestrel doesn't own the control layer, it becomes a component supplier to whoever does, and its pricing power erodes over time. The acquisition is partly insurance against that.</li>
           <li><strong>Recurring revenue and multiple re-rating.</strong> Software and monitoring services carry recurring revenue, which is worth more per dollar than equipment sales. If Kestrel can grow Thornfield to a meaningful share of group revenue, the whole company may re-rate above 8× — which could be worth far more than the premium paid.</li>
           <li><strong>Distribution as a genuine right to win.</strong> Kestrel has an installed base and a service network that Thornfield could never build. This is one of the rare cases where a cross-sell synergy has a real mechanism behind it — the acquirer's technicians are already in the buildings.</li>
         </ul>
         <p><strong>The honest counterweight:</strong> <em>"The strategic logic is genuinely good, which is exactly why I'd be careful. 'Strategic' is the word people use to justify overpaying. I'd want the board to agree an explicit walk-away price before negotiation — because the strategic argument has no natural ceiling."</em></p>`},

      {kind:'Recommend',
       q:'Recommend to Kestrel\'s board.',
       sol:`<p><strong>Answer:</strong> <em>"Pursue Thornfield, but not at $450M. I'd open at $380M and set a walk-away at $420M."</em></p>
         <p><strong>Reasoning:</strong></p>
         <ul>
           <li>$450M is 15× EBITDA against a 14× software comparable. With credible synergies of roughly $7.6M — cost synergies plus a heavily discounted revenue contribution — the effective multiple is 12×, which is fair but leaves Kestrel with none of the upside and all of the integration risk.</li>
           <li>At $400M, the effective multiple is 10.6× and the value created is roughly $50M — a reasonable return for the risk taken.</li>
           <li>The strategic case is strong and genuine: this is a defensive move against value migrating from HVAC hardware to building intelligence, and Kestrel's installed base gives it a real distribution advantage over other bidders. That justifies a premium to the hardware multiple, not an unlimited one.</li>
         </ul>
         <p><strong>Conditions I'd attach:</strong> retention packages for Thornfield's engineering leadership — in a software acquisition, the asset walks out of the building every evening; an earn-out linking 15–20% of consideration to two-year revenue targets, which also tests whether the sellers believe their own growth forecast; and diligence confirmation that the 14% growth is from new customers rather than price rises to a captive base.</p>
         <p><strong>Risks:</strong> integration of a software culture into an industrial manufacturer has a poor track record; if a competing bidder appears, discipline will be tested; and the deal is dilutive on a multiple basis until the group re-rates.</p>
         <p><strong>Next step:</strong> <em>"Two weeks of commercial diligence on Thornfield's customer cohorts — retention, expansion, and whether growth is coming from new logos or from price. That determines whether 14× is the right baseline. And in parallel, a build-versus-buy estimate: what would it cost Kestrel to develop this capability internally? If the answer is $150M over four years, that's the real alternative the $450M is competing against."</em></p>`}
    ]
  }
});
