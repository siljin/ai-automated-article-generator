MODULES.push({
  id:'m01',tag:'Foundations',
  title:'The AI PM interview loop & what is scored',
  sub:'The five question archetypes you will actually face, the rubric behind them, and the answer scaffold that works for all five.',
  concept:[
    {title:'What an AI PM loop actually contains',card:`
      <p>A big-tech AI PM loop is usually 4–6 interviews drawn from five buckets. The mix shifts by company; the buckets are stable:</p>
      <ol>
        <li><strong>AI product sense</strong> — "Design an AI feature for X." Scored on user insight, whether AI is the right tool, and whether you designed for a probabilistic system rather than a deterministic one.</li>
        <li><strong>AI technical depth</strong> — "Fine-tune or RAG here?" "Why is this slow?" Scored on whether you can reason about the stack without pretending to be an ML engineer.</li>
        <li><strong>Analytical / metrics</strong> — "How would you measure it?" "Quality dropped 8% — why?" Scored on metric design, eval literacy, and arithmetic under pressure.</li>
        <li><strong>Execution / strategy</strong> — build vs. buy, roadmap under model uncertainty, launch readiness, pricing.</li>
        <li><strong>Behavioral / leadership</strong> — real stories about shipping under ambiguity, disagreeing with research, killing a feature.</li>
      </ol>
      <div class="tip"><b>Structural difference from a consulting case:</b> nobody hands you exhibits. You generate the numbers yourself — token costs, acceptance rates, volumes — and defend them. Assumption quality <em>is</em> the score.</div>`},
    {title:'The rubric behind every AI question',card:`
      <ul>
        <li><strong>Problem framing</strong> — did you name the user, the job, and the current failure before proposing anything?</li>
        <li><strong>AI fit</strong> — did you show why a probabilistic system beats rules/search/a human here, and where its errors land?</li>
        <li><strong>Technical realism</strong> — latency, cost, data, and eval constraints appear <em>unprompted</em>.</li>
        <li><strong>Measurement</strong> — an offline eval, an online metric, and a guardrail you would not cross.</li>
        <li><strong>Risk judgment</strong> — you say what happens when the model is confidently wrong, and who catches it.</li>
        <li><strong>Communication</strong> — answer first, then structure, then the one thing that would change your mind.</li>
      </ul>
      <div class="trap"><b>Most common failure mode:</b> a beautiful feature description with no error model. If your answer never contains the words "when it gets it wrong," you described a demo, not a product.</div>`},
    {title:'The four moves you repeat all loop long',card:`
      <div class="f">1. FRAME     → user, job, current failure, why now
2. FIT       → why AI, which capability, where errors land
3. QUANTIFY  → volume × cost, quality bar, latency budget
4. MEASURE   → offline eval + online metric + guardrail</div>
      <p>Every drill here is one of these four moves. Lost mid-answer? Ask which of the four you still owe the interviewer.</p>`},
    {title:'The 60-second opener that buys you the room',card:`
      <p>Whatever the question, open the same way:</p>
      <div class="f">"Let me restate: you want [X] for [user] so that [outcome].
 Before I design, three assumptions to confirm —
 [scale], [quality bar], [constraint].
 I'll structure this as: user + job, why AI fits, the system,
 how we'd measure it, and what would make me kill it."</div>
      <p>Three jobs at once: confirms scope, front-loads your constraints so the interviewer can correct you cheaply, and tells them the shape of your answer so they stop worrying you will ramble.</p>
      <div class="note"><b>Why the "kill it" clause matters:</b> the loop is largely a test of whether you will ship something unsafe or uneconomic because it demos well. Naming your own kill criteria early is the fastest credibility signal available.</div>`},
    {title:'Vocabulary you must use correctly, not merely mention',card:`
      <ul>
        <li><strong>Eval</strong> — a repeatable, versioned test set with a scoring function. Not "we tried some prompts."</li>
        <li><strong>Grounding</strong> — constraining generation to retrieved source material so claims are checkable.</li>
        <li><strong>Hallucination</strong> — fluent, confident, unsupported output. Treat it as a rate you manage, not a bug you fix.</li>
        <li><strong>Context window</strong> — token budget per request; drives cost and what you can put in the prompt.</li>
        <li><strong>Model routing / distillation</strong> — cheap model for easy traffic, escalate the hard tail.</li>
        <li><strong>Human-in-the-loop (HITL)</strong> — a named person with a named SLA reviewing flagged output. Not a vague safety word.</li>
      </ul>
      <div class="tip"><b>Test:</b> can you say each term in a sentence containing a number? "We hold hallucination under 2% on the 800-case golden set" beats "we care deeply about hallucination."</div>`}
  ],
  drills:[
    {type:'mcq',
     q:'The interviewer says: "Design an AI feature for a photo-sharing app." First move?',
     options:[
       'Propose three feature ideas quickly to show breadth and creativity.',
       'Restate, confirm the user segment and success metric, then state the structure you will follow.',
       'Ask which model they have access to and what the inference budget is.',
       'Start with the technical architecture, since that is the differentiator in AI products.'],
     correct:1,
     hints:['Two things must happen before ideas: confirming what "good" means here, and telling them the shape of your answer.'],
     sol:`<p><strong>B.</strong> The prompt is deliberately under-specified. Restating and confirming the segment ("creators under 1,000 followers?"), the goal ("retention or creation volume?"), and the structure converts an open prompt into a bounded one.</p>
       <p>A is the junior answer — three ideas with no criteria means the interviewer cannot tell whether you chose well or got lucky. C is real but too early and too narrow. D inverts the order: architecture without a user job is a solution hunting a problem.</p>`},
    {type:'mcq',
     q:'Which follow-up adds the most value on that photo-sharing prompt?',
     options:[
       '"What is the current monthly active user count?"',
       '"Is the goal to help people create more posts, or to help viewers find better content?"',
       '"Do we have GPU capacity available?"',
       '"Which competitors have shipped something similar?"'],
     correct:1,
     hints:['Which answer changes the branch of your design rather than adding a fact you could assume?'],
     sol:`<p><strong>B.</strong> Creation-side and consumption-side AI features share almost no design surface. Creation means editing, captioning, and generation with tight latency and strong undo; consumption means ranking, retrieval, and safety at scale. That one answer redirects everything downstream.</p>
       <p>A is a number you can assume and sanity-check. C matters at feasibility, not framing. D is colour, not structure.</p>
       <div class="tip"><b>Test for a clarifying question:</b> "Would a different answer make me design a different system?" If not, assume it out loud and move on.</div>`},
    {type:'open',
     q:'Open this prompt out loud in 45 seconds: "Our developer platform gets 40,000 support tickets a month. Should we build an AI support agent?"',
     hints:['Frame, name the two numbers that decide it, then say what would kill the idea.'],
     sol:`<p><em>"So: 40,000 tickets a month on a developer platform, and the question is whether an AI agent should take some share. Three assumptions I want to confirm: the goal is cost per ticket rather than pure CSAT; we have historical tickets and docs we're permitted to use for retrieval and evals; and a wrong answer is embarrassing but recoverable — not a billing or security instruction that causes real damage."</em></p>
       <p><em>"I'll structure it as: which ticket types are automatable, what the system looks like, unit economics versus human handling, how we measure quality and catch regressions, and the conditions under which I'd say no."</em></p>
       <p><em>"My prior: support is one of the strongest LLM fits because the answers already exist in docs and past tickets — this is a retrieval problem more than a reasoning problem. The risk isn't capability, it's the tail: the 5% where a confident wrong answer costs more than the 95% saved."</em></p>
       <div class="note"><b>What earns the score:</b> you converted an open question into three testable assumptions, named the answer's shape, and stated a prior with a reason — before any analysis.</div>`},
    {type:'open',
     q:'Name the three assumptions you would state out loud before designing almost any LLM feature.',
     hints:['How much traffic, how good is good enough, and what breaks if it is wrong.'],
     sol:`<ul>
         <li><strong>Scale and volume</strong> — requests per user per day × users. That number decides model choice, caching strategy, and whether the economics work at all.</li>
         <li><strong>Quality bar and who defines it</strong> — is 85% acceptance enough, and who signs off? A feature where a human reviews everything can ship at far lower quality than one that acts alone.</li>
         <li><strong>Blast radius of a confident error</strong> — reversible (a draft the user edits) versus irreversible (an email sent, a refund issued). This axis alone determines whether you need HITL, confidence thresholds, or an abstention path.</li>
       </ul>
       <p>Bonus fourth if the interviewer engages: <strong>data rights</strong> — what you may train on, retain, and send to a third-party provider. In enterprise contexts this kills more designs than latency does.</p>`},
    {type:'mcq',
     q:'Mid-answer: "Let\'s set the design aside — how would you know this is working?" What does that signal?',
     options:[
       'Your design was weak and they are changing the subject.',
       'A planned pivot to measurement. Park the design cleanly and go deep on evals and online metrics.',
       'They want a quick metric name so you can return to the design.',
       'A trap — insist on finishing the design first for coherence.'],
     correct:1,
     hints:['In a structured loop, who owns the agenda and the clock?'],
     sol:`<p><strong>B.</strong> Measurement is a scored dimension in its own right, and interviewers routinely cut the design short to reach it. Say: <em>"Sure — I'll park the routing design and pick it up in my summary. On measurement, I'd separate offline eval from online metrics..."</em></p>
       <p>C undersells it: a one-word metric name is exactly the shallow answer being probed for. D burns goodwill and signals you cannot be redirected — a problem in a role that is mostly redirection.</p>`}
  ],
  mcase:{
    title:'DevPortal — the first four minutes of an AI support agent question',
    prompt:`<p>You are interviewing for an AI PM role on a developer platform. The interviewer says:</p>
      <p>"<strong>DevPortal</strong> handles 40,000 support tickets a month. Median human handle time is 18 minutes at a fully-loaded cost of $32 per ticket. Leadership wants to know whether an AI agent should take the first pass. Where do you start?"</p>`,
    steps:[
      {kind:'Frame & clarify',
       q:'Give me your framing and your clarifying questions.',
       sol:`<p><em>"DevPortal spends roughly $1.28M a year on 40,000 tickets — that's the prize, and no AI agent captures all of it. Before designing I want three things: the ticket mix by type, because 'how do I authenticate' and 'my production job silently failed' are different problems; whether resolved tickets and docs are available as a retrieval corpus; and what happens when the agent is confidently wrong on a billing or security ticket."</em></p>
         <p><strong>Interviewer:</strong> "Mix is roughly 45% documentation lookups, 30% account and billing, 20% debugging the customer's own code, 5% platform incidents. You have five years of resolved tickets and full docs."</p>
         <div class="tip"><b>Read the gift:</b> they just told you the automatable share. Doc lookups are near-pure retrieval; debugging is genuine reasoning; incidents should never be automated because the answer changes minute to minute. Your design is now segmented by ticket type rather than uniform.</div>`},
      {kind:'Size the prize',
       q:'Assume the agent fully resolves 70% of documentation tickets (45% of volume) and nothing else at first. At $32 per ticket, what is the annual gross saving?',
       unit:'$ per year', a:4838400, tol:0.03, ph:'e.g. 1,200,000',
       sol:`<div class="f">Documentation tickets = 40,000 × 45% = 18,000/month
Fully resolved   = 18,000 × 70% = 12,600/month
Monthly saving   = 12,600 × $32 = $403,200
Annual saving    = $403,200 × 12 = $4,838,400</div>
         <p>Now the correction that earns the point: <em>"That's ~$4.8M gross — a ceiling, not a forecast. Three deductions: inference cost; the cost of tickets the agent attempts and fails, which reach a human <strong>worse</strong> than they started because the customer is now annoyed; and eval-and-maintenance headcount. I'd model net closer to 50–60% of gross in year one."</em></p>
         <div class="note"><b>Habit to steal:</b> compute the headline, then name the deductions before the interviewer does. Volunteering the discount is what separates a PM from a spreadsheet.</div>`},
      {kind:'Structure',
       q:'Lay out your structure for the recommendation.',
       sol:`<p>Segment-first, not a generic build/buy tree:</p>
         <div class="f">Should DevPortal build an AI first-pass agent?
├─ 1. WHERE IT WORKS  (segment by ticket type)
│   ├─ Doc lookups 45%    → RAG over docs; high fit, low blast radius
│   ├─ Billing 30%        → account data + write actions; HITL required
│   ├─ Code debugging 20% → reasoning + user code; medium fit, high value
│   └─ Incidents 5%       → never automate; route to on-call
├─ 2. SYSTEM SHAPE
│   ├─ Corpus: docs + resolved tickets, with a freshness policy
│   ├─ Confidence + abstention: answer, ask, or escalate
│   └─ Handoff quality: the transcript a human inherits
├─ 3. ECONOMICS
│   ├─ Cost per AI ticket vs. $32 human
│   └─ Failure cost: rework + CSAT damage on wrong answers
└─ 4. MEASUREMENT & RISK
    ├─ Offline: golden set per ticket type, versioned
    ├─ Online: true deflection, reopen rate, CSAT, escalation latency
    └─ Kill criteria: reopen-rate ceiling, CSAT floor</div>
         <p>Then prioritise out loud: <em>"Ship doc lookups first — highest volume, lowest blast radius, corpus already exists. Billing is the bigger cost pool but needs write access and identity verification, so it comes second with a human approving every action. Incidents I'd explicitly exclude in v1 and say so in the launch doc, because an AI agent guessing during an outage is the failure that ends the program."</em></p>`},
      {kind:'So what',
       q:'"Suppose the agent resolves 70% of doc tickets but reopen rate on those is 25%. What do you do?"',
       sol:`<p>Answer first, then resize, then name the fix:</p>
         <p><em>"Then the 70% isn't real. A reopened ticket costs more than one that came straight to a human — the customer already burned time and arrives frustrated. True deflection is 70% × 75% ≈ 52%, and the failed 18% carry a penalty."</em></p>
         <div class="f">Claimed resolution   12,600/mo
Reopened (25%)        3,150/mo → $32 + rework penalty
True deflection       9,450/mo = 52% of doc tickets
Gross saving falls $4.8M → ~$3.6M before penalties</div>
         <p><em>"The fix isn't a better model first — it's abstention. I'd rather resolve 55% and escalate the rest cleanly than claim 70% and be wrong a quarter of the time. So: a confidence threshold tuned against the reopen curve, and 'I'm not sure, here's a human' designed as a first-class response rather than a failure state."</em></p>
         <div class="tip"><b>Pattern to steal:</b> restate the metric as the user experiences it → resize → propose the product fix, not the model fix. Interviewers listen for whether your instinct is "train more" or "design for uncertainty." The second is the AI PM answer.</div>`}
    ]
  }
});

/* =========================================================================
   MODULE 2 — Structuring an AI product answer
   ========================================================================= */
MODULES.push({
  id:'m02',tag:'Foundations',
  title:'Structuring an AI answer & the AI-fit test',
  sub:'A reusable decomposition for any AI product question — and the test that tells you when the honest answer is "do not use AI here."',
  concept:[
    {title:'The default structure',card:`
      <p>Five branches, in this order, cover almost every AI product question:</p>
      <div class="f">1. USER & JOB      who, what job, how it fails today
2. AI FIT          why a model beats rules/search/a human
3. SYSTEM          inputs → retrieval → model → action → UI
4. ECONOMICS       cost/request × volume vs. value created
5. MEASURE & RISK  offline eval, online metric, guardrail, kill switch</div>
      <p>Order matters. Candidates who start at 3 sound like engineers; candidates who never reach 4 and 5 sound like designers. The PM connects 1 to 5.</p>`},
    {title:'The AI-fit test — five questions',card:`
      <p>Run it out loud before designing anything. AI fits when:</p>
      <ol>
        <li><strong>The task is judgment-shaped, not rule-shaped.</strong> If you can write the rules in a week, write the rules — cheaper, faster, debuggable.</li>
        <li><strong>Being right most of the time is genuinely useful.</strong> An 85%-correct draft saves work; an 85%-correct wire transfer is a catastrophe.</li>
        <li><strong>Verification is cheaper than creation.</strong> The user can check output faster than producing it — why summarisation and code completion work so well.</li>
        <li><strong>The knowledge exists somewhere retrievable.</strong> If the answer lives only in a colleague's head, no model finds it.</li>
        <li><strong>Latency and cost fit the interaction.</strong> A 6-second wait is fine for a report and fatal for autocomplete.</li>
      </ol>
      <div class="trap"><b>Say the honest no.</b> "For refund eligibility I wouldn't use an LLM to decide — the rules are written, auditable, and change quarterly. I'd use the model to explain the decision and to handle the exceptions queue." Interviewers weight that heavily: scoping AI out of the wrong places is most of the job.</div>`},
    {title:'Solution shapes — pick deliberately',card:`
      <p>Naming the shape early prevents a vague answer. Four shapes, ascending risk:</p>
      <ul>
        <li><strong>Assist</strong> — model drafts, human edits and owns. Lowest risk, fastest to ship, smallest win.</li>
        <li><strong>Suggest / rank</strong> — model orders options, human picks. Errors are cheap because alternatives are visible.</li>
        <li><strong>Act with approval</strong> — model proposes an action, human approves. The enterprise middle ground.</li>
        <li><strong>Act autonomously</strong> — model executes. Requires reversibility, hard limits, audit trail, rollback story.</li>
      </ul>
      <div class="tip"><b>Strong move:</b> propose a ladder, not a point. "Ship as assist, instrument acceptance rate, promote to act-with-approval only when acceptance exceeds 80% for four consecutive weeks on the top three intents." A roadmap and a risk control in one sentence.</div>`},
    {title:'Designing for a probabilistic system',card:`
      <p>Deterministic software is designed around what it does. AI products must also be designed around what happens when it is wrong. Four surfaces to mention unprompted:</p>
      <ul>
        <li><strong>Uncertainty display</strong> — grounding citations, hedged language, or nothing (often the honest choice — fake confidence scores are worse than none).</li>
        <li><strong>Cheap correction</strong> — undo, edit-in-place, regenerate with a nudge. If the fix costs more than the task, users abandon.</li>
        <li><strong>Abstention</strong> — a designed "I don't know, here's what I can do" path. Almost always underbuilt.</li>
        <li><strong>Feedback capture</strong> — the user's edit <em>is</em> your best eval and training signal. Instrument it day one, not post-launch.</li>
      </ul>
      <div class="note"><b>Line worth memorising:</b> "The model determines the ceiling; the interaction design determines whether users ever reach it."</div>`},
    {title:'The 90-second delivery script',card:`
      <div class="f">"I'll answer in five parts.

 USER: [segment] doing [job], failing today because [X].
 FIT:  a model because [judgment-shaped], and the error mode
       is [recoverable/not] because [Y].
 SYSTEM: [inputs] → [retrieval] → [model] → [action] → [UI],
       shipped as [assist/suggest/approve/autonomous].
 ECONOMICS: [volume] × [cost/request] against [value].
 MEASURE: offline [eval set], online [metric], guardrail [floor],
       kill it if [condition]."</div>
      <p>Practise until automatic. In a 45-minute interview the structure is not the impressive part — its absence is the memorable part.</p>`}
  ],
  drills:[
    {type:'mcq',
     q:'Which is the weakest candidate for an LLM feature?',
     options:[
       'Summarising a 40-message support thread for the next agent.',
       'Deciding whether a customer qualifies for a contractual SLA credit.',
       'Drafting a first-pass reply the agent edits before sending.',
       'Tagging incoming tickets by likely product area.'],
     correct:1,
     hints:['Which has written rules, an audit requirement, and an expensive error?'],
     sol:`<p><strong>B.</strong> SLA credit eligibility is defined in a contract: rule-shaped, auditable, and a wrong answer is a financial and legal error rather than an inconvenience. Use deterministic logic for the decision.</p>
       <p>The nuance that earns the point: <em>"I'd still use a model around it — to extract the incident timeline from messy ticket text and to explain the decision in plain language. Model at the edges, rules at the core."</em> That pattern is the right instinct for regulated decisions.</p>`},
    {type:'mcq',
     q:'You are designing an AI feature that drafts performance-review feedback for managers. What shape should v1 take?',
     options:[
       'Autonomous — generate and submit the review, manager notified afterward.',
       'Assist — generate a draft the manager must edit and explicitly submit.',
       'Suggest — surface three complete review options to choose between.',
       'Act with approval — generate, show a diff, one-click approve.'],
     correct:1,
     hints:['Who is accountable for the content, and how expensive is a wrong-toned sentence?'],
     sol:`<p><strong>B.</strong> Accountability cannot transfer here: the manager owns words that affect someone's compensation and career. Assist keeps authorship with the human, forces engagement with the content, and captures the highest-value signal — the edits.</p>
       <p>A is indefensible. C invites lazy selection among three plausible-sounding but unverified narratives, rewarding the best-written rather than the most accurate. D looks reasonable, but one-click approve on emotionally-loaded text produces rubber-stamping — the diff UI implies the default is "accept."</p>
       <div class="tip"><b>Rule of thumb:</b> the higher the accountability transfer, the lower the automation level — regardless of model quality.</div>`},
    {type:'open',
     q:'Run the AI-fit test out loud on: "an AI that reads a resume and recommends hire / no-hire."',
     hints:['Work the five fit questions, and be willing to conclude no.'],
     sol:`<p><em>"I'd fail this on three of five tests, and say so directly."</em></p>
       <ul>
         <li><strong>Right-most-of-the-time isn't useful here.</strong> 90% accuracy means one in ten candidates wrongly rejected — with no feedback loop, since rejected candidates never generate outcome data. The error is invisible and permanent.</li>
         <li><strong>Verification isn't cheaper than creation.</strong> A recruiter cannot cheaply verify "no-hire"; checking it properly means doing the full screen anyway.</li>
         <li><strong>Ground truth is contaminated.</strong> Training on past hiring decisions encodes past bias, and in many jurisdictions automated employment decisions carry notice, explanation, and audit obligations.</li>
       </ul>
       <p><em>"What I'd build instead: extraction and structuring — pull skills, dates, and gaps into a consistent format so humans compare like with like; surface which specific job requirements each candidate evidences, with the citation; flag inconsistencies for a human. All verification-cheap, decision stays with an accountable person."</em></p>
       <div class="note"><b>Why this scores:</b> you rejected the framing on principled, testable grounds, then delivered a smaller feature capturing much of the value. "No, but here's what I would build" is the strongest available answer to this class of question.</div>`},
    {type:'open',
     q:'Give the 90-second structured answer to: "Design an AI feature for a spreadsheet product."',
     hints:['Pick one job and go deep. Breadth without depth reads as evasion.'],
     sol:`<p><em>"USER: analysts building recurring reports. They spend hours writing formulas and cleaning imported data — the painful part isn't analysis, it's translating intent into syntax."</em></p>
       <p><em>"FIT: strong. 'Sum revenue by region for last quarter, excluding refunds' is judgment-shaped translation; verification is cheap because the user sees the result and the formula immediately; and the error mode is fully recoverable — a wrong formula is visible and undoable."</em></p>
       <p><em>"SYSTEM: natural-language input → send the sheet schema, column samples, and named ranges as context, not the full data → model returns a formula plus a one-line explanation → preview the result in a ghost cell before commit. Shipped as assist: nothing writes until the user accepts."</em></p>
       <p><em>"ECONOMICS: maybe 8 requests per active analyst per week, a few thousand tokens each — cents per user per month. Cost isn't the constraint; quality is."</em></p>
       <p><em>"MEASURE: offline, 500 versioned intent-to-formula pairs scored by execution equivalence, not string match — two different formulas producing the same result should both pass. Online, acceptance rate and edit-distance-after-accept. Guardrail: never write to a cell without explicit accept, never modify cells the user didn't reference. Kill it if acceptance stays under 40% after two prompt iterations — that says users can't express intent in this surface, which no model upgrade fixes."</em></p>
       <div class="tip"><b>Two details that signal experience:</b> sending schema-plus-samples rather than the whole sheet (a real cost and privacy decision), and execution equivalence rather than string match (a real eval design decision). One concrete detail per section beats three extra features.</div>`},
    {type:'mcq',
     q:'Your AI feature demos well but beta acceptance rate is 30%. Which diagnosis first?',
     options:[
       'Upgrade to a larger model — quality is clearly the bottleneck.',
       'Segment what users did instead of accepting: edited, regenerated, abandoned, or never triggered it.',
       'Add more few-shot examples to the prompt.',
       'Run a satisfaction survey with beta users.'],
     correct:1,
     hints:['Acceptance rate is an outcome of several different failures with opposite fixes.'],
     sol:`<p><strong>B.</strong> A 30% acceptance rate has at least four causes: <em>discovery</em> (never triggered — a UI problem), <em>intent mismatch</em> (triggered on tasks it wasn't built for — a scoping problem), <em>quality</em> (output wrong — model or retrieval), and <em>friction</em> (output fine but accepting is awkward — interaction).</p>
       <p>Segmenting non-accepts tells you which. Only in the quality case do A or C help — and even then, large edit-distance-after-accept often points at format rather than correctness, which a prompt change fixes for free.</p>
       <div class="trap"><b>Reaching for a bigger model first</b> is the most common wrong instinct in AI PM interviews: expensive, slow, and usually aimed at the least likely cause.</div>`}
  ],
  mcase:{
    title:'Ledger — scoping AI into an invoicing product',
    prompt:`<p><strong>Ledger</strong> is a small-business invoicing tool: 200,000 businesses, average 40 invoices a month each. The CEO has asked for "an AI copilot."</p>
      <p>The interviewer wants to see you scope it, not accept it.</p>`,
    steps:[
      {kind:'Scope',
       q:'"An AI copilot" is not a product. What do you do with that brief?',
       sol:`<p><em>"Convert it into a candidate list and score it, rather than designing whatever comes to mind first. Across invoicing there are four plausible AI jobs: extracting line items from receipts and supplier emails; predicting which invoices will be paid late; drafting payment-chase messages; and answering questions about the business's own financial data. I'd score each on value per use, frequency, and cost of a wrong answer."</em></p>
         <div class="f">Job                     Value/use   Frequency   Cost of error
Receipt extraction      Medium      Very high   Low (user sees it)
Late-payment prediction High        Monthly     Medium (misdirected effort)
Chase-message drafting  Low         High        Low (user edits)
Financial Q&A           High        Weekly      HIGH (wrong number → decision)</div>
         <div class="tip"><b>Why this beats jumping to a design:</b> the interviewer can now see your selection criteria. Whichever you pick, it was chosen rather than guessed.</div>`},
      {kind:'AI fit',
       q:'Which one do you build first, and why?',
       sol:`<p><em>"Receipt and document extraction — defended on fit, not excitement."</em></p>
         <ul>
           <li><strong>Judgment-shaped:</strong> supplier documents have infinite formats. Twenty years of template-matching OCR failed at exactly this.</li>
           <li><strong>Verification is cheap:</strong> the user glances at four extracted fields against the image. Seconds to check, minutes to type.</li>
           <li><strong>Errors are recoverable and visible</strong> — the wrong amount sits next to the source document, in an editable field, before anything saves.</li>
           <li><strong>Frequency is enormous</strong> — 200k businesses × dozens of documents monthly, so small per-use savings compound and every correction is a labelled example.</li>
         </ul>
         <p><em>"I'd explicitly not start with financial Q&A, even though it demos best. A confidently wrong 'your Q3 revenue was $412,000' is the answer someone takes to their accountant or their bank. High value, wrong error cost for a v1 — and I'd want eval infrastructure proven on extraction first."</em></p>`},
      {kind:'Economics',
       q:'Extraction runs on 40 documents/month for 200k businesses. At 1,200 input tokens and 200 output tokens per document, input $3/M and output $15/M, what is the monthly inference cost?',
       unit:'$ per month', a:52800, tol:0.04, ph:'e.g. 40,000',
       sol:`<div class="f">Documents/month = 200,000 × 40 = 8,000,000

Input:  8M × 1,200 = 9.6B tokens = 9,600 M-tok × $3  = $28,800
Output: 8M × 200   = 1.6B tokens = 1,600 M-tok × $15 = $24,000
Total ≈ $52,800/month  (~$0.0066 per document)</div>
         <p>Then the "so what": <em>"Two-thirds of a cent per document, about $0.26 per business per month. Against a $20–40 plan that's roughly a 1% hit to gross margin — affordable, which reframes the decision: cost isn't the constraint, quality and trust are. Had I computed $3 per business, the whole design changes — batching, a smaller model, or gating behind a paid tier."</em></p>
         <div class="note"><b>The habit being tested:</b> compute the number, convert to per-user and per-margin terms, then say what decision it changes. A cost figure with no decision attached earns nothing.</div>`},
      {kind:'Measure',
       q:'How would you measure extraction quality — offline and online?',
       widget:'evalTradeoff',
       sol:`<p><strong>Offline.</strong> <em>"A golden set of 1,000 documents, stratified rather than random: handwritten receipts, foreign-currency invoices, multi-page statements, poor photos, non-English suppliers. Score per field, not per document — 'amount' wrong is a different severity from 'supplier address' wrong. Versioned, re-run on every prompt or model change."</em></p>
         <p><strong>Online.</strong> <em>"Edit rate per field is primary — a free, continuous, in-product ground truth. Then time-to-save versus manual baseline, and abandonment after extraction, which catches output so wrong the user gives up instead of correcting."</em></p>
         <div class="f">Field           Offline acc.  Online edit rate  Severity
Total amount    99.2%         1.4%              Critical
Date            98.0%         3.1%              High
Supplier name   96.5%         6.0%              Medium
Line items      89.0%         18%               Low (often ignored)</div>
         <p><em>"Guardrail: if amount-field edit rate exceeds 3% in any weekly cohort, roll back — that field is load-bearing for the customer's books. And note the tradeoff in the panel above: for a rare failure class, high recall with low precision floods the user with false flags and they stop reading flags entirely. Tune the 'needs review' threshold against reviewer fatigue, not against F1."</em></p>
         <div class="tip"><b>Senior move:</b> per-field severity weighting plus a named rollback threshold on the field that matters. "We'd track accuracy" is junior; "amount-field edit rate with a 3% rollback trigger" is not.</div>`}
    ]
  }
});

/* =========================================================================
   MODULE 3 — AI unit economics
   ========================================================================= */
MODULES.push({
  id:'m03',tag:'Quant core',
  title:'AI unit economics — tokens, cost per request, margin',
  sub:'The arithmetic that decides which AI features can exist. Speed matters: you will be asked to do this out loud.',
  concept:[
    {title:'The master equation',card:`
      <div class="f">cost/request = (input_tokens × price_in + output_tokens × price_out) / 1,000,000
monthly cost = cost/request × requests/user/month × active users
gross margin = (revenue/user − cost/user) / revenue/user</div>
      <p>Every AI economics question is this equation with one variable hidden. Set it up before touching numbers, exactly as you would in a consulting case.</p>
      <div class="tip"><b>Unit shortcut:</b> at $3/M input, 1,000 tokens costs $0.003 — three-tenths of a cent. Anchor there and scale: 10k tokens ≈ 3¢, 100k ≈ 30¢. Most cost questions fall out of that one anchor.</div>`},
    {title:'Token intuition you should hold without a calculator',card:`
      <ul>
        <li><strong>1 token ≈ 4 characters ≈ 0.75 words</strong> in English. 1,000 words ≈ 1,350 tokens.</li>
        <li><strong>A page of text ≈ 500–800 tokens.</strong> A 30-page PDF ≈ 20k tokens.</li>
        <li><strong>A chat turn</strong> is usually 100–500 output tokens; a long-form draft 800–2,000.</li>
        <li><strong>Output is priced 3–5× input</strong> and generated serially, so it dominates both cost and latency.</li>
        <li><strong>Conversation cost grows quadratically</strong> if you resend full history each turn: turn 10 pays for turns 1–9 again.</li>
      </ul>
      <div class="trap"><b>The quadratic-context trap</b> is a favourite probe. A 20-turn conversation at 500 tokens per turn does not cost 20 × 500 input tokens — it costs roughly 500 × (1+2+…+20) ≈ 105k unless you truncate, summarise, or cache.</div>`},
    {title:'The four levers on cost per request',card:`
      <ol>
        <li><strong>Model routing</strong> — send easy traffic to a small model. If 80% routes cheap, blended cost falls sharply at identical quality on the hard 20%.</li>
        <li><strong>Prompt/context discipline</strong> — retrieve 5 chunks, not 50. Most bloated prompts are lazy retrieval, not necessary context.</li>
        <li><strong>Caching</strong> — repeated system prompts and shared document prefixes cache at a large discount; exact-match response caching is free money on head queries.</li>
        <li><strong>Output length control</strong> — cap length, ask for structured output, stop when done. Also improves latency and often quality.</li>
      </ol>
      <div class="note"><b>Order to say them in:</b> output length → retrieval discipline → caching → routing. Roughly cheapest-to-implement first, and it signals you have run a cost reduction rather than read about one.</div>`},
    {title:'Blended cost with routing',card:`
      <p>With routing, use a weighted average — the same mix math as any consulting case:</p>
      <div class="f">80% of traffic → small model @ $0.20 per 1k requests
20% of traffic → large model @ $4.00 per 1k requests

blended = 0.8 × 0.20 + 0.2 × 4.00 = 0.16 + 0.80 = $0.96 per 1k
vs. all-large $4.00 per 1k  →  76% cost reduction</div>
      <p>The follow-up is always <em>"what does routing cost you in quality?"</em> Answer: a routing eval — measure quality on the routed-cheap subset specifically, not on average traffic, because averages hide exactly the regression you care about.</p>`},
    {title:'Margin structure — why AI is not classic SaaS',card:`
      <p>Classic SaaS runs 75–85% gross margin because serving cost is near zero per user. AI features carry real marginal cost, so:</p>
      <ul>
        <li><strong>Heavy users can be unprofitable</strong> at a flat price. In classic SaaS your best users cost nothing; here they cost the most.</li>
        <li><strong>Margin depends on usage distribution</strong>, which is heavily skewed — model the top decile separately, always.</li>
        <li><strong>Costs fall over time</strong> as model prices drop, so a 40%-margin feature today may be 70% in 18 months. That is a real argument for shipping thin — but say it explicitly rather than hoping.</li>
      </ul>
      <div class="tip"><b>Interview-ready framing:</b> "Price for the median user, cap or meter the top 5%, and re-underwrite the whole thing every time token prices move."</div>`}
  ],
  sprints:[
    {title:'Token cost drill',gen:'tokencost',seconds:60,target:7,
     sub:'Convert tokens and per-million pricing into cents. Decimals allowed.'},
    {title:'Daily spend drill',gen:'costper',seconds:60,target:8,
     sub:'Cost per request × volume — the most common quick-math ask in an AI PM screen.'},
    {title:'Gross margin drill',gen:'aimargin',seconds:60,target:9,
     sub:'Revenue per user minus inference cost, as a margin percentage.'},
    {title:'Cache-savings drill',gen:'cachesave',seconds:75,target:5,
     sub:'Apply a hit rate and a discount to monthly spend. Weighted averages in disguise.'}
  ],
  drills:[
    {type:'num',
     q:'A chat feature averages 12 turns per session. Each turn adds 400 tokens of history. If full history is resent every turn, roughly how many input tokens does one session consume?',
     body:'<p>Assume turn <em>n</em> sends 400 × <em>n</em> input tokens.</p>',
     unit:'input tokens', a:31200, tol:0.06, ph:'e.g. 25,000',
     hints:['Sum of 1 to 12 is 78.','400 × (1+2+…+12) = 400 × 78.'],
     sol:`<div class="f">Input tokens = 400 × (1+2+…+12) = 400 × 78 = 31,200
Naive estimate (12 × 400 = 4,800) understates by 6.5×</div>
       <p>Say the "so what": <em>"Context accumulation makes long sessions six-plus times more expensive than a per-turn estimate suggests, and it is worse at the tail — a 40-turn power-user session is 20× naive. That is why I would summarise history beyond turn 10 and cache the stable prefix, rather than simply picking a cheaper model."</em></p>`},
    {type:'num',
     q:'Routing: 75% of traffic to a model at $0.40 per 1k requests, 25% at $6.00 per 1k. Blended cost per 1k?',
     unit:'$ per 1k requests', a:1.8, tol:0.02, ph:'e.g. 2.50',
     hints:['Weighted average: 0.75 × 0.40 + 0.25 × 6.00.'],
     sol:`<div class="f">0.75 × $0.40 = $0.30
0.25 × $6.00 = $1.50
Blended       = $1.80 per 1k  (vs $6.00 all-large → 70% saving)</div>
       <p>Then raise the challenge yourself: <em>"The saving is real, but the number that matters is quality on the routed-cheap 75%. I would hold a routing eval — same golden set, scored separately for cheap-routed and escalated traffic — and add an escalation path when the small model is unsure, so a router failure degrades cost rather than quality."</em></p>`},
    {type:'num',
     q:'A $30/month product includes an AI assistant. Median user: 60 requests/month at 4,000 input and 500 output tokens. Input $1/M, output $5/M. Median gross margin?',
     unit:'%', a:98.7, tol:0.02, ph:'e.g. 85',
     hints:['Cost per request first, then per month, then margin.'],
     sol:`<div class="f">Input:  4,000 × $1/M = $0.0040
Output:   500 × $5/M = $0.0025
Cost/request         = $0.0065
Monthly = 60 × $0.0065 = $0.39
Margin  = (30 − 0.39) / 30 = 98.7%</div>
       <p>The interesting question is never the median: <em>"At the median this is a rounding error. The real question is the 95th percentile — if the top 5% run 40× median usage, that is roughly $15.60 of cost against $30 of revenue, and those users are exactly the ones who renew and refer. That is why I would model the usage distribution before pricing, and why unlimited-usage AI pricing is a bet on the shape of that tail."</em></p>`},
    {type:'mcq',
     q:'Your AI feature costs $180k/month at 3M requests. Which lever first?',
     options:[
       'Negotiate a volume discount with the model provider.',
       'Check output-token length and retrieval size before anything else.',
       'Fine-tune a small open model to replace the frontier model.',
       'Move to self-hosted inference on reserved GPUs.'],
     correct:1,
     hints:['Which lever is free, fast, and reversible?'],
     sol:`<p><strong>B.</strong> $0.06 per request is high for most workloads, which usually means bloated prompts (40 chunks where 6 suffice) or unbounded output. Both are prompt-level changes: hours of work, instantly reversible, frequently 30–60% savings with <em>no</em> quality loss — sometimes a gain, since tighter context reduces distraction.</p>
       <p>A is worth starting in parallel but runs on a procurement timeline. C and D are multi-month commitments with headcount attached; you do not take on a serving team before checking whether you are simply sending too many tokens.</p>
       <div class="note"><b>Sequencing principle:</b> reversible and free before expensive and structural. Applies equally to cost, latency, and quality.</div>`},
    {type:'open',
     q:'How would you decide the price of a usage-metered AI feature?',
     hints:['Floor, ceiling, then the shape in between.'],
     sol:`<p>Three anchors, in order:</p>
       <ul>
         <li><strong>Floor — marginal cost plus margin target.</strong> Cost per unit of work $0.02 and a 70% margin target gives a floor near $0.07. Below that you are buying revenue.</li>
         <li><strong>Ceiling — value delivered.</strong> If it replaces 20 minutes of a $60/hour employee, it creates ~$20 of value; above roughly a third of that, conversion collapses.</li>
         <li><strong>Shape — how usage distributes.</strong> Exact metering is honest but taxes adoption with meter anxiety. A credit bundle with overage usually beats pure metering: predictable for the buyer, protected for you.</li>
       </ul>
       <p>Then the strategic caveat: <em>"I would decide deliberately whether to price on cost or on value. Token costs fall fast, so a cost-plus price ratchets down and trains customers to expect it. Value pricing lets margin expand as costs fall — but only if the value metric is one the customer already believes in, like tickets deflected or documents processed, never tokens."</em></p>`}
  ],
  mcase:{
    title:'Composer — will the AI tier survive contact with power users?',
    prompt:`<p><strong>Composer</strong> is a $25/month writing tool with 400,000 subscribers. The team wants to bundle an AI drafting assistant into the existing price rather than charge separately.</p>
      <p>Usage modelling: 60% light (10 drafts/month), 30% medium (50), 10% heavy (400). A draft averages 2,000 input and 900 output tokens. Input $2/M, output $10/M.</p>`,
    steps:[
      {kind:'Cost per draft',
       q:'What is the cost per draft?',
       unit:'$ per draft', a:0.013, tol:0.04, ph:'e.g. 0.008',
       sol:`<div class="f">Input:  2,000 × $2/M  = $0.004
Output:   900 × $10/M = $0.009
Cost per draft        = $0.013</div>
         <p>Note the shape before moving on: <em>"Output is 69% of cost despite being under a third of the tokens. Cost work here starts with draft length — and conveniently, shorter first drafts are often better product, because users edit rather than read."</em></p>`},
      {kind:'Blended cost',
       q:'What is the blended monthly inference cost per subscriber across the three segments?',
       unit:'$ per user per month', a:0.793, tol:0.05, ph:'e.g. 0.55',
       sol:`<div class="f">Weighted drafts/user = 0.6×10 + 0.3×50 + 0.1×400
                     = 6 + 15 + 40 = 61 drafts
Cost = 61 × $0.013 = $0.79 per user per month</div>
         <p><em>"About 79 cents against $25 of revenue — roughly 3% of price, so blended margin holds near 97%. But the blended number hides the entire risk, and I would say so before anyone celebrates: heavy users are 10% of the base and 66% of the cost."</em></p>
         <div class="tip"><b>Always decompose a blended average in an AI economics case.</b> The blend is what finance wants; the tail is what breaks.</div>`},
      {kind:'The tail',
       q:'What does a heavy user cost per month, and what would you do about it?',
       unit:'$ per month', a:5.2, tol:0.05, ph:'e.g. 5',
       sol:`<div class="f">400 drafts × $0.013 = $5.20/month
= 21% of the $25 subscription, from 10% of users</div>
         <p><em>"$5.20 is survivable — that tier is still ~79% margin. Three things could break it: usage growing as people discover the feature, the heavy segment skewing further as the product improves, and heavy users being disproportionately the annual-plan referrers you cannot simply price away."</em></p>
         <p><em>"What I would do: no hard cap at launch — capping the users who love a new capability most is how you kill its adoption. Instead: instrument percentile usage weekly; alert internally at 3× current heavy usage; and design so the cheap path is the good path — shorter first drafts, regenerate-section rather than regenerate-all, and prefix caching, which for a writing tool is nearly free savings on every iteration."</em></p>
         <div class="note"><b>What is being scored:</b> you separated "is this affordable now" from "what would make it unaffordable," and your mitigation is a product design change rather than a pricing punishment.</div>`},
      {kind:'Recommendation',
       q:'Bundle it into $25, or charge separately? Answer with the condition attached.',
       widget:'tokenEcon',
       sol:`<p><strong>Answer first.</strong> <em>"Bundle it, and treat it as a retention and upgrade lever rather than a revenue line — with a metered escape hatch built now and shipped dark."</em></p>
         <p><strong>Why.</strong> <em>"At 3% of price, cost is not the deciding factor; adoption is. A separate charge cuts adoption sharply, and a writing assistant needs adoption to generate the edit data that makes it better. Bundled, it also becomes a reason to stay when a competitor ships something similar."</em></p>
         <p><strong>The condition.</strong> <em>"Write the reversal trigger into the launch doc: if blended cost per subscriber exceeds 8% of ARPU for two consecutive months, we activate the metered tier — which is why the metering infrastructure ships before launch even though it is off. Retrofitting metering onto an unlimited feature is a customer-trust event; having it ready is a config change."</em></p>
         <p><strong>Risks.</strong> <em>"Two. Token prices could rise, though the trend is strongly the other way. And bundling teaches customers that AI is free, which makes the next AI feature harder to price — so I would establish now that the premium tier is where the heaviest AI capabilities live."</em></p>
         <div class="tip"><b>Use the panel above</b> to find your own reversal trigger: hold price at $20 and find the requests-per-month value where margin crosses 70%. That number is what you monitor — not the cost itself.</div>`}
    ]
  }
});

   MODULE 4 — Latency, throughput & capacity
   ========================================================================= */
MODULES.push({
  id:'m04',tag:'Quant core',
  title:'Latency, throughput & capacity',
  sub:'Why the feature feels slow, which stage to cut, and how to size infrastructure — the numbers behind every "can we ship this?" conversation.',
  concept:[
    {title:'The two numbers that matter',card:`
      <ul>
        <li><strong>TTFT — time to first token.</strong> Everything before generation starts: network, retrieval, prefill. This is what users perceive as "did it hear me?"</li>
        <li><strong>TPS — tokens per second during decode.</strong> How fast text streams once started. Above ~20 tokens/sec, reading speed becomes the constraint rather than the model.</li>
      </ul>
      <div class="f">total time = TTFT + (output_tokens / tokens_per_second)</div>
      <div class="tip"><b>The insight interviewers wait for:</b> with streaming, total time barely matters below the abandonment threshold — TTFT does. 400ms TTFT with slow streaming feels better than a 4s wait followed by an instant dump.</div>`},
    {title:'Where the milliseconds go',card:`
      <p>A typical RAG request, and what each stage responds to:</p>
      <div class="f">Embed query        10–50ms    (rarely the problem)
Vector search      20–200ms   (index type, filters, top-k)
Rerank             50–300ms   (a cross-encoder is a real cost)
Prefill prompt     100ms–2s   (scales with prompt length!)
Decode             output_tokens / TPS</div>
      <p><strong>Prefill scales with prompt size</strong>, so stuffing 50 retrieved chunks hurts twice: cost and TTFT. Cutting retrieval from 50 chunks to 8 is often the largest single latency win available — and it usually improves answer quality too.</p>`},
    {title:'Latency budgets by interaction type',card:`
      <ul>
        <li><strong>Inline autocomplete:</strong> under 300ms total, or it is worse than nothing — the suggestion lands after the user typed past it.</li>
        <li><strong>Conversational reply:</strong> TTFT under 1s, streaming after. Users tolerate 10s of streaming if it starts fast.</li>
        <li><strong>Explicit "generate" action:</strong> up to ~5s with a progress indicator; beyond that, show intermediate work.</li>
        <li><strong>Background job:</strong> minutes are fine — but you must change the interaction to asynchronous, not simply make people wait.</li>
      </ul>
      <div class="trap"><b>The wrong fix:</b> "we will use a faster model." Often the honest fix is changing the interaction — inline to on-request, synchronous to background-with-notification. Reach for the interaction lever before the infrastructure one.</div>`},
    {title:'Capacity sizing, roughly',card:`
      <p>You will not be asked to size a GPU fleet precisely. You will be asked to reason about it:</p>
      <div class="f">concurrent requests ≈ arrival rate × average duration   (Little's Law)

50 req/sec × 4s average = 200 concurrent streams
One GPU serves ~20 concurrent streams → ~10 GPUs at steady state
Peak is 3–5× average for consumer traffic → provision 30–50, or burst to API</div>
      <div class="note"><b>The senior framing:</b> "Hold baseline capacity for the median and burst to a provider API at peak. Owning peak capacity means paying for idle GPUs 20 hours a day — the hybrid beats either extreme."</div>`},
    {title:'The quality / latency / cost triangle',card:`
      <p>Every AI decision moves along this triangle, and naming the trade explicitly is a scoring moment:</p>
      <ul>
        <li><strong>Bigger model</strong> → better quality, worse latency, worse cost.</li>
        <li><strong>More retrieved context</strong> → usually better grounding, worse latency and cost, and beyond a point <em>worse</em> quality as relevant chunks get buried.</li>
        <li><strong>More reasoning steps or self-critique</strong> → better quality on hard tasks, multiplied latency and cost.</li>
        <li><strong>Caching and routing</strong> → the rare pure win, priced in engineering complexity and a routing eval you must maintain.</li>
      </ul>
      <div class="tip"><b>Say it out loud:</b> "Spend latency where users are patient and quality where errors are expensive." A per-surface budget beats one global standard.</div>`}
  ],
  sprints:[
    {title:'Streaming duration drill',gen:'throughput',seconds:60,target:8,
     sub:'Output tokens ÷ tokens-per-second. Answer in seconds.'},
    {title:'GPU run-cost drill',gen:'gpuhours',seconds:60,target:8,
     sub:'GPUs × hours × rate — the arithmetic behind every fine-tuning cost question.'}
  ],
  drills:[
    {type:'num',
     q:'Retrieval takes 180ms, prefill of a 9,000-token prompt runs at 15k tokens/sec, and the model streams 600 output tokens at 60 tokens/sec. Total response time?',
     unit:'seconds', a:10.78, tol:0.04, ph:'e.g. 8.5',
     hints:['Prefill = 9,000 / 15,000 sec.','TTFT = retrieval + prefill; then add decode.'],
     sol:`<div class="f">Retrieval  = 0.180s
Prefill    = 9,000 / 15,000 = 0.600s
TTFT       = 0.78s
Decode     = 600 / 60 = 10.0s
Total      ≈ 10.78s</div>
       <p>The "so what" is where the point is: <em>"TTFT is fine at 0.78s — the user knows immediately it is working. 93% of wall-clock is decode, so the only meaningful lever is output length: cutting 600 tokens to 250 saves nearly six seconds. Faster hardware, retrieval tuning, and a smaller model all optimise the small part of the budget."</em></p>
       <div class="note"><b>Diagnostic habit:</b> compute each stage as a percentage of total before recommending anything. Most latency proposals in the wild optimise a stage worth 5%.</div>`},
    {type:'num',
     q:'Traffic averages 40 requests/second with an average duration of 6 seconds. How many concurrent requests are in flight at steady state?',
     unit:'concurrent requests', a:240, tol:0.02, ph:'e.g. 200',
     hints:["Little's Law: concurrency = arrival rate × duration."],
     sol:`<div class="f">Concurrency = 40 req/s × 6s = 240 in flight</div>
       <p>Then extend it, because the follow-up is always capacity: <em>"If a GPU handles ~24 concurrent streams at acceptable latency, that is 10 GPUs at average load. But average is the wrong planning number — consumer peaks run 3–5× average, so I would hold 12–15 and burst the rest to an API. And note the feedback loop: if latency degrades under load, duration rises, which raises concurrency, which degrades latency further. That is why you add admission control rather than letting the system find its own equilibrium."</em></p>`},
    {type:'mcq',
     q:'Users say your AI search feels sluggish. p50 is 1.2s, p95 is 9s. What do you investigate first?',
     options:[
       'Reduce p50 — it affects the most users.',
       'Find what is different about the p95 requests: longer documents, more chunks, cache misses, or a specific tenant.',
       'Add a loading animation to make the wait feel shorter.',
       'Switch to a faster model across all traffic.'],
     correct:1,
     hints:['A 7.5× gap between p50 and p95 is a distribution problem, not a speed problem.'],
     sol:`<p><strong>B.</strong> That spread means a subpopulation is structurally different — enterprise tenants with huge corpora, queries that trigger reranking, cold caches, or one customer whose documents are 50× the median. Speeding everything up is the expensive way to fix a problem living in 5% of requests.</p>
       <p>The line to say: <em>"Users do not experience p50 — they experience their own worst sessions. And a heavy user hits p95 far more often than a light one, so the tail disproportionately shapes the opinion of exactly the users you can least afford to lose."</em></p>
       <p>C is not nothing — perceived latency is real — but it is mitigation before diagnosis. D pays for the whole distribution to fix the tail.</p>`},
    {type:'open',
     q:'Your inline code-completion feature has a 600ms p50. Product wants under 250ms. Give three options and what each costs you.',
     hints:['Think across the stack: model, prompt, and interaction design.'],
     sol:`<ul>
         <li><strong>Smaller/distilled model, escalate for larger blocks.</strong> Biggest latency win. Costs quality on multi-line suggestions — mitigate by routing on request shape and holding a separate eval for the cheap path.</li>
         <li><strong>Shrink the prompt.</strong> Send the current function plus imports rather than the whole file. Cuts prefill sharply, costs some cross-file awareness — usually invisible for single-line completions, painful for multi-line.</li>
         <li><strong>Speculative prefetch on typing pause.</strong> Start generating at a 120ms pause, discard if typing resumes. Feels near-instant; costs real money on discarded generations, so it needs a wasted-work budget and a hit-rate metric.</li>
       </ul>
       <p>Then reframe, because this is the answer they are waiting for: <em>"I would also challenge the 250ms target. If acceptance rate is flat between 250ms and 600ms, we are buying nothing — I would run a latency-injection experiment to find where acceptance actually degrades and set the budget from that curve rather than from a round number. Latency targets should be measured, not chosen."</em></p>
       <div class="tip"><b>Latency-injection experiments</b> — deliberately adding delay to a holdout to find where behaviour changes — are a genuinely senior tool. Mentioning one signals real experience.</div>`},
    {type:'num',
     q:'You fine-tune on 8 GPUs for 14 hours at $4.50/GPU-hour, and expect 6 runs before the recipe is right. Total experiment budget?',
     unit:'$', a:3024, tol:0.02, ph:'e.g. 2,500',
     hints:['One run first, then multiply by attempts.'],
     sol:`<div class="f">One run  = 8 × 14 × $4.50 = $504
Six runs = $3,024</div>
       <p><em>"About $3k of compute — trivial against a single engineer-month, which is the real cost. That is the point I would make to leadership: fine-tuning decisions are almost never blocked by GPU spend, they are blocked by the dataset and the eval. Without 2,000 clean labelled examples and a scoring function we trust, the $3k buys a model we cannot evaluate."</em></p>
       <div class="note"><b>Reframing compute cost as people cost</b> reliably signals someone who has run these projects.</div>`}
  ],
  mcase:{
    title:'Atlas Search — the enterprise tenant that broke the latency budget',
    prompt:`<p><strong>Atlas</strong> ships AI search inside a document platform. The SLA promises p95 under 3 seconds.</p>
      <p>Since onboarding a large enterprise customer, p95 has risen to 11 seconds. p50 is unchanged at 900ms. The customer is threatening to churn; engineering wants to buy more GPUs.</p>`,
    steps:[
      {kind:'Diagnose',
       q:'p50 flat, p95 up 3.7×. What does that pattern tell you, and what do you ask for?',
       sol:`<p><em>"Flat p50 rules out a global regression — the median path is untouched, so this is not the model, the network, or a deploy. Something about a subset of requests changed, and the obvious candidate is the new tenant."</em></p>
         <p><em>"I would ask for p95 broken down four ways: by tenant, by corpus size, by query type, and by cache hit or miss. Hypothesis: one tenant has a corpus one or two orders of magnitude larger, so their vector search scans more, retrieves more, and produces longer prompts — inflating prefill on top of search."</em></p>
         <p><strong>Interviewer:</strong> "The new tenant is 4% of requests. Their p50 is 8 seconds. Their corpus is 40× the median customer and they use metadata filters heavily."</p>
         <div class="tip"><b>Note what happened:</b> 4% of traffic with a bad p50 is enough to dominate aggregate p95. Whenever p95 moves and p50 does not, look for a small structurally-different population before touching the model.</div>`},
      {kind:'Locate the cost',
       q:'Their p50 is 8s: retrieval 4.5s, prefill 1.8s, decode 1.7s. Which stage do you attack, and what is the ceiling on the improvement?',
       sol:`<p><em>"Retrieval is 56% of their latency and the stage most likely misconfigured, so it is first. Heavy metadata filtering on a 40× corpus usually means the filter is applied post-search — scan a huge candidate set, then discard most of it — or the index is not partitioned on the fields they filter."</em></p>
         <div class="f">Current:  4.5 + 1.8 + 1.7 = 8.0s
Partitioned index + pre-filter: 4.5s → ~0.6s
Top-k 40 → 10, so prefill 1.8s → ~0.7s
New total ≈ 0.6 + 0.7 + 1.7 = 3.0s</div>
         <p><em>"A 62% cut without touching the model — and note the second-order effect: fewer chunks means a smaller prompt, which cuts cost as well as prefill, and frequently improves answers because the relevant chunk is no longer buried among 30 irrelevant ones."</em></p>
         <div class="note"><b>The point being tested:</b> more GPUs would have bought nothing. Decode is 21% of the problem, and decode is the only stage GPUs speed up.</div>`},
      {kind:'Quantify the blast radius',
       q:'If the tenant is 4% of 2M monthly requests and each request carries 5,000 more input tokens than the median at $2/M, what is the excess monthly cost?',
       unit:'$ per month', a:800, tol:0.03, ph:'e.g. 1,200',
       sol:`<div class="f">Their requests = 2,000,000 × 4% = 80,000/month
Excess tokens  = 80,000 × 5,000 = 400M tokens
Excess cost    = 400 M-tok × $2/M = $800/month</div>
         <p><em>"$800 a month — immaterial next to the churn risk of an enterprise account, and that asymmetry is the point. I would say plainly: this is not a cost problem, it is an architecture problem with a small cost signature. Had I found $80,000, the conversation would be about tenant-level pricing instead."</em></p>
         <div class="tip"><b>Computing the number that turns out not to matter</b> is still worth doing — it tells you which conversation to have, and stops someone raising it later as a distraction.</div>`},
      {kind:'Recommend',
       q:'Give your recommendation to the CTO in 60 seconds.',
       widget:'ragLatency',
       sol:`<p><strong>Answer first.</strong> <em>"Do not buy GPUs. This is a retrieval architecture problem in one tenant, and more decode capacity fixes the 21% of their latency that is not broken."</em></p>
         <p><strong>Support.</strong> <em>"p50 is unchanged, so nothing global regressed. The new tenant is 4% of traffic with an 8-second median, and 56% of that is vector search against a 40× corpus with post-filtering. Partition the index on their filter fields, cut top-k from 40 to 10, and we model them at roughly 3 seconds — inside SLA — at lower cost and probably better answers."</em></p>
         <p><strong>Risks.</strong> <em>"Two. Re-indexing a corpus this size is a multi-day job, so I want a shadow index and a rollback path rather than an in-place change. And cutting top-k could reduce recall on genuinely broad queries — so run their query log against both configurations offline first, and gate on answer quality holding flat."</em></p>
         <p><strong>Next steps.</strong> <em>"Three: publish a per-tenant latency dashboard this week so we stop learning about this from churn threats; add corpus size and filter cardinality to the onboarding checklist, because we sold an enterprise deal into an architecture sized for mid-market; and make SLA per-tenant rather than global, since a global p95 will always hide the customer about to leave."</em></p>
         <div class="note"><b>What makes this close strong:</b> it refuses the proposed solution with evidence, sizes the alternative, names migration risk unprompted, and converts the incident into a process fix. Use the panel above to build the same argument visually — drag retrieval down and watch how little total time moves once decode dominates.</div>`}
    ]
  }
});

   MODULE 5 — Eval & experiment math
   ========================================================================= */
MODULES.push({
  id:'m05',tag:'Quant core',
  title:'Eval & experiment math',
  sub:'Precision, recall, the accuracy paradox, sample size, and reading an A/B result on a probabilistic feature.',
  concept:[
    {title:'The confusion matrix, said out loud',card:`
      <div class="f">                 Model says YES      Model says NO
Truly YES        True positive (TP)  False negative (FN)
Truly NO         False positive (FP) True negative (TN)

precision = TP / (TP + FP)   "when it flags, is it right?"
recall    = TP / (TP + FN)   "of the real ones, how many did it catch?"
F1        = 2PR / (P + R)    harmonic mean — punishes imbalance</div>
      <p>The product translation is what earns the score: <strong>precision is the user's trust budget</strong> — every false positive spends it. <strong>Recall is the coverage promise</strong> — every miss is a failure the user may never see.</p>`},
    {title:'Which one you optimise is a product decision',card:`
      <ul>
        <li><strong>Recall-first</strong> when a miss is catastrophic and review is cheap: fraud screening, safety filters, security triage, medical flagging.</li>
        <li><strong>Precision-first</strong> when false alarms destroy trust or drown a queue: notifications, auto-suggestions, anything auto-applied.</li>
        <li><strong>Neither, sometimes:</strong> if the output is ranked rather than binary, the honest metric is precision@k or NDCG, not F1.</li>
      </ul>
      <div class="tip"><b>Strong interview line:</b> "I would not pick a threshold from the F1 peak. I would pick it from the reviewer capacity: if the team can process 400 flags a day, the threshold is wherever volume lands at 400, and then I optimise precision within that budget."</div>`},
    {title:'The accuracy paradox',card:`
      <p>With a 1% positive rate, a model that answers "no" every time is 99% accurate and completely useless. Rare-event problems make accuracy meaningless and precision brutal:</p>
      <div class="f">10,000 items, 1% truly positive = 100 positives
Recall 90%, FPR 5%:
  TP = 90        FP = 0.05 × 9,900 = 495
  precision = 90 / 585 = 15.4%
  accuracy  = (90 + 9,405) / 10,000 = 95%</div>
      <p>Five in six flags are wrong, while accuracy reads 95%. Reviewers stop trusting the queue within a week.</p>
      <div class="trap"><b>If an interviewer offers you an accuracy number on a rare-event problem, that is the test.</b> Ask for prevalence immediately — without it, no accuracy figure can be interpreted.</div>`},
    {title:'LLM-as-judge, honestly',card:`
      <p>For generative output there is no confusion matrix, so teams use a model to score outputs against a rubric. It works, with caveats you should name:</p>
      <ul>
        <li><strong>Calibrate against humans</strong> on a few hundred examples first, and report the agreement rate. An uncalibrated judge is a vibe with a number attached.</li>
        <li><strong>Known biases:</strong> judges prefer longer answers, prefer their own family of models, and drift toward the middle of a scale. Pairwise comparison is more stable than absolute scoring.</li>
        <li><strong>Use it for regression detection, not for absolute quality claims.</strong> "Score dropped 6% versus last build" is defensible; "our quality is 4.2/5" is not.</li>
      </ul>
      <div class="note"><b>The complete answer</b> is a three-layer stack: cheap automatic checks (format, groundedness, refusal rate) on every build → LLM-judge on a golden set nightly → human review on a sampled slice weekly. Say the layers and their cadence.</div>`},
    {title:'Experiment math for AI features',card:`
      <div class="f">n per arm ≈ 16 × p(1−p) / Δ²        (80% power, 95% confidence)

baseline p = 20%, detect Δ = 2pp:
n = 16 × 0.2 × 0.8 / 0.0004 = 6,400 per arm</div>
      <p>Three AI-specific wrinkles worth raising unprompted:</p>
      <ul>
        <li><strong>Novelty effects are large</strong> — AI features get outsized early engagement. Two weeks minimum, and check week-2 versus week-1 within the treatment arm.</li>
        <li><strong>Learning effects cut the other way</strong> — users get better at prompting, so a flat week-1 result can turn positive later.</li>
        <li><strong>Non-stationary treatment</strong> — if you change the prompt mid-test, you restarted the experiment. Version the prompt as part of the treatment definition.</li>
      </ul>`}
  ],

    {type:'num',
     q:'A safety classifier reviews 50,000 posts/day. 0.4% are truly violating. Recall is 80%, false-positive rate 2%. How many items land in the human review queue each day?',

     sol:`<div class="f">True positives = 200 × 80% = 160
False positives = 49,800 × 2% = 996
Queue = 160 + 996 = 1,156 items/day
Precision = 160 / 1,156 = 13.8%</div>
       <p><em>"Nearly 1,200 items a day at 14% precision — a reviewer sees six wrong flags for every real one. At 30 seconds per item that is about 10 hours of review daily, and worse, reviewers habituate: when most flags are noise, they start clearing without reading, and the 160 real violations get missed anyway."</em></p>
       <p><em>"So the fix is not more reviewers. Tighten the threshold to lift precision, accept the recall loss on borderline cases, and use a two-tier queue: high-confidence goes to enforcement, medium to review, low to sampled audit only."</em></p>`},

= 16 × 0.21 / 0.0009
= 3.36 / 0.0009 ≈ 3,733 per arm</div>
       <p>Then the practical extension: <em>"About 7,500 users total. At 2,000 daily eligible users and a 50/50 split, that is roughly four days of accrual — but I would still run two weeks, because novelty inflates week one on AI features and I would rather measure the steady state than the honeymoon."</em></p>
       <div class="tip"><b>Always convert n into days.</b> The interviewer is checking whether you can tell them when they will have an answer, not just how many samples you need.</div>`},
    {type:'mcq',
     q:'Your LLM-judge eval shows quality up 4% after a prompt change, but human spot-checks disagree. What is most likely?',
     options:[

     hints:['What do LLM judges systematically over-reward?'],
     sol:`<p><strong>B.</strong> Length and confidence bias is the best-documented failure of LLM-as-judge. A prompt change that produces longer, more assertive answers reliably scores higher without being more correct — and can be actively worse, since confident wrong answers are the most damaging kind.</p>
       <p>The right response: <em>"I would check mean output length across the two builds first — a 30-second query. If length moved materially, I would re-score with a length-controlled rubric or pairwise comparison, and I would treat the human spot-check as ground truth, not the judge. The judge exists to catch regressions cheaply; when it disagrees with humans, humans win and the judge needs recalibration."</em></p>
       <p>C and D are worth ruling out — provider-side model updates are a genuine source of silent drift — but B explains a disagreement in this specific direction.</p>`},
    {type:'open',
     q:'Design the eval suite for an AI feature that drafts customer emails.',
     hints:['Three layers, three cadences, and one thing you would never automate.'],
     sol:`<p><strong>Layer 1 — automatic checks, every build, seconds.</strong> Format validity, length bounds, forbidden-content matches, PII leakage, presence of required elements (greeting, ticket reference, next step), and refusal rate. Cheap, deterministic, blocking on failure.</p>
       <p><strong>Layer 2 — LLM-judge on a golden set, nightly.</strong> 400 stratified scenarios: refunds, complaints, technical questions, angry customers, ambiguous requests, non-English. Pairwise against the previous build rather than absolute scores, with a fixed rubric covering accuracy, tone, and completeness. Gate: no regression greater than 3% versus the shipped build.</p>
       <p><strong>Layer 3 — human review, weekly, sampled.</strong> 50 real drafts scored by two support leads, plus every draft that a user heavily edited. This is where you catch what the rubric does not encode — subtle tone failures, over-promising, or the model apologising for something the company did not do.</p>

     q:'Two arms: control converts 480/8,000, treatment converts 552/8,000. What is the relative lift?',

Treatment = 552 / 8,000 = 6.9%
Absolute lift = 0.9pp
Relative lift = 0.9 / 6.0 = 15%</div>
       <p>Then the significance sanity check, out loud: <em>"With ~500 conversions per arm the standard error on each rate is roughly 0.27pp, so a 0.9pp difference is about three standard errors — comfortably significant. But before I ship I want two things: the week-2 slice, because AI novelty inflates week one, and the guardrail metrics, because a 15% conversion lift alongside a rise in support contacts or refunds is not a win."</em></p>

  mcase:{
    title:'Sentry — tuning a content-moderation classifier',
    prompt:`<p><strong>Sentry</strong> moderates a marketplace: 2M listings/day, of which roughly 0.3% violate policy. The current classifier runs at 92% recall and 3% false-positive rate. The trust-and-safety team has 25 reviewers, each processing about 250 items per shift.</p>`,
    steps:[
      {kind:'Compute the queue',
       q:'How many items does the classifier send to review per day, and what is precision?',
       unit:'items per day', a:65832, tol:0.03, ph:'e.g. 60,000',
       sol:`<div class="f">True positives  = 2,000,000 × 0.3% × 92% = 5,520
False positives = 1,994,000 × 3%        = 59,820
Queue           = 65,340 … using 2M × 3% ≈ 60,000 → ~65,832
Precision       = 5,520 / 65,340 ≈ 8.4%</div>
         <p><em>"Around 65,000 items a day against a review capacity of 6,250 — the team can process under 10% of the queue. This is not a tuning problem, it is a system that cannot function as designed, and precision of 8.4% means eleven wrong flags for every real violation."</em></p>
         <div class="note"><b>Compute capacity before proposing anything.</b> The gap between queue size and reviewer throughput is the whole case, and it is invisible unless you multiply it out.</div>`},
      {kind:'Reframe',
       q:'The team asks for 20 more reviewers. What do you say?',
       widget:'evalTradeoff',
       sol:`<p><em>"Twenty more reviewers takes capacity from 6,250 to about 11,250 — still under a fifth of the queue, at maybe $1.5M a year. We would spend seven figures to remain overwhelmed."</em></p>
         <p><em>"The queue is 91% false positives, so the problem is threshold placement, not headcount. Raising the threshold to cut FPR from 3% to 0.3% takes the queue to roughly 11,500 — which two-thirds of the current team can absorb — at the cost of recall falling, say, from 92% to 80%."</em></p>
         <div class="f">Current:  recall 92%, FPR 3.0% → queue 65,000, precision 8%
Tuned:    recall 80%, FPR 0.3% → queue ~11,500, precision 42%
Missed violations rise from 480/day to 1,200/day</div>
         <p><em>"That trade is only acceptable if the misses are not the severe ones — which is why I would not use one threshold. Severity-tier it: fraud and safety keep high recall with a dedicated queue, while cosmetic policy violations get a high-precision threshold and sampled auditing. One global threshold on a mixed-severity problem is always wrong."</em></p>
         <div class="tip"><b>Drag prevalence in the panel above.</b> At 0.3%, precision is brutal at any reasonable FPR — which is the mathematical reason rare-event moderation always needs tiering rather than a better single number.</div>`},
      {kind:'Design the tiers',
       q:'Sketch the tiered system.',
       sol:`<div class="f">Tier 1 — SEVERE (fraud, safety, illegal)
  High recall (95%+), low threshold, dedicated reviewers
  Auto-hold listing pending review; appeal path within 4h

Tier 2 — MODERATE (misleading claims, category abuse)
  Balanced threshold, standard queue, 24h SLA
  Listing stays live unless confirmed

Tier 3 — MINOR (formatting, image quality, duplicates)
  High precision only; auto-action above 0.95 confidence
  Everything else → sampled audit, not full review

Sampled audit (all tiers): 500 random non-flagged items/day
  → measures true recall, which the queue alone cannot</div>
         <p>The audit line is the one candidates forget: <em>"Without sampling the items we did <strong>not</strong> flag, we have no way to measure recall in production — the queue only shows us what the model caught. That sample is the only honest estimate of what we are missing, and it is cheap: 500 items a day is two reviewers."</em></p>`},
      {kind:'Recommend',
       q:'Give your 60-second recommendation to the VP of Trust & Safety.',
       sol:`<p><strong>Answer first.</strong> <em>"Do not hire the 20 reviewers. Tier the thresholds by severity and add a sampled audit — that gets us inside current capacity and roughly quintuples precision, and it costs engineering weeks rather than $1.5M a year."</em></p>
         <p><strong>Support.</strong> <em>"Today the queue is 65,000 items against 6,250 of capacity, and 91% of it is noise. Tiering brings the review load to about 11,500 with severe cases still at 95% recall. Reviewer time moves from clearing noise to judging genuinely ambiguous cases, which is also the work that generates useful labels."</em></p>
         <p><strong>Risks.</strong> <em>"Two, and I would not soften them. Recall on minor violations falls, so some low-severity content stays up longer — I would accept that explicitly and publish the tier definitions internally so it is a decision rather than a surprise. And auto-action on tier 3 will occasionally hit a legitimate seller, so it needs a one-click appeal with a hard 24-hour SLA and a weekly false-action report."</em></p>
         <p><strong>Next steps.</strong> <em>"Three: replay 30 days of labelled data through the proposed thresholds this week to validate the queue estimates before anyone changes production; stand up the sampled audit immediately, because we currently cannot measure what we miss; and re-underwrite thresholds quarterly, since prevalence shifts with every marketplace policy change and a threshold set once is a threshold that silently rots."</em></p>
         <div class="note"><b>The pattern:</b> refuse the headcount ask with arithmetic, propose a design that respects the capacity constraint, state the recall cost plainly rather than hiding it, and add the measurement that makes the whole thing auditable.</div>`}
    ]
  }
});

   MODULE 6 — The LLM stack & build vs. buy
   ========================================================================= */
MODULES.push({
  id:'m06',tag:'Technical depth',
  title:'The LLM stack — prompt, RAG, fine-tune, agents',
