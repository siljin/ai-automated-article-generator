<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Product Management — Interview & Case Refresher</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --card:#161f2b; --card2:#1c2735;
  --line:#25303f;
  --tx:#e6edf3; --tx2:#9fb0c3; --tx3:#6b7d92;
  --acc:#4f9cf9; --acc2:#7c5cff;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc)}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{
  width:280px;flex:0 0 280px;background:var(--bg2);border-right:1px solid var(--line);
  padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-size:16px;margin:0 0 4px;letter-spacing:.2px}
.brand p{margin:0;font-size:12px;color:var(--tx3)}
.prog{display:flex;align-items:center;gap:12px;padding:12px 20px;margin-bottom:8px}
.ring{width:54px;height:54px;flex:0 0 54px}
.prog .meta{font-size:12px;color:var(--tx2);line-height:1.4}
.prog .meta b{display:block;font-size:18px;color:var(--tx);font-weight:600}
.navlist{list-style:none;margin:0;padding:0 10px}
.navlist li{margin:1px 0}
.navlist button{
  width:100%;text-align:left;background:none;border:0;color:var(--tx2);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;
  display:flex;gap:9px;align-items:flex-start;line-height:1.35;font-family:inherit;
}
.navlist button:hover{background:var(--card);color:var(--tx)}
.navlist button.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
.navlist .num{font:600 11px/1.5 var(--mono);color:var(--tx3);min-width:18px;padding-top:1px}
.navlist button.on .num{color:var(--acc)}
.navlist .tick{margin-left:auto;color:var(--ok);font-size:12px}
.side .foot{padding:14px 20px 0;margin-top:14px;border-top:1px solid var(--line)}
.side .foot button{
  background:none;border:1px solid var(--line);color:var(--tx3);font-size:12px;
  padding:6px 10px;border-radius:7px;cursor:pointer;font-family:inherit;width:100%
}
.side .foot button:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:34px 40px 90px;max-width:980px}
.mhead{margin-bottom:26px}
.kicker{font:600 11px/1 var(--mono);letter-spacing:1.4px;color:var(--acc);text-transform:uppercase}
.mhead h2{font-size:27px;margin:10px 0 6px;letter-spacing:-.3px}
.mhead .sub{color:var(--tx2);font-size:15px;margin:0}

.phase{margin:34px 0 16px;display:flex;align-items:center;gap:10px}
.phase .pill{
  font:600 10.5px/1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;
  padding:5px 9px;border-radius:5px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)
}
.phase .rule{flex:1;height:1px;background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:14px 0}
.card h4{margin:0 0 10px;font-size:15.5px}
.card p{margin:0 0 11px}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:0 0 11px;padding-left:20px}
.card li{margin:4px 0}
.card li:last-child{margin-bottom:0}
strong{color:#fff;font-weight:600}
em{color:var(--tx2)}
code{font:13px var(--mono);background:#0b1017;border:1px solid var(--line);padding:1.5px 5px;border-radius:4px;color:#a5d6ff}
.f{font:13.5px/1.7 var(--mono);background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--acc);
   padding:11px 14px;border-radius:6px;margin:11px 0;color:#cfe6ff;overflow-x:auto;white-space:pre-wrap}
.note{border-left:3px solid var(--warn);background:#1f1a0d80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#e8d9a8}
.note b{color:var(--warn)}
.tip{border-left:3px solid #2dd4bf;background:#0d1f1e80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#b6ece6}
.tip b{color:#2dd4bf}
.trap{border-left:3px solid var(--bad);background:#1f0f0f80;padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;color:#f5c2c0}
.trap b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

table.dt{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:7px 10px;text-align:right}
table.dt th{background:var(--card2);color:var(--tx2);font-weight:600;font-size:12.5px}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td.num{font-family:var(--mono)}
table.dt tr.tot td{background:#0b1017;font-weight:600;color:#fff}

/* ---------- exhibits ---------- */
.exhibit{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:14px 0}
.exhibit .xt{font:600 12px/1.3 var(--mono);letter-spacing:.6px;color:var(--tx2);text-transform:uppercase;margin-bottom:2px}
.exhibit .xs{font-size:13px;color:var(--tx3);margin-bottom:10px}
.exhibit .xn{font-size:12.5px;color:var(--tx3);margin-top:8px;font-style:italic}
.exhibit svg{display:block;width:100%;height:auto;overflow:visible}
.exhibit svg text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb0c3}
.exhibit svg text.lbl{font-size:11px;fill:#6b7d92}
.exhibit svg text.val{font:600 11px var(--mono);fill:#e6edf3}
.exhibit svg .gl{stroke:#25303f;stroke-width:1}
.exhibit svg .ax{stroke:#6b7d92;stroke-width:1}
.exhibit svg rect.b,.exhibit svg circle.pt{cursor:pointer;transition:opacity .12s}
.exhibit svg rect.b:hover,.exhibit svg circle.pt:hover{opacity:.72}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip-pop{
  position:fixed;z-index:99;background:#020508;border:1px solid var(--acc);border-radius:6px;
  padding:6px 10px;font:12px var(--mono);color:#fff;pointer-events:none;opacity:0;transition:opacity .1s;
  white-space:pre;box-shadow:0 6px 20px #000a
}
.ctrl{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:4px 0 12px;font-size:13px;color:var(--tx2)}
.ctrl label{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.ctrl .lr{display:flex;justify-content:space-between;font-size:12px}
.ctrl .lr b{font-family:var(--mono);color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.readout{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.readout div{font-size:12px;color:var(--tx3)}
.readout b{display:block;font:600 17px var(--mono);color:var(--tx);margin-top:2px}

/* ---------- drills ---------- */
.drill{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
.drill.correct{border-color:#3fb95055;background:#0f1b12}
.drill.wrong{border-color:#f8514955}
.dhead{display:flex;gap:10px;align-items:baseline;margin-bottom:9px}
.dhead .qn{font:600 11px var(--mono);color:var(--acc);letter-spacing:.8px;white-space:nowrap}
.dhead .qt{font-size:15px;font-weight:600;color:#fff}
.dbody{font-size:14.5px;color:var(--tx)}
.dbody p{margin:0 0 9px}
.dbody ul,.dbody ol{margin:0 0 9px;padding-left:20px}
.ansrow{display:flex;gap:9px;align-items:center;margin-top:13px;flex-wrap:wrap}
.ansrow input[type=text]{
  background:#0b1017;border:1px solid var(--line);border-radius:7px;color:var(--tx);
  padding:9px 12px;font:15px var(--mono);width:190px;outline:none
}
.ansrow input[type=text]:focus{border-color:var(--acc)}
.ansrow .unit{color:var(--tx3);font-size:13px}
.btn{
  background:var(--acc);color:#04121f;border:0;border-radius:7px;padding:9px 15px;
  font:600 13.5px inherit;cursor:pointer;font-family:inherit
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx2)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);filter:none}
.btn.sm{padding:6px 11px;font-size:12.5px}
.verdict{font-size:13.5px;font-weight:600;margin-left:2px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;background:#0b1017;border:1px solid var(--line);
  border-radius:8px;padding:10px 13px;cursor:pointer;font-size:14px;transition:border-color .12s
}
.opt:hover{border-color:var(--acc)}
.opt .k{font:600 12px var(--mono);color:var(--tx3);padding-top:1px}
.opt.ok{border-color:var(--ok);background:#0f1b12}
.opt.no{border-color:var(--bad);background:#1b0f0f}
.opt.dead{cursor:default}
.hints{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.hint{background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:10px 13px;font-size:13.5px;color:#e8d9a8}
.hint .hk{font:600 10.5px var(--mono);letter-spacing:1px;color:var(--warn);display:block;margin-bottom:3px}
.sol{margin-top:12px;background:#0b1017;border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:13px 15px;font-size:14px}
.sol .sk{font:600 10.5px var(--mono);letter-spacing:1px;color:var(--ok);display:block;margin-bottom:6px}
.sol p{margin:0 0 8px}.sol p:last-child{margin-bottom:0}
.sol ul,.sol ol{margin:0 0 8px;padding-left:19px}
.sol .f{margin:8px 0}

/* ---------- sprint ---------- */
.sprint{background:linear-gradient(180deg,#161f2b,#12212b);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0}
.sprint .sq{font:600 30px var(--mono);color:#fff;letter-spacing:1px;margin:14px 0}
.sprint .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.sprint .bar i{display:block;height:100%;background:var(--acc);transition:width .12s linear}
.sprint .stat{display:flex;gap:24px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.sprint .stat b{color:#fff;font-family:var(--mono)}

/* ---------- mini case ---------- */
.mcase{background:var(--card);border:1px solid #7c5cff55;border-radius:var(--radius);overflow:hidden;margin:16px 0}
.mcase .ch{background:#1a1630;border-bottom:1px solid var(--line);padding:16px 22px}
.mcase .ch .tag{font:600 10.5px var(--mono);letter-spacing:1.3px;color:var(--acc2);text-transform:uppercase}
.mcase .ch h4{margin:6px 0 0;font-size:17px;color:#fff}
.mcase .cb{padding:18px 22px}
.prompt{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;margin-bottom:14px}
.prompt .who{font:600 10.5px var(--mono);letter-spacing:1.2px;color:var(--acc2);display:block;margin-bottom:5px}
.prompt p{margin:0 0 9px}.prompt p:last-child{margin-bottom:0}
.prompt ul{margin:0 0 9px;padding-left:20px}
.step{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.step.locked{opacity:.3;pointer-events:none;filter:blur(1.4px)}
.step .sn{font:600 11px var(--mono);color:var(--acc2);letter-spacing:.8px}
.selfmark{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.done-badge{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:13px;font-weight:600}

.modnav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.hidden{display:none!important}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:24px 18px 70px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>AI PM Interview Prep</h1>
      <p>Product sense · AI technical depth · metrics · execution</p>
    </div>
    <div class="prog">
      <svg class="ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#25303f" stroke-width="3.4"/>
        <circle id="ringfg" cx="18" cy="18" r="15.5" fill="none" stroke="#4f9cf9" stroke-width="3.4"
                stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"
                transform="rotate(-90 18 18)"/>
      </svg>
      <div class="meta"><b id="progpct">0%</b><span id="progtxt">0 of 0 exercises</span></div>
    </div>
    <ul class="navlist" id="nav"></ul>
    <div class="foot"><button id="resetbtn">Reset all progress</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tip-pop" id="pop"></div>

<script>
/* =========================================================================
   STATE — persisted to localStorage
   ========================================================================= */
const KEY='aipm-prep-v1';
let ST=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function mark(id,val){if(ST[id]==='ok'&&val!=='ok')return;ST[id]=val;save();paintProgress();paintNav()}
function got(id){return ST[id]}

/* =========================================================================
   HELPERS
   ========================================================================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n,d){
  if(n==null||isNaN(n))return '—';
  d=(d==null)?(Math.abs(n)>=100?0:(Math.abs(n)>=10?1:2)):d;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
/* Parses 1,200 · $1.2m · 12% · 3.5bn · 1.2k */
function parseNum(s){
  if(s==null)return NaN;
  let t=String(s).trim().toLowerCase().replace(/[$,\s]/g,'').replace(/[€£]/g,'');
  if(t.endsWith('%'))t=t.slice(0,-1);
  let mult=1;
  const suf=[['trillion',1e12],['billion',1e9],['million',1e6],['thousand',1e3],
             ['tn',1e12],['bn',1e9],['mm',1e6],['mn',1e6],['k',1e3],['t',1e12],['b',1e9],['m',1e6]];
  for(const p of suf){if(t.endsWith(p[0])){mult=p[1];t=t.slice(0,-p[0].length);break}}
  const v=parseFloat(t);
  return isNaN(v)?NaN:v*mult;
}
function within(g,want,tol){
  if(isNaN(g))return false;
  tol=(tol==null)?0.03:tol;
  if(want===0)return Math.abs(g)<=(tol||0.01);
  return Math.abs(g-want)/Math.abs(want)<=tol;
}

/* =========================================================================
   TOOLTIP
   ========================================================================= */
const POP=$('#pop');
function popShow(e,txt){POP.textContent=txt;POP.style.opacity='1';popMove(e)}
function popMove(e){POP.style.left=(e.clientX+14)+'px';POP.style.top=(e.clientY-10)+'px'}
function popHide(){POP.style.opacity='0'}
function hoverable(node,txt){
  node.addEventListener('mouseenter',e=>popShow(e,txt));
  node.addEventListener('mousemove',popMove);
  node.addEventListener('mouseleave',popHide);
}

/* =========================================================================
   CHART LIBRARY — inline SVG, zero dependencies
   ========================================================================= */
const PAL=['#4f9cf9','#7c5cff','#3fb950','#d29922','#f85149','#2dd4bf','#f472b6'];
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(t,a){const e=document.createElementNS(SVGNS,t);for(const k in (a||{}))e.setAttribute(k,a[k]);return e}
function niceMax(v){
  if(v<=0)return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));const r=v/p;
  const s=r<=1?1:r<=1.2?1.2:r<=1.5?1.5:r<=2?2:r<=2.5?2.5:r<=3?3:r<=4?4:r<=5?5:r<=6?6:r<=8?8:10;
  return s*p;
}
function axisTicks(max,n){const out=[];for(let i=0;i<=n;i++)out.push(max*i/n);return out}
function vtxt(spec,v,d){
  const sign=v<0?'-':'';
  return sign+(spec.pre||'')+fmt(Math.abs(v),d==null?spec.dec:d)+(spec.suf||'');
}

function chart(spec){
  const box=el('div','exhibit');
  if(spec.title)box.appendChild(el('div','xt',spec.title));
  if(spec.sub)box.appendChild(el('div','xs',spec.sub));
  let body;
  switch(spec.type){
    case 'bar':      body=cBar(spec);break;
    case 'stacked':  body=cStacked(spec);break;
    case 'line':     body=cLine(spec);break;
    case 'scatter':  body=cScatter(spec);break;
    case 'waterfall':body=cWaterfall(spec);break;
    case 'table':    body=cTable(spec);break;
    default:         body=el('div','','unknown chart type');
  }
  box.appendChild(body);
  let leg=spec.legend;
  if(!leg&&spec.type==='stacked')leg=spec.series.map((s,i)=>({label:s,color:PAL[i%PAL.length]}));
  if(leg)box.appendChild(legendEl(leg));
  if(spec.note)box.appendChild(el('div','xn',spec.note));
  return box;
}
function legendEl(items){
  const l=el('div','legend');
  items.forEach((it,i)=>{
    const s=el('span');const ic=el('i');ic.style.background=it.color||PAL[i%PAL.length];
    s.appendChild(ic);s.appendChild(document.createTextNode(it.label));l.appendChild(s);
  });
  return l;
}

function cBar(s){
  const W=720,H=s.h||300,P={t:24,r:16,b:s.data.some(d=>d.sub)?64:52,l:66};
  const data=s.data,n=data.length;
  const max=s.max!=null?s.max:niceMax(Math.max(...data.map(d=>d.value)));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  axisTicks(max,s.ticks||4).forEach(t=>{
    const y=P.t+ih-(t/max)*ih;
    svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);
    svg.appendChild(tx);
  });
  const gap=iw/n,bw=gap*0.62;
  data.forEach((d,i)=>{
    const h=Math.max(1,(d.value/max)*ih),x=P.l+gap*i+(gap-bw)/2,y=P.t+ih-h;
    const r=svgEl('rect',{x:x,y:y,width:bw,height:h,rx:3,fill:d.color||s.color||PAL[0],class:'b'});
    hoverable(r,d.label+'\n'+vtxt(s,d.value));svg.appendChild(r);
    if(s.showVals!==false){
      const v=svgEl('text',{x:x+bw/2,y:y-6,'text-anchor':'middle',class:'val'});v.textContent=vtxt(s,d.value);svg.appendChild(v);
    }
    const lb=svgEl('text',{x:x+bw/2,y:P.t+ih+18,'text-anchor':'middle',class:'lbl'});lb.textContent=d.label;svg.appendChild(lb);
    if(d.sub){const s2=svgEl('text',{x:x+bw/2,y:P.t+ih+32,'text-anchor':'middle',class:'lbl'});s2.textContent=d.sub;svg.appendChild(s2)}
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

function cStacked(s){
  const W=720,H=s.h||330,P={t:24,r:16,b:52,l:68};
  const tot=s.data.map(d=>d.values.reduce((a,b)=>a+b,0));
  const max=s.max!=null?s.max:niceMax(Math.max(...tot));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  axisTicks(max,4).forEach(t=>{
    const y=P.t+ih-(t/max)*ih;
    svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);svg.appendChild(tx);
  });
  const gap=iw/s.data.length,bw=gap*0.6;
  s.data.forEach((d,i)=>{
    let acc=0;
    d.values.forEach((v,j)=>{
      const h=(v/max)*ih,x=P.l+gap*i+(gap-bw)/2,y=P.t+ih-(acc/max)*ih-h;
      const r=svgEl('rect',{x:x,y:y,width:bw,height:Math.max(0,h),fill:PAL[j%PAL.length],class:'b'});
      hoverable(r,d.label+' — '+s.series[j]+'\n'+vtxt(s,v)+'  ('+fmt(v/tot[i]*100,0)+'% of bar)');svg.appendChild(r);
      if(h>17){
        const t2=svgEl('text',{x:x+bw/2,y:y+h/2+4,'text-anchor':'middle',class:'val',fill:'#08111c'});
        t2.textContent=fmt(v,s.dec);svg.appendChild(t2);
      }
      acc+=v;
    });
    const tt=svgEl('text',{x:P.l+gap*i+gap/2,y:P.t+ih-(acc/max)*ih-7,'text-anchor':'middle',class:'val'});
    tt.textContent=vtxt(s,acc);svg.appendChild(tt);
    const lb=svgEl('text',{x:P.l+gap*i+gap/2,y:P.t+ih+18,'text-anchor':'middle',class:'lbl'});lb.textContent=d.label;svg.appendChild(lb);
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

function cLine(s){

function cWaterfall(s){
  const W=720,H=s.h||330,P={t:28,r:16,b:62,l:72};
  let run=0;const bars=[];
  s.data.forEach(d=>{
    if(d.type==='start'||d.type==='end'){bars.push(Object.assign({},d,{from:0,to:d.value}));run=d.value}
    else{bars.push(Object.assign({},d,{from:run,to:run+d.value}));run+=d.value}
  });
  const max=s.max!=null?s.max:niceMax(Math.max(...bars.map(b=>Math.max(b.from,b.to))));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const iw=W-P.l-P.r,ih=H-P.t-P.b;
  const Y=v=>P.t+ih-(v/max)*ih;
  axisTicks(max,4).forEach(t=>{
    const y=Y(t);svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,class:'gl'}));
    const tx=svgEl('text',{x:P.l-8,y:y+4,'text-anchor':'end',class:'lbl'});tx.textContent=vtxt(s,t,s.tdec);svg.appendChild(tx);
  });
  const gap=iw/bars.length,bw=gap*0.58;
  bars.forEach((b,i)=>{
    const x=P.l+gap*i+(gap-bw)/2;
    const yTop=Y(Math.max(b.from,b.to)),h=Math.max(1.5,Math.abs(Y(b.from)-Y(b.to)));
    const anchor=(b.type==='start'||b.type==='end');
    const col=anchor?'#4f9cf9':(b.value>=0?'#3fb950':'#f85149');
    const r=svgEl('rect',{x:x,y:yTop,width:bw,height:h,rx:2,fill:col,class:'b'});
    hoverable(r,b.label+'\n'+(anchor?vtxt(s,b.value):(b.value>=0?'+':'')+vtxt(s,b.value)+'\nruns to '+vtxt(s,b.to)));
    svg.appendChild(r);
    const t=svgEl('text',{x:x+bw/2,y:yTop-6,'text-anchor':'middle',class:'val'});
    t.textContent=anchor?vtxt(s,b.value):((b.value>=0?'+':'')+vtxt(s,b.value));
    if(!anchor)t.setAttribute('fill',b.value>=0?'#3fb950':'#f85149');
    svg.appendChild(t);
    if(i<bars.length-1){
      const y2=Y(b.to);
      svg.appendChild(svgEl('line',{x1:x+bw,x2:P.l+gap*(i+1)+(gap-bw)/2,y1:y2,y2:y2,
        stroke:'#6b7d92','stroke-width':1,'stroke-dasharray':'3 3'}));
    }
    const words=String(b.label).split(' ');const lines=[];let cur='';
    words.forEach(w=>{if((cur+' '+w).trim().length>12){lines.push(cur.trim());cur=w}else cur+=' '+w});
    if(cur.trim())lines.push(cur.trim());
    lines.slice(0,3).forEach((ln,k)=>{
      const lt=svgEl('text',{x:x+bw/2,y:P.t+ih+17+k*12,'text-anchor':'middle',class:'lbl'});lt.textContent=ln;svg.appendChild(lt);
    });
  });
  svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,class:'ax'}));
  return svg;
}

/* =========================================================================
   SPRINT — timed mental math
   ========================================================================= */
const GENS={};
const RND=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PICK=a=>a[Math.floor(Math.random()*a.length)];

function renderSprint(cfg,mid,idx){
  const id=mid+'-s'+idx;
  const box=el('div','sprint');
  box.appendChild(el('div','dhead','<span class="qn">SPRINT</span><span class="qt">'+cfg.title+'</span>'));
  box.appendChild(el('div','','<div style="font-size:14px;color:#9fb0c3">'+cfg.desc+'</div>'));
  const qEl=el('div','sq','—');
  const bar=el('div','bar','<i style="width:100%"></i>');
  const stat=el('div','stat');
  const row=el('div','ansrow');
  const inp=el('input');inp.type='text';inp.placeholder='type + Enter';inp.disabled=true;
  const start=el('button','btn','Start '+(cfg.seconds||60)+'s drill');
  const vd=el('span','verdict');
  row.appendChild(inp);row.appendChild(start);row.appendChild(vd);
  box.appendChild(qEl);box.appendChild(bar);box.appendChild(stat);box.appendChild(row);

  let running=false,cur=null,right=0,wrong=0,t0=0,timer=null;
  const gen=GENS[cfg.gen];
  const target=cfg.target||8;
  const paint=()=>{stat.innerHTML='<span>Correct <b>'+right+'</b></span><span>Missed <b>'+wrong+
    '</b></span><span>Best <b>'+(ST[id+'-best']||0)+'</b></span><span>Target <b>'+target+'</b></span>'};
  const next=()=>{cur=gen();qEl.textContent=cur.q;inp.value='';inp.focus()};
  const stop=()=>{
    running=false;clearInterval(timer);inp.disabled=true;start.classList.remove('hidden');
    start.textContent='Run again';qEl.textContent='Time!';
    if(right>(ST[id+'-best']||0))ST[id+'-best']=right;
    if(right>=target)mark(id,'ok');else if(!ST[id])ST[id]='seen';
    save();paintProgress();paintNav();
    vd.className='verdict '+(right>=target?'ok':'no');
    vd.textContent=right>=target?('✓ '+right+' correct — target met'):(right+' correct — target is '+target);
    paint();
  };
  start.onclick=()=>{
    running=true;right=0;wrong=0;vd.textContent='';inp.disabled=false;start.classList.add('hidden');
    t0=Date.now();next();paint();
    timer=setInterval(()=>{
      const left=(cfg.seconds||60)*1000-(Date.now()-t0);
      $('i',bar).style.width=Math.max(0,left/((cfg.seconds||60)*10))+'%';
      if(left<=0)stop();
    },100);
  };
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||!running)return;
    const v=parseNum(inp.value);
    if(within(v,cur.a,cur.tol==null?0.02:cur.tol)){right++;vd.className='verdict ok';vd.textContent='✓'}
    else{wrong++;vd.className='verdict no';vd.textContent='✗ '+fmt(cur.a,cur.dec)}
    paint();next();
  });
  paint();
  return box;
}

function renderBlocks(blocks,host){
  (blocks||[]).forEach(b=>{
    if(typeof b==='string'){host.appendChild(el('div','card',b));return}
    if(b.chart){host.appendChild(chart(b.chart));return}

    if(b.raw){const d=el('div');d.innerHTML=b.raw;host.appendChild(d);return}
    if(b.card!=null){host.appendChild(el('div','card',(b.title?'<h4>'+b.title+'</h4>':'')+b.card));return}
  });

function renderDrill(d,idx,mid){
  const id=mid+'-d'+idx;
  const box=el('div','drill');
  if(got(id)==='ok')box.classList.add('correct');
  const head=el('div','dhead');
  head.appendChild(el('span','qn','Q'+(idx+1)));
  head.appendChild(el('span','qt',d.q));
  box.appendChild(head);
  if(d.body)box.appendChild(el('div','dbody',d.body));
  if(d.chart)box.appendChild(chart(d.chart));
  if(d.widget)box.appendChild(WIDGETS[d.widget](d.opts||{}));

  const ctrlHost=el('div');box.appendChild(ctrlHost);
  const hintWrap=el('div','hints');box.appendChild(hintWrap);
  const solWrap=el('div');box.appendChild(solWrap);
  let hintsShown=0;
  const showSol=()=>{
    if($('.sol',solWrap))return;
    solWrap.appendChild(el('div','sol','<span class="sk">Worked solution</span>'+d.sol));
  };
  const nextHint=()=>{
    const hs=d.hints||[];
    if(hintsShown>=hs.length){showSol();return}
    hintWrap.appendChild(el('div','hint','<span class="hk">Hint '+(hintsShown+1)+'</span>'+hs[hintsShown]));
    hintsShown++;
  };

  if(d.type==='mcq'){
    const opts=el('div','opts');
    d.options.forEach((o,i)=>{
      const oe=el('div','opt','<span class="k">'+'ABCDEFG'[i]+'</span><span>'+o+'</span>');
      oe.onclick=()=>{
        if(oe.classList.contains('dead'))return;
        $$('.opt',opts).forEach(x=>x.classList.add('dead'));
        if(i===d.correct){oe.classList.add('ok');box.classList.add('correct');mark(id,'ok')}
        else{oe.classList.add('no');box.classList.add('wrong');$$('.opt',opts)[d.correct].classList.add('ok');mark(id,'seen')}
        showSol();
      };
      opts.appendChild(oe);
    });
    ctrlHost.appendChild(opts);
    if((d.hints||[]).length){
      const row=el('div','ansrow');
      const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb);
      ctrlHost.appendChild(row);
    }
  }
  else if(d.type==='open'){
    const row=el('div','ansrow');
    const rb=el('button','btn','Show model answer');
    const mk=el('div','selfmark hidden');
    mk.innerHTML='<span style="font-size:13px;color:#9fb0c3">How did you do?</span>';
    const g=el('button','btn sm','I had this');
    const n=el('button','btn ghost sm','Needs work');
    g.onclick=()=>{mark(id,'ok');box.classList.add('correct');mk.innerHTML='<span class="done-badge">✓ Logged</span>'};
    n.onclick=()=>{mark(id,'seen');mk.innerHTML='<span style="font-size:13px;color:#d29922">Flagged — revisit</span>'};
    mk.appendChild(g);mk.appendChild(n);
    if((d.hints||[]).length){const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb)}
    rb.onclick=()=>{showSol();rb.classList.add('hidden');mk.classList.remove('hidden')};
    row.appendChild(rb);
    ctrlHost.appendChild(row);ctrlHost.appendChild(mk);
  }
  else {
    const row=el('div','ansrow');
    const inp=el('input');inp.type='text';inp.placeholder=d.ph||'your answer';
    const chk=el('button','btn','Check');
    const vd=el('span','verdict');
    const doCheck=()=>{
      const v=parseNum(inp.value);
      if(isNaN(v)){vd.className='verdict no';vd.textContent='enter a number';return}
      if(within(v,d.a,d.tol)){
        vd.className='verdict ok';vd.textContent='✓ Correct — '+(d.aTxt||fmt(d.a,d.dec));
        box.classList.remove('wrong');box.classList.add('correct');mark(id,'ok');showSol();
      }else{
        vd.className='verdict no';vd.textContent='✗ not yet';box.classList.add('wrong');
        nextHint();mark(id,'seen');
      }
    };
    chk.onclick=doCheck;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck()});
    row.appendChild(inp);
    if(d.unit)row.appendChild(el('span','unit',d.unit));
    row.appendChild(chk);
    if((d.hints||[]).length){const hb=el('button','btn ghost sm','Hint');hb.onclick=nextHint;row.appendChild(hb)}
    const sb=el('button','btn ghost sm','Solution');
    sb.onclick=()=>{showSol();if(got(id)!=='ok')mark(id,'seen')};
    row.appendChild(sb);row.appendChild(vd);
    ctrlHost.appendChild(row);
  }
  return box;
}

function renderCase(c,mid){

  const b=el('div','cb');

    const st=el('div','step');
    st.appendChild(el('div','sn','STEP '+(i+1)+(s.kind?' · '+s.kind:'')));
    st.appendChild(el('div','prompt','<span class="who">Interviewer</span>'+s.q));
    if(s.chart)st.appendChild(chart(s.chart));
    if(s.widget)st.appendChild(WIDGETS[s.widget](s.opts||{}));
    const id=mid+'-c'+i;
    const solWrap=el('div');
    const reveal=()=>{
      if($('.sol',solWrap))return;

      if(stepEls[i+1])stepEls[i+1].classList.remove('locked');
    };
    if(s.a!=null){
      const row=el('div','ansrow');

        const v=parseNum(inp.value);

        if(within(v,s.a,s.tol)){vd.className='verdict ok';vd.textContent='✓ '+(s.aTxt||fmt(s.a,s.dec));mark(id,'ok')}
        else{vd.className='verdict no';vd.textContent='✗ off — see answer';mark(id,'seen')}
        reveal();
      };
      chk.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
      sk.onclick=()=>{reveal();if(got(id)!=='ok')mark(id,'seen')};
      row.appendChild(inp);
      if(s.unit)row.appendChild(el('span','unit',s.unit));
      row.appendChild(chk);row.appendChild(sk);row.appendChild(vd);
      st.appendChild(row);
    }else{
      const row=el('div','ansrow');
      const rb=el('button','btn','Show strong answer');
      const mk=el('div','selfmark hidden');
      mk.innerHTML='<span style="font-size:13px;color:#9fb0c3">Did you cover it?</span>';
      const g=el('button','btn sm','Yes');const n=el('button','btn ghost sm','Partly');
      g.onclick=()=>{mark(id,'ok');mk.innerHTML='<span class="done-badge">✓ Logged</span>'};
      n.onclick=()=>{mark(id,'seen');mk.innerHTML='<span style="font-size:13px;color:#d29922">Flagged — revisit</span>'};
      mk.appendChild(g);mk.appendChild(n);
      rb.onclick=()=>{reveal();rb.classList.add('hidden');mk.classList.remove('hidden')};
      row.appendChild(rb);st.appendChild(row);st.appendChild(mk);
    }
    st.appendChild(solWrap);
    if(i>0)st.classList.add('locked');
    stepEls.push(st);
    b.appendChild(st);
  });
  box.appendChild(b);
  return box;
}

const MODULES=[];
function ids(m){
  const out=[];
  (m.sprints||[]).forEach((s,i)=>out.push(m.id+'-s'+i));
  (m.drills||[]).forEach((d,i)=>out.push(m.id+'-d'+i));
  if(m.mcase)m.mcase.steps.forEach((s,i)=>out.push(m.id+'-c'+i));
  return out;
}
function countable(m){return ids(m).length}
function doneCount(m){return ids(m).filter(i=>got(i)==='ok').length}

let CURRENT=0;
function phase(n,label){
  const p=el('div','phase');
  p.appendChild(el('span','pill',n+' · '+label));
  p.appendChild(el('div','rule'));
  return p;
}
function renderModule(i){
  CURRENT=i;
  const m=MODULES[i];
  const main=$('#main');main.innerHTML='';window.scrollTo(0,0);
  const h=el('div','mhead');
  h.appendChild(el('div','kicker','Module '+(i+1)+' of '+MODULES.length+' · '+m.tag));
  h.appendChild(el('h2','',m.title));
  h.appendChild(el('p','sub',m.sub));
  main.appendChild(h);

  main.appendChild(phase('01','Concept'));
  renderBlocks(m.concept,main);

  if((m.drills||[]).length||(m.sprints||[]).length){
    main.appendChild(phase('02','Practice'));
    (m.sprints||[]).forEach((s,k)=>main.appendChild(renderSprint(s,m.id,k)));
    (m.drills||[]).forEach((d,k)=>main.appendChild(renderDrill(d,k,m.id)));
  }
  if(m.mcase){
    main.appendChild(phase('03','Mini case'));
    main.appendChild(renderCase(m.mcase,m.id));
  }
  const nav=el('div','modnav');
  const prev=el('button','btn ghost','←  '+(i>0?MODULES[i-1].title:''));
  const next=el('button','btn',(i<MODULES.length-1?MODULES[i+1].title:'')+'  →');
  if(i===0)prev.style.visibility='hidden';
  if(i===MODULES.length-1)next.style.visibility='hidden';
  prev.onclick=()=>renderModule(i-1);
  next.onclick=()=>renderModule(i+1);
  nav.appendChild(prev);nav.appendChild(next);
  main.appendChild(nav);
  paintNav();
}
function paintNav(){
  const nav=$('#nav');nav.innerHTML='';
  MODULES.forEach((m,i)=>{
    const li=el('li');
    const b=el('button',i===CURRENT?'on':'');
    const d=doneCount(m),t=countable(m);
    b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+m.title+'</span>'+
      (t&&d>=t?'<span class="tick">✓</span>':
       (d?'<span class="tick" style="color:#6b7d92;font:600 10px var(--mono)">'+d+'/'+t+'</span>':''));
    b.onclick=()=>renderModule(i);
    li.appendChild(b);nav.appendChild(li);
  });
}
function paintProgress(){
  let done=0,tot=0;
  MODULES.forEach(m=>{done+=doneCount(m);tot+=countable(m)});
  const pct=tot?Math.round(done/tot*100):0;
  $('#progpct').textContent=pct+'%';
  $('#progtxt').textContent=done+' of '+tot+' exercises';
  const C=2*Math.PI*15.5;
  $('#ringfg').setAttribute('stroke-dasharray',C);
  $('#ringfg').setAttribute('stroke-dashoffset',C*(1-pct/100));
}
$('#resetbtn').onclick=()=>{
  if(!confirm('Erase all saved progress and scores?'))return;
  ST={};save();paintProgress();renderModule(CURRENT);
};
function boot(){paintNav();paintProgress();renderModule(0)}

GENS.tokencost=()=>{
  const tok=PICK([200,400,600,800,1200,1500,2000,3000,4000,6000]);
  const price=PICK([0.25,0.5,0.8,1,1.25,2,2.5,3,5,10,15]);
  return {q:'Cost of '+fmt(tok,0)+' tokens at $'+fmt(price,2)+' per 1M tokens? (in cents)',
          a:tok/1e6*price*100,dec:3,tol:0.04};
};
GENS.costper=()=>{
  const c=PICK([0.2,0.4,0.5,0.8,1.2,1.5,2,2.5,4,6]);
  const r=PICK([20,30,40,50,60,80,100,150,200]);
  return {q:'$'+fmt(c,2)+' per request × '+fmt(r,0)+'k requests/day → daily cost?',
          a:c*r*1000,dec:0,tol:0.02};
};
GENS.aimargin=()=>{
  const rev=PICK([10,12,15,20,25,30,40,50,60]);
  const cogs=PICK([2,3,4,5,6,8,9,12,15,18]);
  const c=Math.min(cogs,rev-1);
  return {q:'$'+fmt(rev,0)+'/user/mo revenue, $'+fmt(c,0)+' inference cost → gross margin %?',
          a:(rev-c)/rev*100,dec:1,tol:0.02};
};
GENS.precision=()=>{
  const tp=PICK([30,40,60,80,120,150,200,240,300]);
  const fp=PICK([10,20,30,40,60,80,100,150,200]);
  return {q:'Model flags '+fmt(tp+fp,0)+' items, '+fmt(tp,0)+' are true positives → precision %?',
          a:tp/(tp+fp)*100,dec:1,tol:0.02};
};
GENS.f1=()=>{
  const p=PICK([40,50,55,60,66,70,75,80,85,90]);
  const r=PICK([30,40,50,60,70,75,80,90,95]);
  return {q:'Precision '+p+'%, recall '+r+'% → F1 %?',
          a:2*p*r/(p+r),dec:1,tol:0.03};
};
GENS.throughput=()=>{
  const tps=PICK([40,50,60,80,100,120,150,200,250]);
  const out=PICK([100,150,200,250,300,400,500,600]);
  return {q:tps+' tokens/sec per stream, '+out+'-token answer → seconds to finish?',
          a:out/tps,dec:2,tol:0.03};
};
GENS.lift=()=>{
  const base=PICK([2,4,5,8,10,12,15,20,25,30,40]);
  const rel=PICK([-20,-10,5,8,12,15,20,25,35,50]);
  const after=base*(1+rel/100);
  return {q:'Acceptance rate went '+fmt(base,0)+'% → '+fmt(after,1)+'%. Relative lift %?',
          a:rel,dec:1,tol:0.05};
};
GENS.cachesave=()=>{
  const spend=PICK([20,40,60,80,120,150,200,300])*1000;
  const hit=PICK([15,20,25,30,40,50,60,70]);
  const disc=PICK([0.9,0.75,0.5]);
  return {q:'$'+fmt(spend,0)+'/mo inference. '+hit+'% of tokens become cache hits priced '+Math.round(disc*100)+'% cheaper → new monthly spend?',
          a:spend*(1-hit/100*disc),dec:0,tol:0.03};
};
GENS.samplesize=()=>{
  const p=PICK([5,10,15,20,25,30,40,50]);
  const d=PICK([1,2,3,5]);
  return {q:'Baseline '+p+'%, detect +'+d+'pp (80% power, 95% conf). n per arm ≈ 16·p(1−p)/Δ²?',
          a:16*(p/100)*(1-p/100)/Math.pow(d/100,2),dec:0,tol:0.05};
};
GENS.gpuhours=()=>{
  const g=PICK([2,4,8,16,32,64]);
  const h=PICK([6,8,12,18,24,36,48,72]);
  const r=PICK([2,2.5,3,4,5,8,12]);
  return {q:g+' GPUs × '+h+'h at $'+fmt(r,2)+'/GPU-hr → run cost?',
          a:g*h*r,dec:0,tol:0.02};
};

WIDGETS.tokenEcon=()=>sliderPanel({
  title:'LLM unit-economics lab',
  sub:'A $20/month AI subscription. Drag usage and token prices to find where gross margin breaks.',
  inputs:[
    {k:'req',label:'Requests per user per month',min:5,max:600,step:5,val:120,fmt:v=>fmt(v,0)},
    {k:'tin',label:'Input tokens per request',min:200,max:20000,step:200,val:3000,fmt:v=>fmt(v,0)},
    {k:'tout',label:'Output tokens per request',min:50,max:4000,step:50,val:600,fmt:v=>fmt(v,0)},
    {k:'pin',label:'Input price ($/1M tokens)',min:.1,max:15,step:.1,val:3,fmt:v=>'$'+fmt(v,2)},
    {k:'pout',label:'Output price ($/1M tokens)',min:.5,max:75,step:.5,val:15,fmt:v=>'$'+fmt(v,2)}
  ],
  compute:v=>{
    const price=20;
    const cin=v.req*v.tin/1e6*v.pin, cout=v.req*v.tout/1e6*v.pout;
    const cogs=cin+cout, gm=(price-cogs)/price*100;
    const breakevenReq=cogs>0?price/(cogs/v.req):0;
    return {
      chart:{type:'waterfall',pre:'$',dec:2,h:270,max:Math.max(20,niceMax(price)),
        data:[{label:'Subscription revenue',value:price,type:'start'},
              {label:'Input tokens',value:-cin},
              {label:'Output tokens',value:-cout},
              {label:'Gross profit',value:price-cogs,type:'end'}]},
      readouts:[
        {label:'Cost per request',val:'$'+fmt(cogs/v.req,4)},
        {label:'Inference COGS / user / mo',val:'$'+fmt(cogs,2),color:cogs<price?'#3fb950':'#f85149'},
        {label:'Gross margin',val:fmt(gm,1)+'%',color:gm>=70?'#3fb950':(gm>=40?'#d29922':'#f85149')},
        {label:'Requests until margin = 0',val:fmt(breakevenReq,0)}
      ]
    };
  },
  note:'Output tokens usually dominate: they are priced 3–5× input and are generated one at a time. Two of the highest-leverage AI PM decisions — response-length caps and model routing — live entirely inside this chart.'
});

WIDGETS.evalTradeoff=()=>sliderPanel({
  title:'Precision / recall / prevalence lab',
  sub:'10,000 items scored by a classifier. Change how rare the positive class is and watch precision collapse.',
  inputs:[
    {k:'prev',label:'Prevalence (% of items truly positive)',min:.5,max:50,step:.5,val:5,fmt:v=>fmt(v,1)+'%'},
    {k:'tpr',label:'Recall / true-positive rate',min:10,max:99,step:1,val:85,fmt:v=>v+'%'},
    {k:'fpr',label:'False-positive rate',min:.5,max:30,step:.5,val:5,fmt:v=>fmt(v,1)+'%'}
  ],
  compute:v=>{
    const N=10000, pos=N*v.prev/100, neg=N-pos;
    const tp=pos*v.tpr/100, fn=pos-tp, fp=neg*v.fpr/100, tn=neg-fp;
    const prec=tp+fp>0?tp/(tp+fp)*100:0;
    const f1=(prec+v.tpr)>0?2*prec*v.tpr/(prec+v.tpr):0;
    const acc=(tp+tn)/N*100;
    return {
      chart:{type:'bar',suf:'%',dec:1,h:250,max:100,
        data:[{label:'Precision',value:prec,color:prec>=70?'#3fb950':'#f85149'},
              {label:'Recall',value:v.tpr,color:'#4f9cf9'},
              {label:'F1',value:f1,color:'#7c5cff'},
              {label:'Accuracy',value:acc,color:'#6b7d92'}]},
      readouts:[
        {label:'True positives',val:fmt(tp,0)},
        {label:'False positives',val:fmt(fp,0),color:'#f85149'},
        {label:'Missed positives',val:fmt(fn,0),color:'#d29922'},
        {label:'Human review queue',val:fmt(tp+fp,0)+' items'}
      ]
    };
  },
  note:'Set prevalence to 1% and change nothing else. Accuracy still reads ~95% while precision falls under 20% — the accuracy paradox, and the most common trap in an AI metrics interview.'
});

WIDGETS.ragLatency=()=>sliderPanel({
  title:'Latency budget lab',
  sub:'A RAG answer path. Every AI feature has a budget like this; know which stage you would cut first.',
  inputs:[
    {k:'embed',label:'Query embedding (ms)',min:5,max:200,step:5,val:25,fmt:v=>v+'ms'},
    {k:'ret',label:'Vector search + rerank (ms)',min:10,max:800,step:10,val:150,fmt:v=>v+'ms'},

              {label:'Decode',value:dec,color:'#2dd4bf'}]},
      readouts:[
        {label:'Time to first token',val:fmt(ttft,0)+'ms',color:ttft<=1000?'#3fb950':(ttft<=2000?'#d29922':'#f85149')},
        {label:'Total response time',val:fmt(total/1000,2)+'s',color:total<=3000?'#3fb950':(total<=6000?'#d29922':'#f85149')},
        {label:'Streamed feel',val:fmt(ttft,0)+'ms, then '+fmt(v.tps,0)+' tok/s'},
        {label:'Decode share of total',val:fmt(dec/total*100,0)+'%'}
      ]
    };
  },
  note:'Streaming changes which number matters: users feel time-to-first-token, not total time. That is why "cap the answer length" and "stream earlier" beat "buy faster GPUs" in most product conversations.'
