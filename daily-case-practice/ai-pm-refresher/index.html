MODULES.push({
  id:'m14',tag:'Synthesis',
  title:'Exec comms, behavioural & the closing recommendation',
  sub:'Landing the answer in 60 seconds, telling AI PM stories that survive follow-ups, and the full-loop capstone.',
  concept:[
    {title:'The 60-second recommendation',card:`
      <p>Every case ends here, and most candidates weaken a good analysis by burying the answer. The structure:</p>
      <div class="f">1. THE CALL          one sentence, no preamble
                     "Ship it to the enterprise segment only."

2. WHY (3 reasons)   ordered by weight, each with a number
                     "Precision is 94% there vs 71% in SMB;
                      the margin holds at 68%; and the
                      review workflow already exists."

3. THE RISK + FIX    name the biggest one and how it is handled
                     "The risk is silent quality drift, so we
                      hold a 5% holdout and gate on weekly eval."

4. NEXT STEP         who does what, by when
                     "Two-week pilot with 8 accounts, I report
                      precision and correction rate on the 15th."</div>
      <div class="trap"><b>The three killers:</b> starting with "so I looked at three things..." (nobody asked for your process), giving reasons without numbers, and ending without a next step. Fix all three and you outscore candidates with better analysis.</div>`},
    {title:'Answer-first under pressure',card:`
      <p>The interviewer asks something you have not fully worked out. The move is not to stall, it is to answer with a stated confidence level.</p>
      <ul>
        <li><strong>"My answer is X, and here is what would change it."</strong> Commits without overclaiming.</li>
        <li><strong>"I would need one number to be sure - let me tell you which and what I would do either way."</strong> Shows you know what the decision hinges on.</li>
        <li><strong>"Directionally X, low confidence, because..."</strong> Honest calibration reads as senior, not weak.</li>
      </ul>
      <div class="tip"><b>What never works:</b> "It depends." It always depends. Say what it depends on, then pick.</div>`},
    {title:'AI-specific exec communication',card:`
      <p>Three habits that separate AI PMs who get funded from those who get questioned:</p>
      <ul>
        <li><strong>Translate model metrics into business consequences.</strong> Not "precision improved to 94%," but "false flags dropped from 90 a day to 30, so the review team handles the volume without hiring."</li>
        <li><strong>State uncertainty as a range with a plan, never as a hedge.</strong> "Between 8 and 15 points of deflection; I will know which by the 15th and the plan is the same either way above 8."</li>
        <li><strong>Report the number that could embarrass you, first.</strong> Volunteering the error rate before being asked is the fastest way to be trusted with the next decision.</li>
      </ul>
      <div class="note"><b>On being asked "is the AI working?"</b> - never answer with a model score. Answer with the user or business outcome, then offer the model number as supporting evidence. Executives cannot act on an F1 score.</div>`},
    {title:'Behavioural stories for AI PM loops',card:`
      <p>Prepare six, each ~2 minutes, in situation-action-result form with a number in the result. The AI-specific prompts you should expect:</p>
      <div class="f">1. A time you killed or de-scoped an AI feature
   (tests judgment over enthusiasm)
2. A time you shipped despite imperfect quality
   (tests risk calibration - have the guardrails ready)
3. A disagreement with engineering on feasibility
   (tests technical credibility and how you resolve it)
4. A time the data told you your intuition was wrong
   (tests intellectual honesty)
5. A launch that went badly and what you changed
   (tests ownership - no blaming the model)
6. Convincing a skeptical stakeholder about AI
   (tests communication without hype)</div>
      <div class="tip"><b>Every story needs the counterfactual:</b> what you would do differently. "I would have built the eval set before the prototype, not after" turns an anecdote into demonstrated learning.</div>`},
    {title:'The AI PM interview scorecard - what they write down',card:`
      <ul>
        <li><strong>Technical credibility</strong> - could this person hold a design discussion with an ML engineer without being sold something?</li>
        <li><strong>Judgment about capability</strong> - do they know what models can and cannot do today, without hype or dismissal?</li>
        <li><strong>Metrics rigour</strong> - do they instrument outcomes, or do they ship and hope?</li>
        <li><strong>Risk calibration</strong> - do they tier by consequence, or apply the same controls to everything?</li>
        <li><strong>Product sense</strong> - do they start from a user problem, or from the technology?</li>
        <li><strong>Communication</strong> - can they land a decision in a minute with a number attached?</li>
      </ul>
      <div class="f">The single most common rejection reason:
  "Strong on AI, weak on product."
  They talked about models, not about users,
  and never attached a business metric to anything.</div>`}
  ],
  drills:[
    {type:'open',
     q:'Deliver a 60-second recommendation: an AI summarisation feature tested at 78% user satisfaction, 12% time savings, $0.04 per summary, on a $12/month product.',
     hints:['Call first. Three numbered reasons. Risk plus mitigation. Next step.'],
     sol:`<p><em>"Ship it to all paying users, with a usage cap.</em></p>
       <p><em>"Three reasons. First, 12% time savings on the core workflow is real, retained value - that is roughly an hour a week for our median user, and it is the kind of saving that shows up in renewal conversations. Second, the economics work: at $0.04 a summary and a realistic 20 summaries a month, that is $0.80 against $12, so gross margin stays above 90%. Third, 78% satisfaction is adequate for an assistive feature where the user reviews the output before using it - it would not be adequate for anything automatic.</em></p>
       <p><em>"The risk is the 22% who are dissatisfied. My read is that it concentrates in long or unusual documents rather than being spread evenly, so before scaling I want that segmented - if it is concentrated, we scope the feature and satisfaction jumps; if it is uniform, we have a quality problem and I would hold at 50%.</em></p>
       <p><em>"Next step: ship to 50% behind a flag next week, I report satisfaction segmented by document type and length, plus cost per active user, on the 20th. If the pattern is concentrated, we go to 100% the same week."</em></p>
       <div class="tip"><b>Note what is doing the work:</b> every reason carries a number, the risk is specific rather than generic, and the mitigation is a hypothesis with two branches. That last part - saying what you would do in either case - is what makes it sound like a decision rather than a summary.</div>`},
    {type:'mcq',
     q:'An exec asks "is the AI working?" Best opening?',
     options:[
       'Our F1 score is 0.87, up from 0.79 last quarter.',
       'Support ticket deflection is up 14 points, which is about $2M annualised; accuracy improvements are what drove it.',
       'It depends what you mean by working.',
       'Yes, users love it.'],
     correct:1,
     hints:['Lead with the outcome they can act on; model metrics are supporting evidence.'],
     sol:`<p><strong>B.</strong> Business outcome first, with a number, then the model metric as the cause. The exec can act on deflection and dollars; they cannot act on F1.</p>
       <p>A makes them do a translation they cannot do. C sounds evasive even though it is technically the most accurate statement in the list. D has no evidence and invites exactly the follow-up you do not want.</p>
       <div class="note"><b>Add the honest caveat unprompted:</b> "One thing to flag - the deflection number includes users who gave up rather than escalating, so I am building a resolution-confirmed version of the metric. My estimate is the true figure is 10-12 points, not 14." Volunteering that is how you get believed on the next number.</div>`},
    {type:'open',
     q:'"Tell me about a time you killed an AI feature."',
     hints:['SAR with a number, then the counterfactual.'],
     sol:`<p><strong>Situation.</strong> <em>"We had an AI feature that auto-categorised incoming requests and routed them. It was six weeks from launch, the model hit 89% accuracy in offline eval, and the team was attached to it."</em></p>
       <p><strong>Action.</strong> <em>"I ran a shadow test against live traffic rather than trusting the offline number, and the picture changed: accuracy held around 87%, but the 13% of misroutes were not random. They concentrated in the highest-value enterprise requests, because those were phrased differently from the training distribution. A misroute there cost about four hours of delay on our most important accounts."</em></p>
       <p><em>"I took it to the team with the segmented data rather than the headline number, and proposed we kill the auto-routing and keep the categorisation as a suggestion the human router sees. That was an unpopular meeting - the autonomous version was the interesting one."</em></p>
       <p><strong>Result.</strong> <em>"The suggestion version shipped and cut routing time 22% with no misroute risk, and the accept/reject data gave us a labelled set. Nine months later we had enough enterprise-phrasing examples to revisit auto-routing on that segment specifically."</em></p>
       <p><strong>Counterfactual.</strong> <em>"What I would do differently: I ran the shadow test at week six. It should have been week two. We spent a month building the routing execution path that we then threw away, and the shadow test cost two days. Now I run the offline-to-shadow comparison before any execution work starts."</em></p>
       <div class="tip"><b>Why this scores:</b> the kill is based on segmented evidence rather than a gut call, the alternative ships value instead of leaving a hole, the data becomes an asset, and the counterfactual is a specific process change rather than "I would communicate more."</div>`},
    {type:'mcq',
     q:'You are asked to estimate the impact of a feature you have not built, with no data. Best response?',
     options:[
       'Decline to guess without data.',
       'Give a range with the assumptions stated, and name the one number that would tighten it.',
       'Give a single confident number so you sound decisive.',
       'Give the most optimistic number, then caveat heavily.'],
     correct:1,
     hints:['Structured estimation with visible assumptions is the skill being tested.'],
     sol:`<p><strong>B.</strong> The question is testing whether you can reason quantitatively under uncertainty - declining is a non-answer, a false point estimate is worse, and optimism-plus-caveats is the worst combination because it is both wrong and hedged.</p>
       <p>The shape: <em>"Roughly 8-15% lift on the activation step. That assumes 60% of new users hit this friction point - which our funnel supports - and that the feature resolves it 30-50% of the time, which is where my uncertainty lives. The number that would tighten it is the resolution rate, and I can get a read on that from a two-week prototype with 50 users before we commit engineering."</em></p>
       <div class="tip"><b>Naming the one number that collapses the uncertainty</b> is the senior move. It converts an estimate into a plan.</div>`},
    {type:'open',
     q:'Closing question: "Why AI PM, and why now?"',
     hints:['Specific, not enthusiastic. Show a point of view about the discipline.'],
     sol:`<p><em>"Because the hard part of AI products stopped being the model and started being the product, and that is a shift I want to work in the middle of."</em></p>
       <p><em>"Two or three years ago the constraint was capability - could the model do the task at all. Now the constraint is everything around it: which task to point it at, how to design for probabilistic output, what happens when it is wrong, how to measure whether it is actually working, and what the economics are at scale. Those are product problems, and most of them do not have settled answers yet. That is unusual and it will not last."</em></p>
       <p><em>"What draws me specifically is that AI PM demands both halves. You cannot make good calls about latency, retrieval quality, or agent reliability without understanding the stack, and you cannot make good calls about autonomy or failure UX without understanding users. I have spent time building the technical half deliberately - [specific: evals, cost modelling, a shipped feature] - because I did not want to be a PM who takes the engineering team's word for what is possible."</em></p>
       <p><em>"And honestly, the reason it is interesting now rather than later is that the field is still deciding what good looks like. The conventions for how to evaluate, price, and govern these products are being written by the teams shipping them this year."</em></p>
       <div class="trap"><b>What to avoid:</b> "AI is transforming everything and I want to be part of it." Every candidate says a version of that. A specific point of view about what has changed in the discipline is what gets remembered.</div>`}
  ],
  mcase:{
    title:'Capstone - Northwind: the full loop',
    prompt:`<p><strong>Northwind</strong> is a $200M-ARR HR platform: applicant tracking, onboarding, and performance reviews. 4,000 customers, mostly 200-5,000 employees.</p>
      <p>The CEO wants AI to be "the reason customers pick us in 2027." You are the incoming Director of AI Product. Growth has slowed from 40% to 18%, net revenue retention is 104%, and two AI-native competitors are winning deals at the low end.</p>
      <p>This case runs the whole loop: strategy, feature selection, technical design, metrics, risk, and the closing recommendation.</p>`,
    steps:[
      {kind:'Strategy',
       q:'Where should AI be pointed in this business, and how do you decide?',
       sol:`<p><strong>Start from the commercial problem, not the technology.</strong> <em>"Growth is down and NRR is 104%, which for a platform this size means we are retaining but not expanding. Competitors are winning at the low end, which usually means they are cheaper and faster to value rather than better. So the job for AI here is expansion and differentiation in the mid-market where we are strong - not a defensive feature war at the bottom."</em></p>
         <p><strong>Then find where the work actually is.</strong> <em>"Across our three modules, I would rank by volume of repetitive human effort times consequence of getting it wrong:"</em></p>
         <div class="f">Applicant tracking   HIGH volume, HIGH consequence
    Screening, scheduling, candidate comms
    But: regulated, bias exposure, legal scrutiny

Onboarding           MED volume, LOW consequence
    Document generation, task orchestration, Q&A
    Bounded, verifiable, low risk

Performance reviews  MED volume, HIGH consequence
    Drafting, calibration, summarising feedback
    Sensitive, but the drafting burden is enormous</div>
         <p><strong>The call.</strong> <em>"Onboarding first because it ships fast and safely and proves the platform works. Performance review drafting second because it is the single largest time sink our buyers complain about - managers writing reviews - and it is assistive by nature, so the risk tier is manageable. Screening last and narrowly, because the regulatory exposure means the version worth building is not the version people ask for."</em></p>
         <p><em>"And I would say the strategic point plainly: our advantage is that we hold the employment history, the review history, and the org structure. Any AI feature that does not use proprietary context is one a competitor can copy in a quarter."</em></p>`},
      {kind:'Design the flagship',
       q:'Design the performance-review assistant. What does it do, and what does it deliberately not do?',
       widget:'ragLatency',
       sol:`<p><strong>What it does.</strong> <em>"A manager writing a review gets a grounded first draft assembled from evidence the system already holds: goals set and outcomes recorded, peer feedback submitted, one-on-one notes if shared, project data from integrations. Every statement in the draft carries a citation to the source, and the manager edits from there."</em></p>
         <p><strong>What it deliberately does not do.</strong> <em>"It does not assign a rating, it does not compare employees, and it does not generate praise or criticism that is not traceable to evidence. The moment it produces an unsourced evaluative claim, we have built something that ends up in an employment tribunal - and the manager stops trusting it anyway, because they cannot defend a sentence they cannot source."</em></p>
         <div class="f">Architecture:
  Retrieve per-employee evidence (permission-scoped, hard filter)
  Rerank by relevance to the review period
  Generate section drafts with inline citations
  Refuse any section where evidence is thin, and say so
    -> "No peer feedback was submitted for this period"
       is a better output than an invented paragraph.</div>
         <p><strong>The permission constraint is the hard part.</strong> <em>"Retrieval has to be filtered before the model ever sees the data, never after. A manager must not be able to surface another team's feedback through a cleverly worded prompt, and that is enforced at the query layer with the same access rules as the rest of the platform."</em></p>
         <p><strong>Latency.</strong> <em>"Use the panel - this is a compose-time feature, not a chat feature. A manager waiting eight seconds for a well-sourced draft is fine; they are about to spend forty minutes on it. I would spend that budget on better retrieval and reranking rather than optimising time-to-first-token."</em></p>`},
      {kind:'Metrics',
       q:'What is the metric stack, and what is the guardrail you would fight for?',
       widget:'evalTradeoff',
       sol:`<div class="f">NORTH STAR
  Reviews completed on time with manager satisfaction >= 4/5
  (the buyer's actual pain is late, low-quality reviews)

INPUT METRICS
  % of drafts used as a starting point (adoption)
  Median manager edit time vs baseline (value)
  % of generated statements kept unedited (quality proxy)
  Citation click-through (trust and verification behaviour)

MODEL METRICS
  Groundedness: % of statements traceable to a source
  Retrieval recall on the golden evidence set
  Refusal rate where evidence is thin (should be non-zero)

GUARDRAILS
  Review quality as rated by the employee receiving it
  Distribution of ratings and language across demographic
    groups, monitored continuously
  Permission-boundary violations: hard zero</div>
         <p><strong>The guardrail I would fight for.</strong> <em>"Language and outcome distribution across demographic groups - and I would want it as a launch gate, not a monitoring nice-to-have. Performance reviews feed promotion and compensation. If our drafts systematically use warmer or vaguer language for one group, we have automated a bias at scale inside our customers' HR process, and neither they nor we would notice for a year."</em></p>
         <p><em>"Concretely: before launch, run the generator over a held-out set of historical review inputs, hold the evidence constant and vary only names and pronouns, and measure whether the output changes. If it does, that is launch-blocking. After launch, monitor the distribution monthly with a named owner."</em></p>
         <p><strong>And the metric I would refuse.</strong> <em>"Time saved as the headline. If we optimise for managers spending less time on reviews, the winning move is to generate something plausible they accept without reading - which is the exact failure mode we are trying to avoid. Time saved is a supporting metric; review quality as judged by the recipient is the one that keeps us honest."</em></p>`},
      {kind:'The hard call',
       q:'Six weeks before launch, the eval shows drafts for employees with sparse evidence are noticeably vaguer and slightly more positive. Sparse evidence correlates with part-time and newer employees. What do you do?',
       sol:`<p><strong>Name it accurately first.</strong> <em>"This is not a bias in the model's treatment of people - it is a data-availability artefact that lands unevenly on a group, which for our customers is a distinction without a difference. Part-time and newer employees would systematically receive vaguer, blander reviews, and vague reviews get lower ratings and fewer promotions. We would be shipping a mechanism that disadvantages exactly the people least able to push back."</em></p>
         <p><strong>The fix is product, not model.</strong> <em>"I would not try to prompt my way out of it. Three changes:"</em></p>
         <div class="f">1. Make sparsity explicit, not smoothed over
   "Limited evidence available for this period -
    2 of 6 typical sources present" shown to the manager
   before the draft, with what is missing.

2. Refuse rather than pad. Below an evidence threshold,
   generate section prompts and questions for the manager
   instead of prose. A structured interview beats a
   confident paragraph built on nothing.

3. Fix the upstream cause. Sparse evidence means our
   product is not capturing feedback for these employees.
   That is a real finding and arguably worth more than
   the AI feature - route it to the core team.</div>
         <p><strong>Launch decision.</strong> <em>"I would launch on time, with those three changes and with the feature scoped to employees above the evidence threshold - which I would state openly to customers rather than hide. Below the threshold, managers get the guided-questions version. That is a smaller launch than planned and I would rather explain a narrower scope than explain this pattern to a customer's employment counsel in six months."</em></p>
         <p><em>"And I would put the demographic distribution check into the permanent eval suite, because this class of problem returns every time the model or the retrieval changes."</em></p>
         <div class="note"><b>The pattern worth internalising:</b> when an AI quality gap correlates with a protected or vulnerable group, the answer is almost never "improve the model." It is to make the uncertainty visible, refuse rather than fabricate, and fix the upstream data gap.</div>`},
      {kind:'Close',
       q:'Sixty seconds to the CEO. Land it.',
       sol:`<p><em>"My recommendation: make AI the reason customers expand with us, not the reason they pick us - and point it at performance reviews first.</em></p>
       <p><em>"Three reasons. One, our NRR problem is an expansion problem, and manager time on reviews is the single biggest complaint in our mid-market base, which is where we win. Two, we hold the evidence - goals, feedback, one-on-ones, org structure - so a grounded, cited review draft is something the AI-native competitors literally cannot build without our data. Three, it is assistive by construction, so we can ship it in a quarter rather than spending a year on the compliance surface that AI screening would require.</em></p>
