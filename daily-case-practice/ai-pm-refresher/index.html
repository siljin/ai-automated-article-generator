  sub:'What each technique actually fixes, in what order to reach for them, and how to answer build-vs-buy without hand-waving.',
  concept:[
    {title:'The escalation ladder',card:`
      <p>Reach for these in order. Each step costs 5–10× the previous one in effort and maintenance:</p>
      <ol>
        <li><strong>Prompt engineering</strong> — instructions, format, few-shot examples. Hours. Fixes: format, tone, task framing, consistency.</li>
        <li><strong>Retrieval (RAG)</strong> — inject relevant private or fresh context. Weeks. Fixes: the model not knowing your data.</li>
        <li><strong>Tool use / agents</strong> — let the model call functions, query systems, act. Weeks to months. Fixes: tasks needing live data or side effects.</li>
        <li><strong>Fine-tuning</strong> — adapt weights on your examples. Months plus a data pipeline. Fixes: consistent style, domain format, latency/cost via smaller models.</li>
        <li><strong>Pre-training</strong> — essentially never the right answer for a product team.</li>
      </ol>
      <div class="trap"><b>The single most common interview error</b> is proposing fine-tuning for a knowledge problem. Fine-tuning teaches <em>behaviour and form</em>, not facts. If the complaint is "it does not know our March pricing," the answer is retrieval — every time.</div>`},
    {title:'RAG, in the detail an interviewer probes',card:`
      <div class="f">ingest → chunk → embed → index
query → embed → search (+ filters) → rerank → assemble prompt → generate → cite</div>
      <p>The decisions that actually determine quality:</p>
      <ul>
        <li><strong>Chunking</strong> — semantic boundaries beat fixed sizes. Chunks that split a table from its header are the most common silent quality killer.</li>
        <li><strong>Hybrid search</strong> — combine vector similarity with keyword/BM25. Pure vector search fails on exact identifiers, error codes, and product SKUs.</li>
        <li><strong>Reranking</strong> — retrieve 50 cheaply, rerank to the best 8. Usually the highest-ROI quality change available.</li>
        <li><strong>Freshness and deletion</strong> — how fast an updated document reaches the index, and whether deleted content actually disappears. In enterprise deals this is a contractual question, not an engineering nicety.</li>
        <li><strong>Citations</strong> — grounding the answer in retrievable sources is what makes the output checkable, and checkability is what makes it shippable.</li>
      </ul>`},
    {title:'When fine-tuning is genuinely right',card:`
      <ul>
        <li><strong>Consistent structured output</strong> at high volume, where prompt instructions are unreliable and you cannot afford long few-shot prompts on every call.</li>
        <li><strong>Domain style and vocabulary</strong> — legal, clinical, or a house voice that examples cannot fully convey.</li>
        <li><strong>Cost and latency</strong> — distilling a frontier model's behaviour on your narrow task into a much smaller, faster model. Often the strongest business case.</li>
        <li><strong>A capability the base model lacks</strong> — a rare, specialised task not represented in pre-training.</li>
      </ul>
      <div class="note"><b>The prerequisites to name:</b> 1,000+ clean examples, a held-out eval set that existed before you started, a data pipeline for refreshes, and an owner. Without those four, fine-tuning produces a model nobody can evaluate or update — technical debt with a GPU bill.</div>`},
    {title:'Agents — say the failure modes',card:`
      <p>An agent is a loop: model chooses a tool, observes the result, decides again, until done. It fits multi-step tasks with real side effects. Name the failure modes unprompted:</p>
      <ul>
        <li><strong>Compounding error</strong> — 90% reliability per step is 59% over five steps. This one number kills most agent proposals, and quoting it signals you have thought it through.</li>
        <li><strong>Silent looping</strong> — needs step budgets, timeouts, and a hard stop with a human handoff.</li>
        <li><strong>Irreversible actions</strong> — anything that sends, pays, deletes, or publishes needs confirmation or a compensating transaction.</li>
        <li><strong>Debuggability</strong> — you must log the full trace, or nobody can explain what happened to a customer.</li>
      </ul>
      <div class="tip"><b>Product answer:</b> "I would decompose into the fewest possible steps and make each independently verifiable, rather than building a longer chain and hoping. Reliability is a function of step count before it is a function of model quality."</div>`},
    {title:'Build vs. buy, decided on four axes',card:`
      <ul>
        <li><strong>Differentiation</strong> — is the model the product, or a component? Do not build what you would not put on the pricing page.</li>
        <li><strong>Volume</strong> — self-hosting has a crossover point. Below it you are paying for idle GPUs; above it API pricing compounds.</li>
        <li><strong>Data and compliance constraints</strong> — residency, retention, and no-third-party requirements can force self-hosting regardless of economics.</li>
        <li><strong>Team</strong> — self-hosting is a serving team, on call, forever. This is the axis that decides it in practice.</li>
      </ul>
      <div class="f">Default answer: buy the frontier API for quality-critical paths,
self-host a small model for high-volume narrow tasks,
and keep a provider-abstraction layer so switching is a config change.</div>`}
  ],
  drills:[
    {type:'mcq',
     q:'Support agents complain the AI assistant "does not know" your new product tier launched last month. What do you do?',
     options:[
       'Fine-tune on recent support conversations.',
       'Fix the retrieval pipeline: index the new documentation and check freshness lag.',
       'Upgrade to a larger model with a more recent training cutoff.',
       'Add the new tier details to the system prompt.'],
     correct:1,
     hints:['Knowledge problems are retrieval problems.'],
     sol:`<p><strong>B.</strong> This is a knowledge freshness problem, and retrieval is the mechanism designed for it. The diagnostic question is how long it takes a published document to become retrievable — if that lag is a week, every launch will produce this complaint again.</p>
       <p>A teaches behaviour, not facts, and would need redoing at every launch. C depends on a provider's training cutoff you do not control — an absurd dependency for your own pricing page. D works for a handful of facts and does not scale: system prompts accumulate into unmaintainable 8,000-token documents that raise cost and latency on every request.</p>
       <div class="tip"><b>The follow-up to volunteer:</b> "I would add index freshness as a monitored metric with an alert, and make 'documentation indexed' a launch checklist item. This will otherwise recur every release."</div>`},
    {type:'mcq',
     q:'Which is the strongest case for fine-tuning?',
     options:[
       'The model needs to answer questions about your internal wiki.',
       'The model must output a specific 40-field JSON schema, at 2M requests/day, and you want to run it on a smaller model.',
       'The model occasionally refuses reasonable requests.',
       'Users want more up-to-date information.'],
     correct:1,
     hints:['Which is a behaviour-and-cost problem rather than a knowledge problem?'],
     sol:`<p><strong>B.</strong> High-volume structured output is the textbook fine-tuning case: prompt-based schema instructions are unreliable at the margin, the few-shot examples needed to make them reliable cost tokens on every one of 2M daily calls, and distilling into a smaller model cuts both latency and cost substantially.</p>
       <p>A and D are retrieval. C is prompt work and possibly a provider-policy issue — fine-tuning to work around refusals is both fragile and a governance problem you would have to defend.</p>`},
    {type:'num',
     q:'An agent completes a 6-step workflow. Each step succeeds independently 92% of the time. What is the end-to-end success rate?',
     unit:'%', a:60.6, tol:0.03, ph:'e.g. 70',
     hints:['0.92 to the 6th power.','0.92² ≈ 0.846; cube that.'],
     sol:`<div class="f">0.92⁶ = (0.92²)³ = 0.846³ ≈ 0.606 → 60.6%</div>
       <p><em>"Two in five workflows fail somewhere, despite every individual step looking excellent. That is the number I would put in front of anyone excited about a long agent chain."</em></p>
       <p><em>"Three responses, in order: cut the step count — four steps at 92% is 71%, six is 61%; make failures recoverable rather than fatal, so a failed step retries or asks the user instead of collapsing the run; and checkpoint state so a failure at step 5 does not discard the first four. Reliability engineering beats model upgrades here — going from 92% to 95% per step only reaches 74% end-to-end."</em></p>
       <div class="note"><b>This calculation is the highest-leverage single number in AI PM interviews.</b> It reframes agent conversations from capability to architecture in one line.</div>`},
    {type:'open',
     q:'A team says "our RAG quality is bad." Give your diagnostic sequence.',
     hints:['Separate retrieval failure from generation failure before anything else.'],
     sol:`<p><em>"First I split the failure: is the right chunk being retrieved and the model mishandling it, or is the right chunk never arriving? Take 50 failed queries and check manually whether the answer was present in the retrieved context. That single check routes the entire investigation, and most teams skip it."</em></p>
       <p><strong>If retrieval is failing:</strong></p>
       <ul>
         <li>Chunking — are tables split from headers, are chunks too small to carry meaning or too large to be precise?</li>
         <li>Query mismatch — users write "why was I charged twice" while the doc says "duplicate transaction handling." Fix with hybrid search and query rewriting.</li>
         <li>Missing hybrid retrieval — vector-only search fails on error codes, SKUs, and exact names.</li>
         <li>No reranking — the right chunk is in the top 50 but not the top 5.</li>
         <li>Freshness — the content simply is not indexed yet.</li>
       </ul>
       <p><strong>If retrieval succeeds but answers are wrong:</strong></p>
       <ul>
         <li>Too much context — the relevant chunk is buried; cut top-k and rerank harder.</li>
         <li>Conflicting sources — two documents disagree and the model averages them. Needs recency or authority weighting, and sometimes an explicit "sources conflict" response.</li>
         <li>Prompt not enforcing grounding — require citations and instruct abstention when context is insufficient.</li>
       </ul>
       <p><em>"And I would ask what 'bad' means, because that word usually hides three different complaints: wrong facts, right facts in a useless format, and refusing to answer things it should. Those have completely different fixes, and lumping them together is why the team is stuck."</em></p>`},
    {type:'mcq',
     q:'Your company processes 40M requests/month on a narrow classification task. Frontier API cost is $9k/month. Should you self-host an open model?',
     options:[
       'Yes — 40M requests is well past the crossover point.',
       'No — $9k/month is far below the cost of the team required to run it.',
       'Yes, if you already have GPUs available.',
       'Only if data residency requires it.'],
     correct:1,
     hints:['Compare against fully-loaded people cost, not GPU rental.'],
     sol:`<p><strong>B.</strong> $9k a month is $108k a year. Self-hosting means at minimum a fraction of an ML engineer and an on-call rotation — realistically $200–400k a year fully loaded, before GPU spend, and before the opportunity cost of what those people would otherwise build.</p>
       <p>C is the trap: "we already have GPUs" ignores that idle capacity has an alternative use and that serving is an operational commitment, not a hardware one. D is a legitimate override — compliance can force self-hosting regardless of economics — but it is not the general answer, and the question gives no such constraint.</p>
       <div class="tip"><b>Rule of thumb worth quoting:</b> "Self-hosting rarely pays below roughly $50k/month of API spend, because that is where the savings start to cover a team rather than a machine."</div>`}
  ],
  mcase:{
    title:'Meridian Legal — the fine-tuning request',
    prompt:`<p><strong>Meridian</strong> builds contract-review software for law firms. The AI extracts clauses, flags risks, and drafts summaries.</p>
      <p>Customers complain about three things: summaries do not match firm house style; the model misses obligations specific to their jurisdiction; and at 3M documents a month, inference is $140k/month. The head of engineering proposes fine-tuning a model to fix all three.</p>`,
    steps:[
      {kind:'Separate the problems',
       q:'Fine-tuning for all three? Take the request apart.',
       sol:`<p><em>"Three complaints, three different mechanisms — and only one of them is a fine-tuning problem."</em></p>
         <div class="f">Complaint            Actual cause          Right fix
House style          Behaviour/form        Fine-tune (or prompt first)
Jurisdiction misses  Missing knowledge     Retrieval + eval per jurisdiction
$140k/month cost     Model size + prompt   Distillation, caching, routing</div>
         <p><em>"Bundling them into one project is how you end up six months later with a model that has slightly better style and none of the other two fixed. I would separate them, because two have fixes available in weeks and one does not."</em></p>
         <div class="tip"><b>Decomposing a bundled request</b> is itself a scored behaviour. The interviewer put three problems in one ask specifically to see whether you would accept the framing.</div>`},
      {kind:'The knowledge problem',
       q:'How would you fix jurisdiction-specific misses?',
       sol:`<p><em>"This is retrieval, and I would resist any temptation to treat it as model capability. Jurisdictional requirements are documented, they change with legislation, and they must be citable — a lawyer needs to see which statute drove the flag. Weights cannot cite, and weights cannot be updated the week a rule changes."</em></p>
         <p><em>"Design: a jurisdiction-tagged corpus of statutory requirements and firm precedents; hard metadata filtering so a New York contract retrieves only New York material — that is a filter, not a similarity hope; and every flag carries the source it came from."</em></p>
         <p><em>"Then the eval, which is the part that matters: a golden set <strong>per jurisdiction</strong>, not one global set. A global eval averaging 94% can hide a jurisdiction sitting at 60%, and in this product that jurisdiction is a specific customer whose renewal is at risk. I would report eval scores segmented the same way we sell — by jurisdiction and practice area."</em></p>
         <div class="note"><b>"Segment the eval the way you segment the customers"</b> is a strong, quotable principle for any B2B AI product.</div>`},
      {kind:'The cost problem',
       q:'Inference is $140k/month across 3M documents. What is cost per document, and where would you attack it?',
       unit:'$ per document', a:0.0467, tol:0.04, ph:'e.g. 0.05',
       widget:'buildBuy',
       sol:`<div class="f">$140,000 / 3,000,000 = $0.0467 per document</div>
         <p><em>"Under five cents a document, against a service that firms bill hundreds of dollars for. So the first thing I would establish is whether cost is even the right problem — at this price point it is likely under 2% of revenue, and the answer might be to spend more per document, not less."</em></p>
         <p><em>"If it is worth attacking, the order is: cache the clause-library prefix, which is identical across documents and is the cheapest win available; route by document complexity, since a two-page NDA does not need the same model as a 90-page master services agreement; and only then consider distilling clause extraction — a narrow, high-volume, well-specified task — into a small fine-tuned model while keeping the frontier model for risk analysis and drafting."</em></p>
         <p><em>"Use the crossover panel: at 3M documents a month, self-hosting only wins if the fully-loaded serving team is small — and in a legal-tech company, ML serving talent is exactly what we do not have spare."</em></p>`},
      {kind:'Recommend',
       q:'Give your recommendation to the head of engineering.',
       sol:`<p><strong>Answer first.</strong> <em>"Yes to fine-tuning, but for one of the three problems and not the one you would expect — and not first. Sequence: prompt and retrieval work now, distillation for cost in the second quarter, style fine-tuning only if prompt work fails to close it."</em></p>
         <p><strong>Support.</strong> <em>"Jurisdiction misses are a retrieval and eval problem — weeks of work, and they are the complaint most likely to lose us a renewal, so they go first. House style is worth one serious attempt at prompt-plus-few-shot with per-firm examples; if firms need genuinely distinct voices, per-firm fine-tunes are a maintenance burden of N models, and I want to be certain before committing to that. Cost is under 2% of revenue and has three cheaper levers before fine-tuning."</em></p>
         <p><strong>Risks.</strong> <em>"Two. Per-firm fine-tunes create an N-model support problem — every base model upgrade means re-tuning every customer, and that cost compounds silently. And distillation for extraction risks quality regression on rare clause types, which is exactly where our value is; that needs a rare-clause eval slice before it ships, not after."</em></p>
         <p><strong>Next steps.</strong> <em>"Three: build the per-jurisdiction eval this month, because we currently cannot tell which customers are being underserved; run a two-week prompt experiment on house style with three design-partner firms; and instrument cost per document by contract type, so the distillation decision is made on data rather than on a headline number."</em></p>
         <div class="tip"><b>Note the shape of the answer:</b> you did not refuse the engineer's proposal, you re-sequenced it and attached evidence to each step. "Yes, but third, and here is what has to be true first" is usually the right register in a cross-functional AI decision.</div>`}
    ]
  }
});


/* =========================================================================
   MODULE 7 — Data strategy & the flywheel
   ========================================================================= */
MODULES.push({
  id:'m07',tag:'Technical depth',
  title:'Data strategy, cold start & the flywheel',
  sub:'Where the training and eval data comes from, how to launch without it, and how to tell a real data moat from a slide.',
  concept:[
    {title:'The four data assets, and which you actually need',card:`
      <ul>
        <li><strong>Context data</strong> — what you retrieve at inference: docs, tickets, records. Needed on day one; usually already exists.</li>
        <li><strong>Eval data</strong> — labelled examples with correct answers. Needed <em>before</em> launch. The most commonly skipped asset and the most damaging to skip.</li>
        <li><strong>Feedback data</strong> — accepts, edits, thumbs, corrections. Generated by usage; design its capture before launch or you lose the first six months of it.</li>
        <li><strong>Training data</strong> — curated examples for fine-tuning. Needed only if you reach that rung of the ladder.</li>
      </ul>
      <div class="tip"><b>Interview move:</b> when asked "what data do you need?", answer with these four categories rather than a vague "lots of examples." It shows you know eval data is a separate, earlier requirement than training data.</div>`},
    {title:'Solving cold start',card:`
      <p>You will be asked how to launch with no data. Five real options, roughly in order of preference:</p>
      <ol>
        <li><strong>Foundation-model capability</strong> — most tasks work zero-shot now. The honest first answer is often "we do not need training data, we need an eval set."</li>
        <li><strong>Hand-built eval set</strong> — 200–500 examples written by PMs and domain experts in a week. Unglamorous, and it is what actually unblocks launch.</li>
        <li><strong>Synthetic generation with human verification</strong> — generate candidate cases, have experts correct them. Fast, but never ship a synthetic eval set nobody reviewed.</li>
        <li><strong>Design partners</strong> — a handful of customers who trade data access and labelling effort for early capability and influence.</li>
        <li><strong>Staged rollout as data collection</strong> — internal users, then friendlies, then general availability, with the explicit goal of harvesting corrections at each stage.</li>
      </ol>
      <div class="trap"><b>Wrong answer:</b> "we would collect data for six months, then build." That describes a project that gets cancelled. Modern practice is to ship narrow, instrument corrections, and widen.</div>`},
    {title:'The flywheel — and when it is fake',card:`
      <div class="f">usage → corrections → better model → better output → more usage</div>
      <p>Real flywheels need four properties. Test any claimed one against them:</p>
      <ul>
        <li><strong>The signal is captured</strong> — the edit is stored with its input, not discarded on save.</li>
        <li><strong>The signal is unambiguous</strong> — you can tell whether an edit means "wrong" or "I prefer my phrasing."</li>
        <li><strong>The loop closes fast enough</strong> — corrections reach the system in weeks, not annually.</li>
        <li><strong>The data is defensible</strong> — a competitor cannot buy or scrape equivalent data next quarter.</li>
      </ul>
      <div class="note"><b>The strongest flywheels are outcome-linked:</b> not "the user edited this," but "the invoice was later paid," "the ticket did not reopen," "the flagged listing was upheld on appeal." Outcomes are scarce, unambiguous, and nearly impossible for a competitor to replicate — that is what a data moat actually looks like.</div>`},
    {title:'Labelling — cost and quality',card:`
      <div class="f">Rough cost model:
  simple binary label     ~$0.05–0.20 each
  domain expert judgment  ~$2–15 each (clinical, legal, financial)
  5,000 expert labels     ≈ $10k–75k and 3–8 weeks

Quality controls:
  overlap 10% for inter-rater agreement (target κ > 0.7)
  written guidelines with edge cases, revised after pilot
  a gold set of known answers seeded into the queue</div>
      <p>The number interviewers listen for is <strong>inter-rater agreement</strong>. If your own experts agree only 60% of the time, no model can exceed that ceiling — and you have discovered the task definition is the problem, not the model.</p>`},
    {title:'Privacy and data rights',card:`
      <ul>
        <li><strong>Training rights are not usage rights.</strong> Being permitted to process a customer's data to serve them does not permit training a shared model on it. In enterprise contracts this is usually explicit.</li>
        <li><strong>Retention and residency</strong> — where prompts are stored, for how long, and in which region. Often the first question in an enterprise security review.</li>
        <li><strong>Provider terms</strong> — whether your vendor trains on API traffic, and what your zero-retention options are. Know the answer before a customer asks.</li>
        <li><strong>Right to deletion</strong> — you can delete a document from an index; you cannot delete it from fine-tuned weights. That asymmetry should shape whether you fine-tune on customer data at all.</li>
      </ul>
      <div class="tip"><b>Line that lands well:</b> "I would design so customer data improves <em>their</em> instance through retrieval, and only aggregate, consented, de-identified data touches shared model training. That is easier to sell, easier to defend, and it survives a contract review."</div>`}
  ],
  drills:[
    {type:'mcq',
     q:'You are launching an AI feature in six weeks with no labelled data. What is the highest priority?',
     options:[
       'Collect 10,000 training examples for a future fine-tune.',
       'Build a 300-example evaluation set covering the failure modes you expect.',
       'Set up a labelling vendor contract.',
       'Run a synthetic data generation pipeline.'],
     correct:1,
     hints:['What blocks launch versus what improves a later version?'],
     sol:`<p><strong>B.</strong> Without an eval set you cannot tell whether a prompt change helped, whether a provider silently changed the model under you, or whether you are ready to ship at all. It is the only data asset that actually blocks launch.</p>
       <p>300 stratified examples is a week of PM and domain-expert time — deliberately weighted toward expected failure modes rather than sampled randomly, because a random sample of easy cases tells you nothing. A, C, and D all serve a fine-tune you may never need.</p>
       <div class="note"><b>Say this plainly in an interview:</b> "Evals before training data, always. Teams that skip evals ship on vibes and then cannot explain a regression."</div>`},
    {type:'num',
     q:'You need 4,000 expert-labelled examples at $8 each, with 12% overlap for agreement checking. What is the labelling budget?',
     unit:'$', a:35840, tol:0.03, ph:'e.g. 32,000',
     hints:['Overlap means some items are labelled twice: 4,000 × 1.12 labels.'],
     sol:`<div class="f">Labels needed = 4,000 × 1.12 = 4,480
Cost = 4,480 × $8 = $35,840</div>
       <p>Then the framing that matters: <em>"About $36k and, at expert throughput, six to eight weeks — so the real cost is the calendar, not the cash. I would also pilot 200 examples first and compute inter-rater agreement before spending the rest. If agreement is under 0.7 the guidelines are ambiguous, and labelling the remaining 3,800 items would simply be buying noise at $8 a piece."</em></p>`},
    {type:'open',
     q:'A leader says "our data is our moat." How do you pressure-test that claim?',
     hints:['Volume is not a moat. Ask what makes it hard to replicate.'],
     sol:`<p>Four questions, and most claimed moats fail at least two:</p>
       <ul>
         <li><strong>Is it unique, or just large?</strong> Ten million public product reviews are not a moat — a competitor can obtain equivalents. Ten million <em>outcome-linked</em> records are.</li>
         <li><strong>Is it labelled by consequence?</strong> Data where reality supplied the answer — the ticket reopened, the invoice was paid, the diagnosis was confirmed — is far more valuable than data where a human guessed.</li>
         <li><strong>Do we have the rights to use it?</strong> A moat you are contractually barred from training on is not an asset, and this is where enterprise data claims usually collapse.</li>
         <li><strong>Does more of it still help?</strong> Most tasks plateau. If quality is flat between 50k and 500k examples, additional volume defends nothing.</li>
       </ul>
       <p>Then the reframe: <em>"Usually the durable advantage is not the data itself but the <strong>feedback loop</strong> — being positioned where corrections arrive continuously and for free. A competitor can buy a dataset; they cannot buy your place in the workflow. So I would spend the effort on making the loop tighter and better instrumented rather than on accumulating volume."</em></p>`},
    {type:'mcq',
     q:'Your enterprise customers will not allow their data to leave their tenant. What does this most constrain?',
     options:[
       'Retrieval — you cannot index their documents.',
       'Shared fine-tuning and any centralised training on customer data.',
       'Evaluation — you cannot measure quality at all.',
       'Nothing significant; modern providers are compliant.'],
     correct:1,
     hints:['Which activity necessarily pools data across customers?'],
     sol:`<p><strong>B.</strong> Retrieval works fine within a tenant boundary — that is the standard enterprise architecture. Evaluation is workable through per-tenant evals, aggregate metrics, and customer-run test sets. What breaks is pooling data across customers to train one shared model, which is precisely the thing most "our data compounds" strategies assume.</p>
       <p>The consequence worth stating: <em>"That constraint pushes us toward per-tenant retrieval quality and prompt-level improvements as the mechanism for getting better, and it means our roadmap cannot depend on cross-customer training. I would rather know that in the architecture review than discover it in a security questionnaire two weeks before a renewal."</em></p>`},
    {type:'open',
     q:'Design the feedback capture for an AI feature that suggests replies in a messaging product.',
     hints:['Distinguish accept, edit, and ignore — and instrument the silent case.'],
     sol:`<p><strong>Signals, in descending value:</strong></p>
       <ul>
         <li><strong>Sent as-is</strong> — strong positive. Log the suggestion, the context, and that it went unmodified.</li>
         <li><strong>Edited then sent</strong> — the highest-value signal in the product. Store both versions; the diff tells you whether the failure was facts, tone, or length.</li>
         <li><strong>Dismissed explicitly</strong> — a clear negative, worth a lightweight optional reason.</li>
         <li><strong>Ignored silently</strong> — the most common outcome and the easiest to lose. Log impressions, not just interactions, or your acceptance rate is computed on the wrong denominator.</li>
         <li><strong>Downstream outcome</strong> — did the conversation resolve, did the recipient reply, was there a follow-up complaint? Scarce, delayed, and worth the plumbing.</li>
       </ul>
       <p><strong>Design constraints to name:</strong> <em>"Never interrupt to ask for feedback — a rating dialog on a messaging surface costs more engagement than the signal is worth. Capture passively and treat explicit thumbs as a bonus. And store the full input context with every event, because a suggestion is only judgeable against what preceded it; a log of outputs alone is nearly useless six months later."</em></p>
       <p><strong>Privacy:</strong> <em>"Message content is sensitive, so I would retain edit diffs and structured signals rather than full transcripts by default, with a separate opt-in for content retention — and I would put the retention window in the product's privacy page rather than only in the contract."</em></p>`}
  ],
  mcase:{
    title:'Clinica — building the eval set for a clinical documentation assistant',
    prompt:`<p><strong>Clinica</strong> is building an AI assistant that drafts clinical visit notes from an ambient recording of the consultation. Launch is in ten weeks with three design-partner clinics.</p>
      <p>There is no labelled data, and clinicians are the only people qualified to judge output quality.</p>`,
    steps:[
      {kind:'What data first',
       q:'Ten weeks, no data. What do you build first and why?',
       sol:`<p><em>"The eval set, and I would defend that against any pressure to spend the ten weeks on model work. Without it, the launch decision is somebody's impression of a demo — and in a clinical product that is indefensible."</em></p>
         <p><em>"Target 250 stratified cases, deliberately weighted to where I expect failure rather than sampled randomly: multiple complaints in one visit, medication changes, patients who interrupt or contradict themselves, accented and non-English speech, background noise, and visits where the clinician dictates asides not meant for the note."</em></p>
         <p><em>"Sourcing: recorded consented consultations from the design partners where possible, plus scripted scenarios acted out for the rare and dangerous cases we cannot ethically wait to encounter. And critically, the reference note is written by a clinician who heard the recording — the eval is only as good as its ground truth."</em></p>
         <div class="tip"><b>Stratified-by-failure-mode</b> is the phrase to use. Random sampling of a mostly-easy distribution produces an eval that passes everything and predicts nothing.</div>`},
      {kind:'Scoring',
       q:'How do you score a generated clinical note? There is no single right answer.',
       sol:`<p><em>"I would refuse a single quality score and use severity-weighted error categories, because in this domain the errors are not equally bad and an average hides exactly the ones that matter."</em></p>
         <div class="f">Category               Definition                    Gate
Clinical fabrication   Symptom/med/finding not said  ZERO tolerance
Clinical omission      Material fact missed          < 2% of notes
Wrong attribution      Patient vs. clinician mixed   < 3%
Coding/structure       Wrong section, format         < 10%
Style                  Verbose, awkward phrasing     no gate</div>
         <p><em>"Fabrication is a hard gate, not a percentage to optimise — a note claiming a symptom the patient never reported enters the permanent medical record and can drive a real clinical decision. If any build fabricates on the golden set, it does not ship regardless of every other number."</em></p>
         <p><em>"Scoring is clinician-performed on the golden set, with 15% double-scored for agreement. I would also build an automatic groundedness check — every clinical assertion in the note traced to a span in the transcript — which is cheap, runs on every build, and catches most fabrication before a human ever looks."</em></p>`},
      {kind:'Cost the eval',
       q:'250 cases, each scored by a clinician at 20 minutes, at a $180/hour loaded rate, with 15% double-scoring. What does one full eval run cost?',
       unit:'$', a:17250, tol:0.05, ph:'e.g. 15,000',
       sol:`<div class="f">Scorings = 250 × 1.15 = 287.5
Hours    = 287.5 × 20/60 = 95.8 hours
Cost     = 95.8 × $180 ≈ $17,250 per full run</div>
         <p><em>"$17k per run is the number that changes the whole eval architecture. You cannot run that nightly, so the design has to be tiered: automatic groundedness and format checks on every build for free; the LLM-judge on the full 250 nightly for regression detection; and the full clinician run only at release candidates and after any model change — call it monthly, roughly $200k a year."</em></p>
         <p><em>"That figure is also the argument for calibrating the LLM judge properly. Every point of agreement we gain between judge and clinician converts directly into cheaper, faster iteration — so I would spend the first clinician run on calibration rather than treating it purely as a gate."</em></p>
         <div class="note"><b>Turning an eval cost into an architecture decision</b> is the move here. The number is not trivia; it dictates cadence, which dictates how fast the team can learn.</div>`},
      {kind:'The flywheel',
       q:'Post-launch, how does this system get better — and is that a moat?',
       sol:`<p><strong>The loop.</strong> <em>"Clinicians edit every note before signing it, and that edit is our signal — captured as a diff against the generated draft, tagged by section, with the audio context retained under the partner agreement. Roughly 40 notes per clinician per day means the correction volume is substantial from week one, and unlike thumbs-up data it is unambiguous: a clinician who changes 'denies chest pain' to 'reports intermittent chest pain' has told us exactly what went wrong and what right looks like."</em></p>
         <p><strong>How it improves the product.</strong> <em>"Near term, edit patterns drive prompt and retrieval work — if a section is edited 40% of the time, that section's instructions are wrong. Medium term, high-agreement corrected notes become fine-tuning data for house format and specialty vocabulary. And continuously, edits refresh the eval set with real failures rather than the ones we imagined in week one."</em></p>
         <p><strong>Is it a moat?</strong> <em>"Partly, and I would be honest about the limits. The strong part: expert corrections linked to audio, in specialty-specific language, at volume — that is expensive and slow for anyone to replicate, and it arrives free as a byproduct of the workflow we sit in. The weak part: it is per-tenant data under clinical privacy terms, so we may not pool it across customers, which caps how much of it compounds into one shared model."</em></p>
         <p><em>"So the durable advantage is the position in the workflow, not the dataset. If a competitor gets into the same seat, they build a comparable correction stream within a year. That argues for spending on switching costs — EHR integration depth, specialty templates, and clinician trust — rather than assuming the data alone defends us."</em></p>
         <div class="tip"><b>The strongest version of a data-moat answer</b> always includes the part that is <em>not</em> a moat. Interviewers hear unqualified moat claims constantly; the qualification is the signal.</div>`}
    ]
  }
});

/* =========================================================================
   MODULE 8 — AI product sense / 0→1 design
   ========================================================================= */
MODULES.push({
  id:'m08',tag:'Core question type',
  title:'AI product sense — designing a 0→1 feature',
  sub:'The most common interview in the loop: "Design an AI feature for X." How to go deep, stay concrete, and design for the errors.',
  concept:[
    {title:'The ten-minute arc',card:`
      <div class="f">0:00  Restate, clarify, announce structure         (60s)
1:00  User & job — pick ONE segment, one job      (90s)
2:30  Why AI — the fit test, out loud             (60s)
3:30  The experience — walk one concrete flow     (2–3 min)
4:30  The system behind it                        (90s)
6:00  Errors — what happens when it is wrong      (90s)
7:30  Metrics & rollout                           (90s)
9:00  Risks, what would change my mind, next step (60s)</div>
      <p>Two failure modes bracket this arc. Too shallow: three feature ideas at one minute each, no system, no errors. Too narrow: eight minutes on retrieval architecture and no user in sight. Keep the clock in your head.</p>`},
    {title:'Pick one user and one job — then commit',card:`
      <p>Breadth is the enemy. A strong answer names a segment specifically enough that its constraints are obvious:</p>
      <ul>
        <li>Weak: "users of a fitness app." Strong: "returning-after-injury runners, 30–50, who have lost confidence in their own pacing judgment."</li>
        <li>Weak: "small businesses." Strong: "solo tradespeople who invoice from a phone, at night, after a full day on site."</li>
      </ul>
      <p>The specific version generates the design for you: the tradesperson answer implies voice input, offline tolerance, and forgiving error correction, because you cannot type carefully at 9pm in a van.</p>
      <div class="tip"><b>If the interviewer says "why that segment?"</b>, the answer is a hypothesis about value, not a preference: "because their job fails most acutely, they are underserved by the current flow, and they are numerous enough to matter. If any of those is wrong, I would pick differently."</div>`},
    {title:'Walk the flow, do not describe the feature',card:`
      <p>The difference between an average and a strong product-sense answer is almost always concreteness. Narrate a real user in a real moment:</p>
      <div class="f">"It's 9pm. Dana finished a boiler repair. She opens the app,
 taps the mic, says: 'invoice Mrs. Patel, boiler service,
 two hours labour, replaced the pressure valve.'

 We show a draft invoice: line items, her standard rates
 pre-filled, the valve priced from her last three purchases,
 with the valve line flagged 'price estimated — check?'

 She taps the valve, corrects £38 to £42, hits send.
 Eleven seconds, and we learned her real valve price."</div>
      <p>That narration carried the input modality, the trust design (flagging the uncertain field), the error recovery, and the feedback loop — without ever announcing them as bullet points.</p>`},
    {title:'The errors section is what separates candidates',card:`
      <p>Always cover four cases explicitly, and give each a designed response:</p>
      <ul>
        <li><strong>Confidently wrong</strong> — how does the user notice? What makes it cheap to fix?</li>
        <li><strong>Unsure</strong> — does the product ask a clarifying question, hedge visibly, or abstain? All three are legitimate; silence is not.</li>
        <li><strong>Refuses or fails</strong> — is there a graceful fallback to the old flow, or does the user hit a dead end?</li>
        <li><strong>Systematically biased</strong> — does it work worse for some accents, languages, or customer types, and how would you detect that rather than hear about it on social media?</li>
      </ul>
      <div class="trap"><b>"We would show a confidence score"</b> is usually a weak answer. Raw model confidence is poorly calibrated and users cannot act on 0.73. Prefer behaviour: flag the specific uncertain field, ask a targeted question, or show the source.</div>`},
    {title:'Close with what would change your mind',card:`
      <p>Ending on certainty is a missed opportunity. End on the test:</p>
      <div class="f">"I'd ship this to 200 tradespeople for three weeks.
 The number I'd watch is invoices completed by voice
 without switching to manual entry — I'd want 60%+.

 If it's under 30%, my segment hypothesis is wrong:
 the constraint isn't typing effort, it's that they don't
 trust an automated invoice with their customer's name on it.
 That would push me toward a review-first design."</div>
      <p>This shows falsifiability, a named threshold, and a specific alternative — the three things that distinguish a product thinker from someone describing an app.</p>`}
  ],
  drills:[
    {type:'mcq',
     q:'"Design an AI feature for a language-learning app." Which is the strongest opening move?',
     options:[
       'List AI opportunities across the whole app, then pick one.',
       'Pick intermediate learners who stall because they never speak with anyone, and design conversation practice.',
       'Propose an AI tutor that personalises the entire curriculum.',
       'Ask what the company\'s AI strategy is.'],
     correct:1,
     hints:['Which answer commits to a specific user pain you can design against?'],
     sol:`<p><strong>B.</strong> It names a segment, a specific failure (the intermediate plateau, where progress stalls without speaking practice), and a solution shape that AI is unusually well suited to — infinitely patient, never embarrassing, available at 6am.</p>
       <p>A burns two minutes on a survey and signals you cannot prioritise. C is too big to design in ten minutes and will collapse into generalities. D is deferral: the interviewer wants your judgment, not the company's strategy deck.</p>
       <div class="tip"><b>You can still show breadth in one line:</b> "There are three obvious areas — conversation, feedback on writing, and curriculum personalisation. I'll take conversation because the plateau is the sharpest pain and AI's patience is a genuine unlock." Ten seconds of breadth, then depth.</div>`},
    {type:'open',
     q:'Walk the core flow of that conversation-practice feature as a concrete moment.',
     hints:['Name the person, the time, the device, and what they see and hear.'],
     sol:`<p><em>"It's 7:10am. Marco has a Spanish trip in three weeks and can read menus fine but freezes when someone speaks to him. He opens the app and picks 'Order at a café — Madrid.'"</em></p>
       <p><em>"A voice starts: '¿Qué te pongo?' Marco hesitates, says 'Un café... con leche, por favor,' stumbling on the article. The conversation continues naturally — the barista asks if he wants it to take away. It does not stop to correct him mid-flow, because interruption is what makes speaking practice unbearable."</em></p>
       <p><em>"After 90 seconds it ends. Now the feedback appears: a transcript of what he said with two corrections highlighted, each with a tap-to-hear-it-right; one pattern note — 'you're dropping articles under time pressure, which is normal at your level'; and a single suggested next scenario that reuses the same construction."</em></p>
       <p><em>"Three design decisions I would call out: corrections come after, not during, because in-flow correction destroys fluency practice and confidence, which is the actual problem we are solving; the difficulty adapts to his hesitation, slowing down or simplifying when he stalls, because a conversation he cannot follow is worse than none; and there is a visible 'I didn't understand' button, because the alternative is silent failure and a user who quietly quits."</em></p>
       <div class="note"><b>Notice what the narration accomplished:</b> latency requirements (real-time voice), error philosophy (defer correction), adaptation, and an abstention path — all delivered through the story rather than as a checklist.</div>`},
    {type:'mcq',
     q:'For that conversation feature, which failure mode deserves the most design attention?',
     options:[
       'The model uses a word slightly above the learner\'s level.',
       'The model misunderstands accented speech and responds to something the learner did not say.',
       'The conversation topic gets repetitive across sessions.',
       'Response latency occasionally reaches 2 seconds.'],
     correct:1,
     hints:['Which failure makes the user blame themselves?'],
     sol:`<p><strong>B.</strong> A learner whose speech is misrecognised concludes their pronunciation is hopeless, not that the ASR is weak. It attacks precisely the confidence the feature exists to build, and it lands hardest on learners with less standard accents — the users least well served already.</p>
       <p>Design responses: <em>"Show what we heard, so the failure is visibly ours rather than theirs. Make repair one tap. Tune for the learner's L1 accent when we know it. And measure recognition accuracy segmented by first language — because a global word-error rate will average away exactly the population being failed."</em></p>
       <p>A is manageable and even useful. C is a content problem. D is nearly invisible in conversational turn-taking, where people pause anyway.</p>`},
    {type:'open',
     q:'"Design an AI feature for a job site like Indeed." Give the full arc in under three minutes of speech.',
     hints:['One user, one job, one flow, errors, metric, kill condition.'],
     sol:`<p><strong>User & job.</strong> <em>"Mid-career applicants who apply to 40 roles and hear nothing. Their job is not 'find listings' — search already works — it is 'understand why I am being rejected and what to do about it.' Today that feedback loop is completely broken: rejection is silent, so applicants learn nothing and spray more applications, which makes the signal worse for everyone."</em></p>
       <p><strong>Why AI.</strong> <em>"Judgment-shaped: comparing a specific profile against a specific job's requirements and articulating the gap. Verification is cheap — the applicant instantly recognises whether 'you have no evidence of managing a budget' is true. And the error mode is recoverable: bad advice costs an hour, not a career, provided we never phrase it as a prediction about their worth."</em></p>
       <p><strong>Flow.</strong> <em>"Before applying, they see a fit breakdown: 'Strong on: Python, 6 years in fintech. Missing evidence: team leadership, which appears in the top third of this posting. Two lines in your Ridgeway project could show this — want help?' They accept, edit, apply. The advice is grounded in the posting text with the relevant line quoted, so it is checkable rather than oracular."</em></p>
       <p><strong>Errors.</strong> <em>"The dangerous failure is confident, wrong, and demoralising — telling someone they lack a qualification they have because it was phrased differently. So: quote the evidence, allow one-tap 'I do have this,' which both corrects the display and improves the parser, and hard-forbid any output that predicts outcomes or scores the person. We describe gaps against a posting; we never grade a human."</em></p>
       <p><strong>Metric & kill condition.</strong> <em>"Primary: interview rate per application, measured against a holdout — not applications sent, which is the vanity version and arguably the problem. Guardrail: applications per user should fall or hold, because better targeting means fewer, better applications. I would kill it if interview rate is flat after 8 weeks with adequate power: that would mean either our gap analysis is wrong, or employers are not actually rejecting on the things we surface — and the second would be a far more important finding than the feature."</em></p>
       <div class="tip"><b>The advanced move here</b> is naming the marketplace second-order effect: a feature that increases application volume helps the applicant and hurts the employer side. Two-sided thinking on a two-sided product is a reliable differentiator.</div>`},
    {type:'mcq',
     q:'Halfway through your design, the interviewer says: "What if the model is only 70% accurate at this?" What is the best response?',
     options:[
       'Explain how you would improve accuracy to 90%+.',
       'Redesign the interaction so 70% accuracy is still useful, and say what accuracy would make it unshippable.',
       'Argue that current models are better than 70% at this task.',
       'Propose human review of every output.'],
     correct:1,
     hints:['They are testing whether you design for the model you have.'],
     sol:`<p><strong>B.</strong> This is the signature AI PM question, and it is not about accuracy — it is about whether you treat model quality as a design input rather than a wish.</p>
       <p>The strong answer: <em>"At 70% I would not auto-apply anything. I would present output as a suggestion with the source visible, make rejection one tap and free, and pick a surface where the user is already reviewing — so a wrong suggestion costs a glance rather than a mistake. And I would say what breaks it: below roughly 50% the suggestions become noise, users stop reading them, and the feature is worse than absent because it adds a step. That is my kill threshold, and it is measurable as ignore rate rather than accuracy."</em></p>
       <p>A dodges the constraint. C argues with the premise, which is never the intent of the question. D is real for high-stakes flows but usually destroys the economics — and if you propose it, you owe them the cost per reviewed item.</p>`}
  ],
  mcase:{
    title:'Wander — an AI feature for a travel-booking product',
    prompt:`<p><strong>Wander</strong> is a travel-booking app: flights, hotels, and activities, 8M monthly users. Conversion from search to booking is 3.1%. The interviewer says: "Design an AI feature. You have ten minutes."</p>`,
    steps:[
      {kind:'User & job',
       q:'Pick your user and job, and defend the choice.',
       sol:`<p><em>"Three candidate segments: solo business travellers who want speed, families who want coordination, and what I would call deliberating leisure travellers — people planning a trip 6–10 weeks out who open the app fourteen times and book once, or never."</em></p>
         <p><em>"I would take the deliberators. Their job is not searching, it is <strong>deciding</strong> — they have 30 open tabs, they cannot compare a €120 hotel near the station against a €90 one twenty minutes out, and the cost of a wrong choice feels high because it is their one holiday this year. That indecision is also where our 3.1% conversion is leaking: they are not failing to find options, they are failing to resolve trade-offs."</em></p>
         <p><em>"I am choosing them because the pain is acute, the number of them is large, and AI is genuinely good at the specific thing they need — synthesising many partial comparisons into a defensible recommendation. If the data showed that most non-converters bounce in under 30 seconds, I would be wrong and I would pick the speed-seekers instead."</em></p>`},
      {kind:'The flow',
       q:'Walk the experience concretely.',
       sol:`<p><em>"Priya has been planning Lisbon for three weeks. She reopens Wander and, instead of a blank search box, sees: 'You've looked at 11 Lisbon hotels. Want me to narrow it down?'"</em></p>
         <p><em>"She taps yes and gets one question, not a form: 'What matters more — walking to the old town, or a pool?' She picks walking."</em></p>
         <p><em>"We return three options with reasoning grounded in her own behaviour: 'Casa Alfama — 6 minutes to the viewpoints you saved, €135, and it's the only one of your eleven with availability on both your flexible dates. Trade-off: no pool, and reviews mention street noise on weekends.' Two alternatives follow, each with one honest downside stated."</em></p>
         <p><em>"Three deliberate choices there. One question, not a preference quiz, because a form is what she has been avoiding for three weeks. Reasoning references her saved items, so it reads as memory rather than marketing. And every option names a downside — the fastest way to become trustworthy in a category where every other surface is trying to sell her something."</em></p>
         <div class="tip"><b>Volunteering the downside</b> is a genuine product insight in commerce contexts, and it also happens to be an honest use of a model that can read 400 reviews. Interviewers notice when a design uses AI for something only AI can do.</div>`},
      {kind:'Errors & trust',
       q:'What happens when it is wrong, and what do you refuse to build?',
       sol:`<p><strong>Failure cases and responses.</strong></p>
         <ul>
           <li><strong>Wrong trade-off inferred</strong> — she wanted the pool after all. Every recommendation carries "not quite right?" which re-asks with a different axis rather than dumping her back to search.</li>
           <li><strong>Stale facts</strong> — price or availability moved. Never state a price the booking flow will contradict: fetch live at render, and if it is stale, show it as a range with the timestamp.</li>
           <li><strong>Hallucinated attributes</strong> — the most damaging case, because "6 minutes from the viewpoint" is checkable and a wrong claim ends trust permanently. Distances, amenities, and policies come from structured data, not from generation. The model composes the sentence; the database supplies the facts.</li>
           <li><strong>No good answer</strong> — sometimes her constraints do not have a match. Say so: "Nothing in your budget is within 10 minutes' walk. Widening to 15 minutes gives three options — or Thursday arrival drops prices 20%." Abstention with a constructive alternative, not an empty state.</li>
         </ul>
         <p><strong>What I would refuse.</strong> <em>"I would not let commercial incentives enter the reasoning silently. If a property pays for placement, it does not get to appear as an AI recommendation with invented justification — that is the failure mode that has destroyed trust in every recommendation surface that has tried it. Sponsored inventory can exist, labelled and separate. If the business insists on blending, I would want that decision made explicitly at the leadership level, with the trust cost stated, rather than smuggled into a ranking weight."</em></p>
         <div class="note"><b>Naming a line you will not cross</b>, and where the decision belongs if someone overrules you, is a leadership signal as much as a product one.</div>`},
      {kind:'Metrics & rollout',
       q:'How do you measure it, and how do you roll it out?',
       sol:`<p><strong>Primary metric.</strong> <em>"Search-to-booking conversion for the deliberator cohort, measured against a holdout. Not engagement with the AI feature — a feature people enjoy using while booking no more than before has cost us money and taught us nothing."</em></p>
         <p><strong>Supporting.</strong> <em>"Time-from-first-search-to-booking, which is the deliberation cost we claim to remove; recommendation acceptance rate; and re-query rate after a recommendation, which tells me whether the single question was the right one."</em></p>
         <p><strong>Guardrails.</strong> <em>"Cancellation rate and post-stay rating on AI-recommended bookings, both held flat. If we lift conversion by 20% while cancellations rise, we have built a persuasion engine rather than a decision aid, and I would rather find that in week two than in a quarterly review."</em></p>
         <p><strong>Rollout.</strong> <em>"Two weeks internal; then 5% of the deliberator cohort for three weeks — long enough to see returning-session behaviour, since this segment's whole pattern is multi-session; then 50/50 with the holdout retained permanently so we can keep measuring long-run effects on rebooking. Kill condition: if conversion is flat and cancellations are up after the 5% phase, I stop rather than iterate, because that combination says the recommendations are persuasive and wrong — the worst possible outcome and not one that prompt tuning fixes."</em></p>
         <div class="tip"><b>A permanent holdout</b> is a detail worth mentioning. AI features are typically iterated continuously, and without a holdout you lose the ability to answer "is this still worth what it costs?" a year later.</div>`}
    ]
  }
});


/* =========================================================================
   MODULE 9 — Metrics for AI features
   ========================================================================= */
MODULES.push({
  id:'m09',tag:'Core question type',
  title:'Metrics & experimentation for AI features',
  sub:'Choosing a north star that cannot be gamed, the guardrails that stop you shipping harm, and running experiments on a system that changes under you.',
  concept:[
    {title:'The metric stack',card:`
      <div class="f">MODEL      accuracy, groundedness, judge score, refusal rate
FEATURE    acceptance rate, edit distance, retry rate, abandonment
PRODUCT    task completion, time-to-outcome, retention, conversion
BUSINESS   cost per task, revenue, support contacts, churn</div>
      <p>Interviewers ask "how would you measure it?" to see whether you climb this stack. Model metrics alone signal an engineer; business metrics alone signal someone who cannot diagnose. The complete answer names one metric per layer and explains how they connect.</p>
      <div class="tip"><b>The connective sentence:</b> "Groundedness protects acceptance, acceptance drives task completion, and task completion is what shows up as retention. If acceptance rises but completion does not, the feature is pleasant and useless."</div>`},
    {title:'Acceptance rate — useful and dangerous',card:`
      <p>Acceptance is the workhorse metric for assistive AI, and it is trivially gameable:</p>
      <ul>
        <li><strong>Make suggestions trivial</strong> and acceptance rises while value falls. Autocompleting the word "the" is accepted every time.</li>
        <li><strong>Suppress hard cases</strong> and acceptance rises while coverage collapses.</li>
        <li><strong>Count only shown suggestions</strong> and you hide the ones you never dared show.</li>
      </ul>
      <div class="f">Always pair: acceptance rate × coverage × value per accept

e.g. code completion:
  60% acceptance on 20% of keystrokes, 8 chars each
  beats 90% acceptance on 3% of keystrokes, 2 chars each</div>
      <div class="trap"><b>The classic bad quarter:</b> a team ships a "quality improvement" that raises acceptance from 55% to 70% by suppressing low-confidence suggestions — while total characters accepted per session falls 20%. The dashboard is green and the product got worse.</div>`},
    {title:'Guardrails you set before you start',card:`
      <ul>
        <li><strong>Harm rate</strong> — severe errors per 10k outputs, with a hard ceiling that stops a launch regardless of upside.</li>
        <li><strong>Cost per task</strong> — an economic ceiling so quality work does not quietly destroy margin.</li>
        <li><strong>Latency p95</strong> on the affected surface.</li>
        <li><strong>Downstream load</strong> — support contacts, reopens, refunds, escalations. AI features fail most often by moving work rather than removing it.</li>
        <li><strong>Fairness slices</strong> — performance by language, region, accent, tenure, device. A global average will always conceal a failing slice.</li>
      </ul>
      <div class="note"><b>Say the pre-registration explicitly:</b> "I would write the guardrails and their thresholds into the experiment doc before the test starts, so nobody negotiates them after seeing a good primary number." Interviewers recognise that discipline immediately.</div>`},
    {title:'Experiment design when the treatment moves',card:`
      <p>AI experiments break the usual assumption that the treatment is fixed. Three specific problems and their handling:</p>
      <ul>
        <li><strong>Prompt or model changed mid-test</strong> → the experiment restarted, whether you acknowledge it or not. Version the prompt and model as part of the treatment definition and freeze during the test.</li>
        <li><strong>Provider updated the model silently</strong> → run a canary eval daily against a fixed golden set, so drift is detected rather than misattributed.</li>
        <li><strong>Novelty and learning both present</strong> → compare week 2 to week 1 within the treatment arm. Falling means novelty; rising means learning; both can appear in the same feature on different metrics.</li>
      </ul>
      <div class="f">Minimum runtime for an AI feature test: 2 weeks
Prefer 3–4 if the behaviour has a weekly rhythm
Always retain a permanent holdout for long-run effects</div>`},
    {title:'Counterfactual and holdout thinking',card:`
      <p>Two questions worth raising unprompted, because they are where AI metrics most often lie:</p>
      <ul>
        <li><strong>Would this have happened anyway?</strong> An AI recommendation credited with a purchase the user was already making inflates every number. Holdouts, not attribution rules, settle this.</li>
        <li><strong>Did we move work or remove it?</strong> Deflected support tickets that return as reopens, drafts that take longer to edit than to write. Measure the whole path, end to end.</li>
      </ul>
      <div class="tip"><b>One-line challenge to use in any metrics interview:</b> "What does this number look like in the holdout?" It applies to nearly every claimed AI win, and it is the fastest way to show you think in counterfactuals.</div>`}
  ],
  drills:[
    {type:'mcq',
     q:'Your AI writing assistant shows 78% acceptance. Leadership wants to celebrate. What do you check first?',
     options:[
       'Whether users are satisfied in surveys.',
       'Coverage and value per accept — how often it offers help, and how much text each accept contributes.',
       'Whether acceptance is rising month over month.',
       'How acceptance compares to competitor benchmarks.'],
     correct:1,
     hints:['A high rate on a small, easy denominator means very little.'],
     sol:`<p><strong>B.</strong> 78% acceptance on 4% of eligible moments, contributing three words each, is a rounding error dressed as a win. The honest composite is acceptance × coverage × value per accept, and it is the only version that moves with actual user benefit.</p>
       <p>The line to deliver: <em>"78% tells me the suggestions we show are usually fine. It tells me nothing about how often we are useful. I would rather see 55% acceptance across triple the coverage — that is more accepted work, even though the headline rate looks worse, and I would set the team's target on total accepted output for exactly that reason."</em></p>`},
    {type:'num',
     q:'Feature A: 60% acceptance, offered on 25% of opportunities, 8 units of value per accept. Feature B: 85% acceptance, offered on 6% of opportunities, 10 units per accept. Which delivers more value, and by what ratio (A ÷ B)?',
     unit:'× ratio', a:2.35, tol:0.04, ph:'e.g. 1.8',
     hints:['Value = acceptance × coverage × value per accept.','A: 0.6 × 0.25 × 8. B: 0.85 × 0.06 × 10.'],
     sol:`<div class="f">A = 0.60 × 0.25 × 8  = 1.20 units per opportunity
B = 0.85 × 0.06 × 10 = 0.51 units per opportunity
A / B = 2.35×</div>
       <p><em>"A delivers 2.35× the value despite a much worse acceptance rate — because coverage is four times higher. This is why I would never let acceptance rate alone be the team's goal metric: the fastest way to raise it is to stop trying on hard cases, which is the opposite of the product we want."</em></p>
       <div class="note"><b>The generalisable point:</b> a rate metric always needs its denominator on the same dashboard. Interviewers use rate-versus-volume traps constantly.</div>`},
    {type:'open',
     q:'Define the metric set for an AI feature that auto-categorises expenses in a finance product.',
     hints:['One metric per layer, plus guardrails and a fairness slice.'],
     sol:`<p><strong>Model.</strong> <em>"Per-category accuracy on a held-out labelled set, reported by category rather than averaged — 'travel' and 'professional services' behave completely differently, and the average hides the categories that generate audit risk."</em></p>
       <p><strong>Feature.</strong> <em>"Correction rate: the share of auto-categorised expenses a user changes. This is free, continuous ground truth. I would also watch the time-to-first-correction — if users correct immediately, they are checking everything and we have saved nobody any time."</em></p>
       <p><strong>Product.</strong> <em>"Time to close the month, which is the job the finance team actually cares about, and the share of expense reports submitted without manual categorisation."</em></p>
       <p><strong>Business.</strong> <em>"Support contacts about miscategorisation, and inference cost per 1,000 expenses."</em></p>
       <p><strong>Guardrails.</strong> <em>"Tax-sensitive categories — anything affecting VAT reclaim or deductibility — get a separate, much tighter accuracy floor, because an error there is a compliance event rather than an inconvenience. And a hard rule: never auto-submit, only auto-fill. The user's signature stays on the claim."</em></p>
       <p><strong>Fairness slice.</strong> <em>"Accuracy by company size, country, and currency. A model trained mostly on US receipts will quietly underperform on VAT-inclusive European ones, and the affected customers will not file a bug — they will simply stop using the feature and mention it at renewal."</em></p>`},
    {type:'mcq',
     q:'Mid-experiment, your provider releases a model update that your endpoint picks up automatically. What do you do?',
     options:[
       'Continue — the update is probably an improvement.',
       'Treat the experiment as compromised, pin the model version, and restart with a clean window.',
       'Note it in the analysis and adjust the results.',
       'Switch both arms to the new model to keep them comparable.'],
     correct:1,
     hints:['If the treatment changed mid-flight, what does the result measure?'],
     sol:`<p><strong>B.</strong> Your treatment definition changed mid-flight, so pre- and post-update data are not the same experiment. Any result is a blend of two treatments in unknown proportion, and no post-hoc adjustment recovers it honestly.</p>
       <p>The real lesson to volunteer: <em>"The failure was upstream — we should have been pinned to a model version for the duration. I would make version pinning a standard part of experiment setup, and add a daily canary eval against a fixed golden set so we detect provider drift within a day rather than discovering it in an analysis."</em></p>
       <p>D at least restores internal comparability going forward, but it discards the earlier data and still needs a restart — so it is B with extra steps.</p>`},
    {type:'open',
     q:'Your AI summary feature increases session time by 20%. Is that good?',
     hints:['Ask what the feature was supposed to do.'],
     sol:`<p><em>"It depends entirely on the intended mechanism, and I would not accept it as a win without knowing which."</em></p>
       <ul>
         <li><strong>If the promise was 'read less, understand faster,'</strong> longer sessions are a failure signal. Users may be reading the summary and then the original because they do not trust it — measure whether summary views are followed by full-document opens.</li>
         <li><strong>If the promise was 'help people explore more content,'</strong> longer sessions could be exactly right — provided depth per session rose rather than the same work taking longer.</li>
       </ul>
       <p><em>"So I would decompose: sessions per user, time per task within a session, and task completion rate. If time per task fell while sessions per user rose, we made each task cheaper and people did more — a genuine win. If time per task rose, we added friction and dressed it as engagement."</em></p>
       <p><em>"And I would say the uncomfortable thing plainly: session time is the metric AI features most often accidentally optimise, because a slower, chattier product looks engaged. I would not put it in the primary slot for any assistive feature."</em></p>
       <div class="tip"><b>"Is that good?" questions are premise tests.</b> The scored behaviour is asking what the feature was supposed to change before judging the number.</div>`}
  ],
  mcase:{
    title:'Beacon — the AI meeting-notes launch review',
    prompt:`<p><strong>Beacon</strong> shipped AI meeting notes to 15% of its 600,000 business users four weeks ago. The team wants to go to 100%.</p>
      <p>Results: notes generated for 82% of eligible meetings. 34% of users opened the notes. Among openers, 71% rated them helpful. Session time up 12%. Support tickets up 6%. Inference cost $0.11 per meeting.</p>`,
    steps:[
      {kind:'Read the funnel',
       q:'What is the real adoption picture here?',
       sol:`<p><em>"The headline numbers are describing a funnel, and the funnel is leaking in the middle, so I would restate them multiplied out rather than listed."</em></p>
         <div class="f">Eligible meetings          100%
Notes generated             82%
Notes opened                34% of users
Rated helpful (of openers)  71%
→ Meetings where a human got value ≈ 82% × 34% ≈ 28%
   and of those, ~71% were useful ≈ 20%</div>
         <p><em>"So roughly one meeting in five produced value that someone acknowledged. That is not a failure for a four-week-old feature, but it is a very different story from '71% helpful,' which is the number that will end up in the launch email if nobody intervenes."</em></p>
         <p><em>"The 34% open rate is where the value is trapped, and it is also the most fixable: 71% of openers finding notes helpful says the notes are decent. The problem is that two-thirds of users never look at them, which is a distribution and timing problem, not a quality problem."</em></p>
         <div class="tip"><b>Always multiply a funnel out</b> when someone reports its stages separately. Separately-reported stages are how weak launches look strong.</div>`},
      {kind:'Diagnose the drop',
       q:'Why might only 34% open the notes? Give hypotheses and the test for each.',
       sol:`<ul>
           <li><strong>Discovery</strong> — notes live in a place users do not visit after a meeting. Test: instrument entry paths; check open rate for users who received a notification versus those who did not.</li>
           <li><strong>Timing</strong> — notes arrive 20 minutes later, after the user has moved on. Test: correlate open rate against delivery latency; if opens collapse beyond ten minutes, latency is the constraint.</li>
           <li><strong>No felt need</strong> — the attendee was in the meeting and does not need notes. Test: segment openers by attendance; my hypothesis is that non-attendees and late joiners open at far higher rates, which reframes the whole feature.</li>
           <li><strong>Trust</strong> — users assume AI notes are unreliable and do not bother. Test: open rate over time per user — if someone opens once and never again, that is a quality verdict; if they never open at all, it is discovery.</li>
         </ul>
         <p><em>"That last distinction is the one I would run first, because it splits the population cleanly: never-opened is a distribution problem, opened-once-then-stopped is a quality problem, and they have entirely different fixes. Reporting a single 34% conflates them."</em></p>`},
      {kind:'The guardrail',
       q:'Support tickets are up 6%. How do you handle that before a 100% rollout?',
       sol:`<p><em>"I would treat this as blocking until I know what the tickets say — 6% sounds small, but at 600,000 users it will not stay small, and the direction matters more than the magnitude."</em></p>
         <p><em>"First, categorise: are they 'where are my notes,' 'the notes are wrong,' or 'how do I turn this off'? Those are three different products. Confusion tickets mean a discovery and onboarding problem, which full rollout will multiply. Accuracy complaints mean quality is worse than the 71% suggests, because unhappy users rarely rate. Opt-out requests mean a privacy reaction, and that one is the most dangerous — meeting recording touches consent, and in some jurisdictions it touches law."</em></p>
         <div class="f">Rollout at 15%:   +6% tickets
Naive at 100%:    +40% tickets if linear
Support headcount today absorbs perhaps +10%</div>
         <p><em>"So even in the benign case this is a capacity problem, and it is exactly the pattern from earlier in this course: an AI feature that moves work rather than removing it. I would want the ticket mix before rollout, a self-serve answer for the top category, and an explicit support-capacity sign-off — not because the feature is bad, but because launching into a queue we cannot staff turns a good feature into a bad quarter."</em></p>`},
      {kind:'Recommend',
       q:'Go to 100%, or not? Give the recommendation with conditions.',
       sol:`<p><strong>Answer first.</strong> <em>"Not yet — go to 40% for three weeks with three specific changes, and set the conditions for full rollout now so the decision is not relitigated later."</em></p>
         <p><strong>Why not now.</strong> <em>"Only one meeting in five is producing acknowledged value, and the bottleneck is a 34% open rate we do not yet understand. Rolling to 100% multiplies a distribution problem and a support-ticket trend without learning anything we could not learn at 40%."</em></p>
         <p><strong>The three changes.</strong> <em>"One: push notes into the surfaces people already use after a meeting — the chat thread and the calendar entry — rather than a destination they must remember. Two: cut delivery latency under five minutes, or explicitly reposition the feature as an asynchronous artefact for non-attendees, which is a legitimate and possibly better product. Three: instrument never-opened versus opened-once-then-stopped, because those two populations need opposite fixes and today we cannot tell them apart."</em></p>
         <p><strong>Conditions for 100%.</strong> <em>"Open rate above 55%, support ticket rate per user flat or falling, and no unresolved consent complaints. On cost: $0.11 per meeting is comfortable — at scale that is roughly $200k a year against a business this size, so cost is not the constraint and I would not spend design effort there."</em></p>
         <p><strong>What would change my mind.</strong> <em>"If the segmentation shows non-attendees open at 70%+, then the feature is not a note-taker for participants at all — it is a catch-up tool for people who missed the meeting. That would be a better product with a smaller addressable moment, and I would rather ship that honestly than keep optimising an open rate for users who never needed notes in the first place."</em></p>
         <div class="note"><b>The closing move</b> — naming a finding that would redefine the feature rather than merely tune it — is what distinguishes a senior metrics answer from a competent one.</div>`}
    ]
  }
});

/* =========================================================================
   MODULE 10 — Diagnosing quality regressions
   ========================================================================= */
MODULES.push({
  id:'m10',tag:'Core question type',
  title:'Diagnosing an AI quality regression',
  sub:'"Quality dropped 8% last week." The structured hunt: what changed, where it changed, and how to avoid guessing.',
  concept:[
    {title:'The five things that can change',card:`
      <p>AI systems have more moving parts than deterministic ones, and any of them can regress without a deploy. Work the list in this order:</p>
      <ol>
        <li><strong>The model</strong> — provider update, version change, a config or temperature change nobody logged.</li>
        <li><strong>The prompt</strong> — someone edited it, or a template variable is rendering empty.</li>
        <li><strong>The retrieval layer</strong> — index staleness, a failed ingest job, changed chunking, a filter regression.</li>
        <li><strong>The input distribution</strong> — users, traffic mix, or a new customer segment changed. The system is fine; the questions are different.</li>
        <li><strong>The measurement</strong> — the eval set, the judge, the logging, or the metric definition changed. Depressingly common.</li>
      </ol>
      <div class="tip"><b>Ask the cheapest question first:</b> "Did the metric change, or did the product change?" A surprising share of regressions are dashboards, not systems — and it costs five minutes to rule out.</div>`},
    {title:'Locate before you explain',card:`
      <p>Resist causal stories until you know where the drop lives. Cut the data four ways:</p>
      <div class="f">TIME     sharp step (a change) vs. gradual slope (drift or mix)
SEGMENT  all users, or one tenant / language / plan / surface?
QUERY    which intents or categories moved?
STAGE    retrieval quality vs. generation quality</div>
      <p>A sharp step points to a deployment, a config change, or a provider update, and you should be able to name the timestamp. A gradual slope points to data drift, index staleness, or a shifting user mix.</p>
      <div class="trap"><b>The most common analytical error</b> is explaining an aggregate movement that is really composition. If a new large customer with harder queries joined last week, every per-query metric can be unchanged while the average falls. Always check whether the mix moved before hunting for a cause.</div>`},
    {title:'Simpson\'s paradox, the AI version',card:`
      <p>Overall quality falls while every segment improves. It happens whenever segment mix shifts toward harder traffic:</p>
      <div class="f">          Week 1              Week 2
Easy      90% × 8,000 = 7,200  92% × 4,000 = 3,680
Hard      70% × 2,000 = 1,400  72% × 6,000 = 4,320
Overall   86%                  80%

Both segments improved. Overall fell 6 points.</div>
      <p>Spotting this in an interview is a strong signal. The answer is not "quality dropped" but "our traffic got harder, and we improved on both slices — but the harder mix may be a product problem in itself."</p>`},
    {title:'The regression checklist',card:`
      <ol>
