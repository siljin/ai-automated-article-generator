  .qcount{font-size:12px;color:var(--muted);margin-top:4px;}

<script>
function reveal(id){document.getElementById(id).classList.remove('hidden');}

function unlockReveal(inputId, answerId, btnId){
  const val = document.getElementById(inputId).value.trim();
  if(val.length < 5){
    alert("Jot down at least a quick attempt first — that's the whole point of the drill.");
    return;
  }
  reveal(answerId);
  document.getElementById(btnId).disabled = true;
}

// ---- Clarifying question matching ----
// CASE: replace with 5 canonical questions. Each "tags" array should include several
// realistic phrasings/synonyms so a candidate's own wording has a good chance of matching
// via the keyword fallback below — but the primary matcher is semantic (see semanticMatch).
const CLARIFYING_QUESTIONS = [
  // { tags: ["...", "..."], q: "Canonical question text", a: "Answer text" },
];
const askedIdx = new Set();
let questionCount = 0;
let cqBusy = false;

// Matching is hybrid: try Claude-based semantic matching first (understands paraphrasing/
// intent, not just shared words), and fall back to a tuned keyword matcher if the Cowork
// bridge isn't available (e.g. this file opened directly outside the artifact) or errors out.

const STOPWORDS = new Set(['a','an','the','is','are','was','were','do','does','did','how','what',
  'why','who','which','can','could','would','will','of','to','for','in','on','at','and','or',
  'this','that','it','its','we','you','your','im','i','me','my','have','has','had','be','been',
  'being','with','about','so','if','as','does','doesnt']);

function stem(w){
  if(w.length > 5 && w.endsWith('ing')) return w.slice(0,-3);
  if(w.length > 4 && w.endsWith('ed')) return w.slice(0,-2);
  if(w.length > 4 && w.endsWith('es')) return w.slice(0,-2);
  if(w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0,-1);
  return w;
}

function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }

function tokenize(s){
  return normalize(s).split(' ').filter(w => w && !STOPWORDS.has(w)).map(stem);
}

function scoreMatch(input, tags){
  const inputWords = new Set(tokenize(input));
  let best = 0;
  tags.forEach(tag => {
    const tagWords = tokenize(tag);
    if(tagWords.length === 0) return;
    const hits = tagWords.filter(w => inputWords.has(w)).length;
    const ratio = hits / tagWords.length;
    best = Math.max(best, ratio);
  });
  return best;
}

function keywordMatch(text){
  let bestIdx = -1, bestScore = 0;
  CLARIFYING_QUESTIONS.forEach((item, idx) => {
    const s = scoreMatch(text, item.tags);
    if(s > bestScore){ bestScore = s; bestIdx = idx; }
  });
  return bestScore >= 0.4 ? bestIdx : -1;
}

async function semanticMatch(text){
  if(!(window.cowork && typeof window.cowork.askClaude === 'function')) return null; // bridge unavailable
  const list = CLARIFYING_QUESTIONS.map((item, idx) => (idx+1) + '. ' + item.q).join('\n');
  const prompt = 'You are grading a case-interview candidate\'s clarifying question against a fixed list of ' +
    'canonical questions the interviewer is prepared to answer. Reply with ONLY the number of the canonical ' +
    'question that asks for essentially the same underlying information as the candidate\'s question, even if ' +
    'worded very differently. If none of them are asking for the same thing, reply with exactly 0. No other text.';
  try {
    const res = await window.cowork.askClaude(prompt, [
      'Candidate question: ' + text,
      'Canonical questions:\n' + list
    ]);
    const raw = (typeof res === 'string') ? res : (res && res.text) ? res.text : JSON.stringify(res || '');
    const match = raw.match(/-?\d+/);
    if(!match) return null;
    const n = parseInt(match[0], 10);
    if(n >= 1 && n <= CLARIFYING_QUESTIONS.length) return n - 1;
    return -1; // model explicitly said no match
  } catch(e){
    return null; // treat as unavailable, fall back to keyword matcher
  }
}

async function askClarify(){
  if(cqBusy) return;
  const input = document.getElementById('cq-input');
  const text = input.value.trim();
  if(!text) return;
  cqBusy = true;
  const btn = document.getElementById('cq-ask-btn');
  if(btn) btn.disabled = true;

  questionCount++;
  document.getElementById('qcount').textContent = questionCount + ' question' + (questionCount===1?'':'s') + ' asked' + (questionCount>=4 ? ' — most real interviews expect only 2-3, consider moving to structuring' : '');

  const row = document.createElement('div');
  row.className = 'qa-row';
  row.style.background = 'var(--warn-bg)';
  row.style.color = 'var(--warn-text)';
  row.innerHTML = '<strong>You asked:</strong> ' + text + '<br><em>Checking...</em>';
  document.getElementById('cq-transcript').prepend(row);
  input.value = '';

  let matchIdx = await semanticMatch(text);
  if(matchIdx === null) matchIdx = keywordMatch(text);

  if(matchIdx >= 0){
    askedIdx.add(matchIdx);
    row.className = 'qa-row qa-hit';
    row.innerHTML = '<strong>You asked:</strong> ' + text + '<br><strong>Interviewer:</strong> ' + CLARIFYING_QUESTIONS[matchIdx].a;
  } else {
    row.className = 'qa-row qa-miss';
    row.innerHTML = '<strong>You asked:</strong> ' + text + '<br><strong>Interviewer:</strong> "No information available for that — let\'s keep it focused on the business problem."';
  }
  if(btn) btn.disabled = false;
  cqBusy = false;
}

function revealGaps(){
  const missed = CLARIFYING_QUESTIONS.filter((_, idx) => !askedIdx.has(idx));
  const box = document.getElementById('cq-gaps');
  box.classList.remove('hidden');
  if(missed.length === 0){
    box.innerHTML = '<p><strong>Nice — you covered all the questions a strong candidate would typically ask here.</strong></p>';
  } else {
    box.innerHTML = '<p><strong>Questions you didn\'t ask that would have been worth it:</strong></p><ul>' +
      missed.map(m => '<li>' + m.q + '<br><span style="color:var(--muted)">' + m.a + '</span></li>').join('') + '</ul>';
  }
}

</script>
