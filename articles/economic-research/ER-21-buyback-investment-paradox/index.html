function typeLabel(t) {
  const map = { A: "Type A — Chart Reading & Implication", B: "Type B — Trend Reasoning", C: "Type C — Consulting Case", D: "Type D — Quantitative Estimation", E: "Type E — Implication Bridge" };
  return map[t] || t;
}

function NumericQuestion({ q, state, onSubmit }) {
  const [value, setValue] = useState("");
  const [path, setPath] = useState("");
  const submitted = state && state.submitted;
  const requiresPath = !q.scaffolded;

  function logDistanceScore(guess, target) {
    if (guess <= 0 || target <= 0) return 0;
    const ratio = guess / target;
    const within2x = ratio >= 0.5 && ratio <= 2;
    return within2x ? 1 : 0;
  }
  function tightScore(guess, target, pct) {
    const diff = Math.abs(guess - target) / target;
    return diff <= pct / 100 ? 1 : 0;
  }

  function submit() {
    const num = parseFloat(value);
    if (isNaN(num)) return;
    const correct =
      q.toleranceType === "tight"
        ? tightScore(num, q.target, q.tolerancePct) === 1
        : logDistanceScore(num, q.target) === 1;
    onSubmit(q.id, num, correct, path);
  }

  return (
    <div className="question-card numeric-card">
      <div className="q-type-tag">{typeLabel(q.type)}</div>
      <p className="q-prompt">{q.prompt}</p>
      {requiresPath && !submitted && (
        <div className="path-input">
          <label>Name your decomposition path before entering a number:</label>
          <input
            type="text"
            placeholder="e.g., rate × time, or population × share × price..."
            value={path}
            onChange={(e) => setPath(e.target.value)}
          />
        </div>
      )}
      {!submitted && (
        <div className="numeric-input-row">
          <input
            type="number"
            placeholder={"Your estimate (" + q.unit + ")"}
            value={value}
            onChange={(e) => setValue(e.target.value)}
          />
          <input
            type="range"
            min={q.lowBound}
            max={q.highBound}
            value={value || q.lowBound}
            onChange={(e) => setValue(e.target.value)}
          />
          <button
            className="btn-primary"
            disabled={value === "" || (requiresPath && path.trim().length < 3)}
            onClick={submit}
          >
            Submit estimate
          </button>
        </div>
      )}
      {submitted && (
        <div className={"explanation-block " + (state.isCorrect ? "explanation-correct" : "explanation-wrong")}>
          <div className="numeric-compare">
            <div className="axis-track">
              <div className="axis-marker your-marker" style={{ left: pct(state.numericValue, q.lowBound, q.highBound) + "%" }}>
                <span>You: {state.numericValue}</span>
              </div>
              <div className="axis-marker actual-marker" style={{ left: pct(q.target, q.lowBound, q.highBound) + "%" }}>
                <span>Actual: {q.target}</span>
              </div>
            </div>
          </div>
          <div className="calibration-note">
            {state.isCorrect
              ? "Correct (within declared tolerance) — this reasoning generalizes."
              : "Incorrect (outside declared tolerance) — this is " +
                (q.toleranceType === "tight" ? "an arithmetic slip, not a reasoning error" : "base-rate / decomposition drift, common in Fermi estimation") +
                "."}
          </div>
          <p className="how-to-estimate"><strong>How to estimate this:</strong> {q.decomposition}</p>
          <p>{q.whyActualDiffers}</p>
        </div>
      )}
    </div>
  );
}

function pct(val, lo, hi) {
  const v = Math.max(lo, Math.min(hi, val));
  return ((v - lo) / (hi - lo)) * 100;
}

        The most recent decade shows the pattern accelerating rather than settling down. S&amp;P 500 buybacks ran
        $572.2 billion in 2015, dipped to $519.4 billion in 2017, then jumped 55% to $806.4 billion in 2018 — the
        year after Congress cut the corporate tax rate from 35% to 21% <SourceTag id="spdji" />. They fell during
        the pandemic, to $519.8 billion in 2020, before climbing to a then-record $922.7 billion in 2022, dipping
        slightly to $795.2 billion in 2023 — the first year a new 1% federal excise tax applied — and setting the
        current record of $942.5 billion in 2024 <SourceTag id="spq42024" />.
      </p>
      <p>
        The tailwinds behind the boom are structural: a permanently lower corporate tax rate, unusually high cash
        balances concentrated in a handful of technology firms, and a legal environment that makes buybacks the most
        flexible payout tool a board has, since pausing a buyback signals nothing like the distress a dividend cut
        signals. The headwinds are newer and thinner: the 1% excise tax, a proposed but unpassed 4% rate, and — as
        later sections show — a capital-spending supercycle that increasingly competes with buybacks for the same
        dollar of cash flow.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "bg1")} state={mcState["bg1"]} onSubmit={onMcSubmit} />
      <h3>Which tool companies use to pay out, and why it matters</h3>
      <p>
        The deeper structural change is not that companies pay out more; it is which tool they use, and that choice
        matters because the two tools behave differently under stress.
      </p>
      <ChartCard
        chartKey="chart2"
        title="Chart 2. Payout-ratio bridge: pre-2000 average to 2000–2017 average, by component"
        tier="FACT"
        note={<>Source: Kahle &amp; Stulz, NBER Working Paper 26958 <SourceTag id="kahlestulz" />. Bars decompose the change in total payout ratio into its dividend and buyback components.</>}
        ChartComponent={Chart2Waterfall}
        interpState={chartInterp.chart2}
        onInterpSubmit={onInterpSubmit}
      />
      <p>
        Dividends are sticky: cutting one is read by the market as a distress signal, so boards resist it even in a
        downturn, which is exactly why dividends held flat at roughly 14% of operating income across both eras.
        Buybacks carry no such penalty — a company can slow or halt its repurchase program in a single quarter with
        no comparable stigma, which is part of why the buyback total fell 28.7% from 2019's $728.7 billion during
        the 2020 pandemic even as the dividend total barely moved <SourceTag id="spdji" />. That asymmetry, more
        than any preference for shareholders over reinvestment, is the structural gap this article investigates:
        buybacks became corporate America's shock absorber precisely because the law made them cheap, reversible,
        and stigma-free in a way dividends and long-lived capital projects are not.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "bg_c")} state={mcState["bg_c"]} onSubmit={onMcSubmit} />
      <Glossary items={GLOSSARIES.background} />
    </SectionWrapper>
  );
}

function RQ1Section({ chartInterp, onInterpSubmit, mcState, onMcSubmit, numState, onNumSubmit }) {
  return (
    <SectionWrapper id="sec-rq1" title="Research Question One: Do Buybacks Crowd Out Investment?">
      <p>
        The cleanest test of whether buybacks crowd out investment is also the most disputed number in this
        literature: does spending more on repurchases predict spending less on capital projects, once you control
        for everything a careful economist would want to control for?
      </p>
      <p>
        The two most-cited answers disagree not because either side did sloppy work, but because they asked the
        question over different-sized slices of the same economy. Kahle and Stulz modeled payout behavior for the
        entire population of nonfinancial listed firms from 1971 to 1999, then used that model to predict 2000–2017
        outcomes; the model came impressively close — it predicted $784 billion in payouts for 2017 against an
        actual $734 billion — and firms in the top 10% of the payout distribution had lower capital spending
        relative to assets than other firms in both eras, meaning their capex was already comparatively low before
        they became big payers, not caused to fall by paying out cash <SourceTag id="kahlestulz" />.
      </p>
      <p>
        Gutiérrez and Philippon looked at roughly the same period through a different lens: industry-level
        competition. They found that in sectors where competition had declined — measured by rising concentration
        and weaker corporate governance — rising buybacks tracked falling investment more tightly than in
        competitive sectors <SourceTag id="gutierrezphilippon" />. Their interpretation: when a dominant firm faces
        little competitive pressure to reinvest, extra cash flow is more likely to go out the door as a buyback than
        into a new plant, because no rival is forcing the firm's hand.
      </p>
      <p>
        The two findings are not really a contradiction so much as two effects of the same underlying cause hiding
        inside two different aggregation choices. Kahle and Stulz's full-sample result says buybacks, averaged
        across the whole economy, do not predict lower investment. Gutiérrez and Philippon's result says that within
        the minority of firms in concentrated industries, the two do move together. A full-sample average can easily
        hide a strong effect in one slice of firms if that slice is a small share of the total sample — which is
        exactly the kind of aggregation trap the next comparison runs into from the other direction.
      </p>
      <ChartCard
        chartKey="chart3"
        title="Chart 3. Economy-wide investment vs. S&P 500 buybacks, 2021 → 2024"
        tier="FACT"
        note={<>Sources: Bureau of Economic Analysis via FRED, series PNFIA <SourceTag id="fredpnfia" />; S&P Dow Jones Indices <SourceTag id="spdji" />. Note: the two series cover different populations (the entire U.S. private economy vs. 500 large public companies) — see prose caveat below.</>}
        ChartComponent={Chart3Dumbbell}
        interpState={chartInterp.chart3}
        onInterpSubmit={onInterpSubmit}
      />
      <p>
        Between 2021 and 2024, real, economy-wide private nonresidential fixed investment rose from $3.087 trillion
        to $4.023 trillion, a 30.3% increase <SourceTag id="fredpnfia" />, while S&amp;P 500 buybacks rose from
        $881.7 billion to $942.5 billion, just 6.9% <SourceTag id="spdji" />. Read carelessly, this looks like proof
        capex is winning and buybacks are not crowding anything out. Read carefully, it is not a fair fight: the
        investment figure covers the entire U.S. private economy, every firm public and private in every industry,
        while the buyback figure covers only 500 large, publicly traded companies. A national total and a 500-company
        subset do not answer the same question, and comparing their growth rates directly, without adjusting for
        what each number actually contains, is the kind of denominator mismatch that produces a confident-sounding
        but misleading claim.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq1_causal")} state={mcState["rq1_causal"]} onSubmit={onMcSubmit} />
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq1_trap")} state={mcState["rq1_trap"]} onSubmit={onMcSubmit} />
      <NumericQuestion q={NUMERIC_QUESTIONS.find((q) => q.id === "d1")} state={numState["d1"]} onSubmit={onNumSubmit} />
      <p>
        The honest reading of research question one is that "buybacks crowd out investment" is true for a specific,
        identifiable slice of the economy — concentrated industries with weak competitive pressure — and not
        demonstrated for the average firm. Anyone citing either finding as a universal law is overreaching, and
        anyone comparing a national investment total to a large-cap buyback total, as this section just did to make
        a point, owes the reader the same disclosure about mismatched populations that the numbers themselves
        demand.
      </p>
      <Glossary items={GLOSSARIES.rq1} />
    </SectionWrapper>
  );
}

function RQ2Section({ chartInterp, onInterpSubmit, mcState, onMcSubmit, numState, onNumSubmit }) {
  return (
    <SectionWrapper id="sec-rq2" title="Research Question Two: Is AI Capex a Break From the Buyback Playbook?">
      <p>
        If the 1982 rule change explains why buybacks became possible, and the following four decades explain why
        they became routine, the open question is whether the 2020s AI buildout represents a genuine reversal of the
        buyback-first playbook, or whether companies have simply found a way to keep doing both by borrowing.
      </p>
      <p>
        The scale of the AI capital-spending shift among just three companies makes the tension concrete.
      </p>
      <ChartCard
        chartKey="chart4"
        title="Chart 4. Big Tech capex, 2025 actual → 2026 guided (midpoint of guided range)"
        tier="FACT"
        note={<>Sources: company FY2025 results and 2026 guidance, reported via CMC Markets <SourceTag id="cmcmagnificent7" /> and TechCrunch <SourceTag id="techcrunchmeta" />. 2026 values use the midpoint of each company's stated guidance range.</>}
        ChartComponent={Chart4Slope}
        interpState={chartInterp.chart4}
        onInterpSubmit={onInterpSubmit}
      />
      <p>
        Amazon spent about $131 billion on capital expenditures in 2025 and guided to roughly $200 billion in 2026;
        Alphabet's capex went from $91.4 billion to a guided $175–185 billion; Meta's went from about $72.2 billion
        to a guided $115–135 billion <SourceTag id="cmcmagnificent7" /> <SourceTag id="techcrunchmeta" />. Combined,
        that is roughly $295 billion actually spent in 2025 rising to roughly $505 billion guided for 2026 across
        just these three companies — a 71% jump in a single year, on top of spending levels that were already
        historic.
      </p>
      <p>
        What makes this period different from the buyback-heavy 2010s is how it is being financed. Five major
        technology firms issued a combined $121 billion in U.S. corporate bonds in 2025, itself far above the
        roughly $28 billion a year these same firms averaged from 2020 through 2024; by mid-July 2026, six firms had
        already issued about $244 billion <SourceTag id="cryptobriefing" />. Companies that generate enormous free
        cash flow, and have historically funded buybacks out of that cash flow, are now also borrowing at scale to
        fund data centers — which means the AI buildout is not simply cash that would have gone to shareholders
        being redirected to servers instead. It is new money, raised specifically because even record operating
        cash flow is not enough to cover both programs at once.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq2_a")} state={mcState["rq2_a"]} onSubmit={onMcSubmit} />
      <p>
        That financing choice carries a risk the Kahle-Stulz free-cash-flow story never had to price in. Their
        defense of buybacks rests on the idea that payouts only remove cash a firm could not profitably reinvest; it
        says nothing about what happens when a firm reinvests anyway, using borrowed money, on a bet about AI demand
        that has not yet been validated by matching revenue. If that bet disappoints, firms will be left holding
        both the new debt and a buyback program built on the assumption of durable free cash flow — a combination
        the pre-AI-era data never had to explain.
      </p>
      <NumericQuestion q={NUMERIC_QUESTIONS.find((q) => q.id === "d2")} state={numState["d2"]} onSubmit={onNumSubmit} />
      <p>
        The Inflation Reduction Act's 1% excise tax on buybacks, in effect since January 2023, was partly designed
        to blunt exactly this kind of behavior by making repurchases marginally more expensive relative to
        investment. The Joint Committee on Taxation estimated it would raise $74 billion over the 2022–2031 period,
        including $7.9 billion in fiscal year 2024 alone <SourceTag id="crs47397" />. At well under 1% of S&amp;P
        500 operating earnings in the tax's first two years <SourceTag id="spdji" />, the tax has been real but
        modest — nowhere near large enough, on the numbers available, to have been the reason buybacks dipped in
        2023 and then set a new record the very next year.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq2_case")} state={mcState["rq2_case"]} onSubmit={onMcSubmit} />
      <p>
        The AI capital-spending boom is not evidence that companies have abandoned buybacks in favor of investment;
        both are running at record levels simultaneously, financed increasingly by different sources — cash flow for
        buybacks, debt for AI infrastructure. Whether that is a stable arrangement or a temporary one financed by
        investor patience depends on whether AI revenue eventually catches up to the spending, a question this
        article cannot answer but flags as the load-bearing assumption behind the entire current setup.
      </p>
      <Glossary items={GLOSSARIES.rq2} />
    </SectionWrapper>
  );
}

function RQ3Section({ chartInterp, onInterpSubmit, mcState, onMcSubmit }) {
  return (
    <SectionWrapper id="sec-rq3" title="Research Question Three: What Does Japan's Reversal Reveal?">
      <p>
        If buybacks are fundamentally about returning cash a company cannot use productively, the cleanest test case
        is a country whose companies did the opposite for decades: hoarded cash instead of returning or investing
        it. Japan is that test case, and its reversal says something the U.S. debate, focused entirely on whether
        buybacks are too high, tends to miss.
      </p>
      <p>
        For decades, Japanese firms were criticized for the reverse problem America worries about: sitting on
        enormous cash piles and cross-shareholdings instead of either investing or returning it. In March 2023, the
        Tokyo Stock Exchange formally asked listed companies to focus on improving capital efficiency, and Japan's
        Financial Services Agency separately pressed insurers to unwind cross-shareholdings it considered a source
        of poor governance <SourceTag id="japantimes" />. The response was dramatic: announced buybacks nearly
        doubled from ¥9.57 trillion in 2023 to ¥18.04 trillion in 2024, then rose again to ¥22.32 trillion for fiscal
        2025, while the average listed company's payout ratio rose from 57.1% to 67.4% in a single year{" "}
        <SourceTag id="japantimes" /> <SourceTag id="nippon" />. Toyota alone announced a ¥1.2 trillion buyback tied
        directly to unwinding cross-shareholdings the regulator had flagged <SourceTag id="japantimes" />.
      </p>
      <ChartCard
        chartKey="chart5"
        title="Chart 5. Japan vs. U.S. buybacks, indexed to 100 at 2023 (small multiples)"
        tier="FACT"
        note={<>Sources: Ichiyoshi Securities data via The Japan Times <SourceTag id="japantimes" /> and Nippon.com <SourceTag id="nippon" />; S&P Dow Jones Indices <SourceTag id="spdji" />. 2025 U.S. value uses the trailing-twelve-month total through September 2025 as a proxy for the full year.</>}
        ChartComponent={Chart5SmallMultiples}
        interpState={chartInterp.chart5}
        onInterpSubmit={onInterpSubmit}
      />
      <p>
        Indexed to 100 at their respective 2023 starting points, Japan's buyback line more than doubles by 2025 (to
        about 233) while the U.S. line rises only to about 128 over the same two years. The mechanism is not that
        Japanese companies suddenly became more short-termist than American ones; it is that they started from an
        artificially suppressed base, built up over decades of cash-hoarding and defensive cross-shareholding, so
        the same policy nudge produced a much steeper percentage change off a much lower starting point. A
        20-percentage-point rise in a payout ratio means something different in a market that started at 30% than in
        one that started at 90%.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq3_mech")} state={mcState["rq3_mech"]} onSubmit={onMcSubmit} />
      <p>
        This does not mean Japan's buybacks are healthier or less controversial than America's; a company can still
        misuse a repurchase program to flatter earnings per share regardless of where its starting payout ratio sat.
        What it does show is that "buybacks are too high" is not a fact about buybacks in the abstract — it is a
        claim relative to some benchmark of what a company's cash should be doing instead, and that benchmark looks
        completely different in a market coming out of cash-hoarding than in one already at a mature, high-payout
        equilibrium.
      </p>
      <p>
        Seen next to Japan's experience, the United States' 1% excise tax reads less like a lever aimed at an
        obviously broken system and more like a modest nudge on a market that, unlike Japan's, was never accused of
        hoarding too much cash in the first place. President Biden and several senators have proposed raising the
        rate to 4%, scored using the same JCT framework, but even the current rate's own revenue math — $74 billion
        over a full decade against nearly $10 trillion in cumulative 2000–2017 buybacks alone — is small enough that
        its main function may be signaling disapproval rather than materially reallocating capital{" "}
        <SourceTag id="crs47397" />.
      </p>
      <MultipleChoice q={MC_QUESTIONS.find((q) => q.id === "rq3_case")} state={mcState["rq3_case"]} onSubmit={onMcSubmit} />
      <p>
        Japan's experience suggests the more useful question is not "are buybacks too high," which has no universal
        answer, but "relative to what benchmark, in this specific market, right now" — a distinction the U.S. policy
        debate, fixated on a single 1% federal rate, has mostly skipped over.
      </p>
      <Glossary items={GLOSSARIES.rq3} />
    </SectionWrapper>
  );
}

const AUTHORED_INSIGHTS = [

function LearningSummary({ mcState, numState, govInsight, setGovInsight, insightRevealed, setInsightRevealed, applyA, setApplyA, applyB, setApplyB, applyEval, onEvaluate }) {
  const allMc = [...MC_QUESTIONS, CONCLUSION_QUESTION, ...WARMUP_QUESTIONS];

  allMc.forEach((q) => {

    byType[q.type].total += 1;
    if (st.isCorrect) byType[q.type].correct += 1;
  });
  const numErrors = Object.values(numState)
    .filter((s) => s && s.submitted)
    .map((s) => s.signedErrorPct);
  const avgBias = numErrors.length ? numErrors.reduce((a, b) => a + b, 0) / numErrors.length : null;

  const missed = allMc.filter((q) => mcState[q.id] && mcState[q.id].submitted && !mcState[q.id].isCorrect);

  return (

          {avgBias.toFixed(1)}%, meaning you tended to {avgBias > 0 ? "over-estimate" : "under-estimate"} magnitudes
          on average.
        </p>
      )}

      <h3>Your governing insight</h3>
      <p>

        non-obvious insight you would defend to a skeptical executive.
      </p>
      {!insightRevealed && (
        <div className="insight-input">
          <textarea

            ))}

      <h3>Apply It</h3>

        while our capex ratio has stayed flat at 4% of revenue, even as competing nonprofit systems in our region
        increased their capex ratio to 7%." Using the same reasoning you practiced above, write your response with
        four labeled parts: (1) a one-sentence so-what thesis, (2) the single load-bearing assumption that must hold
        for your thesis, (3) the evidence that would most undermine it, and (4) a one-line pre-mortem: "If this fails
        in 12 months, the most likely reason is ___."
      </p>
      <textarea
        className="apply-textarea"

        onChange={(e) => setApplyA(e.target.value)}
      />
      <p>

      </p>
      <textarea

function ConclusionSection({ mcState, onMcSubmit }) {
  return (
    <SectionWrapper id="sec-conclusion" title="Conclusion">
      <p>
        Buybacks, capital spending, and R&amp;D are all setting records at the same time because, in aggregate, they
        are not drawing from a single fixed pool of money the way the simplest crowding-out story assumes — but that
        comfortable aggregate picture conceals a real, measured crowding-out effect concentrated in the specific,
        growing share of the economy where competition has weakened, and it says nothing about what happens if
        AI-era debt-financed capex fails to pay for itself. The most likely trajectory under partial success is that
        buybacks keep setting records precisely because the AI boom, for now, is financed by borrowing rather than
        by cash flow diverted from repurchases, leaving both programs intact until either AI revenue arrives on
        schedule or credit markets start pricing hyperscaler bonds like the concentration risk they represent.
      </p>
      <p>
        For long-term shareholders, the practical lesson is not to treat a big buyback number as automatically good
        (returning wasted cash) or automatically bad (starving the future); the useful question is where a specific
        company sits on the competition spectrum Gutiérrez and Philippon identified, since that, more than the
        payout total itself, predicts whether the company's investment is actually being squeezed. For bond
        investors and credit analysts, the more urgent number is not this year's buyback record but the pace of
        hyperscaler debt issuance, which has gone from a rounding error to nearly 12% of the entire U.S.
        investment-grade market in about eighteen months <SourceTag id="cryptobriefing" /> — a concentration that
        did not exist when most current credit models were built.
      </p>
      <p>
        For policymakers, Japan's experience is a more instructive comparison than domestic complaints about
        buybacks being "too high," because it shows that the right level of corporate payout is a function of a
        specific market's starting conditions, not a universal number a 1% or 4% excise tax can target well. And for
        corporate boards, the debt-financed AI buildout quietly changes what a "conservative" balance sheet looks
        like: a company can now be simultaneously aggressive on buybacks and aggressive on capex, a combination the
        older, pre-2020s playbook treated as a contradiction.
      </p>
      <p>
        The question this article cannot yet answer, because the data to answer it will not exist for another few
        years, is whether the AI infrastructure now being built on borrowed money generates enough cash flow to
        service that debt without forcing a choice between buyback programs and interest payments — the moment that
        choice arrives is the moment this entire arrangement gets its first real stress test.
      </p>
      <MultipleChoice q={CONCLUSION_QUESTION} state={mcState[CONCLUSION_QUESTION.id]} onSubmit={onMcSubmit} />
    </SectionWrapper>
  );
}

        <div
          key={item.id}
          className={"nav-item" + (active === item.id ? " nav-active" : "")}
          onClick={() => {
            const el = document.getElementById(item.id);
            if (el) el.scrollIntoView({ behavior: "smooth" });
          }}
        >
          {item.label}
        </div>
      ))}
    </nav>
  );
}

function BackNextControls({ active }) {
  function go(delta) {
    const idx = NAV_ITEMS.findIndex((it) => it.id === active);
    const nextIdx = Math.max(0, Math.min(NAV_ITEMS.length - 1, (idx === -1 ? 0 : idx) + delta));
    const el = document.getElementById(NAV_ITEMS[nextIdx].id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }
  return (
    <div className="back-next-controls">
      <button className="btn-backnext" onClick={() => go(-1)}>‹ Back</button>
      <button className="btn-backnext" onClick={() => go(1)}>Next ›</button>
    </div>
  );
}

function ProgressBar({ progress }) {
  return (
    <div className="progress-bar-track">
      <div className="progress-bar-fill" style={{ width: progress + "%" }} />
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* ROOT APP                                                                */
/* ---------------------------------------------------------------------- */

function App() {
  const [mcState, setMcState] = useState({});
  const [numState, setNumState] = useState({});
  const [chartInterp, setChartInterp] = useState({
    chart1: { submitted: [false, false], values: ["", ""] },
    chart2: { submitted: [false, false], values: ["", ""] },
    chart3: { submitted: [false, false], values: ["", ""] },
    chart4: { submitted: [false, false], values: ["", ""] },
    chart5: { submitted: [false, false], values: ["", ""] },
  });
  const [active, setActive] = useState("sec-warmup");
  const [govInsight, setGovInsight] = useState("");
  const [insightRevealed, setInsightRevealed] = useState(false);
  const [applyA, setApplyA] = useState("");
  const [applyB, setApplyB] = useState("");
  const [applyEval, setApplyEval] = useState(null);

  useEffect(() => {
    function onScroll() {
      let current = NAV_ITEMS[0].id;
      for (const item of NAV_ITEMS) {
        const el = document.getElementById(item.id);
        if (el && el.getBoundingClientRect().top < 140) current = item.id;
      }
      setActive(current);
    }
    window.addEventListener("scroll", onScroll);
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const allMcIds = [...MC_QUESTIONS, CONCLUSION_QUESTION, ...WARMUP_QUESTIONS].map((q) => q.id);
  const totalScorable = allMcIds.length + NUMERIC_QUESTIONS.length;
  const answeredCount =
    Object.values(mcState).filter((s) => s && s.submitted).length +
    Object.values(numState).filter((s) => s && s.submitted).length;
  const score =
    Object.values(mcState).filter((s) => s && s.submitted && s.isCorrect).length +
    Object.values(numState).filter((s) => s && s.submitted && s.isCorrect).length;
  const progress = Math.min(100, Math.round((answeredCount / totalScorable) * 100));

  function handleMcSubmit(id, selectedOption, isCorrect) {
    setMcState((prev) => ({ ...prev, [id]: { submitted: true, selectedOption, isCorrect } }));
  }

  function handleNumSubmit(id, numericValue, isCorrect, path) {
    const q = NUMERIC_QUESTIONS.find((x) => x.id === id);
    const signedErrorPct = q ? ((numericValue - q.target) / q.target) * 100 : 0;
    setNumState((prev) => ({ ...prev, [id]: { submitted: true, numericValue, isCorrect, signedErrorPct, path } }));
  }

  function handleInterpSubmit(chartKey, idx, value) {
    setChartInterp((prev) => {
      const next = { ...prev };
      const entry = { submitted: prev[chartKey].submitted.slice(), values: prev[chartKey].values.slice() };
      entry.submitted[idx] = true;
      entry.values[idx] = value;
      next[chartKey] = entry;
      return next;
    });
  }

  function evaluateApplyIt() {
    // Local, evidence-based fallback evaluator (no live API call from this static artifact).
    // Checks presence and non-triviality of the four required labeled parts, and flags
    // whichever part is weakest or missing, per Apply-It-Evaluation spec.
    const text = applyA.toLowerCase();
    const gaps = [];
    const hasThesis = /thesis/.test(text) || applyA.length > 30;
    const hasAssumption = /assumption/.test(text);
    const hasDisconfirm = /disconfirm|undermine|evidence/.test(text);
    const hasPremortem = /pre-mortem|premortem|fails|fail/.test(text);
    if (applyA.trim().length < 60) {
      gaps.push("Your Apply It (a) response is quite short — a response this brief is unlikely to develop all four required parts with enough specificity.");
    }
    if (!hasThesis) gaps.push("Missing or unclear: a one-sentence so-what thesis about what the hospital network's pattern implies.");
    if (!hasAssumption) gaps.push("Missing or unclear: the single load-bearing assumption that must hold for your thesis to be true.");
    if (!hasDisconfirm) gaps.push("Missing or unclear: the specific evidence that would most undermine your thesis.");
    if (!hasPremortem) gaps.push("Missing or unclear: a one-line pre-mortem naming the most likely failure reason.");
    if (applyB.trim().length < 20) {
      gaps.push("Apply It (b) cross-link is missing or too brief — name a specific prior article and explain the connection, not just the article's title.");
    }
    const summary =
      gaps.length === 0
        ? "Your response climbs from observation to a quantified, decision-relevant implication and addresses all four parts. Strong transfer to a new domain."
        : "This evaluator checks for the presence and substance of all four labeled parts (thesis, assumption, disconfirming evidence, pre-mortem), not for keyword matching — revise the parts flagged above to strengthen the transfer.";
    setApplyEval({ gaps, summary });
  }

  return (
    <div className="app-root">
      <ProgressBar progress={progress} />
      <div className="score-badge">Score: {score} / {totalScorable}</div>
      <SectionNav active={active} />
      <BackNextControls active={active} />
      <main className="content-column">
        <header className="article-header">
          <div className="kicker">ER-21 · Business &amp; Strategy</div>
          <h1>The Buyback Paradox: Why Record Repurchases and Record Investment Keep Happening at the Same Time</h1>
        </header>
        <WarmUpSection mcState={mcState} onMcSubmit={handleMcSubmit} />
        <IntroSection />
        <BackgroundSection chartInterp={chartInterp} onInterpSubmit={handleInterpSubmit} mcState={mcState} onMcSubmit={handleMcSubmit} />
        <RQ1Section chartInterp={chartInterp} onInterpSubmit={handleInterpSubmit} mcState={mcState} onMcSubmit={handleMcSubmit} numState={numState} onNumSubmit={handleNumSubmit} />
        <RQ2Section chartInterp={chartInterp} onInterpSubmit={handleInterpSubmit} mcState={mcState} onMcSubmit={handleMcSubmit} numState={numState} onNumSubmit={handleNumSubmit} />
        <RQ3Section chartInterp={chartInterp} onInterpSubmit={handleInterpSubmit} mcState={mcState} onMcSubmit={handleMcSubmit} />
        <LearningSummary
          mcState={mcState}
          numState={numState}
          govInsight={govInsight}
          setGovInsight={setGovInsight}
          insightRevealed={insightRevealed}
          setInsightRevealed={setInsightRevealed}
          applyA={applyA}
          setApplyA={setApplyA}
          applyB={applyB}
          setApplyB={setApplyB}
          applyEval={applyEval}
          onEvaluate={evaluateApplyIt}
        />
        <ConclusionSection mcState={mcState} onMcSubmit={handleMcSubmit} />
        <SourceList />
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
