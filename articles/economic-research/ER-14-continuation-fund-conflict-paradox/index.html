  <style>

  --accent:#1f6feb; --accent2:#0b8457; --warn:#d97706; --bad:#c0392b; --good:#0b8457;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#progterm{position:fixed;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:60;transition:width .2s}
#scorebadge{position:fixed;top:12px;right:14px;z-index:61;background:#111;color:#fff;

.wrap{max-width:1160px;margin:0 auto;padding:0 16px;display:flex;gap:24px}

  border-radius:0 5px 5px 0;line-height:1.3;cursor:pointer}
.navcol a.active{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:#eef4ff}

h1{font-size:29px;line-height:1.22;margin:6px 0 6px}
h2{font-size:22px;margin:14px 0 4px}
h3{font-size:17px;margin:20px 0 2px}

.dek{color:var(--muted);font-size:15px;margin:2px 0 10px}
p{font-size:16px;line-height:1.7;margin:12px 0}
section{padding-top:26px;border-top:1px solid var(--line);margin-top:30px}

.src a{color:var(--accent)}

.scoregrid{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;margin:10px 0;max-width:360px}
.scoregrid .v{font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-block;background:#eef4ff;color:var(--accent);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}

ul.clean li{font-size:14px;margin:4px 0;line-height:1.5}

table.datatbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.datatbl th,table.datatbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.datatbl th{background:#f7f7f6;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="progterm"></div>
  <div id="scorebadge">Score 0 / 0</div>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
/* ============================================================================
   The Continuation Fund Paradox: When the Seller and the Buyer Share an Office
   Domain: Finance & markets (ER-14).
   Data tiers: FACT (cited, verified directly against the primary source),
   ESTIMATE (derived by this article's own stated arithmetic/assumptions from
   FACTs, disclosed and coarsely rounded), ILLUSTRATION (disclosed synthetic
   teaching values, never a headline claim).
   App code + CSS inlined into index.html. This file is a readable source copy.
   ========================================================================== */
const {useState,useEffect,useRef} = React;
const R = window.Recharts;
const {ResponsiveContainer,ComposedChart,BarChart,Bar,Cell,LineChart,Line,ScatterChart,Scatter,
  XAxis,YAxis,CartesianGrid,Tooltip,ReferenceLine,ReferenceArea,LabelList,Legend,ZAxis} = R;

/* ---------- DATA ------------------------------------------------------------ */
// Chart 1 -- Line: GP-led continuation-vehicle (CV) activity as a share of
// total sponsor-backed PE exit volume, 2020-2025. FACT. 2020 and 2021: 5% each
// (Bain & Company Global Private Equity Report 2025, as summarized by
// Chronograph, "Top Takeaways from Bain's 2025 Private Equity Report" and
// "The Rise of Continuation Funds: A Deep Dive," 2025). 2024: 13% (same Bain
// 2025 report, via Chronograph 2025). 2025: 14% (Jefferies Private Capital
// Advisory, "2025 Global Secondary Market Review," Feb. 2026 -- built on
// Dealogic estimates of sponsor-backed exit volume, including M&A and IPO
// proceeds, as the denominator). 2022 and 2023 points are not published in
// either series and are disclosed here as a gap, not filled in.
const c1 = [
  {year:"2020", share:5},
  {year:"2021", share:5},
  {year:"2024", share:13},
  {year:"2025", share:14},
];

// Chart 2 -- Waterfall/bridge: global secondary-market volume, 2024 -> 2025,
// split into the LP-led and GP-led contribution to that year's growth.
// 2025 FACT figures (Jefferies, "2025 Global Secondary Market Review," Feb.
// 2026): total $240B (+48% YoY); LP-led $125B (52% of total); GP-led $115B
// (48% of total, +53% YoY). 2024 GP-led $75B is a directly stated FACT in the
// same report ("GP-led volume in the second half of the year ($68 billion)
// alone nearly matched full-year 2024 levels ($75 billion)"). The 2024 TOTAL
// (~$162B) and 2024 LP-led (~$87B) are this article's own ESTIMATES, derived
// by disclosed arithmetic from the two FACTs above: 2024 total = 2025 total /
// 1.48 (undoing the reported 48% YoY growth) = $240B / 1.48 ~= $162B; 2024
// LP-led = 2024 total - 2024 GP-led = $162B - $75B ~= $87B. Neither 2024 total
// nor 2024 LP-led is a number directly printed in the source; both are
// arithmetic implications of two numbers that are.
const c2 = [
  {name:"2024 total (Est.)", base:0, delta:162, kind:"start"},
  {name:"+ LP-led growth", base:162, delta:38, kind:"up"},
  {name:"+ GP-led growth", base:200, delta:40, kind:"up"},
  {name:"2025 total (Fact)", base:0, delta:240, kind:"total"},
];
const c2color = d => d.kind==="up" ? "#0b8457" : "#111";

// Chart 3 -- Indexed line, ESTIMATE/modeled: cumulative wealth index for an LP
// that always rolls its exposure into continuation vehicles vs. one that
// always cashes out, modeled by compounding a single stated finding: LPs that
// systematically decline to roll their exposure into CVs incur an opportunity
// cost of roughly 8% per vintage year (Upwelling Capital Group research,
// cited in Chronograph, "The Rise of Continuation Funds: A Deep Dive," 2025).
// Both index lines start at 100. "Always roll" is held flat at the baseline
// (100 every year, i.e., captures the full return path); "always cash out"
// compounds a ~8%-per-year relative shortfall: 100 x (0.92)^n. This is a
// disclosed model, not a reported statistic -- the source states a per-year
// rate, not a 5-year compounded path.
function compound(n){ return Math.round(100*Math.pow(0.92,n)*10)/10; }
const c3 = [0,1,2,3,4,5].map(n=>({yr:"Yr "+n, roll:100, cash:compound(n)}));

// Chart 4 -- Dumbbell: GP ownership/commitment stake, traditional flagship
// fund vs. continuation vehicle. FACT. Traditional fund: General Partners (GPs)
// typically commit 2%-5% of a flagship fund's capital themselves. Continuation
// vehicle: GPs typically commit 5%-25% of the new vehicle, a structural step
// meant to offset the conflict of being both seller and buyer. In H1 2024,
// about 80% of continuation vehicles included a GP commitment of 5% or more
// (Jefferies, "Global Secondary Market Review, July 2024," p.9, as cited in
// CAIA, "The Continuation Vehicle Boom," 2026, and Chronograph, "The Rise of
// Continuation Funds," 2025).
const c4 = [
  {cat:"Traditional flagship fund", low:2, high:5},
  {cat:"Continuation vehicle", low:5, high:25},
];

// Chart 5 -- Bullet: distributions to paid-in capital (DPI, i.e., actual cash
// returned to LPs as a share of the fund's net asset value) vs. the
// historical/budgeted norm, 2022-2024. FACT. Distributions as a percentage of
// NAV trailed historical norms by roughly 15 percentage points over
// 2022-2024: an actual rate of about 13% against a historical/budgeted norm
// of about 28% (Bain & Company, "Global Private Equity Report 2025," p.21, as
// cited in CAIA, "The Continuation Vehicle Boom," 2026). This is the liquidity
// shortfall that intensifies both LPs' and GPs' appetite for GP-led
// secondaries as an alternative liquidity channel.
const c5 = [{name:"Distributions / NAV, 2022-2024", actual:13, target:28}];

/* ---------- small helpers -------------------------------------------------- */
function Tier({t}){const m={FACT:"fact",ESTIMATE:"est",ILLUSTRATION:"ill"};return <span className={"tier "+m[t]}>{t}</span>;}

/* ---------- Interpretation prompt (gated reveal) --------------------------- */
function Interp({id,label,question,authored,onSubmit}){
  const [txt,setTxt]=useState(""); const [done,setDone]=useState(false);
  return (
    <div className="prompt">
      <div className="lbl">{label}</div>
      <div className="q">{question}</div>
      {!done && <>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Write at least one sentence (15+ characters) before the authored answer appears."/>
        <button className="btn sm" disabled={txt.trim().length<15} onClick={()=>{setDone(true);onSubmit&&onSubmit(id,txt);}}>Reveal authored answer</button>
      </>}
      {done && <>
        <div className="yours"><b>Your answer:</b> {txt}</div>
        <div className="authored"><div className="h">Compare to the authored answer</div>{authored}</div>
      </>}
    </div>
  );
}

/* ---------- Multiple choice (no confidence capture) ------------------------ */
function MC({q,onScore}){
  const [sel,setSel]=useState(null);
  const [sub,setSub]=useState(false);
  const submit=()=>{ if(sel==null) return; setSub(true); onScore(q.id, sel===q.correct, "mc", {correct:sel===q.correct}); };
  return (
    <div className={"q-card"+(q.kind==="case"?" case":"")}>
      <div className="q-type">{q.typeLabel}{q.kind==="case"?" · Case Prompt":""}</div>
      <div className="q-stem">{q.stem}</div>
      {q.client && <p style={{marginTop:0,fontSize:14,color:"#555"}}><b>Client:</b> {q.client}</p>}
      {q.options.map((o,i)=>{
        let cls="opt"; if(sub){ if(i===q.correct) cls+=" correct"; else if(i===sel) cls+=" wrong"; }
        else if(i===sel) cls+=" sel";
        return <div key={i} className={cls} onClick={()=>!sub&&setSel(i)}>
          <span className="k">{"ABCD"[i]}</span><span>{o}</span></div>;
      })}
      {!sub && <button className="btn" disabled={sel==null} onClick={submit}>Submit</button>}
      {sub && <div className="expl">
        <span className={"cal "+(sel===q.correct?"ok":"no")}>{sel===q.correct?"Correct — ":"Incorrect — "}</span>
        {sel===q.correct? q.why : q.wrongWhy[sel]}
        <div className="gen">Where this generalizes: {q.generalizes}</div>
      </div>}
    </div>
  );
}

/* ---------- Numeric estimation (fading scaffold) ---------------------------- */
function Numeric({q,onScore}){
  const [val,setVal]=useState(q.min);
  const [sub,setSub]=useState(false);
  const [decomp,setDecomp]=useState("");
  const decompOk = !q.requireDecomp || decomp.trim().length>=15;
  const within = ()=>{ if(q.log){ const r=val/q.actual; return r>=0.5 && r<=2; }
    return Math.abs(val-q.actual) <= q.tol; };
  const submit=()=>{ setSub(true); onScore(q.id, within(), "num", {val, actual:q.actual}); };
  const span=q.max-q.min;
  const pos=x=>Math.max(0,Math.min(100,((x-q.min)/span)*100));
  return (
    <div className="q-card">
      <div className="q-type">{q.typeLabel} · Numeric estimate</div>
      <div className="q-stem">{q.stem}</div>
      {q.tolNote && <div className="warmnote"><b>Tolerance:</b> {q.tolNote}</div>}
      {q.skeleton && !sub && !q.requireDecomp && <div className="warmnote">{q.skeleton}</div>}
      {q.requireDecomp && !sub && <>
        <div className="warmnote">Before entering a number: name your own decomposition path — what would you multiply, add, or look up first?</div>
        <textarea value={decomp} onChange={e=>setDecomp(e.target.value)} placeholder="Your decomposition path (15+ characters)…"/>
      </>}
      {!sub && <>
        <div className="num-row">
          <input type="number" value={val} onChange={e=>setVal(parseFloat(e.target.value)||0)} disabled={!decompOk}/>
          <input type="range" min={q.min} max={q.max} step={q.step} value={val} onChange={e=>setVal(parseFloat(e.target.value))} disabled={!decompOk}/>
          <span style={{fontSize:13,color:"#666"}}>{q.unit}</span>
        </div>
        <button className="btn" disabled={!decompOk} onClick={submit}>Submit estimate</button>
      </>}
      {sub && <>
        {q.requireDecomp && <div className="yours"><b>Your decomposition path:</b> {decomp}</div>}
        <div className="distax">
          <div className="tick" style={{left:pos(q.min)+"%"}}></div><div className="lab" style={{left:pos(q.min)+"%"}}>{q.min}</div>
          <div className="tick" style={{left:pos(q.max)+"%"}}></div><div className="lab" style={{left:pos(q.max)+"%"}}>{q.max}</div>
          <div className="you" style={{left:pos(val)+"%"}}>you {val}</div>
          <div className="act" style={{left:pos(q.actual)+"%"}}>actual {q.actual}</div>
          <div className="tick" style={{left:pos(q.actual)+"%",background:"var(--good)"}}></div>
          <div className="tick" style={{left:pos(val)+"%",background:"var(--accent)"}}></div>
        </div>
        <div className="expl">
          <span className={"cal "+(within()?"ok":"no")}>{within()?"Within tolerance — ":"Outside tolerance — "}</span>
          {q.how}
          <div className="gen">Where this generalizes: {q.generalizes}</div>
        </div>
      </>}
    </div>
  );
}

/* ---------- Glossary -------------------------------------------------------- */
function Glossary({items}){ if(!items||!items.length) return null;
  return <div className="glossary"><div className="h">Glossary</div>
    {items.map((g,i)=><p key={i}><b>{g.t}</b> — {g.d}</p>)}</div>;
}

/* ---------- Chart wrappers -------------------------------------------------- */
function Chart1(){
  return (
    <div className="chartbox">
      <div className="charttitle">GP-led continuation vehicles as a share of total PE exit volume <Tier t="FACT"/></div>
      <div className="chartsub">Percent of total sponsor-backed private-equity exit volume (M&amp;A, IPO, and GP-led secondary proceeds combined). 2020, 2021, and 2024 points: Bain &amp; Company, "Global Private Equity Report 2025," via Chronograph (2025). 2025 point: Jefferies Private Capital Advisory, "2025 Global Secondary Market Review" (Feb. 2026), using a Dealogic-based exit-volume denominator. 2022-2023 are not published in either series and are shown here as a gap, not filled in.</div>
      <ResponsiveContainer width="100%" height={250}>
        <LineChart data={c1} margin={{left:4,right:24,top:20,bottom:4}}>
          <CartesianGrid strokeDasharray="3 3" vertical={false}/>
          <XAxis dataKey="year" fontSize={12}/>
          <YAxis domain={[0,18]} tickFormatter={v=>v+"%"} fontSize={11} label={{value:"% of PE exit volume",angle:-90,position:"insideLeft",fontSize:10.5}}/>
          <Tooltip formatter={v=>v+"%"}/>
          <Line type="monotone" dataKey="share" stroke="#1f6feb" strokeWidth={2.5} dot={{r:5}}>
            <LabelList dataKey="share" position="top" formatter={v=>v+"%"} fontSize={12}/>
          </Line>
        </LineChart>
      </ResponsiveContainer>
      <div className="note">Line chart chosen over a bar chart because the story is a multi-year TRAJECTORY (a near-tripling of share since 2020-2021) rather than a one-off comparison; a line makes the acceleration itself the visual argument.</div>
    </div>
  );
}
function Chart2(){
  return (
    <div className="chartbox">
      <div className="charttitle">Global secondary-market volume bridge, 2024 → 2025 <Tier t="FACT"/> <Tier t="ESTIMATE"/></div>
      <div className="chartsub">$ billions. 2025 figures (total $240B, LP-led $125B, GP-led $115B) are FACTs (Jefferies, "2025 Global Secondary Market Review," Feb. 2026). 2024 GP-led ($75B) is also a directly stated FACT in the same report. The 2024 total (~$162B) and 2024 LP-led (~$87B) are this article's own ESTIMATES, derived by dividing the 2025 total by its reported 48% year-over-year growth rate and subtracting the stated 2024 GP-led figure — neither is printed directly in the source.</div>
      <ResponsiveContainer width="100%" height={260}>
        <BarChart data={c2} margin={{left:4,right:8,top:20,bottom:10}}>
          <CartesianGrid strokeDasharray="3 3" vertical={false}/>
          <XAxis dataKey="name" fontSize={11}/>
          <YAxis domain={[0,260]} tickFormatter={v=>"$"+v+"B"} fontSize={11}/>
          <Tooltip formatter={(v,n,p)=>["$"+p.payload.delta+"B","change"]}/>
          <Bar dataKey="base" stackId="w" fill="transparent"/>
          <Bar dataKey="delta" stackId="w">
            {c2.map((d,i)=><Cell key={i} fill={c2color(d)}/>)}
            <LabelList dataKey="delta" position="top" formatter={v=>"+$"+v+"B"} fontSize={12}/>
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div className="note">Waterfall (bridge) chart chosen over a stacked bar because the point is the CONTRIBUTION-TO-CHANGE — how much of 2025's record growth came from LP-led vs. GP-led activity — the signature exhibit for "what drove the delta."</div>
    </div>
  );
}
function Chart3(){
  return (
    <div className="chartbox">
      <div className="charttitle">Modeled cost of always cashing out of a continuation-vehicle offer <Tier t="ESTIMATE"/></div>

          <h1>The Continuation Fund Paradox: When the Seller and the Buyer Share an Office</h1>
          <p className="lead">A private-equity firm sells its own prized company from an aging fund to a brand-new fund it also manages, pricing the sale itself at the exact moment it knows that company's future better than anyone else alive. Regulators, industry groups, and even the firms' own lawyers have called this an inherent conflict of interest — yet in 2025, deals built exactly this way reached a record $115 billion, 53% more than the year before (Jefferies, 2026).</p>
          <p>The structure is called a continuation fund, or continuation vehicle (CV). A General Partner (GP, the firm that runs a private-equity fund) takes a company out of an older fund that is running out of time and moves it into a new vehicle, one the same GP also manages, so the GP can keep running the company past the old fund's expiration date. The old fund's investors — Limited Partners (LPs, the pension funds, endowments, and other institutions that supply the capital) — get a choice: take cash now, or roll their money into the new vehicle on new terms. In 2025 these deals made up 48% of the entire $240 billion global private-equity secondary market and an estimated 89% of every GP-led secondary transaction (Jefferies, 2026).</p>
          <p>The usual economic story about conflicts of interest is that they get priced out or shut down: buyers demand a discount, or a regulator writes a rule. Continuation funds have gone the other way. The U.S. Securities and Exchange Commission (SEC) tried to write exactly that rule in 2023, requiring an independent fairness opinion on every GP-led deal — and a federal appeals court struck the entire rule down within a year, before most firms had to comply with it even once. Meanwhile nearly 80% of the world's 100 largest private-equity sponsors by assets under management have now run at least one continuation-fund deal (Jefferies, 2026), and one early performance study found these deals outperformed ordinary buyout funds, not underperformed them (Morgan Stanley analysis, cited in Chronograph, 2025). A structure built on an acknowledged conflict is scaling up, not shrinking down.</p>
          <p>This note addresses three questions. First, does the GP's dual role as both seller and buyer of the same asset actually hurt the LPs on the other side of the trade, or does keeping a proven operator in control longer create more value than a clean, arm's-length sale would? Second, have the safeguards built specifically to police this conflict — fairness opinions, LP advisory committee review, mandatory carry rollover, and the SEC's now-vacated 2023 rule — actually neutralized the problem, or is enforcement now resting on voluntary industry practice with no legal backstop? Third, why did continuation-fund volume explode to a record level in 2025 even though the conflict is now common knowledge among sophisticated institutional investors — is this rational value-seeking, or a forced response to a broader liquidity drought across private equity?</p>

          <h2>From a niche liquidity patch to nearly half the secondary market</h2>
          <p>Continuation funds first appeared in the years after the 2008 financial crisis, when GPs facing dead exit markets used them to buy time for assets stuck in aging, capital-starved funds. Back then they traded at steep discounts, reflecting how little appetite the market had for mature, hard-to-exit assets (Chronograph, 2025). For a decade the structure stayed a niche workaround. That changed sharply after 2020. Chart 1 shows continuation-vehicle activity's share of total sponsor-backed private-equity exit volume nearly tripling: from about 5% in 2020 and 2021, to 13% in 2024, to 14% in 2025 (Bain &amp; Company, via Chronograph, 2025; Jefferies, 2026).</p>

          <h2 style={{marginTop:26}}>The mechanics: how a GP becomes both the seller and the buyer</h2>
          <p>A continuation-fund deal works like this. An old fund nearing the end of its life holds a company the GP still believes in. Instead of selling it to an outside buyer or taking it public, the GP forms a brand-new vehicle — sometimes for that one asset alone (a single-asset CV, or SACV), sometimes for several assets from the aging fund (a multi-asset CV, or MACV) — and moves the company into it at a negotiated price. The old fund's LPs choose: take cash at that price, or roll their stake into the new vehicle on new terms, typically a fresh three-to-five-year clock, a reset management fee, and a reset carried interest (carry, the GP's share of investment profits) calculated from the new, higher entry price rather than the original one. In 2025, single-asset deals crossed 50% of total continuation-vehicle volume for the first time, and buyout-strategy deals made up about 70% of all GP-led volume (Jefferies, 2026).</p>
          <p>The conflict sits in three places at once. First, the GP sets — or heavily influences — the price at which it buys the asset from itself, at the exact moment it holds more information about that asset's future than any outside bidder could gather in the time available. Second, moving the asset crystallizes the GP's carry from the old fund, creating an incentive to time or price the deal to maximize that crystallized amount rather than the LP's proceeds. Third, the new vehicle resets the GP's fee clock, extending a revenue stream that a clean exit would have ended. The industry's own response has been to make the GP eat some of its own conflict: GPs typically commit 5%-25% of the new vehicle's capital themselves, versus 2%-5% in a traditional flagship fund, and the near-universal expectation (formalized by the Institutional Limited Partners Association, ILPA, in 2023) is that a GP rolls over 100% of its crystallized carry into the new vehicle rather than cashing it out.</p>

          <h2>Does the dual role actually hurt LPs, or does it keep a winner in the right hands?</h2>
          <p>The obstacle stated plainly: a GP that prices its own sale to itself has an information and timing advantage no outside buyer can fully match, and every dollar the GP underpays the old fund's LPs is a dollar the new vehicle's investors — often including that same GP — do not have to pay. If continuation funds were simply a way for GPs to move assets to themselves cheaply, LPs who systematically rolled into them should underperform LPs who systematically declined.</p>
          <p>The evidence so far runs the other way. A Morgan Stanley analysis of continuation-vehicle vintages from 2018 to 2023 found these deals outperformed the Multiple on Invested Capital (MOIC, total value returned divided by capital invested) of ordinary buyout funds across every return quartile, while also showing lower loss ratios (cited in Chronograph, 2025). Separately, research from Upwelling Capital Group found that LPs who systematically decline to roll their exposure into continuation vehicles — taking the cash offer every time — incur an opportunity cost of roughly 8% per vintage year relative to LPs who roll (cited in Chronograph, 2025). Chart 3 models what that single reported rate compounds into.</p>

          <div className="kicker">Research Question 2</div>
          <h2>Have the safeguards actually neutralized the conflict, or is the backstop gone?</h2>
          <p>The industry built four specific safeguards around this conflict. First, an independent fairness or valuation opinion on the transaction price. Second, review and approval by the LP Advisory Committee (LPAC, a small group of LPs empowered to review conflicted transactions on behalf of the whole fund). Third, the near-universal expectation that the GP rolls 100% of its crystallized carry into the new vehicle, so it cannot cash out its incentive fee at the exact moment it is setting the price. Fourth, in 2023, the SEC wrote a rule requiring SEC-registered advisers to obtain a fairness or valuation opinion on every GP-led secondary transaction, with disclosure of any material business ties to the firm giving that opinion.</p>
          <p>That fourth safeguard no longer has legal force. On June 5, 2024, a unanimous three-judge panel of the U.S. Court of Appeals for the Fifth Circuit vacated the SEC's entire 2023 Private Fund Adviser Rules package, including the fairness-opinion requirement, ruling the SEC had exceeded its statutory authority (Morrison Foerster, Sidley Austin, Crowell & Moring, and other law-firm client alerts, June 2024). The SEC did not appeal. Advisers are no longer legally required to obtain the opinion the rule demanded — though most sponsors already did so voluntarily before the rule existed, and law firms advising GPs still describe the vacated rule's substance as shaping SEC examination priorities and industry best practice even without binding force (Willkie Farr & Gallagher, 2025). One recent dispute illustrates what the safeguards look like when they fail: litigation alleged a GP gave its LPAC and its own fairness-opinion advisor different valuation inputs than the ones that actually informed the continuation vehicle's pricing, using an information gap between the two reviewing bodies to obtain approval (cited in HLC, 2026, discussing the ADIC v. EMG dispute).</p>

          <h2>Why did volume explode even though everyone knows about the conflict?</h2>
          <p>The third question is the simplest to state and the hardest to settle: if sophisticated LPs know exactly how this structure is conflicted, why do they keep participating in record numbers rather than walking away? The most direct answer sitting in the data is that private equity as a whole is stuck in an unusually long liquidity drought, and continuation funds are one of the only channels still open.</p>
          <p>McKinsey's Global Private Markets Report 2025 found that 2.5 times as many LPs now rank distributions to paid-in capital (DPI, cash actually returned to investors, as opposed to a paper valuation) as their "most critical" performance metric compared with just three years earlier — a sign that patience for unrealized, on-paper gains has run out. Bain & Company's own data shows why: across 2022-2024, distributions as a percentage of NAV trailed the historical/budgeted norm by roughly 15 percentage points, an actual rate near 13% against a historical norm near 28%, and the resulting DPI for 2018-2021 vintage funds ran about 0.2x lower than LPs had budgeted for (Bain, 2025, via CAIA, 2026). Chart 5 shows that gap directly.</p>

          <h2>A conflict that scaled instead of shrinking, because it may also be creating value</h2>
          <p>The central challenge is that continuation funds put the same information advantage behind both the conflict (a GP pricing a sale to itself) and the value case (a GP self-selecting its best assets to keep). Under a partial-success path, the most likely next few years look like continued growth in a market with no binding legal safeguard: the SEC's fairness-opinion rule stays vacated unless Congress or a future rulemaking replaces it, industry norms (GP carry rollover, larger GP commitments, voluntary fairness opinions) keep functioning as the de facto standard because reputational and repeat-dealing incentives largely hold, and volume keeps climbing for as long as the DPI shortfall that is driving much of today's demand persists.</p>
          <p>For LP allocators, the implication is to treat each continuation-vehicle offer as its own underwriting decision rather than a referendum on the structure as a whole — checking the specific fairness opinion, the specific carry-rollover commitment, and the specific GP capital at risk on that one deal, rather than relying on an industry-wide historical outperformance average drawn from a GP-selected sample of past "keeper" assets. For policymakers, the implication is that a legally binding backstop (a replacement for the vacated SEC rule, or new legislation) remains genuinely absent, so LP protection currently depends on voluntary industry practice holding up under competitive pressure as more capital and more first-time sponsors enter the market. For market participants more broadly, the deeper structural lesson extends past private equity: any structure where the party with the deepest information advantage also sits on both sides of a transaction will keep scaling for as long as its measured outcomes look good, and the real test of whether it is creating value or merely transferring it will only arrive when a full market downturn forces GPs to price honestly under distress rather than from a position of choice.</p>

    const avg=s.reduce((x,y)=>x+y,0)/s.length; bias=Math.round(avg*100); }

  const principleMap={
    wu1:"Many independent actors making the same individually sound choice can create a concentrated, aggregate exposure no single actor's own process was built to see",
    wu2:"A falling per-unit rate does not guarantee a falling total; check whether an induced rise in volume offsets or reverses the per-unit gain",
    wu3:"Legal remittance and economic incidence are different questions, and a moving aggregate does not by itself prove or disprove a specific policy's cost",
    "bg-mc1":"When a trend is stitched from more than one data source, trust the shape and order of magnitude more than any single year's exact figure, and check agreement at the point of overlap",
    "bg-num1":"A single year's growth rate extrapolated forward is a rough ceiling, not a forecast — check whether the driver of that growth is a one-time catch-up or a durable baseline",
    "q1-mc1":"Historical outperformance drawn from a self-selected sample does not automatically generalize to a blanket future rule",
    "q1-case1":"A deal-specific alignment check (this deal's fairness opinion, this deal's carry rollover) screens an individual transaction better than an aggregate historical average",
    "q2-mc1":"A trend that began before its supposed cause is strong evidence the timing overlap is not the actual driver",
    "q2-num1":"A reported adoption rate for the most capable slice of a population usually overstates the rate for the full, more varied population",
    "q3-mc1":"A percentage-point gap and a percent relative change describe the same numbers very differently, and conflating them can misstate magnitude by several times",
    "q3-case1":"A multi-year trend driven by a documented cyclical condition is only as durable as that condition, not automatically permanent",
    "concl-e1":"The strongest recommendation names the specific future evidence pattern, including a harder test of a currently favorable data point, that would overturn the thesis",
  };
  const missed=entries.filter(([,a])=>!a.ok).map(([id])=>principleMap[id]).filter(Boolean);

  // Apply-It evaluator -- LOCAL FALLBACK ONLY. This static, single-file artifact has no
  // secure server-side API path, so per artifact-generator.md this function is isolated
  // behind one call site (the button below) and implements an evidence-based, non-keyword
  // fallback: it checks for the PRESENCE of all four required reasoning moves (thesis,
  // load-bearing assumption, disconfirming evidence, pre-mortem) and reports which are
  // weakest or missing as an explicit gap list, rather than pattern-matching specific words
  // as "correct." If a secure API path is added later, swap this function's body for one
  // server-side call that sends the full article text plus the reader's response and asks
  // a model to judge the same four parts in 3-5 sentences -- the call site below does not
  // need to change.
  function evaluateApply(a,b){
    const txt=a.toLowerCase();
    const gaps=[];
    const hasThesis=a.trim().length>25;
    const hasAssume=/assum|depend|requir|must hold|relies|hinge/.test(txt);
    const hasDis=/disconfirm|undermin|falsif|against|counter|contradic|weakest|thin/.test(txt);
    const hasPre=/pre-?mortem|if this fails|fail|12 month|most likely reason|because/.test(txt);
    if(!hasThesis) gaps.push("a clear one-sentence so-what thesis");
    if(!hasAssume) gaps.push("the single load-bearing assumption that must hold");
    if(!hasDis) gaps.push("the evidence that would most undermine your thesis");
    if(!hasPre) gaps.push("a one-line pre-mortem (if it fails in 12 months, the likely reason)");
    const climbs=/so |therefore|which means|implies|should|because/.test(txt) && /\d/.test(a);
    let verdict;
    if(gaps.length===0) verdict = climbs
      ? "All four parts are present and your reasoning climbs from observation to a quantified, decision-relevant implication. Strongest next step: pressure-test the assumption you named against the disconfirming evidence you cited."
      : "All four parts are present, but the response stays descriptive. Push it to an implication: name what a decision-maker should DO and attach a number.";
    else verdict = "Weakest or missing: "+gaps.join("; ")+". A transfer thesis needs all four — recommendation, load-bearing assumption, disconfirming evidence, and pre-mortem — before it's decision-ready.";
    const bCheck = b.trim().length<20 ? " (Also add prompt (b): name one prior article's principle that reinforces or conflicts with today's.)" : "";
    return verdict+bCheck;
  }

  return (
    <div>
      <h3>1 · Your score</h3>
      <div className="scoregrid">
        <div>Total correct</div><div className="v">{nCorrect} / {entries.length||0}</div>
        {Object.entries(byType).map(([t,o])=>(
          <React.Fragment key={t}>
            <div>{t==="mc"?"Multiple choice":"Numeric estimates"}</div><div className="v">{o.ok} / {o.n}</div>
          </React.Fragment>
        ))}
      </div>
      {bias!==null && <p style={{fontSize:14}}>Numeric bias: on average your estimates were {bias>0?"about "+bias+"% high":bias<0?"about "+Math.abs(bias)+"% low":"right on"} versus the actual values{bias<0?" — you tend to under-estimate magnitudes.":bias>0?" — you tend to over-estimate magnitudes.":"."}</p>}

      <h3>2 · Your governing insight (write before revealing ours)</h3>
      <p style={{fontSize:14}}>You saw five charts. Write the single most non-obvious insight you would defend to a skeptical LP allocator.</p>
      {!govDone && <>
        <textarea value={gov} onChange={e=>setGov(e.target.value)} placeholder="One or two sentences…"/>
        <button className="btn" disabled={gov.trim().length<20} onClick={()=>setGovDone(true)}>Reveal the article's three insights</button>
      </>}
      {govDone && <>
        <div className="yours"><b>Your insight:</b> {gov}</div>
        <div style={{marginTop:10}}>
          <div className="insight-card"><b>1.</b> The same information advantage that creates the pricing conflict (the GP knows this asset better than any outside bidder) is also the mechanism behind the reported outperformance (the GP is self-selecting its own proven "keeper" assets) — the conflict and the value case are not competing explanations, they are two effects of one underlying cause, which is why neither a blanket "always roll" nor a blanket "always distrust it" rule follows from the evidence.</div>
          <div className="insight-card"><b>2.</b> The safeguard everyone points to (the SEC's fairness-opinion rule) has had no legal force since June 2024, so LP protection today rests entirely on voluntary industry norms holding up under competitive pressure — a structurally different, and less tested, form of protection than a binding regulation, even though day-to-day practice looks similar.</div>
          <div className="insight-card"><b>3.</b> Continuation-fund growth and the private-equity liquidity drought (DPI running roughly half its historical norm) rose together for a documented, causal reason, not just a coincidence of timing — which means today's record volume is at least partly a symptom of a stuck exit market, and the honest test of whether the structure creates real value, rather than just being the least-bad option available, will only arrive once that drought ends.</div>
        </div>
      </>}

      <h3>3 · Apply it</h3>
      <p style={{fontSize:14}}><b>(a) Transfer to a new domain.</b> A mid-size regional hospital system's own internal physician staffing company periodically "sells" specific physician practices from an older joint venture into a new joint venture that the SAME hospital system's management also controls, resetting management fees and letting departing physician-investors cash out while continuing ones roll their equity forward on new terms. In four labeled parts, write: (1) a one-sentence so-what thesis about whether this restructuring is more likely value-creating or conflict-driven, (2) the single load-bearing assumption that must hold for your thesis to be right, (3) the strongest evidence that would undermine it, and (4) a one-line pre-mortem: "If this restructuring fails within 12 months, the most likely reason is ___."</p>
      <textarea value={applyA} onChange={e=>setApplyA(e.target.value)} placeholder="1) Thesis…  2) Assumption…  3) Disconfirming evidence…  4) Pre-mortem…"/>
      <p style={{fontSize:14,marginTop:12}}><b>(b) Cross-link to a prior article.</b> Name one principle from an earlier article (FIFA's asset-owner-vs-risk-bearer split, GLP-1's per-unit-vs-aggregate distinction, immaculate disinflation's sacrifice-ratio sign test, private credit's measurement-artifact lesson, streaming's fixed-cost-scale lesson, AI capex's spend-vs-revenue gap, Baumol's productivity-tracks-price lesson, gene therapy's value-vs-adoption split, passive investing's aggregate-concentration lesson, AI power's rebound-effect lesson, retail media's margin-gap-without-incrementality-proof lesson, the tariff article's legal-vs-economic-incidence distinction, or the antibiotic article's stewardship-vs-volume-pricing collision) that most reinforces or conflicts with today's dual-role conflict tension, and say why.</p>
      <textarea value={applyB} onChange={e=>setApplyB(e.target.value)} placeholder="Prior principle + how it connects…"/>
      <button className="btn" disabled={applyA.trim().length<30} onClick={()=>setEvalOut(evaluateApply(applyA,applyB))}>Evaluate my reasoning</button>
      {evalOut && <div className="authored"><div className="h">Reasoning check (local evaluator)</div>{evalOut}</div>}

      <h3>4 · Principles to revisit</h3>
      {missed.length===0
        ? <p style={{fontSize:14}}>Nothing missed so far — as you answer more questions, any you miss will appear here by the principle they test.</p>
        : <div>{missed.map((m,i)=><div key={i} className="miss"><span className="tag">revisit</span>{m}</div>)}</div>}
    </div>
  );
}
