/* ---------------------------------------------------------------------------
   Chart interpretation gate — two independently-gated prompts per chart
--------------------------------------------------------------------------- */
function InterpretationPrompt({ chartId, index, kindLabel, prompt, authored, state, onSubmit }) {
  const key = chartId + "-" + index;
  const submitted = !!(state[key] && state[key].submitted);
  const [draft, setDraft] = useState((state[key] && state[key].text) || "");
  const [selfNote, setSelfNote] = useState("");
  const minLen = 15;

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, marginTop: 12, background: "#FAFAFA" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>
        {kindLabel}
      </div>
      <p style={{ fontSize: 15, marginTop: 0 }}>{prompt}</p>
      {!submitted && (
        <>
          <textarea
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            placeholder={"Write your answer (min " + minLen + " characters)..."}
            style={{ width: "100%", minHeight: 64, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
            <span style={{ fontSize: 12, color: draft.length >= minLen ? "#2F6B2F" : "#999" }}>
              {draft.length}/{minLen} characters minimum
            </span>
            <button
              disabled={draft.length < minLen}
              onClick={() => onSubmit(key, draft)}
              style={{
                padding: "8px 16px", borderRadius: 8, border: "none", fontSize: 14, fontWeight: 600,
                background: draft.length < minLen ? "#E5E5E5" : "#111", color: draft.length < minLen ? "#999" : "#fff",
                cursor: draft.length < minLen ? "not-allowed" : "pointer"
              }}
            >Submit answer</button>
          </div>
        </>
      )}
      {submitted && (
        <>
          <div style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10, marginTop: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#555" }}>YOUR ANSWER</div>
            <p style={{ margin: "4px 0 0 0", fontSize: 14 }}>{state[key].text}</p>
          </div>
          <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#4B3F91" }}>COMPARE YOUR ANSWER TO THE AUTHORED ONE</div>
            <p style={{ margin: "4px 0 0 0", fontSize: 14 }}>{authored}</p>
          </div>
          {!state[key].selfNoteSubmitted && (
            <div style={{ marginTop: 8 }}>
              <input
                value={selfNote}
                onChange={(e) => setSelfNote(e.target.value)}
                placeholder="Optional: in one sentence, why does the data move this way?"
                style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13 }}
              />
              {selfNote.length > 0 && (
                <button onClick={() => onSubmit(key, state[key].text, selfNote)}
                  style={{ marginTop: 6, padding: "5px 10px", fontSize: 12, borderRadius: 6, border: "1px solid #ccc", background: "#fff", cursor: "pointer" }}>
                  Save note
                </button>
              )}
            </div>
          )}
          {state[key].selfNoteSubmitted && (
            <p style={{ fontSize: 12, color: "#777", marginTop: 6, fontStyle: "italic" }}>Your note: {state[key].selfNote}</p>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Question components
--------------------------------------------------------------------------- */

function MCQ({ q, state, onAnswer }) {
  const st = state[q.id] || { selected: null, submitted: false, attempts: 0, correct: false, showScaffold: false };
  const [selected, setSelected] = useState(st.selected);

  function submit() {
    if (selected === null) return;
    const isCorrect = selected === q.correctIndex;
    const attempts = st.attempts + 1;
    onAnswer(q.id, {
      selected, submitted: true, attempts, correct: isCorrect,
      showScaffold: !isCorrect && attempts >= 2
    });
  }
  function tryAgain() {
    setSelected(null);
    onAnswer(q.id, { ...st, selected: null, submitted: false });
  }

  const answered = st.submitted;
  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>
      {q.subForm && <div style={{ fontSize: 11, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>{q.subForm}</div>}
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 6 }}>{q.typeLabel}</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      <div style={{ display: "grid", gap: 8 }}>
        {q.options.map((opt, i) => {
          let bg = "#fff", border = "#D8D8D8";
          if (answered) {
            if (i === q.correctIndex) { bg = "#EEF6EC"; border = "#7EBF7E"; }
            else if (i === st.selected) { bg = "#FDEDED"; border = "#E39999"; }
          } else if (selected === i) { border = "#111"; }
          return (
            <button
              key={i}
              disabled={answered}
              onClick={() => setSelected(i)}
              style={{
                textAlign: "left", padding: "10px 12px", borderRadius: 8, border: "1.5px solid " + border,
                background: bg, cursor: answered ? "default" : "pointer", fontSize: 14, lineHeight: 1.5
              }}
            >
              <strong>{String.fromCharCode(65 + i)}.</strong> {opt.text}
            </button>
          );
        })}
      </div>
      {!answered && (
        <button
          disabled={selected === null}
          onClick={submit}
          style={{
            marginTop: 10, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
            background: selected === null ? "#E5E5E5" : "#111", color: selected === null ? "#999" : "#fff",
            cursor: selected === null ? "not-allowed" : "pointer"
          }}
        >Submit</button>
      )}
      {selected === null && !answered && (
        <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Select an option to enable Submit.</div>
      )}
      {answered && (
        <div style={{ marginTop: 12 }}>
          <div style={{
            padding: 10, borderRadius: 8,
            background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14
          }}>
            <strong>{st.correct ? "Correct" : "Incorrect"}</strong> — {st.correct ? q.correctCalibration : q.options[st.selected].wrongCalibration}
          </div>
          <p style={{ fontSize: 14, marginTop: 8 }}>{q.explanation}</p>
          <p style={{ fontSize: 13, color: "#555", marginTop: 4 }}><em>Where this generalizes:</em> {q.generalizes}</p>
          {st.showScaffold && !st.correct && (
            <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
              <strong style={{ fontSize: 13 }}>Scaffold — second attempt</strong>
              <p style={{ fontSize: 13.5, margin: "4px 0 0 0" }}>{q.scaffold}</p>
            </div>
          )}
          {!st.correct && (
            <button onClick={tryAgain} style={{ marginTop: 10, padding: "6px 14px", borderRadius: 8, border: "1px solid #111", background: "#fff", cursor: "pointer", fontSize: 13 }}>
              Try again
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function TDQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { value: "", submitted: false, offTarget: false };
  const [value, setValue] = useState(st.value);

  function submit() {
    const num = parseFloat(value);
    if (isNaN(num)) return;
    let ratio = num / q.target;
    if (ratio < 1) ratio = 1 / ratio;
    const withinTolerance = q.scoring === "pct"
      ? Math.abs(num - q.target) / q.target <= q.tolerancePct
      : ratio <= 2; // log-distance style: within 2x either direction counts
    onAnswer(q.id, { value, submitted: true, correct: withinTolerance, offTarget: ratio > 3 });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 6 }}>{q.typeLabel}</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      {q.skeleton && (
        <div style={{ background: "#FAFAFA", border: "1px dashed #ccc", borderRadius: 8, padding: 10, fontSize: 13, marginBottom: 8 }}>
          <strong>Decomposition skeleton:</strong> {q.skeleton}
        </div>
      )}
      {!st.submitted && (
        <>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input
              type="number"
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder={q.placeholder}
              style={{ padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 14, width: 160 }}
            />
            <span style={{ fontSize: 13, color: "#666" }}>{q.unit}</span>
          </div>
          <button
            disabled={value === ""}
            onClick={submit}
            style={{
              marginTop: 10, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: value === "" ? "#E5E5E5" : "#111", color: value === "" ? "#999" : "#fff",
              cursor: value === "" ? "not-allowed" : "pointer"
            }}
          >Submit estimate</button>
          {value === "" && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Enter a number to enable Submit.</div>}
        </>
      )}
      {st.submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ padding: 10, borderRadius: 8, background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14 }}>
            <strong>{st.correct ? "Within tolerance" : "Outside tolerance"}</strong> — your estimate: {st.value} {q.unit}; target: {q.target} {q.unit} ({q.targetLabel})
          </div>
          <p style={{ fontSize: 14, marginTop: 8 }}><strong>Anchor facts:</strong> {q.anchors}</p>
          <p style={{ fontSize: 14 }}><strong>Decomposition:</strong> {q.decomposition}</p>
          <p style={{ fontSize: 14 }}><strong>Bounds:</strong> {q.bounds}</p>
          <p style={{ fontSize: 14 }}><strong>Why the actual value lands here:</strong> {q.whyHere}</p>
          {st.offTarget && (
            <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
              <strong style={{ fontSize: 13 }}>Scaffold — you were off by more than 3x</strong>
              <p style={{ fontSize: 13.5, margin: "4px 0 0 0" }}>{q.misjudgedFactor}</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TGQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { choice: null, justification: "", submitted: false };
  const [choice, setChoice] = useState(st.choice);
  const [justification, setJustification] = useState(st.justification);
  const canSubmit = choice !== null && justification.length >= 15;

  function submit() {
    const correct = choice === q.correctAnswer;
    onAnswer(q.id, { choice, justification, submitted: true, correct });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>

          } else if (choice === val) { border = "#111"; }
          return (
            <button key={label} disabled={st.submitted} onClick={() => setChoice(val)}

              {label}
            </button>
          );
        })}
      </div>
      {!st.submitted && (
        <>
          <textarea
            value={justification}
            onChange={(e) => setJustification(e.target.value)}
            placeholder="Justify your answer in one sentence, naming the specific evidence (min 15 characters)..."

          <button

              marginTop: 8, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: !canSubmit ? "#E5E5E5" : "#111", color: !canSubmit ? "#999" : "#fff",
              cursor: !canSubmit ? "not-allowed" : "pointer"
            }}
          >Submit</button>
          {!canSubmit && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Choose True or False and write a 15+ character justification to enable Submit.</div>}
        </>
      )}

          <div style={{ padding: 10, borderRadius: 8, background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14 }}>

function TFQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { text: "", submitted: false, checks: [false, false, false] };
  const [text, setText] = useState(st.text);
  const [checks, setChecks] = useState(st.checks);

  function submit() {
    onAnswer(q.id, { text, submitted: true, checks });
  }
  function toggleCheck(i) {
    const next = checks.slice();
    next[i] = !next[i];
    setChecks(next);
    if (st.submitted) onAnswer(q.id, { ...st, checks: next });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0", background: "#FBFBFD" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>Pattern transfer</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      {!st.submitted && (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={"Write your transfer (min " + q.minLen + " characters). Name the principle, apply it non-trivially, and name a new failure mode."}
            style={{ width: "100%", minHeight: 100, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ fontSize: 12, color: text.length >= q.minLen ? "#2F6B2F" : "#999", marginTop: 4 }}>{text.length}/{q.minLen} characters minimum</div>
          <button
            disabled={text.length < q.minLen}
            onClick={submit}
            style={{
              marginTop: 8, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: text.length < q.minLen ? "#E5E5E5" : "#111", color: text.length < q.minLen ? "#999" : "#fff",
              cursor: text.length < q.minLen ? "not-allowed" : "pointer"
            }}
          >Submit</button>
        </>
      )}
      {st.submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10 }}>
            <p style={{ margin: 0, fontSize: 14 }}>{text}</p>
          </div>
          <p style={{ fontSize: 13, fontWeight: 700, marginTop: 10, marginBottom: 4 }}>Self-evaluation checklist</p>
          {[
            "Did I name the principle accurately?",
            "Is my application genuinely different from the original case?",
            "Is my failure mode new (not one already covered in this article)?"
          ].map((label, i) => (
            <label key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13.5, marginBottom: 4 }}>
              <input type="checkbox" checked={checks[i]} onChange={() => toggleCheck(i)} style={{ marginTop: 3 }} />
              {label}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

          {/* ============================ INTRO ============================ */}
          <div ref={(el) => (sectionRefs.current.intro = el)} id="intro">
            <SectionHeading id="intro">Introduction</SectionHeading>
            <p>
              A vector index is not a ranked list of algorithms from worse to better. It is a bet about
              which resource will run out first at your specific scale: memory, the time it takes to build
              the index, or the time it takes to answer one query. The two dominant strategies for
              searching billions of high-dimensional vectors are a <strong>partition index</strong> called
              IVF (Inverted File), which clusters vectors into buckets and searches only the nearest few
              buckets, and a <strong>graph index</strong> called HNSW (Hierarchical Navigable Small World),
              which lets a query hop from neighbor to neighbor across a web of connections. Meta's own
              Faiss library is the strongest evidence available for this principle, because Meta is the
              rare company that built and still maintains both index families inside one open-source
              library, and has published head-to-head benchmarks of IVF and HNSW on identical hardware, at
              an identical accuracy target, at very different data scales.
            </p>
            <p>
              Faiss launched in 2017 with nearest-neighbor search on billion-vector datasets that Meta
              reported as roughly 8.5 times faster than the best published result at the time (Meta
              Engineering, 2017). Spotify offers a second, independent, product-side version of the same
              choice: the company built and open-sourced a tree-based index called Annoy in 2013, used it
              for a decade to power Discover Weekly and Home, then rebuilt its recommendation search on a
              graph-based library after finding it roughly ten times faster at equal accuracy (Spotify
              Engineering, 2023). A third real data point, from the library Meta names as a direct
              comparison in its own 2017 launch post, is nmslib — a graph-based library that beat Faiss's
              classic partition-based methods on speed at roughly one million vectors, but needed
              "significantly more storage" to do it (Meta Engineering, 2017).
            </p>
            <p>
              Classical databases sidestep this entire problem. A lookup by exact key uses a hash table (a
              structure that jumps straight to a value using a computed shortcut) or a B-tree (a sorted,
              tree-shaped structure built for fast lookups), and returns an answer in roughly constant or
              logarithmic time — meaning the answer arrives about as fast no matter how large the table
              gets, with no approximation involved. Nearest-neighbor search in a high-dimensional embedding space has no such shortcut:
              an exact answer requires comparing the query to every stored vector, a cost that grows in
              direct proportion to how many vectors exist. Every fast approximate index in production today
              exists to avoid that comparison-every-vector cost, and every one of them buys that speed with
              a different kind of debt — a compression step that loses precision, a graph that is expensive
              to build, or a delete operation that no longer means what it means in a relational table. As
              this article will show, which debt is worth paying depends on scale in a way that is not
              stable: Meta's own numbers show the "fastest search" title changing hands between a
              100-million-vector test and a 5-million-vector test.
            </p>
            <p>
              This article addresses three questions. First, what are the two structurally different ways
              to build a vector index — partitioning versus graph navigation — and what specific resource
              does each one spend to go fast? Second, does one of the two really win at every scale, or does
              the answer change as data volume and dimensionality change, and by how much? Third, once one
              of these indexes is running in production, what ongoing operational cost — compression risk,
              distribution drift, or the cost of deleting a vector — does a launch-day benchmark chart never
              show?
            </p>
          </div>

          {/* ============================ BACKGROUND ============================ */}
          <div ref={(el) => (sectionRefs.current.background = el)} id="background">
            <SectionHeading id="background">Technical and Product Landscape</SectionHeading>
            <p>
              Before dedicated vector indexes existed, teams either ran a brute-force scan — comparing a
              query to every vector, an approach whose search time grows linearly with the size of the
              collection — or reached for libraries built for roughly a million vectors, a scale small
              enough that brute force plus a light index was tolerable. Meta's 2017 launch post for Faiss
              is explicit that this "small scale" category already had strong competition: nmslib,
              a predecessor in the same graph-based family as HNSW, "is faster than Faiss but requires
              significantly more storage" at around one million vectors (Meta Engineering, 2017). That
              one sentence contains the entire tension this article investigates: faster and smaller are
              not the same axis, and a team that only measures speed will miss the bill.
            </p>
            <p>
              The reason the bill exists at all is memory. A raw, uncompressed vector with 96 numbers,
              each stored as a 4-byte float (a common size for image and audio embeddings of that era),
              takes 384 bytes. One billion such vectors take about 384 gigabytes just for the raw numbers,
              before any index structure is added on top. Meta's own evaluation of Faiss on the Deep1B
              dataset — one billion images, each reduced to a descriptor vector — was explicitly bounded
              to "30 GB of RAM," a budget more than twelve times smaller than the raw data (Meta
              Engineering, 2017). That gap is not a rounding error; it is the reason Faiss's flagship
              billion-scale configuration used product quantization, a compression technique that replaced
              each vector with a 20-byte code (the "PQ20" in Meta's chosen index string,
              "OPQ20_80,IMI2x14,PQ20"), shrinking the raw 384 bytes down to 20 — small enough, along with
              some clustering overhead, to fit the stated budget.
            </p>
            <ChartCard
              chart={{
                id: "memchart",
                tier: "estimate",
                title: "Raw vs. Compressed Storage for 1 Billion 96-Dimensional Vectors",
                height: 280,
                note: "ESTIMATE: bytes-per-vector figures for \"raw float32\" and \"PQ20\" are arithmetic (96 × 4 bytes; 20-byte PQ code) from Meta's own stated encoding choices. The 30 GB budget line is a FACT stated directly in Meta Engineering, 2017.",

                      <XAxis type="number" label={{ value: "Gigabytes for 1B vectors", position: "insideBottom", offset: -5, fontSize: 11 }} />
                      <YAxis type="category" dataKey="name" width={160} tick={{ fontSize: 11 }} />
                      <Tooltip />
                      <Bar dataKey="bytes" radius={4}>
                        {memoryBudgetData.map((d, i) => <Cell key={i} fill={i === 2 ? "#D97706" : "#6B5CD6"} />)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Quantitative reasoning",
                    prompt: "Raw storage for 1 billion 96-dimensional vectors is about 384 GB; Meta's PQ20 encoding brings that to about 20 GB. Compute the compression ratio, then say which factor — vector count or dimensionality — would move that ratio more if Meta instead had to index 5 billion 768-dimensional vectors.",
                    authored: "384 ÷ 20 ≈ 19.2x compression. Vector count alone scales storage linearly in both the raw and compressed cases, so it does not change the ratio — going from 1B to 5B just multiplies both bars by 5. Dimensionality is what actually changes the ratio, because PQ code length (20 bytes) is a design choice independent of the source dimensionality, while raw storage scales directly with it: at 768 dimensions, raw storage per vector is 8x higher (768/96), so the same 20-byte code now represents a much larger compression ratio (roughly 153x) — meaning teams with higher-dimensional embeddings have more to gain from compression, not less."
                  },

                    authored: "768 dimensions x 4 bytes = 3,072 bytes/vector. 300,000,000 x 3,072 bytes ≈ 922 GB uncompressed — about 14 times larger than a 64 GB machine. Compression (or sharding across many machines) is mandatory, not optional, at this scale; a team that assumes 'we'll just add more RAM' the way they might for a relational cache is applying a classical scaling assumption that breaks down by more than an order of magnitude here."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}

            <p>
              Compression was not the only lever Meta pulled. The 2017 post also reports that GPU
              acceleration made a large difference on its own: "Faiss GPU is typically 5-10x faster on a

              Pascal-generation P100 hardware "pushes this to 20x+" (Meta Engineering, 2017). That
              historical detail matters for what follows, because it establishes that hardware, not just
              algorithm choice, is one of the resources being traded — and it sets up a direct callback:
              eight years later, in 2025, Meta re-ran comparable benchmarks with newer GPU hardware and
              found the size of the GPU advantage differs sharply by index family, a result covered in the
              next section.
            </p>
            <ChartCard
              chart={{
                id: "gpuchart",
                tier: "fact",
                title: "GPU Acceleration Over CPU, by Hardware Generation (Meta Engineering, 2017)",
                height: 220,
                note: "FACT: ranges as stated in Meta's 2017 launch post. Bars show the low and high end of Meta's reported speedup range for each GPU generation, relative to Faiss CPU.",
                render: () => (
                  <ResponsiveContainer>
                    <BarChart data={gpuSpeedupData}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis dataKey="name" tick={{ fontSize: 10.5 }} />
                      <YAxis label={{ value: "Speedup over CPU (x)", angle: -90, position: "insideLeft", fontSize: 11 }} />
                      <Tooltip />
                      <Legend />
                      <Bar dataKey="low" name="Low end" fill="#B9AEEF" radius={4} />
                      <Bar dataKey="high" name="High end" fill="#6B5CD6" radius={4} />
                    </BarChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Qualitative / mechanism",
                    prompt: "The reported speedup range roughly doubles between the Maxwell Titan X generation (5-10x) and the Pascal P100 generation (20x+). Faiss GPU code is described as a 'drop-in replacement' for the CPU version. Why would the same software show such a different speedup on newer hardware, rather than the speedup being a fixed property of the algorithm?",
                    authored: "Faiss's GPU implementation is built around saturating memory bandwidth and floating-point throughput (the 'roofline model' Meta cites), so its actual speedup is bounded by whatever the specific GPU's bandwidth and compute ceiling allow — it is a hardware-relative number, not an algorithm-intrinsic one. A newer GPU generation with higher memory bandwidth and more floating-point units raises that ceiling, so the same kernel runs closer to a higher limit, without any change to the underlying index math."
                  },
                  {
                    kind: "So-what / threshold",
                    prompt: "If a team's search latency budget is fixed and hardware speedups like this one become available roughly every two GPU generations, at what point should a team decide to invest engineering effort in a GPU port versus simply waiting for the next hardware generation to arrive?",
                    authored: "The threshold is whether the CPU-based latency already violates a hard product requirement today (e.g., a sub-100ms user-facing search) — if it does, waiting is not an option and the GPU port should happen now, since the benefit is immediate and compounding as future hardware arrives 'for free.' If the CPU latency merely feels slow but is inside budget, the rule of thumb is to wait, because a GPU port is non-trivial engineering investment that a future hardware generation may make partially redundant."
                  }
                ]
              }}

              onInterpSubmit={submitInterp}
            />
            <p>
              By 2025, Meta and NVIDIA had jointly integrated a new library, NVIDIA cuVS, directly into
              Faiss, adding GPU-native implementations of both the partition family (IVF) and a new
              GPU-native graph index called CAGRA, built specifically to accelerate the same kind of search
              HNSW does on CPU (Meta Engineering, 2025). That collaboration produced the benchmark this
              article leans on most heavily: a same-hardware, same-recall-target comparison of IVF Flat,
              IVF PQ, and HNSW/CAGRA, run on two datasets of very different scale and shape. The next three
              sections work through what that comparison actually shows.
            </p>
            <Glossary items={[
              { term: "IVF (Inverted File index)", def: "A vector index that first clusters all vectors into groups (partitions) and, at search time, only compares the query against vectors in the nearest few groups." },
              { term: "HNSW (Hierarchical Navigable Small World)", def: "A graph-based vector index where each vector is a node connected to nearby neighbors; a search walks the graph hop by hop toward the closest matches." },
              { term: "Product quantization (PQ)", def: "A compression method that replaces a vector with a short numeric code (e.g., 20 bytes) built from smaller sub-vectors, trading some precision for a large reduction in memory." },
              { term: "Recall@k", def: "The fraction of the true k nearest vectors that a search actually returns; 100% recall means the approximate search found exactly what an exact, brute-force search would have found." },
              { term: "QPS (queries per second)", def: "How many search requests a system can answer in one second — a standard measure of search throughput." }
            ]} />
          </div>

          {/* ============================ RQ1 ============================ */}
          <div ref={(el) => (sectionRefs.current.rq1 = el)} id="rq1">
            <SectionHeading id="rq1">RQ1 — Two Structures, Two Budgets</SectionHeading>
            <p>
              The claim to defend in this section: a vector index's structure is a bet about which resource
              — build-time compute, steady-state memory, or tolerance for drifting data — it spends to
              answer queries fast, not a ranking from worse to better. IVF and HNSW are not two attempts at
              the same solution; they are two different answers to the question "how do we avoid comparing
              the query against every vector?"
            </p>
            <p>
              IVF's answer is to cluster first. Before any search happens, IVF runs a clustering algorithm
              (k-means) over a sample of the data to define a fixed number of partitions, each represented
              by a centroid — a kind of average vector for everything nearby. A query is compared against
              the centroids first, routed to the handful of closest partitions, and only then compared
              against the actual vectors inside those partitions. Meta's own numbers show what this training
              step costs at scale: building the Deep1B index required "k-means clustering 67.1 million
              120-dim vectors to 262,144 centroids," a step that alone took 139 minutes on four Titan X GPUs
              or 43.8 minutes on eight newer P100 GPUs (Meta Engineering, 2017). That clustering step is a
              one-time investment that pays for a small, predictable search — but only for as long as new
              data keeps resembling the data the centroids were trained on.
            </p>
            <p>
              HNSW's answer is to build a map instead of buckets. Every vector becomes a node in a graph,
              linked to a limited number of nearby neighbors, arranged in layers so that a search can start
              at a sparse top layer and descend into denser layers as it gets closer to the answer — the
              query "walks" the graph rather than being routed to a pre-defined region. There is no
              clustering step to train, and no centroid to go stale: a new vector is simply linked into the
              existing graph at insertion time, node by node. That incremental quality is exactly why HNSW
              never needs retraining the way IVF does — and exactly why, as later sections show, building
              that graph in the first place costs far more compute than building an IVF partition.
            </p>
            <ChartCard
              chart={{
                id: "archchart",
                tier: "illustration",
                title: "Two Structures for Avoiding a Full Scan: IVF Partitions vs. HNSW Graph",
                height: 330,
                note: "ILLUSTRATION: a generic structural diagram, not a specific company's exact implementation or vector count. Illustrative values — not reported statistics.",
                render: () => <ArchitectureSVG />,
                interp: [
                  {
                    kind: "Qualitative / mechanism",
                    prompt: "Both structures skip comparing the query against most of the dataset — IVF by routing to a few clusters, HNSW by hopping a few graph edges. So why does IVF need an offline training phase (k-means over a data sample) that HNSW does not need at all?",
                    authored: "IVF's speed depends on a global map of the data (the centroids) being representative of where vectors actually cluster, and that map can only be computed by looking at the data's overall distribution in advance — there is no way to define 'the nearest few buckets' without first deciding where the buckets are. HNSW never needs a global map: each new vector only has to be linked to whichever nearby nodes already exist in the graph at the moment it is inserted, which is a purely local decision that requires no prior knowledge of the whole dataset's shape."
                  },
                  {
                    kind: "So-what / threshold-decision-rule",
                    prompt: "If a company's corpus is rewritten by more than 20% of its vectors every day (a fast-churning product catalog, for example), which structural property in this diagram — IVF's trained centroids or HNSW's incrementally-built graph — becomes the more expensive one to keep accurate, and what decision rule would you set for when to force a full IVF retrain?",
                    authored: "IVF's trained centroids become the more expensive property to keep accurate, because a centroid computed on yesterday's distribution routes today's queries to buckets that may no longer contain the closest vectors once the underlying data has shifted meaningfully. A reasonable decision rule is to retrain whenever a sampled recall check against a held-out query set drops below a pre-agreed floor (for example, 5 percentage points under the launch-day recall), rather than retraining on a fixed calendar schedule that ignores how fast the data is actually drifting."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <p>
              Evidence against a simple "HNSW is just better" reading already exists inside Meta's own 2017
              post: at the roughly one-million-vector scale Meta calls "small scale," the graph-based
              nmslib beats Faiss's classic partition-based methods on speed, but needs "significantly more
              storage" to do it (Meta Engineering, 2017). Even at the very small end of the scale range,
              the tradeoff between speed and memory is already visible — before billion-scale compression
              enters the picture at all. This is the non-obvious part for a reader coming from classical
              system design: there is no dimension along which one index family is simply better across the
              board, because being faster and using less memory are two separate axes, and every real index
              sits somewhere on a curve between them, not at a single best point.
            </p>
            <p>
              A related, complementary technique worth knowing about even though it does not resolve the
              IVF-versus-HNSW choice on its own: optimized product quantization (OPQ), the "OPQ20_80" in
              Meta's own chosen index string for Deep1B. OPQ is a pre-processing rotation applied to vectors
              before they are quantized, designed to redistribute the information each of the PQ sub-vectors
              has to encode, which improves the accuracy of the compressed representation without changing
              the compression ratio at all. It is a reminder that "IVF vs. HNSW" is not really a two-option
              menu — most production systems combine a routing/graph structure with a separate, independent
              compression choice layered on top, and the two decisions can be tuned somewhat independently.
            </p>
            <MCQ
              q={{
                id: "mcq-rq1",
                typeLabel: "T-A — Architecture and system implication",
                prompt: "Building the Deep1B IVF index's k-means clustering step took 139 minutes on four Titan X GPUs but only 43.8 minutes on eight P100 GPUs (Meta Engineering, 2017) — a change that doubled the GPU count and upgraded the GPU generation at the same time. What does this comparison NOT let you conclude, and what would a team need to isolate before recommending 'just buy newer GPUs' with a fixed hardware budget?",
                options: [
                  { text: "It does not tell you how much of the roughly 3.2x speedup came from GPU count versus GPU generation — isolating that needs a same-generation, count-only test first.", wrongCalibration: "" },
                  { text: "It proves GPU generation is always the dominant factor in clustering speed, since the faster of the two runs happened to use the newer hardware generation.", wrongCalibration: "this is extrapolating from a single comparison: it stretches one two-variable data point into a universal rule about generation always dominating, the same error as projecting a short trend far beyond what it actually measured." },
                  { text: "Since the underlying vectors and target centroid count stayed identical in both runs, the two clustering times are not really comparable, so no conclusion about GPU count or generation can be drawn here at all.", wrongCalibration: "this is applying a classical software assumption: it treats a legitimate same-workload comparison as invalid, when Meta's own benchmark reports and compares these two clustering times directly for the same indexing job." },

                scaffold: "List the two things that changed between the 139-minute run and the 43.8-minute run. Is there any row in Meta's own numbers where only one of those two things changed while the other stayed fixed?",

              onAnswer={submitMcq}
            />
            <TDQuestion
              q={{
                id: "td1",
                typeLabel: "T-D — Engineering estimation (Fermi, scaffolded)",
                prompt: "Meta's 2017 benchmark reports Faiss reaching a 1-recall@1 of 40% in under 2 milliseconds per query on a single CPU core when searching Deep1B (1 billion vectors) — about 500 queries per second (QPS) per core (Meta Engineering, 2017). If a company needed to sustain 50,000 QPS company-wide at this same recall level, estimate the minimum number of CPU cores required, ignoring replication and failover overhead. Tolerance: within 10% of the direct arithmetic answer — this is a division, not a genuine order-of-magnitude guess.",
                skeleton: "cores needed = total QPS required ÷ QPS per core",
                placeholder: "e.g. 100",

                targetLabel: "50,000 ÷ 500 = 100 cores, minimum",
                scoring: "pct",
                tolerancePct: 0.10,

                bounds: "Lower bound: 100 cores, if load is perfectly even and no core is ever idle or degraded. Upper bound in practice: 200-400 cores once typical 2-4x headroom for redundancy and tail latency is added.",
                whyHere: "The 500 QPS/core figure is measured at only 40% recall — a level far below what most production systems would accept — so a real deployment chasing higher recall would need meaningfully more cores than this exercise's clean arithmetic suggests, on top of the redundancy headroom.",

              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
            <PrincipleGate sectionId="rq1" authored="An index's structure is a bet about which resource — build-time compute, steady-state memory, or drift tolerance — it spends to answer queries fast, not a ranking from worse to better; IVF trades a trained, driftable partition for compression that fits under a fixed memory budget, while HNSW trades a graph that never needs retraining for a build cost that grows far faster than the data it indexes." state={principleState} onSubmit={submitPrinciple} />
            <TFQuestion
              q={{
                id: "tf1",
                minLen: 50,
                prompt: "The principle from this section: an index's structure determines which resource it trades away, not how 'good' it is in the abstract. Apply this to a fraud-detection system that must re-score transaction embeddings within 50 milliseconds, and whose transaction-pattern distribution shifts every time a new merchant category becomes popular. What would a PM or CTO choose, and what new failure mode would they face that does not appear in the FAISS/Deep1B example (which is not real-time and does not have to react to sudden distribution shifts)?"
              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
            <p>
              The evidence in this section supports treating index choice as a resource bet, not a quality
              ranking: even at the roughly one-million-vector scale Meta calls "small," before compression
              or billion-scale considerations enter the picture at all, a graph-based index already beats a
              partition-based one on speed while needing more memory to do it. What this section's evidence
              does not yet show is how large that tradeoff grows as scale increases by two more orders of
              magnitude — a question the next section takes up directly, using Meta's own 2025 head-to-head
              numbers.
            </p>
            <Glossary items={[
              { term: "k-means / centroid", def: "A clustering method that finds a fixed number of representative center points (centroids) so that every data point can be assigned to its nearest center." },
              { term: "OPQ (optimized product quantization)", def: "A pre-processing rotation applied to vectors before compressing them, which improves compressed accuracy without changing how many bytes each vector takes." },
              { term: "nprobe", def: "A query-time setting in an IVF index controlling how many of the nearest partitions are searched; higher nprobe means higher recall and higher latency." }
            ]} />
          </div>

          {/* ============================ RQ2 ============================ */}
          <div ref={(el) => (sectionRefs.current.rq2 = el)} id="rq2">
            <SectionHeading id="rq2">RQ2 — Does One Index Really Win at Every Scale?</SectionHeading>
            <p>
              The claim to defend here: no public benchmark can declare a permanent winner between HNSW
              and IVF, because the ranking itself is scale-dependent, and Meta's own 2025 numbers prove it
              by reversing between two test sets run on identical hardware. The benchmark compares three
              CPU-based indexes — IVF Flat, IVF PQ, and HNSW — against their GPU-accelerated counterparts,
              on two datasets: 100 million 96-dimensional vectors (a subset of Deep1B) and 5 million
              1,536-dimensional vectors (OpenAI's text-embedding-ada-002 model output), all measured at a
              fixed 95% recall@10 target (Meta Engineering, 2025).
            </p>
            <ChartCard
              chart={{
                id: "buildchart",
                tier: "fact",
                title: "Index Build Time by Type and Scale, at 95% Recall@10 (Meta Engineering, 2025, classic CPU implementations)",
                height: 300,
                note: "FACT: seconds to build each index type on an Intel Xeon Platinum 8480CL system, from Meta's own cuVS-bench results, classic (non-GPU-accelerated) Faiss implementations only.",
                render: () => (
                  <ResponsiveContainer>
                    <BarChart data={buildTimeData}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis dataKey="index" tick={{ fontSize: 11 }} />
                      <YAxis label={{ value: "Build time (seconds)", angle: -90, position: "insideLeft", fontSize: 10 }} />
                      <Tooltip />
                      <Legend />
                      <Bar dataKey="5M x 1536" fill="#B9AEEF" radius={4} />
                      <Bar dataKey="100M x 96" fill="#6B5CD6" radius={4} />
                    </BarChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Quantitative reasoning",
                    prompt: "On the 100M-vector dataset, classic CPU HNSW took 3,322.1 seconds to build, versus 168.2 seconds for classic CPU IVF PQ. On the 5M-vector dataset, HNSW took 1,106.1 seconds versus IVF PQ's 42.0 seconds. Compute the build-time ratio (HNSW ÷ IVF PQ) at each scale, and say whether that ratio grows or shrinks as scale increases from 5M to 100M.",
                    authored: "At 5M: 1,106.1 ÷ 42.0 ≈ 26.3x. At 100M: 3,322.1 ÷ 168.2 ≈ 19.8x. The ratio actually shrinks as scale grows from 5M to 100M, even though the absolute time gap widens by orders of magnitude — a result that runs against the naive assumption that HNSW's relative build-time disadvantage would only get worse at bigger scale."
                  },
                  {
                    kind: "So-what / threshold-decision-rule",
                    prompt: "If your team can only afford a 2-hour (7,200-second) nightly maintenance window on a single CPU host to fully rebuild a 100-million-vector index from scratch, which index type in this chart fits inside that window, and by what safety margin?",
                    authored: "IVF PQ (168.2s) fits with roughly a 42.8x safety margin (7,200 ÷ 168.2). Classic CPU HNSW (3,322.1s, about 55 minutes) also technically fits inside a 2-hour window, but with only about a 2.2x margin — far less slack for any single host, and a margin that a single order-of-magnitude corpus growth would likely erase entirely."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <ChartCard
              chart={{
                id: "latencychart",
                tier: "fact",
                title: "Search Latency by Index Type and Scale, at 95% Recall@10 (Meta Engineering, 2025, classic CPU implementations)",
                height: 300,
                note: "FACT: milliseconds per single query at 95% recall@10, classic (non-GPU-accelerated) Faiss implementations, same benchmark as the build-time chart above.",
                render: () => (
                  <ResponsiveContainer>
                    <BarChart data={searchLatencyData}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis dataKey="index" tick={{ fontSize: 11 }} />
                      <YAxis label={{ value: "Search latency (ms)", angle: -90, position: "insideLeft", fontSize: 10 }} />
                      <Tooltip />
                      <Legend />
                      <Bar dataKey="5M x 1536" fill="#B9AEEF" radius={4} />
                      <Bar dataKey="100M x 96" fill="#6B5CD6" radius={4} />
                    </BarChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Causal / comparative",
                    prompt: "Classic CPU IVF PQ is faster than classic CPU HNSW on the 100M-vector dataset (0.49ms vs 0.56ms), but slower on the 5M-vector dataset (1.78ms vs 0.71ms) — the same two implementations, reversed. What does this reversal tell you about trusting a single 'HNSW is faster than IVF' rule?",
                    authored: "Because the same two CPU implementations flip rank between the two tests, the ranking cannot be a fixed property of the algorithms themselves — it must depend on something that differs between the two datasets, and here that is both scale (100M vs 5M vectors) and dimensionality (96 vs 1,536) at once. A rule like 'HNSW is always faster' is an overgeneralization from whichever single benchmark a team happened to see first; the two variables are confounded in this comparison, so neither can be credited alone without a controlled test that holds one constant."
                  },
                  {
                    kind: "Quantitative reasoning",
                    prompt: "GPU acceleration cut IVF PQ's search latency by 8.1x on the 5M dataset (1.78ms → 0.22ms) but only 2.9x on the 100M dataset (0.49ms → 0.17ms). Estimate the total compute-time saved per day if a service runs 10 million queries a day against the 100M-vector index, using the absolute (not relative) latency reduction, and explain why the smaller relative speedup at 100M scale does not mean GPU acceleration matters less there.",
                    authored: "Absolute reduction at 100M: 0.49ms − 0.17ms = 0.32ms per query. 10,000,000 queries x 0.32ms ≈ 3,200,000ms ≈ 3,200 seconds ≈ about 53 minutes of compute time saved per day. Even though the relative speedup (2.9x) looks smaller than the 5M case's 8.1x, the absolute time saved compounds at volume into a real, budget-relevant number — relative multiples and absolute savings are different quantities, and a team fixated on the multiple alone would underrate a change that is still operationally significant."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <p>
              This reversal is the single most important data point in this article, because it directly
              contradicts the instinct a reader might otherwise bring from a generic "graph indexes beat
              partition indexes" impression. On the 100-million-vector, 96-dimension dataset, classic CPU
              IVF PQ is the fastest searcher of the three at 0.49 milliseconds; HNSW comes in second at
              0.56 milliseconds. On the 5-million-vector, 1,536-dimension dataset, the order flips: HNSW is
              fastest at 0.71 milliseconds, while IVF PQ trails at 1.78 milliseconds. Nothing about either
              algorithm changed between the two tests — the same code, on the same CPU, produced the
              opposite ranking, because the two test sets differ in more than one way at once.
            </p>
            <p>
              That last point is worth being precise about, because it is easy to overstate the lesson.
              The 100M and 5M test sets differ in both vector count and dimensionality simultaneously (96
              versus 1,536 dimensions), so this single benchmark cannot cleanly prove that "scale alone"
              flips the ranking — dimensionality is doing an unknown share of the work too. What the
              benchmark can prove, honestly, is narrower and still useful: a speed ranking measured on one
              corpus does not transfer automatically to a corpus of a different shape, whether that
              difference is size, dimensionality, or both. A team that wants to know which factor matters
              more for their own data would need to hold one variable fixed and vary the other — a test
              Meta's own published post does not run.
            </p>
            <p>
              Build time reveals a second, complementary lesson: HNSW's cost is heavily front-loaded. At
              both scales, building the HNSW index costs vastly more wall-clock time than building either
              IVF variant — 19.8 times longer than IVF PQ at 100M vectors, 26.3 times longer at 5M vectors.
              GPU acceleration narrows this gap substantially (Meta and NVIDIA's CAGRA index cuts HNSW's
              build time by 6.4x at 100M and 12.3x at 5M) but does not close it. This means the true cost
              of choosing HNSW is not fully captured by a search-latency chart at all — a team optimizing
              purely for query speed could pick HNSW and then be surprised, months later, by how expensive
              nightly or hourly index rebuilds turn out to be.
            </p>
            <p>
              An adjacent technique worth knowing, because it changes how a team should read benchmarks
              like this one: hybrid indexes that combine both structures, such as HNSW built directly on
              top of IVF-PQ-compressed vectors (sometimes labeled IVFPQ+HNSW in the wider ANN literature),
              designed to get graph-level search speed while keeping IVF-level memory compression. These
              hybrids do not appear in Meta's own head-to-head chart above, which compares the two families
              as pure alternatives — a reminder that "IVF vs. HNSW" understates the real design space, and
              that a team unhappy with the tradeoff curve here has more options than picking one pure family.
            </p>
            <MCQ
              q={{
                id: "mcq-rq2",
                typeLabel: "T-B — Technical trend reasoning",
                prompt: "Even with GPU acceleration, Meta's own numbers show CAGRA (HNSW's GPU-native counterpart) needs roughly 519 seconds to build the 100M-vector index (3,322.1s ÷ 6.4x speedup), while classic CPU IVF PQ needs only 168.2 seconds for the same job. What does this most likely indicate about whether GPU acceleration alone can make HNSW-family indexes competitive with IVF PQ on build time at this scale?",
                options: [
                  { text: "Because CAGRA's build time (about 519 seconds) is far lower than classic HNSW(CPU)'s (3,322.1 seconds), GPU acceleration has already made HNSW faster to build than any IVF variant at every scale.", wrongCalibration: "this is extrapolating from a single comparison: it generalizes from the 100M-scale row to 'every scale' while ignoring this article's own 5M-scale row, where the relative ranking looks different again." },
                  { text: "GPU acceleration narrows but does not close the build-time gap — CAGRA's accelerated build (about 519s) is still roughly 3x slower than IVF PQ's 168.2s, so hardware alone can't fully offset HNSW's cost.", wrongCalibration: "" },
                  { text: "Since CAGRA is GPU-native and IVF PQ's classic row is CPU-only, the two build times are not a valid comparison, so no conclusion about relative build cost can be drawn here at all.", wrongCalibration: "this is applying a classical software assumption: it treats a cross-hardware comparison as automatically invalid, when Meta's own benchmark explicitly reports and compares these two figures side by side." },
                  { text: "The 6.4x build-time speedup proves CAGRA's search latency must also run 6.4x faster than classic CPU HNSW's search latency, since build time and search latency scale together on the same hardware.", wrongCalibration: "this is confusing one rate for another: build-time speedup and search-latency speedup are reported in this article as two separate, different multiples, and one cannot be inferred from the other." }
                ],
                correctIndex: 1,
                correctCalibration: "this generalizes to any 'just add GPUs' proposal: hardware acceleration narrows a structural cost gap, but only a design change closes it entirely.",
                explanation: "CAGRA's GPU-accelerated build time (roughly 519 seconds, derived from HNSW(CPU)'s 3,322.1 seconds divided by Meta's reported 6.4x speedup) is still about 3 times slower than classic CPU IVF PQ's 168.2 seconds at the same 100M scale. GPU acceleration is real and substantial, but it does not fully offset HNSW's structurally more expensive build process — a team hoping newer hardware alone would make HNSW's build time match IVF PQ's would still be disappointed at this scale.",

              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
            <TDQuestion

          <div ref={(el) => (sectionRefs.current.rq3 = el)} id="rq3">
            <SectionHeading id="rq3">RQ3 — The Operational Bill: Compression, Drift, and Deletion</SectionHeading>
            <p>
              The claim to defend here: the operational cost of running an ANN index in production —
              compression risk, distribution drift, and above all the cost of deleting a vector — is
              invisible on a launch-day benchmark chart, because both HNSW and IVF defer real deletion to
              an asynchronous cleanup process instead of removing data immediately. A chart showing search
              latency at launch says nothing about what happens six months later, after a corpus has
              absorbed millions of updates and deletions.
            </p>
            <p>
              Spotify's own migration from Annoy (a tree-based index the company built and open-sourced in
              2013) to Voyager (built on the graph-based hnswlib) is real, product-level evidence for the
              compression-versus-speed side of this tradeoff. Spotify reports that Voyager delivers "more
              than 10 times the speed of Annoy (at the same recall) or up to 50% more accuracy (at the same
              speed)," while using "up to 4 times less memory than Annoy," and 16 times less memory than the
              underlying hnswlib library needed during index construction (Spotify Engineering, 2023). Those
              numbers matter for a specific reason beyond the raw multiples: Spotify explicitly names "cost"
              as one of its four selection criteria alongside speed and accuracy, stating plainly that "the
              most advanced nearest-neighbor algorithms are incredibly fast and produce extremely high-quality
              output" but "often require large amounts of memory," and that "for most use cases, extreme
              accuracy can be sacrificed for a significant decrease in cost" (Spotify Engineering, 2023).
            </p>

                    kind: "So-what / build-buy-partner",
                    prompt: "hnswlib already had more than 700,000 downloads a month before Spotify built Voyager, and switching to Voyager required breaking hnswlib's own on-disk format and API compatibility. Given that sacrifice, what does this imply about when a company should fork or rebuild a widely-used open-source dependency internally instead of simply adopting the popular version as-is?",
                    authored: "The sacrifice ratio favors forking only when the popular dependency's stability guarantees (here, hnswlib's backward-compatibility constraints as a widely-depended-on library) directly conflict with changes a company needs to make at its own scale — Spotify could not make architectural changes to hnswlib without breaking its huge existing user base, so building a new, compatible-on-Spotify's-own-terms library was the only path to both keep the performance gains and control the roadmap. A company should default to adopting the open-source version as-is unless it can name a specific, recurring change it needs that the upstream maintainers cannot safely make."
                  }

              onInterpSubmit={submitInterp}
            />
            <p>
              The Voyager numbers describe a static comparison: one snapshot of accuracy, speed, and
              memory, measured once. What that comparison cannot show is what happens as a live corpus
              keeps growing under a fixed configuration. An independently reproducible benchmark, built on
              FAISS's own IndexFlatL2 (exact) and IndexHNSWFlat implementations, measured exactly that: 200,000
              CLIP image embeddings from the LAION-Aesthetics dataset, indexed in increments of 50,000, with
              recall measured against 500 held-out caption queries (Sarkar, 2026, Towards Data Science). The
              result is uncomfortable for any team that only monitors latency: HNSW's search time barely
              moved as the corpus grew (about 0.075-0.085 milliseconds at ef_search=10, across all four
              corpus sizes from 50,000 to 200,000), while recall at that same fixed setting dropped by more
              than 10 percentage points over the same growth — with no errors, no exceptions, and a latency
              dashboard that would report the system as perfectly healthy the entire time (Sarkar, 2026).
            </p>
            <ChartCard
              chart={{
                id: "growthchart",
                tier: "fact",
                title: "Search Latency as Corpus Grows: Flat (exact) vs. HNSW at Two ef_search Settings (Sarkar, 2026, reproducible FAISS benchmark)",

                      <Line type="monotone" dataKey="HNSW ef=160" stroke="#B9AEEF" strokeWidth={2} dot={{ r: 3 }} />
                    </LineChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Causal / comparative",
                    prompt: "HNSW's search latency stayed nearly flat (about 0.075-0.085ms) as the corpus grew from 50,000 to 200,000 vectors at ef_search=10, while Flat (exact) search grew linearly from 5.14ms to 18.41ms. Yet the source reports recall at fixed ef_search dropped by more than 10 percentage points over that same growth. What does the stable latency number hide, and why can't you infer 'recall is fine' from 'latency is fine'?",
                    authored: "Latency and recall measure two completely different things: how long the search takes, versus whether it found the right answers. A fixed ef_search explores a fixed-size candidate list regardless of how densely the vector space fills up, so the search keeps returning an answer in the same amount of time — but as the space gets more crowded, that same fixed-size exploration increasingly misses true nearest neighbors that would have needed a wider search to find. Stable latency only proves the search kept running fast; it says nothing about whether it kept running correctly."
                  },
                  {
                    kind: "So-what / kill-criteria",
                    prompt: "Given that recall degraded silently, with no errors and no latency change, what specific monitoring signal would you put in place as a kill-criterion or alert for a production RAG system relying on a fixed-ef_search HNSW index, since neither error logs nor a latency dashboard would ever catch this?",
                    authored: "The kill-criterion has to be a direct, periodic recall@k measurement against a small held-out set of queries with known correct answers — sampled on a schedule (e.g., weekly) and compared to the recall measured at launch — because this is the only signal that actually tracks correctness rather than speed or error rate. An alert should fire when sampled recall drops more than a stated number of percentage points below its launch-day baseline, at which point ef_search should be increased or the index re-tuned, rather than waiting for a user complaint to reveal the problem."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <p>
              Deletion is the sharpest version of this same theme, because it breaks an assumption most
              engineers bring from relational databases without ever examining it: that a "delete" call
              means the data is gone. Neither HNSW nor IVF can honor that assumption cheaply. In an HNSW
              graph, removing a node outright would break every path that used to run through it, so
              production implementations instead "set a deleted flag, keep the node in the graph for
              traversal, and filter it out of results at query time" — a tombstone, not a removal. IVF
              behaves the same way in spirit: it "marks entries within a partition and reclaims on rewrite"
              rather than deleting immediately (both descriptions from Mixpeek's own technical account of
              how ANN indexes handle deletion, 2026). Weaviate's own product documentation confirms this is
              not a one-vendor quirk: its HNSW implementation ships a configurable cleanup process
              (`cleanupIntervalSeconds`, defaulting to 300 seconds) specifically because, "as the index
              grows in size, the cleanup process may take longer to complete and require more resources,"
              to the point that Weaviate's own tuning guidance for a 300-million-object shard recommends
              deleting one million to ten million tombstones per cleanup cycle just to keep up (Weaviate
              Documentation, 2026).
            </p>
            <p>
              A related, complementary approach worth knowing about, because it sidesteps the tombstone
              problem rather than managing it: crypto-shredding, where each subject's vectors are encrypted
              under a key unique to that subject, and "deletion" means destroying the key rather than
              touching the index at all — every copy of the data, including backups, becomes unreadable the
              instant the key is destroyed (Mixpeek, 2026). This converts an index-cleanup problem into a
              key-management problem, which several data-governance teams consider an easier problem to
              audit — but it has to be designed in before any data is stored, and does not retroactively fix
              an index that already holds unencrypted vectors.
            </p>
