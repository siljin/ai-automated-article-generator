            <Glossary items={[
              { term: "Tombstone", def: "A marker left on a deleted item inside an index, so the item is hidden from search results immediately while the actual data stays in memory or on disk until a later cleanup step removes it." },
              { term: "Compaction / cleanup sweep", def: "A periodic background process that physically removes tombstoned (marked-deleted) items from an index, running on its own schedule rather than in response to any single delete request." },
              { term: "ef_search", def: "A query-time setting in HNSW controlling how many candidate nodes the search explores before returning results; higher values raise both recall and latency." },
              { term: "Crypto-shredding", def: "A deletion method where data is encrypted per-subject, and 'deleting' the data means destroying that subject's encryption key, making every copy of the data unreadable at once." }
            ]} />
          </div>

          {/* ============================ WHAT BROKE ============================ */}
          <div ref={(el) => (sectionRefs.current.brokewhat = el)} id="brokewhat">
            <div style={{ background: "#FEF2F2", border: "1px solid #FCA5A5", borderRadius: 14, padding: 24, marginTop: 40 }}>
              <SectionHeading id="brokewhat">What Broke</SectionHeading>
              <p>
                On August 17, 2026, the vector-search vendor Mixpeek published its own account of a bug in
                its production platform, fixed that same day: a user deleted a collection, and the
                point-level cleanup that was supposed to run immediately afterward did not finish. Because the
                system retains an incomplete deletion as a tombstone so a retry sweep can finish the job
                later, the collection entered an inconsistent state for up to an hour, until the next hourly
                sweep ran. During that window, a DELETE request against the collection returned a normal
                200 success response. A GET request for the same collection returned 404 Not Found. And a
                POST request to create a new collection with that same name was rejected, because the
                system still matched the tombstoned record by name and reported that it "already exists"
                (Mixpeek, 2026). Three different API endpoints each gave a locally correct answer, and the
                three answers, taken together, made no sense.
              </p>
              <p>
                The assumption that failed is one most engineers never think to name, because it is true
                almost everywhere else in their stack: that a success response from a delete operation
                means the deletion is complete and every other endpoint will immediately agree. That
                assumption is safe for a classical relational database, where a row delete happens inside a
                single transaction and every subsequent read sees the same, consistent result. It is not
                safe for an ANN index, because — as this article's RQ3 section showed — both HNSW and IVF
                structurally cannot remove an entry the instant a delete call arrives; they can only mark it
                and wait for a later sweep. Mixpeek's own explanation of the mechanism generalizes past
                their specific bug: "removing a node would break the paths that run through it, so
                implementations generally do not," and instead "set a deleted flag, keep the node in the
                graph for traversal, and filter it out of results at query time" (Mixpeek, 2026). The team's
                API contract had been built around the classical assumption; the storage layer underneath it
                had not.
              </p>
              <IncidentTimelineSVG />
              <p style={{ fontSize: 13, color: "#7F1D1D", marginTop: 4 }}>
                <em>Sequence reconstructed from Mixpeek's own account of a bug fixed on 2026-08-17 (Mixpeek, 2026).</em>
              </p>
              <div style={{ margin: "20px 0" }}>
                <InterpretationPrompt
                  chartId="incidentchart" index={0}
                  kindLabel="So-what / kill-criteria"
                  prompt="Given that DELETE, GET, and POST each returned a locally-correct but mutually incoherent answer during the hour before the sweep ran, what single change to the API contract — not the index internals — would have caught this incoherence before a real user hit it?"
                  authored="A consistency integration test that calls DELETE, then immediately GET, then immediately POST with the same name, asserting all three agree with each other — run automatically in CI and, ideally, as a synthetic production check — would have caught this before any customer did. The deeper fix Mixpeek itself names is making the pending-sweep state observable: exposing a status field so a caller can tell the difference between 'deleted' and 'deletion pending' instead of collapsing both into a plain success response."
                  state={interpState}
                  onSubmit={submitInterp}
                />
                <InterpretationPrompt
                  chartId="incidentchart" index={1}
                  kindLabel="Qualitative / mechanism"
                  prompt="Why can a classical relational database guarantee that DELETE, GET, and a subsequent CREATE-by-same-key are always consistent with each other, in a way that an HNSW- or IVF-backed vector store structurally cannot without extra engineering?"
                  authored="A relational delete removes or marks a row inside a single ACID transaction, and every later read goes through the same transactional visibility rules, so there is no window where different callers can see different truths. An ANN index's delete cannot be instantaneous without breaking the very structure that makes it fast — deleting a node instantly would sever the graph paths that route around it (HNSW) or leave a partition's bookkeeping inconsistent (IVF) — so the design defers real removal to an asynchronous sweep. The classical guarantee assumes atomic, transactional deletion; the AI-native structure trades that atomicity away for search speed, and the API layer has to make that trade visible instead of hiding it."
                  state={interpState}
                  onSubmit={submitInterp}
                />
              </div>
              <p>
                What the mitigation cost is not fully itemized in Mixpeek's own public account, so it should
                be read as an ESTIMATE rather than a reported figure: at minimum, an incident-response cycle
                to diagnose why three endpoints disagreed, plus an engineering change to make pending-sweep
                state observable rather than silent — the same fix Mixpeek describes wanting going forward,
                that "the sweep needs to be observable and its failures need to be loud" (Mixpeek, 2026). The
                more expensive cost is the one that is hard to put a number on at all: every minute a
                caller's DELETE-then-GET-then-CREATE sequence can produce an incoherent set of answers is a
                minute a compliance team cannot honestly tell a regulator, or a customer, that a piece of
                data is confirmed gone.
              </p>
              <p>
                The lesson generalizes past this one vendor's bug, and past vector databases specifically.
                A "delete" API built on top of an AI-native index — or any index that defers physical removal
                for performance reasons — cannot promise the same immediacy a relational delete promises,
                and pretending otherwise by returning a plain 200 is not a small rounding error; it is a
                design decision hiding a real state machine (mark, wait, sweep, confirm) behind a response
                code that looks binary. Weaviate's own tombstone-cleanup documentation shows this is not
                unique to one vendor's mistake: it ships explicit, tunable parameters
                (`TOMBSTONE_DELETION_MIN_PER_CYCLE`, `TOMBSTONE_DELETION_MAX_PER_CYCLE`) precisely because,
                at genuine scale — its own example uses a 300-million-object shard — the sweep itself becomes
                a resource-management problem, not an afterthought (Weaviate Documentation, 2026). Any team
                shipping a deletion feature on top of HNSW or IVF should treat "when is it actually gone" as
                a first-class, monitored question, not an assumption inherited from a different kind of
                database.
              </p>
              <MCQ
                q={{
                  id: "mcq-broke",
                  typeLabel: "Failure-case question",
                  prompt: "Given the Mixpeek incident, which assumption in the original API design was most likely held by the team and considered uncontroversial — and why was it wrong?",
                  options: [
                    { text: "That customers would never delete a resource and immediately try to re-create one with the same name, so that conflict scenario was not worth testing.", wrongCalibration: "this is hindsight bias — it frames the fix as 'we should have tested this exact sequence,' which is only obvious after the failure, rather than naming the deeper assumption about what a delete response actually guarantees." },
                    { text: "That the hourly sweep interval was too infrequent, and the team's only real mistake was not running the sweep every five minutes instead.", wrongCalibration: "this is scope-creep misdiagnosis — a faster sweep would narrow the window but not eliminate it, and it treats interval tuning as the fix when the deeper issue is that pending-sweep state was never exposed at all." },
                    { text: "That tombstones should have been eliminated entirely in favor of instant hard deletes, which would have avoided this entire class of bug from the start.", wrongCalibration: "this is a single-cause fallacy that ignores why tombstoning exists in the first place — removing it would break the graph or partition structure the index depends on to stay fast, so this 'fix' is not actually available." },
                    { text: "That a 200 from DELETE proves immediate, complete removal — reasonable for a relational row, but wrong once storage defers removal to an async sweep.", wrongCalibration: "" }
                  ],
                  correctIndex: 3,
                  correctCalibration: "this generalizes to any API built on top of an eventually-consistent storage layer: a success response has to mean 'accepted and scheduled,' not 'complete,' and the API contract has to say which one it means.",
                  explanation: "The team's DELETE, GET, and POST endpoints were each individually correct relative to their own internal state check, which is exactly why the bug is interesting: no single endpoint was buggy in isolation. The uncontroversial-sounding assumption underneath all three was that a 200 response from DELETE is equivalent to confirmed, complete removal — an assumption that holds for a relational row delete but breaks the instant the storage layer defers physical removal to a scheduled sweep, which is structurally true of ANN indexes generally, not just Mixpeek's implementation.",
                  scaffold: "Look again at what each of the three endpoints (DELETE, GET, POST) was individually checking. None of them was wrong about its own state. What single belief, if held by all three, would explain why their combination still produced nonsense?",
                  generalizes: "Any distributed or eventually-consistent system where a write acknowledgment is treated as a completion guarantee — the same failure shape appears in message queues where a 'publish accepted' response is mistaken for 'message delivered and processed.'"
                }}
                state={mcqState}
                onAnswer={submitMcq}
              />
              <Glossary items={[
                { term: "Eventual consistency", def: "A guarantee that a system will reach a correct, agreed-upon state given enough time — but not necessarily immediately after a write, leaving a window where different reads can disagree." }
              ]} />
            </div>
          </div>

          {/* ============================ LEARNING SUMMARY ============================ */}
          <div ref={(el) => (sectionRefs.current.summary = el)} id="summary">
            <SectionHeading id="summary">Learning Summary</SectionHeading>
            <LearningSummaryBody
              mcqState={mcqState}
              warmupSkipped={warmupSkipped}
              principleState={principleState}
              insightSlot={insightSlot}
              setInsightSlot={setInsightSlot}
              applyIt={applyIt}
              setApplyIt={setApplyIt}
            />
          </div>

          {/* ============================ CONCLUSION ============================ */}
          <div ref={(el) => (sectionRefs.current.conclusion = el)} id="conclusion">
            <SectionHeading id="conclusion">Conclusion</SectionHeading>
            <p>
              The governing principle, now stress-tested against both the evidence and the failure case: a
              vector index's structure is a bet about which resource — memory, build-time compute, or
              tolerance for drifting and churning data — will run out first at a given scale, and neither
              of that bet's two dominant answers, IVF or HNSW, wins across every scale, every dimensionality,
              or every operational condition. Partial failure of this principle looks exactly like Meridian
              Freight or Solace Health in the consulting-case questions above: a team correctly reads one
              benchmark, picks the index that wins on that benchmark, and only discovers the hidden side of
              the bet — a build time that no longer fits the maintenance window, or a deletion guarantee that
              was never really a guarantee — once their own scale, dimensionality, or churn rate moves past
              what the original benchmark tested.
            </p>
            <p>
              For an AI product manager, this changes a decision that many teams treat as a one-time
              engineering choice made at launch. Index selection should be revisited on a schedule tied to
              two numbers: how fast the corpus is growing, and how much of it is being deleted or updated
              per day — not chosen once and left alone until something visibly breaks. A PM shipping any
              feature backed by a vector index should ask engineering for a recall-over-time dashboard
              sampled against a fixed test set, not just a latency dashboard, because this article's
              evidence shows precisely how a latency dashboard can stay green while recall quietly falls.
            </p>
            <p>
              For a future CTO, the platform implication is that a shared vector-search layer should expose
              index-family swapping and recall monitoring as first-class features, not implementation
              details hidden inside one team's service. Meta's own 2025 numbers show that even inside a
              single company's own library, the "right" index differs by workload — which means a platform
              built around a single hard-coded choice is making that choice for every future team that uses
              it, often without those teams knowing a choice was even made.
            </p>
            <p>
              The most important question this article cannot answer: every benchmark used here compares
              index types at a fixed recall target chosen by the benchmark's own authors — 95% recall@10 in
              Meta's case. None of the sources in this article report what happens to a real user-facing
              product metric — click-through rate, task completion, a support ticket rate — when recall
              drops from 95% to 85%, or from a launch-day baseline to whatever it silently becomes six
              months later. That link, from a recall percentage to actual user or business harm, is exactly
              the gap the next article type in this curriculum, AI Metrics and Evaluation, exists to close —
              and it remains open here.
            </p>

            <TEQuestion />

            <p style={{ fontSize: 13, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginTop: 28, marginBottom: -6 }}>
              Final question — pattern transfer to a domain not covered in this article
            </p>
            <TFQuestion
              q={{
                id: "tf-final",
                minLen: 50,
                prompt: "Apply this article's governing principle to a domain not covered anywhere in this article: a national election board building a system to detect duplicate voter registrations by comparing biometric or address-similarity embeddings across 200 million records, where a false 'duplicate' match can wrongly cancel a real voter's registration. What would the team choose between IVF and HNSW and why, and what new failure mode would appear here that has nothing to do with search latency or memory cost?"
              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
          </div>

          <div style={{ marginTop: 60, paddingTop: 20, borderTop: "1px solid #eee", fontSize: 13, color: "#777" }}>
            <p><strong>Sources</strong></p>
            <ul style={{ paddingLeft: 18 }}>
              <li>Jégou, H., Douze, M., Johnson, J. "Faiss: A library for efficient similarity search." Meta Engineering, March 29, 2017. <a href="https://engineering.fb.com/2017/03/29/data-infrastructure/faiss-a-library-for-efficient-similarity-search/" target="_blank" rel="noopener">engineering.fb.com/2017/03/29/faiss-a-library-for-efficient-similarity-search</a> — FACT tier, primary source for billion-scale IVF/PQ benchmark numbers, memory budget, GPU speedup figures.</li>
              <li>Qi, J., Szilvasy, G., Norris, M., Gandhi, V. "Accelerating GPU indexes in Faiss with NVIDIA cuVS." Meta Engineering, May 8, 2025. <a href="https://engineering.fb.com/2025/05/08/data-infrastructure/accelerating-gpu-indexes-in-faiss-with-nvidia-cuvs/" target="_blank" rel="noopener">engineering.fb.com/2025/05/08/accelerating-gpu-indexes-in-faiss-with-nvidia-cuvs</a> — FACT tier, primary source for the 2025 IVF/HNSW/CAGRA build-time and search-latency benchmark tables.</li>
              <li>Sobot, P. "Introducing Voyager: Spotify's New Nearest-Neighbor Search Library." Spotify Engineering, October 25, 2023. <a href="https://engineering.atspotify.com/2023/10/introducing-voyager-spotifys-new-nearest-neighbor-search-library" target="_blank" rel="noopener">engineering.atspotify.com/2023/10/introducing-voyager</a> — FACT tier, primary source for Voyager-vs-Annoy multipliers and Spotify's own selection criteria.</li>
              <li>"Vector index." Weaviate Documentation, accessed 2026. <a href="https://docs.weaviate.io/weaviate/config-refs/indexing/vector-index" target="_blank" rel="noopener">docs.weaviate.io/weaviate/config-refs/indexing/vector-index</a> — FACT tier, primary source for HNSW tombstone-cleanup configuration and scale guidance.</li>
              <li>Sarkar, P. "HNSW at Scale: Why Your RAG System Gets Worse as the Vector Database Grows." Towards Data Science, January 7, 2026. <a href="https://towardsdatascience.com/hnsw-at-scale-why-your-rag-system-gets-worse-as-the-vector-database-grows/" target="_blank" rel="noopener">towardsdatascience.com/hnsw-at-scale</a> — FACT tier, independent reproducible benchmark used for the recall-under-growth evidence in RQ3.</li>
              <li>"How Do You Delete Data From a Vector Index? Embeddings, Tombstones, and the Right to Be Forgotten." Mixpeek, updated August 18, 2026. <a href="https://mixpeek.com/guides/deleting-data-from-a-vector-index" target="_blank" rel="noopener">mixpeek.com/guides/deleting-data-from-a-vector-index</a> — FACT tier, primary source for the Mixpeek incident and the general HNSW/IVF deletion mechanism described in What Broke.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
}

function WarmupInput({ id, onSubmit }) {
  const [text, setText] = useState("");
  const minLen = 25;
  return (
    <>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder={"Write your answer (min " + minLen + " characters)..."}
        style={{ width: "100%", minHeight: 60, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
      />
      <button
        disabled={text.length < minLen}
        onClick={() => onSubmit(id, text)}
        style={{
          marginTop: 6, padding: "6px 14px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
          background: text.length < minLen ? "#E5E5E5" : "#111", color: text.length < minLen ? "#999" : "#fff",
          cursor: text.length < minLen ? "not-allowed" : "pointer"
        }}
      >Submit</button>
      {text.length < minLen && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>{text.length}/{minLen} characters minimum.</div>}
    </>
  );
}

function TEQuestion() {
  const [present, setPresent] = useState({ thesis: "", assumption: "", disconfirm: "", premortem: "" });
  const [future, setFuture] = useState({ change: "", replaces: "" });
  const [submitted, setSubmitted] = useState(false);

  const presentFields = [
    ["thesis", "One-sentence so-what thesis"],
    ["assumption", "Load-bearing assumption"],
    ["disconfirm", "Strongest disconfirming evidence from this article"],
    ["premortem", "One-line pre-mortem: \"If this fails in 12 months, the most likely reason is ___\""]
  ];
  const allFilled = presentFields.every(([k]) => present[k].length >= 15) && future.change.length >= 15 && future.replaces.length >= 15;
  const weakest = presentFields.concat([["change", "2027: what changes"], ["replaces", "2027: assumption replaced"]])
    .map(([k, label]) => ({ key: k, label, val: (present[k] !== undefined ? present[k] : future[k]) || "" }))
    .sort((a, b) => a.val.length - b.val.length)[0];

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 18, margin: "20px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 8 }}>
        T-E — Forward-looking implication (Apply It)
      </div>
      <p style={{ fontWeight: 700, marginTop: 0 }}>Present-day variant</p>
      <p style={{ fontSize: 13.5, color: "#555", marginTop: -6 }}>Apply the governing principle to a company or product you know.</p>
      {presentFields.map(([key, label]) => (
        <div key={key} style={{ marginBottom: 8 }}>
          <label style={{ fontSize: 13, fontWeight: 600 }}>{label}</label>
          <input
            disabled={submitted}
            value={present[key]}
            onChange={(e) => setPresent({ ...present, [key]: e.target.value })}
            style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }}
          />
        </div>
      ))}
      <p style={{ fontWeight: 700, marginTop: 16 }}>2027 forward-looking variant</p>
      <p style={{ fontSize: 13.5, color: "#555", marginTop: -6 }}>
        Given the same business constraints and user problem, but assuming foundation-model capabilities have improved (longer context, cheaper inference, better reasoning), what would you design or decide differently?
      </p>
      <div style={{ marginBottom: 8 }}>
        <label style={{ fontSize: 13, fontWeight: 600 }}>What you would build/decide differently in 2027</label>
        <input disabled={submitted} value={future.change} onChange={(e) => setFuture({ ...future, change: e.target.value })}
          style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }} />
      </div>
      <div style={{ marginBottom: 8 }}>
        <label style={{ fontSize: 13, fontWeight: 600 }}>The load-bearing assumption the 2027 version replaces — and what evidence would most change this article's governing principle (falsification)</label>
        <input disabled={submitted} value={future.replaces} onChange={(e) => setFuture({ ...future, replaces: e.target.value })}
          style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }} />
      </div>
      {!submitted && (
        <button
          disabled={!allFilled}
          onClick={() => setSubmitted(true)}
          style={{
            marginTop: 6, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
            background: !allFilled ? "#E5E5E5" : "#111", color: !allFilled ? "#999" : "#fff",
            cursor: !allFilled ? "not-allowed" : "pointer"
          }}
        >Submit Apply It</button>
      )}
      {!allFilled && !submitted && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Fill in all six fields (15+ characters each) to enable Submit.</div>}
      {submitted && (
        <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 12, marginTop: 10 }}>
          <p style={{ margin: 0, fontSize: 13.5 }}>
            <strong>Evaluator note:</strong> all six parts are present. The part reading as thinnest by length is
            "<em>{weakest.label}</em>" — worth revisiting with a more specific, decision-relevant detail if you want to
            stress-test your own answer further. This evaluator checks for presence and relative depth of each labeled
            part, not for keyword matches.
          </p>
        </div>
      )}
    </div>
  );
}

function LearningSummaryBody({ mcqState, warmupSkipped, principleState, insightSlot, setInsightSlot, applyIt, setApplyIt }) {

  const missed = scored.filter((k) => !mcqState[k].correct);

  const principleMap = {
    "rq1": "An index's structure is a bet about which resource it spends to answer queries fast.",
    "rq2": "No public benchmark can declare a permanent winner between HNSW and IVF across scales.",
    "rq3": "An ANN index's deletion cost is a scheduling promise, not a guarantee, invisible on a launch-day chart."
  };
  const missedPrinciples = missed.map((k) => {
    if (k.includes("rq1")) return principleMap.rq1;
    if (k.includes("rq2")) return principleMap.rq2;
    if (k.includes("rq3") || k.includes("tg1") || k.includes("th1")) return principleMap.rq3;
    if (k.includes("broke")) return "A 'delete' response on an AI-native index means 'accepted and scheduled,' not 'complete.'";
    return "General principle of the article.";
  });
  const uniqueMissedPrinciples = [...new Set(missedPrinciples)];

  return (
    <div>

        <p style={{ fontWeight: 700, marginTop: 0 }}>Score breakdown</p>

            <p style={{ margin: "4px 0 0 0", fontSize: 13.5 }}>{principleState[id] && principleState[id].submitted ? principleState[id].text : "Not yet submitted."}</p>
          </div>
        ))}
        <p style={{ fontSize: 13.5, color: "#555" }}>Which of your stated principles surprised you most when compared to the authored version? Why? (Reflect in your own notes — this is not re-scored here.)</p>

                marginTop: 6, padding: "7px 14px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
                background: insightSlot.text.length < 20 ? "#E5E5E5" : "#111", color: insightSlot.text.length < 20 ? "#999" : "#fff",
                cursor: insightSlot.text.length < 20 ? "not-allowed" : "pointer"
              }}
            >Reveal authored insights</button>
          </>
        )}
        {insightSlot.submitted && (

              <div style={{ fontSize: 11, fontWeight: 700, color: "#555" }}>YOUR INSIGHT</div>

              "The two Meta benchmarks that matter most for a PM aren't the ones that show which index is fastest — they show the ranking is a function of scale and dimensionality together, so 'index X is faster' is only ever true for one tested shape of data.",
              "Every 'delete' action in a vector-search product is making a promise the underlying data structure cannot keep instantly — HNSW and IVF both convert deletion from a guarantee into a scheduling problem, and most product teams never surface that to users or auditors.",
              "The single most expensive mistake in vector index selection is not picking the 'wrong' algorithm — it is picking the right one for launch day and never re-testing it as the corpus's size, dimensionality, or churn rate change underneath it."
            ].map((t, i) => (
              <div key={i} style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginBottom: 6 }}>
                <p style={{ margin: 0, fontSize: 13.5 }}>{t}</p>
              </div>
            ))}
          </>
        )}
      </div>

      <div style={{ marginBottom: 8 }}>
        <p style={{ fontWeight: 700 }}>Principles to revisit</p>
        {uniqueMissedPrinciples.length === 0 && <p style={{ fontSize: 13.5, color: "#555" }}>No missed questions yet, or none answered — this list fills in as you answer scored questions above.</p>}
        {uniqueMissedPrinciples.map((p, i) => (
          <p key={i} style={{ fontSize: 13.5, background: "#FDEDED", padding: 8, borderRadius: 6 }}>{p}</p>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
