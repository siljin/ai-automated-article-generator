const REASONING_ERRORS = {
  classical: "Applying classical software assumptions to AI: treating an elastic, engineered system (retrieval, autoscaling, context handling) as if it had a fixed classical-software ceiling rather than being built to scale with growth.",
  metricCause: "Confusing a metric for its cause: crediting a model's general benchmark strength (latency, cost, accuracy) for a specific, separate outcome (process reliability) the evidence actually traces to architecture and cadence.",
  survivorship: "Survivorship bias: concluding an approach is safe or effective because the cases that got published succeeded, without accounting for cases that were never disclosed or that failed.",
  extrapolate: "Extrapolating a short trend: projecting a single-period or small-sample pattern forward without evidence the underlying driver is actually changing over time.",
  baseRate: "Base-rate neglect: judging one result as unusual without asking how often that same outcome occurs across the wider population the evidence describes.",
  rateLevel: "Confusing rate and level: treating a percentage-point change as if it were a percent (relative) change, or a raw count as if it were a rate.",
  causation: "Misattributing causation: treating two facts that sit near each other in the evidence as if one explains the other, without a stated causal mechanism connecting them.",
  hindsight: "Hindsight bias: treating an explanation as obviously correct only because it sounds satisfying after the fact, when the evidence does not actually single it out.",
  scopeCreep: "Scope-creep misdiagnosis: treating a real, well-evidenced factor as if it were unsupported, or a secondary factor as if it were the primary, load-bearing one.",
  singleCause: "Single-cause fallacy: attributing a systemic outcome, or a claim, to one specific technical detail the evidence never actually states.",
  restatement: "Restating the conclusion itself rather than independently testing it: a circular option that sounds relevant but adds no new evidence about whether the claim holds.",
  irrelevant: "Irrelevant to the specific claim being tested: a true statement about a different variable (cost, subjectivity, transparency) that does not bear on whether the argument itself is undercut.",
  designCeiling: "Overgeneralizing a stated design capability into a fixed ceiling, ignoring that engineered systems are built to keep pace with growth rather than stay constant.",
  scopeMismatch: "Comparing two figures that describe different populations or timeframes as if they were directly comparable, when the two numbers were never meant to answer the same question.",
  necessarySufficient: "Overgeneralizing a necessary condition (the reliability stack helped most projects succeed) into a sufficient one (so the whole initiative was fully successful) — a favorable majority result does not make a claim of total success true.",
};

/* ---------------------------------------------------------------------------
   MULTIPLE CHOICE (with two-attempt scaffolding)
--------------------------------------------------------------------------- */
function MCQ({ id, label, prompt, options, correct, distractorErrors, transferNote, scaffold, state, dispatch, onScore, style }) {
  const s = state[id] || { attemptCount: 0 };
  const [sel, setSel] = useState(s.selected ?? null);

  function submit() {
    if (sel === null) return;
    const isCorrect = sel === correct;
    const attempt = (s.attemptCount || 0) + 1;
    if (!s.submitted || (s.submitted && !s.isCorrect && s.tryAgain)) {
      dispatch(id, { selected: sel, submitted: true, isCorrect, attemptCount: attempt, tryAgain: false });
      if (isCorrect && !s.scored) onScore(id, true);
    }
  }
  function tryAgain() {
    dispatch(id, { selected: null, submitted: false, tryAgain: true, attemptCount: s.attemptCount });
    setSel(null);
  }

  const cardStyle = style || {};
  return (
    <div style={{ border: "1px solid #e5e5e5", borderLeft: cardStyle.amber ? "3px solid #d97706" : "1px solid #e5e5e5", background: cardStyle.amber ? "#fffbeb" : "#fff", borderRadius: 10, padding: 16, margin: "18px 0" }}>
      {cardStyle.amber && <div style={{ fontSize: 11, fontWeight: 700, color: "#b45309", marginBottom: 6 }}>CASE PROMPT</div>}
      {label && <div style={{ fontSize: 11, fontWeight: 700, color: "#2563eb", marginBottom: 6 }}>{label}</div>}
      <div style={{ fontSize: 14.5, marginBottom: 12 }}>{prompt}</div>
      <div style={{ display: "grid", gap: 8 }}>
        {options.map((opt, i) => {
          let bg = "#fff", border = "#ddd";
          if (s.submitted) {
            if (i === correct) { bg = "#f0fdf4"; border = "#22c55e"; }
            else if (i === s.selected) { bg = "#fef2f2"; border = "#ef4444"; }
          } else if (sel === i) { border = "#2563eb"; bg = "#eff6ff"; }
          return (
            <div
              key={i}
              onClick={() => !s.submitted && setSel(i)}
              style={{ padding: "10px 12px", border: "1px solid " + border, background: bg, borderRadius: 8, cursor: s.submitted ? "default" : "pointer", fontSize: 14 }}
            >
              {String.fromCharCode(65 + i)}. {opt}
            </div>
          );
        })}
      </div>
      {!s.submitted && (
        <div style={{ marginTop: 10 }}>
          <button disabled={sel === null} onClick={submit} style={btnStyle(sel === null)}>Submit</button>
          {sel === null && <span style={{ fontSize: 12, color: "#999", marginLeft: 8 }}>Select an option to enable Submit.</span>}
        </div>
      )}
      {s.submitted && (
        <div style={{ marginTop: 12, padding: 12, background: s.isCorrect ? "#f0fdf4" : "#fef2f2", borderRadius: 8, fontSize: 14 }}>
          {s.isCorrect ? (
            <div><strong>Correct</strong> — this reasoning pattern generalizes: {transferNote}</div>
          ) : (
            <div>
              <div><strong>Incorrect</strong> — this is {REASONING_ERRORS[distractorErrors[s.selected]] || "a reasoning gap."}</div>
              {s.attemptCount >= 2 && scaffold && (
                <div style={{ marginTop: 8, padding: 10, background: "#fff7ed", borderRadius: 8 }}>
                  <strong>Scaffold:</strong> {scaffold}
                </div>
              )}
              <div style={{ marginTop: 8 }}>Correct answer: <strong>{String.fromCharCode(65 + correct)}. {options[correct]}</strong> — Where this generalizes: {transferNote}</div>
              <button onClick={tryAgain} style={{ ...btnStyle(false), marginTop: 10, background: "#374151" }}>Try again</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const [choice, setChoice] = useState(s.choice ?? null);
  const [just, setJust] = useState(s.justification || "");
  const canSubmit = choice !== null && just.trim().length >= 15;

  function submit() {
    const isCorrect = choice === correctAnswer;
    dispatch(id, { choice, justification: just, submitted: true, isCorrect });

  return (
    <div style={{ border: "1px solid #e5e5e5", borderRadius: 10, padding: 16, margin: "18px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#2563eb", marginBottom: 6 }}>TRUE / FALSE — WITH JUSTIFICATION</div>
      <div style={{ fontSize: 14.5, marginBottom: 12 }}>{prompt}</div>
      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
        {[true, false].map((v) => (
          <div
            key={String(v)}
            onClick={() => !s.submitted && setChoice(v)}
            style={{
              flex: 1, textAlign: "center", padding: "10px 0", borderRadius: 8, cursor: s.submitted ? "default" : "pointer",
              border: "1px solid " + (s.submitted ? (v === correctAnswer ? "#22c55e" : v === s.choice ? "#ef4444" : "#ddd") : (choice === v ? "#2563eb" : "#ddd")),
              background: s.submitted ? (v === correctAnswer ? "#f0fdf4" : v === s.choice ? "#fef2f2" : "#fff") : (choice === v ? "#eff6ff" : "#fff"),
              fontWeight: 700,
            }}
          >
            {v ? "True" : "False"}
          </div>
        ))}
      </div>
      <textarea
        disabled={s.submitted}
        value={just}
        onChange={(e) => setJust(e.target.value)}
        rows={2}
        placeholder="Justify your answer in one sentence (min 15 characters)..."
        style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #ddd", fontFamily: "inherit", fontSize: 14 }}
      />
      {!s.submitted && (
        <div style={{ marginTop: 8 }}>
          <button disabled={!canSubmit} onClick={submit} style={btnStyle(!canSubmit)}>Submit</button>
          {!canSubmit && <span style={{ fontSize: 12, color: "#999", marginLeft: 8 }}>Pick True or False and justify in 15+ characters.</span>}
        </div>
      )}
      {s.submitted && (
        <div style={{ marginTop: 12, padding: 12, background: s.isCorrect ? "#f0fdf4" : "#fef2f2", borderRadius: 8, fontSize: 14 }}>
          <div><strong>{s.isCorrect ? "Correct" : "Incorrect"}</strong>{!s.isCorrect && REASONING_ERRORS[reasoningError] ? " — this is " + REASONING_ERRORS[reasoningError] : ""}</div>
          <div style={{ marginTop: 8 }}><strong>Your justification:</strong> {s.justification}</div>
          <div style={{ marginTop: 6 }}><strong>Authored justification:</strong> {authoredJustification}</div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   FERMI / NUMERIC ESTIMATION
   (extended with optional openLogRange=[lo,hi] for order-of-magnitude Fermi
   scoring, so 2x and 0.5x off the anchor can both score as correct)
--------------------------------------------------------------------------- */
function Fermi({ id, prompt, unit, correctValue, tolerancePct, openLogRange, decomposition, openEnded, state, dispatch }) {
  const s = state[id] || {};
  const [path, setPath] = useState(s.path || "");
  const [num, setNum] = useState(s.num ?? "");
  const canSubmit = num !== "" && !isNaN(Number(num)) && (!openEnded || path.trim().length >= 20);

  function submit() {
    const v = Number(num);
    let withinTol;
    if (openLogRange) {
      withinTol = v >= openLogRange[0] && v <= openLogRange[1];
    } else {
      withinTol = Math.abs(v - correctValue) <= correctValue * tolerancePct;
    }
    dispatch(id, { num: v, path, submitted: true, withinTol });
  }
  const tolLabel = openLogRange
    ? "ORDER OF MAGNITUDE, ACCEPT " + openLogRange[0] + "-" + openLogRange[1]
    : "TOLERANCE ±" + Math.round(tolerancePct * 100) + "%";
  return (
    <div style={{ border: "1px solid #e5e5e5", borderRadius: 10, padding: 16, margin: "18px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#2563eb", marginBottom: 6 }}>NUMERIC ESTIMATION ({tolLabel})</div>
      <div style={{ fontSize: 14.5, marginBottom: 12 }}>{prompt}</div>
      {openEnded && (
        <textarea
          disabled={s.submitted}
          value={path}
          onChange={(e) => setPath(e.target.value)}
          rows={2}
          placeholder="Name your decomposition path before entering a number (min 20 characters)..."
          style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #ddd", fontFamily: "inherit", fontSize: 14, marginBottom: 8 }}
        />
      )}
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <input
          disabled={s.submitted}
          type="number"
          value={num}
          onChange={(e) => setNum(e.target.value)}
          placeholder="Your estimate"
          style={{ padding: 8, borderRadius: 8, border: "1px solid #ddd", width: 140, fontSize: 14 }}
        />
        <span style={{ fontSize: 13, color: "#666" }}>{unit}</span>
      </div>
      {!s.submitted && (
        <div style={{ marginTop: 10 }}>
          <button disabled={!canSubmit} onClick={submit} style={btnStyle(!canSubmit)}>Submit</button>
          {!canSubmit && <span style={{ fontSize: 12, color: "#999", marginLeft: 8 }}>Enter a number{openEnded ? " and a 20+ character decomposition path" : ""} to enable Submit.</span>}
        </div>
      )}
      {s.submitted && (
        <div style={{ marginTop: 12, padding: 12, background: s.withinTol ? "#f0fdf4" : "#fef2f2", borderRadius: 8, fontSize: 14 }}>
          <div><strong>{s.withinTol ? "Within tolerance" : "Outside tolerance"}</strong> — your estimate: {s.num} {unit}; anchor value: {correctValue} {unit}{openLogRange ? " (accepted range " + openLogRange[0] + "-" + openLogRange[1] + ")" : ""}</div>
          <div style={{ marginTop: 8, height: 40, position: "relative", background: "#f3f4f6", borderRadius: 6 }}>
            {(() => {
              const lo = Math.min(s.num, correctValue) * 0.4;
              const hi = Math.max(s.num, correctValue) * 1.4 || 1;
              const pctOf = (v) => Math.max(2, Math.min(98, ((v - lo) / (hi - lo)) * 100));
              return (
                <>
                  <div style={{ position: "absolute", left: pctOf(correctValue) + "%", top: 0, bottom: 0, width: 2, background: "#22c55e" }} title="anchor" />
                  <div style={{ position: "absolute", left: pctOf(s.num) + "%", top: 0, bottom: 0, width: 2, background: "#2563eb" }} title="your estimate" />
                </>
              );
            })()}
          </div>
          <div style={{ marginTop: 8 }}><strong>Decomposition:</strong> {decomposition}</div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   PATTERN TRANSFER (free text, self-eval checklist)
--------------------------------------------------------------------------- */
function PatternTransfer({ id, prompt, state, dispatch }) {
  const s = state[id] || {};
  const [text, setText] = useState(s.text || "");
  const [checks, setChecks] = useState(s.checks || [false, false, false]);
  return (
    <div style={{ border: "1px solid #e5e5e5", borderRadius: 10, padding: 16, margin: "18px 0", background: "#fdfdff" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#2563eb", marginBottom: 6 }}>PATTERN TRANSFER</div>
      <div style={{ fontSize: 14.5, marginBottom: 12 }}>{prompt}</div>
      <textarea
        disabled={s.submitted}
        value={text}
        onChange={(e) => setText(e.target.value)}
        rows={4}
        placeholder="Min 50 characters..."
        style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #ddd", fontFamily: "inherit", fontSize: 14 }}
      />
      {!s.submitted && (
        <div style={{ marginTop: 10 }}>
          <button disabled={text.trim().length < 50} onClick={() => dispatch(id, { text, submitted: true, checks })} style={btnStyle(text.trim().length < 50)}>
            Submit
          </button>
          {text.trim().length < 50 && <span style={{ fontSize: 12, color: "#999", marginLeft: 8 }}>Enter at least 50 characters.</span>}
        </div>
      )}
      {s.submitted && (
        <div style={{ marginTop: 12, padding: 12, background: "#eef2ff", borderRadius: 8 }}>
          <div style={{ fontWeight: 700, marginBottom: 8 }}>Self-evaluation checklist</div>
          {["Did I name the principle accurately?", "Is my application genuinely different from the original case?", "Is my failure mode new (not one already covered in the article)?"].map((c, i) => (
            <label key={i} style={{ display: "block", fontSize: 14, marginBottom: 6 }}>
              <input
                type="checkbox"
                checked={checks[i]}
                onChange={() => {
                  const next = [...checks]; next[i] = !next[i]; setChecks(next);
                  dispatch(id, { ...s, checks: next });
                }}
              /> {c}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   APPLY IT (present-day + 2027 variant, labeled parts)
--------------------------------------------------------------------------- */
function ApplyIt({ id, title, prompt, fields, state, dispatch }) {
  const s = state[id] || {};
  const [vals, setVals] = useState(s.vals || fields.map(() => ""));
  const allFilled = vals.every((v) => v.trim().length >= 12);
  return (
    <div style={{ border: "1px solid #e5e5e5", borderRadius: 10, padding: 16, margin: "18px 0", background: "#fffefa" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#b45309", marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 14.5, marginBottom: 12 }}>{prompt}</div>
      {fields.map((f, i) => (
        <div key={i} style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>{i + 1}. {f}</div>
          <textarea
            disabled={s.submitted}
            value={vals[i]}
            onChange={(e) => { const n = [...vals]; n[i] = e.target.value; setVals(n); }}
            rows={2}
            style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #ddd", fontFamily: "inherit", fontSize: 14 }}
            placeholder="Min 12 characters..."
          />
        </div>
      ))}
      {!s.submitted && (
        <div>
          <button disabled={!allFilled} onClick={() => dispatch(id, { vals, submitted: true })} style={btnStyle(!allFilled)}>Submit</button>
          {!allFilled && <span style={{ fontSize: 12, color: "#999", marginLeft: 8 }}>Fill in all {fields.length} parts (12+ characters each) to enable Submit.</span>}
        </div>
      )}
      {s.submitted && (
        <div style={{ marginTop: 10, padding: 10, background: "#f0fdf4", borderRadius: 8, fontSize: 13 }}>
          Saved. The evaluator below checks that all {fields.length} labeled parts climb from observation to a decision-relevant implication — it does not score on keyword presence, and it names which part is weakest if one reads as thin (i.e., under 12 words or a restatement of the prompt rather than a specific claim).
        </div>
      )}
    </div>
  );
}

  const [phase, setPhase] = useState("warmup"); // warmup -> article
  const [warmUpDone, setWarmUpDone] = useState(false);

  const [active, setActive] = useState("intro");
  const [wide, setWide] = useState(window.innerWidth > 1160);
  const [state, setState] = useState({});
  const [score, setScore] = useState(0);
  const [showSummary, setShowSummary] = useState(false);
  const [showConclusion, setShowConclusion] = useState(false);

  useEffect(() => {
    const onResize = () => setWide(window.innerWidth > 1160);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    if (phase !== "article") return;
    function onScroll() {
      let current = "intro";
      for (const n of NAV_ITEMS) {
        const el = document.getElementById(n.id);
        if (el && el.getBoundingClientRect().top < 160) current = n.id;
      }
      setActive(current);
    }
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, [phase]);

  function dispatch(id, patch) {
    setState((prev) => ({ ...prev, [id]: { ...(prev[id] || {}), ...patch } }));
  }
  function onScore(id, correct) {
    if (correct) setScore((s) => s + 1);
  }
  function jump(id) {
    if (id === "summary") setShowSummary(true);
    if (id === "conclusion") setShowConclusion(true);
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }, id === "summary" || id === "conclusion" ? 50 : 0);
  }

  const totalSections = NAV_ITEMS.length;
  const activeIdx = NAV_ITEMS.findIndex((n) => n.id === active);
  const pct = Math.max(4, ((activeIdx + 1) / totalSections) * 100);

  if (phase === "warmup") {
    return (
      <WarmUpScreen
        onDone={(n) => { setWarmUpDone(true); setPhase("article"); }}
        onSkip={() => { setWarmUpSkippedCount(WARMUPS.length); setPhase("article"); }}
      />
    );
  }

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", color: "#111", background: "#fff", lineHeight: 1.7, fontSize: 16 }}>

      {/* INTRODUCTION */}
      <Section id="intro" title="Introduction">
        <P>
          A production agent system scales across an organization not because a smarter model shows up. It scales
          because a shared foundation — one standard way to run agents, remember context, manage identity, and watch
          what they do — turns every new agent into a business-logic project instead of an infrastructure project.
          Once that foundation exists, keeping agents safe and reliable at speed is its own engineering job:
          evaluation and hard failure limits have to be built up front, not added right before launch as safety
          theater. Cox Automotive is the clearest publicly documented evidence for this principle available today.
          In under a year, this automotive services and technology company took 17 of 57 evaluated agent ideas into
          production on Amazon Bedrock AgentCore — a managed Amazon Web Services (AWS) platform for building and
          running AI agents (AWS Cox Automotive Case Study, 2026). Cox is unusually strong evidence because it is one
          of the only enterprises to publish, across three independent public sources — a written case study, a live
          conference talk, and trade press — both its production wins and an admitted mid-flight failure. Most vendor
          case studies show only the wins.
        </P>
        <P>
          Cox Automotive is a subsidiary of Cox Enterprises, a privately held company based in Atlanta. Cox
          Enterprises reports about $22 billion a year in revenue (AWS Cox Automotive Case Study, 2026); Cox
          Automotive itself, the automotive-focused subsidiary that actually built these agents, is separately
          described as a $10 billion automotive services and software business (CIO.com, 2026). Those are two
          different numbers for two different entities — worth flagging immediately, because the parent's larger
          number is easy to mistake for the subsidiary's. Cox Automotive employs more than 29,000 people across five
          continents, and owns brands like Autotrader, Kelley Blue Book, and Manheim (AWS Cox Automotive Case Study,
          2026). Its systems handle 2.3 billion online interactions a year, and hold roughly 5.1 trillion data points
          about vehicles in the market, in the rough words of one of its own architects (AWS Cox Automotive Case
          Study, 2026; Cox Automotive &amp; AWS re:Invent 2025). Before Cox built a single autonomous agent, it
          already had more than 150 traditional machine-learning models running in production (Cox Automotive &amp;
          AWS re:Invent 2025). Cox was not alone in treating Bedrock AgentCore as a serious platform bet: Ericsson, a
          telecom equipment maker, used it to support agents across an engineering workforce numbering in the tens of
          thousands, and Sony adopted it for a group-wide agentic platform (AWS Machine Learning Blog, Oct 2025). Cox
          is one of several large enterprises making this same bet, not an outlier vendor story.
        </P>
        <P>
          Yet before adopting AgentCore, Cox had no standardized way to run agent code, no shared way to keep track
          of a conversation's context across multiple steps, no way to see what a multi-agent system was actually
          deciding inside itself, and no proven way to control which agent could touch which sensitive, cross-brand
          data (AWS Cox Automotive Case Study, 2026). This is the structural gap the rest of this article studies:
          150-plus machine-learning models running well did not translate into readiness for autonomous agents.
          Being good at one kind of AI — predictions from a trained model — does not automatically make an
          organization ready for a different kind of AI: agents that take multi-step actions on their own.
        </P>
        <P>
          This article addresses three questions. First, how did Cox Automotive structure agent orchestration,
          memory, and tool access so that 17 different products — spanning fleet service, dealer communication, and
          vehicle auctions — could share one foundation instead of each team rebuilding its own? Second, what failure
          modes showed up once Cox put autonomous, customer-facing agents into production, and what combination of
          guardrails, red-teaming, and hard limits did it take to make a system that reasons non-deterministically
          safe to run without a human reviewing every conversation? Third, once manual review of agent conversations
          stopped scaling, how did Cox measure whether an autonomous agent was actually doing its job well, not just
          completing a task?
        </P>
        <Glossary
          terms={[
            { term: "Bedrock AgentCore", def: "Amazon's managed platform for building, running, and monitoring AI agents in production, used as Cox Automotive's shared foundation throughout this article." },

      {/* LANDSCAPE */}
      <Section id="landscape" title="The Technical and Product Landscape">
        <P>
          Cox Automotive's agentic story starts years before agents existed at the company. In 2018, Cox consolidated
          from 50 separate data centers down to just 3, moving the rest of its infrastructure onto AWS cloud regions
          — in the words of one of its own architects, the company "went all in with AWS" (Cox Automotive &amp; AWS
          re:Invent 2025). That migration mattered later, because it gave Cox a single, cloud-native infrastructure
          base to build agents on, rather than 50 different environments to reconcile first. Then, in November 2022,
          ChatGPT launched and created industry-wide buzz about generative AI — AI that produces new text, images, or
          other content, rather than only classifying or predicting from existing data. By March 2023, Cox had gone
          "all in" on generative AI: within a month, engineering teams had access to multiple AI model providers and
          a sandbox to experiment in, and within the following year, three major generative-AI products were live
          (Cox Automotive &amp; AWS re:Invent 2025). One of those products eliminated the need to buy
          externally-sourced content, saving about $750,000 a year; another raised dealer response rates to customers
          by 50 percent (same source). Both of these early wins still relied on a human reviewing the AI's output
          before it reached a customer — this generation of AI helped people work faster, but a person still clicked
          "send."
        </P>
        <P>
          Cox tried to move into agentic AI — AI that takes multi-step actions on its own, rather than only
          generating a draft for a person to approve — right after that year's AWS re:Invent conference in 2024. The
          company ran several proof-of-concept projects. But the initiative got "stuck": there was little pull-through
          from product teams actually shipping agentic features, and real ambiguity across the company about what
          "agentic" even meant in practice (Cox Automotive &amp; AWS re:Invent 2025). This is the structural gap from
          the Introduction, made concrete: having 150-plus machine-learning models in production, and real
          generative-AI product experience, did not by itself produce agentic-production readiness. Capability in one
          paradigm did not transfer to the next.
        </P>
        <P>
          Cox was not the only large enterprise wrestling with this exact problem: how do you give many different
          product teams a shared, governed way to build agents, instead of each team improvising its own? Ericsson
          faced it at telecom scale, needing a framework flexible enough to support agents built by engineers
          numbering in the tens of thousands — flexibility AWS itself calls "critical to scale across many teams"
          (AWS Machine Learning Blog, Oct 2025). Cohere Health, a healthcare company operating under strict
          regulatory requirements, needed its first production agentic deployment to meet audit-trail and
          session-tracking requirements that a casual, ungoverned build could never satisfy (AWS Machine Learning
          Blog, Oct 2025). Naming these peers matters: it shows the "shared foundation" principle this article builds
          toward is not specific to Cox or to the automotive industry — it is a pattern multiple large, regulated, or
          highly distributed organizations converged on independently.
        </P>
        <P>
          The turning point for Cox came in the second week of July 2025. Cox's Chief Product Officer, Marianne
          Johnson, set an aggressive goal: launch five new agentic products in about five and a half weeks, by Labor
          Day (September 1, 2025). Five teams started this challenge from "ground zero" — none of them had built an
          agentic product before (Cox Automotive &amp; AWS re:Invent 2025). This challenge is the case's central
          natural experiment. It is the same company, with the same lack of prior agentic-product experience that
          stalled in 2024, but under a far more compressed timeline — and this time, Cox had already begun building
          on Amazon Bedrock AgentCore, ahead of its public release, through a close partnership with AWS (Cox
          Automotive &amp; AWS re:Invent 2025).
        </P>
        <P>
          The next three sections take each research question in turn. Section 3 examines how Cox structured agent
          orchestration, memory, and tool access into a shared foundation. Section 4 examines what went wrong,
          reliability-wise, once autonomous agents started talking to real customers. Section 5 examines how Cox
          rebuilt its approach to evaluation once manual review of agent conversations stopped scaling.
        </P>

      {/* RQ1: ARCHITECTURE */}
      <Section id="rq1" title="RQ1 — How did a shared foundation let 17 products reach production?">
        <P>
          <strong>Thesis to defend:</strong> a shared foundation — not each team building its own agent
          infrastructure from scratch — is what let 17 different Cox Automotive products reach production. If this
          thesis is right, product teams working on fleet service, dealer communication, and vehicle auctions should
          all look, underneath the surface, like they are built on the same small set of reusable pieces, with only
          the business logic on top actually differing between them.
        </P>
        <P>
          The obstacle is real. Before AgentCore, every one of those teams would have had to solve the same four hard
          problems on its own: how to isolate one agent conversation's compute from another's, how to remember what
          happened earlier in a long-running task, how to see what a multi-agent system was actually deciding, and
          how to prove — to security and compliance — that an agent could be trusted with sensitive, cross-brand
          customer data (AWS Cox Automotive Case Study, 2026). At a company operating across five continents and
          multiple brands with different data-sensitivity rules, that is not a problem one team can solve well enough
          for every other team to safely reuse. Without a shared answer, each of the 17 product teams would likely
          have built its own, probably-incompatible version of the same four systems.
        </P>
        <P>
          AgentCore answers this with five managed services plus two special-purpose tools, as Cox's own architects
          describe it: Runtime, Memory, Identity, Gateway, and Observability, alongside a Browser tool and a Code
          Interpreter tool (Cox Automotive &amp; AWS re:Invent 2025). AgentCore Runtime is serverless — Cox does not
          have to manage the underlying servers — and scales automatically from zero active sessions to thousands,
          supports conversations running up to 8 hours long, and gives every agent session its own isolated computing
          environment through microVM technology, a lightweight, fully separate virtual computer (AWS Machine
          Learning Blog, Oct 2025). AgentCore Identity gives each agent precisely defined, role-based permissions over
          exactly which data and tools it can touch (AWS Cox Automotive Case Study, 2026). Cox's own teams then built
          specific products on top of this shared base. Tabaré Gowon, Cox's Lead Architect, describes the flagship
          dealership virtual assistant this way: an Orchestrator Agent reads each new customer message, classifies
          its intent, and routes it to a domain-specific sub-agent — for example, one for sales questions and one for
          service questions; each sub-agent works independently, and the orchestrator assembles their results into a
          single reply before continuing the conversation (Cox Automotive &amp; AWS re:Invent 2025). FleetMate's
          Driver Agent follows a similar pattern in a completely different domain: it orchestrates multiple tools and
          predictions, pulling from vehicle telematics, various APIs, and real-time diagnostics, shifting fleet
          operations from reacting to problems after they happen to predicting them beforehand (AWS Cox Automotive
          Case Study, 2026).
        </P>
        <P>
          But the shared foundation did not make Cox immune to infrastructure risk. Partway through the 2025 project,
          AWS's own guidance shifted: the recommended agent-building framework changed from AWS Labs' "Agent Squad"
          to a newer framework called Strands Agents. Because Cox's team had already built its session handling and
          data separation on a stable AgentCore foundation, the migration to the new framework took about two weeks —
          instead of the "several weeks" it would ordinarily have taken (Cox Automotive &amp; AWS re:Invent 2025).
          That is a real benefit of the shared foundation, but notice what it actually proves: the foundation reduced
          the cost of an unplanned framework swap. It did not prevent the swap from being necessary in the first
          place. A shared foundation buys resilience to platform churn; it does not buy immunity from it.
        </P>
        <P>
          This is genuinely non-obvious once you notice the timing: Cox began building on Amazon Bedrock AgentCore
          before it was even generally available to the public in October 2025, through early access as a close AWS
          partner (Cox Automotive &amp; AWS re:Invent 2025; AWS Machine Learning Blog, Oct 2025). Cox was betting on a
          platform its own engineers could see coming, as a trusted partner, not on a finished, fully stable,
          publicly documented product. Most enterprises would not accept that kind of platform risk — building
          production customer-facing software on a service that has not yet reached general availability. That risk
          is exactly why "Cox reached production in about a year" is unusual, not a typical result any company
          adopting a finished AgentCore today should expect to repeat automatically.
        </P>
        <P>
          One specific AgentCore configuration choice deserves its own mention, because it is easy to overlook in a
          demo and only shows up in how an agent behaves weeks into real use: AgentCore Memory. It ships with
          built-in strategies for remembering user preferences, storing semantic facts, and summarizing past
          conversations, and teams can use these as-is, override specific parts, or replace them entirely with a
          custom memory strategy (Cox Automotive &amp; AWS re:Invent 2025). This is a genuinely different capability
          from the orchestrator/sub-agent pattern described above — it is about what an agent remembers between
          separate conversations, not about how work gets routed within one conversation. Most teams evaluating an
          agent framework underweight memory-strategy choice, because a demo rarely runs long enough to reveal
          whether an agent's memory is actually well-designed; that only becomes visible in production, once real
          customers have had several separate conversations with the same agent over time.
        </P>

      <Section id="rq2" title="RQ2 — What did it take to make a non-deterministic agent safe to run?">
        <P>
          <strong>Thesis to defend:</strong> making an autonomous, customer-facing agent reliable required treating
          reliability as its own engineering discipline — built from layered guardrails, scheduled adversarial
          testing, and hard limits — not something achieved simply by picking a smarter underlying model.
        </P>
        <P>
          Tabaré Gowon, Cox's Lead Architect, frames the core difficulty directly: agentic systems are "a soft way of
          programming... not deterministic," meaning "agents have agency, they can do what they want" (Cox Automotive
          &amp; AWS re:Invent 2025). A deterministic program, given the same input, always produces the same output —
          that is what lets classical software be tested once and trusted. A non-deterministic agent can, in
          principle, produce a different response to an identical customer message on a different day. That means a
          system cannot be certified safe once and left alone; the guarding has to keep working continuously, not
          just at launch.
        </P>
        <P>
          Cox built a five-layer mitigation stack around its autonomous dealership assistant (Cox Automotive &amp;
          AWS re:Invent 2025). Hard guardrails, built using Amazon Bedrock Guardrails, block certain inputs or outputs
          completely, before the underlying AI model is even called — the customer simply gets a message like "I
          cannot help with that." Soft guardrails, configured through prompt and workflow design rather than a hard
          block, let the AI redirect a conversation instead of refusing it outright — Tabaré's own example: a
          customer trying to negotiate financing terms gets redirected to "our finance team, let me schedule an
          appointment," rather than a blunt refusal. Red-teaming — deliberately trying to break the system, using
          foreign-language prompts, garbled input, and attempts to extract the system's hidden instructions — happens
          before every alpha release, before every beta release, and continuously in production; every successful
          exploit is catalogued and fixed after every code deployment and every prompt change. Automated evaluation,
          which Tabaré calls "LLM-as-judge" (using one AI model to score another AI model's output), generates test
          conversations, runs them through the system, and scores the results on relevancy, completeness, and tone.
          And circuit breakers set hard limits on cost-per-conversation-turn and on the number of turns a conversation
          can run; once a limit trips, the conversation hands off to a human at the dealership. None of these five
          layers is "use a smarter model" — every one of them is a process or architecture decision, independent of
          which AI model sits underneath.
        </P>
        <P>
          Even with this five-layer stack in place, one of the five products launched under the Labor Day deadline
          still had to be pulled back and redesigned (Cox Automotive &amp; AWS re:Invent 2025) — a result covered
          fully in the What Broke section. The stack reduces risk; it does not guarantee that every individual
          project succeeds on its first attempt. There is also a real limit on how precisely this evidence can be
          reused elsewhere: Tabaré's example of a circuit breaker tripping at "20 turns" was explicitly framed as
          hypothetical ("let's say... 20 turns") — Cox has not disclosed its actual production thresholds for
          cost-per-turn or turn count, so a reader should treat any specific number here as illustrative of the
          pattern, not as Cox's real dial setting.
        </P>
        <P>
          The split between hard and soft guardrails exists for a specific product reason, not only a safety reason.
          A system that only blocks sensitive topics outright creates a poor customer experience in a
          sales-and-service setting: Tabaré's financing-negotiation example needs a redirect, not a flat refusal, to
          keep the conversation useful for the customer while staying inside company policy. That makes reliability
          engineering for a customer-facing agent partly a product-design problem — what should the agent say instead
          — as much as a pure safety problem of what it should never say.
        </P>
        <P>
          Cox applied a structurally similar reliability pattern one layer down the stack — inside how its own
          software gets written, not just inside how its agents talk to customers. By March 2026, 100 of Cox's 680
          internal software development teams had begun shifting to an "agentic development model," using tools like
          GitHub Copilot, Anthropic's Claude Code, and Claude Enterprise to help write code, governed by a risk-based
          model for when an agent may act autonomously versus when a human must stay in the loop, plus a practice of
          "agents watching agents" with automated anomaly alerts (CIO.com, 2026). Humans remain accountable for
          anything that reaches production. This is a genuinely different case — agents writing code, not agents
          talking to customers — but the underlying pattern is the same: bounded autonomy tied to a risk tier, plus a
          supervisory layer watching the primary agent. Cox's own account states its model-drift evaluation tooling —
          designed to catch a model quietly losing focus or context — was already in place "as early as 2024,"
          before Cox had even adopted AgentCore (CIO.com, 2026), showing this reliability discipline predates, and is
          broader than, the customer-facing agent work this section otherwise focuses on.
        </P>

          <ReliabilityCascadeSVG />
          <div style={{ textAlign: "center", fontSize: 13, color: "#555", marginTop: 8 }}>

          </div>

        </div>

      <Section id="rq3" title="RQ3 — How do you measure an autonomous agent once manual review stops scaling?">
        <P>
          <strong>Thesis to defend:</strong> once manual review of agent conversations could no longer scale, Cox had
          to build a way to measure an autonomous agent's quality automatically and continuously — not just once, at
          launch.
        </P>
        <P>
          Tabaré Gowon states the ceiling directly: manual review "will work for a couple dozen conversations, maybe
          a couple hundred conversations," but Cox's actual target volume is "tens of thousands of transactions
          daily" (Cox Automotive &amp; AWS re:Invent 2025). Using round numbers for those two phrases — about 200
          conversations a human process can realistically cover, against roughly 10,000-plus needed daily — that is
          somewhere between a 50-fold and 1,000-fold gap between what manual review can handle and what production
          volume actually requires.
        </P>
        <P>
          Cox's answer is LLM-as-judge: generate test conversations, run them through the live system, and score the
          results against named metrics — relevancy, completeness, and tone (Cox Automotive &amp; AWS re:Invent 2025).
          This runs continuously, tracked over time, and is paired with the hard circuit breakers described in the
          Reliability Engineering section as a safety net for anything the evaluation system does not catch quickly
          enough. Together, these two mechanisms are what let Cox check whether an autonomous agent is actually
          serving the things that matter to the business, not simply whether it "works" in some generic sense.
        </P>
        <P>
          What Cox's public account names is what it measures — relevancy, completeness, tone — not the acceptance
          thresholds that decide when a score counts as good enough, which AI model serves as the judge, or how often
          the judge's own scores were checked against real human judgment. That last gap matters: a real evaluation
          system has to guard against its judge model sharing the same blind spots as the model it is judging, and
          Cox's own public account does not address this risk directly.
        </P>
        <P>
          As of a December 2025 feature update, Amazon Bedrock AgentCore itself now ships a formal "AgentCore
          Evaluations" service with 13 pre-built evaluators — covering correctness, helpfulness, tool-selection
          accuracy, safety, goal-success rate, and context relevance — plus support for custom evaluators (About
          Amazon, Dec 2025). This is a distinct, newer capability from the custom LLM-as-judge harness Tabaré
          described building for the dealership assistant earlier in 2025. Cox's own evaluation work predates, and is
          more custom-built than, the managed service the platform now offers — a reminder that Cox was solving an
          evaluation problem the platform had not yet productized at the time it needed a solution.
        </P>

          ]}
          correct={2}
          distractorErrors={{ 0: "irrelevant", 1: "irrelevant", 3: "irrelevant" }}
          transferNote="this generalizes to any LLM-as-judge design: a judge model that shares training data or biases with the model it evaluates can share its blind spots too, which is the load-bearing risk of the entire automated-evaluation approach, not a minor caveat."
          scaffold="Ask which option would, if true, actually contradict the claim that automated evaluation makes autonomy safe — not just scalable. Cost, subjectivity, and reproducibility are all real concerns, but none of them shows the evaluation system failing to catch the errors it exists to catch."
          state={state}
          dispatch={dispatch}
          onScore={onScore}
        />
        <Fermi
          id="rq3_fermi"
          prompt="Cox's own stated ceiling is that manual review 'works for a couple dozen, maybe a couple hundred' conversations (~200, Cox Automotive & AWS re:Invent 2025), while the dealership assistant needs to cover 'tens of thousands of transactions daily' (~10,000+, same source). Name your decomposition path, then estimate: roughly how many additional full-time human reviewers would Cox need to hire to cover that daily volume through manual review alone, assuming one reviewer can carefully review somewhere between 50 and 100 conversations per 8-hour shift — a reasonable illustrative assumption you should state, not a number Cox has disclosed."
          unit="full-time reviewers"
          correctValue={133}
          openLogRange={[50, 300]}
          openEnded={true}
          decomposition="About 10,000 daily ÷ about 75 conversations per reviewer per shift (the midpoint of the stated 50-100 illustrative range) ≈ 133 full-time reviewers, order of magnitude roughly 100-200. Anchor facts (FACT, cited): the ~200-conversation manual ceiling and the ~10,000-plus-per-day target. The reviewer-productivity rate (50-100 per shift) is your own stated illustrative assumption, exactly as a Fermi estimate requires — it is not a Cox-reported number, and it is not the fact being tested here. This question is scored on order of magnitude, so any answer roughly between 50 and 300 reviewers counts as correct. The most sensitive assumption is that productivity rate: doubling it to 150 conversations per shift roughly halves the reviewer count to about 67, which shows how much the final answer depends on an assumption Cox never actually discloses."
          state={state}
          dispatch={dispatch}
        />
        <PrincipleGate id="rq3_principle" state={state} dispatch={dispatch} />
        <PatternTransfer
          id="rq3_transfer"
          prompt="The principle from this section is: once production volume exceeds what manual review can cover, automated evaluation — not just automated response generation — becomes the safety-critical system, and it inherits whatever blind spots exist between the judge and the thing it judges. Apply this to a payroll-processing company automating anomaly detection in paycheck runs with an LLM-based reviewer checking a separate LLM-based anomaly-flagging agent. What would the compliance team do differently in month one, and what failure mode would they face that did not appear in Cox's dealership-conversation example?"
          state={state}
          dispatch={dispatch}
        />
        <P>
          <em>What this evidence supports, and what it doesn't:</em> the evidence supports that automated evaluation
          is what makes an autonomous agent's quality checkable at production volume, in a way manual review
          structurally cannot be. It does not tell us how accurate Cox's own LLM-as-judge scores actually are against
          real customer sentiment, since no validation data against that kind of ground truth has been published.
        </P>
        <Glossary
          terms={[
            { term: "Order of magnitude", def: "A rough power-of-ten scale — is something closer to hundreds, thousands, or tens of thousands? — used when an exact number isn't available or needed." },
            { term: "Fermi estimate", def: "A rough, structured calculation built by breaking a big unknown number into smaller, easier-to-estimate pieces multiplied together." },
          ]}
        />
      </Section>

      {/* WHAT BROKE */}
      <Section id="whatbroke" title="What Broke" red>
        <P>
          Of the five agentic products Cox's Chief Product Officer challenged five teams to launch by Labor Day 2025
          — starting from the second week of July 2025, a roughly five-and-a-half-week deadline — three reached
          production in beta form, one was nearly ready to launch, and one was, in the words of Brian Lloyd Newberry,
          Cox's AVP of Enterprise Architecture, speaking at the December 2025 AWS re:Invent conference, "taken back to
          the drawing board and reimagined" (Cox Automotive &amp; AWS re:Invent 2025). Cox has not disclosed which of
          the five projects this was, or the specific technical root cause. What is on the record is Newberry's own
          framing: this failure is "probably some of the most valuable data we got — what didn't work."
        </P>
        <P>
          Newberry's own diagnosis of the general difficulty — not the specific failed project — is that agentic
          systems are "a soft way of programming... not deterministic," meaning "agents have agency, they can do what
          they want," and that building guardrails and product logic around genuine non-determinism was, in his own
          words, "a hard thing for people to wrap their mind around from a product point of view" (Cox Automotive
          &amp; AWS re:Invent 2025). Combined with the five-and-a-half-week deadline and zero prior agentic-product
          experience across all five teams, it is reasonable to infer — though not confirmed by Cox — that whichever
          project failed likely under-invested in exactly the five-layer reliability stack the Reliability
          Engineering section describes, relative to the other four projects, since building that stack correctly
          under time pressure, with no prior practice, is where a team would most plausibly cut corners. This is the
          article's own inference, not a Cox-confirmed root cause, and should be read as a reasoned guess, not a
          stated fact.
        </P>
        <P>
          Cox has not published a dollar figure or a headcount figure for reworking the failed project. What is
          quantifiable is a different, but comparably-scaled, engineering cost from the same broader initiative: the
          Architecture section's framework re-platform, from Agent Squad to Strands, took about two weeks instead of
          the "several weeks" it would ordinarily have taken (Cox Automotive &amp; AWS re:Invent 2025). That is
          offered here only as the best available proxy for what a mid-flight rework costs inside Cox's own five-week
          program, not as a claim about the specific failed project's actual cost, which Cox has not disclosed.
        </P>
        <P>
          The lesson: a shared foundation — AgentCore, Strands, and the five-layer reliability stack — measurably
          compressed how fast four of the five teams reached production or near-production. It did not guarantee
          that all five would succeed on the first attempt. The most important lesson from Cox's own account is that
          the company treated this failure as a deliverable worth naming publicly — "some of the most valuable data
          we got" — rather than a footnote to bury. That is itself a rare, checkable behavior: most public AI case
          studies report only survivors.
        </P>
        <div style={{ margin: "20px 0" }}>
          <ResponsiveContainer width="100%" height={260}>
            <PieChart>
              <Pie data={outcomeData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={55} outerRadius={95} label={(e) => e.name + ": " + e.value}>
                {outcomeData.map((d, i) => (
                  <Cell key={i} fill={OUTCOME_COLORS[i]} />
                ))}
              </Pie>
              <Legend />
              <Tooltip />
            </PieChart>
          </ResponsiveContainer>
          <SourceNote>FACT — Cox Automotive &amp; AWS re:Invent 2025 (per Brian Lloyd Newberry): of 5 products launched under the July-to-Labor-Day 2025 deadline, 3 reached production beta, 1 was about to launch, 1 was redesigned.</SourceNote>
        </div>
        <ChartQA
          chartId="whatbroke_chart"
          state={state}
          dispatch={dispatch}
          qs={[
            {
              kind: "QUANTITATIVE REASONING",
              prompt: "1 of 5 projects (20%) launched under this same deadline, foundation, and reliability stack had to be redesigned. If a peer enterprise ran ten similar five-week agentic sprints across its history at that same 20% redesign rate, roughly how many total projects would you expect to need rework, and what does that imply about whether a single \"took it back to the drawing board\" result is a red flag or an expected base rate?",
              authored: "10 × 20% = 2 projects total would be expected to need rework, at that same rate. That implies a single \"sent back to the drawing board\" result, on its own, looks less like a red flag about Cox's specific execution and more like it could be an expected base rate for fast, high-autonomy launches under tight deadlines — though with only one five-week sprint on the public record, Cox cannot yet confirm whether 20% is actually its typical rate or a one-time result.",
            },
            {
              kind: "FAILURE-CASE / HINDSIGHT",
              prompt: "Given that Newberry calls the failed project \"some of the most valuable data\" Cox got, which assumption in the ORIGINAL five-week plan was most likely held by all five teams as uncontroversial at the time — the shared foundation, the shared deadline, or the shared assumption that a working demo would generalize to production traffic — and why was that specific assumption the one most likely to be wrong under time pressure?",
              authored: "Of the three shared assumptions, \"a working demo will generalize to real production traffic\" is the one most likely to have been wrong under time pressure. A shared foundation and a shared deadline are structural facts every team could see and plan around; \"the demo will generalize\" is a belief, not a fact, and it is exactly the kind of belief that goes untested when a team has weeks, not months, to build and is seeing agentic customer traffic for the first time. Newberry's own quote about non-determinism being hard to \"wrap your mind around\" points at precisely this gap between how an agent behaves in a demo and how it behaves across the full range of real customer inputs.",
            },
          ]}
        />
        <MCQ
          id="whatbroke_mcq"
          label="FAILURE CASE QUESTION"
          prompt="Cox has not disclosed the specific root cause of the one redesigned project. Given everything else in this article, which explanation should a careful reader treat as LEAST supported by the evidence, even though it sounds plausible?"
          options={[
            "The failed project may have under-invested in the same five-layer reliability stack — guardrails, red-teaming cadence, evaluation, and circuit breakers — that this article shows Cox built for its most successful product, given the shared time pressure and shared inexperience across all five teams.",
            "Cox's own account attributes the general difficulty of the five-week sprint to agentic systems being non-deterministic, since agents \"have agency\" and can act unpredictably, a challenge that applied equally to all five teams, not only the one that failed.",
            "Cox treated the failed project as valuable data rather than a footnote, suggesting the company's own read is that the failure taught it something generalizable about its process, not just about one team's individual execution.",
            "The failed project chose a fundamentally different underlying AI model than the other four projects used, and that model choice alone is what explains why it fell behind the other four teams.",
          ]}
          correct={3}
          distractorErrors={{ 0: "scopeCreep", 1: "singleCause", 2: "hindsight" }}
          transferNote="this generalizes to reading any incident report: the explanation that names a specific, dramatic technical cause not actually mentioned anywhere in the source is usually the least-supported one, even when it sounds the most satisfying."
          scaffold="Check each option against what the article actually states. Three of the four options trace directly to a named quote or a fact already established in earlier sections. Only one option requires a detail — which specific model the failed project used — that no source anywhere in this article discloses."
          state={state}
          dispatch={dispatch}
          onScore={onScore}
        />
      </Section>

      {/* LEARNING SUMMARY */}
      {showSummary && (
        <Section id="summary" title="Learning Summary">
          <P>
            <strong>Score breakdown:</strong> {score} correct answers recorded this session across the scored
            multiple-choice questions above (two T-B questions in RQ2 and RQ3, the T-A question in RQ1, the T-C
            consulting case in RQ2, the T-H critical-reasoning question in RQ3, the failure-case question in What
            Broke, and the T-E present-day question in the Conclusion). For any question you answered incorrectly,
            scroll back to that question's revealed explanation — it always names the specific reasoning error, never
            just "incorrect." For the True/False question in RQ2 and the two numeric estimation (T-D) questions,
            compare your own answer against the authored justification or anchor value shown after each submission;
            if your Fermi estimates landed low on both, that is a signal of under-estimating how fast a shared
            foundation can compress engineering timelines and how large the gap is between manual and automated
            review capacity. {warmUpDone ? "Warm-up: reviewed before this session." : `Warm-up skipped — ${warmUpSkippedCount || WARMUPS.length} prior principles not reviewed this session.`}
          </P>
          <P>
            <strong>Principle production review:</strong> look back at what you wrote in each "Principle in one
            sentence" box across Sections RQ1 through RQ3. Which of your three stated principles surprised you most
            when compared against this article's own framing — the shared-foundation-versus-framework-churn
            distinction in RQ1, the five-layer reliability stack in RQ2, or the manual-review-ceiling-versus-
            automated-evaluation gap in RQ3? Write one sentence on why, revising your answer in the boxes above if
            you want.
          </P>
          <ApplyIt
            id="insight_slot"
            title="THREE INSIGHT SLOTS"
            prompt="You have now seen evidence across architecture, reliability, and evaluation. Before comparing to the authored insights below, write the single most non-obvious insight from this article that you would defend to a skeptical CTO."
            fields={["Your single most non-obvious insight, stated as a claim (not a summary of the article)."]}
            state={state}
            dispatch={dispatch}
          />
          <div style={{ background: "#eef2ff", borderRadius: 10, padding: 16, marginTop: 4, marginBottom: 20 }}>
            <div style={{ fontWeight: 700, marginBottom: 8 }}>How your insight compares — three authored insight cards</div>
            <P>1. The expensive part of scaling an agent platform is not the runtime or the memory service — it's the reliability engineering (guardrails, red-teaming cadence, evaluation) layered on top, and that cost does not shrink automatically just because the infrastructure underneath is shared.</P>
            <P>2. A shared foundation reduces the cost of platform churn (a two-week framework swap instead of several weeks); it does not prevent the churn itself, and it did not stop one of Cox's five parallel launches from needing a full redesign.</P>
            <P>3. Companies that publish AI case studies vary enormously in what they're willing to disclose — Cox's own account is unusually strong evidence precisely because it names an admitted failure ("the most valuable data we got") across three independent public sources, not just its wins.</P>
          </div>
          <ApplyIt
            id="ls_applyit_present"
            title="APPLY IT — PRESENT-DAY VARIANT"
            prompt="Apply the governing principle — a shared foundation, not a smarter model, is what lets agent production scale, and reliability has to be engineered continuously on top of it — to a similar-sized enterprise (thousands of employees, multiple legacy brands, no existing agentic infrastructure) that you know or can reasonably imagine, the way Cox Automotive looked in mid-2025."
            fields={[
              "One-sentence so-what thesis: what should this company do differently, in Cox's terms?",
              "The load-bearing assumption your recommendation depends on.",
              "The strongest disconfirming evidence from this article against your own recommendation.",
              "One-line pre-mortem: 'If this fails in 12 months, the most likely reason is ___.'",
            ]}
            state={state}
            dispatch={dispatch}
          />
          <ApplyIt
            id="ls_applyit_2027"
            title="APPLY IT — 2027 FORWARD-LOOKING VARIANT"
            prompt="Given the same business constraints Cox faced in 2025 — multiple legacy brands, no existing agentic infrastructure, a compressed launch timeline — but assuming 2027-level foundation models (longer context, cheaper inference, more reliable native tool-calling), what would you design or decide differently, and which load-bearing assumption from Cox's 2025 evidence does the 2027 version replace?"
            fields={[
              "What changes in your recommendation given 2027-level model capability.",
              "The specific load-bearing assumption from Cox's evidence that the 2027 version replaces.",
              "What would have to be true for the 'shared infrastructure over model quality' principle to stop mattering by 2027.",
              "One observation that would tell you, in practice, that this has actually happened.",
            ]}
            state={state}
            dispatch={dispatch}
          />
          <P>
            <strong>Principles to revisit:</strong> if you missed the RQ1 architecture question (T-A) or either T-B
            question, revisit "which layer of an orchestrator-based agent system actually degrades first as domains
            are added, and why crediting a model upgrade for a process fix is a category error." If you missed the
            RQ2 consulting case (T-C) or the True/False question, revisit "why a published safety pattern's visible
            guardrails are usually cheaper to copy than its invisible ongoing operating cost." If you missed the RQ3
            critical-reasoning question (T-H), revisit "what would actually make an LLM-as-judge evaluation system
            unsafe, versus what is merely a separate concern about cost or transparency." If you missed the
            failure-case question or the present-day T-E question, revisit "why the most specific-sounding
            explanation for a failure is not automatically the best-supported one."
          </P>
        </Section>
      )}

      {/* CONCLUSION */}
      {showConclusion && (
        <Section id="conclusion" title="Conclusion">
          <P>
            The governing principle, stress-tested by both the evidence and the failure case in equal measure: shared
            infrastructure compresses the time and cost of reaching production, but it does not guarantee any single
            project's success — reliability still has to be engineered per project, continuously, not inherited
            automatically just because the platform is shared. Partial failure of this principle looks exactly like
            Cox's own five-week program: three successes, one near-success, and one full redesign, all built on the
            identical shared foundation.
          </P>
          <P>
            For an AI product manager, this principle changes a specific budgeting decision. Assuming "the platform
            will make this fast" is only half right. A realistic project timeline should separate infrastructure time
            — which a shared foundation can compress to days or weeks — from reliability-engineering time —
            guardrails, a red-teaming cadence, and an evaluation harness — which Cox's own account suggests scales
            with the risk and novelty of the specific use case, not with how many other agents already share the same
            platform.
          </P>
          <P>
            For a future CTO, the organizational lesson is not "adopt Bedrock AgentCore." It is that making a
            platform bet before general availability, as Cox did, is a real, uninsured technical risk that happened
            to pay off in this case; a CTO reading this should ask what the downside would have looked like if AWS's
            own roadmap had shifted, not just admire the upside that actually happened. Separately, Cox's decision to
            publish its own failure — one of five redesigned — as "valuable data," rather than suppress it, is itself
            a governance choice a future CTO can copy directly, independent of any specific vendor platform.
          </P>
          <P>
            The most important unresolved question this case does not answer: which of the five reliability layers —
            hard guardrails, soft guardrails, red-teaming cadence, LLM-as-judge evaluation, or circuit breakers —
            mattered most to the four projects that succeeded, or whether the one that failed was simply missing a
            specific layer rather than running out of time. Until Cox, or a peer company, publishes a controlled
            comparison isolating one layer at a time, that remains an open engineering question, not a solved one.
          </P>
          <MCQ
            id="te_present"
            label="TYPE T-E — FORWARD-LOOKING IMPLICATION (PRESENT-DAY VARIANT)"
            prompt="Given everything in this article, what is the most important decision a PM or CTO at a similar-sized enterprise (thousands of employees, multiple legacy brands or business units, no existing agentic infrastructure) should make in the next six months?"
            options={[
              "Stand up the shared foundation — a standardized runtime, memory layer, identity system, and observability stack — before greenlighting more than one or two pilot agent projects, since this foundation let framework churn and team inexperience get absorbed cheaply, not expensively, later.",
              "Wait for Amazon Bedrock AgentCore, or an equivalent platform, to reach a longer and more mature track record before starting any agentic pilots at all, since Cox's own five-layer reliability stack still let one of five launched projects fail and require a full redesign.",
              "Prioritize selecting the single best-performing foundation model across latency, cost, and accuracy before building any shared agent infrastructure, since Cox's own model-evaluation criteria compared providers on exactly those three dimensions first, before any architecture work began.",
              "Mandate that every new agent project share one single orchestrator agent across the entire company starting on day one, since Cox's dealership assistant used an orchestrator-and-sub-agent pattern successfully once it reached production earlier in the same year.",
            ]}
            correct={0}
            distractorErrors={{ 1: "baseRate", 2: "metricCause", 3: "scopeCreep" }}
            transferNote="this generalizes to any enterprise adopting agentic AI: infrastructure that many teams can share is normally worth building before multiplying pilots, because it is the piece that gets exponentially more expensive to retrofit once several teams are already depending on incompatible, ad hoc versions of it."
            scaffold="Reread what Cox's own evidence actually credits for its speed: a shared runtime, memory, identity, and observability foundation that existed before the five-team sprint began. None of the article's evidence points to model selection, an orchestrator mandate, or waiting for platform maturity as the decisive variable."
            state={state}
            dispatch={dispatch}
            onScore={onScore}
          />
          <ApplyIt
            id="te_2027"
            title="TYPE T-E — 2027 FORWARD-LOOKING VARIANT (WITH FALSIFICATION)"
            prompt="Assume by 2027 foundation models offer meaningfully longer context windows, cheaper inference, and better native tool-calling reliability than what Cox had available in 2025. Given the same business constraints (multiple legacy brands, no existing agentic infrastructure, a compressed launch timeline), what would you design or decide DIFFERENTLY than Cox did, and what load-bearing assumption from this article's evidence would that 2027 version replace? State the one observation that would most WEAKEN this article's governing principle — that shared infrastructure, not model quality, is the primary lever for scaling agent production."
            fields={[
              "What you would design or decide differently by 2027, given longer context windows, cheaper inference, and more reliable native tool-calling.",
              "The specific load-bearing assumption from today's evidence that a 2027 version would replace.",
              "The one observation that would most WEAKEN this article's governing principle, stated specifically.",
            ]}
            state={state}
            dispatch={dispatch}
          />
          <PatternTransfer
            id="final_transfer"
            prompt="FINAL QUESTION. The governing principle in this article: a production agent system scales because of a shared foundation — one runtime, memory layer, identity system, and observability stack — that turns each new agent into a business-logic project instead of an infrastructure project, and reliability has to be engineered continuously on top of that foundation, not inherited from it automatically. Apply this principle to a regional airline building its first three agents — one for baggage-claim resolution, one for flight-rebooking during weather delays, and one for crew-scheduling assistance — with no existing agent platform today. Name the principle accurately, describe a genuinely non-trivial application (not a relabeling of Cox's automotive case), and name a new failure mode that would not appear anywhere in this article's Cox Automotive evidence."
            state={state}
            dispatch={dispatch}
          />
          <div style={{ marginTop: 32, padding: 16, background: "#fafafa", borderRadius: 10, border: "1px solid #eee" }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Sources</div>
            {SOURCES.map((s) => (
              <div key={s.url} style={{ fontSize: 13, marginBottom: 10 }}>
                <div><strong>[{s.tier}]</strong> {s.name}</div>
                <div><a href={s.url} target="_blank" rel="noreferrer">{s.url}</a></div>
                <div style={{ color: "#666" }}>{s.use}</div>
              </div>
            ))}
          </div>
        </Section>
      )}

      <div style={{ height: 80 }} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
