      correct: true,
      whyCorrect: "This names the actual assumption the team is described as having held and then abandoning: that a fixed periodic human check could scale with a compounding problem. OpenAI's own account of the Friday-cleanup era failing “unsurprisingly” as volume grew is direct evidence this assumption, not model capability or test coverage, was the one that broke.",
      generalizes: "any plan to control a compounding, volume-linked problem (technical debt, data drift, security exposure) with a fixed-size periodic manual check rather than a mechanism that scales with the problem itself"
    },
    {
      text: "That the entropy problem was caused entirely by the specific two golden principles OpenAI eventually wrote — shared utility packages over hand-rolled helpers, and never probing data “YOLO-style” — not existing yet, so simply publishing those two rules on day one would have prevented the failure regardless of whether any recurring cleanup process was ever built.",
      correct: false,
      errorName: "single-cause fallacy",
      explanation: "This treats one contributing piece (the specific rules) as the whole fix, but OpenAI's account pairs the golden principles with a recurring, automated cleanup process that scans for deviations and opens refactoring PRs — rules alone, without an ongoing mechanism enforcing them, would not have closed the loop the way the combined fix did.",
      scaffold: "Ask: if only the two rules existed, with no recurring process checking for violations, would entropy still creep in over time? If yes, the rules alone were never the complete explanation."
    }
  ];

  return (
    <section id="broke" style={{ paddingTop: 24 }}>
      <SectionHeading id="broke">What Broke</SectionHeading>
      <Callout kind="fail">
        <p style={{ marginTop: 0 }}>Full agent autonomy introduced a real, named problem into OpenAI's five-month build: entropy. Codex replicates patterns that already exist in the repository — including uneven or suboptimal ones — and OpenAI states this "inevitably leads to drift" over time (OpenAI Engineering Blog, 2026). This did not surface on day one. It showed up only once the team's environment investment (RQ1) had removed the early under-specification problem and throughput started rising: the faster Codex shipped, the faster any slightly-worse pattern it copied became "normal" for the next piece of code to copy from.</p>
        <p>The assumption the team held, apparently without stating it out loud at first, was that periodic human attention could keep this kind of drift under control the way code review has always kept human-written drift under control. It could not, for a specific, structural reason: a codebase where 100% of new code comes from an agent that copies whatever it sees nearby produces drift that scales with volume, not with time — more PRs per day means more chances for a slightly-worse pattern to spread, so a fixed weekly review slot covers a shrinking fraction of the problem as the team's own success (rising throughput) makes the problem grow faster.</p>
        <p>The first fix cost the team directly and immediately: humans spent every Friday — 20% of the team's entire work week — manually cleaning up "AI slop" (OpenAI Engineering Blog, 2026). Losing a fifth of the week to cleanup is a real, ongoing tax on a team that had just proven it could multiply its own output by removing other bottlenecks — and OpenAI's own account states plainly that this approach "did not scale," calling the outcome unsurprising (OpenAI Engineering Blog, 2026). The team then replaced the manual sweep with a mechanical one: golden principles encoded directly in the repo, plus recurring background Codex cleanup tasks that scan for deviations, update quality grades, and open targeted refactoring pull requests — most of which are reviewable in under a minute and get auto-merged (OpenAI Engineering Blog, 2026). The unstated cost of building that mechanical fix is not published; what is published is that it replaced a standing, non-scaling 20%-of-the-week cost with a process the team no longer had to run by hand.</p>
        <p style={{ marginBottom: 0 }}>The lesson, in OpenAI's own words, reframes what "technical debt" means once code volume is no longer limited by how fast a human can type: "This functions like garbage collection. Technical debt is like a high-interest loan: it's almost always better to pay it down continuously in small increments than to let it compound and tackle it in painful bursts" (OpenAI Engineering Blog, 2026). The failure here is not that OpenAI's approach doesn't work — it is that the version of "review" borrowed from human-authored codebases (a person periodically looks things over) does not survive contact with a system where the volume of new code is no longer bounded by human typing speed. A team adopting this pattern should expect to build the mechanical fix from the start, not discover, the way OpenAI did, that the human-shaped version of the fix runs out of scale first.</p>
      </Callout>

      <EntropyTimelineSVG />
      <ChartInterp chartId="chart-broke" state={interp} setState={setInterp} prompts={[
        { kind: "So-what / build-buy-partner (sacrifice ratio)", text: "Era 1 cost the team 20% of its week, every week, with no published end date until the switch to Era 2. Using a build/buy/partner framework and a sacrifice ratio, would you recommend a new team starting this kind of project build its own golden-principles-and-cleanup-agent system from day one, or start with manual review and only build the mechanical fix once volume makes it necessary — and what is the sacrifice ratio of choosing wrong in each direction?", authored: "Build the mechanical system from day one if at all possible: the sacrifice ratio of over-building early is small (some upfront engineering time on rules and a cleanup-agent cadence before volume strictly requires it), while the sacrifice ratio of under-building is a recurring 20%-of-the-week tax that, by OpenAI's own account, does not scale down on its own — waiting for pain before building the fix means paying the expensive, non-scaling cost for however long it takes to notice and rebuild, which is exactly the painful-burst pattern OpenAI's own garbage-collection framing warns against." },
        { kind: "Qualitative / mechanism", text: "Era 2's fix (golden principles plus recurring cleanup agents) succeeded where Era 1's fix (a fixed weekly human slot) failed. What structural difference between “a person periodically looks things over” and “a mechanical rule plus an always-running background check” explains why one scales with rising PR volume and the other does not?", authored: "A fixed weekly human slot has a constant capacity — one day, one team's attention — no matter how many PRs get merged that week, so its coverage of the problem shrinks as volume rises. A mechanical rule plus a recurring automated task has no such fixed ceiling: the cleanup agent can, in principle, run as often as needed and check every new PR against the same rule, so its capacity scales along with the thing it's checking, rather than staying fixed while the workload around it grows." }
      ]} />

      <MCQ id="broke-fail" label="Failure-case reasoning" registerScore={registerScore}
        prompt={"Given that OpenAI's account describes the manual Friday cleanup era failing to scale and being replaced by mechanically encoded golden principles plus a recurring automated cleanup process, which assumption in the original design was most likely held by the team as uncontroversial at the time — and why was it wrong?"}
        options={failOptions} state={mcq} setState={setMcq} />

      <Glossary items={[
        { term: "“AI slop”", def: "OpenAI's own term for the uneven, suboptimal code patterns that spread through a repository once an agent starts copying its own earlier, imperfect work." },
        { term: "Quality grade (per domain)", def: "a running score tracking how well a specific part of the codebase follows the team's encoded best practices, updated over time rather than checked only once." }
      ]} />
    </section>
  );
}

/* --------------------------------------------------------------------------
   SECTION: LEARNING SUMMARY
   -------------------------------------------------------------------------- */
function LearningSummary({ principle, mcq, tf, fermi, score, total, warmUpResult, insightSlot, setInsightSlot, insightRevealed, setInsightRevealed, applyPresent, setApplyPresent, apply2027, setApply2027, registerScore, onContinue }) {
  const AUTHORED_PRINCIPLES = {
    rq1: "Making an agent's environment legible — a table-of-contents AGENTS.md into a structured docs system, a mechanically enforced layered architecture, and a fully observable runtime — is what lets an agent operate reliably on ambiguous goals; anything it can't access in-context while running effectively doesn't exist for it.",
    rq2: "Under-specification and entropy are different failure modes needing different fixes: build the missing capability once for the first, and encode mechanical, continuously-enforced rules (not periodic manual review) for the second, because manual review cannot keep pace with a problem that compounds with output volume.",
    rq3: "Pushing review effort to agents reviewing agents, iterated until every reviewer is satisfied, plus a running quality scorecard, is a process-first bet that iteration catches problems — a genuinely different bet than instrumenting each specific failure mode separately, and it is what let a single prompt eventually drive an entire bug-fix lifecycle end to end."
  };
  const AUTHORED_INSIGHTS = [
    "OpenAI's own AGENTS.md failure — one giant file that crowded out context, diluted guidance, rotted, and resisted mechanical verification — shows that legibility isn't the same as documentation volume; a 100-line table of contents into a structured, linted docs system beat an encyclopedia, because it matched how a model actually consumes context, not how a human skims a wiki.",
    "The Friday-cleanup era proves that “add more human review” is not a safe default response to AI-driven quality drift once code volume is no longer bounded by human typing speed: a fixed 20%-of-the-week human slot failed specifically because it could not scale with the thing it was trying to control, while a mechanical rule plus an always-running cleanup agent could.",
    "OpenAI's single-prompt, end-to-end bug-fix threshold is not evidence that a capable enough model automatically reaches this point — OpenAI's own explicit caveat is that it depends on this specific repository's five months of harness investment, meaning the achievement is a property of the environment built, not of the model alone."
  ];

  const missed = [];
  Object.keys(mcq).forEach(id => {
    const q = mcq[id];
    if (q && q.submitted && q.options && q.selected != null && !q.options[q.selected].correct) missed.push({ id, error: q.options[q.selected].errorName });
  });
  Object.keys(tf || {}).forEach(id => {
    const q = tf[id];
    if (q && q.submitted && id === "rq2-tg" && q.choice === true) missed.push({ id, error: "confusing a metric for its cause" });
  });

  const applyPresentComplete = applyPresent.thesis.length > 10 && applyPresent.assumption.length > 10 && applyPresent.disconfirm.length > 10 && applyPresent.premortem.length > 10;

  const te2027Options = [
    { text: "The load-bearing assumption it replaces is that OpenAI needs three separate document owners (docs, architecture, quality) to maintain the system indefinitely, which 2027-era tooling would consolidate into one role regardless of model capability, freeing headcount without changing what the docs system or the layered architecture actually enforces.", correct: false, errorName: "scope creep misdiagnosis", explanation: "Document ownership structure is an organizational detail, not the load-bearing technical assumption a 2027-era reasoning improvement would actually replace — the argument is about diagnostic capability, not staffing." },
    { text: "The load-bearing assumption it replaces is that mechanically enforced, external rules (golden principles, layer boundaries, lint checks) are the only reliable way to prevent drift — but if production-scale testing showed 2027-era models still confidently reproduced a subtly bad pattern they had judged as “good” under their own self-review, that finding would most directly weaken this article's governing principle, because it would show self-review still needs the same external, mechanical checks.", correct: true, whyCorrect: "This correctly names the load-bearing assumption a 2027-era self-review improvement would replace, and states a concrete, falsifying observation (confidently wrong self-judgment persisting despite better reasoning) as required.", generalizes: "any argument for replacing external, mechanical enforcement with a model's own improved self-review or self-judgment as models get better" },
    { text: "The load-bearing assumption it replaces is that OpenAI's specific choice of tools — Victoria Logs, Victoria Metrics, Victoria Traces, and Vector — is the only observability stack capable of making a running application legible to an agent, so the argument depends specifically on those named tools rather than on the general idea of runtime legibility.", correct: false, errorName: "single-cause fallacy", explanation: "The argument about runtime legibility mattering doesn't depend on which specific named tools implement it — treating the tool brand names as the load-bearing piece conflates one implementation detail with the actual structural claim (that the running system must be observable to the agent) being tested." },
    { text: "The load-bearing assumption it replaces is that OpenAI's tool catalog and codebase will simply stop growing once foundation models improve enough, removing the need for the layered architecture and Providers interface entirely and letting a future team skip the architectural enforcement this article's first research question described.", correct: false, errorName: "applying classical software assumptions to AI", explanation: "Codebase growth is unrelated to whether improved model reasoning would let a team drop mechanical architectural enforcement — a better model does not change how much code a growing product needs, so this option answers a question that wasn't asked." }
  ];

  return (
    <section id="summary" style={{ paddingTop: 24 }}>
      <SectionHeading id="summary">Learning Summary</SectionHeading>

      <h3 style={{ fontSize: 18 }}>Score breakdown</h3>
      <p>You answered {total} scored questions and got {score} correct.</p>
      {missed.length > 0 ? (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>Reasoning errors to revisit:</div>
          {missed.map((m, i) => <div key={i} style={{ fontSize: 14, marginBottom: 4 }}>• {m.error || "see explanation above"}</div>)}
        </div>
      ) : <p style={{ fontSize: 14, color: "#64748B" }}>No missed questions yet, or none answered.</p>}
      <p style={{ fontSize: 14 }}>
        Warm-up: {warmUpResult.skipped ? `Skipped — 3 prior principles not reviewed this session.` : `${warmUpResult.completed} of 3 prior principles reviewed.`}
      </p>

      <h3 style={{ fontSize: 18 }}>Principle production review</h3>
      {["rq1", "rq2", "rq3"].map(id => (
        <div key={id} style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: 14, marginBottom: 10 }}>
          <div style={{ fontSize: 12, color: "#64748B", textTransform: "uppercase", fontWeight: 700 }}>{id.toUpperCase()}</div>
          <div style={{ marginTop: 6 }}><strong>Your submission:</strong> {principle[id] || "(not submitted)"}</div>
          <div style={{ marginTop: 6 }}><strong>Authored:</strong> {AUTHORED_PRINCIPLES[id]}</div>
        </div>
      ))}
      <p style={{ fontSize: 14 }}>Which of your stated principles surprised you most compared to the authored version? Why?</p>

      <h3 style={{ fontSize: 18 }}>Three insight slots</h3>
      <p>You have seen evidence across three research questions and a real failure. Write the single most non-obvious insight you would defend to a skeptical CTO, before seeing the authored insights.</p>
      {!insightRevealed ? (
        <>
          <textarea rows={3} value={insightSlot} onChange={e => setInsightSlot(e.target.value)}
            placeholder="Your insight (min. 30 characters)..."
            style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, fontFamily: "inherit" }} />
          <div style={{ marginTop: 8 }}>
            <button disabled={insightSlot.length < 30} style={btnStyle(insightSlot.length < 30)} onClick={() => setInsightRevealed(true)}>
              {insightSlot.length < 30 ? `Enter ${30 - insightSlot.length} more characters` : "Reveal authored insights"}
            </button>
          </div>
        </>
      ) : (
        <div>
          <div style={{ padding: 10, background: "#F8FAFC", borderRadius: 6, marginBottom: 10 }}><strong>Your insight:</strong> {insightSlot}</div>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>How your insight compares:</div>
          {AUTHORED_INSIGHTS.map((a, i) => <div key={i} style={{ padding: 10, background: "#ECFDF5", borderRadius: 6, marginBottom: 8, fontSize: 14 }}>{a}</div>)}
        </div>
      )}

      <h3 style={{ fontSize: 18 }}>Apply It</h3>
      <Callout kind="note">
        <div style={{ fontWeight: 600, marginBottom: 8 }}>Present-day variant</div>
        <p style={{ marginTop: 0 }}>Apply the governing principle to a company or product you know. Fill in all four labeled parts.</p>
        {["thesis", "assumption", "disconfirm", "premortem"].map((key, i) => {
          const labels = ["One-sentence so-what thesis", "Load-bearing assumption", "Strongest disconfirming evidence from the article", "One-line pre-mortem: “If this fails in 12 months, the most likely reason is ___.”"];
          return (
            <div key={key} style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{labels[i]}</div>
              <input value={applyPresent[key]} onChange={e => setApplyPresent(prev => ({ ...prev, [key]: e.target.value }))}
                disabled={applyPresent.submitted}
                style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14 }} />
            </div>
          );
        })}
        {!applyPresent.submitted ? (
          <button disabled={!applyPresentComplete} style={btnStyle(!applyPresentComplete)}
            onClick={() => setApplyPresent(prev => ({ ...prev, submitted: true }))}>
            {applyPresentComplete ? "Submit" : "Fill in all four parts to enable Submit"}
          </button>
        ) : (
          <div style={{ padding: 10, background: "#ECFDF5", borderRadius: 6, marginTop: 8 }}>
            Saved. A strong response climbs from observation ("OpenAI's agent writes a lot of code fast") to a quantified, decision-relevant implication — for example, naming the specific harness investment (docs restructuring, layered architecture, an observability stack, a review loop) your chosen company would still need to build, and what evidence would tell you it's missing.
          </div>
        )}
      </Callout>

      <Callout kind="note">
        <div style={{ fontWeight: 600, marginBottom: 8 }}>2027 forward-looking variant (T-E, with falsification clause)</div>
        <MCQ id="apply2027-te" label="Forward-looking implication" registerScore={registerScore}
          prompt={"Given OpenAI's own case, but assuming 2027-era models can reliably self-review their own code well enough to catch subtly bad patterns without any external, mechanical rule — a capability that does not fully exist in the systems described in this article — which load-bearing assumption in OpenAI's current entropy-prevention design would this most directly replace, and what evidence would most change confidence in the article's governing principle?"}
          options={te2027Options} state={apply2027} setState={setApply2027} />
      </Callout>

      <h3 style={{ fontSize: 18 }}>Return to section map — principles to revisit</h3>
      {missed.length > 0 ? missed.map((m, i) => <div key={i} style={{ fontSize: 14 }}>• {m.id}: {m.error || "see explanation above"}</div>) : <p style={{ fontSize: 14, color: "#64748B" }}>Nothing missed to revisit yet.</p>}

      <div style={{ textAlign: "center", margin: "30px 0" }}>
        <button style={btnStyle(false)} onClick={onContinue}>Continue to Conclusion →</button>
      </div>
    </section>
  );
}

/* --------------------------------------------------------------------------
   SECTION: CONCLUSION
   -------------------------------------------------------------------------- */
function Conclusion({ ptf, setPtf }) {
  return (
    <section id="conclusion" style={{ paddingTop: 24 }}>
      <SectionHeading id="conclusion">Conclusion</SectionHeading>
      <p>The governing principle holds up well against both the success evidence and the failure case, with one honest amendment: designing the environment — legible docs, enforced architecture, observable runtime, agent-to-agent review — is what let three engineers, growing to seven, merge about 1,500 pull requests and roughly a million lines of code in five months with zero manually-written lines, and it is also what eventually stopped entropy, but only after a first, human-shaped fix (weekly manual cleanup) failed and cost 20% of the week. Partial failure of this principle looks exactly like OpenAI's Friday-cleanup era: a team with a genuinely well-designed environment for code generation still exposed at the one layer they had not yet made mechanical — catching drift in the patterns Codex was allowed to copy.</p>
      <p>For an AI PM, this changes what "we've adopted AI-native development" should mean when a team claims it. The right follow-up question is not "how much of your code does the agent write" but "what have you made mechanically enforceable — your architecture's dependency rules, your data-boundary checks, your documentation's freshness — versus what are you still asking a human to remember to check periodically." A team that has delegated code-writing but still relies on a person's memory or a weekly meeting to catch drift has OpenAI's throughput without OpenAI's entropy fix, which is close to where OpenAI itself started.</p>
      <p>For a future CTO, the platform implication is that harness investment — the docs system, the layered architecture and its linters, the runtime observability stack, the review loop, the quality scorecard — is not overhead you pay once and then move past. It is the actual product of the engineering organization once agents are doing the coding, and OpenAI's own account is explicit that this kind of architectural discipline is normally something companies postpone until they have hundreds of engineers, not something a 3-person team would usually build in month one. Building it early, before scale strictly requires it, is what let this team's throughput rise instead of fall as headcount grew.</p>
      <p>The most important question this case does not answer is how architectural coherence, and the golden-principles-plus-cleanup-agent fix specifically, holds up over years rather than five months — OpenAI itself says plainly that it does not yet know how this evolves over a longer horizon, where human judgment adds the most leverage in a system like this, or how any of it changes as the underlying models keep improving. The team frames the work ahead not as writing better code, but as "designing environments, feedback loops, and control systems" — and no company, including OpenAI, has yet published what that discipline looks like at three or five years of compounding, rather than five months.</p>

      <PatternTransferQ id="final-tf" state={ptf} setState={setPtf}
        prompt={"Final pattern transfer. The article's governing principle is: when agents write all the code, the engineering team's job becomes designing the environment — repo-local legibility, mechanically enforced architecture, and full runtime observability — that lets an agent do reliable work, and that same full autonomy also produces new failure modes (like entropy) that need mechanical, not manual, fixes. Apply this to a regional public-transit agency building and maintaining its own real-time bus-tracking and rider-alert system entirely with a coding agent, with a small team of engineers steering it. Name the principle accurately, apply it to this new context in a genuinely non-trivial way (not a re-labeling of OpenAI's internal software product), and name a new failure mode that would not appear in any of this article's evidence."} />

      <div style={{ marginTop: 40, borderTop: "1px solid #E2E8F0", paddingTop: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Sources</div>
        {SOURCES.map((s, i) => (
          <div key={i} style={{ fontSize: 13, marginBottom: 10, lineHeight: 1.5 }}>
            <a href={s.url} target="_blank" rel="noreferrer">{s.name}</a> ({s.year}) — <em>{s.tier}</em>. Used for: {s.use}
          </div>
        ))}
      </div>
    </section>
  );
}
