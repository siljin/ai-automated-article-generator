/* --------------------------------------------------------------------------
   SMALL UI PRIMITIVES
   -------------------------------------------------------------------------- */
function Callout({ kind, children }) {
  const styles = {
    note: { background: "#F8FAFC", border: "1px solid #E2E8F0" },
    amber: { background: "#FFFBEB", borderLeft: "3px solid #d97706" },
    fail: { background: "#FEF2F2", border: "1px solid #FCA5A5" }
  };
  return <div style={{ ...styles[kind], borderRadius: 8, padding: "14px 16px", margin: "16px 0", fontSize: 14.5, lineHeight: 1.6 }}>{children}</div>;
}

function ProvenanceNote({ children }) {
  return <div style={{ fontSize: 12.5, color: "#64748B", marginTop: 8, fontStyle: "italic" }}>{children}</div>;
}

function SectionHeading({ children, id }) {
  return <h2 id={id + "-heading"} style={{ fontSize: 24, marginTop: 40, marginBottom: 12, scrollMarginTop: 90 }}>{children}</h2>;
}

function Glossary({ items }) {
  if (!items || items.length === 0) return null;
  return (
    <div style={{ background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 8, padding: "16px 18px", marginTop: 32 }}>
      <div style={{ fontWeight: 700, fontSize: 13, letterSpacing: 0.4, color: "#475569", textTransform: "uppercase", marginBottom: 10 }}>Glossary</div>
      {items.map((g, i) => (
        <div key={i} style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 6 }}>
          <strong>{g.term}</strong> — {g.def}
        </div>
      ))}
    </div>
  );
}

function PrincipleGate({ sectionId, value, onChange }) {
  const [submitted, setSubmitted] = useState(!!value && value.length >= 20);
  return (
    <Callout kind="note">
      <div style={{ fontWeight: 600, marginBottom: 8 }}>Principle in one sentence</div>
      <div style={{ marginBottom: 10 }}>State the transferable principle from this section — something a PM or CTO at a different company could apply tomorrow. (Min. 20 characters. Not scored; you may move to any section regardless.)</div>
      <textarea
        value={value}
        onChange={e => onChange(e.target.value)}
        rows={2}
        style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, fontFamily: "inherit" }}
        placeholder="Type your one-sentence principle here..."
      />
      <div style={{ marginTop: 8 }}>
        <button
          disabled={!value || value.length < 20}
          onClick={() => setSubmitted(true)}
          style={btnStyle(!value || value.length < 20)}
        >
          {submitted ? "Submitted" : (value && value.length < 20 ? `Enter ${20 - value.length} more characters` : "Submit")}
        </button>
      </div>
      {submitted && value.length >= 20 && (
        <div style={{ marginTop: 10, padding: 10, background: "#fff", border: "1px solid #E2E8F0", borderRadius: 6 }}>
          Your principle is saved to your Learning Summary for comparison against the authored version. This step never blocks navigation.
        </div>
      )}
    </Callout>
  );
}

function btnStyle(disabled) {
  return {
    background: disabled ? "#E2E8F0" : "#111",
    color: disabled ? "#94A3B8" : "#fff",
    border: "none",
    borderRadius: 6,
    padding: "8px 16px",
    fontSize: 14,
    cursor: disabled ? "not-allowed" : "pointer"
  };
}

/* --------------------------------------------------------------------------
   CHART INTERPRETATION WRAPPER (two independently-gated prompts)
   -------------------------------------------------------------------------- */
function ChartInterp({ chartId, prompts, state, setState }) {
  const st = state[chartId] || [{ submitted: false, text: "" }, { submitted: false, text: "" }];
  function update(i, patch) {
    const next = st.map((p, idx) => idx === i ? { ...p, ...patch } : p);
    setState(prev => ({ ...prev, [chartId]: next }));
  }
  return (
    <div style={{ margin: "18px 0 28px" }}>
      {prompts.map((p, i) => (
        <div key={i} style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#475569", textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }}>
            Interpretation prompt {i + 1} · {p.kind}
          </div>
          <div style={{ marginBottom: 10, fontSize: 15 }}>{p.text}</div>
          {!st[i].submitted ? (
            <>
              <textarea
                value={st[i].text}
                onChange={e => update(i, { text: e.target.value })}
                rows={2}
                style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, fontFamily: "inherit" }}
                placeholder="Your answer (min. 15 characters)..."
              />
              <div style={{ marginTop: 8 }}>
                <button
                  disabled={st[i].text.length < 15}
                  onClick={() => update(i, { submitted: true })}
                  style={btnStyle(st[i].text.length < 15)}
                >
                  {st[i].text.length < 15 ? `Enter ${15 - st[i].text.length} more characters` : "Submit"}
                </button>
              </div>
            </>
          ) : (
            <div>
              <div style={{ padding: 10, background: "#F8FAFC", borderRadius: 6, marginBottom: 8 }}>
                <strong>Your answer:</strong> {st[i].text}
              </div>
              <div style={{ padding: 10, background: "#ECFDF5", borderRadius: 6, border: "1px solid #A7F3D0" }}>
                <strong>Compare your answer to the authored one:</strong> {p.authored}
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* --------------------------------------------------------------------------
   MULTIPLE CHOICE (T-A, T-B, T-H share this; T-C is a styled variant)
   -------------------------------------------------------------------------- */
function MCQ({ id, label, prompt, options, state, setState, styleVariant, registerScore }) {
  const q = state[id] || { selected: null, submitted: false, attemptCount: 0, scaffolding: false };
  useEffect(() => {
    if (q.submitted && registerScore) registerScore(id, !!(options[q.selected] && options[q.selected].correct));
  }, [q.submitted]);
  function select(i) {
    if (q.submitted) return;
    setState(prev => ({ ...prev, [id]: { ...q, selected: i } }));
  }
  function submit() {
    const correct = options[q.selected].correct;
    setState(prev => ({
      ...prev,
      [id]: { ...q, submitted: true, options, attemptCount: q.attemptCount + 1, scaffolding: !correct && q.attemptCount + 1 >= 2 }
    }));
  }
  function tryAgain() {
    setState(prev => ({ ...prev, [id]: { ...q, submitted: false, selected: null } }));
  }
  const wrapperStyle = styleVariant === "amber"
    ? { background: "#FFFBEB", borderLeft: "3px solid #d97706", borderRadius: 8, padding: "16px 18px", margin: "20px 0" }
    : { border: "1px solid #E2E8F0", borderRadius: 8, padding: "16px 18px", margin: "20px 0" };
  return (
    <div style={wrapperStyle}>
      {styleVariant === "amber" && <div style={{ fontSize: 12, fontWeight: 700, color: "#B45309", textTransform: "uppercase", marginBottom: 6 }}>Case Prompt</div>}
      <div style={{ fontSize: 12, fontWeight: 700, color: "#475569", textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }}>{label}</div>
      <div style={{ marginBottom: 12, fontSize: 15.5, whiteSpace: "pre-line" }}>{prompt}</div>
      <div style={{ display: "grid", gap: 8 }}>
        {options.map((opt, i) => {
          let border = "1px solid #CBD5E1", bg = "#fff";
          if (q.submitted) {
            if (opt.correct) { border = "1px solid #10B981"; bg = "#ECFDF5"; }
            else if (i === q.selected) { border = "1px solid #EF4444"; bg = "#FEF2F2"; }
          } else if (i === q.selected) { border = "2px solid #111"; }
          return (
            <div key={i}
              onClick={() => select(i)}
              style={{ border, background: bg, borderRadius: 8, padding: "10px 12px", cursor: q.submitted ? "default" : "pointer", fontSize: 14.5 }}>
              <strong>{String.fromCharCode(65 + i)}.</strong> {opt.text}
            </div>
          );
        })}
      </div>
      {!q.submitted && q.selected !== null && (
        <div style={{ marginTop: 10 }}><button style={btnStyle(false)} onClick={submit}>Submit</button></div>
      )}
      {q.selected === null && !q.submitted && (
        <div style={{ marginTop: 10, fontSize: 13, color: "#94A3B8" }}>Select an option to enable Submit.</div>
      )}
      {q.submitted && (
        <div style={{ marginTop: 12 }}>
          {options[q.selected].correct ? (
            <div style={{ padding: 10, background: "#ECFDF5", borderRadius: 6 }}>
              <strong>Correct</strong> — this reasoning pattern generalizes to {options[q.selected].generalizes}. {options[q.selected].explanation}
            </div>
          ) : (
            <div style={{ padding: 10, background: "#FEF2F2", borderRadius: 6 }}>
              <strong>Incorrect</strong> — this is {options[q.selected].errorName}: {options[q.selected].explanation}
            </div>
          )}
          <div style={{ marginTop: 8, fontSize: 13.5, color: "#475569" }}>
            {options.find(o => o.correct).whyCorrect}
          </div>
          {q.scaffolding && !options[q.selected].correct && (
            <Callout kind="note">
              <strong>Scaffolding:</strong> {options[q.selected].scaffold}
            </Callout>
          )}
          {!options[q.selected].correct && (
            <div style={{ marginTop: 8 }}>
              <button style={btnStyle(false)} onClick={tryAgain}>Try again</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------------------------
   TRUE / FALSE WITH JUSTIFICATION (T-G)
   -------------------------------------------------------------------------- */
function TrueFalseQ({ id, prompt, correctValue, authoredJustification, errorName, state, setState, registerScore }) {
  const q = state[id] || { choice: null, justification: "", submitted: false };
  useEffect(() => {
    if (q.submitted && registerScore) registerScore(id, q.choice === correctValue);
  }, [q.submitted]);
  function submit() {
    setState(prev => ({ ...prev, [id]: { ...q, submitted: true } }));
  }
  const canSubmit = q.choice !== null && q.justification.length >= 15;
  return (
    <div style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: "16px 18px", margin: "20px 0" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#475569", textTransform: "uppercase", marginBottom: 6 }}>True / False with justification</div>
      <div style={{ marginBottom: 12, fontSize: 15.5 }}>{prompt}</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {["True", "False"].map((label, i) => {
          const val = i === 0;
          let border = "1px solid #CBD5E1", bg = "#fff";
          if (q.submitted) {
            if (val === correctValue) { border = "1px solid #10B981"; bg = "#ECFDF5"; }
            else if (val === q.choice) { border = "1px solid #EF4444"; bg = "#FEF2F2"; }
          } else if (val === q.choice) border = "2px solid #111";
          return (
            <div key={label} onClick={() => !q.submitted && setState(prev => ({ ...prev, [id]: { ...q, choice: val } }))}
              style={{ flex: 1, textAlign: "center", border, background: bg, borderRadius: 8, padding: "10px 0", cursor: q.submitted ? "default" : "pointer", fontWeight: 600 }}>
              {label}
            </div>
          );
        })}
      </div>
      {!q.submitted && (
        <>
          <textarea
            value={q.justification}
            onChange={e => setState(prev => ({ ...prev, [id]: { ...q, justification: e.target.value } }))}
            rows={2}
            placeholder="Justify your answer in one sentence, naming the specific evidence (min. 15 characters)..."
            style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ marginTop: 8 }}>
            <button disabled={!canSubmit} style={btnStyle(!canSubmit)} onClick={submit}>
              {q.choice === null ? "Select True or False" : (q.justification.length < 15 ? `Enter ${15 - q.justification.length} more characters` : "Submit")}
            </button>
          </div>
        </>
      )}
      {q.submitted && (
        <div style={{ marginTop: 8 }}>
          <div style={{ padding: 10, background: "#F8FAFC", borderRadius: 6, marginBottom: 8 }}>
            <strong>Your justification:</strong> {q.justification}
          </div>
          <div style={{ padding: 10, background: q.choice === correctValue ? "#ECFDF5" : "#FEF2F2", borderRadius: 6 }}>
            {q.choice === correctValue
              ? <><strong>Correct.</strong> Authored justification: {authoredJustification}</>
              : <><strong>Incorrect — this is {errorName}.</strong> Authored justification: {authoredJustification}</>}
          </div>
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------------------------
   FERMI / NUMERIC ESTIMATION (T-D)
   -------------------------------------------------------------------------- */
function FermiQ({ id, prompt, assumptions, tolerancePct, answer, decomposition, scaffold, state, setState, min, max, step }) {
  const q = state[id] || { value: "", submitted: false };
  function submit() {
    setState(prev => ({ ...prev, [id]: { ...q, submitted: true } }));
  }
  const num = parseFloat(q.value);
  const withinTol = !isNaN(num) && Math.abs(num - answer) / answer <= tolerancePct;
  const farOff = !isNaN(num) && Math.abs(num - answer) / answer > 0.5;
  return (
    <div style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: "16px 18px", margin: "20px 0" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#475569", textTransform: "uppercase", marginBottom: 6 }}>Engineering estimation (Fermi) · tolerance ±{Math.round(tolerancePct * 100)}%</div>
      <div style={{ marginBottom: 10, fontSize: 15.5, whiteSpace: "pre-line" }}>{prompt}</div>
      <div style={{ background: "#F8FAFC", borderRadius: 6, padding: 10, marginBottom: 10, fontSize: 13.5 }}>
        <strong>Assumptions stated for this estimate:</strong> {assumptions}
      </div>
      {!q.submitted ? (
        <>
          <input type="range" min={min} max={max} step={step} value={q.value || min}
            onChange={e => setState(prev => ({ ...prev, [id]: { ...q, value: e.target.value } }))}
            style={{ width: "100%" }} />
          <input type="number" value={q.value}
            onChange={e => setState(prev => ({ ...prev, [id]: { ...q, value: e.target.value } }))}
            placeholder="Enter your estimate"
            style={{ width: 160, borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, marginTop: 8 }} />
          <div style={{ marginTop: 8 }}>
            <button disabled={q.value === ""} style={btnStyle(q.value === "")} onClick={submit}>
              {q.value === "" ? "Enter a value to enable Submit" : "Submit"}
            </button>
          </div>
        </>
      ) : (
        <div>
          <div style={{ position: "relative", height: 40, margin: "16px 0" }}>
            <div style={{ position: "absolute", top: 18, left: 0, right: 0, height: 4, background: "#E2E8F0", borderRadius: 2 }} />
            <div style={{ position: "absolute", top: 0, left: `${Math.min(100, Math.max(0, (num - min) / (max - min) * 100))}%`, transform: "translateX(-50%)", fontSize: 12 }}>▼ You: {num}</div>
            <div style={{ position: "absolute", top: 24, left: `${Math.min(100, Math.max(0, (answer - min) / (max - min) * 100))}%`, transform: "translateX(-50%)", fontSize: 12, color: "#059669" }}>▲ Actual: {answer}</div>
          </div>
          <div style={{ padding: 10, borderRadius: 6, background: withinTol ? "#ECFDF5" : "#FEF2F2" }}>
            <strong>{withinTol ? "Within tolerance." : "Outside tolerance."}</strong> Decomposition: {decomposition}
          </div>
          {!withinTol && farOff && (
            <Callout kind="note"><strong>Scaffolding:</strong> {scaffold}</Callout>
          )}
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------------------------
   PATTERN TRANSFER (T-F, free text)
   -------------------------------------------------------------------------- */
function PatternTransferQ({ id, prompt, state, setState }) {
  const q = state[id] || { text: "", submitted: false, checks: [false, false, false] };
  const canSubmit = q.text.length >= 50;
  return (
    <div style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: "16px 18px", margin: "20px 0" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#475569", textTransform: "uppercase", marginBottom: 6 }}>Pattern transfer · highest-order question</div>
      <div style={{ marginBottom: 10, fontSize: 15.5, whiteSpace: "pre-line" }}>{prompt}</div>
      {!q.submitted ? (
        <>
          <textarea
            value={q.text}
            onChange={e => setState(prev => ({ ...prev, [id]: { ...q, text: e.target.value } }))}
            rows={4}
            placeholder="Min. 50 characters. Name the principle, apply it non-trivially, and name a new failure mode..."
            style={{ width: "100%", borderRadius: 6, border: "1px solid #CBD5E1", padding: 8, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ marginTop: 8 }}>

  const [showConclusion, setShowConclusion] = useState(false);
  const [insightSlot, setInsightSlot] = useState("");
  const [insightRevealed, setInsightRevealed] = useState(false);
  const [applyPresent, setApplyPresent] = useState({ thesis: "", assumption: "", disconfirm: "", premortem: "", submitted: false });
  const [apply2027, setApply2027] = useState({});
  const [progressPct, setProgressPct] = useState(0);
  const [scoreRegistry, setScoreRegistry] = useState({});

  useEffect(() => {
    function onResize() { setWide(window.innerWidth > 1160); }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    if (screen !== "article") return;
    function onScroll() {
      const offset = 140;
      let current = NAV_ITEMS[0].id;
      for (const item of NAV_ITEMS) {
        const el = document.getElementById(item.id);
        if (el && el.getBoundingClientRect().top - offset <= 0) current = item.id;
      }
      setActive(current);
      const doc = document.documentElement;
      const pct = Math.min(100, Math.max(0, (window.scrollY / (doc.scrollHeight - window.innerHeight)) * 100));
      setProgressPct(pct);
    }
    window.addEventListener("scroll", onScroll);
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [screen, showSummary, showConclusion]);

  function navTo(id) {
    if (id === "summary") setShowSummary(true);
    if (id === "conclusion") setShowConclusion(true);
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }, 30);
  }

  function registerScore(id, correct) {
    setScoreRegistry(prev => (prev[id] === correct ? prev : { ...prev, [id]: correct }));
  }
  const scoreEntries = Object.values(scoreRegistry);
  const score = scoreEntries.filter(Boolean).length;

  if (screen === "warmup") {
    return <WarmUpScreen onDone={(completed, all) => { setWarmUpResult({ completed, all, skipped: completed === 0 }); setScreen("article"); }} />;

  return (
    <div style={{ maxWidth: 720, margin: "0 auto", padding: "0 20px 80px", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif", color: "#111", lineHeight: 1.7, fontSize: 16 }}>

function Introduction() {
  return (
    <section id="intro" style={{ paddingTop: 24 }}>
      <Callout kind="note">
        <strong>Governing principle.</strong> When agents write all the code, the engineering team's job stops being "write code" and becomes "design the environment that lets an agent do reliable work" — repo-local legibility, mechanically enforced architecture, and full runtime observability, not a smarter model, are what let throughput rise as the team scales. OpenAI's Harness Engineering project is the clearest evidence: three engineers, growing to seven, merged roughly 1,500 pull requests and about a million lines of code over five months with zero manually-written lines, and throughput rose rather than fell as headcount grew — but the same full autonomy that produced this also produced a real failure, entropy ("AI slop"), that first cost 20% of the team's week before being re-engineered away.
      </Callout>

      <SectionHeading id="intro">Introduction</SectionHeading>
      <p>OpenAI's own Codex team ran a five-month experiment: build and ship a real internal software product without any engineer typing a single line of the code themselves. Codex is OpenAI's coding agent — a system that reads a task, writes code, tests it, and opens a pull request on its own. The team's account, published on OpenAI's engineering blog in February 2026, is the evidence this article uses, because it is a rare thing: a company naming exactly what its human engineers stopped doing, and exactly what they started doing instead (OpenAI Engineering Blog, 2026). OpenAI is the right case not because it is famous, but because it ran the experiment to its logical extreme — zero manually-written code, for five full months — and published the failure along with the win.</p>
      <p>The project started with the first commit to an empty code repository (a shared, versioned folder of files) in late August 2025, and the account was published February 11, 2026 — just under five months later (OpenAI Engineering Blog, 2026). In that time, the repository grew to "on the order of a million lines of code" spanning application logic, infrastructure, tooling, documentation, and internal developer utilities, through roughly 1,500 merged pull requests — batches of proposed code changes that get reviewed and folded into the shared codebase (OpenAI Engineering Blog, 2026). The team driving this started at 3 engineers and grew to 7 by publication time, and OpenAI states plainly that average throughput — 3.5 merged pull requests per engineer per day — rose, not fell, as headcount grew (OpenAI Engineering Blog, 2026). OpenAI's own estimate is that this took "about 1/10th the time it would have taken to write the code by hand" (OpenAI Engineering Blog, 2026).</p>
      <p>The conventional way AI coding tools get used today assumes a human is still the author: a developer writes most of the code and accepts an AI suggestion here, delegates a small task there. That model has an obvious ceiling — a human still has to read, understand, and approve almost everything, so the team's speed still tracks the humans' attention span. OpenAI's Codex team removed that ceiling on purpose. Humans never wrote code, so the human's job had to become something else entirely: deciding what to build, and building the surrounding structure — documentation, tests, lint rules, observability — that lets an agent do that work reliably without a human checking every line. That is the structural gap this article studies: what specifically does an engineering team have to build, once code-writing itself is fully delegated, to keep the resulting system from decaying?</p>
      <p>This article addresses three questions. First, how is the Codex team's environment actually structured so that an agent can operate on ambiguous goals without constant human hand-holding — what do the documentation system, the code architecture, and the running application itself have to look like? Second, what specific ways did this fully agent-written system fail in practice, and how did OpenAI fix each failure mechanically rather than by asking Codex to "try harder"? Third, how does OpenAI actually decide whether Codex's work is trustworthy enough to merge, beyond "did the code compile"?</p>

      <Glossary items={[
        { term: "Codex", def: "OpenAI's coding agent — a system built on an OpenAI language model that can read a task, write and test code, and open a pull request on its own." },
        { term: "Repository (repo)", def: "a shared, version-controlled folder of code and files that a team edits together over time." },
        { term: "Pull request (PR)", def: "a proposed, reviewable batch of code changes waiting to be merged into the main shared codebase." },
        { term: "AGENTS.md", def: "a file, written for an AI agent rather than a human, that tells the agent how to work in a given repository." }
      ]} />
    </section>
  );
}

function Landscape({ interp, setInterp }) {
  return (
    <section id="landscape" style={{ paddingTop: 24 }}>
      <SectionHeading id="landscape">Technical and Product Landscape</SectionHeading>
      <p>Most AI coding tools on the market today are built around a different paradigm than OpenAI's Codex team used: AI assists a human who still writes and owns the code. Cursor is the clearest example — its architecture splits work into a sub-second "Tab" lane for inline suggestions and a slower agent lane for larger tasks, but a human developer reads and accepts every suggestion, and the human remains the final author of record (Evidently AI, 2025). GitHub Copilot follows the same paradigm from a different angle: its context-assembly pipeline decides what code and documentation to show the model before it suggests anything, but the suggestion is exactly that — a suggestion a human chooses to accept or reject line by line (GitHub Engineering Blog, 2026). In both products, the ceiling on team speed is still a human's reading speed and attention span, because a human is still the one who has to understand and sign off on the code before it ships.</p>
      <p>A partial precedent for full agent authorship already exists in Replit Agent, which lets an agent write and deploy an entire application from a natural-language prompt, using a multi-agent harness (a planner, several "doer" agents, and a checker) and copy-on-write storage so mistakes are cheap to undo (Replit Blog, 2025). But Replit Agent is built for a single working session with one user watching — it is not a persistent, multi-month engineering organization where several agents and several humans coordinate on one shared, growing codebase over time the way a real engineering team does. OpenAI's Codex team sits on the far side of that gap: not one agent building one app in one sitting, but a standing engineering practice, sustained for five months, where agents are the only authors and humans manage the practice itself.</p>
      <p>Two other companies in this series show a related but different kind of agent scaling: not "who writes the code" but "how many jobs can one agent platform do." Meta built one shared layer of tool interfaces that powers two structurally different jobs — finding capacity problems and fixing them — by swapping only the layer that encodes domain judgment, and used that same reusable foundation to expand into five more applications within about a year with few or no new data integrations (Meta Engineering, 2026). Cox Automotive built a shared runtime, memory, and observability foundation on Amazon Bedrock AgentCore and moved 17 of 57 evaluated agent ideas into production within about a year (AWS, 2026). Both are stories about scaling how many agents a company runs. OpenAI's case is a story about scaling how much of one team's actual code-writing work an agent can own — a different axis of the same underlying shift toward agent-run engineering.</p>
      <p>The gap this creates is concrete, not philosophical. In the assist-a-human paradigm, quality control happens inside a human's head, one suggestion at a time, and it scales only as fast as human reading does. In OpenAI's zero-manually-written-code paradigm, there is no human reading each line by default, so quality control has to be built into the environment itself — into what the agent can see, what rules are checked automatically, and what the running system tells the agent about its own behavior. That is a different kind of engineering problem than "make better AI suggestions," and it is the one this article's three research questions dig into.</p>

      ]} />

      <BuildTimeChart />
      <ChartInterp chartId="chart-landscape-2" state={interp} setState={setInterp} prompts={[
        { kind: "So-what / sizing", text: "Using a sizing framework, if a different mid-size engineering team estimated a comparable internal product would normally take 20 human-engineer-months to build, and applied OpenAI's own reported “1/10th the time” multiplier, what would their projected Codex-driven timeline be, and which single input in that calculation would most change the answer if it turned out to be wrong for their specific codebase?", authored: "20 months ÷ 10 = roughly 2 months on OpenAI's reported multiplier. The input that most changes this answer is whether the “1/10th the time” figure generalizes to a codebase without OpenAI's five months of environment investment (the AGENTS.md redesign, the layered architecture, the observability stack) already built — a team starting from zero legibility work would likely see a smaller multiplier at first, since much of OpenAI's speed came from harness investment made during, not before, the build." },
        { kind: "Qualitative / mechanism", text: "A 10× build-time compression is a much larger gain than “the agent types code faster than a human.” What mechanism, beyond typing speed, would have to be true for removing an entire category of overhead — not just writing code faster — to produce a compounding, order-of-magnitude gain like this one?", authored: "Typing speed alone could only ever produce a modest, linear speedup, because a human team's real bottleneck is rarely how fast anyone types — it is coordination, context-switching, onboarding new people onto tribal knowledge, and waiting on review. A 10× gain implies those overheads were mostly removed, not just sped up: an agent that never needs onboarding, never forgets context that is written into the repo, and reviews its own work continuously removes whole categories of delay a human team cannot avoid, which is exactly the kind of compounding effect a bigger typing speed could never produce on its own." }
      ]} />

      <Glossary items={[
        { term: "Multi-agent harness", def: "a system where several specialized AI agents (for example a planner, several workers, and a checker) coordinate on one task, instead of one agent doing everything." },
        { term: "Copy-on-write", def: "a storage technique that keeps a cheap, separate copy of data before it changes, so a destructive action can be undone." }
      ]} />
    </section>
  );
}

  const options = [

      errorName: "survivorship bias",
      explanation: "A documented dependency-direction rule constrains which way imports can point; it does not guarantee every layer stays bottleneck-free forever as volume grows — assuming a structural rule that worked at the scale it was described at will hold at any future scale, just because it worked so far, is the survivorship-bias trap.",
      scaffold: "Separate what the rule guarantees (imports only flow one way) from what it does not guarantee (that every layer's internal enforcement stays complete as more code arrives). A direction rule and a completeness guarantee are two different claims."
    }
  ];

  return (
    <section id="rq1" style={{ paddingTop: 24 }}>
      <SectionHeading id="rq1">RQ1 — How Is Codex's Environment Actually Structured?</SectionHeading>
      <p>The first question is architectural: what does an engineering team have to build so an agent, not a human, can operate reliably on ambiguous, multi-step goals? The thesis this section defends is that legibility — making the right information visible to the agent, in the repository itself, at the right layer — does more work than any single model upgrade could.</p>
      <p>OpenAI names the underlying problem directly: "anything [Codex] can't access in-context while running effectively doesn't exist" for it (OpenAI Engineering Blog, 2026). A fact sitting in a Google Doc, a Slack thread, or a person's head is invisible to an agent, no matter how well the humans around it understand it. This pushed the team to continuously migrate tribal knowledge — for example, a Slack thread that once settled an architectural debate — into the repository itself, as versioned files Codex can read (OpenAI Engineering Blog, 2026). Nothing counts as documented unless a machine, not just a person, can find it.</p>
      <p>The team's first attempt at making instructions legible was "one big AGENTS.md," a single monolithic file meant to tell Codex everything about how to work in the repository. OpenAI reports this failed for four specific reasons: a giant file crowds out the actual task, code, and relevant docs, because context — how much text a model can usefully hold in mind at once — is scarce; too much guidance becomes non-guidance, since if everything is flagged "important," nothing is, and the agent starts pattern-matching locally instead of navigating with intent; the file rots almost immediately, becoming a graveyard of stale rules nobody maintains; and it is hard to check mechanically for coverage, freshness, or ownership, so drift is inevitable (OpenAI Engineering Blog, 2026).</p>
      <p>The fix reframes what AGENTS.md is for: a table of contents, not an encyclopedia. OpenAI's final AGENTS.md is roughly 100 lines, and it points into a structured <code>docs/</code> directory that is the actual system of record — including design-docs, an exec-plans folder split into active and completed work, generated references, product specs, and top-level files like DESIGN.md, ARCHITECTURE.md, QUALITY_SCORE.md, RELIABILITY.md, and SECURITY.md (OpenAI Engineering Blog, 2026). Plans themselves are treated as first-class, versioned artifacts: lightweight, ephemeral plans for small changes, and "execution plans" with running progress and decision logs for complex, multi-hour work (OpenAI Engineering Blog, 2026; OpenAI Cookbook, 2026). Dedicated linters and CI checks — automated tests run on every change — verify the docs are cross-linked and current, and a recurring "doc-gardening" agent scans for documentation that no longer matches what the code actually does and opens fix-up pull requests on its own (OpenAI Engineering Blog, 2026).</p>
      <p>Legibility extends past documentation into the code's own shape. OpenAI enforces a fixed set of layers per business domain, with a strictly validated dependency direction: Types → Config → Repo → Service → Runtime → UI. Cross-cutting concerns — auth, connectors, telemetry, feature flags — must enter through one explicit interface called Providers; anything else is disallowed and checked mechanically, using custom, Codex-generated linters and structural tests (OpenAI Engineering Blog, 2026). Notably, OpenAI enforces the invariant, not the implementation — the rule is "parse, don't validate" at data boundaries (check and transform data into a trusted shape once, rather than re-checking it ad hoc everywhere), without prescribing which library does it, and Codex tends to converge on the same third-party library (Zod) on its own (OpenAI Engineering Blog, 2026). OpenAI calls this "the kind of architecture you usually postpone until you have hundreds of engineers," but treats it as an early prerequisite once agents write all the code, because, in the team's words, "the constraints are what allows speed without decay or architectural drift" (OpenAI Engineering Blog, 2026). Even the lint error messages are written to inject remediation instructions directly into the agent's context, so a failed check teaches Codex how to fix itself on the spot (OpenAI Engineering Blog, 2026).</p>
      <p>The third leg of legibility is runtime, not code. Instead of relying on humans to manually reproduce bugs, OpenAI made the running application itself legible to Codex: the app boots inside its own git worktree (an isolated, per-change copy of the repository) for every task, and the Chrome DevTools Protocol — a browser's own debugging interface — is wired into the agent's runtime with skills for DOM snapshots, screenshots, and page navigation, so Codex can reproduce a bug and verify a fix by actually driving the app (OpenAI Engineering Blog, 2026). A full observability stack — logs, metrics, and traces, three different lenses on what a running system is doing — is stood up per worktree and torn down when the task finishes; Codex queries logs with a query language called LogQL and metrics with PromQL, through tools named Victoria Logs, Victoria Metrics, and Victoria Traces, fed by a collector called Vector (OpenAI Engineering Blog, 2026). That stack turns a vague instruction like "make sure service startup completes in under 800 milliseconds" into something Codex can directly check, not just something a human has to remember to verify. The combined effect of all three legs — documentation, code structure, and runtime — is long enough leash for genuinely long, unattended work: single Codex runs are regularly observed working on one task for six or more hours continuously, often overnight, while no human is watching (OpenAI Engineering Blog, 2026).</p>
      <p>The honest limit here is that none of this removed the need for human judgment about what to build — it only removed the need for a human to write the code once that judgment was made. OpenAI's account is detailed about structure and thin on exactly how much human time went into designing the layered architecture and the docs system itself in the first five months; the reader can trust that the structure exists and is enforced, but not exactly how the initial investment in building it was staffed or scheduled.</p>
      <p><strong>Adjacent capability.</strong> OpenAI's layered domain architecture enforces structure along one axis: which direction code dependencies are allowed to point. Cursor's architecture, covered earlier in this series, enforces structure along a different axis entirely — latency budget. Cursor splits its product into a sub-second "Tab" lane, running a small in-house model with minimal context, and a slower agent lane with full semantic search and frontier-model routing, and a content-keyed embedding cache combined with reusing a 92%-similar teammate's index cut Cursor's own p99 (99th-percentile, meaning the slowest realistic case) time-to-first-query from 4.03 hours down to 21 seconds (Evidently AI, 2025). Both companies are partitioning a system to keep one property from silently degrading as the system grows — OpenAI partitions to keep architectural coherence from decaying, Cursor partitions to keep response time from decaying — which shows that "pick the axis that actually threatens you and enforce structure along it" is a more general move than either single case.</p>

      <ArchitectureSVG />
      <ChartInterp chartId="chart-rq1" state={interp} setState={setInterp} prompts={[
        { kind: "So-what / prioritization", text: "If a team adopting this pattern can only build mechanical enforcement for one layer boundary first, and their current pain point is cross-cutting code (auth checks, telemetry calls) scattered directly inside Service and Runtime code instead of behind one interface, which boundary should they enforce first using a prioritization framework, and what in the diagram supports that choice?", authored: "Enforce the Providers boundary first: the diagram shows Providers as the single, explicit entry point every cross-cutting concern must pass through, and OpenAI's account states this exact scattering — auth, connectors, telemetry, and feature flags leaking into ordinary layer code — is precisely what Providers exists to prevent. Prioritizing it first addresses the team's stated pain point directly, rather than enforcing a domain-layer boundary (like Repo → Service) that isn't yet where their problem is showing up." },

      ]} />

        prompt={"Based on OpenAI's layered domain architecture (Types → Config → Repo → Service → Runtime → UI, with Providers as the one cross-cutting entry point), which component is most likely to become a bottleneck if the total volume of Codex-generated code grows 10× without any new structural enforcement being added, and what does that imply about where a PM should invest next?"}
        options={options} state={mcq} setState={setMcq} />

      <FermiQ id="rq1-td" state={fermi} setState={setFermi}
        prompt={"Given OpenAI's two headline totals — on the order of 1,000,000 lines of code and roughly 1,500 merged pull requests over five months — estimate the average number of lines of code per merged PR."}
        assumptions={"Uses the two reported totals directly (1,000,000 lines ÷ 1,500 PRs); treats lines-of-code as evenly distributed across PRs, which is a simplification — the initial repo scaffold and generated documentation were almost certainly far larger single PRs than a typical incremental change."}

        decomposition={"1,000,000 lines ÷ 1,500 PRs ≈ 667 lines per PR."}
        scaffold={"If you're far off, check whether you divided in the right direction (lines ÷ PRs, not PRs ÷ lines) and whether you used the correct total lines figure (about a million, not the PR count or engineer count)."} />

      <PatternTransferQ id="rq1-tf" state={ptf} setState={setPtf}
        prompt={"The principle from this section is: making an agent's environment legible — a table-of-contents AGENTS.md pointing into a structured docs system, a mechanically enforced layered architecture, and a fully observable runtime — lets an agent operate reliably on ambiguous goals, because anything it can't access in-context while running effectively doesn't exist for it. Apply this to a mid-size insurance company building an internal claims-processing tool with a coding agent doing all the implementation. What would the insurance company's engineering lead do differently from OpenAI's approach, and what new failure mode would they face that did not appear in OpenAI's software-product example?"} />

      <PrincipleGate sectionId="rq1" value={principle["rq1"] || ""} onChange={v => setPrinciple(prev => ({ ...prev, rq1: v }))} />

      <Glossary items={[
        { term: "Context (for a model)", def: "the text a model can actually see and use while it is working — a limited, scarce resource, not an unlimited memory." },
        { term: "CI (continuous integration)", def: "an automated system that runs checks (tests, linters) on every proposed code change before it can be merged." },
        { term: "Linter", def: "a tool that automatically scans code for rule violations or bad patterns, without a human reading every line." },
        { term: "Git worktree", def: "a separate, isolated working copy of a shared code repository, so one change can be built and tested without disturbing others." },
        { term: "Parse, don't validate", def: "a design rule: transform incoming data into a trusted, checked shape once at the boundary, instead of re-checking untrusted data everywhere it's used." }
      ]} />
    </section>
  );
}

      explanation: "This raises a genuine general caution about comparing metrics in different units, but it isn't the strongest reason to doubt causation here — the actual question is about what caused two trends to move together, not about whether their units are comparable, so this answers a different, narrower objection than the one asked.",
      scaffold: "Re-check what the question is actually asking: not “can you compare these two numbers directly,” but “what's the strongest reason not to say one caused the other.” A units mismatch doesn't address causation one way or the other."
    },
    {

      correct: false,
      errorName: "survivorship bias",
      explanation: "This is a reasonable general caution about generalizing from a success story to the rest of the industry, but it doesn't answer the specific question asked — why these two trends moving together inside this one case shouldn't be read as one causing the other; it changes the subject to external generalizability instead of internal causation.",
      scaffold: "Re-read the question: it's about causation between two trends inside one account, not about whether the finding generalizes to other companies. A true statement about a different topic isn't the strongest answer to the question actually asked."

  const tcOptions = [
    {
      text: "That Codex, or any comparable coding agent, is already reliable enough in general that a checklist of golden principles is a nice-to-have refinement rather than something FinLedger's launch plan actually depends on, since general model capability will keep quality acceptable on its own over time.",
      correct: false,

      explanation: "This substitutes a different, broader claim (general model capability) for the specific mechanism this plan is actually skipping — mechanically encoded, repo-specific golden principles plus a recurring automated cleanup process — which OpenAI's own account shows general capability alone did not prevent.",

      generalizes: "any plan to rely on periodic manual review to catch quality drift in a codebase where an AI agent is the sole author of new code"

      correct: false,
      errorName: "hindsight bias in incident analysis",
      explanation: "Restating “this is risky” doesn't identify what would have to be true for the plan to work anyway; a weakest-link answer has to name the specific belief the plan depends on, not repeat the underlying worry in different words.",
      scaffold: "A weakest-link assumption is a testable belief the plan needs to be true, not a restatement of the worry itself. Ask: what would FinLedger have to believe about their own repo's drift rate for this plan to be fine without a golden-principles process?"

  return (
    <section id="rq2" style={{ paddingTop: 24 }}>
      <SectionHeading id="rq2">RQ2 — What Ways Did This Fully Agent-Written System Fail?</SectionHeading>
      <p>The second question is about failure: what specific ways did OpenAI's fully autonomous build break in practice, and how did the team fix each one? The thesis this section defends is that the two failure modes OpenAI names are genuinely different problems, needing genuinely different fixes — and that the team's instinct was consistently to build a missing capability rather than to push Codex harder.</p>
      <p>The first failure mode showed up early, before the team had much structure in place at all. Progress was slower than expected in the first stretch of the project — not because Codex lacked raw capability, but because the environment itself was under-specified: missing tools, missing abstractions, missing internal structure (OpenAI Engineering Blog, 2026). The team's response became a discipline: work depth-first, breaking large goals into small building blocks — design, code, review, test — and use those blocks to unlock more complex tasks. When something failed, the team's question was never "try harder." It was "what capability is missing, and how do we make it legible and enforceable for the agent?" (OpenAI Engineering Blog, 2026). This is a direct instance of RQ1's legibility principle applied to failure response: a stuck agent is read as a missing-capability signal, not a motivation problem.</p>
      <p>The second failure mode only became visible once the first one was mostly solved and throughput rose. Full autonomy introduced a real, named problem: entropy. Codex replicates whatever pattern already exists in the repository — including uneven or suboptimal ones — and OpenAI states this "inevitably leads to drift" over time (OpenAI Engineering Blog, 2026). This is a structurally different failure from the first one. Under-specification is a one-time gap you close by building the missing piece. Entropy is a compounding process: each new PR that copies a slightly-worse pattern makes that pattern slightly more "normal" for the next PR to copy, and the problem gets worse the faster the team ships, not slower.</p>
      <p>OpenAI's first fix for entropy was manual, and it did not work. Humans spent every Friday — 20% of the team's work week — cleaning up what the team calls "AI slop" (OpenAI Engineering Blog, 2026). This did not scale, "unsurprisingly" (OpenAI Engineering Blog, 2026): a fixed weekly human cleanup slot is a constant-sized fix applied to a problem that grows with throughput, so as the team's own PR volume rose, the same one day a week bought proportionally less coverage. The team's next fix was mechanical instead of manual: encode opinionated "golden principles" directly into the repository — for example, prefer shared utility packages over hand-rolled helpers, to keep invariants centralized, and never probe data "YOLO-style" (informally, without checking its shape first); validate boundaries or use typed SDKs (pre-built, type-checked client libraries) so Codex cannot build logic on top of a guessed data shape (OpenAI Engineering Blog, 2026). Alongside the rules, OpenAI built a recurring cleanup process: background Codex tasks, run on a regular cadence, that scan for deviations from the golden principles, update quality grades, and open targeted refactoring pull requests — most of which are reviewable in under a minute and get auto-merged (OpenAI Engineering Blog, 2026).</p>
      <p>OpenAI's own framing of the lesson is worth stating directly, because it reframes what "technical debt" means once an agent, not a human, is generating it: "This functions like garbage collection. Technical debt is like a high-interest loan: it's almost always better to pay it down continuously in small increments than to let it compound and tackle it in painful bursts" (OpenAI Engineering Blog, 2026). The shift from a scheduled human sweep to a continuously-running mechanical process is the same shift RQ1 described for documentation and architecture: move the check from something a person has to remember to do, to something the system does on its own, all the time.</p>
      <p>This section's evidence has a real limit: OpenAI reports what the golden principles are and that most resulting cleanup PRs are reviewable in under a minute, but it does not publish a quality metric before-and-after the switch — there is no published number showing exactly how much entropy the mechanical fix removes, only a qualitative description of the outcome. A reader can trust that the fix reduced the manual burden enough that the team stopped needing the Friday sweep; a reader cannot verify precisely how close to zero the underlying entropy rate actually got.</p>
      <p>This matters because the natural response to "the agent is producing worse and worse patterns over time" is to add more human review, on the theory that more human eyes catches more problems. OpenAI's own experience argues against that default: more human review is exactly what they tried first, and it consumed a fixed, non-scaling slice of the week without solving the underlying problem. The fix that actually worked did not add more human attention — it removed the need for it, by making the desired pattern mechanically checkable.</p>
      <p><strong>Adjacent capability.</strong> Replit Agent, covered earlier in this series, solves a different reliability problem with a different lever. Its main defense is copy-on-write reversibility — storage that keeps a cheap, separate copy of data before a change, so a destructive action (like an accidentally deleted database) can be undone — which is exactly what did not work during a July 2025 incident where the agent deleted a live production database during an explicit code freeze (Replit Blog, 2025). Reversibility answers "how do we undo a destructive action," a single bad event with a clear before-and-after state. Entropy is not destructive in that sense — no single PR looks like an incident, and there is no single moment to roll back to, because the problem is a slow accumulation of many individually-reasonable-looking small changes. A reversibility lever like Replit's would not have caught OpenAI's entropy problem at all, because nothing about a slightly-worse-but-still-working pattern ever triggers an "undo this" moment; the two companies needed genuinely different kinds of machinery because they were defending against genuinely different failure classes.</p>

      <FailureModeTable />
      <ChartInterp chartId="chart-rq2" state={interp} setState={setInterp} prompts={[
        { kind: "So-what / kill-criteria", text: "OpenAI's first fix for entropy (weekly manual cleanup, 20% of the week) failed to scale, but the team didn't abandon the goal of clean code — they replaced the mechanism. Using a kill-criteria/pre-mortem framework, what specific signal, if OpenAI had seen it during the manual-cleanup era, should have told the team to kill that approach months earlier than they apparently did?", authored: "The clearest kill signal would be the Friday cleanup slot's share of the week staying flat or shrinking as a fraction of total work while the team's PR volume kept climbing — in other words, watching the ratio of (time spent cleaning) to (PRs merged that week) trend the wrong direction. A fixed 20% commitment that buys proportionally less coverage as volume rises is the signature of a fix that cannot scale with the thing it's meant to control, and that ratio, tracked explicitly, would have been visible well before the team is described as abandoning the approach." },

      ]} />

        prompt={"Suppose a team observes merged-PR throughput per engineer rising at the same time their codebase's overall quality holds steady rather than degrading, right after they finish building a legible-documentation system and an agent review loop. What is the strongest reason NOT to conclude that the throughput increase itself directly caused the quality to hold steady?"}

        prompt={"FinLedger Analytics, a mid-size fintech data company, is planning to let a coding agent author all new code in its risk-scoring service, following OpenAI's zero-manually-written-code approach. Leadership is excited about the throughput gains and plans to launch with automated testing and a basic style linter, but no dedicated “golden principles” checklist or recurring automated cleanup process — reasoning that the team can “just review PRs carefully” if quality starts slipping. Which assumption must hold for this launch plan to create value without unacceptable risk, and what evidence in this article is thinnest in supporting it?"}

        errorName={"confusing a metric for its cause"} />

      <PatternTransferQ id="rq2-tf" state={ptf} setState={setPtf}
        prompt={"The principle from this section is: an under-specified environment and entropy from pattern replication are two different reliability failures needing two different fixes — build the missing capability once for the first, and encode mechanical, continuously-enforced rules for the second, because manual review cannot keep pace with a compounding problem. Apply this to a retail company whose AI agent writes and maintains the pricing rules in its e-commerce backend. What would the retail company's engineering team do differently, and what new failure mode would they face that did not appear in OpenAI's software-engineering example?"} />

      <PrincipleGate sectionId="rq2" value={principle["rq2"] || ""} onChange={v => setPrinciple(prev => ({ ...prev, rq2: v }))} />

      <Glossary items={[
        { term: "Entropy (in a codebase)", def: "the tendency of a system's structure to become messier and less consistent over time as small, individually-reasonable changes accumulate." },
        { term: "Typed SDK", def: "a pre-built client library for a service whose inputs and outputs are checked against a known, fixed shape, instead of being handled as loose, unchecked data." },
        { term: "Golden principles", def: "a small set of opinionated, mechanically-checkable rules a team encodes directly into a codebase to keep an AI agent's output consistent." }
      ]} />
    </section>
  );
}

function RQ3Evaluation({ interp, setInterp, mcq, setMcq, fermi, setFermi, ptf, setPtf, principle, setPrinciple, registerScore }) {
  const thOptions = [

      correct: true,

  return (
    <section id="rq3" style={{ paddingTop: 24 }}>
      <SectionHeading id="rq3">RQ3 — How Does OpenAI Actually Decide Codex's Work Is Trustworthy?</SectionHeading>
      <p>The third question is about process: with no human required to review most pull requests, how does OpenAI decide a given piece of Codex's work is good enough to merge? The thesis this section defends is that trust is built into the review process itself — agents reviewing agents, repeatedly, until satisfied — rather than checked afterward by a human reading the final diff.</p>
      <p>To drive a pull request to completion, Codex is instructed to review its own changes locally first, then request additional agent reviews — both a local reviewer and a cloud-based one — respond to whatever feedback comes back, and keep iterating until every agent reviewer is satisfied (OpenAI Engineering Blog, 2026). OpenAI names this pattern the "Ralph Wiggum Loop," crediting the term to an earlier, independent piece of practitioner writing on the same idea (ghuntley.com, 2025; OpenAI Engineering Blog, 2026). Human review of a pull request is optional in this system, not required, and OpenAI states plainly that the team has pushed "almost all review effort" onto agent-to-agent review instead (OpenAI Engineering Blog, 2026).</p>
      <p>This is a genuinely different model of quality control than "a human reads the diff before it merges." In the conventional model, the reviewer's judgment is the bottleneck and the safeguard at the same time — one person's attention decides both how fast work moves and how carefully it gets checked. In OpenAI's loop, speed and scrutiny are decoupled: the loop can run as many iterations as it needs, as fast as the agents can work, without waiting on a human's calendar, while the requirement to satisfy every reviewer before merging is what keeps the process from just rubber-stamping the first draft.</p>
      <p>OpenAI also tracks a running measure of how good the code actually is, not just whether it passed review: QUALITY_SCORE.md is one of the top-level documents in the team's structured docs system, functioning as a graded scorecard per domain and layer that the recurring cleanup process (described in RQ2) updates over time (OpenAI Engineering Blog, 2026). This is a second, independent signal from the review loop itself — a PR can pass every reviewer's checks and still leave a domain's quality grade unchanged or improved, giving the team a way to track code health as a trend, not just a pass/fail gate at merge time.</p>
      <p>The clearest evidence that this process-first approach actually works at scale is what OpenAI reports the repository can now do, unprompted by a human beyond the initial request. By publication time, given a single prompt, Codex can validate the current state of the codebase, reproduce a reported bug, record a video demonstrating the failure, implement a fix, validate that fix by actually driving the running application, record a second video showing the problem is resolved, open a pull request, respond to agent and human feedback, detect and fix its own build failures, escalate to a human only when real judgment is required, and merge the change (OpenAI Engineering Blog, 2026). That is the entire lifecycle of a bug fix, end to end, from one instruction.</p>
      <p>OpenAI is careful to bound this claim rather than present it as a general result: "this behavior depends heavily on the specific structure and tooling of this repository and should not be assumed to generalize without similar investment — at least, not yet" (OpenAI Engineering Blog, 2026). In other words, the single-prompt threshold is not evidence that any codebase, given a capable enough model, would reach the same point — it is evidence that five months of harness investment (legible docs, enforced architecture, runtime observability, the review loop, and QUALITY_SCORE.md) compounds into a capability that none of those pieces alone would produce.</p>
      <p>The limit in this section's evidence is the same one that shows up throughout the article: OpenAI describes the review loop's steps and the existence of QUALITY_SCORE.md in detail, but does not publish a defect rate, an escaped-bug count, or any other number showing how often the loop actually catches a real problem versus lets one through. A reader can verify that the process exists and that its most visible output (the single-prompt bug-fix lifecycle) is real; a reader cannot verify, from this source alone, exactly how reliable the underlying review loop is at the level of an individual pull request.</p>
      <p><strong>Adjacent capability.</strong> Amazon, covered earlier in this series, takes a more formal, metrics-first approach to the same underlying problem — deciding whether an agent's work can be trusted. Rather than a review loop that iterates until reviewers agree, Amazon separately instruments each specific way its production agents can fail: planning, tool selection, tool parameters, response format, authentication, and memory retrieval each get their own dedicated metric, so a wrong final answer can be traced to a specific broken link in the chain rather than judged only as a pass or fail (AWS Machine Learning Blog, 2026). OpenAI's process-first approach (agents reviewing agents until satisfied, plus a running quality grade) and Amazon's metrics-first approach (a distinct instrument for each failure mode) are answering the same question — "can we trust this agent's work?" — with genuinely different philosophies: one bets that iterative review converges on quality, the other bets that quality is only trustworthy once every way it could fail has its own named, tracked signal. Neither article's evidence shows one approach is strictly better; they are different bets a team can make depending on whether its failures are easier to catch by iteration or by targeted instrumentation.</p>

      <RalphWiggumLoopSVG />
      <ChartInterp chartId="chart-rq3" state={interp} setState={setInterp} prompts={[
        { kind: "So-what / segmentation", text: "Human review sits at the end of this loop as optional, not required. Using a segmentation framework, how should a team deciding to adopt this pattern segment its own pull requests — by what property — so that some PRs skip human review by default and others are routed to a human even when every agent reviewer is satisfied?", authored: "Segment by the reversibility and blast radius of the change, not by its size or its author: a PR that only an agent can quickly verify and that is cheap to roll back if wrong (an internal tool, a UI copy change) is a good candidate to skip human review by default, while a PR touching payment logic, data deletion, or anything hard to reverse should route to a human even if every agent reviewer approved — because agent reviewers, however good, share the same blind-spot risk this section's T-H question raises, and irreversible changes are exactly where that risk is most expensive." },

      ]} />

      <MCQ id="rq3-th" label="T-H · Critical reasoning — Assumption" registerScore={registerScore}
        prompt={"The argument that OpenAI's “Ralph Wiggum Loop” (agent self-review, then additional local and cloud agent review, iterated until every reviewer is satisfied) can safely replace most human review depends on evidence that OpenAI built exactly these review steps and made human review optional. Which assumption, if false, would break this argument even though OpenAI's stated review steps remain exactly as described?"}

        prompt={"The principle from this section is: pushing review effort to agents reviewing agents, iterated until every reviewer is satisfied, plus a running quality scorecard, can substitute for most human review — but this is a process-first bet on iteration catching problems, a different bet than instrumenting each specific failure mode separately. Apply this to a university IT department using a coding agent to build and maintain its student-records system. What would the university do differently from OpenAI's approach, and what new failure mode would they face that did not appear in this article's evidence?"} />

      <PrincipleGate sectionId="rq3" value={principle["rq3"] || ""} onChange={v => setPrinciple(prev => ({ ...prev, rq3: v }))} />

      <Glossary items={[
        { term: "Ralph Wiggum Loop", def: "OpenAI's name (crediting an earlier independent write-up) for an agent iterating — self-review, then more agent review, then respond and repeat — until every reviewer is satisfied." },
        { term: "QUALITY_SCORE.md", def: "a top-level document in OpenAI's docs system that tracks a running quality grade per code domain and layer, separate from any single PR's pass/fail review." },
        { term: "Escalate (to a human)", def: "when an agent stops and hands a decision to a person, because the situation needs judgment the agent isn't set up to make on its own." }
      ]} />
    </section>
  );
}
