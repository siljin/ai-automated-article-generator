<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="env,react">
/* AI Product Teardown — How Cursor Actually Works
   Single-file React app (inlined into index.html). Uses Recharts UMD global. */

const { useState, useEffect, useRef } = React;
const {
  ResponsiveContainer, BarChart, Bar, LineChart, Line, XAxis, YAxis,
  CartesianGrid, Tooltip, Legend, LabelList, Cell
} = Recharts;

/* ---------------------------------------------------------------- helpers */

function clampChars(s, n) { return (s || "").trim().length >= n; }

function Reveal({ children }) {
  return <div className="authored">{children}</div>;
}

/* Chart interpretation block: two independently-gated prompts. */
function ChartPrompts({ id, prompts, submitted, setSubmitted, answers, setAnswers }) {
  return (
    <div className="prompts">
      {prompts.map((p, j) => {
        const key = id + "-" + j;
        const done = submitted[key];
        return (
          <div className="prompt" key={key}>
            <div className="prompt-kind">{p.kind}</div>
            <div className="prompt-q">{p.q}</div>
            {!done && (
              <div>
                <textarea
                  className="ta"
                  rows={2}
                  placeholder="Write your answer (min 15 characters) — the authored answer stays hidden until you submit."
                  value={answers[key] || ""}
                  onChange={(e) => setAnswers({ ...answers, [key]: e.target.value })}
                />
                <button
                  className="btn"
                  disabled={!clampChars(answers[key], 15)}
                  onClick={() => setSubmitted({ ...submitted, [key]: true })}
                >
                  {clampChars(answers[key], 15) ? "Reveal authored answer" : "Enter at least 15 characters"}
                </button>
              </div>
            )}
            {done && (
              <Reveal>
                <div className="your-answer"><span>Your answer:</span> {answers[key]}</div>
                <div className="authored-label">Compare to the authored answer</div>
                <div dangerouslySetInnerHTML={{ __html: p.a }} />
              </Reveal>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* Multiple choice with two-attempt scaffolding + named-error calibration. */
function MC({ id, prompt, caseLabel, options, correct, explain, calibrationWrong, scaffold, generalizes, onScore, kind }) {
  const [sel, setSel] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [scored, setScored] = useState(false);
  const isCorrect = submitted && sel === correct;

  function submit() {
    setSubmitted(true);
    const nowCorrect = sel === correct;
    setAttempts(attempts + 1);
    if (nowCorrect && !scored) { onScore(1); setScored(true); }
  }
  function tryAgain() { setSubmitted(false); setSel(null); }

  return (
    <div className={"q " + (caseLabel ? "q-case" : "")}>
      {kind && <div className="q-kind">{kind}</div>}
      {caseLabel && <div className="case-label">Case Prompt — {caseLabel}</div>}
      <div className="q-prompt" dangerouslySetInnerHTML={{ __html: prompt }} />
      <div className="opts">
        {options.map((o, i) => {
          let cls = "opt";
          if (submitted) {
            if (i === correct) cls += " opt-correct";
            else if (i === sel) cls += " opt-wrong";
          } else if (i === sel) cls += " opt-sel";
          return (
            <div key={i} className={cls} onClick={() => !submitted && setSel(i)}>
              <span className="opt-letter">{"ABCD"[i]}</span>
              <span dangerouslySetInnerHTML={{ __html: o }} />
            </div>
          );
        })}
      </div>
      {!submitted && (
        <button className="btn" disabled={sel === null} onClick={submit}>
          {sel === null ? "Select an option to enable Submit" : "Submit"}
        </button>
      )}
      {submitted && !isCorrect && attempts >= 2 && (
        <div className="scaffold">
          <strong>Hint before you retry:</strong> {scaffold}
        </div>
      )}
      {submitted && (
        <div className={"explain " + (isCorrect ? "ok" : "bad")}>
          <div className="calib">
            {isCorrect
              ? <span>Correct — {calibrationWrong.correctNote}</span>
              : <span>Incorrect — this is {calibrationWrong.error}: {calibrationWrong.note}</span>}
          </div>
          <div dangerouslySetInnerHTML={{ __html: explain }} />
          <div className="generalizes"><strong>Where this generalizes:</strong> {generalizes}</div>
          {!isCorrect && <button className="btn btn-ghost" onClick={tryAgain}>Try again</button>}
        </div>
      )}
    </div>
  );
}

/* Numeric estimation (T-D). Log-distance scoring option for Fermi. */
function Numeric({ id, prompt, min, max, step, actual, unit, tolerance, fermi, decomposition, anchors, mostSensitive, onScore, kind }) {
  const [val, setVal] = useState(min);
  const [submitted, setSubmitted] = useState(false);
  const [scored, setScored] = useState(false);

  function within() {
    if (fermi) {
      const r = Math.max(val / actual, actual / val);
      return r <= 3; // within 3x for order-of-magnitude Fermi
    }
    return Math.abs(val - actual) / actual <= tolerance;
  }
  function submit() {
    setSubmitted(true);
    if (within() && !scored) { onScore(1); setScored(true); }
  }
  const off = submitted ? (val > actual ? "over" : "under") : "";

  return (
    <div className="q">
      {kind && <div className="q-kind">{kind}</div>}
      <div className="q-prompt" dangerouslySetInnerHTML={{ __html: prompt }} />
      <div className="numrow">
        <input type="range" min={min} max={max} step={step} value={val}
          onChange={(e) => setVal(Number(e.target.value))} />
        <input type="number" className="numin" min={min} max={max} step={step} value={val}
          onChange={(e) => setVal(Number(e.target.value))} />
        <span className="unit">{unit}</span>
      </div>
      {!submitted && <button className="btn" onClick={submit}>Submit estimate</button>}
      {submitted && (
        <div className={"explain " + (within() ? "ok" : "bad")}>
          <div className="calib">
            {within()
              ? <span>Within tolerance — your estimate lands in the defensible band.</span>
              : <span>Outside tolerance — you {off}-estimated. This is often an anchoring error: the decomposition below shows where the miss usually comes from.</span>}
          </div>
          <div className="dist">
            <div>Your estimate: <strong>{val.toLocaleString()} {unit}</strong></div>
            <div>Actual / target: <strong>{actual.toLocaleString()} {unit}</strong></div>
          </div>
          <div><strong>Anchor facts:</strong> {anchors}</div>
          <div><strong>Decomposition:</strong> <span dangerouslySetInnerHTML={{ __html: decomposition }} /></div>
          <div><strong>What moves the estimate most:</strong> {mostSensitive}</div>
        </div>
      )}
    </div>
  );
}

/* Free-text principle prompt (not scored). */
function Principle({ id, authored, store, setStore }) {
  const [txt, setTxt] = useState("");
  const [done, setDone] = useState(false);
  return (
    <div className="q q-principle">
      <div className="q-kind">Principle in one sentence</div>
      <div className="q-prompt">In one sentence, state the transferable principle from this section — something a PM or CTO at a different company could apply tomorrow.</div>
      {!done && (
        <div>
          <textarea className="ta" rows={2} value={txt} placeholder="Min 20 characters"
            onChange={(e) => setTxt(e.target.value)} />
          <button className="btn" disabled={!clampChars(txt, 20)} onClick={() => { setDone(true); setStore({ ...store, [id]: txt }); }}>
            {clampChars(txt, 20) ? "Submit" : "Enter at least 20 characters"}
          </button>
        </div>
      )}
      {done && (
        <Reveal>
          <div className="your-answer"><span>Your principle:</span> {txt}</div>
          <div className="authored-label">Authored principle</div>
          <div>{authored}</div>
        </Reveal>
      )}
    </div>
  );
}

/* Free-text pattern transfer (T-F). Self-eval checklist. */
function Transfer({ id, principle, context, requirements }) {
  const [txt, setTxt] = useState("");
  const [done, setDone] = useState(false);
  const [checks, setChecks] = useState([false, false, false]);
  return (
    <div className="q q-transfer">
      <div className="q-kind">Pattern transfer</div>
      <div className="q-prompt">
        <div><strong>Principle:</strong> {principle}</div>
        <div style={{ marginTop: 6 }}><strong>New context:</strong> {context}</div>
        <div style={{ marginTop: 6 }}>In your answer: (1) name the principle accurately, (2) explain a non-trivial application to this new context, (3) name a failure mode that would <em>not</em> appear in the Cursor case.</div>
      </div>
      {!done && (
        <div>
          <textarea className="ta" rows={4} value={txt} placeholder="Min 50 characters"
            onChange={(e) => setTxt(e.target.value)} />
          <button className="btn" disabled={!clampChars(txt, 50)} onClick={() => setDone(true)}>
            {clampChars(txt, 50) ? "Submit" : "Enter at least 50 characters"}
          </button>
        </div>
      )}
      {done && (
        <Reveal>
          <div className="your-answer"><span>Your transfer:</span> {txt}</div>
          <div className="authored-label">Self-evaluation — check each honestly</div>
          {["Did I name the principle accurately?", "Is my application genuinely different from Cursor's case?", "Is my failure mode new (absent from the Cursor case)?"].map((c, i) => (
            <label key={i} className="checkrow">
              <input type="checkbox" checked={checks[i]} onChange={() => { const n = [...checks]; n[i] = !n[i]; setChecks(n); }} /> {c}
            </label>
          ))}
          <div className="hint">{requirements}</div>
        </Reveal>
      )}
    </div>
  );
}

function Glossary({ items }) {
  if (!items || !items.length) return null;
  return (
    <div className="glossary">
      <div className="glossary-label">Glossary</div>
      {items.map((it, i) => (
        <div className="gitem" key={i}><strong>{it.t}</strong> — {it.d}</div>
      ))}
    </div>
  );
}

function ChartNote({ children }) { return <div className="chart-note">{children}</div>; }

/* ---------------------------------------------------------------- charts */

const arrData = [
  { label: "Jan 2025", arr: 100 },
  { label: "~May 2025", arr: 300 },
  { label: "Jun 2025", arr: 500 }
];

const retentionData = [
  { label: "All repos", lift: 0.3 },
  { label: "Repos with 1,000+ files", lift: 2.6 }
];

const ttfqData = [
  { pct: "Median", before: 7.87, after: 0.525 },
  { pct: "90th pct", before: 169.2, after: 1.87 },
  { pct: "99th pct", before: 14508, after: 21 }
];

function ArrChart() {
  return (
    <div>
      <ResponsiveContainer width="100%" height={280}>
        <LineChart data={arrData} margin={{ top: 20, right: 20, left: 10, bottom: 5 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
          <XAxis dataKey="label" tick={{ fontSize: 12 }} />
          <YAxis tick={{ fontSize: 12 }} label={{ value: "ARR ($M)", angle: -90, position: "insideLeft", fontSize: 12 }} />
          <Tooltip />
          <Line type="monotone" dataKey="arr" stroke="#2563eb" strokeWidth={2} dot={{ r: 4 }}>
            <LabelList dataKey="arr" position="top" formatter={(v) => "$" + v + "M"} fontSize={12} />
          </Line>
        </LineChart>
      </ResponsiveContainer>
      <ChartNote>FACT: annualized revenue run-rate, from ~$0 a year prior (Pragmatic Engineer, 2025; TechCrunch, 2025). Growth continued to ~$1.2B ARR by Dec 2025 (secondary reports).</ChartNote>
    </div>
  );
}

function RetentionChart() {
  return (
    <div>
      <ResponsiveContainer width="100%" height={280}>
        <BarChart data={retentionData} margin={{ top: 20, right: 20, left: 10, bottom: 5 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
          <XAxis dataKey="label" tick={{ fontSize: 12 }} />
          <YAxis tick={{ fontSize: 12 }} label={{ value: "Code-retention lift (%)", angle: -90, position: "insideLeft", fontSize: 12 }} />
          <Tooltip />
          <Bar dataKey="lift" fill="#2563eb">
            <LabelList dataKey="lift" position="top" formatter={(v) => "+" + v + "%"} fontSize={12} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <ChartNote>FACT: A/B test, semantic search vs grep-only, same model (Cursor "Improving agent with semantic search", 2025). Answer accuracy also rose +12.5% on average (range 6.5%–23.5%); dissatisfied follow-up requests rose +2.2% when semantic search was removed.</ChartNote>
    </div>
  );
}

function TtfqChart() {
  return (
    <div>
      <ResponsiveContainer width="100%" height={300}>
        <BarChart data={ttfqData} margin={{ top: 20, right: 20, left: 10, bottom: 5 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
          <XAxis dataKey="pct" tick={{ fontSize: 12 }} />
          <YAxis scale="log" domain={[0.1, 20000]} tick={{ fontSize: 12 }}
            label={{ value: "Time-to-first-query (s, log)", angle: -90, position: "insideLeft", fontSize: 11 }} />
          <Tooltip />
          <Legend />
          <Bar dataKey="before" fill="#dc2626" name="Before (index from scratch)">
            <LabelList dataKey="before" position="top" formatter={(v) => v + "s"} fontSize={11} />
          </Bar>
          <Bar dataKey="after" fill="#16a34a" name="After (reuse teammate index)">
            <LabelList dataKey="after" position="top" formatter={(v) => v + "s"} fontSize={11} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <ChartNote>FACT: time-to-first-query, before vs after teammate-index reuse (Cursor "Securely indexing large codebases", 2026). Values: median 7.87s→0.525s; 90th pct 169.2s (2.82 min)→1.87s; 99th pct 14,508s (4.03 h)→21s. Log scale.</ChartNote>
    </div>
  );
}

/* Latency-partitioned architecture diagram (SVG). */
function ArchDiagram() {
  return (
    <div className="svg-wrap">
      <svg viewBox="0 0 680 430" width="100%" role="img" aria-label="Cursor latency-partitioned architecture">
        <defs>
          <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#555" />
          </marker>
        </defs>
        <rect x="10" y="10" width="180" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="100" y="34" textAnchor="middle" fontSize="13" fontWeight="700">Client (VS Code fork)</text>
        <rect x="30" y="50" width="140" height="46" rx="6" fill="#fff" stroke="#94a3b8" />
        <text x="100" y="70" textAnchor="middle" fontSize="11">Editor + local files</text>
        <text x="100" y="86" textAnchor="middle" fontSize="10" fill="#555">source of truth</text>
        <rect x="30" y="110" width="140" height="46" rx="6" fill="#fff" stroke="#94a3b8" />
        <text x="100" y="130" textAnchor="middle" fontSize="11">Merkle tree +</text>
        <text x="100" y="146" textAnchor="middle" fontSize="11">encrypt / obfuscate</text>

          <p>

          </p>
          <p>

        <section id="rq1">
          <h2>RQ1 — What actually runs: one product, two latency lanes</h2>
          <p>
            The thesis to defend here: Cursor is not one AI feature but a system partitioned by latency budget, and that partition is invisible to the user yet decides everything about how each feature behaves. When you press Tab, you are on a lane with a hard sub-second deadline. When you ask the agent to refactor, you are on a lane where seconds are fine and quality wins. The same editor, two very different machines behind it.
          </p>
          <p>
            On the Tab lane, the client grabs a small slice of surrounding code, encrypts it, and sends it to Cursor's servers, where an in-house model generates the suggestion and returns it — ideally in under a second (Pragmatic Engineer, 2025). Those fine-tuned models are hosted on Fireworks, a provider chosen for low-latency serving (ByteByteGo, 2025). The context is deliberately tiny because every extra token costs milliseconds, and the code is discarded after inference rather than stored. This lane is where most of that 1-million-transactions-per-second load comes from: many tiny requests, each racing a deadline.
          </p>
          <p>
            On the Chat and Agent lane, the deadline relaxes and the machinery grows. The agent builds an understanding of the codebase using semantic search — retrieving code by meaning, like "where do we handle authentication?" — alongside plain text search (grep). Semantic search runs over embeddings (numeric fingerprints of code chunks) stored in a vector database called turbopuffer. Crucially, the server holds only embeddings, not code; when it needs the actual text it asks the client for those specific chunks. Then the request is routed to a frontier model — Anthropic's Claude, OpenAI's GPT, Google's Gemini, or xAI's Grok — sometimes several models for one task, since even when you pick one model, background jobs like summarization may go to another (ByteByteGo, 2025).
          </p>
          <p>
            The evidence that this retrieval layer earns its complexity is direct. Cursor's own A/B test found that giving the agent semantic search raised answer accuracy by 12.5% on average (from 6.5% up to 23.5% depending on the model), and it helped most on large codebases (Cursor, 2025). The limit of the thesis is honest: semantic search is not free, it does not help every request, and the team still leans heavily on grep — the best results come from combining the two, not from replacing one with the other (Cursor, 2025).
          </p>

        <section id="rq2">
          <h2>RQ2 — When a constraint becomes the product</h2>
          <p>
            The thesis here is sharper: Cursor's most distinctive product features are not free design choices — they are architectural constraints turned into promises. The clearest is privacy. Cursor decided the server would never persistently store your source code. That is a hard constraint, and meeting it required real machinery: code chunks are encrypted on the client, filenames are obfuscated (scrambled so they are not readable) before they leave your machine, only embeddings are stored, and the actual text is fetched from the client just for the moment it is needed, then discarded (ByteByteGo, 2025; Pragmatic Engineer, 2025).
          </p>
          <p>
            That constraint forced the Merkle-tree design. Because the server cannot hold your code, it needs another way to know what changed without re-reading everything. A Merkle tree gives every file a hash and every folder a hash built from its children, so a single edit flips only the hashes along one path to the root. The client and server each keep a tree; every three minutes they compare, and only the branches that differ get re-indexed (Pragmatic Engineer, 2025). The privacy promise (no code at rest) and the efficiency mechanism (sync only what changed) are the same design seen from two sides.
          </p>
          <p>
            The retrieval quality is a second constraint-turned-product. Off-the-shelf embeddings treat code like generic text, but Cursor trained its own embedding model using its agents' real work as training data: when an agent searches and opens files before finding the right code, an LLM looks back and ranks what should have been retrieved earlier, and the embedding model is trained to match those rankings (Cursor, 2025). This is the same lesson from earlier feasibility articles — the product's own usage generates the labels that make the model better — applied to a live retrieval system.
          </p>
          <p>
            The evidence that these choices pay off in user outcomes, not just architecture diagrams, is the A/B result: code written with semantic search available was more likely to stay in the codebase, and the effect grew with size — a 0.3% retention lift across all repos but 2.6% on repos with 1,000 files or more, with 2.2% more dissatisfied follow-up requests when semantic search was removed (Cursor, 2025). The limit of the thesis: these are modest average effects because most requests do not need deep search at all, which is exactly why the fast Tab lane exists alongside it.
          </p>

        <section id="rq3">
          <h2>RQ3 — Controlling the economics of generative AI at scale</h2>
          <p>
            The thesis: at Cursor's scale the winning move is not a cheaper model but doing less redundant work, and the biggest wins come from noticing that most work is duplicated. Two mechanisms carry this. The first is caching: Cursor stores embeddings keyed by chunk content, so when a file changes, the unchanged chunks hit the cache and are never re-embedded (Cursor, 2026). Because embedding is the expensive step, and most edits change little, the cache turns a costly operation into a near-free one for the common case.
          </p>
          <p>
            The second is the sharper insight. Cursor noticed that teammates work from near-identical copies of the same repository — clones average 92% similarity across users within an organization (Cursor, 2026). So instead of every new user re-indexing from scratch, a new client computes a compact "similarity hash" (simhash) of its file tree, the server finds a teammate's existing index that matches closely, and the new user securely reuses it. The Merkle tree's cryptographic hashes double as proof of access: the client only sees results for files it can prove it already has, so reuse never leaks code across users (Cursor, 2026).
          </p>
          <p>
            The payoff is dramatic and it compounds with repo size. Time-to-first-query — how long before a user can search their code — dropped from 7.87 seconds to 525 milliseconds at the median, from 2.82 minutes to 1.87 seconds at the 90th percentile, and from 4.03 hours to 21 seconds at the 99th percentile (Cursor, 2026). The largest repositories, which used to take hours, became usable in seconds. Notice what kind of optimization this is: not a faster model, but the elimination of repeated work the naive design never questioned.
          </p>
          <p>
            The limit of the thesis is worth stating. These gains depend on the 92%-similarity pattern holding; a shop where every developer's tree diverges sharply would see far less benefit, and the access-proof machinery adds complexity that only pays off at team scale. For a solo user on a unique codebase, the plain from-scratch index is still what runs.
          </p>

        <section id="broke" className="broke">
          <h2>What Broke — when "scales infinitely" met Cursor's real usage</h2>
          <p>
            Not every architectural bet held. Cursor originally stored data in Yugabyte, a distributed SQL database marketed as able to "scale infinitely." Under 100x growth in a year, that assumption failed in practice: the team ended up doing manual database sharding (splitting data across machines by hand) and eventually migrated off Yugabyte to PostgreSQL, a far more conventional database. Separately, during a large indexing outage, the team moved to turbopuffer "in hours" — an emergency migration under fire, not a planned one (Pragmatic Engineer, 2025).
          </p>
          <p>
            Why did a database built to scale fail to scale here? Because "scales infinitely" is a claim about the general case, and Cursor's usage was not the general case. Its load is dominated by a specific, spiky pattern — hundreds of terabytes of embeddings and index trees, a million transactions a second, cold-start bursts when whole teams open projects in the morning. A general-purpose distributed database optimizes for a broad workload; it did not match the shape of Cursor's indexing traffic, and the mismatch only became visible at a scale the team reached faster than almost any company before it.
          </p>
          <p>
            The mitigation was expensive in the way that matters most: engineering attention and risk at the worst possible time. Moving a live, hundreds-of-terabytes data layer during an outage is high-stakes surgery; doing it "in hours" means senior engineers dropped everything, and any misstep would have extended the outage for paying enterprise customers. The team also had to unwind manual sharding — work that existed only because the original database could not shape itself to the workload. The cost was not a line item; it was velocity diverted from product into keeping the lights on.
          </p>
          <p>
            The lesson is the article's principle seen from the failure side: usage patterns dictate technology choices, and a vendor's scaling promise is not a substitute for matching the store to your actual traffic shape. The durable takeaway for a PM or CTO is to treat "it scales" as a question about your specific workload, and to build the ability to swap a data store before you are forced to swap it during an outage.
          </p>

        <section id="conclusion">
          <h2>Conclusion</h2>
          <p>
            The governing principle, now stress-tested by both the evidence and the failure: in an AI product the architecture is the product, because the invisible constraints — latency budget, no code at rest, cost per query — decide the feature set. Partial failure of this principle looks exactly like the Yugabyte episode: a team that treated the data store as a solved, invisible layer discovered that the layer's shape was, in fact, a product-limiting decision it had not made on purpose.
          </p>
          <p>
            For an AI PM, this changes what a roadmap is. You cannot scope features without scoping their lane: a request's latency budget, its model routing, and its retrieval depth are product requirements, not implementation details handed to engineering afterward. The Cursor case says the PM who understands the two-lane split can promise things (instant Tab, no code stored, whole-repo understanding) that a PM who sees only "add AI to the editor" cannot.
          </p>
          <p>
            For a future CTO, the case argues for buying optionality over buying scale. The decisions that aged well — abstracting the data store enough to swap it in hours, training a custom embedding model on your own usage, caching and reusing near-identical work — all preserved the ability to change course. The decision that aged badly — trusting a generic scaling promise — removed it. Build the seams that let you swap models and stores before growth forces the swap.
          </p>

function SelfNote({ placeholder, rows }) {
  const [t, setT] = useState("");
  const [done, setDone] = useState(false);
  return (
    <div className="q">
      {!done && (
        <div>
          <textarea className="ta" rows={rows || 3} value={t} placeholder={placeholder} onChange={(e) => setT(e.target.value)} />
          <button className="btn" disabled={!clampChars(t, 20)} onClick={() => setDone(true)}>{clampChars(t, 20) ? "Save" : "Enter at least 20 characters"}</button>
        </div>
      )}
      {done && <Reveal><div className="your-answer"><span>Saved:</span> {t}</div><button className="btn btn-ghost" onClick={() => setDone(false)}>Edit</button></Reveal>}
    </div>
  );
}

function InsightReveal({ cards }) {
  const [t, setT] = useState("");
  const [done, setDone] = useState(false);
  return (
    <div className="q">
      {!done && (
        <div>
          <textarea className="ta" rows={3} value={t} placeholder="Your single most non-obvious insight (min 30 characters)" onChange={(e) => setT(e.target.value)} />
          <button className="btn" disabled={!clampChars(t, 30)} onClick={() => setDone(true)}>{clampChars(t, 30) ? "Reveal authored insights" : "Enter at least 30 characters"}</button>
        </div>
      )}
      {done && (
        <Reveal>
          <div className="your-answer"><span>Your insight:</span> {t}</div>
          <div className="authored-label">How your insight compares</div>
          {cards.map((c, i) => <div className="insight-card" key={i}>{c}</div>)}
        </Reveal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
