/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */

function Tag({ children, tone }) {
  const bg = tone === "fact" ? "#EEF6EC" : tone === "estimate" ? "#FEF6E7" : "#F2F0FB";
  const fg = tone === "fact" ? "#2F6B2F" : tone === "estimate" ? "#8A5A00" : "#4B3F91";
  return (
    <span style={{
      display: "inline-block", fontSize: 11, fontWeight: 700, letterSpacing: 0.4,
      textTransform: "uppercase", background: bg, color: fg, borderRadius: 4,
      padding: "2px 7px", marginRight: 6
    }}>{children}</span>
  );
}

function SourceNote({ children }) {
  return <p style={{ fontSize: 13, color: "#555", marginTop: 6, lineHeight: 1.5 }}>{children}</p>;
}

function SectionHeading({ children, id }) {
  return <h2 id={id + "-h"} style={{ fontSize: 24, marginTop: 40, marginBottom: 12, color: "#111" }}>{children}</h2>;
}

/* ---------------------------------------------------------------------------
   Chart interpretation gate — two independently-gated prompts per chart
--------------------------------------------------------------------------- */
function InterpretationPrompt({ chartId, index, kindLabel, prompt, authored, state, onSubmit }) {
  const key = chartId + "-" + index;
  const submitted = !!(state[key] && state[key].submitted);
  const [draft, setDraft] = useState((state[key] && state[key].text) || "");
  const [selfNote, setSelfNote] = useState("");
  const minLen = 15;

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, marginTop: 12, background: "#FAFAFA" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>
        {kindLabel}
      </div>
      <p style={{ fontSize: 15, marginTop: 0 }}>{prompt}</p>
      {!submitted && (
        <>
          <textarea
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            placeholder={"Write your answer (min " + minLen + " characters)..."}
            style={{ width: "100%", minHeight: 64, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
            <span style={{ fontSize: 12, color: draft.length >= minLen ? "#2F6B2F" : "#999" }}>
              {draft.length}/{minLen} characters minimum
            </span>
            <button
              disabled={draft.length < minLen}
              onClick={() => onSubmit(key, draft)}
              style={{
                padding: "8px 16px", borderRadius: 8, border: "none", fontSize: 14, fontWeight: 600,
                background: draft.length < minLen ? "#E5E5E5" : "#111", color: draft.length < minLen ? "#999" : "#fff",
                cursor: draft.length < minLen ? "not-allowed" : "pointer"
              }}
            >Submit answer</button>
          </div>
        </>
      )}
      {submitted && (
        <>
          <div style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10, marginTop: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#555" }}>YOUR ANSWER</div>
            <p style={{ margin: "4px 0 0 0", fontSize: 14 }}>{state[key].text}</p>
          </div>
          <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#4B3F91" }}>COMPARE YOUR ANSWER TO THE AUTHORED ONE</div>
            <p style={{ margin: "4px 0 0 0", fontSize: 14 }}>{authored}</p>
          </div>
          {!state[key].selfNoteSubmitted && (
            <div style={{ marginTop: 8 }}>
              <input
                value={selfNote}
                onChange={(e) => setSelfNote(e.target.value)}
                placeholder="Optional: in one sentence, why does the data move this way?"
                style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13 }}
              />
              {selfNote.length > 0 && (
                <button onClick={() => onSubmit(key, state[key].text, selfNote)}
                  style={{ marginTop: 6, padding: "5px 10px", fontSize: 12, borderRadius: 6, border: "1px solid #ccc", background: "#fff", cursor: "pointer" }}>
                  Save note
                </button>
              )}
            </div>
          )}
          {state[key].selfNoteSubmitted && (
            <p style={{ fontSize: 12, color: "#777", marginTop: 6, fontStyle: "italic" }}>Your note: {state[key].selfNote}</p>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Question components
--------------------------------------------------------------------------- */

function MCQ({ q, state, onAnswer }) {
  const st = state[q.id] || { selected: null, submitted: false, attempts: 0, correct: false, showScaffold: false };
  const [selected, setSelected] = useState(st.selected);

  function submit() {
    if (selected === null) return;
    const isCorrect = selected === q.correctIndex;
    const attempts = st.attempts + 1;
    onAnswer(q.id, {
      selected, submitted: true, attempts, correct: isCorrect,
      showScaffold: !isCorrect && attempts >= 2
    });
  }
  function tryAgain() {
    setSelected(null);
    onAnswer(q.id, { ...st, selected: null, submitted: false });
  }

  const answered = st.submitted;
  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>
      {q.subForm && <div style={{ fontSize: 11, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>{q.subForm}</div>}
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 6 }}>{q.typeLabel}</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      <div style={{ display: "grid", gap: 8 }}>
        {q.options.map((opt, i) => {
          let bg = "#fff", border = "#D8D8D8";
          if (answered) {
            if (i === q.correctIndex) { bg = "#EEF6EC"; border = "#7EBF7E"; }
            else if (i === st.selected) { bg = "#FDEDED"; border = "#E39999"; }
          } else if (selected === i) { border = "#111"; }
          return (
            <button
              key={i}
              disabled={answered}
              onClick={() => setSelected(i)}
              style={{
                textAlign: "left", padding: "10px 12px", borderRadius: 8, border: "1.5px solid " + border,
                background: bg, cursor: answered ? "default" : "pointer", fontSize: 14, lineHeight: 1.5
              }}
            >
              <strong>{String.fromCharCode(65 + i)}.</strong> {opt.text}
            </button>
          );
        })}
      </div>
      {!answered && (
        <button
          disabled={selected === null}
          onClick={submit}
          style={{
            marginTop: 10, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
            background: selected === null ? "#E5E5E5" : "#111", color: selected === null ? "#999" : "#fff",
            cursor: selected === null ? "not-allowed" : "pointer"
          }}
        >Submit</button>
      )}
      {selected === null && !answered && (
        <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Select an option to enable Submit.</div>
      )}
      {answered && (
        <div style={{ marginTop: 12 }}>
          <div style={{
            padding: 10, borderRadius: 8,
            background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14
          }}>
            <strong>{st.correct ? "Correct" : "Incorrect"}</strong> — {st.correct ? q.correctCalibration : q.options[st.selected].wrongCalibration}
          </div>
          <p style={{ fontSize: 14, marginTop: 8 }}>{q.explanation}</p>
          <p style={{ fontSize: 13, color: "#555", marginTop: 4 }}><em>Where this generalizes:</em> {q.generalizes}</p>
          {st.showScaffold && !st.correct && (
            <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
              <strong style={{ fontSize: 13 }}>Scaffold — second attempt</strong>
              <p style={{ fontSize: 13.5, margin: "4px 0 0 0" }}>{q.scaffold}</p>
            </div>
          )}
          {!st.correct && (
            <button onClick={tryAgain} style={{ marginTop: 10, padding: "6px 14px", borderRadius: 8, border: "1px solid #111", background: "#fff", cursor: "pointer", fontSize: 13 }}>
              Try again
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function TDQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { value: "", submitted: false, offTarget: false };
  const [value, setValue] = useState(st.value);

  function submit() {
    const num = parseFloat(value);
    if (isNaN(num)) return;
    let ratio = num / q.target;
    if (ratio < 1) ratio = 1 / ratio;
    const withinTolerance = q.scoring === "pct"
      ? Math.abs(num - q.target) / q.target <= q.tolerancePct
      : ratio <= 2; // log-distance style: within 2x either direction counts
    onAnswer(q.id, { value, submitted: true, correct: withinTolerance, offTarget: ratio > 3 });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 6 }}>{q.typeLabel}</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      {q.skeleton && (
        <div style={{ background: "#FAFAFA", border: "1px dashed #ccc", borderRadius: 8, padding: 10, fontSize: 13, marginBottom: 8 }}>
          <strong>Decomposition skeleton:</strong> {q.skeleton}
        </div>
      )}
      {!st.submitted && (
        <>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input
              type="number"
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder={q.placeholder}
              style={{ padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 14, width: 160 }}
            />
            <span style={{ fontSize: 13, color: "#666" }}>{q.unit}</span>
          </div>
          <button
            disabled={value === ""}
            onClick={submit}
            style={{
              marginTop: 10, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: value === "" ? "#E5E5E5" : "#111", color: value === "" ? "#999" : "#fff",
              cursor: value === "" ? "not-allowed" : "pointer"
            }}
          >Submit estimate</button>
          {value === "" && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Enter a number to enable Submit.</div>}
        </>
      )}
      {st.submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ padding: 10, borderRadius: 8, background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14 }}>
            <strong>{st.correct ? "Within tolerance" : "Outside tolerance"}</strong> — your estimate: {st.value} {q.unit}; target: {q.target} {q.unit} ({q.targetLabel})
          </div>
          <p style={{ fontSize: 14, marginTop: 8 }}><strong>Anchor facts:</strong> {q.anchors}</p>
          <p style={{ fontSize: 14 }}><strong>Decomposition:</strong> {q.decomposition}</p>
          <p style={{ fontSize: 14 }}><strong>Bounds:</strong> {q.bounds}</p>
          <p style={{ fontSize: 14 }}><strong>Why the actual value lands here:</strong> {q.whyHere}</p>
          {st.offTarget && (
            <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginTop: 8 }}>
              <strong style={{ fontSize: 13 }}>Scaffold — you were off by more than 3x</strong>
              <p style={{ fontSize: 13.5, margin: "4px 0 0 0" }}>{q.misjudgedFactor}</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TGQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { choice: null, justification: "", submitted: false };
  const [choice, setChoice] = useState(st.choice);
  const [justification, setJustification] = useState(st.justification);
  const canSubmit = choice !== null && justification.length >= 15;

  function submit() {
    const correct = choice === q.correctAnswer;
    onAnswer(q.id, { choice, justification, submitted: true, correct });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 6 }}>True / False with justification</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      <div style={{ display: "flex", gap: 10 }}>
        {["True", "False"].map((label, i) => {
          const val = i === 0;
          let bg = "#fff", border = "#D8D8D8";
          if (st.submitted) {
            if (val === q.correctAnswer) { bg = "#EEF6EC"; border = "#7EBF7E"; }
            else if (val === st.choice) { bg = "#FDEDED"; border = "#E39999"; }
          } else if (choice === val) { border = "#111"; }
          return (
            <button key={label} disabled={st.submitted} onClick={() => setChoice(val)}
              style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1.5px solid " + border, background: bg, cursor: st.submitted ? "default" : "pointer", fontWeight: 600 }}>
              {label}
            </button>
          );
        })}
      </div>
      {!st.submitted && (
        <>
          <textarea
            value={justification}
            onChange={(e) => setJustification(e.target.value)}
            placeholder="Justify your answer in one sentence, naming the specific evidence (min 15 characters)..."
            style={{ width: "100%", minHeight: 56, marginTop: 8, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}

          <button
            disabled={!canSubmit}
            onClick={submit}
            style={{
              marginTop: 8, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: !canSubmit ? "#E5E5E5" : "#111", color: !canSubmit ? "#999" : "#fff",
              cursor: !canSubmit ? "not-allowed" : "pointer"
            }}
          >Submit</button>
          {!canSubmit && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Choose True or False and write a 15+ character justification to enable Submit.</div>}
        </>
      )}
      {st.submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ padding: 10, borderRadius: 8, background: st.correct ? "#EEF6EC" : "#FDEDED", fontSize: 14 }}>
            <strong>{st.correct ? "Correct" : "Incorrect"}</strong>{!st.correct && <> — this is {q.reasoningError}</>}

      )}
    </div>
  );
}

function TFQuestion({ q, state, onAnswer }) {
  const st = state[q.id] || { text: "", submitted: false, checks: [false, false, false] };
  const [text, setText] = useState(st.text);
  const [checks, setChecks] = useState(st.checks);

  function submit() {
    onAnswer(q.id, { text, submitted: true, checks });
  }
  function toggleCheck(i) {
    const next = checks.slice();
    next[i] = !next[i];
    setChecks(next);
    if (st.submitted) onAnswer(q.id, { ...st, checks: next });
  }

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 16, margin: "16px 0", background: "#FBFBFD" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginBottom: 6 }}>Pattern transfer</div>
      <p style={{ marginTop: 0, fontSize: 15 }}>{q.prompt}</p>
      {!st.submitted && (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={"Write your transfer (min " + q.minLen + " characters). Name the principle, apply it non-trivially, and name a new failure mode."}
            style={{ width: "100%", minHeight: 100, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
          />
          <div style={{ fontSize: 12, color: text.length >= q.minLen ? "#2F6B2F" : "#999", marginTop: 4 }}>{text.length}/{q.minLen} characters minimum</div>
          <button
            disabled={text.length < q.minLen}
            onClick={submit}
            style={{
              marginTop: 8, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
              background: text.length < q.minLen ? "#E5E5E5" : "#111", color: text.length < q.minLen ? "#999" : "#fff",
              cursor: text.length < q.minLen ? "not-allowed" : "pointer"
            }}
          >Submit</button>
        </>
      )}
      {st.submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10 }}>
            <p style={{ margin: 0, fontSize: 14 }}>{text}</p>
          </div>
          <p style={{ fontSize: 13, fontWeight: 700, marginTop: 10, marginBottom: 4 }}>Self-evaluation checklist</p>
          {[
            "Did I name the principle accurately?",
            "Is my application genuinely different from the original case?",
            "Is my failure mode new (not one already covered in this article)?"
          ].map((label, i) => (
            <label key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13.5, marginBottom: 4 }}>
              <input type="checkbox" checked={checks[i]} onChange={() => toggleCheck(i)} style={{ marginTop: 3 }} />
              {label}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

            </div>
          </div>

          {/* ============================ INTRO ============================ */}
          <div ref={(el) => (sectionRefs.current.intro = el)} id="intro">
            <SectionHeading id="intro">Introduction</SectionHeading>
            <p>
              In classical web systems, the scarce resource is compute — processor cycles spent calculating
              an answer — and the standard fix is to add more of them or cache the result. Serving a large
              language model (LLM) does not work this way. Once a model's weights sit in GPU memory, the
              next fixed cost is the <strong>KV cache</strong>: the key and value numbers the model saved
              from every token it has already read or written, kept so it does not have to redo that math on
              the next step. That cache grows with every new token and every simultaneous user, and it
              competes for the exact same memory the model's weights already occupy. Together AI, a company
              whose core product is running other companies' models as a paid service, has published its own
              serving research stating this plainly: at large batch sizes and long input sequences, the slow
              part of generating text is not the chip running out of math to do, it is the chip waiting on
              memory bandwidth to read a KV cache that has grown too large to move quickly (Together AI,
              2024). This article uses Together AI's own published engineering work — its serving engine,
              its quantized model tiers, and its speculative-decoding research — as evidence, because it is
              one of the few inference companies to publish detailed, numbered before-and-after comparisons
              of the specific techniques it uses against this constraint, rather than only marketing claims
              about being fast.
            </p>
            <p>
              By 2024, Together AI's own benchmarks put its FP8-quantized "Turbo" endpoints at up to 4.5
              times the throughput of the open-source vLLM engine (version 0.5.1) on Llama-3-8B-Instruct and
              Llama-3-70B-Instruct, and its full-precision "Reference" endpoints at roughly 4 times vLLM's
              throughput in normal serving conditions (Together AI, 2024). vLLM is not a strawman baseline —
              its own 2023 launch benchmarks reported up to 24 times the throughput of a naive Hugging Face
              Transformers deployment, by inventing a memory-management technique called PagedAttention
              (vLLM Blog, 2023). Two peer inference platforms racing the same problem, Fireworks AI and
              Baseten, both rent the same on-demand GPU class — an Nvidia H100 — at nearly the same hourly
              rate ($7.00 and $6.50, respectively) and price at least two of the same open models identically
              per token, evidence that the category has converged on a small menu of hardware and pricing
              choices because the underlying constraint, GPU memory bandwidth, is identical for everyone
              (Fireworks AI and Baseten pricing, via Morph LLM comparison, 2026).
            </p>
            <p>
              Classical system design has a standard fix when a server runs low on capacity: batch more
              requests together so a fixed cost amortizes across more work. Batching an LLM request is not
              that simple, because a request has neither a fixed size nor a fixed finish time the way a
              database query does — one user might need 20 tokens generated, another might need 2,000. A
              batch that waits for every member to finish before accepting new work lets one long request
              hold every short one behind it hostage, the opposite of amortizing cost. And because the memory
              a request needs is not known in advance, a fixed-size reservation either wastes GPU memory that
              could serve other users or runs out and crashes a request mid-generation. Both problems are
              exactly what continuous batching and paged, block-based KV cache management — the subject of
              this article's first research question — exist to solve.
            </p>
            <p>
              This article addresses three questions. First, how do continuous batching and paged,
              block-based key-value cache management change what a serving engine can promise, and what does
              that change cost to build? Second, why does speculative decoding — a technique originally built
              to speed up one user's response — also help at the opposite end of the spectrum, in the
              large-batch, long-context traffic an inference provider actually runs at scale, and what does
              that speed cost in output quality? Third, once a company like Together AI has these techniques
              working, how does it turn them into the tiered, per-token prices customers actually pay, and
              what operational discipline keeps a technique's promised speedup from silently rotting in
              production?
            </p>
          </div>

          {/* ============================ BACKGROUND ============================ */}
          <div ref={(el) => (sectionRefs.current.background = el)} id="background">
            <SectionHeading id="background">Technical and Product Landscape</SectionHeading>
            <p>
              Before continuous batching existed, serving engines used static batching: a fixed group of
              requests started together, and the whole group finished together, no matter how much some
              members outran the others. Every request in that group also received its own separately
              reserved, contiguous block of GPU memory sized for the longest sequence the system allowed —
              whether or not any single request actually used all of it. vLLM's own 2023 launch post named
              memory waste from this pattern as the central bottleneck holding back serving throughput, and
              introduced PagedAttention: a technique borrowed from how operating systems manage virtual
              memory, which divides the KV cache into small, fixed-size blocks that can be allocated
              non-contiguously and mapped to a request through a lookup table, instead of reserving one large
              slab per request up front (vLLM Blog, 2023). The result, on the same hardware and the same
              models, was up to 24 times the throughput of a naive Hugging Face Transformers deployment and
              up to 3.5 times the throughput of HuggingFace's own early batching engine, TGI (vLLM Blog,
              2023).
            </p>
            <ChartCard
              chart={{
                id: "pagedattnchart",
                tier: "fact",
                title: "vLLM's 2023 Launch Benchmark: Throughput Gain from PagedAttention + Continuous Batching",
                height: 260,
                note: "FACT: reported speedup ranges from vLLM's own launch announcement, measured against a naive Hugging Face Transformers deployment and against HuggingFace's TGI serving engine, same models and hardware (vLLM Blog, 2023).",
                render: () => (
                  <ResponsiveContainer>
                    <BarChart data={pagedAttnData} layout="vertical" margin={{ left: 10, right: 20 }}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis type="number" label={{ value: "Speedup (x)", position: "insideBottom", offset: -5, fontSize: 11 }} />
                      <YAxis type="category" dataKey="name" width={170} tick={{ fontSize: 10.5 }} />
                      <Tooltip />
                      <Legend />
                      <Bar dataKey="low" name="Low end" fill="#B9AEEF" radius={4} />
                      <Bar dataKey="high" name="High end" fill="#6B5CD6" radius={4} />
                    </BarChart>
                  </ResponsiveContainer>
                ),
                interp: [
                  {
                    kind: "Quantitative reasoning",
                    prompt: "The reported speedup over naive Hugging Face Transformers (14x-24x) is roughly 6-7x larger than the speedup over TGI (2.2x-3.5x), even though both comparisons used the same PagedAttention engine. Estimate how much throughput TGI itself must already have captured relative to the naive baseline, and state what that implies about how much of vLLM's total gain is genuinely new versus already-known batching wins.",
                    authored: "If vLLM is roughly 24x naive and roughly 3.5x TGI, then TGI itself is roughly 24/3.5 ≈ 6.9x naive — meaning TGI's own batching work had already captured most of the low-hanging fruit before PagedAttention arrived. PagedAttention's genuinely new contribution is closer to that remaining 2.2x-3.5x, not the full 14x-24x headline number; comparing only to the weakest baseline (naive Transformers) would overstate how much of the gain is attributable to the new memory-management idea specifically."
                  },
                  {
                    kind: "So-what / threshold-decision-rule",
                    prompt: "If a team is currently running a naive, unbatched deployment and is deciding whether to adopt an early batching engine like TGI first or jump straight to a PagedAttention-based engine, at what point does skipping the intermediate step stop being worth the extra migration risk?",
                    authored: "Skipping straight to a PagedAttention-based engine is worth the extra migration effort whenever the team's current unbatched throughput is already failing to meet demand today — in that case, capturing only TGI's roughly 7x and then migrating again later costs more total engineering time than migrating once. If current throughput is adequate and the move is purely opportunistic cost-cutting, taking the smaller, better-understood TGI-style step first reduces risk, since it isolates whether ordinary batching alone resolves the bottleneck before adopting a newer, less battle-tested engine."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <p>
              PagedAttention fixed memory waste per request, but it did not make the memory problem
              disappear — it made the problem scale with context length in a way that is easy to underrate
              until it is written out in numbers. A decoder-only model's KV cache size for one request grows
              in direct proportion to how many tokens are in play: for a model with L transformer layers,
              H<sub>kv</sub> key/value attention heads, and head dimension D, one request's cache in 16-bit
              precision takes roughly 4 × L × H<sub>kv</sub> × D × (sequence length) bytes, since both a key
              and a value are stored for every layer and every head at every position (Raschka, LLM
              Architecture Gallery). Plugging in the shape of a 70-billion-parameter, Llama-style model (80
              layers, 8 key/value heads, 128-dimensional heads — a configuration Raschka uses directly as a
              worked example) shows that a single 128,000-token request needs roughly 40 gibibytes of KV
              cache on its own, in 16-bit precision (Raschka, LLM Architecture Gallery). That is not a
              rounding error on top of the model's weights; for a 70-billion-parameter model, it is close to
              the size of the weights themselves.
            </p>
            <ChartCard
              chart={{
                id: "kvgrowthchart",
                tier: "estimate",
                title: "Estimated KV Cache Size for ONE Request, by Context Length (70B-class Llama-style model, 16-bit precision)",
                height: 260,

              By 2025, three inference platforms serving open-weight models at scale — Together AI,
              Fireworks AI, and Baseten — had each converged on the same broad response to this constraint:
              multiple quantization tiers, priced separately, plus per-hour dedicated GPU rental on the same
              small menu of hardware (Nvidia H100, H200, B200, and B300 cards). Baseten's own published rates

              across independent companies is itself evidence for this article's governing claim: when the
              scarce resource is the same physical thing (GPU memory and memory bandwidth) for every
              provider, the menu of viable business responses — compress the model, ration memory across
              users, or charge by the GPU-hour instead of the token — narrows to roughly the same handful of

            </p>
            <Glossary items={[
              { term: "KV cache (key-value cache)", def: "The saved attention math (keys and values) from every token a model has already processed, kept in GPU memory so the model does not have to redo that work for each new token." },
              { term: "PagedAttention", def: "A technique that stores a request's KV cache in small, reusable memory blocks instead of one large reserved slab, cutting memory waste and letting more requests share the same GPU." },

          {/* ============================ RQ1 ============================ */}
          <div ref={(el) => (sectionRefs.current.rq1 = el)} id="rq1">
            <SectionHeading id="rq1">RQ1 — Batching and the KV Cache: Scheduling Memory, Not Requests</SectionHeading>
            <p>
              The claim to defend in this section: continuous batching and paged KV cache management work
              because they treat GPU memory, not a request queue slot, as the thing being scheduled — and
              every one of Together AI's own published serving-engine gains sits on top of that same
              foundation. A classical request scheduler asks "is there a free worker?" An LLM serving
              scheduler has to ask a fundamentally different question: "is there enough free memory, in
              blocks, to hold this specific request's growing cache?" — and that question has to be
              re-answered at every single token generated, for every request in flight, because the answer
              changes constantly as caches grow and shrink.
            </p>
            <BatchingKVCacheSVG />
            <p style={{ fontSize: 13, color: "#555", marginTop: 4 }}>
              <em>ILLUSTRATION: a generic diagram of continuous batching's decision rule, not a specific
              company's exact implementation or request mix. Illustrative values — not reported
              statistics.</em>
            </p>
            <p>
              Together AI's own published numbers show what building this kind of memory-aware scheduling,
              on top of an already-strong baseline, is worth in practice. Its Inference Engine 2.0 measured
              itself directly against vLLM 0.5.1 — the same engine whose own launch benchmark this article's
              Landscape section already used as the founding evidence for memory-aware serving — and reported
              up to 4 times the throughput on its full-precision "Reference" tier and up to 4.5 times on its
              FP8-quantized "Turbo" tier, on Llama-3-8B-Instruct and Llama-3-70B-Instruct (Together AI, 2024).
            </p>

            <p>
              A related, complementary technique worth knowing, because it attacks a different failure mode
              of the same batching system: chunked prefill. Before a model can generate its first output
              token, it has to run a "prefill" pass over the entire input prompt — and a very long prompt
              (a large document to summarize, for example) can take long enough that it blocks every other
              request's decode step from running during that window, the same head-of-line problem
              continuous batching was built to solve for whole requests, reappearing inside a single request.
              Chunked prefill splits a long prompt's processing into smaller pieces and interleaves them with
              other requests' ongoing decode steps, so one enormous prompt does not stall everyone else's
              short replies (industry serving-engine documentation describes this as a standard complementary
              technique alongside continuous batching and PagedAttention). It is a reminder that "continuous
              batching" is not one single mechanism but a family of related scheduling decisions, each
              solving a different way a batch can get stuck.
            </p>

            <PrincipleGate sectionId="rq1" authored="Continuous batching and paged, block-based KV cache allocation work because they treat GPU memory, not compute, as the resource being scheduled — a new request joins the batch the instant memory frees up, and the cache itself is allocated in reusable blocks instead of one large reservation per request, which is why serving capacity is a memory-management problem before it is a model-speed problem." state={principleState} onSubmit={submitPrinciple} />
            <TFQuestion

            <p>
              The evidence in this section supports treating memory scheduling, not raw compute, as the
              primary constraint continuous batching and PagedAttention were built to manage — vLLM's own
              launch numbers and the KV cache growth arithmetic both point the same direction. What this
              section's evidence does not yet show is whether every technique that trades some speed for
              memory savings is free, or whether some of those trades cost something in output quality — a
              question the next section takes up through Together AI's own speculative-decoding research.
            </p>
            <Glossary items={[
              { term: "Prefill", def: "The first pass a model runs over an entire input prompt before generating any output token, building the initial KV cache for everything the user already typed." },
              { term: "Chunked prefill", def: "Splitting a long prompt's prefill pass into smaller pieces and interleaving them with other requests' decode steps, so one huge prompt does not block everyone else's replies." },
              { term: "FP8 / BF16 / INT4", def: "Numeric formats for storing a model's weights: FP8 uses 8 bits (1 byte) per number, BF16 uses 16 bits (2 bytes), and INT4 uses 4 bits (half a byte) — fewer bits means less memory but more risk of losing precision." }

          {/* ============================ RQ2 ============================ */}
          <div ref={(el) => (sectionRefs.current.rq2 = el)} id="rq2">
            <SectionHeading id="rq2">RQ2 — Speculative Decoding: A Latency Trick That Turned Into a Throughput Trick</SectionHeading>
            <p>
              The claim to defend here: speculative decoding was built to cut one user's response latency,
              but Together AI's own research shows it also raises throughput at large batch sizes and long
              context — because in both cases, the real bottleneck is identical: the GPU sitting idle while
              it waits to read a KV cache too large to move through memory quickly, and a cheap draft model's
              guesses hide that wait instead of eliminating it. Speculative decoding works by having a small,
              fast "draft" model guess several tokens ahead, then having the large "target" model check all
              of those guesses in a single pass; whenever the draft guessed right, the system banks several
              tokens for the compute cost of one verification step.
            </p>
            <p>
              For years, the standard framing of speculative decoding treated it as a latency-only technique,
              useful mainly for a single user waiting on a single response, and assumed it would help less
              once many requests were batched together, because a big batch is already keeping the GPU's
              compute busy. Together AI's own published research directly overturns half of that assumption:
              at large batch sizes and long input sequences, decoding is memory-bound, not compute-bound — the
              GPU is waiting on the KV cache, not running out of math to do — which means there is idle
              compute capacity sitting around even in a large batch, and speculative decoding can use it
              (Together AI, 2024). Together's own MagicDec approach keeps the draft model's own KV cache
              capped at a fixed size using a StreamingLLM-style window, so the draft stays cheap to run no
              matter how long the target sequence gets, and reported up to a 2x improvement in both
              throughput and latency on 8 A100 GPUs (Together AI, 2024).
            </p>
            <ChartCard
              chart={{

              Evidence against a simple "speculative decoding always helps this much" reading already exists

              — hiding a memory-bound wait behind speculative compute — holds across every tested combination
              in this specific research, even though the exact multiplier moves with the details. That
              distinction matters for a PM evaluating a vendor's headline number: the mechanism generalizes
              more confidently than the specific multiplier does.
            </p>

              prediction heads directly onto the target model itself (approaches publicly known as EAGLE and
              Medusa), so the same forward pass produces both the next token and a guess at several tokens
              after it, with no separate draft model to load or keep in sync. This removes the need to manage
              a second model's own memory footprint, but it ties the technique's benefit to how well those
              extra heads, trained specifically for that one target model, keep predicting well as real
              traffic changes underneath them — a coupling this article's What Broke section returns to
              directly.
            </p>

            <MCQ
              q={{

            <p>
              The evidence in this section supports treating speculative decoding as a mechanism-level
              solution to memory-bound decoding, applicable wherever that mechanism is present, rather than a
              latency-only trick with a fixed, universal multiplier. What the evidence does not establish is
              a single number a team can plan around: the reported speedups range from 1.84x to 2.51x across
              only three tested configurations, and this article's own consulting case shows the technique's

            <Glossary items={[

              { term: "Draft model / target model", def: "In speculative decoding, the draft model is the small model making fast guesses; the target model is the large model whose output actually matters, which verifies or rejects each guess." },
              { term: "Acceptance rate / acceptance length", def: "How often, or how many tokens in a row, the target model accepts the draft model's guesses before it has to reject one and fall back to its own next token." }

          {/* ============================ RQ3 ============================ */}
          <div ref={(el) => (sectionRefs.current.rq3 = el)} id="rq3">
            <SectionHeading id="rq3">RQ3 — The Cost-Per-Token Curve: Turning Memory Tricks Into a Price Sheet</SectionHeading>
            <p>
              The claim to defend here: a provider's cost-per-token curve is not one number set by a model's
              parameter count; it is a menu of quantization tiers, each trading a small, measured accuracy
              change for a real price cut, and the "right" tier is a workload-specific decision, not a
              default a whole company should inherit from one published benchmark. Together AI turns its
              engineering work directly into product tiers: "Turbo" endpoints run FP8 (8-bit) quantization,
              "Reference" endpoints run full BF16 precision, and "Lite" endpoints run INT4 (4-bit)
              quantization — three points on the same speed-versus-accuracy curve, priced differently
              (Together AI, 2024).
            </p>
            <p>
              The quality side of that tradeoff is not marketing language; Together AI published specific,
              measured deltas. Its FP8 quantization approach applies to most of a model's matrix
              multiplications — specifically, roughly half of total inference compute inside the feedforward
              network layers — while deliberately leaving the self-attention layers unquantized, and it uses
              dynamic scaling factors tuned per layer to limit precision loss (Together AI, 2024). Measured
              against Meta's own full-precision reference implementation, downstream task accuracy came out
              0.1 percentage points higher on average for Llama-3.1-70B, 0.3 percentage points lower for
              Llama-3.1-8B, and effectively unchanged for Llama-3.1-405B (Together AI, 2024).
            </p>

                    kind: "Quantitative reasoning",

                    authored: "The gap is 0.1 − (−0.3) = 0.4 percentage points. A small positive delta on one model size almost certainly reflects noise in the specific downstream benchmark suite (quantization changes numerical rounding in ways that can occasionally nudge a score up or down by chance) rather than FP8 systematically improving reasoning — treating a 0.1 percentage-point gain as proof of a real quality improvement would be over-reading noise as signal, especially given the near-zero net effect on the largest (405B) model."
                  },
                  {
                    kind: "So-what / segmentation",
                    prompt: "Given that the three tested model sizes show three different accuracy deltas (-0.3, +0.1, ~0.0 percentage points), how should a PM segment which of their own product's AI features are safe to run on the FP8 Turbo tier by default versus which should stay on the more expensive Reference tier?",
                    authored: "Segment by how sensitive a given feature is to small accuracy shifts, not by model size alone: a feature where a fraction of a percentage point of accuracy change could plausibly flip a user-visible answer (a medical or financial calculation, for example) should default to Reference regardless of which model size is used, while a feature tolerant of small variance (casual conversation, brainstorming) can default to Turbo — because the measured deltas here are all small in absolute terms, but 'small' is only safe when the feature's own error tolerance is not also small."
                  }
                ]
              }}
              interpState={interpState}
              onInterpSubmit={submitInterp}
            />
            <p>
              That quality curve turns directly into Together AI's own published price sheet. Llama-3.1-8B
              costs $0.10 per million tokens on the INT4 "Lite" tier or $0.18 per million tokens on the FP8
              "Turbo" tier; Llama-3.1-70B costs $0.88 per million tokens on Turbo; and Llama-3.1-405B costs
              $3.50 per million tokens (Together AI pricing, 2026). Two things are worth noticing in that
              curve together: price does not rise in exact proportion to parameter count (405B has roughly 50
              times as many parameters as 8B but costs about 35 times as much per token, using 8B's Turbo
              price as the comparison point), and the cheapest price point available for the smallest model
              uses a more aggressive compression tier than the price points shown for the larger models.
            </p>
            <ChartCard
              chart={{
                id: "pricingchart",
                tier: "fact",
                title: "Together AI: Price per Million Tokens, by Model Size and Quantization Tier (Together AI pricing, 2026)",
                height: 260,

                  {

                  }
                ]
              }}

              onInterpSubmit={submitInterp}
            />
            <p>
              A complementary cost lever worth knowing, because it operates on a completely different axis
              than quantization tier: caching the input tokens themselves. Peer platform Fireworks AI prices
              at least one shared model's cached input tokens far below fresh ones — for example, listing
              Kimi K2.6 at $0.95 per million fresh input tokens but only $0.16 per million for input tokens
              already seen and cached from a prior request (Fireworks AI pricing, via Morph LLM comparison,
              2026). Where quantization tier trades accuracy for a cheaper price on every token, prompt
              caching trades nothing in accuracy at all — it exploits the fact that many real conversations
              repeat a long, unchanged prefix (a system prompt or reused document) across requests, so the
              KV cache for that shared prefix can be computed once and reused rather than recomputed and
              rebilled every time.
            </p>
            <MCQ

                id: "mcq-rq3-tb",

                  { text: "The price gap must be driven entirely by fluctuating GPU market demand specifically for the 405B model, since no plausible engineering or quantization-related reason could ever produce a non-proportional scaling relationship like this one.", wrongCalibration: "this is a single-cause fallacy that invents a demand-driven mechanism not supported by evidence in this article, while ignoring the tiering explanation the article's own evidence directly supports." },
                  { text: "Together prices each model at a different quantization tier: 8B's cheapest option uses 4-bit weights, while the larger sizes shown here do not offer that option — so part of the gap reflects a tier choice, not parameter count alone.", wrongCalibration: "" },
                  { text: "Because Together applies the exact same FP8 quantization precision to every model size shown in this chart, the residual price gap must come from a fixed per-request platform fee added only to the larger models.", wrongCalibration: "this is a factual misattribution that contradicts evidence already in this article: the $0.10 price point is explicitly the INT4 Lite tier, not the same FP8 precision used for the other three prices." }
                ],
                correctIndex: 2,
                correctCalibration: "this generalizes to any cross-product pricing comparison: a price curve that does not track a single input linearly usually means more than one lever (here, quantization tier) is baked into the number.",
                explanation: "The four prices compared here are not all the same quantization tier: the $0.10 figure is Llama 3.1 8B's INT4 'Lite' tier, while 70B and 405B are shown at their FP8 'Turbo' or full-precision tiers. Because a lower-precision tier is cheaper to run per token by design, part of the reason 8B's price is so much lower than a naive per-parameter scaling would predict is that its cheapest available tier uses more aggressive compression than what is shown for the larger models in this comparison — the price curve mixes a model-size effect and a quantization-tier effect together.",
                scaffold: "Check which quantization tier each of the four prices in the chart actually reflects — are they all the same precision, or does one of them use a cheaper compression setting than the others?",
                generalizes: "Any per-unit price comparison across a product line where the cheapest SKU also happens to use a lower-cost configuration — the same mixing of effects appears when comparing cloud storage tiers priced per gigabyte, where the cheapest tier is also the slowest, and the price difference is not purely about storage volume."
              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
            <MCQ
              q={{
                id: "mcq-rq3-tc",
                typeLabel: "T-C — PM consulting case",
                subForm: "Case Prompt",
                prompt: "Quantum Ledger, a fintech startup, is choosing a serving vendor for a customer-facing chat feature and picks Together AI's Turbo (FP8) tier company-wide because 'FP8 is basically free accuracy — Together's own numbers show it's within a few tenths of a percent of full precision.' Which assumption must hold for this recommendation to create value, and what evidence in this article is thinnest in supporting it?",
                options: [
                  { text: "That Together AI charges the exact same price for its Turbo tier no matter which model size is served, a claim this article's own pricing chart already shows is clearly false, since prices rise sharply across the sizes shown.", wrongCalibration: "this is a factual misattribution — it contradicts the article's own pricing evidence, which is why it can be eliminated quickly rather than being the genuinely thin assumption." },
                  { text: "That Quantum Ledger's specific model and task resemble the Llama 3.1 family and general benchmarks Together tested — thin, because the reported deltas were measured on three model sizes on general tasks, not on Quantum Ledger's own fine-tuned financial-compliance model.", wrongCalibration: "" },

            <TFQuestion

            <p>
              The evidence in this section supports treating a provider's price sheet as a direct, readable

            <Glossary items={[

          {/* ============================ WHAT BROKE ============================ */}
          <div ref={(el) => (sectionRefs.current.brokewhat = el)} id="brokewhat">
            <div style={{ background: "#FEF2F2", border: "1px solid #FCA5A5", borderRadius: 14, padding: 24, marginTop: 40 }}>
              <SectionHeading id="brokewhat">What Broke</SectionHeading>
              <p>
                Speculative decoding's benefit is not a fixed, load-once setting — and the clearest public
                evidence for that is a still-open reliability problem in vLLM, the same open-source serving
                engine this article has used throughout as the industry baseline. Two separate, publicly
                filed bug reports describe a production configuration that worked well when first turned on,
                then quietly got worse. In the first, filed in December 2024, an engineer running
                Llama-3.3-70B-Instruct as the target model with a smaller Llama-3.2-3B-Instruct draft model
                reported that the draft acceptance rate stayed healthy at first, then began falling after
                roughly 15 minutes of live production traffic, kept falling for about 30 more minutes, and
                leveled out between 0.2 and 0.4 — a point at which generation speed was actually lower than
                running with speculative decoding turned off entirely (vLLM GitHub Issue #11188, 2024). In a
                second, later report, engineers running Eagle- and Eagle3-based speculative decoding (a method
                that adds extra prediction heads directly onto the target model, described in this article's
                RQ2 section) on two different vLLM releases found that the accepted-tokens-per-step metric
                "smoothly and monotonically regresses" under sustained real traffic, never recovers on its
                own, and resets to its original healthy value only after a full service restart — with the
                degradation concentrated specifically on the highest-volume prompt types (vLLM GitHub Issue
                #41838).
              </p>
              <p>
                The assumption that failed is one most engineering teams never think to name, because it is
                true almost everywhere else in ordinary software: that a feature validated once, and turned
                on, keeps performing the way it did during validation, the same way a compiled program's
                speed does not degrade on its own while it keeps running. That assumption does not hold for
                speculative decoding, because the number that determines its entire benefit — how often, and
                how many tokens in a row, the small draft model correctly predicts what the large target model
                would have generated — is not a property of the code. It is a live statistical measure of how
                well two models currently agree on real, changing traffic. Nothing about the underlying
                program needs to change for that agreement rate to drift as the mix of prompt types shifts
                under sustained volume; that is exactly why a restart, not a code fix, is the only reported
                way back to the original number.
              </p>
              <ChartCard
                chart={{
                  id: "brokechart",
                  tier: "fact",
                  title: "Acceptance Length Before vs. After Degradation, Three Tested Configurations (vLLM GitHub Issue #41838)",
                  height: 260,
                  note: "FACT: initial and degraded acceptance-length values (average accepted draft tokens per verification step) as reported across three separate tested configurations in the same issue thread, vLLM versions 0.17.1 and 0.19.1, Eagle/Eagle3 speculative decoding. The source issue does not name which specific model pairing produced each row, so configurations are labeled generically (A, B, C) here rather than attributed to models not confirmed in the source.",
                  render: () => (
                    <ResponsiveContainer>
                      <BarChart data={acceptanceDegradationData}>
                        <CartesianGrid strokeDasharray="3 3" />
                        <XAxis dataKey="config" tick={{ fontSize: 11 }} />
                        <YAxis label={{ value: "Acceptance length (tokens/step)", angle: -90, position: "insideLeft", fontSize: 9.5 }} />
                        <Tooltip />
                        <Legend />
                        <Bar dataKey="initial" name="Initial (validated)" fill="#6B5CD6" radius={4} />
                        <Bar dataKey="degraded" name="Degraded (under sustained traffic)" fill="#DC2626" radius={4} />
                      </BarChart>
                    </ResponsiveContainer>
                  ),
                  interp: [
                    {
                      kind: "So-what / kill-criteria",
                      prompt: "Given that acceptance length degraded silently in all three configurations — no crash, no error, just a slow decline that only a full restart resets — what single monitoring signal would you add to a production speculative-decoding deployment as a kill-criterion, since neither uptime nor a generic latency dashboard would catch this?",
                      authored: "A dedicated, continuously tracked acceptance-length (or acceptance-rate) metric, sampled per prompt type and alerted against its own launch-day baseline — for example, firing when acceptance length drops more than 15-20% below its initial value for a sustained window — because this is the only signal that directly tracks the draft model's live match rate with the target model, which is exactly the thing degrading here while every other health signal stays green."
                    },
                    {
                      kind: "Quantitative reasoning",
                      prompt: "Configs A and B both fell from an acceptance length of about 3.07 to about 2.8, while Config C fell from about 4.5 to about 2.8 — the same ending point from three different starting points. Compute the percentage decline for each configuration, and say which one lost the largest share of its original throughput advantage.",
                      authored: "Configs A and B: (3.07 − 2.8) ÷ 3.07 ≈ 8.8% decline each. Config C: (4.5 − 2.8) ÷ 4.5 ≈ 37.8% decline. Config C lost by far the largest share of its original advantage — it started with the longest accepted sequence per verification step, meaning it had the most speculative-decoding benefit to lose, and the degradation erased more than a third of it, while Configs A and B, which started closer to the shared floor of about 2.8, had much less room left to fall."
                    }
                  ]
                }}
                interpState={interpState}
                onInterpSubmit={submitInterp}
              />
              <p>
                Neither public issue reports a fully itemized mitigation cost, so what follows should be read
                as an ESTIMATE rather than a stated figure: at minimum, the affected teams had to build their
                own acceptance-length dashboards and alerting from scratch, since this metric is not part of
                the health signals most serving stacks already track, and put in place some form of
                scheduled or threshold-triggered restart as a workaround, engineering effort that a team which
                assumed "we turned speculative decoding on, we are done" would never have budgeted for. The
                harder cost to put a number on is the one that matters most for a paying customer of an
                inference platform: the second issue reports the regression persisting across two different
                vLLM releases (0.17.1 and 0.19.1), meaning upgrading the software was not a fix — any customer
                billed on a "speedup included" basis had no way to know, from the outside, that the speedup
                they were promised had quietly fallen by up to 38%.
              </p>
              <p>
                The lesson generalizes past this one open-source project's bug reports. Any serving
                optimization whose benefit depends on an ongoing statistical match between two models on real
                traffic — a draft model's agreement with a target model, a quantized model's accuracy delta
                on a specific customer's specialized workload, a cache's hit rate against a shifting query mix
                — is not a one-time configuration decision. It is a bet that needs its own continuously
                monitored metric, separate from every other health signal a team already tracks, precisely
                because the failure mode described here is invisible to uptime, error-rate, and even a naive
                latency dashboard until someone happens to compare today's throughput against a stale
                baseline and finds the "optimization" has quietly become a tax.
              </p>
              <MCQ
                q={{
                  id: "mcq-broke",
                  typeLabel: "Failure-case question",
                  prompt: "Given the vLLM speculative-decoding acceptance-length regression, which assumption in the original design was most likely held by the team and considered uncontroversial — and why was it wrong?",
                  options: [
                    { text: "That the draft model was simply too small and too different from the target model to ever match its outputs well, meaning speculative decoding should never have been enabled for this pairing in the first place.", wrongCalibration: "this is hindsight bias — it frames the initial rollout as a mistake, when the configuration actually started with a healthy, validated acceptance rate; the failure appeared later, under sustained traffic, not at launch." },
                    { text: "That upgrading the vLLM serving engine to whatever the next released version happened to be would automatically fix this specific regression, since ordinary software bugs are normally resolved in the following release cycle.", wrongCalibration: "this is a single-cause fallacy — it treats 'upgrade the software' as sufficient without engaging with the article's own evidence that the regression persisted across two separate vLLM versions." },
                    { text: "That once a speculative-decoding configuration is validated and turned on, its performance stays a fixed property of the setup, the same way a compiled program's speed does not silently degrade on its own — a fair assumption for ordinary software, but wrong here.", wrongCalibration: "" },
                    { text: "That vLLM's speculative decoding implementation contains one specific, identifiable memory leak in its verification step, and that this single confirmed leak directly and fully causes the acceptance-length numbers to fall over time.", wrongCalibration: "this is scope creep misdiagnosis — the public issue reports a correlation with traffic volume and a full recovery only via restart, not a confirmed memory-leak root cause; naming an unconfirmed specific bug mechanism overstates what the evidence shows." }
                  ],
                  correctIndex: 2,
                  correctCalibration: "this generalizes to any optimization whose benefit depends on live agreement between two models or between a system and its input distribution — the same wrong assumption (validated once, therefore fixed forever) appears in recommendation-system relevance scores and fraud-model precision, both of which can drift the same way under real traffic without any code changing.",
                  explanation: "The team's speculative-decoding setup passed validation with a healthy acceptance length, and it is entirely reasonable to treat a validated configuration as stable — that is how ordinary compiled software behaves. But acceptance length measures how often a small draft model's guesses match a much larger target model's real output on live traffic, and that match rate is a property of the traffic distribution, not just the two models. As traffic volume concentrated on certain prompt types, the live match rate drifted, and nothing about the code needed to change for the number to fall — which is exactly why a full restart, not a code fix, was the only reported way back to the original value.",
                  scaffold: "What does 'acceptance length' actually measure — a property of the code, or a property of how well two models currently agree on real, changing traffic? Which of those two things can drift without a single line of code changing?",
                  generalizes: "Any system whose value depends on ongoing agreement between two models or between a system and its input distribution — fraud-detection precision degrading as fraud patterns shift, or a recommendation model's click-through rate drifting as user behavior changes, both fail the same 'validated once means stable forever' assumption."
                }}
                state={mcqState}
                onAnswer={submitMcq}
              />
              <Glossary items={[
                { term: "Regression (in this context)", def: "A gradual decline in a system's measured performance over time, without any change to the underlying code — here, the draft model's acceptance length falling under sustained real traffic." }
              ]} />
            </div>
          </div>

          {/* ============================ LEARNING SUMMARY ============================ */}
          <div ref={(el) => (sectionRefs.current.summary = el)} id="summary">
            <SectionHeading id="summary">Learning Summary</SectionHeading>
            <LearningSummaryBody
              mcqState={mcqState}
              warmupSkipped={warmupSkipped}
              principleState={principleState}
              insightSlot={insightSlot}
              setInsightSlot={setInsightSlot}
              applyIt={applyIt}
              setApplyIt={setApplyIt}
            />
          </div>

          {/* ============================ CONCLUSION ============================ */}
          <div ref={(el) => (sectionRefs.current.conclusion = el)} id="conclusion">
            <SectionHeading id="conclusion">Conclusion</SectionHeading>
            <p>
              The governing principle, now stress-tested against both the evidence and the failure case:
              memory — specifically, the KV cache's footprint — not compute, is usually the resource that
              runs out first in LLM serving, and Together AI's own architecture of continuous batching,
              tiered quantization, and speculative decoding is built entirely around buying back or hiding
              that constraint. The vLLM acceptance-length regression shows what partial failure of this
              principle looks like: even a technique correctly designed around the memory-bound reality can
              quietly stop delivering its promised benefit once real traffic behaves differently than the
              traffic it was validated on, and nothing about "the code" has to break for that to happen.
            </p>
            <p>
              For an AI product manager, this changes what "we enabled a serving optimization" should mean
              operationally. It is not a one-time engineering decision but a metric that needs its own
              dashboard, alerting, and periodic reevaluation, the same way a fraud model's precision or a
              recommendation model's click-through rate needs ongoing monitoring — because a technique's
              benefit can decay in production for reasons that have nothing to do with a bug in the
              traditional sense.
            </p>
            <p>
              For a future CTO, the platform implication is that any serving optimization whose benefit
              depends on matching production traffic — speculative decoding's acceptance rate, a cache's hit
              rate, a quantization tier's accuracy delta — needs to be exposed as a first-class, company-wide
              observability signal, not buried inside one team's internal tuning notes. Together AI's own
              tiered pricing model shows why this matters commercially, not just technically: these
              engineering choices become the literal product a customer buys and is billed by, so a silent
              regression in any of them is a silent change to what customers are actually paying for.
            </p>
            <p>
              The most important question this article cannot answer: none of the sources used here report
              what a sustained acceptance-length regression, or a switch from a Reference to a Turbo pricing
              tier, actually does to a real customer-facing product metric — a chatbot's resolution rate, a
              coding assistant's accepted-suggestion rate — as opposed to a throughput or cost number measured
              on a synthetic benchmark. That link, from a serving-engine metric to a genuine product outcome,
              is exactly the gap the next article type in this curriculum, AI Product Sense, exists to close,
              and it remains open here.
            </p>

            <TEQuestion />

            <p style={{ fontSize: 13, fontWeight: 700, color: "#6B5CD6", textTransform: "uppercase", marginTop: 28, marginBottom: -6 }}>
              Final question — pattern transfer to a domain not covered in this article
            </p>
            <TFQuestion
              q={{
                id: "tf-final",
                minLen: 50,
                prompt: "Apply this article's governing principle (that GPU memory, not compute, decides serving capacity) to a company building a real-time AI video-dubbing product that must re-render lip movements for a live broadcast within 200 milliseconds per frame. What would the team choose between batching more video streams together versus investing in raw compute speed, and what new failure mode might appear that has nothing to do with a KV cache, since video-diffusion models do not keep one in the same sense a language model does?"
              }}
              state={mcqState}
              onAnswer={submitMcq}
            />
          </div>

          <div style={{ marginTop: 60, paddingTop: 20, borderTop: "1px solid #eee", fontSize: 13, color: "#777" }}>
            <p><strong>Sources</strong></p>
            <ul style={{ paddingLeft: 18 }}>
              <li>Kwon, W., et al. "vLLM: Easy, Fast, and Cheap LLM Serving with PagedAttention." vLLM Blog, June 20, 2023. <a href="https://vllm.ai/blog/2023-06-20-vllm" target="_blank" rel="noopener">vllm.ai/blog/2023-06-20-vllm</a> — FACT tier, primary source for PagedAttention's launch throughput figures vs. Hugging Face Transformers and TGI.</li>
              <li>Together AI. "Announcing Together Inference Engine 2.0 with new Turbo and Lite endpoints." Together AI Blog, 2024. <a href="https://www.together.ai/blog/together-inference-engine-2" target="_blank" rel="noopener">together.ai/blog/together-inference-engine-2</a> — FACT tier, primary source for Turbo/Reference speedup vs. vLLM 0.5.1 and the Turbo/Reference/Lite quantization-tier naming and technical approach.</li>
              <li>Together AI. "Llama 3.1: Same model, different results. The impact of a percentage point." Together AI Blog, 2024. <a href="https://www.together.ai/blog/llama-31-quality" target="_blank" rel="noopener">together.ai/blog/llama-31-quality</a> — FACT tier, primary source for FP8 quality-preservation deltas by model size.</li>
              <li>Together AI. "Speculative decoding for high-throughput long-context inference." Together AI Blog, 2024. <a href="https://www.together.ai/blog/speculative-decoding-for-high-throughput-long-context-inference" target="_blank" rel="noopener">together.ai/blog/speculative-decoding-for-high-throughput-long-context-inference</a> — FACT tier, primary source for the memory-bound-decoding finding and the MagicDec approach.</li>
              <li>Chen, R., et al. "MagicDec: Breaking the Latency-Throughput Tradeoff for Long Context Generation with Speculative Decoding." arXiv:2408.11049 (ICLR 2025). <a href="https://arxiv.org/abs/2408.11049" target="_blank" rel="noopener">arxiv.org/abs/2408.11049</a> — FACT tier, primary source for per-GPU, per-model speedup figures.</li>
              <li>"[Bug]: Speculative decoding draft acceptance rate decreasing over time." vLLM GitHub Issue #11188, filed December 14, 2024. <a href="https://github.com/vllm-project/vllm/issues/11188" target="_blank" rel="noopener">github.com/vllm-project/vllm/issues/11188</a> — FACT tier, production-reported evidence used in What Broke.</li>
              <li>"[Bug]: Eagle 2/3 acceptance length regression over time." vLLM GitHub Issue #41838. <a href="https://github.com/vllm-project/vllm/issues/41838" target="_blank" rel="noopener">github.com/vllm-project/vllm/issues/41838</a> — FACT tier, primary source for the acceptance-length degradation numbers used in What Broke.</li>
              <li>Raschka, S. "KV Cache / Token (bf16)." LLM Architecture Gallery. <a href="https://sebastianraschka.com/llm-architecture-gallery/kv-cache-calculations/" target="_blank" rel="noopener">sebastianraschka.com/llm-architecture-gallery/kv-cache-calculations</a> — FACT tier, source for the KV cache size formula and the roughly-40-GiB / 128K-token-request anchor figure.</li>
              <li>Together AI. "Llama 3.1 8B API: Pricing, Benchmarks & Docs" and "Llama 3.1 70B API: Pricing, Benchmarks & Docs." Together AI, 2026. <a href="https://www.together.ai/models/llama-3-1" target="_blank" rel="noopener">together.ai/models/llama-3-1</a> and <a href="https://www.together.ai/models/llama-3-1-70b" target="_blank" rel="noopener">together.ai/models/llama-3-1-70b</a> — FACT tier, primary source for per-token pricing by model size and tier.</li>

            <p style={{ marginTop: 14, fontSize: 12.5, fontStyle: "italic" }}>
              Research note: this article's web-fetch tool was unavailable during generation; every source
              above was verified through search-tool results that quoted and cited the original page
