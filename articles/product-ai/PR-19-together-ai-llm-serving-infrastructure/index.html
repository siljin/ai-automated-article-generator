  );
}

function WarmupInput({ id, onSubmit }) {
  const [text, setText] = useState("");
  const minLen = 25;
  return (
    <>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder={"Write your answer (min " + minLen + " characters)..."}
        style={{ width: "100%", minHeight: 60, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
      />
      <button
        disabled={text.length < minLen}
        onClick={() => onSubmit(id, text)}
        style={{
          marginTop: 6, padding: "6px 14px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
          background: text.length < minLen ? "#E5E5E5" : "#111", color: text.length < minLen ? "#999" : "#fff",
          cursor: text.length < minLen ? "not-allowed" : "pointer"
        }}
      >Submit</button>
      {text.length < minLen && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>{text.length}/{minLen} characters minimum.</div>}
    </>
  );
}

function TEQuestion() {
  const [present, setPresent] = useState({ thesis: "", assumption: "", disconfirm: "", premortem: "" });
  const [future, setFuture] = useState({ change: "", replaces: "" });
  const [submitted, setSubmitted] = useState(false);

  const presentFields = [
    ["thesis", "One-sentence so-what thesis"],
    ["assumption", "Load-bearing assumption"],
    ["disconfirm", "Strongest disconfirming evidence from this article"],
    ["premortem", "One-line pre-mortem: \"If this fails in 12 months, the most likely reason is ___\""]
  ];
  const allFilled = presentFields.every(([k]) => present[k].length >= 15) && future.change.length >= 15 && future.replaces.length >= 15;
  const weakest = presentFields.concat([["change", "2027: what changes"], ["replaces", "2027: assumption replaced"]])
    .map(([k, label]) => ({ key: k, label, val: (present[k] !== undefined ? present[k] : future[k]) || "" }))
    .sort((a, b) => a.val.length - b.val.length)[0];

  return (
    <div style={{ border: "1px solid #E4E4E4", borderRadius: 10, padding: 18, margin: "20px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", marginBottom: 8 }}>
        T-E — Forward-looking implication (Apply It)
      </div>
      <p style={{ fontWeight: 700, marginTop: 0 }}>Present-day variant</p>
      <p style={{ fontSize: 13.5, color: "#555", marginTop: -6 }}>Apply the governing principle to a company or product you know.</p>
      {presentFields.map(([key, label]) => (
        <div key={key} style={{ marginBottom: 8 }}>
          <label style={{ fontSize: 13, fontWeight: 600 }}>{label}</label>
          <input
            disabled={submitted}
            value={present[key]}
            onChange={(e) => setPresent({ ...present, [key]: e.target.value })}
            style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }}
          />
        </div>
      ))}
      <p style={{ fontWeight: 700, marginTop: 16 }}>2027 forward-looking variant</p>
      <p style={{ fontSize: 13.5, color: "#555", marginTop: -6 }}>
        Given the same business constraints and user problem, but assuming foundation-model capabilities have improved (longer context, cheaper inference, better reasoning), what would you design or decide differently?
      </p>
      <div style={{ marginBottom: 8 }}>
        <label style={{ fontSize: 13, fontWeight: 600 }}>What you would build/decide differently in 2027</label>
        <input disabled={submitted} value={future.change} onChange={(e) => setFuture({ ...future, change: e.target.value })}
          style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }} />
      </div>
      <div style={{ marginBottom: 8 }}>
        <label style={{ fontSize: 13, fontWeight: 600 }}>The load-bearing assumption the 2027 version replaces — and what evidence would most change this article's governing principle (falsification)</label>
        <input disabled={submitted} value={future.replaces} onChange={(e) => setFuture({ ...future, replaces: e.target.value })}
          style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #D8D8D8", fontSize: 13.5, marginTop: 3 }} />
      </div>
      {!submitted && (
        <button
          disabled={!allFilled}
          onClick={() => setSubmitted(true)}
          style={{
            marginTop: 6, padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600,
            background: !allFilled ? "#E5E5E5" : "#111", color: !allFilled ? "#999" : "#fff",
            cursor: !allFilled ? "not-allowed" : "pointer"
          }}
        >Submit Apply It</button>
      )}
      {!allFilled && !submitted && <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>Fill in all six fields (15+ characters each) to enable Submit.</div>}
      {submitted && (
        <div style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 12, marginTop: 10 }}>
          <p style={{ margin: 0, fontSize: 13.5 }}>
            <strong>Evaluator note:</strong> all six parts are present. The part reading as thinnest by length is
            "<em>{weakest.label}</em>" — worth revisiting with a more specific, decision-relevant detail if you want to
            stress-test your own answer further. This evaluator checks for presence and relative depth of each labeled
            part, not for keyword matches.
          </p>
        </div>
      )}
    </div>
  );
}

function LearningSummaryBody({ mcqState, warmupSkipped, principleState, insightSlot, setInsightSlot, applyIt, setApplyIt }) {
  const scored = Object.keys(mcqState).filter(
    (k) => mcqState[k] && mcqState[k].submitted && typeof mcqState[k].correct === "boolean"
  );
  const correct = scored.filter((k) => mcqState[k].correct);
  const missed = scored.filter((k) => !mcqState[k].correct);

  const principleMap = {
    rq1: "Continuous batching and paged KV cache allocation treat GPU memory, not compute, as the resource being scheduled.",
    rq2: "Speculative decoding hides a memory-bound wait behind speculative compute, which is why it also helps at large batch and long context, not just single-user latency.",
    rq3: "A per-token price is a quantization-tier choice bundled with a model-size cost, not a single number set by parameter count alone.",
    broke: "A serving optimization whose benefit depends on live agreement between two models is a bet that needs its own continuous monitoring, not a one-time setting."
  };
  const missedPrinciples = missed.map((k) => {
    if (k.includes("rq1")) return principleMap.rq1;
    if (k.includes("rq2")) return principleMap.rq2;
    if (k.includes("rq3")) return principleMap.rq3;
    if (k.includes("broke")) return principleMap.broke;
    return "General principle of the article.";
  });
  const uniqueMissedPrinciples = [...new Set(missedPrinciples)];

  return (
    <div>
      <div style={{ background: "#F7F7F7", borderRadius: 10, padding: 16, marginBottom: 20 }}>
        <p style={{ fontWeight: 700, marginTop: 0 }}>Score breakdown</p>
        <p style={{ fontSize: 14 }}>{correct.length} correct out of {scored.length} scored questions.</p>
        <p style={{ fontSize: 13.5, color: "#555" }}>
          {warmupSkipped
            ? "Warm-up skipped — 3 prior principles not reviewed this session."
            : "Warm-up completed before this session."}
        </p>
      </div>

      <div style={{ marginBottom: 20 }}>
        <p style={{ fontWeight: 700 }}>Principle production review</p>
        {["rq1", "rq2", "rq3"].map((id) => (
          <div key={id} style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10, marginBottom: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#555" }}>YOUR PRINCIPLE ({id.toUpperCase()})</div>
            <p style={{ margin: "4px 0 0 0", fontSize: 13.5 }}>{principleState[id] && principleState[id].submitted ? principleState[id].text : "Not yet submitted."}</p>
          </div>
        ))}
        <p style={{ fontSize: 13.5, color: "#555" }}>Which of your stated principles surprised you most when compared to the authored version? Why? (Reflect in your own notes — this is not re-scored here.)</p>
      </div>

      <div style={{ marginBottom: 20 }}>
        <p style={{ fontWeight: 700 }}>Three insight slots</p>
        <p style={{ fontSize: 13.5, color: "#555" }}>You have seen evidence from Together AI, vLLM, and two peer inference platforms. Write the single most non-obvious insight you would defend to a skeptical CTO.</p>
        {!insightSlot.submitted && (
          <>
            <textarea
              value={insightSlot.text}
              onChange={(e) => setInsightSlot({ ...insightSlot, text: e.target.value })}
              style={{ width: "100%", minHeight: 60, borderRadius: 8, border: "1px solid #D8D8D8", padding: 10, fontSize: 14, fontFamily: "inherit" }}
              placeholder="Minimum 20 characters..."
            />
            <button
              disabled={insightSlot.text.length < 20}
              onClick={() => setInsightSlot({ ...insightSlot, submitted: true })}
              style={{
                marginTop: 6, padding: "7px 14px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
                background: insightSlot.text.length < 20 ? "#E5E5E5" : "#111", color: insightSlot.text.length < 20 ? "#999" : "#fff",
                cursor: insightSlot.text.length < 20 ? "not-allowed" : "pointer"
              }}
            >Reveal authored insights</button>
          </>
        )}
        {insightSlot.submitted && (
          <>
            <div style={{ background: "#fff", border: "1px solid #E4E4E4", borderRadius: 8, padding: 10, marginBottom: 8 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#555" }}>YOUR INSIGHT</div>
              <p style={{ margin: "4px 0 0 0", fontSize: 13.5 }}>{insightSlot.text}</p>
            </div>
            <p style={{ fontSize: 13, fontWeight: 700 }}>How your insight compares — three authored insight cards:</p>
            {[
              "The two Together AI numbers that matter most for a PM aren't 'how much faster' but 'faster at what cost to accuracy' — a +0.1 to -0.3 percentage point accuracy shift across FP8 tiers is a real, measured tradeoff, not a marketing footnote, and it is a different tradeoff at every model size.",
              "Every 'we enabled a serving optimization' decision is really a bet that production traffic will keep resembling whatever traffic the optimization was validated on — the vLLM acceptance-length regression shows that bet can quietly go bad with no crash, no error, and no code change, purely because the traffic distribution shifted.",
              "A provider's per-token price is not one number derived from parameter count; it is parameter count times a quantization-tier choice, which is why Together's own price curve does not scale in direct proportion to model size — the tier is a second, independent lever a buyer can pull that a naive 'bigger model costs proportionally more' assumption misses."
            ].map((t, i) => (
              <div key={i} style={{ background: "#F2F0FB", border: "1px solid #DAD4F5", borderRadius: 8, padding: 10, marginBottom: 6 }}>
                <p style={{ margin: 0, fontSize: 13.5 }}>{t}</p>
              </div>
            ))}
          </>
        )}
      </div>

      <div style={{ marginBottom: 8 }}>
        <p style={{ fontWeight: 700 }}>Principles to revisit</p>
        {uniqueMissedPrinciples.length === 0 && <p style={{ fontSize: 13.5, color: "#555" }}>No missed questions yet, or none answered — this list fills in as you answer scored questions above.</p>}
        {uniqueMissedPrinciples.map((p, i) => (
          <p key={i} style={{ fontSize: 13.5, background: "#FDEDED", padding: 8, borderRadius: 6 }}>{p}</p>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
