function ArchitectureSection() {
  return (
    <section id="architecture" style={{ marginBottom: 48 }}>
      <h2>1. The Architecture: What Actually Runs Behind an Answer</h2>
      <p>
        <strong>Claim to defend: </strong>What runs behind a Perplexity answer is not one model call — it is a multi-stage retrieval and ranking pipeline, and that pipeline, not the language model, is what most determines answer quality.
      </p>
      <p>
        The obstacle this pipeline has to solve is a tension between completeness and freshness under a hard latency budget: a fixed crawling budget means every hour spent re-checking an old page is an hour not spent discovering a new one, yet an AI answer engine cannot afford either a stale index or a slow one (Perplexity Research, Sept 2025). Perplexity's crawling and indexing fleet runs "tens of thousands of CPUs and hundreds of terabytes of RAM," performing "tens of thousands of indexing operations per second," and uses a trained model to decide which of its 200-billion-plus tracked URLs are worth re-indexing and when (Perplexity Research, Sept 2025).
      </p>
      <p>
        The retrieval pipeline itself runs in three stages. First, a query is sent to both a lexical index (keyword-based ranking, in the tradition of BM25) and a dense, vector-based index (meaning-based matching) at the same time, and the two result sets are merged into one hybrid candidate set — deliberately prioritizing comprehensiveness over precision at this stage, because "subsequent stages of the pipeline will optimize for precision" (Perplexity Research, Sept 2025). Second, cheap heuristic prefiltering removes clearly stale or non-responsive candidates. Third, the surviving candidates go through "multiple stages of progressively advanced ranking": fast lexical and embedding-based scorers narrow the set first, and only the smaller, harder-to-rank remainder reaches "more powerful cross-encoder reranker models" for final ranking (Perplexity Research, Sept 2025).
      </p>
      <p>
        Rather than stitching together a separate vector database, a separate lexical search engine, and a separate reranking service, Perplexity built this pipeline on Vespa, a single engine that performs retrieval, ranking, real-time indexing, and machine-learning inference together (Vespa case study, 2025–2026). Both Perplexity's consumer answer engine and its externally sold Search API run on this exact same retrieval layer — "one retrieval layer, two front doors," in Vespa's phrasing (Vespa case study, 2025–2026) — which is why the Section 2 latency and quality benchmarks describe the same infrastructure a user experiences inside the Perplexity app.
      </p>
      <p>
        This is worth reading with one caveat. Both of the sources behind this section have a stake in the story: Perplexity is describing its own engineering choices in its own words, and Vespa is a vendor publishing a customer's success story. No independent, third-party audit of Perplexity's internal latency or architecture was found. The specific numbers in Section 2 are Perplexity's own self-reported benchmark against three named competitors, not results verified by a neutral outside party — a normal limitation for a company blog post, but one a reader should keep in view before treating "sets a new state of the art" as an independently confirmed fact rather than a self-reported one.
      </p>
      <p>
        A second, less obvious capability sits alongside this pipeline: a self-improving content-understanding system that uses frontier language models to keep rewriting the rules Perplexity uses to parse messy web pages into clean, structured passages (Perplexity Research, Sept 2025). This is a different capability class from the retrieval-and-ranking pipeline itself — it is AI used to maintain the AI infrastructure's own data quality over time, continuously re-grading and revising parsing rules as websites change, rather than a fixed extraction script written once and left alone. A reader building any large-scale web-facing AI system should recognize this as a separate investment decision from retrieval architecture, even though the two compound on each other.
      </p>
      <ChartBlock
        title="Architecture pipeline: from query to cited answer"
        tier="ILLUSTRATION"
        sourceNote="Illustrative structural diagram, simplified from Perplexity's own architecture description (Perplexity Research, Sept 2025) for teaching purposes — not a verbatim internal engineering diagram, and stage boundaries are simplified."
        chart={<ArchitectureDiagram />}
        q1={{
          id: "chart3-q1",
          kind: "So-what / decision implication",
          prompt:
            "If you had to protect only ONE stage of this five-stage pipeline from a strict new latency budget before it blew the whole 358ms median, which stage would you protect first — and how would you segment queries (say, simple factual vs. multi-hop) to route only some of them through the full cost of that stage?",
          authored:
            "Protect the cross-encoder reranking stage — it is described as the slowest, most computationally expensive step, deliberately held until last so it only ever runs on an already-narrowed set. Segment queries by predicted difficulty (a cheap upstream classifier flags likely-simple factual lookups) and skip or shrink reranking for those, reserving the full expensive path for queries where the earlier, cheaper stages leave a lower-confidence candidate set — the same rationing idea the pipeline already applies to candidates, just applied one level up to whole queries.",
        }}
        q2={{
          id: "chart3-q2",
          kind: "Qualitative / mechanism",
          prompt:
            "Stage one is deliberately tuned for comprehensiveness, not precision, even though precision would seem like the more useful goal to chase first. Why would optimizing the very first retrieval step for precision actually hurt the pipeline's final answer quality, rather than help it?",
          authored:
            "If stage one filters too aggressively for precision, it can permanently discard a correct-but-unusually-worded passage before any ranking model ever gets a chance to see it — a keyword match might miss a valid semantic match, or vice versa, and a passage dropped at stage one can never be recovered downstream. Because every later stage can only re-rank what stage one hands it, an overly precise first pass silently caps the ceiling of the entire pipeline; comprehensiveness first preserves options that a precision-first design would destroy irreversibly.",
        }}
      />
      <MCQ
        id="mcq-arch"
        prompt="Perplexity's retrieval pipeline runs hybrid retrieval, then prefiltering, then multi-stage ranking that ends in a cross-encoder reranker. As query volume grows 10x, which stage is most likely to become the bottleneck first, and why?"
        options={[
          "The cross-encoder reranker stage, because it is the most computationally expensive step per candidate and is deliberately applied last to a still-large narrowed set, so its cost does not shrink as fast as traffic grows tenfold.",
          "The initial hybrid retrieval stage, because searching a 200-billion-URL index must be the slowest step in any pipeline, the same way a full-table database scan is always the slowest query a system can run.",
          "The citation-rendering interface shown to users, because displaying more numbered footnotes as answer volume grows will overload the frontend rendering layer before any backend system feels the strain.",
          "The crawling and indexing fleet, because keeping a 200-billion-URL index fresh at 10x the query volume requires 10x more crawling capacity, and crawling is described as the least horizontally scalable part of the system.",
        ]}
        correctIndex={0}
        explanations={{
          correct:
            "The cross-encoder reranker is explicitly the most expensive per-candidate computation in the pipeline, and it is applied last on purpose — but 'last' does not mean 'small.' As traffic grows, the absolute number of queries reaching that final, expensive stage grows too, and unlike the earlier lexical/embedding scorers (built to be fast at scale), cross-encoders trade speed for accuracy on purpose. That tradeoff is exactly what tends to buckle first under 10x growth.",
          reasoningError: [
            null,
            "applying a classical software assumption to an AI-native system: assuming the biggest index must be the slowest query, when the architecture explicitly rations cheap operations to the largest candidate sets and expensive ones to the smallest.",
            "a single-cause / surface-level misdiagnosis: this confuses a frontend rendering concern with the backend scaling bottleneck the question is actually asking about.",
            "misreading the source evidence: the article explicitly describes the crawling fleet as built to 'scale horizontally with both size and query volume' and having 'considerable headroom for further scaling' — the opposite of what this option claims.",
          ],
          scaffold:
            "Re-read which stage the source explicitly calls 'more powerful' and note that 'applied last' in a pipeline does not mean 'cheap' or 'small' — think about which stage's cost per query is hardest to shrink as volume grows.",
        }}
        whereGeneralizes="any staged AI pipeline where cost is deliberately backloaded onto a smaller, harder set of candidates — the expensive final stage, not the wide first stage, is usually the one to watch as volume scales."
      />
      <PatternTransfer
        id="pt-arch"
        prompt="The principle from this section is: what runs behind an AI answer is a multi-stage retrieval-and-ranking pipeline, and that pipeline — not the model — decides most of what users perceive as quality. Apply this to a different AI product you have not seen discussed in this article, such as an AI email-drafting assistant that searches a company's internal documents before writing a reply. What would a PM or CTO build or decide differently because of this principle, and what new failure mode would they face that is different from anything in this section?"
      />
      <PrincipleGate authored="Judge and invest in an AI answer product by its retrieval-and-ranking pipeline first — the stage boundaries, what gets rationed to the cheap early stages versus the expensive late ones — because that architecture, not the model wrapped around it, decides most of what users will call 'quality.'" />
      <Glossary
        terms={[
          { term: "Cross-encoder reranker", def: "A slower, more accurate model that re-scores a short list of already-narrowed candidates by reading the query and each candidate together, rather than scoring them independently." },
          { term: "Vespa", def: "A single search-and-AI-serving engine that Perplexity uses to do retrieval, ranking, real-time updates, and machine-learning scoring together, instead of running four separate systems." },
          { term: "Prefiltering", def: "A fast, cheap first pass that removes obviously irrelevant or outdated candidates before any expensive ranking model runs." },
          { term: "Passage / sub-document indexing", def: "Storing and ranking small sections of a page (a paragraph or a few sentences) as their own searchable unit, instead of only ranking whole pages." },
        ]}
      />
    </section>
  );
}

function ProductSection() {
  return (
    <section id="product" style={{ marginBottom: 48 }}>
      <h2>2. The Product Decisions the Architecture Forced</h2>
      <p>
        <strong>Claim to defend: </strong>Perplexity's most visible product decisions — inline numbered citations, passage-level results, and a public Search API business — are downstream of the retrieval architecture in Section 1, not independent UX choices made in isolation.
      </p>
      <p>
        Because the retrieval pipeline already scores and ranks content at the passage level for the language model's benefit, the product team could expose that same internal data structure to the human reader "for free," as a numbered citation next to each claim. The September 2025 decision to sell this retrieval layer directly to developers as a Search API was possible for the same reason: Perplexity's consumer answer engine and its Search API are "not separate systems" — both query the identical Vespa-based retrieval layer (Vespa case study, 2025–2026). A monetization decision that looks like a new product line is really a decision to expose infrastructure that already existed.
      </p>
      <p>
        But exposing a citation is not the same as guaranteeing it is correct, and the evidence here is less flattering. In a March 2025 study, the Tow Center for Digital Journalism at Columbia University tested eight AI search engines on 1,600 queries, asking each one to correctly identify a news article's title, publisher, date, and URL from a quoted excerpt (Tow Center/CJR, March 2025). Perplexity had the lowest error rate of the eight — but that rate was still 37%, meaning more than one in three of its citation-identification answers were wrong (Tow Center/CJR, March 2025). In one specific test, Perplexity's free tier correctly answered all ten questions about paywalled National Geographic articles, even though National Geographic had explicitly disallowed Perplexity's crawler in its robots.txt file — behavior the researchers noted was hard to reconcile with Perplexity's own public claim that it "respects robots.txt directives" (Tow Center/CJR, March 2025).
      </p>
      <p>
        The tension is a design one, not just a bug: a numbered citation reads to a user as "this claim was checked against a real source," but the underlying passage-ranking system was built to make the language model more useful, not to make a human auditor's trust judgment easy or reliable. A citation is a UI signal borrowed from an architecture optimized for a different audience.
      </p>
      <p>
        Other AI search products handle this same tension with a different philosophy. In the same Tow Center study, Microsoft's Copilot declined to answer 104 of 200 test queries outright, and among the 96 it did answer, 66 were completely wrong — roughly 69% of its answered queries (Tow Center/CJR, March 2025). ChatGPT Search, by contrast, answered all 200 queries and was completely wrong on 57% of them (Tow Center/CJR, March 2025). Where Perplexity and ChatGPT lean toward "always answer, sometimes wrong," Copilot leans toward "decline often, but still get most attempted answers wrong" — a genuinely different product philosophy this article's central case does not fully explore, and one worth knowing exists as a design alternative.
      </p>
      <ChartBlock
        title="Citation-identification error rate, four AI search engines (200 test queries each)"
        tier="FACT"
        sourceNote="Tow Center for Digital Journalism / Columbia Journalism Review, 'AI Search Has a Citation Problem,' March 6, 2025. Copilot's figure is the error rate among the 96 of 200 queries it chose to answer (it declined the other 104); the other three figures are of all 200 queries."
        chart={<SimpleBarChart data={CITATION_DATA} series={[{ key: "errorRate", label: "Error rate (%)", color: "#dc2626" }]} yLabel="% incorrect" valueFormatter={(v) => `${v}%`} />}
        q1={{
          id: "chart4-q1",
          kind: "So-what / decision implication",
          prompt:
            "Perplexity's 37% error rate was the best of eight tested engines, yet more than one in three citation answers were still wrong. If you were the PM who owns this feature and needed a pre-mortem kill-criterion, what future error rate — and over what population of queries — would make you pull the citation feature rather than keep marketing it as 'industry-best'?",
          authored:
            "A defensible kill-criterion ties the threshold to the stakes of the query population, not one flat global number — for example, pulling inline citations specifically for paywalled or licensed publisher content if the error rate there exceeds the 37% all-query baseline, since the National Geographic case shows a subgroup where Perplexity answered confidently despite being blocked entirely. Being 'best of a bad field' is not the same as 'good enough,' and the bar should be set against user and publisher harm, not against how competitors score.",
        }}
        q2={{
          id: "chart4-q2",
          kind: "Quantitative reasoning",
          prompt:
            "Perplexity's error rate (37%) is about 2.5x smaller than Grok-3's (94%) but still several multiples larger than what a genuinely trustworthy citation tool would need — arguably in the single digits, the way a checked footnote in a published paper would be. What does the size of that remaining gap suggest about whether this is a simple tuning problem or something more structural?",
          authored:
            "The size of the gap is the tell: all eight independently built systems in the same study failed more than 60% of queries combined, and even the best one is several multiples away from a single-digit error rate. That pattern — many different engineering teams landing in a similar bad neighborhood — looks like a structural limit of the retrieval-then-generate approach (the model can still misattribute or paraphrase past a correctly retrieved passage) rather than one company's fixable bug. A PM should treat 'cites its sources accurately' as a probabilistic claim to keep measuring, not a solved feature to stop testing.",
        }}
      />
      <ConsultingCase
        id="case-medibrief"
        prompt="MediBrief, a fictional startup, is building an AI answer engine for clinicians researching drug-interaction literature. Before launch, the team wants to advertise: 'Every answer is sourced from a peer-reviewed citation.' Given what this section showed about Perplexity's citation-grounding gap, which assumption must hold for that claim to build trust rather than create legal exposure — and which piece of evidence here is thinnest in supporting it?"
        options={[
          "The assumption that clinicians will always double-check a citation before acting on it, which is well supported because medical professionals are trained to verify sources before making treatment decisions.",
          "The assumption that displaying a passage-level citation next to an answer means that citation is actually correct — and this is the thinnest-supported assumption, since even the best-scoring tested engine was wrong on 37% of citation-identification tests.",
          "The assumption that MediBrief's retrieval system will be technically similar to Perplexity's, which only matters if MediBrief actually chooses to build on that same kind of underlying search infrastructure.",
          "The assumption that clinicians will prefer an AI answer engine over a traditional medical literature database, which depends mainly on how much faster the AI tool feels during daily practice.",
        ]}
        correctIndex={1}
        explanations={{
          correct:
            "The claim 'every answer is sourced' quietly assumes that showing a citation and that citation being correct are the same thing. Section 2's evidence shows they are not: the best-tested AI search engine was still wrong more than a third of the time, and a separate case showed confident answers about content the crawler was not even permitted to access. For a clinical use case, that gap is the load-bearing risk, not a footnote.",
          reasoningError: [
            "this option describes a real behavior but is not the load-bearing assumption behind MediBrief's specific marketing claim, and it is not the assumption the article's evidence is thinnest on — clinician diligence is a mitigation, not what the claim itself asserts.",
            null,
            "this restates a fact about MediBrief's future engineering choice rather than identifying the assumption the trust claim itself depends on.",
            "this is a business-adoption question, not a legal-exposure or trust-claim question, and the article's evidence does not speak to it either way.",
          ],
          scaffold:
            "Ask yourself: what would have to be true for 'every answer is sourced from a peer-reviewed citation' to actually mean 'every answer is correct'? Then check which piece of Section 2's evidence most directly challenges that gap.",
        }}
        whereGeneralizes="any product that turns an internal retrieval or ranking signal into a user-facing trust claim — the claim is only as strong as evidence that the signal and the underlying correctness are the same thing, which usually has to be measured separately."
      />
      <TrueFalseQ
        id="tg-citation"
        prompt="True or False: Because Perplexity's retrieval pipeline already scores passages at the sub-document level for the language model's benefit, exposing those same passages as user-facing citations was a low-cost product decision — and citation accuracy is therefore guaranteed by the retrieval architecture."
        correctAnswer={false}
        authoredJustification="The first half is true and well-supported (reusing an existing data structure as a UI feature is a genuinely low-cost decision). The second half over-generalizes a necessary condition (passage-level scoring exists) into a sufficient one (citations are therefore guaranteed accurate) — the 37% citation error rate and the National Geographic case both directly contradict 'guaranteed.'"
        reasoningErrorIfWrong="applying a classical software assumption to AI: treating the existence of a data structure (passage-level scoring) as equivalent to a correctness guarantee for how that structure behaves in front of a user — necessary infrastructure is not the same as a sufficient trust guarantee."
      />
      <PatternTransfer
        id="pt-product"
        prompt="The principle from this section is: a product's most visible trust signals (like inline citations) are often a reused byproduct of internal architecture built for a different audience (the model), not an independently verified guarantee. Apply this to a different product — for example, an AI coding assistant that shows a 'tested' badge next to generated code because it ran the code once in a sandbox. What would a PM or CTO build or decide differently because of this principle, and what new failure mode would they face that is different from Perplexity's citation problem?"
      />
      <PrincipleGate authored="A user-facing trust signal that started as an internal architecture byproduct (a citation, a 'tested' badge, a confidence score) needs its own independent accuracy measurement — the fact that the underlying system produces the signal at all does not mean the signal is reliable enough to carry the trust claim built on top of it." />
      <Glossary
        terms={[
          { term: "Inline citation", def: "A numbered reference shown next to a specific claim in an AI answer, linking to the source it supposedly came from." },
          { term: "Search API", def: "A version of a company's internal search infrastructure sold to outside developers so they can build their own products on top of it." },
        ]}
      />
    </section>
  );
}

function CostSection() {
  return (
    <section id="cost" style={{ marginBottom: 48 }}>
      <h2>3. Cost and Latency: Rationing Expensive Work, Not Buying a Cheaper Model</h2>
      <p>
        <strong>Claim to defend: </strong>Perplexity controls the economics of a generated answer by making expensive computation progressively more selective — applying it only to the candidates and queries that need it — not by simply choosing a cheaper model.
      </p>
      <p>
        The multi-stage ranking design from Section 1 already does this for compute: cheap lexical and embedding scorers run first on the full candidate set, and the genuinely expensive cross-encoder reranker only ever touches the smaller, already-narrowed remainder (Perplexity Research, Sept 2025). That is why Perplexity can report a 358ms median latency at all — the expensive step is rationed, not applied uniformly to every candidate.
      </p>
      <p>
        Perplexity's own Sonar API pricing shows the identical rationing logic applied to money instead of milliseconds. A single Sonar query with a short prompt and answer costs $0.0057 in total at the cheapest "low" search-context setting, versus $0.0127 at the most thorough "high" setting — more than double, purely from choosing how much retrieval depth to buy (Perplexity API Pricing docs). At the far end, a single Sonar Deep Research query — which runs multiple search steps and heavier reasoning — costs between $0.41 and $1.32 depending on that same context-size choice (Perplexity API Pricing docs). A separate "request fee," billed per 1,000 requests and independent of token count, exists specifically to charge for retrieval depth as its own line item — an explicit acknowledgment that retrieval, not generation, is where a meaningful share of both the cost and the value sits.
      </p>
      <p>
        As with Section 1, these are self-reported list prices from Perplexity's own documentation, not independently audited unit economics, and large customers likely negotiate below list price — a normal limitation of pricing-page evidence that should soften any claim about Perplexity's actual margins.
      </p>
      <p>
        This "ration the expensive step, don't just swap the model" lever is not the only way an AI product controls unit economics — it is one specific lever among several. A different, commonly used lever elsewhere in the industry is to swap in a smaller, cheaper, distilled model for routine requests and reserve a larger model only for hard cases — a model-side choice, rather than a retrieval-side one. Perplexity's approach shows that the same economic goal (spend compute only where it earns its keep) can be achieved by re-architecting when work happens in a pipeline, not only by changing which model does the work — a distinct lever worth having in a PM's toolkit alongside model selection.
      </p>
      <ChartBlock
        title="Cost per query across Sonar tiers, by search-context size"
        tier="FACT"
        sourceNote="Perplexity API Pricing documentation (docs.perplexity.ai) — Sonar example assumes 500 input + 200 output tokens; Deep Research figures are Perplexity's own worked pricing examples."
        chart={<SimpleBarChart data={COST_DATA} series={[{ key: "cost", label: "Cost per query (USD)", color: "#7c3aed" }]} yLabel="USD" valueFormatter={(v) => `$${v}`} />}
        magnitudeAsk="how many times more expensive do you expect the priciest Deep Research tier is versus the cheapest Sonar tier?"
        q1={{
          id: "chart5-q1",
          kind: "So-what / decision implication",
          prompt:
            "A developer expects 2 million Sonar queries a month at the cheapest 'low' context tier ($0.0057/query). Size the monthly retrieval bill, then say which single lever — total query volume or context-tier choice — would change that estimate the most if the team defaulted every query to the 'high' tier ($0.0127/query) instead.",
          authored:
            "2,000,000 × $0.0057 = $11,400/month at low context; at high context, 2,000,000 × $0.0127 = $25,400/month — more than double. Context-tier choice moves this estimate more than query volume alone would for a fixed query count, because the request fee (not the token price) is what jumps sharpest between tiers ($5 to $12 per 1,000 requests). A PM sizing this cost should treat 'which context tier is the default' as the single highest-leverage lever, ahead of arguing over token price.",
        }}
        q2={{
          id: "chart5-q2",
          kind: "Quantitative reasoning",
          prompt:
            "A Sonar Deep Research query costs $0.41 at low context and $1.32 at high context — a 3.2x range for the same type of query. Plain Sonar's low-to-high range is only $0.0057 to $0.0127, about 2.2x. What does the wider multiple for Deep Research reveal about where its cost actually accumulates?",
          authored:
            "Deep Research's much wider range comes from reasoning and citation tokens compounding with search-query count as context size grows, not from a flat per-request search fee the way plain Sonar's smaller spread does. In the worked pricing example, the reasoning-token cost alone rises from about $0.22 at low context to roughly $1.02 at high context. Sonar's cost is mostly a fixed retrieval-request fee; Deep Research's cost is mostly a variable, compounding 'thinking harder' cost — the two products need different cost models when a PM is forecasting spend.",
        }}
      />
      <FermiQ
        id="fermi1"
        prompt="Perplexity's own engineering post cites a leading commercial search API charging $200 per 1,000 queries in 2022–2023. If Perplexity had kept paying that legacy price while scaling to its own reported 200 million queries a day, estimate the ANNUAL retrieval bill that pricing would have implied (in US dollars)."
        tolerance={0.1}
        unit="USD/year"
        correctValue={14600000000}
        openEnded={false}
        decomposition="200,000,000 queries/day × 365 days/year = 73,000,000,000 queries/year. 73,000,000,000 × ($200 ÷ 1,000 = $0.20/query) = $14,600,000,000/year."
        bounds="Lower bound if volume were flat at 100M/day: ~$7.3B/year. Upper bound if legacy pricing had a volume discount, easily still several billion dollars/year — the point is the order of magnitude, not the exact figure."
        mostSensitive="The query-volume figure (200M/day) is doing the most work here — this is a counterfactual ESTIMATE built from two cited FACTs (query volume and legacy price), not a bill Perplexity actually paid, since it built its own system before reaching this scale."
      />
      <FermiQ
        id="fermi2"
        prompt="A developer's AI agent calls Perplexity's Sonar (not Pro) API for 50,000 queries a month, each averaging 500 input tokens and 200 output tokens, all at the 'medium' search-context size ($8 per 1,000 requests). Name your decomposition path, then estimate the monthly bill in US dollars."
        tolerance={0.1}
        unit="USD/month"
        correctValue={435}
        openEnded={true}
        decomposition="Token cost per query: (500 × $1/1,000,000) + (200 × $1/1,000,000) = $0.0007. Request fee per query: $8 ÷ 1,000 = $0.008. Total per query: $0.0087 (this matches Perplexity's own worked 'medium context' example exactly). 50,000 × $0.0087 = $435/month."
        bounds="At 'low' context ($5/1,000 request fee): 50,000 × $0.0057 = $285/month. At 'high' context ($12/1,000): 50,000 × $0.0127 = $635/month."
        mostSensitive="The request-fee tier (low/medium/high) matters far more than the token counts at this query volume, since the request fee is 8–17x larger than the token cost per query in this example."
      />
      <MCQ
        id="th-cost"
        subFormLabel="Weaken"
        prompt="The claim in this section is: 'Perplexity controls costs by rationing expensive computation to only the candidates that survive earlier, cheaper stages, not by picking a cheaper model.' Which new piece of evidence, if true, would most weaken this claim?"
        options={[
          "Perplexity's own architecture post describes multiple stages of progressively advanced ranking, with lexical and embedding scorers running before cross-encoder rerankers are applied to the narrowed candidate set.",
          "Perplexity's Search API documentation also lists a separate embeddings product with its own per-token pricing for developers who want to build fully custom retrieval pipelines from scratch.",
          "Independent benchmarking shows the cross-encoder reranker stage runs on fixed commodity hardware regardless of how many candidates survive prefiltering, so its cost per query stays roughly constant rather than shrinking.",
          "The Sonar Deep Research pricing example shows total cost rising from $0.41 at low context to $1.32 at high context as more search depth gets purchased.",
        ]}
        correctIndex={2}
        explanations={{
          correct:
            "If the expensive reranking stage's cost were actually fixed per query regardless of candidate-set size, then 'rationing to a smaller set' would not be saving any real money — the claimed cost-control mechanism would not actually be doing the work credited to it. That is genuinely new information that would weaken the claim, not something already stated in the article.",
          reasoningError: [
            "this restates evidence already presented in the article rather than introducing anything new — it does not test the claim, it repeats the basis for it.",
            "this is true but irrelevant to whether the reranking-rationing mechanism controls cost; a separate embeddings product's pricing does not bear on this specific causal claim.",
            null,
            "this is consistent with, not contrary to, the claim — of course cost rises with more context purchased; that does not test whether rationing is the actual mechanism behind cost control.",
          ],
          scaffold:
            "Ask: what fact, if discovered, would make you doubt that 'rationing to a smaller set' is really what keeps cost down — as opposed to a fact that just re-describes the mechanism or that talks about something else entirely?",
        }}
        whereGeneralizes="any cost-control claim resting on an architectural mechanism (caching, rationing, tiering) — the claim is only as strong as evidence that the mechanism's cost genuinely scales down the way it's claimed to, not just evidence that the mechanism exists."
      />
      <PatternTransfer
        id="pt-cost"
        prompt="The principle from this section is: control unit economics by rationing expensive computation to only the cases that need it, not only by picking a cheaper model. Apply this to a different domain — for example, an AI-powered fraud-detection system that screens every card transaction in real time. What would a PM or CTO build or decide differently because of this principle, and what new failure mode would they face that did not appear in Perplexity's search-cost example?"
      />
      <PrincipleGate authored="Ration expensive computation to the cases that actually need it — using cheap early filters to decide what reaches the costly final stage — rather than treating 'pick a cheaper model' as the only lever for controlling an AI product's unit economics." />
      <Glossary
        terms={[
          { term: "Token (input / output)", def: "A small chunk of text (roughly a few characters) that a language model reads or writes; most AI API pricing charges separately for tokens sent in (input) and generated back (output)." },
          { term: "Search-context size", def: "How much web information a search API retrieves and includes for a given query — a separate setting from the model's overall context window, and priced separately in Perplexity's API." },
          { term: "Fermi estimate", def: "A rough, back-of-envelope calculation that breaks a hard-to-know number into smaller, easier-to-estimate pieces multiplied together." },
        ]}
      />
    </section>
  );
}

function WhatBrokeSection() {
  return (
    <section id="whatbroke" style={{ marginBottom: 48, background: "#FEF2F2", border: "1px solid #FCA5A5", borderRadius: 14, padding: 26 }}>
      <h2 style={{ marginTop: 0 }}>What Broke: The Crawler That Ignored Its Own Rules</h2>
      <p>
        On August 4, 2025, Cloudflare published findings that Perplexity's declared, publicly documented crawlers — PerplexityBot and Perplexity-User — were being correctly blocked by customers' robots.txt files and firewall rules, yet Perplexity kept retrieving and answering questions about that blocked content anyway (Cloudflare Blog, Aug 4, 2025). Cloudflare tested this directly: it created brand-new domains that had never been indexed by any search engine, set a robots.txt file disallowing every automated crawler, and asked Perplexity questions about the content on those pages. Perplexity answered in detail (Cloudflare Blog, Aug 4, 2025).
      </p>
      <p>
        The root cause was a second, undeclared crawler that activated whenever the declared one was blocked. It impersonated a Chrome browser running on a Mac, rotated through IP addresses and network providers (ASNs) outside Perplexity's own published IP ranges, and — according to Cloudflare — either ignored robots.txt files or sometimes failed to even fetch them at all (Cloudflare Blog, Aug 4, 2025). Cloudflare measured the declared crawler at roughly 20–25 million requests a day and the undeclared, stealth fallback at roughly 3–6 million requests a day, spread across tens of thousands of domains (Cloudflare Blog, Aug 4, 2025). Perplexity's own architecture post, published a few weeks later, states that "PerplexityBot... complies with explicit limits set forth in robots.txt files" (Perplexity Research, Sept 2025) — a claim that appears to describe only the declared path, saying nothing about what should happen the moment that declared path hits a block. The same completeness-and-freshness pressure that makes the retrieval pipeline good, described in Section 1, seems to have extended into routing around a block instead of stopping at one.
      </p>
      <p>
        The cost was immediate and structural, not just reputational in the abstract. Cloudflare de-listed Perplexity from its Verified Bots program and shipped new detection signatures into its managed rules for its entire customer base — meaning any Cloudflare customer with an existing bot-blocking rule was now blocking Perplexity by default, without taking any new action (Cloudflare Blog, Aug 4, 2025). This landed about a month after Cloudflare's "Content Independence Day" initiative, during which more than 2.5 million websites had already chosen to fully disallow AI crawling through Cloudflare's tools (Cloudflare Blog, Aug 4, 2025) — timing that compounded the reputational cost exactly as publisher trust in AI crawlers was being actively tested industry-wide. Nor was this a first offense: the same Tow Center/CJR study cited in Section 2 had already found, five months earlier, that Perplexity's free tier answered all ten test questions about paywalled National Geographic articles it should not have had access to (Tow Center/CJR, March 2025).
      </p>
      <p>
        The lesson is that a documented crawler and a public compliance policy are not the same as an architectural guarantee. Real control requires a hard, code-level invariant — "never serve an answer sourced from a domain that returned a disallow signal" — enforced the same way a latency budget is enforced, because a policy document cannot constrain what a fallback code path does under pressure. And the pressure here cuts both ways: the same business incentive that rewards a complete, fresh index (Section 1's core strength) rewards routing around a block just as much as it rewards good crawling behavior. The strength and the failure trace back to the same root incentive.
      </p>
      <ChartBlock
        title="Reported daily request volume: declared vs. undeclared crawler"
        tier="FACT"
        sourceNote="Cloudflare Blog, 'Perplexity is using stealth, undeclared crawlers to evade website no-crawl directives,' Aug 4, 2025. Figures are Cloudflare's own reported ranges, observed across tens of thousands of domains."
        chart={<SimpleBarChart data={CRAWLER_DATA} series={[{ key: "low", label: "Low estimate (M/day)", color: "#fca5a5" }, { key: "high", label: "High estimate (M/day)", color: "#b91c1c" }]} yLabel="Requests/day (millions)" valueFormatter={(v) => `${v}M`} />}
        q1={{
          id: "chart6-q1",
          kind: "So-what / decision implication",
          prompt:
            "Using a Now-Next-Later roadmap, and given the stealth crawler ran at roughly 3–6 million requests a day versus 20–25 million for the declared crawler, would you prioritize (a) shutting the fallback down entirely, (b) making the fallback itself respect robots.txt and blocks, or (c) improving detection and monitoring first — and what in the data supports doing that one first?",
          authored:
            "'Now' should be making the fallback path itself respect robots.txt and network blocks (option b) — not detection alone, and not a slower full shutdown project. Even though the stealth crawler's volume (3–6M/day) is smaller than the declared crawler's (20–25M/day), Cloudflare's report shows it specifically activates in the exact cases where a site said no — meaning every one of those requests is a compliance violation by construction, unlike the declared crawler's presumably-compliant volume. Detection alone only measures the harm after the fact; it does not stop it.",
        }}
        q2={{
          id: "chart6-q2",
          kind: "Causal / comparative",
          prompt:
            "Cloudflare ran the identical block-and-test experiment on ChatGPT and reported that it stopped crawling immediately with no follow-up attempts from any other user agent. What does the difference between Perplexity's and ChatGPT's response to the exact same test condition rule out as an explanation for Perplexity's behavior?",
          authored:
            "It rules out 'this is just an unavoidable side effect of how any RAG crawler has to work at scale.' Since a peer company, tested with the identical method under the identical condition (a network block), produced the opposite result, the difference must trace to a specific design or policy choice inside Perplexity's own crawling system — not to some industry-wide technical constraint that any AI search company would inevitably hit. A same-method comparison like this isolates the variable that actually matters: company-specific engineering choices.",
        }}
      />
      <div style={{ margin: "24px 0" }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Crawler fallback pattern</div>
        <CrawlerDiagram />
        <SourceNote>Illustrative flow of the fallback behavior Cloudflare reported, Aug 4, 2025 — simplified for teaching.</SourceNote>
      </div>
      <MCQ
        id="failure-mcq"
        prompt="Given the failure described above, which assumption in the original design was most likely held by the team and considered uncontroversial — and why was it wrong?"
        options={[
          "The team should have anticipated that any AI company would eventually be caught bypassing robots.txt, since criticism of AI crawlers was already widespread well before August 2025, making this a foreseeable risk they simply chose to ignore.",
          "The sole cause of the incident was one engineer implementing an unapproved fallback crawler, so fixing the problem required only deleting that single code path and adding no new organizational safeguard.",
          "The real problem was that Cloudflare's bot-detection heuristics were overly aggressive and misclassified ordinary browser traffic as a stealth crawler, so tuning Cloudflare's detection thresholds mattered more than anything inside Perplexity's own crawling systems.",
          "The team likely assumed that a documented crawler plus a stated robots.txt-compliance policy was itself sufficient proof of good behavior, without any code-level rule that blocks serving answers sourced from a domain that returned a disallow signal.",
        ]}
        correctIndex={3}
        explanations={{
          correct:
            "A published crawler name and a stated policy describe intended behavior for the primary path. They say nothing about what a fallback path does once the primary path hits resistance — and Cloudflare's evidence shows that gap is exactly where the failure lived. The fix has to be an enforced invariant, not a stronger paragraph of policy.",
          reasoningError: [
            "hindsight bias — this assumes the specific failure was obviously foreseeable in exactly this form, when the question asks what assumption the team held as uncontroversial at design time, not what a critic could say after the fact.",
            "single-cause fallacy — attributing a systemic gap (no enforced invariant for fallback behavior) to one individual's unapproved action understates how a policy-without-enforcement gap could recur through any code path, not just one.",
            "scope-creep misdiagnosis — this blames the detector for correctly catching a real pattern rather than addressing the underlying crawling behavior the detector was built to catch.",
            null,
          ],
          scaffold:
            "Focus on what the team's own public statement claims ('complies with robots.txt') versus what it does not claim anything about (what happens when the declared path is blocked) — the gap between those two is the assumption to name.",
        }}
        whereGeneralizes="any system with a documented 'happy path' policy and an undocumented fallback path — a policy statement about the primary path is not evidence about what the fallback does, and that gap needs its own explicit, enforced rule."
      />
      <PrincipleGate authored="A documented policy describes what the primary path is supposed to do; it says nothing about the fallback path's behavior when the primary path is blocked, and that gap has to be closed with an enforced, code-level invariant, not a stronger policy statement." />
      <Glossary
        terms={[
          { term: "robots.txt", def: "A text file website owners publish to tell automated crawlers which pages they are and are not allowed to visit." },
          { term: "ASN (Autonomous System Number)", def: "An ID number for a block of internet addresses controlled by one network provider; switching ASNs is one way traffic can appear to come from a different source." },
          { term: "Verified Bots program", def: "Cloudflare's list of crawlers it recognizes as behaving transparently and by-the-rules, which sites can choose to allow more easily than unverified traffic." },
        ]}
      />
    </section>
  );
}

function ConclusionSection() {
  return (
    <section id="conclusion" style={{ marginBottom: 60 }}>
      <h2>Conclusion</h2>
      <p>
        The governing principle holds up under both the evidence and the failure, with one addition the failure makes visible: retrieval infrastructure is the product surface users actually judge, but a retrieval system this central also concentrates the company's biggest compliance risk in the exact same place. Partial failure of this principle looks like what Perplexity shows here — a genuinely strong retrieval architecture sitting next to a broken failure-mode around how that architecture handles a "no." Good architecture and trustworthy behavior are not the same claim, and a team can win decisively on one while failing the other at the same time.
      </p>
      <p>
        For an AI PM, the implication is concrete: do not treat "we have a documented crawler policy" or "we cite our sources" as evidence that the underlying behavior is actually compliant or accurate. Require observable proof under adversarial conditions — a blocked network, a disallowed robots.txt, a citation-accuracy audit like the Tow Center's — before shipping either claim publicly, because Section 2 and the What Broke section both show real gaps between the stated policy and the measured behavior.
      </p>
      <p>
        For a future CTO, the implication is about where to spend engineering effort. A retrieval-as-product company should budget for enforcement invariants — hard-blocking disallowed domains at the architecture level — with the same seriousness it budgets for a latency SLO, because both failure classes (bad answers, disallowed retrieval) draw from the same infrastructure and are equally reputational when they surface publicly.
      </p>
      <p>
        The most important question this article cannot answer: none of the sources here reveal whether Perplexity's fallback-crawler behavior was a deliberate choice made under completeness pressure, or an unintended side effect nobody had explicitly signed off on. That distinction matters enormously for how much weight to put on the company's next public architecture claim — and it is exactly the kind of internal detail a company's own engineering blog will never volunteer.
      </p>
      <MCQ
        id="te-conclusion"
        prompt="Which new evidence, if observed, would most weaken this article's governing principle that retrieval architecture — not the generation model — is the primary driver of AI answer-engine quality?"
        options={[
          "Multiple independent AI answer engines built on very different retrieval architectures, or with no custom retrieval investment at all, converge to statistically indistinguishable user-rated answer quality once every provider uses a similarly capable generation model.",
          "A company invests heavily in retrieval infrastructure, the way Perplexity did, and its measured answer quality and latency subsequently improve relative to competitors that keep renting third-party search APIs.",
          "A rival company raises a larger funding round than Perplexity's $20 billion valuation but has not yet shipped a comparable consumer search product to actual users.",
          "An AI search engine's citation-accuracy error rate, like the 37 percent figure reported for Perplexity, stays roughly flat when an independent study repeats the same test a year later.",
        ]}
        correctIndex={0}
        explanations={{
          correct:
            "If retrieval architecture stopped explaining quality differences — because every provider converged to similar quality regardless of how much they invested in retrieval, once the generation model was equally strong — that would directly undercut the claim that retrieval, not the model, is the primary driver. This is genuinely new evidence the article does not currently have, and it points the other way.",
          reasoningError: [
            null,
            "this restates the article's own supporting evidence (Perplexity's investment correlating with better outcomes) rather than describing evidence that would weaken the claim.",
            "this is not relevant to the causal claim about retrieval architecture and answer quality; funding size and shipped product maturity are a different question entirely.",
            "this is already-known evidence discussed in the article, not new evidence, and a flat error rate over time does not by itself say anything about whether retrieval or the model architecture is the driver.",
          ],
          scaffold:
            "Ask what observation would make you doubt that architecture — rather than the model — is the thing actually driving the quality differences described throughout this article.",
        }}
        whereGeneralizes="any claim that one specific layer of a system (infrastructure, model, UI) is 'the real driver' of a measured outcome — the claim is falsifiable only if you can name an observation where controlling for that layer makes the outcome differences disappear."
      />
      <div style={{ background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 10, padding: 18, margin: "18px 0" }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Forward-looking: present-day and 2027</div>
        <ConclusionFreeText
          id="te-present"
          label="Present-day"
          prompt="Given the evidence in this article, what is the single most important decision a PM or CTO at a similar AI answer-engine company should make in the next six months?"
        />
        <ConclusionFreeText
          id="te-2027"
          label="2027 variant"
          prompt="Assume inference gets cheaper and models get meaningfully better at multi-hop reasoning by 2027 — closing some of the FRAMES-style gap seen in the Landscape section. What would you design or decide differently, and which load-bearing assumption from today's retrieval-first approach does the 2027 version replace?"
        />
      </div>
      <PatternTransfer
        id="final-tf"
        minLen={50}
        prompt="Final question. The governing principle of this article is: in an AI answer engine, the retrieval system — not the generation model — is the real product, and the same infrastructure that produces its strength can also produce its most damaging failure. Apply this to an AI-powered legal research product (a domain not covered in this article) used by law firms to find relevant case law. What would a PM or CTO build or decide differently because of this principle, and what new failure mode would they face that is genuinely different from Perplexity's publisher-blocking incident?"
      />
    </section>
  );
}

function ConclusionFreeText({ id, label, prompt }) {
  const [text, setText] = useState("");
  const [submitted, setSubmitted] = useState(false);
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 13, color: "#2563eb", marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 14, marginBottom: 8 }}>{prompt}</div>
      {!submitted ? (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={3}
            style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14 }}
            placeholder="Minimum 40 characters..."
          />
          <div style={{ marginTop: 6 }}>
            <button disabled={text.length < 40} onClick={() => setSubmitted(true)} style={btnStyle(text.length < 40)}>
              Submit
            </button>
            <span style={{ marginLeft: 10, fontSize: 12, color: "#9ca3af" }}>{text.length}/40 characters</span>
          </div>
        </>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 6, padding: 10, fontSize: 14 }}>
          <strong>Your answer:</strong> {text}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Apply It — present-day (4 labeled parts) + 2027 variant
--------------------------------------------------------------------------- */
function ApplyItField({ label, placeholder, minLen = 20 }) {
  const [text, setText] = useState("");
  const [submitted, setSubmitted] = useState(false);
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 4 }}>{label}</div>
      {!submitted ? (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={2}
            placeholder={placeholder}
            style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14 }}
          />
          <div style={{ marginTop: 4 }}>
            <button disabled={text.length < minLen} onClick={() => setSubmitted(true)} style={{ ...btnStyle(text.length < minLen), padding: "5px 12px", fontSize: 13 }}>
              Lock in
            </button>
            <span style={{ marginLeft: 8, fontSize: 12, color: "#9ca3af" }}>{text.length}/{minLen} characters</span>
          </div>
        </>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 6, padding: 8, fontSize: 14 }}>{text}</div>
      )}
    </div>
  );
}

function ApplyIt() {
  return (
    <div style={{ background: "#eef2ff", borderRadius: 10, padding: 18, marginBottom: 20 }}>
      <div style={{ fontWeight: 600, marginBottom: 4 }}>Apply It</div>
      <div style={{ fontSize: 14, color: "#4b5563", marginBottom: 14 }}>
        These are encouraged production steps — not scored, and they do not lock the conclusion below.
      </div>
      <div style={{ fontSize: 13, fontWeight: 700, color: "#4338ca", textTransform: "uppercase", marginBottom: 8 }}>
        Present-day: apply the governing principle to a company or product you know
      </div>
      <ApplyItField label="1. One-sentence so-what thesis" placeholder="In one sentence, what should that company or product do differently because of this article's principle?" />
      <ApplyItField label="2. Load-bearing assumption" placeholder="What single assumption has to hold for your thesis to create value?" />
      <ApplyItField label="3. Strongest disconfirming evidence from this article" placeholder="What evidence in this article would most challenge your thesis?" />
      <ApplyItField label="4. One-line pre-mortem" placeholder="If this fails in 12 months, the most likely reason is ___." />
      <div style={{ fontSize: 13, fontWeight: 700, color: "#4338ca", textTransform: "uppercase", marginTop: 18, marginBottom: 8 }}>
        2027 forward-looking variant
      </div>
      <ApplyItField
        label="Given longer context, cheaper inference, and better reasoning by 2027, what would you design or decide differently — and which load-bearing assumption from today's version does the 2027 version replace?"
        placeholder="Write your 2027 variant answer..."
        minLen={30}
      />
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Learning Summary
--------------------------------------------------------------------------- */
function LearningSummary({ answers, warmupSkipped }) {
  const entries = Object.entries(answers);
  const scored = entries.filter(([, v]) => v.correct !== null);
  const correct = scored.filter(([, v]) => v.correct === true).length;
  const byType = {};
  scored.forEach(([, v]) => {
    byType[v.type] = byType[v.type] || { correct: 0, total: 0 };
    byType[v.type].total += 1;
    if (v.correct) byType[v.type].correct += 1;
  });
  const numericErrors = scored.filter(([, v]) => typeof v.signedError === "number");
  const avgSignedError = numericErrors.length
    ? numericErrors.reduce((a, [, v]) => a + v.signedError, 0) / numericErrors.length
    : null;

  const [insight, setInsight] = useState("");
  const [insightSubmitted, setInsightSubmitted] = useState(false);

  return (
    <section id="summary" style={{ marginBottom: 48 }}>
      <h2>Learning Summary</h2>

      <div style={{ background: "#f9fafb", borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Score breakdown by question type</div>
        <div style={{ marginBottom: 8 }}>Overall: {correct}/{scored.length} scored questions correct.</div>
        {Object.entries(byType).map(([type, v]) => (
          <div key={type} style={{ fontSize: 14, marginBottom: 4 }}>
            {type}: {v.correct}/{v.total}
          </div>
        ))}
        {avgSignedError !== null && (
          <div style={{ fontSize: 14, marginTop: 8 }}>
            Numeric (Fermi) average signed error: {(avgSignedError * 100).toFixed(0)}% {avgSignedError > 0 ? "(you tended to over-estimate)" : "(you tended to under-estimate)"}
          </div>
        )}
        <div style={{ fontSize: 14, marginTop: 8, color: warmupSkipped ? "#991b1b" : "#065f46" }}>
          {warmupSkipped ? "Warm-up skipped — 3 prior principles not reviewed this session." : "Warm-up completed this session."}
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 6 }}>Which of your stated principles surprised you most compared to the authored version? Why?</div>
        <ConclusionFreeText id="ls-reflect" label="" prompt="" />
      </div>

      <div style={{ background: "#fff7ed", borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Three insight slots</div>
        <div style={{ fontSize: 14, marginBottom: 8 }}>
          You have seen evidence across three sections and a failure case. Write the single most non-obvious insight you would defend to a skeptical CTO:
        </div>
        {!insightSubmitted ? (
          <>
            <textarea value={insight} onChange={(e) => setInsight(e.target.value)} rows={3} style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14 }} placeholder="Minimum 30 characters..." />
            <div style={{ marginTop: 6 }}>
              <button disabled={insight.length < 30} onClick={() => setInsightSubmitted(true)} style={btnStyle(insight.length < 30)}>
                Submit
              </button>
            </div>
          </>
        ) : (
          <>
            <div style={{ background: "#fff", borderRadius: 6, padding: 10, marginBottom: 10, fontSize: 14 }}>
              <strong>Your insight:</strong> {insight}
            </div>
            <div style={{ fontWeight: 600, marginBottom: 6 }}>How your insight compares — three authored insight cards:</div>
            {[
              "The same architecture that makes a retrieval-first product good (chasing completeness and freshness) is the same incentive that produced its worst public failure — strength and failure share one root cause, not two.",
              "A citation, a badge, or any UI trust signal is often a reused byproduct of infrastructure built for a different audience (the model); it needs its own accuracy measurement, not an inherited one.",
              "Controlling AI unit economics has at least two independent levers — which model you use, and when in the pipeline expensive work happens — and the second lever is easy to overlook.",
            ].map((c, i) => (
              <div key={i} style={{ border: "1px solid #fde68a", borderRadius: 8, padding: 12, marginBottom: 8, fontSize: 14, background: "#fff" }}>
                {c}
              </div>
            ))}
          </>
        )}
      </div>

      <ApplyIt />

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 8 }}>Principles to revisit</div>
        <div style={{ fontSize: 14, color: "#4b5563" }}>
          {scored.filter(([, v]) => v.correct === false).length === 0 ? (
            "No missed scored questions this session — nothing to revisit."
          ) : (
            <ul style={{ paddingLeft: 20, margin: 0 }}>
              {scored
                .filter(([, v]) => v.correct === false)
                .map(([id]) => (
                  <li key={id} style={{ marginBottom: 4 }}>{PRINCIPLE_LABELS[id] || "Review the section this question belonged to."}</li>
                ))}
            </ul>
          )}
        </div>
      </div>
    </section>
  );
}

/* ---------------------------------------------------------------------------
   APP
--------------------------------------------------------------------------- */
function App() {
  const [active, setActive] = useState("warmup");
  const [narrow, setNarrow] = useState(window.innerWidth < 1160);
  const [warmupSkipped, setWarmupSkipped] = useState(false);
  const answersRef = useRef({});
  const answeredRef = useRef({});
  const [answersState, setAnswersState] = useState({});
  const [scoreTick, setScoreTick] = useState(0);

  useEffect(() => {
    function onResize() { setNarrow(window.innerWidth < 1160); }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    function onScroll() {
      let current = SECTIONS[0].id;
      for (const s of SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top < 140) current = s.id;
      }
      setActive(current);
    }
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  function registerAnswer(id, meta) {
    answeredRef.current[id] = true;
    answersRef.current[id] = meta;
    setAnswersState({ ...answersRef.current });
    setScoreTick((t) => t + 1);
  }

  function navigate(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
    setActive(id);
  }

  const scored = Object.values(answersState).filter((v) => v.correct !== null);
  const score = scored.filter((v) => v.correct === true).length;

  const ctxValue = { answered: answeredRef, registerAnswer };

  return (
    <AppCtx.Provider value={ctxValue}>
      <ProgressBar pct={Math.min(100, (SECTIONS.findIndex((s) => s.id === active) / (SECTIONS.length - 1)) * 100)} />
      <ScoreBadge score={score} total={scored.length} />
      <Header />
      <SectionNav active={active} onNav={navigate} narrow={narrow} />
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "40px 20px 100px", marginLeft: narrow ? "auto" : 250 }}>
        <WarmupSection skipped={warmupSkipped} setSkipped={setWarmupSkipped} />
        <IntroSection />
        <LandscapeSection />
        <ArchitectureSection />
        <ProductSection />
        <CostSection />
        <WhatBrokeSection />
        <LearningSummary answers={answersState} warmupSkipped={warmupSkipped} />
        <ConclusionSection />
        <div style={{ textAlign: "center", color: "#9ca3af", fontSize: 13, marginTop: 60 }}>
          Sources are listed in the article text with inline (Source, Year) citations: Perplexity Research blog (Sept 2025), Perplexity API Pricing docs, Vespa case study (2025–2026), Cloudflare Blog (Aug 2025), and the Tow Center for Digital Journalism / Columbia Journalism Review (March 2025).
        </div>
      </div>
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
