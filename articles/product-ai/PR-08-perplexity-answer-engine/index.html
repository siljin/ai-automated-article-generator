const AppCtx = createContext(null);
function useAppCtx() { return useContext(AppCtx); }

/* ---------------------------------------------------------------------------
   SMALL PRESENTATIONAL HELPERS
--------------------------------------------------------------------------- */

function ProvenanceTag({ tier }) {
  const color = tier === "FACT" ? "#065f46" : tier === "ESTIMATE" ? "#92400e" : "#6b7280";
  const bg = tier === "FACT" ? "#d1fae5" : tier === "ESTIMATE" ? "#fef3c7" : "#f3f4f6";
  return (
    <span style={{ fontSize: 11, fontWeight: 700, color, background: bg, padding: "2px 8px", borderRadius: 4, letterSpacing: 0.4 }}>
      {tier}
    </span>
  );
}

function SourceNote({ children }) {
  return <div style={{ fontSize: 13, color: "#6b7280", marginTop: 6 }}>{children}</div>;
}

function SimpleBarChart({ data, series, yLabel, height = 300, valueFormatter }) {
  return (
    <div style={{ width: "100%", height }}>

          <Legend wrapperStyle={{ fontSize: 12 }} />

/* ---------------------------------------------------------------------------
   Interpretation prompt (chart-attached, two per chart, gated reveal)
--------------------------------------------------------------------------- */
let uidCounter = 0;
function InterpretationPrompt({ id, kind, prompt, authored, minLen = 15 }) {
  const [text, setText] = useState("");
  const [submitted, setSubmitted] = useState(false);
  return (
    <div style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 16, marginTop: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#2563eb", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>
        {kind}
      </div>
      <div style={{ marginBottom: 10 }}>{prompt}</div>
      {!submitted && (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={3}
            style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontFamily: "inherit", fontSize: 14 }}
            placeholder={`Write your answer (min ${minLen} characters)...`}
          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
            <span style={{ fontSize: 12, color: "#9ca3af" }}>
              {text.length < minLen ? `Enter at least ${minLen} characters to enable Submit (${text.length}/${minLen})` : "Ready to submit"}
            </span>
            <button
              disabled={text.length < minLen}
              onClick={() => setSubmitted(true)}
              style={btnStyle(text.length < minLen)}
            >
              Submit
            </button>
          </div>
        </>
      )}
      {submitted && (
        <>
          <div style={{ background: "#f9fafb", borderRadius: 6, padding: 10, marginBottom: 8, fontSize: 14 }}>
            <strong>Your answer:</strong> {text}
          </div>
          <div style={{ background: "#eff6ff", borderRadius: 6, padding: 10, fontSize: 14 }}>
            <strong>Compare your answer to the authored one:</strong> {authored}
          </div>
        </>
      )}
    </div>
  );
}

function btnStyle(disabled) {
  return {
    background: disabled ? "#e5e7eb" : "#111827",
    color: disabled ? "#9ca3af" : "#fff",
    border: "none",
    borderRadius: 6,
    padding: "8px 16px",
    fontSize: 14,
    cursor: disabled ? "not-allowed" : "pointer",
  };
}

/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */

        <div style={{ marginTop: 10, fontSize: 13, color: "#6b7280", fontStyle: "italic" }}>

            <div style={{ marginTop: 6 }}>
              <input
                value={magText}
                onChange={(e) => setMagText(e.target.value)}
                placeholder="Your quick prediction..."
                style={{ padding: 6, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 13, width: "60%" }}
              />
              <button style={{ ...btnStyle(false), marginLeft: 8, padding: "6px 12px" }} onClick={() => setMagSubmitted(true)}>
                Lock it in
              </button>
            </div>
          ) : (
            <div style={{ marginTop: 6 }}>Locked in: “{magText || "(no prediction entered)"}” — now compare it against the data above.</div>
          )}

      <InterpretationPrompt {...q2} />

}

/* ---------------------------------------------------------------------------
   Multiple choice (also used for T-A / T-B / T-H critical reasoning)
--------------------------------------------------------------------------- */
function MCQ({ id, subFormLabel, prompt, options, correctIndex, explanations, whereGeneralizes, style }) {
  const ctx = useAppCtx();
  const [selected, setSelected] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [attempt, setAttempt] = useState(1);
  const [showScaffold, setShowScaffold] = useState(false);
  const isCorrect = selected === correctIndex;

  function submit() {
    setSubmitted(true);
    if (!ctx.answered.current[id]) {
      ctx.registerAnswer(id, { correct: isCorrect, type: subFormLabel ? "T-H" : "MCQ" });
    }
  }
  function tryAgain() {
    setAttempt(attempt + 1);
    setShowScaffold(true);
    setSubmitted(false);
    setSelected(null);
  }

  const cardStyle = style || {};
  return (
    <div style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 18, margin: "18px 0", ...cardStyle }}>
      {subFormLabel && (
        <div style={{ fontSize: 11, fontWeight: 700, color: "#7c3aed", textTransform: "uppercase", marginBottom: 6 }}>
          Critical reasoning — {subFormLabel}
        </div>
      )}
      <div style={{ marginBottom: 12, fontWeight: 500 }}>{prompt}</div>
      {showScaffold && !submitted && attempt === 2 && (
        <div style={{ background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: 12, marginBottom: 12, fontSize: 14 }}>
          <strong>Hint before you try again:</strong> {explanations.scaffold}
        </div>
      )}
      <div style={{ display: "grid", gap: 8 }}>
        {options.map((opt, i) => {
          let bg = "#fff", border = "#d1d5db";
          if (submitted) {
            if (i === correctIndex) { bg = "#ecfdf5"; border = "#10b981"; }
            else if (i === selected) { bg = "#fef2f2"; border = "#f87171"; }
          } else if (selected === i) { border = "#111827"; }
          return (
            <div
              key={i}
              onClick={() => !submitted && setSelected(i)}
              style={{ border: `1px solid ${border}`, background: bg, borderRadius: 8, padding: "10px 12px", cursor: submitted ? "default" : "pointer", fontSize: 14 }}
            >
              <strong>{String.fromCharCode(65 + i)}.</strong> {opt}
            </div>
          );
        })}
      </div>
      {!submitted && (
        <div style={{ marginTop: 12 }}>
          <button disabled={selected === null} onClick={submit} style={btnStyle(selected === null)}>
            Submit
          </button>
        </div>
      )}
      {submitted && (
        <div style={{ marginTop: 14 }}>
          <div style={{ fontWeight: 600, marginBottom: 6, color: isCorrect ? "#065f46" : "#991b1b" }}>
            {isCorrect
              ? `Correct — this reasoning pattern generalizes to ${whereGeneralizes}.`
              : `Incorrect — this is ${explanations.reasoningError[selected]}`}
          </div>
          <div style={{ fontSize: 14, marginBottom: 8 }}>{explanations.correct}</div>
          <div style={{ fontSize: 13, color: "#6b7280" }}>
            <strong>Where this generalizes:</strong> {whereGeneralizes}
          </div>
          {!isCorrect && attempt === 1 && (
            <button style={{ ...btnStyle(false), marginTop: 12 }} onClick={tryAgain}>
              Try again
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   True/False with justification (T-G)
--------------------------------------------------------------------------- */
function TrueFalseQ({ id, prompt, correctAnswer, authoredJustification, reasoningErrorIfWrong }) {
  const ctx = useAppCtx();
  const [choice, setChoice] = useState(null);
  const [justification, setJustification] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const isCorrect = choice === correctAnswer;
  const canSubmit = choice !== null && justification.length >= 15;

  function submit() {
    setSubmitted(true);
    if (!ctx.answered.current[id]) ctx.registerAnswer(id, { correct: isCorrect, type: "T-G" });
  }

  return (
    <div style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 18, margin: "18px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#0891b2", textTransform: "uppercase", marginBottom: 6 }}>
        True / False — justification required
      </div>
      <div style={{ marginBottom: 12 }}>{prompt}</div>
      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
        {[true, false].map((v) => {
          let bg = "#fff", border = "#d1d5db";
          if (submitted) {
            if (v === correctAnswer) { bg = "#ecfdf5"; border = "#10b981"; }
            else if (v === choice) { bg = "#fef2f2"; border = "#f87171"; }
          } else if (choice === v) border = "#111827";
          return (
            <div
              key={String(v)}
              onClick={() => !submitted && setChoice(v)}
              style={{ flex: 1, textAlign: "center", border: `1px solid ${border}`, background: bg, borderRadius: 8, padding: "12px", cursor: submitted ? "default" : "pointer", fontWeight: 600 }}
            >
              {v ? "True" : "False"}
            </div>
          );
        })}
      </div>
      {!submitted && (
        <>
          <textarea
            value={justification}
            onChange={(e) => setJustification(e.target.value)}
            rows={2}
            placeholder="Justify your answer in one sentence, naming the specific evidence (min 15 characters)..."
            style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14 }}
          />
          <div style={{ marginTop: 8 }}>
            <button disabled={!canSubmit} onClick={submit} style={btnStyle(!canSubmit)}>
              Submit
            </button>
            <span style={{ marginLeft: 10, fontSize: 12, color: "#9ca3af" }}>
              {choice === null ? "Select True or False, and " : ""}justification needs {Math.max(0, 15 - justification.length)} more characters
            </span>
          </div>
        </>
      )}
      {submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontWeight: 600, color: isCorrect ? "#065f46" : "#991b1b", marginBottom: 6 }}>
            {isCorrect ? "Correct." : `Incorrect — this is ${reasoningErrorIfWrong}`}
          </div>
          <div style={{ background: "#f9fafb", borderRadius: 6, padding: 10, fontSize: 14, marginBottom: 8 }}>
            <strong>Your justification:</strong> {justification}
          </div>
          <div style={{ background: "#eff6ff", borderRadius: 6, padding: 10, fontSize: 14 }}>
            <strong>Authored justification:</strong> {authoredJustification}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Fermi / numeric estimation (T-D)
--------------------------------------------------------------------------- */
function FermiQ({ id, prompt, tolerance, unit, correctValue, scaffold, decomposition, bounds, mostSensitive, openEnded }) {
  const ctx = useAppCtx();
  const [value, setValue] = useState("");
  const [decompText, setDecompText] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const num = parseFloat(value);
  const withinTol = !isNaN(num) && Math.abs(num - correctValue) / correctValue <= tolerance;
  const canSubmit = value !== "" && !isNaN(num) && (!openEnded || decompText.length >= 15);

  function submit() {
    setSubmitted(true);
    if (!ctx.answered.current[id]) ctx.registerAnswer(id, { correct: withinTol, type: "T-D", signedError: (num - correctValue) / correctValue });
  }

  return (
    <div style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 18, margin: "18px 0" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#b45309", textTransform: "uppercase", marginBottom: 6 }}>
        Engineering estimation (Fermi) {openEnded ? "— open-ended" : "— scaffolded"}
      </div>
      <div style={{ marginBottom: 8 }}>{prompt}</div>
      <div style={{ fontSize: 13, color: "#6b7280", marginBottom: 10 }}>
        Tolerance: within {Math.round(tolerance * 100)}% counts as correct ({tolerance <= 0.15 ? "tight arithmetic band, since the inputs are cited facts" : "order-of-magnitude Fermi band"}).
      </div>
      {openEnded && !submitted && (
        <textarea
          value={decompText}
          onChange={(e) => setDecompText(e.target.value)}
          rows={2}
          placeholder="First, name your decomposition path (e.g., X per Y × Z = ...) before entering a number..."
          style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14, marginBottom: 8 }}
        />
      )}
      {!submitted && (
        <>
          <input
            type="number"
            value={value}
            onChange={(e) => setValue(e.target.value)}
            placeholder={`Your estimate (${unit})`}
            style={{ padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14, width: 220 }}
          />
          <div style={{ marginTop: 8 }}>
            <button disabled={!canSubmit} onClick={submit} style={btnStyle(!canSubmit)}>
              Submit
            </button>
            {openEnded && decompText.length < 15 && <span style={{ marginLeft: 10, fontSize: 12, color: "#9ca3af" }}>Name your decomposition path first ({decompText.length}/15 chars)</span>}
          </div>
        </>
      )}
      {submitted && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontWeight: 600, color: withinTol ? "#065f46" : "#991b1b", marginBottom: 8 }}>
            {withinTol ? "Within tolerance — correct." : "Outside tolerance — this is extrapolating without checking the anchor facts first."}
          </div>
          <div style={{ fontSize: 14, marginBottom: 6 }}>
            Your estimate: <strong>{value} {unit}</strong> — Actual: <strong>{correctValue.toLocaleString()} {unit}</strong>
          </div>
          <div style={{ background: "#f9fafb", borderRadius: 6, padding: 12, fontSize: 14 }}>
            <div style={{ marginBottom: 6 }}><strong>Decomposition path:</strong> {decomposition}</div>
            <div style={{ marginBottom: 6 }}><strong>Bounds:</strong> {bounds}</div>
            <div><strong>Most sensitive assumption:</strong> {mostSensitive}</div>
          </div>
          {Math.abs(num - correctValue) / correctValue > 3 && (
            <div style={{ background: "#fffbeb", border: "1px solid #fde68a", borderRadius: 8, padding: 12, marginTop: 10, fontSize: 14 }}>
              You were off by more than 3x — the most likely misjudged factor is: {mostSensitive}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PrincipleGate({ authored }) {

  return (
    <div style={{ background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 10, padding: 16, margin: "22px 0" }}>
      <div style={{ fontWeight: 600, marginBottom: 8 }}>Principle in one sentence</div>
      <div style={{ fontSize: 14, marginBottom: 10, color: "#4b5563" }}>
        In one sentence, state the transferable principle from this section — something a PM or CTO at a different company could apply tomorrow. (Not scored — an encouraged step, not a requirement to continue.)
      </div>
      {!submitted ? (
        <>
          <textarea

/* ---------------------------------------------------------------------------
   Pattern transfer (T-F) — free text, self-eval checklist
--------------------------------------------------------------------------- */
function PatternTransfer({ id, prompt, minLen = 50 }) {
  const ctx = useAppCtx();
  const [text, setText] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [checks, setChecks] = useState([false, false, false]);

  function submit() {
    setSubmitted(true);
    if (ctx && !ctx.answered.current[id]) ctx.registerAnswer(id, { correct: null, type: "T-F", skipped: false });
  }

  return (
    <div style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 18, margin: "18px 0", background: "#fafafa" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#be185d", textTransform: "uppercase", marginBottom: 6 }}>
        Pattern transfer (highest-order question)
      </div>
      <div style={{ marginBottom: 10 }}>{prompt}</div>
      {!submitted ? (
        <>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={4}
            style={{ width: "100%", boxSizing: "border-box", padding: 8, borderRadius: 6, border: "1px solid #d1d5db", fontSize: 14 }}
            placeholder={`Minimum ${minLen} characters — name the principle, apply it non-trivially, and name a new failure mode...`}
          />
          <div style={{ marginTop: 8 }}>
            <button disabled={text.length < minLen} onClick={submit} style={btnStyle(text.length < minLen)}>
              Submit
            </button>
            <span style={{ marginLeft: 10, fontSize: 12, color: "#9ca3af" }}>{text.length}/{minLen} characters</span>
          </div>
        </>
      ) : (
        <>
          <div style={{ background: "#fff", borderRadius: 6, padding: 10, marginBottom: 10, fontSize: 14 }}>
            <strong>Your answer:</strong> {text}
          </div>
          <div style={{ fontWeight: 600, marginBottom: 8 }}>Self-evaluation checklist</div>
          {[
            "Did I name the principle accurately?",
            "Is my application genuinely different from the original case (not just a re-labeling)?",
            "Is my failure mode new — not one already covered in this article?",
          ].map((c, i) => (
            <label key={i} style={{ display: "block", fontSize: 14, marginBottom: 6 }}>
              <input
                type="checkbox"
                checked={checks[i]}
                onChange={() => setChecks(checks.map((v, idx) => (idx === i ? !v : v)))}
                style={{ marginRight: 8 }}
              />
              {c}
            </label>
          ))}
        </>
      )}
    </div>
  );
}

function IntroSection() {
  return (
    <section id="intro" style={{ marginBottom: 48 }}>
      <div style={{ fontSize: 18, lineHeight: 1.7, fontWeight: 500, marginBottom: 24, borderLeft: "3px solid #2563eb", paddingLeft: 16 }}>
        In an AI answer engine, the retrieval system is the product. The language model on top is a thin, swappable layer — what a user actually experiences as “quality,” “speed,” and “trustworthy answers” is decided almost entirely by the search infrastructure built long before a single token gets generated.
      </div>
      <h2>Introduction</h2>
      <p>
        Perplexity is the clearest evidence for this principle, because the company has published its own account of the decision. In September 2025, Perplexity's research team explained why it stopped renting search APIs and built its own retrieval engine, and it benchmarked the result directly against three named competitors (Perplexity Research, Sept 2025). That is a rare thing in this industry: a company showing its work on why architecture, not model choice, won it the lead. Most "AI search" write-ups describe the chatbot on top; this one is about the plumbing underneath, because the plumbing is what actually decided the outcome.
      </p>
      <p>
        The company was founded in 2022 and by September 2025 was processing 200 million queries a day against a self-built index of more than 200 billion unique URLs (Perplexity Research, Sept 2025). Its valuation reached $20 billion that same month, after a $200 million raise, with annualized revenue approaching $200 million (TechCrunch, 2025). Yet in its earliest days, Perplexity paid a leading commercial search API roughly $200 for every 1,000 queries it sent — pricing pulled from an archived 2023 Bing API rate card that Perplexity's own engineers cite as the reason renting stopped being viable (Perplexity Research, Sept 2025). At any real scale, that price made owning retrieval a matter of survival, not preference.
      </p>
      <p>
        The gap Perplexity found in rented search APIs was structural, not just expensive. Those APIs were built for a world where a human clicks a blue link, so they returned whole documents, not the short, precise passages a language model actually needs; they were also either stale (cheap, static indexes) or slow (real-time scraping of another engine's results), and the industry had split into systems that were good at keyword matching or good at semantic matching, never both at once (Perplexity Research, Sept 2025). Building one system that was fresh, fast, and both lexically and semantically precise was the actual engineering problem — and it is the same problem any AI-native retrieval product has to solve today.
      </p>
      <p>
        This article addresses three questions. First, what actually runs when a user asks Perplexity something — what is the real retrieval and ranking architecture behind the answer box? Second, what product decisions — inline citations, passage-level results, a public Search API — followed from that architecture, and where did those decisions create new risk? Third, how does Perplexity manage the economics of an AI answer at scale, and what does its own pricing reveal about where the real cost sits?
      </p>
    </section>
  );
}

function LandscapeSection() {
  return (
    <section id="landscape" style={{ marginBottom: 48 }}>
      <h2>Technical and Product Landscape</h2>
      <p>
        Before large language models, web search optimized for one thing: ranking whole documents so a human would click the best one. An AI answer engine has a different job. It has to hand a language model a small number of the most relevant passages, because the model's context window is limited and its accuracy degrades when that window fills with irrelevant text. That shift — from ranking documents for a human to curating passages for a model — is why Perplexity treats "individual sections and spans of documents as first-class units in their own right," not just an implementation detail of an old search stack (Perplexity Research, Sept 2025).
      </p>
      <p>
        Perplexity benchmarked its own Search API directly against three categories of alternative: Exa, a semantic-search-first API; Brave, a general web search API; and a representative SERP-scraping API (using Tavily as the stand-in), which works by scraping Google's own search results pages (Perplexity Research, Sept 2025). All three represent real paths other teams take when they don't want to build retrieval in-house, and the chart below shows Perplexity's own reported comparison across all four systems.
      </p>
      <p>
        The two charts below are Perplexity's own self-reported benchmark, published alongside an open-source evaluation framework called <em>search_evals</em> so outside teams could reproduce it (Perplexity Research, Sept 2025). That transparency is worth noting explicitly: these are not independently audited numbers from a neutral third party, they are the vendor's own measurements — a normal and useful data point, but one that should be read as "here is what we measured and how," not as an independently verified ranking.
      </p>
      <ChartBlock

        sourceNote="Perplexity Research, 'Architecting and Evaluating an AI-First Search API,' Sept 25, 2025 — requests initiated from AWS us-east-1."

        magnitudeAsk="which provider do you expect crosses the 1-second mark first, and at which percentile?"
        q1={{
          id: "chart1-q1",
          kind: "So-what / decision implication",
          prompt:
            "A common UX rule of thumb treats about 1,000ms as the point where a response stops feeling instant. Looking at the p90 column (604ms Perplexity, 1,798ms Exa, 728ms Brave, 1,743ms SERP-based), which of these four backends would you rule out for a synchronous, non-streaming AI search feature, and what decision rule are you applying?",
          authored:
            "Rule out Exa and SERP-based — both are already past 1,000ms at the 90th percentile (1,798ms and 1,743ms), so roughly 1 in 10 real queries would feel like a stall rather than a wait. Perplexity (604ms) and Brave (728ms) both stay under that line even at p90. The decision rule: judge a backend by its p90 or p95, not its median, because the median hides exactly how often real users hit the slow tail.",
        }}
        q2={{
          id: "chart1-q2",
          kind: "Quantitative reasoning",
          prompt:
            "Perplexity's p95 (763ms) is 2.13x its own p50 (358ms). Exa's p95 (2,188ms) is only 1.59x its own p50 (1,375ms). Which system has the more predictable tail, and what does a smaller p95/p50 multiple — despite much higher absolute latency — suggest about where that system spends its time?",
          authored:
            "Exa has the more predictable, tighter tail (1.59x) even though it is far slower in absolute terms (2.13x for Perplexity). A small multiple suggests Exa's latency is dominated by a fixed, roughly constant cost — such as a steady external model or network call — rather than variable work that balloons on harder queries. Perplexity's larger multiple suggests the opposite: its multi-stage ranking pipeline (Section 1) adds proportionally more time exactly when a query is hard enough to reach the expensive reranking stage. Absolute speed and tail predictability are two different engineering properties, and a system can win one while losing the other.",
        }}
      />
      <ChartBlock
        title="Search quality benchmark scores, four providers"
        tier="FACT"
        sourceNote="Perplexity Research, Sept 25, 2025 — SimpleQA and FRAMES test single-step search; BrowseComp and HLE (Humanity's Last Exam) test deep, multi-step research."

        q1={{

          kind: "Qualitative / mechanism",

          authored:
            "A large, high-completeness index (200 billion-plus URLs, hybrid lexical-plus-semantic retrieval) helps most when the task is finding one needle in a huge haystack — that's exactly what SimpleQA and expert-style HLE questions reward. FRAMES needs the model to correctly stitch several retrieved passages into one coherent multi-hop answer; once the right passages are found, the bottleneck shifts from retrieval completeness to the generation model's own reasoning — a Sonar-model capability, not a retrieval-layer one. A better index cannot buy back a multi-hop reasoning gap the way it buys back a needle-in-haystack gap.",
        }}
        q2={{
          id: "chart2-q2",
          kind: "Causal / comparative",
          prompt:
            "The SERP-based approach (scraping Google's results) scores second-best on three of the four benchmarks, despite Perplexity's own engineering post calling SERP-scraping 'unacceptably high latency' (1,342ms median, see the chart above). What does this strong-quality-but-slow profile suggest about whether quality and latency come from the same design choice, or two separate ones?",
          authored:
            "They are separable. SERP-based quality is largely inherited for free from decades of Google's own human-tuned ranking work, so a scraper can piggyback on that quality without having built any ranking system itself. But scraping a third party's rendered results page is inherently latency-bound by network hops and page-render overhead that has nothing to do with ranking quality. A team chasing 'our answers are wrong' and a team chasing 'our answers are slow' are solving genuinely different engineering problems, even when one competitor happens to score well on one and poorly on the other.",
        }}

          { term: "p50 / p90 / p95 (percentile latency)", def: "The response time that this percentage of requests finishes within; p95 of 763ms means 95 out of 100 requests finished in 763ms or less." },
          { term: "Benchmark (SimpleQA, FRAMES, BrowseComp, HLE)", def: "A standardized test used to compare AI systems on a specific skill, such as looking up one fact (SimpleQA) or multi-step research (BrowseComp)." },
        ]}
      />
    </section>
